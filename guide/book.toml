[book]
title = "Tonk Guide"
description = "How to build user interfaces in Tonk with concepts, views, and rules."
authors = ["Tonk"]
language = "en"
src = "src"

[preprocessor.mermaid]
command = "mdbook-mermaid"
# Don't fail the build/serve if mdbook-mermaid is missing or version-skewed;
# diagrams just won't pre-render. Keeps `dev:web` alive regardless.
optional = true

[output.html]
additional-js = ["mermaid.min.js", "mermaid-init.js"]

# The local development server mounts the guide at /guide/, so site-relative
# links (search, print, assets) must resolve under that prefix.
site-url = "/guide/"
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/tonk-labs/tonk"
edit-url-template = "https://github.com/tonk-labs/tonk/edit/main/guide/{path}"

[output.html.search]
enable = true

[output.html.fold]
enable = true
level = 1
