[package]
name = "tonk-guest"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Sealed-iframe guest element runtime — registration-only, no worker/engine."
license.workspace = true

# The sealed guest's element-registration runtime. It depends ONLY on the
# custom-element crates, deliberately NOT on tonk-ui or tonk-worker, so the
# guest wasm carries the view runtime without the service worker / query
# engine (which live across the iframe boundary).
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "guest"
path = "src/bin/guest.rs"

[dependencies]
console_error_panic_hook = { workspace = true }
tonk-display = { workspace = true }
tonk-board = { workspace = true }
tonk-fab = { workspace = true }
tonk-workspace = { workspace = true }
tonk-tree = { workspace = true }
tonk-inspector = { workspace = true }
tonk-portal = { workspace = true }
# The real host IO surface the guest installs (`install_io`); its fetch/SSE
# transport rides the portal bootstrap's `window.fetch` relay.
tonk-host = { workspace = true }
tonk-sigil = { workspace = true, features = ["web"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
custom-elements = { workspace = true }
# Union of web-sys features the element crates under-declare (they
# free-ride on features tonk-ui enables in the normal build; built
# standalone the guest must supply them).
web-sys = { workspace = true, features = [
  "console",
  "Document",
  "Element",
  "HtmlAnchorElement",
  "HtmlElement",
  "HtmlHeadElement",
  "Window",
  "CustomEvent",
  "CustomEventInit",
  "Event",
  "EventTarget",
  "MouseEvent",
  "CustomElementRegistry",
  "Response",
  "Blob",
  "Url",
  # Tests build anchors in a detached DOM and dispatch real mouse events at
  # them, which needs the init dicts and `Node` (to nest a child in an anchor).
  "EventInit",
  "MouseEventInit",
  "Node",
] }

[dev-dependencies]
dialog-common = { workspace = true, features = ["helpers"] }
wasm-bindgen-test = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(dialog_test_native_integration)",
  "cfg(dialog_test_wasm_integration)",
  'cfg(feature, values("web-integration-tests"))',
] }
