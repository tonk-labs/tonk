[package]
name = "tonk-workspace"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Viewer workspace custom elements."
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Canonical sync-state enum. A base (all-target) dep so the pure
# state-chip mapping is unit-tested natively; the DOM elements that
# consume it are wasm-only.
tonk-schema = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
custom-elements = { workspace = true }
js-sys = { workspace = true }
serde_json = { workspace = true }
tonk-common = { workspace = true }
tonk-host = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
  "CssStyleDeclaration",
  "CustomElementRegistry",
  "CustomEvent",
  "CustomEventInit",
  "Document",
  "DomTokenList",
  "Element",
  "Event",
  "Clipboard",
  "ClipboardItem",
  "Headers",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "Location",
  "Navigator",
  "MutationObserver",
  "MutationObserverInit",
  "MutationRecord",
  "Node",
  "NodeList",
  "Request",
  "RequestInit",
  "Response",
  "Storage",
  "Window",
] }

[dev-dependencies]
dialog-common = { workspace = true, features = ["helpers"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(dialog_test_native_integration)",
  "cfg(dialog_test_wasm_integration)",
  'cfg(feature, values("web-integration-tests"))',
] }
