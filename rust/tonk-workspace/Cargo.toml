[package]
name = "tonk-workspace"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Viewer workspace custom elements."
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Canonical sync-state enum. A base (all-target) dep so the pure
# state-chip mapping is unit-tested natively; the DOM elements that
# consume it are wasm-only.
tonk-schema = { workspace = true }
# serde + serde_json: the pure sync-state mapping is parsed and
# unit-tested natively, so these are base (all-target) deps.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
custom-elements = { workspace = true }
js-sys = { workspace = true }
tonk-common = { workspace = true }
tonk-host = { workspace = true }
tonk-worker-api = { workspace = true }
bs58 = { workspace = true }
reqwest = { workspace = true }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
  "Attr",
  "CssStyleDeclaration",
  "CustomElementRegistry",
  "CustomEvent",
  "CustomEventInit",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "Event",
  "EventInit",
  "Clipboard",
  "ClipboardItem",
  "Headers",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "KeyboardEventInit",
  "Location",
  "MediaQueryList",
  "Navigator",
  "MutationObserver",
  "MutationObserverInit",
  "MutationRecord",
  "NamedNodeMap",
  "Node",
  "NodeList",
  "AddEventListenerOptions",
  "Request",
  "RequestInit",
  "Response",
  "Storage",
  "Url",
  "UrlSearchParams",
  "Window",
] }

[dev-dependencies]
dialog-common = { workspace = true, features = ["helpers"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
tonk-fab = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(dialog_test_native_integration)",
  "cfg(dialog_test_wasm_integration)",
  'cfg(feature, values("web-integration-tests"))',
] }
