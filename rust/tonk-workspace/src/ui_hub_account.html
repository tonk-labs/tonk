<button
  class="hcell hc-acct account-trigger"
  type="button"
  data-account-trigger
  aria-haspopup="menu"
  aria-expanded="false"
  aria-controls="hub-account-menu"
>
  <span data-account-label>account</span><span class="g" aria-hidden="true">&#9662;</span>
</button>

<div id="hub-account-menu" class="account-menu chrome" data-account-menu role="menu" hidden>
  <div class="account-menu__profiles" data-profile-list aria-label="accounts on this browser"></div>
  <button type="button" class="account-menu__row" data-open-settings role="menuitem">
    settings<span aria-hidden="true">&#9656;</span>
  </button>
  <button type="button" class="account-menu__row" data-add-profile role="menuitem">
    add account<span aria-hidden="true">+</span>
  </button>
  <div class="account-menu__error" data-account-error role="status" hidden></div>
</div>

<div class="hub-settings" data-settings-overlay hidden>
  <button
    class="hub-settings__scrim"
    type="button"
    data-settings-scrim
    aria-label="close settings"
    tabindex="-1"
  ></button>
  <section
    class="hub-settings__dialog chrome"
    data-settings-dialog
    role="dialog"
    aria-modal="true"
    aria-labelledby="hub-settings-title"
  >
    <header class="hub-settings__header">
      <h2 id="hub-settings-title">settings</h2>
      <button type="button" class="hub-settings__close" data-settings-close aria-label="close settings">
        &#215;
      </button>
    </header>

    <div class="hub-settings__layout">
      <nav class="hub-settings__rail" aria-label="settings sections" role="tablist">
        <button
          type="button"
          data-settings-tab="account"
          role="tab"
          aria-selected="true"
          aria-controls="hub-settings-account"
        >account</button>
        <button
          type="button"
          data-settings-tab="devices"
          role="tab"
          aria-selected="false"
          aria-controls="hub-settings-devices"
        >devices</button>
      </nav>

      <div class="hub-settings__body">
        <section
          id="hub-settings-account"
          class="hub-settings__pane"
          data-settings-pane="account"
          role="tabpanel"
        >
          <h3>account</h3>
          <div data-local-profile hidden>
            <p>Not signed in on this profile</p>
            <button type="button" data-account-handoff>create account or log in</button>
          </div>
          <div data-attached-account>
            <label class="account-field">
              <span>display name</span>
              <input
                id="display-name"
                name="display-name"
                type="text"
                data-display-name
                autocomplete="name"
              />
            </label>
            <div class="hub-settings__error" data-display-name-error role="status" hidden></div>
            <dl class="account-facts">
              <div><dt>account email</dt><dd data-account-email>Loading…</dd></div>
              <div><dt>passkey created</dt><dd data-passkey-created>Loading…</dd></div>
              <div><dt>created on</dt><dd data-passkey-created-on>Loading…</dd></div>
            </dl>
            <div class="hub-settings__error" data-account-summary-error role="status" hidden></div>
            <button type="button" class="hub-settings__action" data-account-handoff>
              manage passkeys and account
            </button>
          </div>
        </section>

        <section
          id="hub-settings-devices"
          class="hub-settings__pane"
          data-settings-pane="devices"
          role="tabpanel"
          hidden
        >
          <h3>devices</h3>
          <div data-local-devices hidden>
            <p>Sign in to see devices attached to this account.</p>
            <button type="button" data-account-handoff>create account or log in</button>
          </div>
          <div data-attached-devices>
            <div data-device-list aria-live="polite">Loading…</div>
            <div class="hub-settings__error" data-devices-error role="status" hidden></div>
          </div>
        </section>
      </div>
    </div>
  </section>
</div>
