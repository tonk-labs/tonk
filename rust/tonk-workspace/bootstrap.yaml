# The title is set once via `trip-title` against the itinerary
# entity. Each stop is then added by its own `trip!` assertion
# against the same entity - `stop` is cardinality-many and a field
# value can't be a list, so the stops accumulate one assertion at a
# time. No field is ever repeated.
trip-title!:
  this: id:tonk-workspace/itinerary
  title: "Trip to Pistoia"

trip!:
  this: id:tonk-workspace/itinerary
  stop: id:tonk-workspace/stop/arrive

trip!:
  this: id:tonk-workspace/itinerary
  stop: id:tonk-workspace/stop/lunch

trip!:
  this: id:tonk-workspace/itinerary
  stop: id:tonk-workspace/stop/walk

trip!:
  this: id:tonk-workspace/itinerary
  stop: id:tonk-workspace/stop/cathedral

trip!:
  this: id:tonk-workspace/itinerary
  stop: id:tonk-workspace/stop/chapel

trip!:
  this: id:tonk-workspace/itinerary
  stop: id:tonk-workspace/stop/collodi

trip!:
  this: id:tonk-workspace/itinerary
  stop: id:tonk-workspace/stop/zoo


artifact!:
  title: "Itinerary"
  icon: "sheet"
  entity: id:tonk-workspace/itinerary
  model: trip
  view: id:tonk-workspace/trip-view
