name = "tonk-mcp-worker-local"
main = "entry.mjs"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Built with `scripts/bundle.sh` and `worker-build --release` beforehand
# (see README.md): the entry puts the space's kernel, bundled ahead of time,
# where the Rust module finds it, and loads what worker-build made.

# The kernel's modules, compiled ahead of time: a Worker compiles none at run
# time. The component itself is bytes, which the polyfill reads.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.component"]
fallthrough = true

# One space writer per space and MCP session: the only place revisions for
# that pair are signed. The object keeps nothing durable; its peer and
# caches live in memory, and the access service holds the space.
[[durable_objects.bindings]]
name = "SPACE_WRITER"
class_name = "SpaceWriterObject"

[[migrations]]
tag = "v1-space-writer"
new_sqlite_classes = ["SpaceWriterObject"]

[vars]
# The access service the writers sync with (`tonk-access-local` locally);
# the peer syncs at /ucan/.
ACCESS_SERVICE_URL = "http://127.0.0.1:8787"

# Also needs the secret MCP_SESSION_SECRET (any high-entropy string), the
# key `Mcp-Session-Id`s are MAC'd under: `wrangler secret put`, or
# `--var MCP_SESSION_SECRET:<anything>` under `wrangler dev`.

[observability]
enabled = true
head_sampling_rate = 1
