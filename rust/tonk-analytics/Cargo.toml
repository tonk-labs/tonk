[package]
name = "tonk-analytics"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
description = "Shared PostHog event vocabulary and capture clients for the Tonk web app and CLI"
license = { workspace = true }

[dependencies]
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2_0_10 = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
dialog-common = { workspace = true, features = ["helpers"] }
wasm-bindgen-test = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "time"
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(dialog_test_native_integration)",
  "cfg(dialog_test_wasm_integration)",
  'cfg(feature, values("web-integration-tests"))',
] }
