[package]
name = "tonk-tree"
description = "<tonk-tree> custom element — inspects the dialog-search-tree index behind a branch."
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
web = []

[dependencies]
custom-elements = { workspace = true }
js-sys = { workspace = true }
tonk-host = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "console",
    "CustomElementRegistry",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "Headers",
    "HtmlElement",
    "Location",
    "Node",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "ShadowRoot",
    "ShadowRootInit",
    "ShadowRootMode",
    "Window",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(dialog_test_native_integration)',
    'cfg(dialog_test_wasm_integration)',
] }
