[package]
name = "tonk-account"
description = "Shared account repository contracts and lifecycle primitives"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(dialog_test_native_integration)",
    "cfg(dialog_test_wasm_integration)",
    'cfg(feature, values("web-integration-tests"))',
] }

[dependencies]
blake3 = { workspace = true }
dialog-artifacts = { workspace = true }
dialog-capability = { workspace = true }
dialog-common = { workspace = true }
dialog-credentials = { workspace = true }
dialog-effects = { workspace = true }
dialog-peer = { workspace = true }
dialog-repository = { workspace = true }
dialog-storage = { workspace = true }
dialog-ucan = { workspace = true }
dialog-ucan-core = { workspace = true }
dialog-varsig = { workspace = true }
hex = { workspace = true }
# A ticket claim is one POST to the space's access service.
reqwest = { workspace = true }
ipld-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
dialog-remote-ucan = { workspace = true }
dialog-peer = { workspace = true, features = ["helpers"] }
dialog-storage = { workspace = true, features = ["helpers"] }
tokio = { workspace = true, features = ["macros", "rt"] }
wasm-bindgen-test = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = { workspace = true }
