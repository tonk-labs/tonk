[package]
name = "tonk-view-peer"
description = "A shown MCP Apps view's peer: the space's own kernel over the view's key and delegations, in a browser Web Worker."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Not a workspace member, like `tonk-host-worker`: it builds only for
# wasm32, as a bundle of its own beside the hosted agent's views.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
dialog-credentials = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/ucan-relay-main" }
dialog-ucan-core = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/ucan-relay-main" }
dialog-varsig = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/ucan-relay-main" }
js-sys = "0.3"
serde_json = "1"
tonk-kernel-host = { path = "../tonk-kernel-host" }
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
