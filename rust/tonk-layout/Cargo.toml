[package]
name = "tonk-layout"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "<tonk-layout> custom element — a niri-style tiling window manager persisting its layout to the branch."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
custom-elements = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = { workspace = true }
serde_json = { workspace = true }
tonk-concept = { workspace = true }
tonk-schema = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "AbortController",
    "AbortSignal",
    "CssStyleDeclaration",
    "CustomElementRegistry",
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "Element",
    "Headers",
    "HtmlCollection",
    "HtmlElement",
    "Node",
    "NodeList",
    "Request",
    "RequestInit",
    "Response",
    "Text",
    "Window",
] }

[dev-dependencies]
dialog-common = { workspace = true, features = ["helpers"] }
tokio = { workspace = true, features = ["macros", "rt"] }
wasm-bindgen-test = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(dialog_test_native_integration)',
    'cfg(dialog_test_wasm_integration)',
    'cfg(feature, values("web-integration-tests"))',
] }
