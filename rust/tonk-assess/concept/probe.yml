tonk.assess:
  Probe:
    description: A test question for benchmarking agent knowledge retrieval
    with:
      persona:
        description: The persona whose knowledge is being tested
        as: Text
      tag:
        description: Arbitrary tags for filtering (e.g. lookup, synthesis, inference)
        as: Text
        cardinality: many
      prompt:
        description: The question sent to the agent
        as: Text
      judge:
        description: The judge used to score the agent's answer
        as: .Judge
    maybe:
      name:
        description: Optional human-readable name for this probe
        as: Text
      source-file:
        description: Path relative to persona artifacts where the answer can be found
        as: Text
        cardinality: many
      corpus:
        description: Relative path from probe directory to the corpus of files the agent can access
        as: Text
      allowed-tool:
        description: Tools the agent may use (e.g. Read, Glob, Grep, "Bash(git:*)")
        as: Text
        cardinality: many
      system-prompt:
        description: Relative path to a markdown file whose contents are appended as system prompt
        as: Text
      max-turns:
        description: Maximum number of agent turns
        as: Integer
      mcp-config:
        description: Path to an MCP server config JSON file
        as: Text
      carry-data:
        description: Relative path to a Carry data YAML file for EAV provisioning
        as: Text
      carry-model:
        description: Relative path to a Carry model YAML file for schema import
        as: Text
