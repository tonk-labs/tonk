[package]
name = "tonk-ui"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
helpers = [
    "dialog-common/helpers",
    "dep:thirtyfour",
    "dep:port_check",
    "dep:tonk-access-service",
]
integration-tests = ["helpers", "dialog-common/integration-tests", "tonk-worker/helpers"]
web-integration-tests = ["helpers", "dialog-common/integration-tests", "tonk-worker/helpers"]

[dependencies]
async-trait = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
console_error_panic_hook = { workspace = true }
custom-elements = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
js-sys = { workspace = true }
lsp-types = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
send_wrapper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
thiserror = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
bs58 = { workspace = true }
tonk-common = { workspace = true }
tonk-host = { workspace = true }
tonk-account = { workspace = true }
tonk-identity = { workspace = true }
tonk-portal = { workspace = true }
tonk-schema = { workspace = true }
tonk-worker = { workspace = true }
tonk-worker-api = { workspace = true }
tonk-analytics = { workspace = true }
url = { workspace = true }
dialog-common = { workspace = true, optional = true }
port_check = { workspace = true, optional = true }
thirtyfour = { workspace = true, optional = true }
tonk-access-service = { workspace = true, features = ["helpers"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = { workspace = true }

[dev-dependencies]
dialog-common = { workspace = true, features = [
    "helpers",
    "integration-tests",
] }
wasm-bindgen-test = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
anyhow = { workspace = true }
# The e2e callback listener is native-only, and axum pulls in mio, which
# does not compile for wasm32 — the web test build is a workspace-wide
# `cargo test --no-run`, so an ungated dev-dependency would reach it.
axum = { workspace = true, features = ["form", "http1", "tokio"] }
dialog-credentials = { workspace = true }
dialog-ucan-core = { workspace = true }
port_check = { workspace = true }
thirtyfour = { workspace = true }
tonk-access-service = { workspace = true, features = ["helpers"] }
tokio = { workspace = true, features = ["io-util", "process"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom_0_3 = { workspace = true }

[dependencies.web-sys]
workspace = true
features = [
    "BroadcastChannel",
    "css",
    "CustomEvent",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "HtmlButtonElement",
    "HtmlCollection",
    "HtmlDialogElement",
    "HtmlFormElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "History",
    "Clipboard",
    "KeyboardEvent",
    "KeyboardEventInit",
    "HtmlScriptElement",
    "Location",
    "MessageEvent",
    "Navigator",
    "Node",
    "Performance",
    "ServiceWorkerContainer",
    "Storage",
    "VisibilityState",
    "Window",
]

[lints.rust]
# The dialog_common::test macro uses cfg conditions that originate from the macro crate.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(dialog_test_native_integration)',
    'cfg(dialog_test_wasm_integration)',
    'cfg(feature, values("web-integration-tests"))',
] }
