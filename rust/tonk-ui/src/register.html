<div class="fabb-page">
  <header class="fabb-top"><!-- logotype --></header>
  <section class="fabb-task" aria-labelledby="tonk-register-head">
    <header class="fabb-task-head"><h1 class="fabb-task-title" id="tonk-register-head" tabindex="-1">add an account</h1></header>
    <div class="fabb-request">
      <span class="fabb-sr" id="tonk-register-announcement" role="status"></span>
      <div id="tonk-register-stack">
        <label class="fabb-field editing" id="tonk-register-email-row">
          <span class="k">email address</span>
          <input id="tonk-register-email" type="email" inputmode="email" enterkeyhint="go"
                 autocomplete="username webauthn" autocapitalize="none" spellcheck="false" maxlength="254" required>
        </label>
        <p id="tonk-register-new-note" hidden>No account uses this email yet.</p>
        <!-- Signing in with the account's recovery phrase instead of a
             passkey. The words locate the account themselves, so this path
             needs no email; they are read here, in the top document, and go
             to the worker as bytes. -->
        <label class="fabb-field editing" id="tonk-register-phrase-row" hidden>
          <span class="k">recovery phrase</span>
          <textarea id="tonk-register-phrase" rows="4" autocomplete="off" autocapitalize="none"
                    spellcheck="false" placeholder="your twelve words, in order"></textarea>
        </label>
      </div>
      <button type="button" class="fabb-inline-action" id="tonk-register-phrase-switch">use a recovery phrase instead</button>
      <div class="register-message" hidden>
        <h2 id="tonk-register-wait-title" hidden>check your email</h2>
        <p id="tonk-register-status" role="status"></p>
        <button type="button" class="fabb-inline-action" id="tonk-register-resend" hidden>send a new link</button>
      </div>
    </div>
    <div class="fabb-actions">
      <button type="button" id="tonk-register-dismiss">cancel</button>
      <button type="button" id="tonk-register-action" disabled hidden></button>
      <button type="button" id="tonk-register-phrase-login" hidden>sign in with recovery phrase</button>
    </div>
  </section>
</div>
