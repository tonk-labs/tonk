<main class="account">
  <div class="account__logo" role="img" aria-label="tonk"></div>
  <div class="account__ceremony">
    <section class="account__activation-state" aria-labelledby="email-invite-title">
      <h1 id="email-invite-title" class="account__ceremony-head">you’re invited to a space</h1>
      <div class="account__narrator">
        <p>Create an account or sign in using the email that received this invitation. Confirm your email, then return here to join the shared space.</p>
        <p>This invitation lasts seven days and only works for that email’s account.</p>
      </div>
      <button id="email-invite-account" class="account__run" type="button">Create Account or Sign In</button>
      <button id="email-invite-join" class="account__run" type="button">Join Space</button>
    </section>
    <p id="email-invite-status" class="account__working" role="status" aria-live="polite"></p>
  </div>
</main>
