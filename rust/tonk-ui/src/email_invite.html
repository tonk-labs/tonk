<div class="fabb-page">
  <header class="fabb-top"><!-- logotype --></header>
  <main class="fabb-task" aria-labelledby="email-invite-title" aria-describedby="email-invite-body">
    <header class="fabb-task-head"><h1 id="email-invite-title" class="fabb-task-title">join a space</h1></header>
    <div class="fabb-request">
      <dl class="fabb-ledger" id="email-invite-signed-in" hidden><dt>signed in as</dt><dd id="email-invite-email"></dd></dl>
      <div id="email-invite-body"><p>Checking your account…</p></div>
      <p id="email-invite-status" class="fabb-note" role="status"></p>
    </div>
    <div class="fabb-actions">
      <a id="email-invite-home" href="/">go to hub</a>
      <a id="email-invite-settings" href="/settings" hidden>account settings</a>
      <button id="email-invite-resend" type="button" hidden>send a new link</button>
      <button id="email-invite-account" type="button" hidden>add an account</button>
      <button id="email-invite-recheck" type="button" hidden>check again</button>
      <button id="email-invite-join" type="button" hidden>join space</button>
    </div>
  </main>
</div>
