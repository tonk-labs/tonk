<main class="account">
  <div class="account__logo" role="img" aria-label="tonk"></div>

  <div class="account__ceremony">
    <section id="activate-confirm" class="account__activation-state" aria-labelledby="activate-confirm-title" hidden>
      <div class="account__stack">
        <h1 id="activate-confirm-title" class="account__ceremony-head">activate your account</h1>
        <button id="activate-accept" class="account__run" type="button" aria-describedby="activate-terms activate-working activate-error">accept and activate</button>
      </div>
      <div class="account__narrator">
        <p id="activate-terms">Confirm your email address to activate syncing for your Tonk account. By selecting accept and activate, you agree to the <a href="https://tonk.xyz/legal/terms" target="_blank" rel="noopener noreferrer">terms of service</a>.</p>
      </div>
    </section>

    <section id="activate-done" class="account__activation-state" aria-labelledby="activate-done-title" hidden>
      <div class="account__stack">
        <h1 id="activate-done-title" class="account__ceremony-head">account verified</h1>
      </div>
      <div class="account__narrator">
        <p>You may close this tab. Return to the original tab where you started account setup.</p>
      </div>
    </section>

    <p id="activate-working" class="account__working" role="status" aria-live="polite"></p>
    <p id="activate-error" class="account__error" role="alert" hidden></p>
  </div>
</main>
