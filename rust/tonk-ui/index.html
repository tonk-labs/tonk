<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Rewritten alongside service_worker.js at post-build. This is the
             worker API generation this DOCUMENT was emitted against; unlike
             /version.json it never changes during the document's lifetime. -->
        <meta name="tonk-worker-build" content="dev" />
        <script>
            (() => {
                const build = document.querySelector(
                    'meta[name="tonk-worker-build"]',
                )?.content;
                // `dev` deliberately remains unstamped: the worker uses the
                // same placeholder but the production wire format is exactly
                // 16 lowercase hex characters. The post-build step replaces
                // the meta value before anything can be deployed.
                if (/^[0-9a-f]{16}$/.test(build || "")) {
                    globalThis.tonkBuild = build;
                }

                // Account setup crosses an external WebAuthn ceremony and a
                // staged/durable recovery boundary. Reloading after Arm but
                // before Stage/Inspect proves recovery durable can strand the
                // account, so every automatic update/recovery reload queues
                // behind the UI's stable top-document critical-section
                // contract. The root attribute is the source of truth; the
                // predicate is consulted when available and failures block.
                const ACCOUNT_SETUP_CRITICAL =
                    "data-tonk-account-setup-critical";
                const ACCOUNT_SETUP_CRITICAL_CHANGE =
                    "tonk:account-setup-critical-change";
                const UPDATE_SAFETY_NAME = "tonk-update-safety-v1";
                const UPDATE_SAFETY_STORE = "holds";
                const ACCOUNT_SETUP_HOLD_KEY = "account-setup";
                const ACCOUNT_SETUP_HOLD_CHANGE =
                    "tonk:account-setup-hold-change";
                const MAX_U64 = 18446744073709551615n;
                let automaticReloadPending = false;
                const accountSetupMayReload = () => {
                    const root = document.documentElement;
                    if (!root || root.hasAttribute(ACCOUNT_SETUP_CRITICAL)) {
                        return false;
                    }
                    const predicate = window.tonkAccountSetupMayReload;
                    if (typeof predicate !== "function") return true;
                    try {
                        return predicate() === true;
                    } catch (error) {
                        console.warn(
                            "account-setup reload predicate failed; deferring reload",
                            error,
                        );
                        return false;
                    }
                };

                const validAccountSetupHold = (value) => {
                    if (
                        value == null ||
                        typeof value !== "object" ||
                        Array.isArray(value)
                    ) {
                        return false;
                    }
                    const keys = Object.keys(value).sort();
                    if (
                        keys.join("|") !==
                        "kind|leasedRevision|operationId|version"
                    ) {
                        return false;
                    }
                    if (
                        value.version !== 1 ||
                        value.kind !== ACCOUNT_SETUP_HOLD_KEY ||
                        typeof value.operationId !== "string" ||
                        !/^[0-9a-f]{64}$/.test(value.operationId) ||
                        typeof value.leasedRevision !== "string" ||
                        !/^(0|[1-9][0-9]*)$/.test(value.leasedRevision)
                    ) {
                        return false;
                    }
                    try {
                        return BigInt(value.leasedRevision) <= MAX_U64;
                    } catch {
                        return false;
                    }
                };
                const openUpdateSafetyDatabase = () =>
                    new Promise((resolve, reject) => {
                        let request;
                        let settled = false;
                        const fail = (error) => {
                            if (settled) return;
                            settled = true;
                            reject(error);
                        };
                        try {
                            request = indexedDB.open(UPDATE_SAFETY_NAME, 1);
                        } catch (error) {
                            fail(error);
                            return;
                        }
                        request.onupgradeneeded = () => {
                            try {
                                const database = request.result;
                                if (
                                    !database.objectStoreNames.contains(
                                        UPDATE_SAFETY_STORE,
                                    )
                                ) {
                                    database.createObjectStore(
                                        UPDATE_SAFETY_STORE,
                                    );
                                }
                            } catch (error) {
                                try {
                                    request.transaction?.abort();
                                } catch {}
                                fail(error);
                            }
                        };
                        request.onerror = () =>
                            fail(
                                request.error ||
                                    new Error(
                                        "update safety database open failed",
                                    ),
                            );
                        request.onblocked = () =>
                            fail(
                                new Error(
                                    "update safety database open blocked",
                                ),
                            );
                        request.onsuccess = () => {
                            if (settled) {
                                request.result?.close();
                                return;
                            }
                            settled = true;
                            resolve(request.result);
                        };
                    });
                const readAccountSetupHold = async () => {
                    const database = await openUpdateSafetyDatabase();
                    try {
                        return await new Promise((resolve, reject) => {
                            let transaction;
                            let request;
                            let result;
                            let requestComplete = false;
                            try {
                                transaction = database.transaction(
                                    UPDATE_SAFETY_STORE,
                                    "readonly",
                                );
                                request = transaction
                                    .objectStore(UPDATE_SAFETY_STORE)
                                    .get(ACCOUNT_SETUP_HOLD_KEY);
                            } catch (error) {
                                reject(error);
                                return;
                            }
                            request.onsuccess = () => {
                                requestComplete = true;
                                result = request.result;
                            };
                            request.onerror = () =>
                                reject(
                                    request.error ||
                                        new Error(
                                            "account setup hold read failed",
                                        ),
                                );
                            transaction.onabort = () =>
                                reject(
                                    transaction.error ||
                                        new Error(
                                            "account setup hold read aborted",
                                        ),
                                );
                            transaction.onerror = () =>
                                reject(
                                    transaction.error ||
                                        new Error(
                                            "account setup hold transaction failed",
                                        ),
                                );
                            transaction.oncomplete = () => {
                                if (!requestComplete) {
                                    reject(
                                        new Error(
                                            "account setup hold transaction completed without a result",
                                        ),
                                    );
                                    return;
                                }
                                resolve(result);
                            };
                        });
                    } finally {
                        database.close();
                    }
                };
                const accountSetupHoldAbsent = async () => {
                    try {
                        const hold = await readAccountSetupHold();
                        if (hold === undefined) return true;
                        if (!validAccountSetupHold(hold)) {
                            console.warn(
                                "malformed durable account-setup hold; deferring update",
                            );
                        }
                        return false;
                    } catch (error) {
                        console.warn(
                            "durable account-setup hold read failed; deferring update",
                            error,
                        );
                        return false;
                    }
                };
                const runWithAccountSetupUpdateSafety = async (callback) => {
                    const locks = navigator.locks;
                    if (!locks || typeof locks.request !== "function") {
                        console.warn(
                            "Web Locks unavailable; deferring automatic update",
                        );
                        return false;
                    }
                    try {
                        return await locks.request(
                            UPDATE_SAFETY_NAME,
                            { mode: "exclusive" },
                            async () => {
                                if (
                                    !accountSetupMayReload() ||
                                    !(await accountSetupHoldAbsent()) ||
                                    !accountSetupMayReload()
                                ) {
                                    return false;
                                }
                                // Invoke the irreversible handoff while the
                                // same lock used by write-before-Arm is still
                                // held. A peer cannot publish a new hold in a
                                // read-to-callback gap.
                                return callback();
                            },
                        );
                    } catch (error) {
                        console.warn(
                            "account update-safety lock failed; deferring update",
                            error,
                        );
                        return false;
                    }
                };

                try {
                    const channel = new BroadcastChannel(
                        UPDATE_SAFETY_NAME,
                    );
                    channel.addEventListener("message", (event) => {
                        const message = event.data;
                        if (
                            message?.type !==
                                "account-setup-hold-changed" ||
                            message?.version !== 1
                        ) {
                            return;
                        }
                        window.dispatchEvent(
                            new Event(ACCOUNT_SETUP_HOLD_CHANGE),
                        );
                    });
                } catch (error) {
                    console.warn(
                        "account update-safety broadcast unavailable",
                        error,
                    );
                }
                globalThis.tonkWhenAccountSetupDurable = (callback) => {
                    let finished = false;
                    let check = 0;
                    let retry = null;
                    const scheduleRetry = () => {
                        if (finished || retry !== null) return;
                        retry = setTimeout(() => {
                            retry = null;
                            resume();
                        }, 250);
                    };
                    const resume = async () => {
                        if (retry !== null) {
                            clearTimeout(retry);
                            retry = null;
                        }
                        const current = ++check;
                        if (finished) return;
                        if (!accountSetupMayReload()) {
                            scheduleRetry();
                            return;
                        }
                        await runWithAccountSetupUpdateSafety(() => {
                                if (
                                    finished ||
                                    current !== check ||
                                    !accountSetupMayReload()
                                ) {
                                    return false;
                                }
                                // A claim callback returns false deliberately: if
                                // the worker's authoritative re-read sees a hold
                                // queued ahead of it, the later clear broadcast
                                // must retry. Reload callbacks finish immediately.
                                const complete = callback() !== false;
                                if (complete) {
                                    finished = true;
                                    window.removeEventListener(
                                        ACCOUNT_SETUP_CRITICAL_CHANGE,
                                        resume,
                                    );
                                    window.removeEventListener(
                                        ACCOUNT_SETUP_HOLD_CHANGE,
                                        resume,
                                    );
                                    if (retry !== null) {
                                        clearTimeout(retry);
                                        retry = null;
                                    }
                                }
                                return true;
                            });
                        // Broadcasts and DOM events are wakeups, not
                        // authority. A callback may also deliberately remain
                        // open after a safe attempt: worker claim has no reply,
                        // so controllerchange is the only proof it landed.
                        // Retry the same locked durable read until the callback
                        // observes its terminal state.
                        if (!finished) scheduleRetry();
                    };
                    window.addEventListener(
                        ACCOUNT_SETUP_CRITICAL_CHANGE,
                        resume,
                    );
                    window.addEventListener(
                        ACCOUNT_SETUP_HOLD_CHANGE,
                        resume,
                    );
                    // Register before the first predicate read so a durable
                    // transition cannot be lost between checking and waiting.
                    resume();
                };
                globalThis.tonkClaimWhenAccountSetupDurable = (
                    worker,
                    priorController,
                ) => {
                    globalThis.tonkWhenAccountSetupDurable(() => {
                        const controller = navigator.serviceWorker.controller;
                        if (
                            worker.state === "redundant" ||
                            (controller && controller !== priorController)
                        ) {
                            return true;
                        }
                        worker.postMessage({ type: "claim" });
                        return false;
                    });
                };
                globalThis.tonkReloadWhenAccountSetupDurable = (
                    beforeReload,
                ) => {
                    if (automaticReloadPending) return;
                    automaticReloadPending = true;
                    globalThis.tonkWhenAccountSetupDurable(() => {
                        try {
                            beforeReload?.();
                        } catch (error) {
                            console.warn(
                                "pre-reload update handoff failed; reloading safely",
                                error,
                            );
                        }
                        location.reload();
                    });
                };
            })();
        </script>

        <!-- Boot-shell critical CSS, inlined so first paint needs ZERO
       external resources: both stylesheets below load async (media="print"
       + onload swap), which is safe ONLY while the shell is the body's
       sole pre-mount content — any other visible pre-mount markup would
       flash unstyled. Every color/size is `var(--wa-token, literal)`: the
       literal (resolved from the shoelace palette, the default theme and
       styles.css's brand remap) paints immediately; the live token takes
       over — identically, today — when the async CSS lands. light-dark()
       follows the `color-scheme` meta above, the same OS signal the
       wa-dark/wa-light classes are toggled by. -->
        <style>
            #tonk-boot {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                flex-direction: column;
                padding: 26px 38px 30px;
                background: var(
                    --wa-color-surface-default,
                    light-dark(#e8e6e4, #161313)
                );
                color: var(
                    --wa-color-text-normal,
                    light-dark(#38182a, #e2dfdd)
                );
            }
            /* CSS-only teardown: the wasm mounts <tonk-site> into <body>
               and this rule fades the shell out — the app never has to
               know the shell exists. The delay gives the mounted site a
               beat to paint its own surface underneath; `visibility`
               flips after the fade so the shell can't intercept clicks
               it no longer visually owns. */
            body:has(tonk-site) #tonk-boot,
            body:has(tonk-account) #tonk-boot,
            body:has(tonk-activate) #tonk-boot {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition:
                    opacity 400ms ease 300ms,
                    visibility 0s 700ms;
            }
            /* Destination-neutral loading indicator. */
            .tonk-boot-center {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
            }
            .tonk-pulse {
                display: inline-block;
                width: 18px;
                height: 18px;
                flex: none;
                border-radius: 50%;
                background: currentcolor;
                transform-origin: center;
                animation: tonk-pulse 2s cubic-bezier(0.4, 0, 0.6, 1)
                    infinite;
            }
            .tonk-boot-status {
                position: absolute;
                width: 1px;
                height: 1px;
                margin: -1px;
                padding: 0;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
                font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
                font-size: 12px;
                color: var(
                    --wa-color-text-quiet,
                    light-dark(#5b4953, #c8c3bf)
                );
            }
            .tonk-boot-status[data-failed] {
                position: static;
                width: auto;
                height: auto;
                margin: 0;
                overflow: visible;
                clip: auto;
                white-space: normal;
            }
            @keyframes tonk-pulse {
                0%,
                100% {
                    opacity: 1;
                    scale: 0.33;
                }
                50% {
                    opacity: 0.35;
                    scale: 1;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .tonk-pulse {
                    animation: none;
                    opacity: 1;
                    scale: 0.5;
                }
            }
        </style>

        <!-- V9  -->
        <!-- Web Awesome: custom-element UI library (see .claude/skills/webawesome). The loader
       auto-registers any <wa-*> elements used in the DOM; `data-webawesome` tells it
       where its bundled assets (icons, etc.) live.

       We use the default theme with the shoelace palette. Two
       local overrides layer on top (see styles.css): IBM Plex Sans,
       IBM Plex Sans Condensed, IBM Plex Mono, and a zero border radius.

       webawesome-flat.css is the three entry stylesheets' @import graph
       (webawesome.css + themes/default.css + color/palettes/shoelace.css)
       inlined into ONE file by scripts/flatten-webawesome.sh: the nested
       imports were ~29 render-blocking requests, four levels deep, each
       level a serial round trip before first paint. Re-run the script
       after a webawesome vendor bump; the unflattened sources stay in
       the dist for the loader's lazy per-component chunks.

       Loaded ASYNC (media="print" downloads without blocking render, the
       onload swap applies it): nothing visible needs these rules until
       the wasm mounts the app seconds later — the boot shell's own CSS
       is inlined above. This holds only while the shell is the body's
       sole pre-mount content. -->
        <link
            rel="stylesheet"
            href="/webawesome/styles/webawesome-flat.css"
            media="print"
            onload="this.onload=null;this.media='all'"
        />
        <!-- Interface fonts (IBM Plex Sans / IBM Plex Sans Condensed /
       IBM Plex Mono) are self-hosted: see styles.css
       for the `@font-face` declarations. Files live in
       `assets/fonts/` and are copied into the dist by the
       Trunk `copy-dir` rule below. No external font CDN. -->
        <!-- Web Awesome loader — injected when the browser goes idle, NOT
       eagerly. The loader module statically imports ~16 runtime chunks
       (discover/startLoader/icon+translation registries/base-path utils),
       so importing it eagerly downloads all of them at once. On a slow
       connection that flood saturates the pipe and starves the boot data
       plane: the wasm + the first `/api/*` fetches queue behind it, and
       first paint waits. Nothing on the TOP page uses a `<wa-*>` COMPONENT
       — the theme is pure CSS (loaded above), and every `<wa-*>` element
       renders inside the sealed guest, which ships its own Web Awesome. So
       the top-level loader isn't on the critical path; defer it to
       `requestIdleCallback` (with a timeout fallback) so the wasm and data
       plane win the bandwidth first. `data-webawesome` is carried onto the
       injected script so the loader still resolves its base path. -->
        <script>
            (() => {
                const inject = () => {
                    const s = document.createElement("script");
                    s.type = "module";
                    s.src = "/webawesome/webawesome.loader.js";
                    s.dataset.webawesome = "/webawesome";
                    document.head.appendChild(s);
                };
                if ("requestIdleCallback" in window) {
                    requestIdleCallback(inject, { timeout: 3000 });
                } else {
                    setTimeout(inject, 1000);
                }
            })();
        </script>

        <!-- PostHog analytics, self-hosted (no external CDN, matching
       the font policy above). The bundle only defines window.posthog;
       it is initialized — or left dormant — by the ui binary via
       tonk-analytics, and only when a TONK_POSTHOG_KEY was baked in
       at build time. Opt-out: localStorage "tonk:telemetry" = "off". -->
        <script defer src="/posthog/posthog.js"></script>

        <!-- Inherit the OS light/dark preference. Web Awesome picks up its
       theme from `.wa-light` / `.wa-dark` on the root element; toggle
       the class immediately (before paint) and keep it in sync with
       `prefers-color-scheme` changes. -->
        <script>
            (() => {
                // Activate the default theme with the shoelace palette. Light/dark
                // is toggled reactively on `prefers-color-scheme` changes.
                document.documentElement.classList.add(
                    "wa-theme-default",
                    "wa-palette-shoelace",
                );

                const mq = window.matchMedia("(prefers-color-scheme: dark)");
                const apply = (isDark) => {
                    const cls = document.documentElement.classList;
                    cls.toggle("wa-dark", isDark);
                    cls.toggle("wa-light", !isDark);
                };
                apply(mq.matches);
                mq.addEventListener("change", (e) => apply(e.matches));
            })();
        </script>

        <!-- Must define `serviceWorkerActivates` before the Wasm blob loads:
         the shell awaits it before issuing any /api/* fetch. -->
        <script type="module">
            // Poke the worker to re-check connectivity. Sent BEFORE the app's
            // first data-plane call (this runs inside `serviceWorkerActivates`,
            // which the shell awaits at boot), so on a reload while offline the
            // worker reconciles the offline status before it would otherwise
            // drain — which was resetting the indicator to "online" on reload.
            // The worker reads `navigator.onLine` itself; this only wakes it.
            const sendConnectivity = async () => {
                const reg = await navigator.serviceWorker.ready;
                reg.active?.postMessage({ type: "connectivity" });
            };

            const WITHDRAWN_BOOT_FAILURE =
                "This Tonk version was withdrawn. Reload to try the current version.";
            const OLD_BROWSER_BOOT_FAILURE =
                "This browser is too old to run Tonk. Safari 16.4+, or a recent Chrome or Firefox.";
            const GENERIC_BOOT_FAILURE =
                "Tonk couldn’t start. Check your connection, then reload. Your local data is safe.";
            const presentBootFailure = (message) => {
                if (typeof self.tonkBootTerminal === "function") {
                    self.tonkBootTerminal(message);
                    return;
                }
                const status = document.querySelector("[data-boot-status]");
                if (status) {
                    status.setAttribute("data-failed", "");
                    status.textContent = message;
                }
            };

            // Whether THIS immutable document generation has been withdrawn.
            // `version.json` is mutable deployment discovery and must never be
            // used to identify bytes that are already running. Ambiguous
            // answers fail open, and withdrawal never deletes local artifacts.
            const isRevoked = async () => {
                try {
                    const build = globalThis.tonkBuild;
                    if (!build) return false;
                    const flagResponse = await fetch("/kill-switch.json", {
                        cache: "no-store",
                    });
                    if (!flagResponse.ok) return false;
                    const { revoked } = JSON.parse(await flagResponse.text());
                    return Array.isArray(revoked) && revoked.includes(build);
                } catch {
                    return false;
                }
            };

            const UPGRADE_RELOAD = "tonk:sw-upgrade-reload";
            const INSTALL_PROGRESS_CHANNEL =
                "tonk-sw-install-progress-v1";

            const noteInstallProgress = (message) => {
                if (
                    message?.type === "tonk-install-progress" &&
                    message?.build === globalThis.tonkBuild
                ) {
                    self.tonkBootLife?.();
                }
            };
            navigator.serviceWorker.addEventListener("message", (event) =>
                noteInstallProgress(event.data),
            );
            try {
                const installProgress = new BroadcastChannel(
                    INSTALL_PROGRESS_CHANNEL,
                );
                installProgress.addEventListener("message", (event) =>
                    noteInstallProgress(event.data),
                );
            } catch {}

            // Begin registration and update detection eagerly, while the UI
            // Wasm downloads. Every caller receives this exact promise, so the
            // pre-mount gate and later host IO cannot start duplicate updates.
            const serviceWorkerActivation = (async () => {
                if (!("serviceWorker" in navigator)) {
                    throw new Error(
                        "Service workers not supported; Tonk will not work!",
                    );
                }

                if (await isRevoked()) {
                    presentBootFailure(WITHDRAWN_BOOT_FAILURE);
                    throw new Error("This Tonk build has been revoked");
                }

                const priorController = navigator.serviceWorker.controller;
                const onControllerReplacement = () => {
                    if (
                        !priorController ||
                        !navigator.serviceWorker.controller ||
                        navigator.serviceWorker.controller === priorController
                    ) {
                        return;
                    }
                    // `clients.claim()` changes every controlled tab, not only
                    // the page that requested adoption. Keep this listener for
                    // the document lifetime so sibling A documents also cross
                    // the account-safety gate and align to B exactly once.
                    try {
                        sessionStorage.setItem(UPGRADE_RELOAD, "1");
                    } catch {}
                    globalThis.tonkReloadWhenAccountSetupDurable();
                };
                navigator.serviceWorker.addEventListener(
                    "controllerchange",
                    onControllerReplacement,
                );
                let resolveControlled;
                const controlled = new Promise((resolve) => {
                    resolveControlled = resolve;
                });
                const onFirstControl = () => resolveControlled();
                navigator.serviceWorker.addEventListener(
                    "controllerchange",
                    onFirstControl,
                );

                let registration;
                try {
                    registration = await navigator.serviceWorker.register(
                        "/service_worker.js",
                        {
                            type: "module",
                            updateViaCache: "none",
                        },
                    );
                } catch (error) {
                    navigator.serviceWorker.removeEventListener(
                        "controllerchange",
                        onFirstControl,
                    );
                    throw error;
                }

                // First install (or an active-but-unclaimed worker) keeps this
                // document. Wait until `/api/*` is controlled, nudging an
                // already-active worker whose activate event happened earlier.
                // `register()` may resolve while a true first install is still
                // verifying, when `registration.active` is null. Wait for the
                // registration to have an active worker before sending the one
                // claim request; an optional send before that transition is
                // lost and leaves this document waiting for control forever.
                if (!priorController) {
                    if (!navigator.serviceWorker.controller) {
                        const readyRegistration =
                            await navigator.serviceWorker.ready;
                        const firstWorker = readyRegistration.active;
                        if (!firstWorker) {
                            throw new Error(
                                "Service worker became ready without an active worker",
                            );
                        }
                        globalThis.tonkClaimWhenAccountSetupDurable(
                            firstWorker,
                            priorController,
                        );
                        await controlled;
                    }
                    navigator.serviceWorker.removeEventListener(
                        "controllerchange",
                        onFirstControl,
                    );
                    try {
                        sessionStorage.removeItem(UPGRADE_RELOAD);
                    } catch {}
                    await sendConnectivity();
                    return;
                }
                navigator.serviceWorker.removeEventListener(
                    "controllerchange",
                    onFirstControl,
                );

                // The replacement document consumes the one-shot handoff. Its
                // controller is already current, so another network update here
                // would permit an automatic reload chain if a second deployment
                // landed between the two documents.
                let alignmentReload = false;
                try {
                    alignmentReload = sessionStorage.getItem(UPGRADE_RELOAD) === "1";
                } catch {}
                if (alignmentReload) {
                    try {
                        sessionStorage.removeItem(UPGRADE_RELOAD);
                    } catch {}
                    await sendConnectivity();
                    return;
                }

                let incoming = null;
                let activationRequested = null;
                let claimRequested = null;
                let settled = false;
                let resolveOutcome;
                const outcome = new Promise((resolve) => {
                    resolveOutcome = resolve;
                });
                const finish = (value) => {
                    if (settled) return;
                    settled = true;
                    resolveOutcome(value);
                };
                const noteLife = () => self.tonkBootLife?.();
                const onWorkerState = () => {
                    noteLife();
                    if (incoming?.state === "redundant") finish("failed");
                    // A complete successor waits until this update-aware page
                    // crosses the origin-global account-safety gate. Only then
                    // ask that exact worker to activate.
                    if (
                        incoming?.state === "installed" &&
                        activationRequested !== incoming
                    ) {
                        const successor = incoming;
                        activationRequested = successor;
                        globalThis.tonkWhenAccountSetupDurable(() => {
                            successor.postMessage({ type: "activate" });
                        });
                    }
                    // Activation alone deliberately leaves older, unaware
                    // pages on their existing controller. This document owns
                    // the update protocol, so once its observed successor is
                    // ready it explicitly asks that worker to take control;
                    // the resulting controllerchange drives the guarded
                    // alignment reload below.
                    if (
                        incoming?.state === "activated" &&
                        navigator.serviceWorker.controller === priorController &&
                        claimRequested !== incoming
                    ) {
                        const successor = incoming;
                        claimRequested = successor;
                        globalThis.tonkClaimWhenAccountSetupDurable(
                            successor,
                            priorController,
                        );
                    }
                    if (
                        navigator.serviceWorker.controller &&
                        navigator.serviceWorker.controller !== priorController
                    ) {
                        finish("replaced");
                    }
                };
                const watchIncoming = (worker) => {
                    if (!worker || worker === incoming) return;
                    incoming?.removeEventListener("statechange", onWorkerState);
                    incoming = worker;
                    incoming.addEventListener("statechange", onWorkerState);
                    const status = document.querySelector("[data-boot-status]");
                    if (status) status.textContent = "updating…";
                    noteLife();
                    onWorkerState();
                };
                const onUpdateFound = () =>
                    watchIncoming(registration.installing);
                const onReplacement = () => {
                    if (
                        navigator.serviceWorker.controller &&
                        navigator.serviceWorker.controller !== priorController
                    ) {
                        finish("replaced");
                    }
                };
                const cleanup = () => {
                    registration.removeEventListener(
                        "updatefound",
                        onUpdateFound,
                    );
                    navigator.serviceWorker.removeEventListener(
                        "controllerchange",
                        onReplacement,
                    );
                    incoming?.removeEventListener(
                        "statechange",
                        onWorkerState,
                    );
                };
                registration.addEventListener("updatefound", onUpdateFound);
                navigator.serviceWorker.addEventListener(
                    "controllerchange",
                    onReplacement,
                );
                onReplacement();

                const existingUpdate =
                    registration.installing || registration.waiting;
                let result;
                if (existingUpdate) {
                    watchIncoming(existingUpdate);
                    result = await outcome;
                } else {
                    try {
                        await registration.update();
                    } catch (error) {
                        cleanup();
                        if (
                            navigator.serviceWorker.controller ===
                            priorController
                        ) {
                            console.warn(
                                "service-worker update check failed; keeping the active worker",
                                error,
                            );
                            try {
                                sessionStorage.removeItem(UPGRADE_RELOAD);
                            } catch {}
                            await sendConnectivity();
                            return;
                        }
                        throw error;
                    }
                    watchIncoming(
                        registration.installing || registration.waiting,
                    );
                    result = incoming ? await outcome : "unchanged";
                }

                cleanup();
                if (result === "replaced") {
                    try {
                        sessionStorage.setItem(UPGRADE_RELOAD, "1");
                    } catch {}
                    globalThis.tonkReloadWhenAccountSetupDurable();
                    await new Promise(() => {});
                    return;
                }

                try {
                    sessionStorage.removeItem(UPGRADE_RELOAD);
                } catch {}
                if (result === "failed") {
                    console.warn(
                        `service-worker update failed in state ${incoming?.state ?? "unknown"}; keeping the active worker`,
                    );
                }
                await sendConnectivity();
            })();

            // Observe rejection immediately so the eager promise cannot create
            // a transient `unhandledrejection` before Rust reaches its strict
            // await. The original promise remains rejected for that await.
            serviceWorkerActivation.catch((error) => {
                console.error("service-worker activation failed", error);
                const detail = String(error?.message || error);
                if (/revoked/i.test(detail)) return;
                presentBootFailure(
                    /module|type/i.test(detail)
                        ? OLD_BROWSER_BOOT_FAILURE
                        : GENERIC_BOOT_FAILURE,
                );
            });
            self.serviceWorkerActivates = () => serviceWorkerActivation;

            // Register a one-shot background sync under `tag` so a
            // local commit reaches its upstream even if the tab goes
            // offline or closes before the next in-page sweep. The
            // user agent fires the SW `sync` event when connectivity
            // returns, retrying with backoff. Rejects where the
            // Background Sync API is absent (Safari, Firefox) or
            // registration fails, so the Rust controller falls back to
            // the in-page sweep.
            self.tonkRegisterSync = async (tag) => {
                if (
                    !("serviceWorker" in navigator) ||
                    !("SyncManager" in window)
                ) {
                    throw new Error("Background Sync API unavailable");
                }
                const registration = await navigator.serviceWorker.ready;
                await registration.sync.register(tag);
            };

            // Poke the worker on connectivity TRANSITIONS so the sync indicator
            // updates immediately instead of waiting for the next fetch. The
            // active page's `online`/`offline` events are the dependable
            // trigger; the worker itself decides online-vs-offline from
            // `navigator.onLine`. The INITIAL poke is sent from
            // `serviceWorkerActivates` above (before the first data-plane call).
            self.addEventListener("online", () => sendConnectivity().catch(() => {}));
            self.addEventListener("offline", () => sendConnectivity().catch(() => {}));

            const sendVisibility = async () => {
                const reg = await navigator.serviceWorker.ready;
                reg.active?.postMessage({ type: "visibility" });
            };

            // Tell the worker when this page becomes visible so sync
            // drops its hidden interval without waiting for the next
            // keepalive to age past it.
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState !== "visible") return;
                sendVisibility().catch(() => {});
            });
        </script>

        <!-- Boot watchdog. A boot occasionally wedges — a wasm fetch that
         dies quietly, a worker install that never finishes, the cache
         poisonings of old — and every one of those left the shell at
         "loading…" forever with a reload as the only cure. The page can
         run that cure itself.

         Stall detection, not a timer on elapsed time: download progress
         (reported by boot-progress.mjs via tonkBootLife), the wasm
         starting, and service-worker state transitions all count as
         life, so a slow connection mid-download is never reloaded. Only
         30 quiet seconds with the app unmounted or uncontrolled trigger
         recovery.

         Recovery is bounded per tab (sessionStorage): the first silent stall
         gets one plain reload. A second stall gives up honestly and leaves the
         shell's failure line for the person; automatic recovery never deletes
         caches or unregisters workers. A detected wasm load failure
         (boot-progress.mjs onFailure) enters the same path immediately instead
         of waiting out the stall window. A known readiness rejection enters
         the idempotent terminal state without even the first reload. -->
        <script>
            (() => {
                if (!("serviceWorker" in navigator)) return;
                const RETRIES = "tonk:boot-retries";
                const STALL_MS = 30_000;
                let lastLife = Date.now();
                let terminal = false;
                self.tonkBootLife = () => {
                    lastLife = Date.now();
                };

                const attempts = () => {
                    try {
                        return Number(sessionStorage.getItem(RETRIES)) || 0;
                    } catch {
                        return 0;
                    }
                };
                const booted = () =>
                    !!navigator.serviceWorker.controller &&
                    !!document.querySelector(
                        "tonk-site, tonk-account, tonk-activate",
                    );

                // A worker whose install is advancing is a live boot even
                // while nothing else moves: state flips count as life.
                let swState = "";
                const swLife = async () => {
                    try {
                        const reg =
                            await navigator.serviceWorker.getRegistration();
                        const state = reg
                            ? ["installing", "waiting", "active"]
                                  .map((k) => (reg[k] ? reg[k].state : "-"))
                                  .join(",")
                            : "none";
                        if (state !== swState) {
                            swState = state;
                            lastLife = Date.now();
                        }
                    } catch {}
                };

                const recover = (why) => {
                    if (terminal) return;
                    clearInterval(timer);
                    const n = attempts();
                    if (n >= 1) {
                        console.error(
                            `boot: still stuck after ${n} recoveries (${why}); giving up`,
                        );
                        self.tonkBootTerminal(
                            "Tonk couldn’t start. Check your connection, then reload. Your local data is safe.",
                        );
                        return;
                    }
                    try {
                        sessionStorage.setItem(RETRIES, String(n + 1));
                    } catch {}
                    console.warn(`boot: ${why}; recovery ${n + 1}`);
                    const status =
                        document.querySelector("[data-boot-status]");
                    if (status) status.textContent = "recovering…";
                    globalThis.tonkReloadWhenAccountSetupDurable();
                };
                self.tonkBootRecover = recover;
                self.tonkBootTerminal = (message) => {
                    if (terminal) return;
                    terminal = true;
                    clearInterval(timer);
                    try {
                        sessionStorage.removeItem(RETRIES);
                    } catch {}
                    const status =
                        document.querySelector("[data-boot-status]");
                    if (status) {
                        status.setAttribute("data-failed", "");
                        status.textContent = message;
                    }
                };

                const timer = setInterval(() => {
                    if (booted()) {
                        clearInterval(timer);
                        try {
                            sessionStorage.removeItem(RETRIES);
                        } catch {}
                        return;
                    }
                    swLife();
                    if (Date.now() - lastLife > STALL_MS) {
                        recover("no boot progress for 30s");
                    }
                }, 5_000);
            })();
        </script>

        <!-- Static boot shell: the ONLY body content until the wasm mounts
         `<tonk-site>` — the async-stylesheet strategy in <head> depends on
         that staying true. It shows the shared loading pulse while the Trunk
         initializer reports progress to assistive technology. Styled by the inline
         critical CSS in <head>; hidden purely by CSS
         (`body:has(tonk-site)`) — the wasm never has to know it exists. -->
        <div id="tonk-boot" aria-live="polite">
            <div class="tonk-boot-center">
                <span class="tonk-pulse" aria-hidden="true"></span>
                <p class="tonk-boot-status" data-boot-status>loading…</p>
            </div>

        <script type="module">
            let registration;
            try {
                // Reuse the exact eager registration/update promise consumed
                // by the strict Rust pre-mount gate. A second register/update
                // path here would race #800's load-time alignment protocol.
                await self.serviceWorkerActivates();
                registration =
                    await navigator.serviceWorker.getRegistration();
                if (!registration) {
                    throw new Error("Service worker registration disappeared");
                }
            } catch (err) {
                // The eager activation owner has already terminalized the
                // boot shell with a safe, actionable message. Keep this later
                // consumer from overwriting that message with raw error text.
                console.error("Service worker activation failed:", err);
                throw err;
            }

            // ---- "Update ready" affordance ---------------------------
                //
                // Until now there was no user-visible update signal at all —
                // no toast, no version anywhere — so a user stuck on a stale
                // build had no path forward but folklore (clear website
                // data). This is deliberately built here, in the boot script,
                // rather than in the app: the app's own wasm is one of the
                // things that can be stale, and the affordance has to work
                // exactly when the app doesn't.
                let announced = false;
                const announceUpdate = () => {
                    if (announced) return;
                    announced = true;

                    const bar = document.createElement("div");
                    bar.setAttribute("role", "status");
                    bar.style.cssText = [
                        "position:fixed", "inset-inline:0", "bottom:0",
                        "z-index:2147483647", "display:flex", "gap:0.75rem",
                        "align-items:center", "justify-content:center",
                        "padding:0.75rem 1rem",
                        "font:14px/1.4 system-ui, sans-serif",
                        "background:Canvas", "color:CanvasText",
                        "border-top:1px solid color-mix(in srgb, CanvasText 20%, transparent)",
                    ].join(";");

                    const label = document.createElement("span");
                    label.textContent = "A new version of Tonk is ready.";

                    const reload = document.createElement("button");
                    reload.textContent = "Reload";
                    reload.style.cssText = [
                        "font:inherit", "padding:0.35rem 1rem",
                        "border-radius:6px", "cursor:pointer",
                        "border:1px solid color-mix(in srgb, CanvasText 30%, transparent)",
                        "background:color-mix(in srgb, CanvasText 8%, Canvas)",
                        "color:inherit",
                    ].join(";");
                    reload.addEventListener("click", () => {
                        const controllerBeforeClaim =
                            navigator.serviceWorker.controller;
                        // Activate without navigating, then ask that exact
                        // successor to claim. `controllerchange` owns the one
                        // alignment reload: reloading immediately after
                        // `activate` can produce another A document behind an
                        // already-active B, with no waiting worker left for it
                        // to observe.
                        globalThis.tonkWhenAccountSetupDurable(() => {
                            const successor =
                                registration.waiting ||
                                registration.installing ||
                                (registration.active !==
                                navigator.serviceWorker.controller
                                    ? registration.active
                                    : null);
                            if (!successor) {
                                // Discovery can beat installation. Keep this
                                // waiter open and nudge it when update() has a
                                // candidate to expose.
                                const wake = () =>
                                    window.dispatchEvent(
                                            new Event(
                                                "tonk:account-setup-hold-change",
                                            ),
                                    );
                                registration.update().then(wake, wake);
                                return false;
                            }

                            let claimQueued = false;
                            const claimWhenActive = () => {
                                if (
                                    claimQueued ||
                                    successor.state !== "activated"
                                ) {
                                    return;
                                }
                                claimQueued = true;
                                successor.removeEventListener(
                                    "statechange",
                                    claimWhenActive,
                                );
                                globalThis.tonkClaimWhenAccountSetupDurable(
                                    successor,
                                    controllerBeforeClaim,
                                );
                            };

                            if (successor.state === "installed") {
                                successor.addEventListener(
                                    "statechange",
                                    claimWhenActive,
                                );
                                successor.postMessage({ type: "activate" });
                            } else if (successor.state === "installing") {
                                const wakeWhenInstalled = () => {
                                    if (
                                        successor.state !== "installed" &&
                                        successor.state !== "activated" &&
                                        successor.state !== "redundant"
                                    ) {
                                        return;
                                    }
                                    successor.removeEventListener(
                                        "statechange",
                                        wakeWhenInstalled,
                                    );
                                    window.dispatchEvent(
                                        new Event(
                                            "tonk:account-setup-hold-change",
                                        ),
                                    );
                                };
                                successor.addEventListener(
                                    "statechange",
                                    wakeWhenInstalled,
                                );
                                return false;
                            }
                            claimWhenActive();
                            return true;
                        });
                    });

                    const dismiss = document.createElement("button");
                    dismiss.textContent = "Not now";
                    dismiss.setAttribute("aria-label", "Dismiss update notice");
                    dismiss.style.cssText = [
                        "font:inherit", "padding:0.35rem 0.75rem",
                        "border:0", "background:none", "cursor:pointer",
                        "color:inherit", "opacity:0.7",
                    ].join(";");
                    dismiss.addEventListener("click", () => bar.remove());

                    bar.append(label, reload, dismiss);
                    document.body.appendChild(bar);
                };

                // The app raises this when the worker answers a `409`
                // from the version handshake — it is talking to a
                // worker from a different build, which only a reload
                // can resolve.
                window.addEventListener("tonk-update-available", () => {
                    announceUpdate();
                });

                // ---- Update discovery ------------------------------------
                //
                // The browser only checks for a new worker on navigation (and
                // at register time). This is a single-page app: it navigates
                // with pushState, its tabs live for days, and a bfcache
                // restore doesn't re-run this script — so the check can
                // simply never happen. Safari is both the laziest checker and
                // the engine where a stuck worker is hardest to clear, which
                // is how a user ends up stranded on an old build with no
                // recourse but clearing website data.
                //
                // So ask explicitly, at the moments an update is both likely
                // and cheap to apply: coming back to the tab, regaining
                // connectivity, and hourly for a tab left open.
                const checkForUpdate = () => {
                    registration.update().catch(() => {
                        // Offline or throttled — the next trigger retries.
                    });
                };
                document.addEventListener("visibilitychange", () => {
                    if (document.visibilityState === "visible") checkForUpdate();
                });
                window.addEventListener("online", checkForUpdate);
                setInterval(checkForUpdate, 60 * 60 * 1000);

                // Deliberately NOT listening to `updatefound` to decide
                // this. `registration` is shared across every tab on the
                // origin, so that event fires in all of them — including
                // tabs already running the new build, and including the
                // install a *sibling tab's* reload just triggered. Two tabs
                // then ping-pong: reload A, B prompts; reload B, A prompts;
                // forever, with neither ever actually wrong.
                //
                // Gating it on `registration.waiting` does not fix that
                // either: this worker calls `skipWaiting()`, so a successor
                // goes `installing -> activating` and barely touches the
                // `waiting` slot. The gate reads an almost-always-empty
                // field and fires or not by luck.
                //
                // The honest question is a STATE, not an event: is the
                // build this page loaded different from the build being
                // served now? Each tab answers that for itself, no sibling
                // can trigger it, and a reload makes it false — so the
                // prompt appears exactly when reloading would change
                // something, and stops once it would not.
                const checkStale = async () => {
                    try {
                        const response = await fetch("/version.json", {
                            cache: "no-store",
                        });
                        if (!response.ok) return;
                        const { build } = await response.json();
                        if (!build || !ourBuild) return;
                        if (build !== ourBuild) announceUpdate();
                    } catch {
                        // Offline — nothing to report.
                    }
                };

                // ---- Version probe ---------------------------------------
                //
                // `version.json` is written by the build (see
                // `scripts/stamp-service-worker.sh`) and served `no-store`. Polling it
                // detects a new deploy WITHOUT depending on service-worker
                // update machinery — which matters precisely because that
                // machinery being wedged is the failure being solved. When it
                // reports a build other than the one this worker is running,
                // announce it; `<tonk-site>` renders the reload affordance.
                const BUILD_PROBE_MS = 15 * 60 * 1000;
                // The post-build step stamped this immutable value into the
                // document and the early head script published it before the
                // app loader. `/version.json` is discovery only: using its
                // mutable answer as provenance lets a cached old document
                // impersonate the currently deployed generation.
                const ourBuild = globalThis.tonkBuild ?? null;
                void checkStale();
                setInterval(checkStale, BUILD_PROBE_MS);
                // Also on focus: a tab returned to after a deploy is the
                // likeliest moment for the prompt to matter.
                document.addEventListener("visibilitychange", () => {
                    if (document.visibilityState === "visible") checkStale();
                });

        </script>
    </body>
</html>
