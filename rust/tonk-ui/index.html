<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Tell the browser to render native chrome (scrollbars, form
       controls, etc.) in either mode — the actual mode is selected
       reactively by the script below based on the OS preference. -->
        <meta name="color-scheme" content="light dark" />
        <meta name="title" content="Tonk" />
        <meta
            name="description"
            content="Locally multiplayer. Shared without servers. Free without ads. Impossible, until now."
        />
        <meta name="robots" content="index, follow" />

        <title>Tonk</title>

        <meta property="og:title" content="Tonk is impossible software" />
        <meta
            property="og:description"
            content="Locally multiplayer. Shared without servers. Free without ads. Impossible, until now."
        />
        <meta property="og:url" content="https://tonk.xyz" />
        <meta property="og:site_name" content="Tonk" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:image" content="https://tonk.xyz/preview.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Tonk is impossible software" />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Tonk is impossible software" />
        <meta
            name="twitter:description"
            content="Locally multiplayer. Shared without servers. Free without ads. Impossible, until now."
        />
        <meta name="twitter:image" content="https://tonk.xyz/preview.png" />

        <link rel="shortcut icon" href="/images/mark-white.svg" />
        <link rel="apple-touch-icon" href="/images/mark-white.svg" />

        <!-- Boot-shell critical CSS, inlined so first paint needs ZERO
       external resources: both stylesheets below load async (media="print"
       + onload swap), which is safe ONLY while the shell is the body's
       sole pre-mount content — any other visible pre-mount markup would
       flash unstyled. Every color/size is `var(--wa-token, literal)`: the
       literal (resolved from the shoelace palette, the default theme and
       styles.css's brand remap) paints immediately; the live token takes
       over — identically, today — when the async CSS lands. light-dark()
       follows the `color-scheme` meta above, the same OS signal the
       wa-dark/wa-light classes are toggled by. -->
        <style>
            /* The wordmark cut, duplicated from styles.css (the canonical
               @font-face set) because that file is async and the shell
               shows "tonk" at first paint. Browsers dedupe identical
               @font-face descriptors; the preload below has the bytes. */
            @font-face {
                font-family: "GestalteName";
                font-style: normal;
                font-weight: 500;
                font-display: swap;
                src: url("/fonts/gestaltename-500.ttf") format("truetype");
            }
            #tonk-boot {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                flex-direction: column;
                padding: 26px 38px 30px;
                background: var(
                    --wa-color-surface-default,
                    light-dark(#ffffff, #101113)
                );
                color: var(
                    --wa-color-text-normal,
                    light-dark(#1d1d20, #f2f2f3)
                );
            }
            /* CSS-only teardown: the wasm mounts <tonk-site> into <body>
               and this rule fades the shell out — the app never has to
               know the shell exists. The delay gives the mounted site a
               beat to paint its own surface underneath; `visibility`
               flips after the fade so the shell can't intercept clicks
               it no longer visually owns. */
            body:has(tonk-site) #tonk-boot,
            body:has(tonk-account) #tonk-boot {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition:
                    opacity 400ms ease 300ms,
                    visibility 0s 700ms;
            }
            /* Header replica — token-for-token the Hub's `.spot-brand`
               row (profile.yaml), so the real header takes over in
               place. */
            .tonk-boot-brand {
                display: flex;
                align-items: center;
                gap: 12px;
                flex: none;
            }
            .tonk-boot-logo {
                font-family: "GestalteName", "Gestalte", sans-serif;
                font-size: var(--wa-font-size-4xl, 52px);
                font-weight: 500;
                line-height: 1;
                text-transform: lowercase;
            }
            .tonk-boot-badge {
                font-family: "IBM Plex Sans", Helvetica, Arial, sans-serif;
                font-weight: 600;
                font-size: 19px;
                line-height: 1.1;
                padding: 3px 11px;
                color: var(--wa-color-brand-on-loud, #2a3005);
                background: #deff1a;
            }
            /* Progress, centered where the Hub's directory will land. */
            .tonk-boot-center {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
            }
            .tonk-boot-bar {
                inline-size: min(220px, 60vw);
                block-size: 2px;
                background: var(
                    --wa-color-neutral-fill-normal,
                    light-dark(#e5e5e8, #313134)
                );
                overflow: hidden;
            }
            /* Indeterminate by default; boot-progress.mjs flips to
               [data-determinate] + explicit widths once real totals
               exist, and [data-failed] on a load error. */
            .tonk-boot-fill {
                block-size: 100%;
                inline-size: 40%;
                background: var(
                    --wa-color-text-normal,
                    light-dark(#1d1d20, #f2f2f3)
                );
                animation: tonk-boot-sweep 1.2s ease-in-out infinite;
            }
            .tonk-boot-fill[data-determinate] {
                animation: none;
                inline-size: 0;
                transition: inline-size 200ms ease;
            }
            .tonk-boot-fill[data-failed] {
                animation: none;
                inline-size: 100%;
                background: var(--wa-color-danger-fill-loud, #e02c2b);
            }
            @keyframes tonk-boot-sweep {
                0% {
                    translate: -250% 0;
                }
                100% {
                    translate: 350% 0;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .tonk-boot-fill {
                    animation: none;
                }
            }
            .tonk-boot-status {
                margin: 0;
                font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
                font-size: 12px;
                color: var(
                    --wa-color-text-quiet,
                    light-dark(#565861, #94959b)
                );
            }
        </style>

        <!-- V9  -->
        <!-- Web Awesome: custom-element UI library (see .claude/skills/webawesome). The loader
       auto-registers any <wa-*> elements used in the DOM; `data-webawesome` tells it
       where its bundled assets (icons, etc.) live.

       We use the default theme with the shoelace palette. Two
       local overrides layer on top (see styles.css): brutalist's
       fonts (Space Grotesk / IBM Plex Sans Condensed / Space Mono)
       and a zero border radius so nothing is rounded.

       webawesome-flat.css is the three entry stylesheets' @import graph
       (webawesome.css + themes/default.css + color/palettes/shoelace.css)
       inlined into ONE file by scripts/flatten-webawesome.sh: the nested
       imports were ~29 render-blocking requests, four levels deep, each
       level a serial round trip before first paint. Re-run the script
       after a webawesome vendor bump; the unflattened sources stay in
       the dist for the loader's lazy per-component chunks.

       Loaded ASYNC (media="print" downloads without blocking render, the
       onload swap applies it): nothing visible needs these rules until
       the wasm mounts the app seconds later — the boot shell's own CSS
       is inlined above. This holds only while the shell is the body's
       sole pre-mount content. -->
        <link
            rel="stylesheet"
            href="/webawesome/styles/webawesome-flat.css"
            media="print"
            onload="this.onload=null;this.media='all'"
        />
        <!-- Brutalist-theme fonts (Space Grotesk / IBM Plex Sans
       Condensed / Space Mono) are self-hosted: see styles.css
       for the `@font-face` declarations. Files live in
       `assets/fonts/` and are copied into the dist by the
       Trunk `copy-dir` rule below. No external font CDN. -->
        <!-- The wordmark cut only (27 KB): the boot shell shows "tonk"
       immediately, and without the preload the face would arrive after
       the shell's first paint and flash the fallback. Fonts are always
       CORS-fetched, so `crossorigin` is required for the preload to
       match. The other faces load on demand as usual. -->
        <link
            rel="preload"
            href="/fonts/gestaltename-500.ttf"
            as="font"
            type="font/ttf"
            crossorigin
        />
        <!-- Web Awesome loader — injected when the browser goes idle, NOT
       eagerly. The loader module statically imports ~16 runtime chunks
       (discover/startLoader/icon+translation registries/base-path utils),
       so importing it eagerly downloads all of them at once. On a slow
       connection that flood saturates the pipe and starves the boot data
       plane: the wasm + the first `/api/*` fetches queue behind it, and
       first paint waits. Nothing on the TOP page uses a `<wa-*>` COMPONENT
       — the theme is pure CSS (loaded above), and every `<wa-*>` element
       renders inside the sealed guest, which ships its own Web Awesome. So
       the top-level loader isn't on the critical path; defer it to
       `requestIdleCallback` (with a timeout fallback) so the wasm and data
       plane win the bandwidth first. `data-webawesome` is carried onto the
       injected script so the loader still resolves its base path. -->
        <script>
            (() => {
                const inject = () => {
                    const s = document.createElement("script");
                    s.type = "module";
                    s.src = "/webawesome/webawesome.loader.js";
                    s.dataset.webawesome = "/webawesome";
                    document.head.appendChild(s);
                };
                if ("requestIdleCallback" in window) {
                    requestIdleCallback(inject, { timeout: 3000 });
                } else {
                    setTimeout(inject, 1000);
                }
            })();
        </script>

        <!-- PostHog analytics, self-hosted (no external CDN, matching
       the font policy above). The bundle only defines window.posthog;
       it is initialized — or left dormant — by the ui binary via
       tonk-analytics, and only when a TONK_POSTHOG_KEY was baked in
       at build time. Opt-out: localStorage "tonk:telemetry" = "off". -->
        <script defer src="/posthog/posthog.js"></script>

        <!-- Inherit the OS light/dark preference. Web Awesome picks up its
       theme from `.wa-light` / `.wa-dark` on the root element; toggle
       the class immediately (before paint) and keep it in sync with
       `prefers-color-scheme` changes. -->
        <script>
            (() => {
                // Activate the default theme with the shoelace palette. Light/dark
                // is toggled reactively on `prefers-color-scheme` changes.
                document.documentElement.classList.add(
                    "wa-theme-default",
                    "wa-palette-shoelace",
                );

                const mq = window.matchMedia("(prefers-color-scheme: dark)");
                const apply = (isDark) => {
                    const cls = document.documentElement.classList;
                    cls.toggle("wa-dark", isDark);
                    cls.toggle("wa-light", !isDark);
                };
                apply(mq.matches);
                mq.addEventListener("change", (e) => apply(e.matches));
            })();
        </script>

        <!-- Must define `serviceWorkerActivates` before the Wasm blob loads:
         the shell awaits it before issuing any /api/* fetch. -->
        <script type="module">
            // Resolve when the service worker is *controlling* this page.
            //
            // `controller` being non-null is the precise moment when
            // `/api/*` fetches start routing through the worker. Three
            // paths reach that state:
            //
            //   1. Already controlled (warm load) — return immediately.
            //   2. Registration is in-flight — `controllerchange` fires
            //      when the new SW claims this page during its install /
            //      activate cycle.
            //   3. SW activated in a previous session but this newly-
            //      loaded document isn't being controlled — the SW's
            //      `onactivate` doesn't refire, so without a nudge it
            //      never calls `clients.claim()` for this client. We
            //      send a `{type:"claim"}` message to the active worker
            //      asking it to claim; the SW responds with
            //      `self.clients.claim()`, which raises
            //      `controllerchange` on this page.
            //
            // No reloads, no timeouts: the claim path is deterministic
            // once the SW has a `message` handler that honors `claim`.
            // Poke the worker to re-check connectivity. Sent BEFORE the app's
            // first data-plane call (this runs inside `serviceWorkerActivates`,
            // which the shell awaits at boot), so on a reload while offline the
            // worker reconciles the offline status before it would otherwise
            // drain — which was resetting the indicator to "online" on reload.
            // The worker reads `navigator.onLine` itself; this only wakes it.
            const sendConnectivity = async () => {
                const reg = await navigator.serviceWorker.ready;
                reg.active?.postMessage({ type: "connectivity" });
            };

            self.serviceWorkerActivates = async () => {
                if (!("serviceWorker" in navigator)) {
                    throw new Error(
                        "Service workers not supported; Tonk will not work!",
                    );
                }
                if (navigator.serviceWorker.controller) {
                    // Warm reload: already controlled. Still poke so a reload
                    // while offline reconciles the offline state.
                    await sendConnectivity();
                    return;
                }

                const controlled = new Promise((resolve) => {
                    navigator.serviceWorker.addEventListener(
                        "controllerchange",
                        resolve,
                        { once: true },
                    );
                });

                // Nudge the active worker to claim this client.
                navigator.serviceWorker.ready.then((reg) => {
                    reg.active?.postMessage({ type: "claim" });
                });

                await controlled;
                await sendConnectivity();
            };

            // Register a one-shot background sync under `tag` so a
            // local commit reaches its upstream even if the tab goes
            // offline or closes before the next in-page sweep. The
            // user agent fires the SW `sync` event when connectivity
            // returns, retrying with backoff. Rejects where the
            // Background Sync API is absent (Safari, Firefox) or
            // registration fails, so the Rust controller falls back to
            // the in-page sweep.
            self.tonkRegisterSync = async (tag) => {
                if (
                    !("serviceWorker" in navigator) ||
                    !("SyncManager" in window)
                ) {
                    throw new Error("Background Sync API unavailable");
                }
                const registration = await navigator.serviceWorker.ready;
                await registration.sync.register(tag);
            };

            // Poke the worker on connectivity TRANSITIONS so the sync indicator
            // updates immediately instead of waiting for the next fetch. The
            // active page's `online`/`offline` events are the dependable
            // trigger; the worker itself decides online-vs-offline from
            // `navigator.onLine`. The INITIAL poke is sent from
            // `serviceWorkerActivates` above (before the first data-plane call).
            self.addEventListener("online", () => sendConnectivity().catch(() => {}));
            self.addEventListener("offline", () => sendConnectivity().catch(() => {}));

            const sendVisibility = async () => {
                const reg = await navigator.serviceWorker.ready;
                reg.active?.postMessage({ type: "visibility" });
            };

            // Tell the worker when this page becomes visible so sync
            // drops its hidden interval without waiting for the next
            // keepalive to age past it.
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState !== "visible") return;
                sendVisibility().catch(() => {});
            });
        </script>
        <!-- The following are load-bearing configuration for the Trunk build tool
         (https://trunkrs.dev/assets/); if you need to add build steps or copy
         static assets, you will want to modify this condiguration here. -->
        <!-- `data-initializer` gives the static boot shell (see <body>) real
         progress callbacks for the multi-megabyte wasm fetch. -->
        <link
            data-trunk
            rel="rust"
            data-bin="ui"
            data-type="main"
            data-wasm-opt="z"
            data-initializer="assets/boot-progress.mjs"
        />
        <link
            data-trunk
            rel="rust"
            data-bin="worker"
            data-type="worker"
            data-bindgen-target="web"
            data-wasm-opt="z"
        />

        <!-- Bridge module injected by host::wrap_html_body into iframe srcdoc.
       Served at `/__tonk/bridge.js` by the dev server / CDN so the
       service-worker passthrough route can reach it without the SW
       needing to bundle and serve it internally. -->
        <link
            data-trunk
            rel="copy-file"
            href="../tonk-worker/assets/bridge.js"
            data-target-path="__tonk"
        />
        <link data-trunk rel="copy-file" href="./assets/service_worker.js" />
        <!-- Dev-only hot reload control. Copied to dist so it's
       available under `trunk serve`, but the loading `<script>` is
       injected only in debug builds by the UI shell (see ui.rs,
       `cfg(debug_assertions)`), so a production `trunk build
       --release` never loads it. It re-seeds the standard library in
       place on a `core.yaml` edit and reloads on a real code change;
       paired with `no_autoreload = true` in Trunk.toml. -->
        <link data-trunk rel="copy-file" href="./assets/hot-swap.js" />
        <link data-trunk rel="copy-dir" href="./assets/posthog" />
        <!-- The standard library (built-in concepts, views, commands,
       rules). Served as a static asset so the service
       worker can fetch and seed it at repository creation, instead of
       embedding it at compile time. Editing core.yaml updates the
       library without rebuilding the wasm. -->
        <link
            data-trunk
            rel="copy-file"
            href="../tonk-core/assets/library/core.yaml"
            data-target-path="library"
        />
        <!-- Lean profile library: only the space concept + Hub view,
       seeded onto the profile meta branch (which backs only the Hub)
       instead of the full core.yaml. -->
        <link
            data-trunk
            rel="copy-file"
            href="../tonk-core/assets/library/profile.yaml"
            data-target-path="library"
        />
        <!-- The sheets template: the tabbed workspace, seeded on top of
       core.yaml only when the "sheets" template is chosen at creation. -->
        <link
            data-trunk
            rel="copy-file"
            href="../tonk-core/assets/library/sheets.yaml"
            data-target-path="library"
        />
        <!-- The wiki template: page tree + block canvas, seeded on top
       of core.yaml only when the "wiki" template is chosen at creation. -->
        <link
            data-trunk
            rel="copy-file"
            href="../tonk-core/assets/library/wiki.yaml"
            data-target-path="library"
        />
        <!-- The board template: the pannable card canvas, seeded on top
       of core.yaml only when the "board" template is chosen at creation. -->
        <link
            data-trunk
            rel="copy-file"
            href="../tonk-core/assets/library/board.yaml"
            data-target-path="library"
        />
        <link data-trunk rel="copy-dir" href="./assets/fonts" />
        <link data-trunk rel="copy-dir" href="./assets/images" />
        <link data-trunk rel="copy-dir" href="./assets/webawesome" />
        <!-- Sealed-guest element runtime (registration-only wasm). Built as
       a wasm-bindgen `web` worker bundle so trunk compiles + watches the
       guest crate (no hand-run wasm-bindgen, no checked-in bundle). The
       worker type emits no <script> into this page — the host fetches
       `/guest/guest.js` + `guest_bg.wasm` and postMessages the bytes into
       the sealed iframe; the guest itself fetches nothing. `wasm-release`
       + `wasm-opt=z` keep it lean. -->
        <link
            data-trunk
            rel="rust"
            href="../tonk-guest/Cargo.toml"
            data-bin="guest"
            data-type="worker"
            data-bindgen-target="web"
            data-cargo-profile="wasm-release"
            data-wasm-opt="z"
            data-target-path="guest"
        />
        <!-- The esbuild-produced Web Awesome bundle + flattened CSS the host
       injects alongside the guest runtime. Only `wa.js` / `wa.css` live
       here now; the wasm/js/snippets are built by the rust link above. -->
        <link data-trunk rel="copy-dir" href="./assets/guest" />
        <link
            data-trunk
            rel="copy-file"
            href="../tonk-sigil/assets/sigils.svg"
        />
        <!-- `<tonk-code>` web component bundle. The crate's `install()`
       injects `<script type="module" src="/tonk-code/tonk-code.js">`
       at startup; chunked language packs (e.g.
       `tonk-code-lang-yaml.js`) are loaded on demand by the element
       via relative imports, so all chunks must sit next to the
       main bundle in the same directory. The trunk copy below
       preserves that layout. -->
        <link
            data-trunk
            rel="copy-dir"
            href="../tonk-code/assets"
            data-target-path="tonk-code"
        />

        <!-- `<tonk-prose>` markdown editor bundle, same layout contract
       as tonk-code above: the shell (`tonk-prose.js`) registers the
       element and lazily imports the ProseMirror core
       (`tonk-prose-editor.js`) from a sibling URL on first connect,
       so both files must sit in the same directory. Load it with the
       crate's `install("/tonk-prose/tonk-prose.js")` or a module
       script; code blocks upgrade to embedded `<tonk-code>` editors
       when that element is defined. -->
        <link
            data-trunk
            rel="copy-dir"
            href="../tonk-prose/assets"
            data-target-path="tonk-prose"
        />

        <!-- Async like the webawesome sheet above (trunk forwards the
         extra attributes to the emitted link, entity-escaped but decoded
         by the HTML parser). First paint therefore needs no external CSS
         at all — the boot shell's rules are inline in <head>. -->
        <link
            data-trunk
            rel="css"
            href="./styles.css"
            media="print"
            onload="this.onload=null;this.media='all'"
        />
    </head>

    <body>
        <!-- Static boot shell: the ONLY body content until the wasm mounts
         `<tonk-site>` — the async-stylesheet strategy in <head> depends on
         that staying true. It replicates the Hub header (wordmark + badge,
         same tokens as `.spot` in profile.yaml) so the app's own header
         appears to simply take over, and shows live wasm download progress
         via the Trunk initializer (assets/boot-progress.mjs). Styled by the
         inline critical CSS in <head>; hidden purely by CSS
         (`body:has(tonk-site)`) — the wasm never has to know it exists. -->
        <div id="tonk-boot" aria-live="polite">
            <div class="tonk-boot-brand">
                <span class="tonk-boot-logo">tonk</span>
                <span class="tonk-boot-badge">spot</span>
            </div>
            <div class="tonk-boot-center">
                <div class="tonk-boot-bar">
                    <div class="tonk-boot-fill" data-boot-fill></div>
                </div>
                <p class="tonk-boot-status" data-boot-status>loading…</p>
            </div>
        </div>

        <script type="module">
            if ("serviceWorker" in navigator) {
                await navigator.serviceWorker.register("/service_worker.js", {
                    type: "module",
                    updateViaCache: "none",
                });
            } else {
                console.error(
                    "Service workers not supported; Tonk will not work!",
                );
            }
        </script>
    </body>
</html>
