<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- The app never runs on a site's origin. The server answers an
             unknown path with this document on every hostname, a site's
             included, and the app booting there would register its worker
             over the site's and keep an account's keys in storage the site's
             own code can read. A site's hostname starts with `profile` or
             with a space's label (its key in base32), a suffix after either;
             the app's never does. Before anything else on the page runs,
             leave for the site's shell. -->
        <script>
            (() => {
                const label = location.hostname.split(".")[0];
                if (/^(profile|b[a-z2-7]{40,})(-[a-z0-9]+)?$/.test(label)) {
                    globalThis.tonkSiteOrigin = true;
                    window.stop();
                    location.replace(label.startsWith("profile") ? "/profile.html" : "/space.html");
                }
            })();
        </script>
        <!-- Rewritten alongside service_worker.js at post-build. This is the
             worker API generation this DOCUMENT was emitted against; unlike
             /version.json it never changes during the document's lifetime. -->
        <meta name="tonk-worker-build" content="dev" />
        <!-- Identity of this document's own resources, excluding the guest
             runtime and library data. When a new worker reports the same
             page build, this document keeps running and remounts its guests
             instead of reloading. -->
        <meta name="tonk-page-build" content="dev" />
        <script>
            (() => {
                const build = document.querySelector(
                    'meta[name="tonk-worker-build"]',
                )?.content;
                // `dev` deliberately remains unstamped: the worker uses the
                // same placeholder but the production wire format is exactly
                // 16 lowercase hex characters. The post-build step replaces
                // the meta value before anything can be deployed.
                if (/^[0-9a-f]{16}$/.test(build || "")) {
                    globalThis.tonkBuild = build;
                }
            })();
        </script>
        <!-- Tell the browser to render native chrome (scrollbars, form
       controls, etc.) in either mode — the actual mode is selected
       reactively by the script below based on the OS preference. -->
        <meta name="color-scheme" content="light dark" />
        <meta name="title" content="Tonk" />
        <meta
            name="description"
            content="Tonk makes your small software live and ready to share right away."
        />
        <meta name="robots" content="index, follow" />

        <title>Tonk</title>

        <meta property="og:title" content="Small software travels well" />
        <meta
            property="og:description"
            content="Tonk makes your small software live and ready to share right away."
        />
        <meta property="og:url" content="https://tonk.xyz" />
        <meta property="og:site_name" content="Tonk" />
        <meta property="og:locale" content="en_US" />
        <meta
            property="og:image"
            content="https://tonk.xyz/tonk-media-preview.png"
        />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Small software travels well" />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Small software travels well" />
        <meta
            name="twitter:description"
            content="Tonk makes your small software live and ready to share right away."
        />
        <meta
            name="twitter:image"
            content="https://tonk.xyz/tonk-media-preview.png"
        />

        <link rel="icon" type="image/png" href="/images/tonk-icon.png" />
        <link rel="apple-touch-icon" href="/images/tonk-icon.png" />

        <!-- All the styling this page has. It frames the profile's site,
       which fills it, shows this boot shell until then, and now and
       again a passkey prompt; each site loads the app's stylesheet and
       fonts itself. Colours follow the `color-scheme` meta above. -->
        <style>
            :root {
                --ink: light-dark(#38182a, #e2dfdd);
                --on-ink: light-dark(#f7f6f5, #161313);
                --card: light-dark(#fcfbfb, #211c1c);
                --ring: light-dark(rgb(56 24 42 / 85%), rgb(226 223 221 / 85%));
            }
            html,
            body {
                margin: 0;
                padding: 0;
                overscroll-behavior: none;
                background: light-dark(#e8e6e4, #161313);
                color: var(--ink);
                font-family: system-ui, sans-serif;
            }
            tonk-site {
                display: contents;
            }
            #tonk-boot {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                flex-direction: column;
                padding: 26px 38px 30px;
                background: light-dark(#e8e6e4, #161313);
                color: var(--ink);
            }
            /* CSS-only teardown: the wasm mounts <tonk-site> into <body>
               and this rule fades the shell out — the app never has to
               know the shell exists. The delay gives the mounted site a
               beat to paint its own surface underneath; `visibility`
               flips after the fade so the shell can't intercept clicks
               it no longer visually owns. */
            body:has(tonk-site) #tonk-boot {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition:
                    opacity 400ms ease 300ms,
                    visibility 0s 700ms;
            }
            /* Destination-neutral loading indicator. */
            .tonk-boot-center {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
            }
            .tonk-pulse {
                display: inline-block;
                width: 18px;
                height: 18px;
                flex: none;
                border-radius: 50%;
                background: currentcolor;
                transform-origin: center;
                animation: tonk-pulse 2s cubic-bezier(0.4, 0, 0.6, 1)
                    infinite;
            }
            .tonk-boot-title {
                display: none;
                max-width: 36rem;
                margin: 0;
                font-family:
                    "IBM Plex Sans Condensed", "Arial Narrow", system-ui,
                    sans-serif;
                font-size: clamp(1.75rem, 5vw, 2.5rem);
                font-weight: 600;
                line-height: 1.1;
                text-align: center;
                text-wrap: balance;
            }
            .tonk-boot-status {
                position: absolute;
                width: 1px;
                height: 1px;
                margin: -1px;
                padding: 0;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
                font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
                font-size: 12px;
                color: light-dark(#5b4953, #c8c3bf);
            }
            .tonk-boot-status[data-failed] {
                position: static;
                width: min(36rem, 100%);
                height: auto;
                margin: 0;
                overflow: visible;
                clip: auto;
                white-space: normal;
                font-family: "IBM Plex Sans", system-ui, sans-serif;
                font-size: 1rem;
                line-height: 1.5;
                text-align: center;
                text-wrap: pretty;
            }
            .tonk-boot-center:has(.tonk-boot-status[data-failed])
                .tonk-boot-title {
                display: block;
            }
            .tonk-boot-center:has(.tonk-boot-status[data-failed]) .tonk-pulse {
                display: none;
            }
            @keyframes tonk-pulse {
                0%,
                100% {
                    opacity: 1;
                    scale: 0.33;
                }
                50% {
                    opacity: 0.35;
                    scale: 1;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .tonk-pulse {
                    animation: none;
                    opacity: 1;
                    scale: 0.5;
                }
            }
        </style>

        <!-- PostHog analytics, self-hosted (no external CDN, matching
       the font policy above). The bundle only defines window.posthog;
       it is initialized — or left dormant — by the ui binary via
       tonk-analytics, and only when a TONK_POSTHOG_KEY was baked in
       at build time. Opt-out: localStorage "tonk:telemetry" = "off". -->
        <script defer src="/posthog/posthog.js"></script>

        <!-- This origin's worker answers every address here with this one
         page, and keeps what the page loads so it opens with no network.
         Nothing on the page waits for it. A site's origin registers its
         own worker and never this one. -->
        <script>
            if ("serviceWorker" in navigator && !globalThis.tonkSiteOrigin) {
                navigator.serviceWorker
                    .register("/service_worker.js", { updateViaCache: "none" })
                    .catch(() => {});
            }
        </script>
        <!-- The following are load-bearing configuration for the Trunk build tool
         (https://trunkrs.dev/assets/); if you need to add build steps or copy
         static assets, you will want to modify this condiguration here. -->
        <!-- `data-initializer` gives the static boot shell (see <body>) real
         progress callbacks for the multi-megabyte wasm fetch. -->
        <link
            data-trunk
            rel="rust"
            data-bin="ui"
            data-cargo-profile-release="wasm-ui-release"
            data-type="main"
            data-wasm-opt="z"
            data-initializer="assets/boot-progress.mjs"
        />
        <link
            data-trunk
            rel="rust"
            data-bin="worker"
            data-cargo-profile-release="wasm-worker-release"
            data-type="worker"
            data-bindgen-target="web"
            data-wasm-opt="z"
        />

        <link data-trunk rel="copy-file" href="./assets/service_worker.js" />
        <!-- Served on every space origin: its shell and its worker. -->
        <link data-trunk rel="copy-file" href="./assets/space.html" />
        <link data-trunk rel="copy-file" href="./assets/profile.html" />
        <link data-trunk rel="copy-file" href="./assets/space_worker.js" />
        <link
            data-trunk
            rel="copy-file"
            href="./assets/tonk-media-preview.png"
        />
        <!-- Cache policy for Cloudflare Workers Assets. `immutable` on the
       content-hashed bundles, `no-store` on the service-worker chain and
       live build metadata. -->
        <link data-trunk rel="copy-file" href="./assets/_headers" />
        <link data-trunk rel="copy-dir" href="./assets/agent" />
        <link rel="help" href="/agent/" title="Agent invitation: CLI connection instructions" />
        <!-- Dev-only hot reload control. Copied to dist so it's
       available under `trunk serve`, but the loading `<script>` is
       injected only in debug builds by the UI shell (see ui.rs,
       `cfg(debug_assertions)`), so a production `trunk build
       --release` never loads it. It re-seeds the standard library in
       place on a `core.yaml` edit and reloads on a real code change;
       paired with `no_autoreload = true` in Trunk.toml. -->
        <link data-trunk rel="copy-file" href="./assets/hot-swap.js" />
        <link data-trunk rel="copy-dir" href="./assets/posthog" />
        <!-- The standard library (built-in concepts, views, commands,
       rules, templates, and the media they use). Served as static
       assets so the service worker can fetch and seed it at repository
       creation, instead of embedding it at compile time; editing
       core.yaml updates the library without rebuilding the wasm. The
       whole directory is copied, not a list of files: a library
       document can `!include` a file beside it, and the worker fetches
       that file from the same served `/library/` directory. -->
        <link
            data-trunk
            rel="copy-dir"
            href="../tonk-core/assets/library"
            data-target-path="library"
        />
        <link data-trunk rel="copy-dir" href="./assets/fonts" />
        <link data-trunk rel="copy-dir" href="./assets/images" />
        <link data-trunk rel="copy-dir" href="./assets/webawesome" />
        <!-- Sealed-guest element runtime (registration-only wasm). Built as
       a wasm-bindgen `web` worker bundle so trunk compiles + watches the
       guest crate (no hand-run wasm-bindgen, no checked-in bundle). The
       worker type emits no <script> into this page — the host fetches
       `/guest/guest.js` + `guest_bg.wasm` and postMessages the bytes into
       the sealed iframe; the guest itself fetches nothing. `wasm-release`
       + `wasm-opt=z` keep it lean. -->
        <link
            data-trunk
            rel="rust"
            href="../tonk-guest/Cargo.toml"
            data-bin="guest"
            data-type="worker"
            data-bindgen-target="web"
            data-cargo-profile="wasm-release"
            data-wasm-opt="z"
            data-target-path="guest"
        />
        <!-- The esbuild-produced Web Awesome bundle + flattened CSS the host
       injects alongside the guest runtime. Only `wa.js` / `wa.css` live
       here now; the wasm/js/snippets are built by the rust link above. -->
        <link data-trunk rel="copy-dir" href="./assets/guest" />
        <!-- `<tonk-code>` web component bundle. On a plain page the crate's
       `install()` injects `<script type="module"
       src="/tonk-code/tonk-code.js">`; inside a sealed guest the bundle is
       relayed on demand over `need-code` (nothing rides the guest boot
       payload — see `tonk-portal/src/bridge.rs`). Either way the chunked
       language packs (e.g. `tonk-code-lang-yaml.js`) are loaded on demand
       by the element via relative imports, so all chunks must sit next to
       the main bundle in the same directory. The trunk copy below
       preserves that layout. -->
        <link
            data-trunk
            rel="copy-dir"
            href="../tonk-code/assets"
            data-target-path="tonk-code"
        />

        <!-- `<tonk-prose>` markdown editor bundle, same layout contract
       as tonk-code above: the shell (`tonk-prose.js`) registers the
       element and lazily imports the ProseMirror core
       (`tonk-prose-editor.js`) from a sibling URL on first connect,
       so both files must sit in the same directory. Load it with the
       crate's `install("/tonk-prose/tonk-prose.js")` or a module
       script; code blocks upgrade to embedded `<tonk-code>` editors
       when that element is defined. -->
        <link
            data-trunk
            rel="copy-dir"
            href="../tonk-prose/assets"
            data-target-path="tonk-prose"
        />

        <!-- `<tonk-table>` IronCalc spreadsheet bundle, same layout
       contract as tonk-prose above: the shell (`tonk-table.js`)
       registers the element and lazily imports the grid core
       (`tonk-table-grid.js`) from a sibling URL on first connect; the
       grid in turn pulls `tonk-table-engine.js` (the base64-embedded
       IronCalc engine wasm) the same way, so all three files must sit
       in the same directory. Load it with the crate's
       `install("/tonk-table/tonk-table.js")` or a module script. -->
        <link
            data-trunk
            rel="copy-dir"
            href="../tonk-table/assets"
            data-target-path="tonk-table"
        />

        <!-- The app's stylesheet is the sites' to load, not this page's:
         copied as a file, named by its content in the guest manifest
         (`scripts/hash-guest.sh`), and linked by each site's own frame. -->
        <link data-trunk rel="copy-file" href="./styles.css" />
    </head>

    <body>
        <!-- Static boot shell: the ONLY body content until the wasm mounts
         `<tonk-site>`. It shows the shared loading pulse while the Trunk
         initializer reports progress to assistive technology. Styled by the inline
         CSS in <head>; hidden purely by CSS
         (`body:has(tonk-site)`) — the wasm never has to know it exists. -->
        <div id="tonk-boot" aria-live="polite">
            <div class="tonk-boot-center">
                <span class="tonk-pulse" aria-hidden="true"></span>
                <h1 class="tonk-boot-title" data-boot-title>
                    Tonk couldn’t start
                </h1>
                <p class="tonk-boot-status" data-boot-status>loading…</p>
            </div>
        </div>

    </body>
</html>
