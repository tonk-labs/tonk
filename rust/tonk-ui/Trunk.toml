[build]
public_url = "/"
offline = true

# Content-hash the sealed-guest runtime assets after each build. Trunk's
# worker-type rust asset (the guest bundle) and the copy-dir'd wa.js/wa.css
# are emitted unhashed; this hook renames them to `<name>-<hash>.<ext>` and
# writes `guest/manifest.json` so the portal can load cache-immutable URLs.
# Runs on every (re)build, including incremental `trunk serve` rebuilds.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["scripts/hash-guest.sh"]

[serve]
port = 8080
# Disable trunk's built-in reload-everything client. A change to a
# served asset (notably `/library/core.yaml`) otherwise reloads the
# whole page even when no code changed. The dev-only `hot-swap.js`
# client connects to trunk's change channel instead and re-seeds the
# standard library in place, reloading only on a genuine wasm change.
no_autoreload = true

[watch]
# Watch every workspace crate that contributes to a served bundle, so an edit
# triggers a rebuild instead of silently serving a stale binary. Three bundles
# pull from the workspace:
#   - tonk-ui wasm (the page) — directly + via the in-SW tonk-worker.
#   - tonk-worker (the SW) — incl. tonk-router (route matching).
#   - the sealed-guest wasm (tonk-guest) — display/board/workspace/tree/
#     inspector/portal/sigil register the elements rendered inside the iframe.
# A crate missing here means its edits never reach the dev server (e.g. a
# tonk-inspector change wouldn't rebuild the guest bundle).
#
# `../tonk-code/assets` is also watched: tonk-code's `<tonk-code>` element bundle
# is copied into the dist via `<link data-trunk rel="copy-dir">`, but `copy-dir`
# only re-copies when trunk's watcher fires. Without this entry, a fresh
# `npm run build` in tonk-code wouldn't reach the served dist (stale JS). The same
# applies to `../tonk-prose/assets` (the `<tonk-prose>` markdown editor bundle)
# and `../tonk-table/assets` (the `<tonk-table>` IronCalc spreadsheet bundle),
# plus the guest Web Awesome bundle under `./assets/guest` (covered by `./`).
watch = [
    "./",
    "../tonk-common",
    "../tonk-core",
    "../tonk-worker",
    "../dialog-reactor",
    "../tonk-router",
    "../tonk-language-server",
    "../tonk-analyzer",
    "../tonk-evaluator",
    "../tonk-schema",
    "../tonk-notation",
    "../tonk-board",
    "../tonk-workspace",
    "../tonk-display",
    "../tonk-host",
    "../tonk-portal",
    "../tonk-guest/src",
    "../tonk-fab/src",
    "../tonk-inspector/src",
    "../tonk-sigil/src",
    "../tonk-code/assets",
    "../tonk-prose/assets",
    "../tonk-table/assets",
    "../tonk-tree/src",
]

# Proxies for /ucan/ and /@ are appended by the dev:web command, which
# points both at the access service it started (or, for /ucan/, at
# UCAN_ENDPOINT). Their backend is only known at runtime, and trunk's TOML
# does not interpolate, so they cannot be written here.

# Serve the user guide at /guide/, matching the path it ships at on the
# deployed site. The `dev:web` command launches `mdbook serve` on port
# 3001 (its own live-reload server); trunk proxies `/guide/*` to it.
# `rewrite` strips the `/guide/` prefix so a request for
# `/guide/introduction.html` reaches mdbook as `/introduction.html`.
# Editing files under `guide/src` reloads through mdbook's own watcher,
# independent of the trunk rebuild.
[[proxies]]
backend = "http://127.0.0.1:3001/"
rewrite = "/guide/"

# mdbook's live-reload client connects a WebSocket to `/__livereload`
# (a fixed path at the page host, not under /guide/), so it needs its
# own proxy entry. Without this, editing the guide would not hot-reload.
[[proxies]]
backend = "http://127.0.0.1:3001/__livereload"
rewrite = "/__livereload"
ws = true
