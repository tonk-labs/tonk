component!:
  this: id:todo-delete-v2
  module: |2
    (() => {
      if (customElements.get('todo-delete-v2')) return;
      customElements.define('todo-delete-v2', class extends HTMLElement {
        connectedCallback() {
          if (this.__armed) return;
          this.__armed = true;
          this.setAttribute('role', 'button');
          this.setAttribute('tabindex', '0');
          this.addEventListener('pointerdown', (event) => {
            if (event.button !== 0) return;
            event.preventDefault();
            this.removeTodo();
          });
          this.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            this.removeTodo();
          });
        }
        removeTodo() {
          if (this.__sent) return;
          const id = this.getAttribute('data-remove') || '';
          if (!id || id.includes('{')) return;
          this.__sent = true;
          const row = this.closest('.t');
          const view = this.closest('tonk-view');
          if (row) row.classList.add('is-removing');
          if (view) view.classList.add('todo-removing');
          this.dispatchEvent(new CustomEvent('tododelete', { bubbles: true }));
          setTimeout(() => {
            if (!this.isConnected) return;
            this.__sent = false;
            if (row) row.classList.remove('is-removing');
            if (view) view.classList.remove('todo-removing');
          }, 8000);
        }
      });
    })();


