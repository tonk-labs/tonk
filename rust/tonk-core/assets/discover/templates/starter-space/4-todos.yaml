      #tf-all:checked ~ .hd .tagf[data-t="all"] { background: var(--chip-on-bg); color: var(--chip-on-fg); font-weight: 600; }
      #af-all:checked ~ .hd .tagf[data-a="all"] { background: var(--chip-on-bg); color: var(--chip-on-fg); font-weight: 600; }
      .fsep { flex: none; width: 1px; height: 17px; background: var(--line); margin: 0 3px; }
      .stage { display: flex; flex-direction: column; gap: 2px; }
      .ch, .cp { display: none; }
      .ch { order: -3; align-items: center; gap: 8px; margin-bottom: 2px; font-size: 20px; font-weight: 700; letter-spacing: -0.014em; }
      .ch .ic { width: 20px; height: 20px; }
      .cp { order: -2; align-items: center; margin: 2px 0 10px; }
      .cp form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; }
      .cp input[type="text"] {
        flex: 1 1 auto; min-width: 0; padding: 9px 12px 9px 34px; border: 1px solid transparent; border-radius: 9px;
        background: var(--hover) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%238a8a8e' stroke-width='2' stroke-linecap='round'><path d='M8 3.5v9M3.5 8h9'/></svg>") no-repeat 11px center;
        color: var(--fg); font: inherit; outline: none; transition: background 140ms ease, border-color 140ms ease;
      }
      .cp input[type="text"]::placeholder { color: var(--mut); }
      .cp input[type="text"]:focus { background-color: var(--card); border-color: var(--blue); box-shadow: 0 0 0 3px rgba(61,123,217,.16); }
      .cp input[type="date"] {
        flex: 0 1 auto; min-width: 0; max-width: 100%; box-sizing: border-box;
        padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px;
        background: var(--card); color: var(--mut); font: inherit; font-size: 13px; outline: none;
      }
      .day { display: none; margin: 14px 0 4px; }
      .day-h {
        display: flex; align-items: baseline; gap: 8px; padding: 0 8px 6px;
        border-bottom: 1px solid var(--line); margin-bottom: 4px;
      }
      .day-h b { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
      .day-h span { font-size: 12px; color: var(--mut); }
      .t { display: none; align-items: flex-start; gap: 10px; padding: 7px 8px; border-radius: 8px; transition: background 120ms ease; }
      .app tonk-view.todo-removing { display: none !important; }
      .day .t { display: flex !important; }
      .t:hover { background: var(--hover); }
