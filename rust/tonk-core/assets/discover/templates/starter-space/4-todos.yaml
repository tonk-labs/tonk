        align-self: stretch; min-width: 0; width: auto; box-sizing: border-box;
        margin: 2px 9px 6px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px;
        background: var(--card); color: var(--fg); font: inherit; font-size: 12.5px; outline: none;
      }
