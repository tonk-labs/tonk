      .tab[data-b="inbox"] .ic, .ch[data-b="inbox"] .ic { color: #4a8df6; }
      #tdb-inbox:checked ~ .hd .tab[data-b="inbox"] { background: var(--sel); color: var(--fg); }
      #tdb-inbox:checked ~ .stage .ch[data-b="inbox"],
