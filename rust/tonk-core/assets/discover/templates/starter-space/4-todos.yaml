# SPDX-License-Identifier: CC0-1.0
# Tonk asserted notation. Repeated top-level keys are intentional.
#
# Starter space — Todos
#
# To-Dos demo: lists, tags, scheduling, and day slots
#
# One of 8 notation documents that recreate the Tonk starter space in a
# fresh space. Evaluate them in file order:
#
#   tonk eval 1-vault.yaml
#   tonk eval 2-pages.yaml
#   tonk eval 3-news.yaml
#   tonk eval 4-todos.yaml
#   tonk eval 5-budget.yaml
#   tonk eval 6-dots.yaml
#   tonk eval 7-zork.yaml
#   tonk eval 8-playground.yaml
#
# Exported from the live space on 2026-09-08 with Tonk 0.6.12. Blobs are
# embedded as data: URIs. Runtime state (per-device state, session
# transcripts, agent heartbeats, the roster, and history) is left out.
#
# Author: Tonk <hello@tonk.xyz>. The authors' own work is CC0 1.0; embedded
# fonts and third-party artwork keep their own licenses (see LICENSE.txt
# in the vault).


# ==========================================================================
# Attributes
# ==========================================================================

attribute!: &day-date
  description: "The calendar date this section groups, as YYYY-MM-DD"
  the: xyz.tonk.day/date
  as: Text
  cardinality: one

attribute!: &day-label
  description: "Human-readable heading for the date, e.g. \"Wed 26 Aug\". Absolute rather than relative (\"Tomorrow\") so it never goes stale between rebuilds."
  the: xyz.tonk.day/label
  as: Text
  cardinality: one

attribute!: &day-rank
  description: "Sort key for the date, so sections order without date arithmetic in CSS"
  the: xyz.tonk.day/rank
  as: UnsignedInteger
  cardinality: one

attribute!: &day-todo
  description: "A to-do scheduled on this day"
  the: xyz.tonk.day/todo
  as: Entity
  cardinality: many

attribute!: &tag-name
  description: "The tag's display name"
  the: xyz.tonk.tag/name
  as: Text
  cardinality: one

attribute!: &todo-assignee
  description: "The space member this to-do is assigned to"
  the: xyz.tonk.todo/assignee
  as: Entity
  cardinality: one

attribute!: &todo-bucket
  description: "Which list the to-do sits in: inbox, today, upcoming, anytime"
  the: xyz.tonk.todo/bucket
  as: Text
  cardinality: one

attribute!: &todo-created
  description: "Creation timestamp, used for stable ordering within a list"
  the: xyz.tonk.todo/created
  as: Float
  cardinality: one

attribute!: &todo-done
  description: "Whether the to-do is completed"
  the: xyz.tonk.todo/done
  as: Boolean
  cardinality: one

attribute!: &todo-due
  description: "Scheduled date as YYYY-MM-DD, or \"none\" when unscheduled"
  the: xyz.tonk.todo/due
  as: Text
  cardinality: one

attribute!: &todo-tag
  description: "A tag on the to-do. Many per to-do."
  the: xyz.tonk.todo/tag
  as: Text
  cardinality: many

attribute!: &todo-title
  description: "The to-do's title"
  the: xyz.tonk.todo/title
  as: Text
  cardinality: one

attribute!: &todos-heading
  description: "Marks the vault note hosting the To-Dos demo; doubles as the page H1"
  the: xyz.tonk.demo.todos/heading
  as: Text
  cardinality: one


# ==========================================================================
# Concepts
# ==========================================================================

concept!: &day
  description: "A dated section grouping scheduled to-dos"
  with:
    date: day-date
    label: day-label
    rank: day-rank
    todo: day-todo

concept!: &day-slot
  description: "A date that can hold scheduled to-dos"
  with:
    date: day-date
    label: day-label
    rank: day-rank

concept!: &tag
  description: "A tag to-dos can be filed under"
  with:
    name: tag-name

concept!: &tagging
  description: "The tags carried by a to-do"
  with:
    tag: todo-tag

concept!: &todo
  description: "A to-do item in the shared list"
  with:
    assignee: todo-assignee
    bucket: todo-bucket
    created: todo-created
    done: todo-done
    due: todo-due
    title: todo-title

concept!: &todos-demo-page
  description: "The To-Dos demo - a Things-style shared list rendered as a vault page"
  with:
    heading: todos-heading


# ==========================================================================
# Commands (transient concepts fired by the UI)
# ==========================================================================

command!: &addtag
  with:
    tag:
      description: "The tag name being removed"
      the: dom.event.current-target.dataset/tagname
      as: Text
      cardinality: one
    todo:
      description: "The to-do gaining a tag"
      the: dom.event.current-target.dataset/addtag
      as: Entity
      cardinality: one

command!: &assign
  with:
    member:
      description: "The member to assign it to"
      the: dom.event.current-target.dataset/member
      as: Entity
      cardinality: one
    todo:
      description: "The to-do being reassigned"
      the: dom.event.current-target.dataset/assign
      as: Entity
      cardinality: one

command!: &compose
  with:
    assignee:
      description: "Member the new to-do is assigned to"
      the: dom.event.current-target.dataset/assignee
      as: Entity
      cardinality: one
    bucket:
      description: "The list to move it into"
      the: dom.event.current-target.dataset/bucket
      as: Text
      cardinality: one
    due:
      description: "Date for the new to-do, or \"none\" from the hidden input"
      the: dom.event.current-target.form.elements.due/value
      as: Text
      cardinality: one
    time:
      description: "The submit event's timestamp; makes each click distinct."
      the: dom.event/time-stamp
      as: Float
      cardinality: one
    title:
      description: "Title typed into the composer"
      the: dom.event.current-target.form.elements.title/value
      as: Text
      cardinality: one

command!: &move
  with:
    bucket:
      description: "The list to move it into"
      the: dom.event.current-target.dataset/bucket
      as: Text
      cardinality: one
    todo:
      description: "The to-do being moved"
      the: dom.event.current-target.dataset/move
      as: Entity
      cardinality: one

command!: &remove
  with:
    todo:
      description: "The to-do being deleted"
      the: dom.event.current-target.dataset/remove
      as: Entity
      cardinality: one

command!: &schedule
  with:
    due:
      description: "The new name, read from the editable's value on commit."
      the: dom.event.current-target/value
      as: Text
      cardinality: one
    todo:
      description: "The to-do being scheduled"
      the: dom.event.current-target.dataset/schedule
      as: Entity
      cardinality: one

command!: &toggle
  with:
    todo:
      description: "The to-do whose done state is being flipped"
      the: dom.event.current-target.dataset/toggle
      as: Entity
      cardinality: one

command!: &untag
  with:
    tag:
      description: "The tag name being removed"
      the: dom.event.current-target.dataset/tagname
      as: Text
      cardinality: one
    todo:
      description: "The to-do losing a tag"
      the: dom.event.current-target.dataset/removetag
      as: Entity
      cardinality: one


# ==========================================================================
# Rules
# ==========================================================================

rule!:
  assert: day
  when:
    - assert: day-slot
      where: { this: ?this, date: ?date, rank: ?rank, label: ?label }
    - assert: todo
      where: { this: ?todo, due: ?date, done: _, title: _, bucket: "upcoming", created: _, assignee: _ }

rule!:
  assert!: tagging
  when:
    - assert: addtag
      where: { tag: ?tag, todo: ?this }

rule!:
  retract!: tagging
  when:
    - assert: untag
      where: { tag: ?tag, todo: ?this }

rule!:
  assert!: todo
  when:
    - assert: assign
      where: { todo: ?this, member: ?assignee }
    - assert: todo
      where: { this: ?this, due: ?due, done: ?done, title: ?title, bucket: ?bucket, created: ?created, assignee: _ }

rule!:
  assert!: todo
  when:
    - assert: compose
      where: { this: ?this, due: ?due, time: ?created, title: ?title, bucket: ?bucket, assignee: ?assignee }
    - assert: ==
      where: { this: false, is: ?done }

rule!:
  assert!: todo
  when:
    - assert: move
      where: { todo: ?this, bucket: ?bucket }
    - assert: todo
      where: { this: ?this, due: _, done: ?done, title: ?title, bucket: _, created: ?created, assignee: ?assignee }
    - assert: ==
      where: { this: "none", is: ?due }

rule!:
  assert!: todo
  when:
    - assert: schedule
      where: { due: ?due, todo: ?this }
    - assert: todo
      where: { this: ?this, due: _, done: ?done, title: ?title, bucket: _, created: ?created, assignee: ?assignee }
    - assert: ==
      where: { this: "upcoming", is: ?bucket }

rule!:
  assert!: todo
  when:
    - assert: toggle
      where: { todo: ?this }
    - assert: todo
      where: { this: ?this, due: ?due, done: false, title: ?title, bucket: ?bucket, created: ?created, assignee: ?assignee }
    - assert: ==
      where: { this: true, is: ?done }

rule!:
  assert!: todo
  when:
    - assert: toggle
      where: { todo: ?this }
    - assert: todo
      where: { this: ?this, due: ?due, done: true, title: ?title, bucket: ?bucket, created: ?created, assignee: ?assignee }
    - assert: ==
      where: { this: false, is: ?done }

rule!:
  retract!: todo
  when:
    - assert: remove
      where: { todo: ?this }
    - assert: todo
      where: { this: ?this, due: ?due, done: ?done, title: ?title, bucket: ?bucket, created: ?created, assignee: ?assignee }


# ==========================================================================
# Views
# ==========================================================================

view!:
  this: day
  show:
    directory: |2
      <section class="day" style="order:{rank}">
        <div class="day-h"><b>{label}</b><span>{date}</span></div>
        <tonk-display entity={todo} model=todo></tonk-display>
      </section>

view!:
  this: tagging
  show:
    ui: |2
      <span class="tags"><span class="tag" data-tag="t-{tag}">{tag}</span></span>

view!:
  this: todo
  show:
    ui: |2
      <div class="t" data-bucket="b-{bucket}" data-done="d-{done}" data-assignee={assignee} style="order:{created}">
        <button class="check" onclick=toggle data-toggle={this} aria-label="Toggle done">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>
        </button>
        <div class="body">
          <span class="title">{title}</span>
          <tonk-display entity={this} model=tagging><span slot="no-entity" style="display:none"></span></tonk-display>
          <span class="who"><tonk-display entity={assignee} model=member view=label></tonk-display></span>
        </div>
        <div class="acts">
          <div class="menu">
            <button class="mb" aria-label="Actions">&#8943;</button>
            <div class="pop">
              <div class="pop-h">Assign to</div>
              <button onclick=assign data-assign={this} data-member="did:key:z6MkCkkvsRH3ErzS8NCwqhxd1VAHCsHyJjx1BduJt3o3QLsG">brave-otter</button><button onclick=assign data-assign={this} data-member="did:key:z6MkFMJAa7dqnJkekBa2ejMYgLzBkeq9N7TFuJHBpUjd74Rf">gavin</button>
              <div class="sep"></div>
              <div class="pop-h">Move to</div>
              <button onclick=move data-move={this} data-bucket="inbox"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h4l1.5 2.5h7L17 13h4M3 13l3-8h12l3 8v6H3v-6z"/></svg>Inbox</button><button onclick=move data-move={this} data-bucket="today"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9L12 3.5z"/></svg>Today</button><button onclick=move data-move={this} data-bucket="anytime"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l8.5 4.5-8.5 4.5L3.5 8 12 3.5zM3.5 12.5L12 17l8.5-4.5M3.5 16.5L12 21l8.5-4.5"/></svg>Anytime</button>
              <div class="sep"></div>
              <div class="pop-h">Schedule</div>
              <input type="date" onchange=schedule data-schedule={this} aria-label="Schedule date">
              <div class="sep"></div>
              <div class="pop-h">Tag</div>
              <div class="tagrow"><button onclick=addtag data-addtag={this} data-tagname="design">#design</button><button class="x" onclick=untag data-removetag={this} data-tagname="design" title="Remove #design">&#215;</button></div><div class="tagrow"><button onclick=addtag data-addtag={this} data-tagname="engineering">#engineering</button><button class="x" onclick=untag data-removetag={this} data-tagname="engineering" title="Remove #engineering">&#215;</button></div><div class="tagrow"><button onclick=addtag data-addtag={this} data-tagname="ops">#ops</button><button class="x" onclick=untag data-removetag={this} data-tagname="ops" title="Remove #ops">&#215;</button></div>
              <div class="sep"></div>
              <todo-delete-v2 class="del" ontododelete=remove data-remove={this}>Delete</todo-delete-v2>
            </div>
          </div>
        </div>
      </div>
    directory: |2
      <tonk-display entity={this} model={dom.host/model}></tonk-display>

view!:
  this: todos-demo-page
  show:
    ui: |2
      <main class="app">
      <style>
      .app {
        --bg: #ffffff; --fg: #1d1d1f; --mut: #8a8a8e; --line: #ececee;
        --sel: #eceef2; --blue: #3d7bd9; --card: #ffffff; --hover: #f4f4f6;
        --pill: rgba(120,120,128,.14); --pill-fg: #55555a;
        /* Selected filter chip: a filled periwinkle pill, dark text — the
           one saturated affordance in the header. Same pair in both themes;
           it reads on white and on #1c1c1e alike. */
        --chip-on-bg: #8ea9f7; --chip-on-fg: #14213f;
        /* The assignee pill inverts: background takes the text colour and
           vice versa, so it flips with the theme on its own. */
        --who-bg: var(--fg); --who-fg: var(--bg);
        --check-line: #d1d1d6; --mb-hover: #e4e4e8;
        color-scheme: light;
        /* A deliberate card in the pane rather than a bare column: bordered,
           softly lifted, with the pane's surface showing around it. */
        box-sizing: border-box; width: min(700px, calc(100% - 28px)); margin: 26px auto 48px;
        padding: 26px 22px 48px; background: var(--bg); color: var(--fg);
        border: 1px solid var(--line); border-radius: 14px;
        box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 32px rgba(0,0,0,.06);
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .app *, .app *::before, .app *::after { box-sizing: border-box; }
      .app tonk-display, .app tonk-view { display: contents; }
      .st { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
      .ic { width: 17px; height: 17px; flex: none; }
      .ttl { margin: 0 0 18px; font-size: 27px; font-weight: 700; letter-spacing: -0.021em; }
      .tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
      .tabs::-webkit-scrollbar, .filters::-webkit-scrollbar { display: none; }
      .tab {
        display: flex; align-items: center; gap: 7px; flex: none; padding: 7px 13px 7px 10px;
        border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--mut);
        cursor: pointer; user-select: none; white-space: nowrap; transition: background 140ms ease;
      }
      .tab:hover { background: var(--hover); }
      .filters {
        display: flex; align-items: center; gap: 6px; overflow-x: auto;
