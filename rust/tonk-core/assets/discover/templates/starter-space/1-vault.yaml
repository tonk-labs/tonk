    # LICENSE

    ## The Starter space — CC0 1.0

    To the extent possible under law, the authors of this space have waived all copyright and related or neighboring rights to everything they created in it: the notes, the page views, the component code, the schema, and the demo apps.

    [CC0 1.0 Universal Public Domain Dedication](https://creativecommons.org/publicdomain/zero/1.0/)

    You may copy, modify, distribute and build on this work, including for commercial purposes, without asking permission and without attribution.

    This dedication covers only what the space's own authors wrote. Material that came from other people keeps its own license.

    ## Third-party material

    ### Embedded styles and images

    The **How to Tonk** page adapts the visual language of *Notes, Lists & Arrow flows*, a [Figma Community file](https://www.figma.com/community/file/953798252884802903/notes-lists-arrow-flows) licensed CC BY 4.0. It also shows seven frogs cropped from the preview image of the *Dressed Frog* [sticker pack](https://stickerdl.com/dressed-frog/) with an unknown license.

    ### Embedded fonts

    The space stores font files (Gestalte, Charter, IBM Plex Mono) as blobs so that pages render without reaching a font CDN. Those files keep the licenses of their respective foundries and are **not** covered by the dedication above. Bonus: you may use Gestalte without a license within Tonk.

    ## Inspirations

    The demos below are independent implementations written for this space. They are homages: no code, text, artwork, or data from the originals is included, and none of the rights holders are affiliated with this space or have endorsed it.

    - **Tonk News** — inspired by [Hacker News](https://news.ycombinator.com/).

    - **Dots** — inspired by the color-connecting puzzle game *[Dots](https://en.wikipedia.org/wiki/Dots_\(video_game\))*.

    *Zork I: The Great Underground Empire* (Infocom) is MIT License. The space stores only what players type and the state of their session; nothing from the original game ships with it.

    Names and trademarks appear only to identify the works that inspired these demos, and remain the property of their respective owners.

