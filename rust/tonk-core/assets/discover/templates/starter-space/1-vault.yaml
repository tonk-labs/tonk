          // Never offer a destination inside the thing being moved.
          const rows = this.destinations().filter((d) =>
            (!d.id || !this.isInside(d.id, this.__moveFor)) &&
            (!q || d.label.toLowerCase().includes(q)));
          this.__moveRows = rows;
          if (this.__moveIndex >= rows.length) this.__moveIndex = Math.max(0, rows.length - 1);
          list.innerHTML = rows.length
            ? rows.map((d, i) =>
                '<div class="vt-palette__row' +
                (i === this.__moveIndex ? ' is-on' : '') +
                '" data-dest="' + i + '">' + lib.esc(d.label) + '</div>').join('')
            : '<div class="vt-palette__none">No matching folder.</div>';
          const on = list.querySelector('.is-on');
          if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
        }

        // --- drag and drop ---------------------------------------------
        onDragStart(e) {
          const row = e.target.closest('.vt-row');
          if (!row) return;
          this.__drag = row.dataset.node;
          this.closeMenu();
          if (e.dataTransfer) {
            e.dataTransfer.effectAllowed = 'move';
            // Firefox refuses to start a drag without payload.
            e.dataTransfer.setData('text/plain', row.dataset.node);
          }
        }
        // Top/bottom quarter of a row reorders around it; the middle of a
        // FOLDER drops inside it.
        dropIntent(row, e) {
          const r = row.getBoundingClientRect();
          const y = (e.clientY - r.top) / (r.height || 1);
          const isFolder = row.dataset.kind === 'folder';
          if (isFolder && y > 0.25 && y < 0.75) return 'into';
          return y < 0.5 ? 'before' : 'after';
        }
        onDragOver(e) {
          if (!this.__drag) return;
          const row = e.target.closest('.vt-row');
          e.preventDefault();
          if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
          this.clearDropMarks();
          if (!row) { this.classList.add('is-drop-root'); return; }
          row.classList.add('is-drop-' + this.dropIntent(row, e));
        }
        onDragLeave(e) {
          if (e.target === this) this.clearDropMarks();
        }
        clearDropMarks() {
          this.classList.remove('is-drop-root');
          for (const el of this.querySelectorAll('.is-drop-into, .is-drop-before, .is-drop-after'))
            el.classList.remove('is-drop-into', 'is-drop-before', 'is-drop-after');
        }
        onDrop(e) {
          const lib = globalThis.__vaultLib;
          const dragged = this.__drag;
          this.__drag = null;
          this.clearDropMarks();
          if (!dragged) return;
          e.preventDefault();
          const row = e.target.closest('.vt-row');
          if (!row) { this.moveNode(dragged, null); return; }
          const targetId = row.dataset.node;
          if (targetId === dragged) return;
          const intent = this.dropIntent(row, e);
          if (intent === 'into') { this.moveNode(dragged, targetId); return; }
          // Reorder: land beside the target, among ITS siblings.
          const target = lib.nodes().find((n) => n.id === targetId);
          if (!target) return;
          const parentId = target.parent || null;
          const siblings = (this.tree().kids.get(parentId || '') || [])
            .filter((n) => n.id !== dragged);
          const at = siblings.findIndex((n) => n.id === targetId);
          const before = intent === 'before'
            ? (at > 0 ? siblings[at - 1].order : '')
            : siblings[at].order;
          const after = intent === 'before'
            ? siblings[at].order
            : (at < siblings.length - 1 ? siblings[at + 1].order : '');
          this.moveNode(dragged, parentId, lib.between(before, after));
        }

        // --- confirmation dialog --------------------------------------
        confirmDelete(id) {
          const lib = globalThis.__vaultLib;
          const node = lib.nodes().find((n) => n.id === id);
          if (!node) return;
          const kids = this.descendants(id);
          const names = kids.slice(0, 8).map((k) => lib.esc(k.name));
          const more = kids.length - names.length;
          this.closeDialog();
          const scrim = document.createElement('div');
          scrim.className = 'vt-scrim';
          scrim.innerHTML =
            '<div class="vt-dialog" role="dialog" aria-modal="true">' +
            '<div class="vt-dialog__title">Delete ' +
            (node.kind === 'folder' ? 'folder' : 'note') + '?</div>' +
            '<div class="vt-dialog__path">' + lib.esc(this.pathOf(id)) + '</div>' +
            (kids.length
              ? '<div class="vt-dialog__body">Also deletes <b>' + kids.length +
                '</b> item' + (kids.length === 1 ? '' : 's') + ' inside it:<br>' +
                names.join(', ') + (more > 0 ? ', and ' + more + ' more' : '') + '</div>'
              : '') +
            '<div class="vt-dialog__note">You can undo this.</div>' +
            '<div class="vt-dialog__acts">' +
            '<button type="button" class="vt-btn" data-act="cancel">Cancel</button>' +
            '<button type="button" class="vt-btn vt-btn--danger" data-act="confirm-delete" ' +
            'data-node="' + id + '">Delete</button>' +
            '</div></div>';
          this.appendChild(scrim);
          this.__dialog = scrim;
          scrim.addEventListener('pointerdown', (ev) => {
            if (ev.target === scrim) this.closeDialog();
          });
          this.__onDialogKey = (ev) => { if (ev.key === 'Escape') this.closeDialog(); };
          document.addEventListener('keydown', this.__onDialogKey, true);
          const del = scrim.querySelector('[data-act="confirm-delete"]');
          if (del) del.focus();
        }
        closeDialog() {
          if (this.__dialog) { this.__dialog.remove(); this.__dialog = null; }
          if (this.__onDialogKey) {
            document.removeEventListener('keydown', this.__onDialogKey, true);
            this.__onDialogKey = null;
          }
        }

        // --- settings --------------------------------------------------
        effectiveTheme() {
          const root = document.documentElement;
          return root.classList.contains('wa-dark') ||
            (!root.classList.contains('wa-light') &&
             window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark' : 'light';
        }
        readSettings() {
          const root = this.closest('.vault-root');
          const row = (root && root.querySelector('.vault-config-row'))
            || document.querySelector('.vault-config-row');
          const workspace = root && root.closest('.vault-workspace-root');
          const fallback = (workspace && workspace.dataset.fallbackNote)
            || 'id:vault/n/welcome';
          const stored = row ? {
            theme: row.dataset.theme === 'dark' ? 'dark' :
              (row.dataset.theme === 'light' ? 'light' : 'system'),
            startup: row.dataset.startup || fallback,
          } : null;
          if (this.__settingsOptimistic) {
            const o = this.__settingsOptimistic;
            if (stored && stored.theme === o.theme && stored.startup === o.startup) {
              this.__settingsOptimistic = null;
              return stored;
            }
            return o;
          }
          // No saved row preserves the old Vault landing behavior.
          return stored || { theme: 'system', startup: fallback };
        }
        applyTheme(theme) {
          const root = document.documentElement;
          const dark = theme === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : theme === 'dark';
          root.classList.toggle('wa-dark', dark);
          root.classList.toggle('wa-light', !dark);
        }
        settingsFiles() {
          const { kids } = this.tree();
          const files = [];
          const walk = (parent) => {
            for (const node of kids.get(parent) || []) {
              if (node.kind === 'file') files.push(node);
              else walk(node.id);
            }
          };
          walk('');
          return files;
        }
        openSettings() {
          const lib = globalThis.__vaultLib;
          const settings = this.readSettings();
          const files = this.settingsFiles();
          this.closeDialog();
          const values = new Set(files.map((n) => n.id));
          const startup = settings.startup === 'id:vault/first-file' ||
            values.has(settings.startup) ? settings.startup : 'id:vault/first-file';
          const options =
            '<option value="id:vault/first-file">First file in sidebar</option>' +
            files.map((n) => '<option value="' + lib.esc(n.id) + '">' +
              lib.esc(this.pathOf(n.id)) + '</option>').join('');
          const scrim = document.createElement('div');
          scrim.className = 'vt-scrim';
          scrim.innerHTML =
            '<div class="vt-dialog vt-settings" role="dialog" aria-modal="true" ' +
            'aria-labelledby="vault-settings-title">' +
            '<div class="vt-dialog__title" id="vault-settings-title">Settings</div>' +
            '<div class="vt-settings__section">' +
            '<div class="vt-settings__heading">Appearance</div>' +
            '<label class="vt-settings__picker">' +
            '<select class="vt-settings__theme" aria-label="Appearance">' +
            '<option value="system">Default</option>' +
            '<option value="light">Light</option>' +
            '<option value="dark">Dark</option></select>' +
            '<span>Default follows this device’s light or dark mode.</span></label></div>' +
            '<div class="vt-settings__section">' +
            '<div class="vt-settings__heading">On arrival</div>' +
            '<label class="vt-settings__picker"><span>File to open</span>' +
            '<select class="vt-settings__startup">' + options + '</select></label></div>' +
            '<div class="vt-dialog__acts">' +
            '<button type="button" class="vt-btn" data-act="cancel">Cancel</button>' +
            '<button type="button" class="vt-btn vt-btn--primary" data-act="save-settings">Save</button>' +
            '</div></div>';
          // Body-mounted so the modal covers the whole viewport even when the
          // mobile sidebar is transformed into an off-canvas drawer. The shell
          // extends its token layer to .vt-scrim for the same reason.
          document.body.appendChild(scrim);
          this.__dialog = scrim;
          const select = scrim.querySelector('.vt-settings__startup');
          const theme = scrim.querySelector('.vt-settings__theme');
          select.value = startup;
          theme.value = settings.theme;
          scrim.querySelector('[data-act="cancel"]')
            .addEventListener('click', () => this.closeDialog());
          scrim.querySelector('[data-act="save-settings"]')
            .addEventListener('click', () => this.saveSettings());
          scrim.addEventListener('pointerdown', (ev) => {
            if (ev.target === scrim) this.closeDialog();
          });
          this.__onDialogKey = (ev) => {
            if (ev.key === 'Escape') this.closeDialog();
          };
          document.addEventListener('keydown', this.__onDialogKey, true);
          theme.focus();
        }
        saveSettings() {
          if (!this.__dialog) return;
          const lib = globalThis.__vaultLib;
          const theme = this.__dialog.querySelector('.vt-settings__theme').value;
          const startup = this.__dialog.querySelector('.vt-settings__startup').value
            || 'id:vault/first-file';
          const settings = { theme, startup };
          this.__settingsOptimistic = settings;
          this.applyTheme(theme);
          // A file is always opened on arrival — the editor never shows an
          // empty space — so the stored flag stays `on` for the schema only.
          lib.emit(this, 'configsave', {
            vaultConfigTheme: theme,
            vaultConfigAutoOpen: 'on',
            vaultConfigStartup: startup,
          });
          this.closeDialog();
        }

        // --- toast ------------------------------------------------------
        toast(message, actionLabel, fn) {
          const lib = globalThis.__vaultLib;
          if (this.__toast) this.__toast.remove();
          clearTimeout(this.__toastTimer);
          const t = document.createElement('div');
          t.className = 'vt-toast';
          t.innerHTML = '<span>' + lib.esc(message) + '</span>' +
            (actionLabel ? '<button type="button" class="vt-toast__act">' +
              lib.esc(actionLabel) + '</button>' : '');
          this.appendChild(t);
          this.__toast = t;
          const btn = t.querySelector('.vt-toast__act');
          if (btn) btn.addEventListener('click', () => { this.hideToast(); fn && fn(); });
          this.__toastTimer = setTimeout(() => this.hideToast(), 8000);
        }
        hideToast() {
          clearTimeout(this.__toastTimer);
          if (this.__toast) { this.__toast.remove(); this.__toast = null; }
        }

        // Delete the whole subtree, so a removed folder never leaves its
        // notes stranded behind an unreachable parent. If the open note is
        // in there, move the editor to the nearest survivor first.
        remove_(id) {
          const lib = globalThis.__vaultLib;
          const nodes = lib.nodes();
          const node = nodes.find((n) => n.id === id);
          const doomed = [id].concat(this.descendants(id).map((n) => n.id));
          // Capture the order keys BEFORE retracting them — they are
          // exactly what restore needs, and once retracted the rows are
          // gone from the directory and unreadable.
          const snapshot = nodes.filter((n) => doomed.includes(n.id))
            .map((n) => ({ id: n.id, order: n.order }));
          const active = this.getAttribute('active');
          if (active && doomed.includes(active)) {
            const survivor = nodes
              .find((n) => n.kind === 'file' && !doomed.includes(n.id));
            if (survivor) lib.emit(this, 'navigate', {
              open: survivor.id, deviceOpen: survivor.id,
            });
          }
          for (const d of doomed) lib.emit(this, 'deletenode', { delete: d });
          const label = 'delete of "' + (node ? node.name : 'item') + '"';
          const restore = () => {
            for (const s of snapshot)
              lib.emit(this, 'restorenode', { restore: s.id, restoreOrder: s.order });
          };
          this.pushUndo(label, restore);
          this.toast('Deleted "' + (node ? node.name : 'item') + '"', 'Undo', () => {
            const i = this.undoStack.findIndex((e) => e.label === label);
            if (i >= 0) this.undoStack.splice(i, 1);
            restore();
          });
        }

        onDblClick(e) {
          const row = e.target.closest('.vt-row');
          if (!row || e.target.closest('[data-act]')) return;
          this.renaming = row.dataset.node;
          this.render();
        }
        // Re-entrant: the re-render below removes the focused input,
        // which fires its own blur straight back into here. Commit once.
        commitRename(id, value) {
          if (this.__committing) return;
          this.__committing = true;
          const lib = globalThis.__vaultLib;
          const node = lib.nodes().find((n) => n.id === id);
          const name = value.trim();
          this.renaming = null;
          if (node && name && name !== node.name) {
            const from = node.name;
            lib.emit(this, 'renamenode', { rename: id, renameName: name });
            this.pushUndo('rename to "' + name + '"', () =>
              lib.emit(this, 'renamenode', { rename: id, renameName: from }));
          }
          this.render();
          this.__committing = false;
        }

        // The warnings read-out (dropped command fields, failing handlers)
        // now lives behind the footer's triangle: a count badge, with the
        // log itself in a popover. It still earns no space when nothing has
        // gone wrong.
        renderDebug() {
          const lib = globalThis.__vaultLib;
          const btn = this.querySelector('.vt-errs');
          if (!btn || !lib) return;
          const n = lib.warns.length;
          btn.hidden = !n;
          const chip = btn.querySelector('.vt-errs-count');
          if (chip) chip.textContent = n > 99 ? '99+' : String(n);
          if (this.errlog) this.fillErrLog();
        }
        fillErrLog() {
          const lib = globalThis.__vaultLib;
          if (!this.errlog || !lib) return;
          this.errlog.innerHTML =
            '<div class="vt-errlog-head"><span class="vt-errlog-title">Warnings</span>' +
            '<button type="button" class="vt-errlog-clear">Clear</button></div>' +
            lib.warns.slice(-30).map((w) =>
              '<div class="vt-warn">' + lib.esc(w) + '</div>').join('');
          this.errlog.querySelector('.vt-errlog-clear').addEventListener('click', () => {
            lib.warns.length = 0;
            this.closeErrLog();
            this.renderDebug();
          });
        }
        toggleErrLog() {
          if (this.errlog) { this.closeErrLog(); return; }
          const btn = this.querySelector('.vt-errs');
          if (!btn) return;
          const log = document.createElement('div');
          log.className = 'vt-errlog';
          this.errlog = log;
          this.fillErrLog();
          document.body.appendChild(log);
          const r = btn.getBoundingClientRect();
          log.style.left = Math.max(8, r.left - 4) + 'px';
          log.style.bottom = (window.innerHeight - r.top + 6) + 'px';
          this.__onErrAway = (e) => {
            if (e.target.closest && e.target.closest('.vt-errlog, .vt-errs')) return;
            this.closeErrLog();
          };
          document.addEventListener('mousedown', this.__onErrAway, true);
        }
        closeErrLog() {
          if (this.__onErrAway) {
            document.removeEventListener('mousedown', this.__onErrAway, true);
            this.__onErrAway = null;
          }
          if (this.errlog) { this.errlog.remove(); this.errlog = null; }
        }

        render() {
          const lib = globalThis.__vaultLib;
          if (!lib) return;
          const list = this.querySelector('.vt-list');
          if (!list) return;
          // Never rebuild mid-gesture (see the pointerdown guard) or
          // out from under a live rename input — reassigning innerHTML
          // removes the focused field, whose blur handler then commits
          // and exits edit mode, which looked like rename "snapping
          // back" the instant it opened.
          if (this.__down) { this.__pending = true; return; }
          // Before the signature is taken: hydrating changes the open set,
          // and a signature captured ahead of it would be stale.
          this.hydrateOpen();
          this.applyTheme(this.readSettings().theme);
          const s = this.sig();
          if (s === this.__sig) return;
          if (this.renaming && list.querySelector('.vt-rename')) return;
          this.__sig = s;
          this.settleCreate();
          const { nodes, kids } = this.tree();
          const active = this.getAttribute('active');
          const out = [];

          // A folder row is chevron + folder icon (Lucide `folder`, or
          // `folder-open` while expanded) + name. A note row is just the
          // name, inset by the chevron box so it lines up with the folder
          // icons beside it. Depth is one `.vt-guide` spacer per ancestor;
          // each spacer draws the vertical guide that runs down an expanded
          // folder's children, directly under that folder's chevron.
          const CHEVRON = '<path d="m9 18 6-6-6-6"/>';
          const FOLDER =
            '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>';
          const FOLDER_OPEN =
            '<path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/>';
          const rowHtml = (n, depth) => {
            const isFolder = n.kind === 'folder';
            const open = this.open.has(n.id);
            const guides = '<span class="vt-guide"></span>'.repeat(depth);
            const caret = isFolder
              ? '<span class="vt-caret' + (open ? ' is-open' : '') + '">' +
                lib.icon(CHEVRON) + '</span>'
              : '<span class="vt-caret is-leaf"></span>';
            const icon = isFolder
              ? '<span class="vt-icon">' + lib.icon(open ? FOLDER_OPEN : FOLDER) + '</span>'
              : '';
            const label = this.renaming === n.id
              ? '<input class="vt-rename" value="' + lib.esc(n.name) + '">'
              : '<span class="vt-name" title="' + lib.esc(n.name) + '">' +
                lib.esc(n.name) + '</span>';
            return '<div class="vt-row' +
              (n.id === active && !isFolder ? ' is-active' : '') +
              (n.id === this.selected ? ' is-selected' : '') +
              (isFolder ? ' is-folder' : '') +
              (this.renaming === n.id ? ' is-renaming' : '') +
              '" draggable="true" data-node="' + n.id + '" data-kind="' + n.kind +
              '" data-depth="' + depth + '">' +
              guides + caret + icon + label + '</div>';
          };

          // Searching flattens the tree to matches at any depth — the
          // hierarchy is noise when you already know the name.
          if (this.query) {
            const hits = nodes.filter((n) => n.name.toLowerCase().includes(this.query));
            for (const n of lib.sortSiblings(hits)) out.push(rowHtml(n, 0));
            if (!hits.length) out.push('<div class="vt-empty">No matches.</div>');
          } else {
            const walk = (n, depth) => {
              out.push(rowHtml(n, depth));
              if (!this.open.has(n.id)) return;
              for (const c of kids.get(n.id) || []) walk(c, depth + 1);
            };
            for (const r of kids.get('') || []) walk(r, 0);
            // `is-vault-empty` is the signal the shell's CSS keys off to
            // swap the editor for a blank state — distinct from the
            // "no search matches" empty above, which must NOT do that.
            if (!out.length)
              out.push('<div class="vt-empty is-vault-empty">Nothing here yet.' +
                '<button type="button" class="vt-firstnote" data-act="new-note">' +
                'Create your first note</button></div>');
          }
          list.innerHTML = out.join('');
          this.renderDebug();

          const input = list.querySelector('.vt-rename');
          if (input) {
            const id = this.renaming;
            input.focus(); input.select();
            input.addEventListener('blur', () => this.commitRename(id, input.value));
            input.addEventListener('keydown', (ev) => {
              if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
              else if (ev.key === 'Escape') { this.renaming = null; this.render(); }
            });
          }
        }
      });
    })();

