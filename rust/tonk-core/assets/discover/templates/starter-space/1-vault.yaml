    (() => {
      if (customElements.get('vault-panel')) return;
      const lib = () => globalThis.__vaultLib;

      // Grove's right panel: Comments and Backlinks over the open note.
      // Both tabs read the hidden data rows the shell mounts (.wiki-comment-row,
      // .wiki-prose-row) — no store queries of its own, so lib.watch's tick is
      // the only re-render signal it needs.
      const MARKERS = /^(?:(?:[>*+-]|\d+[.)]|#{1,6}|\[[ xX]\])\s+)+/;
      const strip = (s) =>
        (s || '').replace(/\u200b/g, '').replace(MARKERS, '').trim();
      const activeNote = () => {
        const row = document.querySelector('.vault-here-row');
        return (row && row.dataset.active) || '';
      };

      customElements.define('vault-panel', class extends HTMLElement {
        connectedCallback() {
          const arm = () => {
            const l = lib();
            if (!l) { setTimeout(arm, 40); return; }
            if (this.isConnected) l.watch(this, () => this.render());
          };
          if (this.__init) { arm(); return; }
          this.__init = true;
          this.tab = 'comments';
          this.innerHTML =
            '<div class="vp-head">' +
            '<div class="vp-tabs" role="tablist">' +
            '<button type="button" class="vp-tab is-on" role="tab" data-tab="comments">Comments<span class="vp-tab-n" hidden></span></button>' +
            '<button type="button" class="vp-tab" role="tab" data-tab="backlinks">Backlinks<span class="vp-tab-n" hidden></span></button>' +
            '</div>' +
            '<button type="button" class="vp-close" title="Close" aria-label="Close panel">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>' +
            '</button>' +
            '</div>' +
            '<div class="vp-body"></div>';
          this.addEventListener('click', (e) => {
            const tab = e.target.closest('.vp-tab');
            if (tab) { this.tab = tab.dataset.tab; this.render(); return; }
            if (e.target.closest('.vp-close')) {
              const root = this.closest('.vault-root');
              if (root) root.classList.remove('is-panel-open');
              const btn = document.querySelector('.vtitle__panel');
              if (btn) btn.setAttribute('aria-expanded', 'false');
              return;
            }
            const quote = e.target.closest('.vp-cmt-quote');
            if (quote) { this.jump(quote.dataset.snippet); return; }
            const bl = e.target.closest('.vp-bl');
            if (bl && lib()) lib().emit(this, 'navigate', { open: bl.dataset.note });
          });
          arm();
        }
        disconnectedCallback() { const l = lib(); l && l.unwatch(this); }

        comments(note) {
          if (!note) return [];
          return Array.from(document.querySelectorAll('.wiki-comment-row'))
            .filter((r) => r.dataset.note === note)
            .map((r) => {
              const t = parseFloat((r.dataset.time || '').slice(2)) || 0;
              return {
                text: r.textContent, time: t,
                when: t > 0 ? new Date(t).toLocaleString() : '',
                snippet: (r.dataset.snippet || '').trim(),
              };
            })
            .sort((a, b) => b.time - a.time);
        }

        // A backlink is a note whose markdown contains `](<this note's id>)` —
        // the exact form the editor's [[ note-link flow writes.
        backlinks(note) {
          const l = lib();
          if (!note || !l) return [];
          const names = new Map(l.nodes().map((n) => [n.id, n.name || 'Untitled']));
          const out = [];
          document.querySelectorAll('.wiki-prose-row').forEach((r) => {
            const src = r.dataset.note;
            if (!src || src === note) return;
            const text = r.textContent || '';
            const i = text.indexOf('](' + note + ')');
            if (i < 0) return;
            const start = text.lastIndexOf('\n', i) + 1;
            const end = text.indexOf('\n', i);
            const line = text.slice(start, end < 0 ? undefined : end)
              .replace(/\]\([a-zA-Z][a-zA-Z0-9+.-]*:[^)]*\)/g, ']')
              .replace(/[[\]]/g, '');
            out.push({ note: src, name: names.get(src) || src, snippet: strip(line).slice(0, 120) });
          });
          return out;
        }

        // Scroll the commented block into view and flash it. Anchoring is the
        // same snippet-text match the gutter uses — markdown has no block ids.
        jump(snippet) {
          const ed = document.querySelector('.vault-doc tonk-prose');
          const doc = ed && ed.shadowRoot && ed.shadowRoot.querySelector('.md-doc');
          if (!doc) return;
          const want = strip(snippet).slice(0, 200);
          if (!want) return;
          for (const el of doc.querySelectorAll('p, h1, h2, h3, h4, h5, h6, pre, li')) {
            if (strip(el.textContent).slice(0, 200) !== want) continue;
            el.scrollIntoView({ block: 'center', behavior: 'smooth' });
            el.style.transition = 'background-color 1.1s ease';
            el.style.backgroundColor = 'rgba(128, 128, 128, .28)';
            setTimeout(() => { el.style.backgroundColor = ''; }, 900);
            return;
          }
        }

        render() {
          const l = lib();
          const body = this.querySelector('.vp-body');
          if (!l || !body) return;
          const note = activeNote();
          const cms = this.comments(note);
          const bls = this.backlinks(note);
          this.querySelectorAll('.vp-tab').forEach((t) => {
            t.classList.toggle('is-on', t.dataset.tab === this.tab);
            t.setAttribute('aria-selected', String(t.dataset.tab === this.tab));
            const n = t.dataset.tab === 'comments' ? cms.length : bls.length;
            const chip = t.querySelector('.vp-tab-n');
            chip.hidden = !n;
            chip.textContent = String(n);
          });
          if (this.tab === 'comments') {
            body.innerHTML = cms.length ? cms.map((c) =>
              '<div class="vp-cmt">' +
              '<div class="vp-cmt-when">' + l.esc(c.when) + '</div>' +
              '<div class="vp-cmt-text">' + l.esc(c.text) + '</div>' +
              '<div class="vp-cmt-quote" data-snippet="' + l.esc(c.snippet) + '" title="Jump to block">' +
              l.esc(c.snippet.slice(0, 90)) + '</div>' +
              '</div>').join('') :
              '<div class="vp-none">0 comments on this note<br><span>hover a block, click the speech bubble</span></div>';
          } else {
            body.innerHTML = bls.length ? bls.map((b) =>
              '<div class="vp-bl" data-note="' + l.esc(b.note) + '">' +
              '<div class="vp-bl-name">' + l.esc(b.name) + '</div>' +
              '<div class="vp-bl-snip">' + l.esc(b.snippet) + '</div>' +
              '</div>').join('') :
              '<div class="vp-none">nothing links here yet<br><span>type [[ in any note to link this one</span></div>';
          }
        }
      });
    })();


