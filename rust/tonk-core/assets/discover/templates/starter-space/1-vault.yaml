    Tonk-Prose-Version: 1
    ETag: "117178371944087552"
    Content-Type: text/markdown

    # Build a Tonk bookshelf

    This guide uses one small bookshelf to explain the basic parts of Tonk. Each section teaches one idea. Read **More info** only when you want the extra detail.

    The commands were written for **Tonk 0.6.8** on 28 August 2026. If a command has changed, check the help included with your installed version:

    ```sh
    tonk --version
    tonk help -g
    tonk help tutorial
    ```

    ## What you will build

    The finished space will contain people, books, an HTML view, and a button that marks a book as finished. You will also learn how to share the space and store a cover image.

    ## 1. A space is one database

    > **Main idea:** A space keeps the data and the app definitions for one project.

    Create a directory and bind it to a new space:

    ```sh
    mkdir bookshelf
    cd bookshelf
    tonk space new bookshelf
    tonk status
    ```

    The directory is now linked to the `bookshelf` space. Commands run in this directory will use that space unless you select another one.

    ### More info

    - The directory is only a binding. Tonk keeps the actual space in its own local data directory.
    - A new space works without an account or an internet connection.
    - `tonk status` shows the active space, its branch, its sync state, and its current content hash.
    - You can select a space directly with `tonk --space bookshelf ...`.

    ## 2. A concept defines a data shape

    > **Main idea:** A concept lists the fields that a kind of entity must have.

    Define a person and a book:

    ```sh
    tonk concept add person \
      --field name:Text:one \
      --description "Someone who writes books"

    tonk concept add book \
      --field title:Text:one \
      --field author:Entity:one \
      --field status:Text:one \
      --field pages:UnsignedInteger:one \
      --description "A book on the shelf"

    tonk show book
    ```

    The `book` concept says that every matching book has a title, an author, a status, and a page count. It is similar to a schema, but it is stored in the space with the rest of the data.

    ### More info

    - A field has the form `name:Type:cardinality`.
    - The available types are `Text`, `Entity`, `UnsignedInteger`, `SignedInteger`, `Float`, `Boolean`, and `Symbol`.
    - Cardinality is `one` for one value or `many` for several values.
    - `tonk assert book --help` is generated from the concept, so the command always reflects the fields in the current space.

    ## 3. Facts describe entities

    > **Main idea:** Tonk stores each field value as a fact about an entity.

    Add one author, copy the entity ID from the result, and use it to add a book:

    ```sh
    tonk assert person --name "Ursula K. Le Guin"

    tonk assert book \
      --title "A Wizard of Earthsea" \
      --author <author-did> \
      --status "reading" \
      --pages 183

    tonk query book
    ```

    Replace `<author-did>` with the `did:key:...` printed by the first command. The book has one entity ID and four facts. Its `author` fact points to the person entity.

    ### More info

    - An entity ID is a URI. New entities usually receive a `did:key:...` ID.
    - `tonk show <entity-did>` displays the raw facts for one entity.
    - `tonk query book` finds entities that have every field required by the `book` concept.
    - To change an existing entity, address its ID. Describing a new full body may create a different entity.

    ## 4. Notation reads and writes facts

    > **Main idea:** Tonk notation is a small YAML language for queries and changes that need more control than a single command provides.

    This query finds every book and joins each one to its author's name:

    ```yaml
    book:
      this: ?book
      title: ?title
      author: ?author

    person:
      this: ?author
      name: ?name
    ```

    Save it as `authors.yaml`, then evaluate it:

    ```sh
    tonk eval authors.yaml
    ```

    The repeated variable `?author` is the link between the two query parts. A heading without `!` reads facts. A heading with `!` writes facts.

    ### More info

    - Variables begin with `?`. The same variable must have the same value everywhere it appears.
    - Quote text values such as `"reading"`. An unquoted word is treated as a name, not as text.
    - `tonk eval file.yaml --dry-run` checks a document without committing it.
    - To update a known book, use `tonk assert book <book-did> --status "finished"`.

    ## 5. A view turns data into HTML

    > **Main idea:** A view connects a concept to an HTML template.

    Add a simple view for a book, then render one book in the terminal:

    ```sh
    tonk view add book \
      --template '<article><h2>{title}</h2><p>{status} · {pages} pages</p></article>'

    tonk render <book-did>@book
    ```

    Tonk replaces `{title}`, `{status}`, and `{pages}` with facts from the selected entity. The same view can be used by the browser app.

    ### More info

    - A view stores two main values: its model concept and its HTML template.
    - `tonk render book` renders the directory for all books.
    - Use `<tonk-display>` inside a template to render a related entity, such as the person referenced by `author`.
    - Use `tonk view add book --kind directory --template-file shelf.html --home` to make a custom bookshelf page the space home.

    ## 6. Commands and rules handle interaction

    > **Main idea:** A browser event creates a temporary command, and a rule turns that command into a stored change.

    This file adds a **finished** button to the book view:

    ```yaml
    concept!: &book-status
      this: tonk:bookshelf/book-status
      description: "A book's reading status"
      with:
        status: book-status

    command!: &finish
      description: "A request to finish a book"
      with:
        book:
          description: "The selected book"
          the: dom.event.current-target.dataset/finish
          as: entity

    rule!:
      description: "Mark the selected book as finished"
      assert!: book-status
      when:
        - assert: finish
          where: { book: ?this }
        - assert: ==
          where: { this: ?status, is: "finished" }

    view!: &book-view
      this: id:book-view
      model: book
      display: |
        <article>
          <h2>{title}</h2>
          <p>{status} · {pages} pages</p>
          <button onclick=finish data-finish={this}>finished</button>
        </article>
    ```

    Save it as `finish.yaml` and run `tonk eval finish.yaml`. When someone clicks the button, the event supplies the book ID. The rule then asserts the new status for that book.

    ### More info

    - A command is transient. It exists while rules run and is then removed.
    - A rule contains a result and the conditions that must match before the result can happen.
    - `book-status` is a projection concept. It lets the rule update only the status fact instead of supplying every field of `book`.
    - You can test the rule without a browser with `tonk eval -c 'finish!: { book: <book-did> }'`.

    ## 7. Sync connects local replicas

    > **Main idea:** Each device has a local copy of a space, and sync moves revisions between copies.

    Sign in, give the local space a remote home, and create an invite:

    ```sh
    tonk account login
    tonk space link bookshelf
    tonk invite
    ```

    Another person can use the printed URL to make their own local replica:

    ```sh
    tonk join '<invite-url>' --name shared-bookshelf
    ```

    Quote the invite URL because its fragment contains part of the secret.

    ### More info

    - Editing local data does not require an account. Hosting and sharing do.

    - Writes pull before committing and push afterward when an upstream is configured.

    - `tonk status` reports whether the local branch is synced, ahead, behind, diverged, or has no upstream.

    - If a push fails, the local commit remains. Run `tonk push` to try again.

    ## 8. Blobs store files

    > **Main idea:** A blob stores file bytes by content hash, while facts describe and reference the file.

    Add a cover image and inspect it:

    ```sh
    tonk blob add cover.png
    tonk blob
    tonk blob cat <blob-uri> > restored-cover.png
    ```

    The first command prints a URI such as `blob:CHey...`. Store that URI in an entity field when a book needs to reference the cover.

    ### More info

    - Tonk stores the content type and original name as facts.
    - Adding the same bytes again produces the same content address.
    - Blobs move with normal push and pull operations.
    - The browser's built-in blob view can display image blobs.

    ## 9. Revisions make changes inspectable

    > **Main idea:** Every effective write creates a new revision with a new content hash.

    Compare the hash before and after a change:

    ```sh
    tonk status
    tonk assert person --name "Octavia E. Butler"
    tonk status
    ```

    The second hash identifies the complete new state of the space. If an identical write changes nothing, Tonk can keep the same revision.

    ### More info

    - Tonk records assertions and retractions instead of editing a database row in place.
    - Concepts, views, rules, and app data all live as facts on the branch.
    - `tonk export` prints the active facts in a plain format that is useful for inspection and debugging.
    - Two replicas with the same root hash have the same content state.

    ## Where to go next

    Use the help built into Tonk when you need details:

    ```sh
    tonk help notation
    tonk help views
    tonk help events
    tonk help sync
    tonk help -a
    ```

    A good working loop is: define one concept, add a small amount of data, query it, add one view, and only then add commands or sharing.

