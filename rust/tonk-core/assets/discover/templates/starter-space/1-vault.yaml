# SPDX-License-Identifier: CC0-1.0
# Tonk asserted notation. Repeated top-level keys are intentional.
#
# Starter space — Vault
#
# The Vault shell: notes tree, editor, settings, routes, and the starter notes
#
# One of 8 notation documents that recreate the Tonk starter space in a
# fresh space. Evaluate them in file order:
#
#   tonk eval 1-vault.yaml
#   tonk eval 2-pages.yaml
#   tonk eval 3-news.yaml
#   tonk eval 4-todos.yaml
#   tonk eval 5-budget.yaml
#   tonk eval 6-dots.yaml
#   tonk eval 7-zork.yaml
#   tonk eval 8-playground.yaml
#
# Exported from the live space on 2026-09-08 with Tonk 0.6.12. Blobs are
# embedded as data: URIs. Runtime state (per-device state, session
# transcripts, agent heartbeats, the roster, and history) is left out.
#
# Author: Tonk <hello@tonk.xyz>. The authors' own work is CC0 1.0; embedded
# fonts and third-party artwork keep their own licenses (see LICENSE.txt
# in the vault).


# ==========================================================================
# Attributes
# ==========================================================================

attribute!: &wc-note
  description: "The note a block comment belongs to"
  the: blue.bumble.wiki.comment/note
  as: Entity
  cardinality: one

attribute!: &wc-snippet
  description: "The commented block's text at comment time — the anchor. Markdown blocks carry no stable ids, so the badge re-attaches by matching this against live block text."
  the: blue.bumble.wiki.comment/snippet
  as: Text
  cardinality: one

attribute!: &wc-text
  description: "Comment body"
  the: blue.bumble.wiki.comment/text
  as: Text
  cardinality: one

attribute!: &wc-time
  description: "Comment time, epoch milliseconds"
  the: blue.bumble.wiki.comment/time
  as: Float
  cardinality: one


# ==========================================================================
# Concepts
# ==========================================================================

concept!: &prose
  this: tonk:prose
  description: "A Markdown document edited with the built-in Tonk prose editor."
  with:
    content:
      description: "The document content, including any version envelope emitted by the editor."
      the: io.gozala.prose/content
      as: Text
      cardinality: one

concept!: &space-home
  this: space:home
  description: "The space home page, keyed by the repository's own subject DID."
  with:
    subject:
      description: "The repository's subject DID."
      the: dialog.replica/subject
      as: Entity
      cardinality: one

concept!: &vault
  this: tonk:vault
  description: "A vault - a tree of folders and notes with one active note."
  with:
    active:
      description: "The note currently open in the editor"
      the: xyz.tonk.vault/active
      as: Entity
      cardinality: one
    title:
      description: "The vault's display name"
      the: xyz.tonk.vault/title
      as: Text
      cardinality: one

concept!: &vault/config
  this: tonk:vault/config
  description: "Shared appearance and landing preferences for this Vault."
  with:
    auto-open:
      description: "Whether to open the configured file on arrival."
      the: xyz.tonk.vault.config/auto-open
      as: Text
      cardinality: one
    startup:
      description: "A file entity, or id:vault/first-file for sidebar order."
      the: xyz.tonk.vault.config/startup
      as: Entity
      cardinality: one
  maybe:
    theme:
      description: "System, light, or dark appearance behavior."
      the: xyz.tonk.vault.config/theme
      as: Text
      cardinality: one

concept!: &vault/frame
  this: tonk:vault/frame
  description: "The vault minus the open note — what the shell subscribes to."
  with:
    title:
      description: "The vault's display name"
      the: xyz.tonk.vault/title
      as: Text
      cardinality: one

concept!: &vault/here
  this: tonk:vault/here
  description: "This device's open note."
  with:
    active:
      description: "The note this replica has open in the editor."
      the: xyz.tonk.vault/here-active
      as: Entity
      cardinality: one
    profile:
      description: "The local profile that keeps these preferences per-device."
      the: dialog.origin/profile
      as: Entity
      cardinality: one
    subject:
      description: "The repository subject carried by tonk/replica."
      the: dialog.origin/subject
      as: Entity
      cardinality: one

concept!: &vault/here-active
  this: tonk:vault/here-active
  description: "The note currently open on one replica."
  with:
    active:
      description: "The note this replica has open in the editor."
      the: xyz.tonk.vault/here-active
      as: Entity
      cardinality: one

concept!: &vault/node
  this: tonk:vault/node
  description: "A node in the vault tree - either a folder or a file."
  with:
    kind:
      description: "\"folder\" or \"file\""
      the: xyz.tonk.vault.node/kind
      as: Text
      cardinality: one
    name:
      description: "Display name"
      the: xyz.tonk.vault.node/name
      as: Text
      cardinality: one
    order:
      description: "Lexicographic sibling order key"
      the: xyz.tonk.vault.node/order
      as: Text
      cardinality: one
  maybe:
    parent:
      description: "The containing folder"
      the: xyz.tonk.vault.node/parent
      as: Entity
      cardinality: one

concept!: &vault/node-name
  this: tonk:vault/node-name
  description: "A node's name, as a standalone fact."
  with:
    name:
      description: "Display name"
      the: xyz.tonk.vault.node/name
      as: Text
      cardinality: one

concept!: &vault/node-order
  this: tonk:vault/node-order
  description: "A node's sibling order key, as a standalone fact."
  with:
    order:
      description: "Lexicographic sibling order key"
      the: xyz.tonk.vault.node/order
      as: Text
      cardinality: one

concept!: &vault/node-parent
  this: tonk:vault/node-parent
  description: "A node's containing folder, as a standalone fact."
  with:
    parent:
      description: "The containing folder"
      the: xyz.tonk.vault.node/parent
      as: Entity
      cardinality: one

concept!: &vault/open-link
  this: tonk:vault/open-link
  description: "A shared link that opens the Vault at one note."
  with:
    entity:
      description: "The target entity from the path, picked off the site entity."
      the: xyz.tonk.site/entity
      as: Entity
      cardinality: one

concept!: &vault/page
  this: tonk:vault/page
  description: "A vault note that renders as an HTML page instead of the Markdown editor."
  with:
    model:
      description: "The concept whose detail view renders this page (e.g. tonk:vault/welcome-page)."
      the: xyz.tonk.vault.page/model
      as: Entity
      cardinality: one
    title:
      description: "The page's heading."
      the: xyz.tonk.vault.page/title
      as: Text
      cardinality: one

concept!: &vault/settings
  this: tonk:vault/settings
  description: "This device's Vault appearance and landing preferences."
  with:
    auto-open:
      description: "Whether to open a file on arrival, stored as on or off."
      the: xyz.tonk.vault.settings/auto-open
      as: Text
      cardinality: one
    profile:
      description: "The local profile that keeps these preferences per-device."
      the: dialog.origin/profile
      as: Entity
      cardinality: one
    startup:
      description: "A file entity, or id:vault/first-file for sidebar order."
      the: xyz.tonk.vault.settings/startup
      as: Entity
      cardinality: one
    subject:
      description: "The repository subject carried by tonk/replica."
      the: dialog.origin/subject
      as: Entity
      cardinality: one
    theme:
      description: "The explicit light or dark appearance."
      the: xyz.tonk.vault.settings/theme
      as: Text
      cardinality: one

concept!: &vault/tree
  this: tonk:vault/tree
  description: "This device's vault tree state."
  with:
    profile:
      description: "The local profile that keeps these preferences per-device."
      the: dialog.origin/profile
      as: Entity
      cardinality: one
    subject:
      description: "The repository subject carried by tonk/replica."
      the: dialog.origin/subject
      as: Entity
      cardinality: one
  maybe:
    open:
      description: "A pipe-prefixed, space-separated list of expanded folder ids."
      the: xyz.tonk.vault/open
      as: Text
      cardinality: one

concept!: &vault/tree-open
  this: tonk:vault/tree-open
  description: "The expanded-folder set on one replica."
  with:
    open:
      description: "A pipe-prefixed, space-separated list of expanded folder ids."
      the: xyz.tonk.vault/open
      as: Text
      cardinality: one

concept!: &vault/workspace
  this: tonk:vault/workspace
  description: "The Vault space root, keyed by the active replica."
  with:
    subject:
      description: "The repository's subject DID."
      the: dialog.replica/subject
      as: Entity
      cardinality: one

name!:
  this: id:tonk/space
  entity: vault/workspace

concept!: &wiki/comment
  description: "A comment on one block of a note"
  with:
    note: wc-note
    snippet: wc-snippet
    text: wc-text
    time: wc-time


# ==========================================================================
# Commands (transient concepts fired by the UI)
# ==========================================================================

command!: &prose/edit
  description: "Edit a prose document."
  with:
    content:
      description: "The new content envelope emitted by the change event."
      the: dom.event.detail/content
      as: Text
      cardinality: one
    subject:
      description: "The repository's subject DID, stamped on the banner element."
      the: dom.event.current-target.dataset/subject
      as: Entity
      cardinality: one

command!: &vault/delete
  description: "Remove `node` from the tree."
  with:
    node:
      description: "The node to delete"
      the: dom.event.detail/delete
      as: Entity
      cardinality: one

command!: &vault/move
  description: "Move `node` into `parent` at `order`."
  with:
    node:
      description: "The node being moved"
      the: dom.event.detail/move
      as: Entity
      cardinality: one
    order:
      description: "Its sibling order key in the destination"
      the: dom.event.detail/move-order
      as: Text
      cardinality: one
    parent:
      description: "The folder to move it into"
      the: dom.event.detail/move-parent
      as: Entity
      cardinality: one

command!: &vault/move-root
  description: "Move `node` to the top level at `order`."
  with:
    node:
      description: "The node being moved"
      the: dom.event.detail/move-root
      as: Entity
      cardinality: one
    order:
      description: "Its sibling order key at the top level"
      the: dom.event.detail/move-root-order
      as: Text
      cardinality: one

command!: &vault/new-folder
  description: "Create a folder inside `parent`."
  with:
    name:
      description: "Name of the new folder"
      the: dom.event.detail/folder-name
      as: Text
      cardinality: one
    order:
      description: "Sibling order key, computed by the tree component"
      the: dom.event.detail/folder-order
      as: Text
      cardinality: one
    parent:
      description: "The containing folder"
      the: dom.event.detail/folder-parent
      as: Entity
      cardinality: one
    time:
      description: "A monotonic integer nonce, so repeat creates differ"
      the: dom.event.detail/time
      as: UnsignedInteger
      cardinality: one

command!: &vault/new-linked-note
  description: "Create a note inside `parent`, to be linked from the editor."
  with:
    name:
      description: "Name of the new note"
      the: dom.event.detail/linked-note-name
      as: Text
      cardinality: one
    order:
      description: "Sibling order key, computed by the component"
      the: dom.event.detail/linked-note-order
      as: Text
      cardinality: one
    parent:
      description: "The containing folder (the open note's folder)"
      the: dom.event.detail/linked-note-parent
      as: Entity
      cardinality: one
    time:
      description: "A monotonic integer nonce, so repeat creates differ"
      the: dom.event.detail/time
      as: UnsignedInteger
      cardinality: one

command!: &vault/new-linked-root-note
  description: "Create a note at the top level, to be linked from the editor."
  with:
    name:
      description: "Name of the new note"
      the: dom.event.detail/linked-root-note-name
      as: Text
      cardinality: one
    order:
      description: "Sibling order key, computed by the component"
      the: dom.event.detail/linked-root-note-order
      as: Text
      cardinality: one
    time:
      description: "A monotonic integer nonce, so repeat creates differ"
      the: dom.event.detail/time
      as: UnsignedInteger
      cardinality: one

command!: &vault/new-note
  description: "Create a note inside `parent`."
  with:
    name:
      description: "Name of the new note"
      the: dom.event.detail/note-name
      as: Text
      cardinality: one
    order:
      description: "Sibling order key, computed by the tree component"
      the: dom.event.detail/note-order
      as: Text
      cardinality: one
    parent:
      description: "The containing folder"
      the: dom.event.detail/note-parent
      as: Entity
      cardinality: one
    time:
      description: "A monotonic integer nonce, so repeat creates differ"
      the: dom.event.detail/time
      as: UnsignedInteger
      cardinality: one

command!: &vault/new-root-folder
  description: "Create a folder at the top level."
  with:
    name:
      description: "Name of the new folder"
      the: dom.event.detail/root-folder-name
      as: Text
      cardinality: one
    order:
      description: "Sibling order key, computed by the tree component"
      the: dom.event.detail/root-folder-order
      as: Text
      cardinality: one
    time:
      description: "A monotonic integer nonce, so repeat creates differ"
      the: dom.event.detail/time
      as: UnsignedInteger
      cardinality: one

command!: &vault/new-root-note
  description: "Create a note at the top level."
  with:
    name:
      description: "Name of the new note"
      the: dom.event.detail/root-note-name
      as: Text
      cardinality: one
    order:
      description: "Sibling order key, computed by the tree component"
      the: dom.event.detail/root-note-order
      as: Text
      cardinality: one
    time:
      description: "A monotonic integer nonce, so repeat creates differ"
      the: dom.event.detail/time
      as: UnsignedInteger
      cardinality: one

command!: &vault/open
  description: "A request to open `node` in the editor."
  with:
    node:
      description: "The note to open, from the event detail"
      the: dom.event.detail/open
      as: Entity
      cardinality: one

command!: &vault/open-device
  description: "Open a file on this device without rewriting replica identity."
  with:
    active:
      description: "The file this device should open."
      the: dom.event.detail/device-open
      as: Entity
      cardinality: one

command!: &vault/rename
  description: "Rename `node` to `name`."
  with:
    name:
      description: "The new name"
      the: dom.event.detail/rename-name
      as: Text
      cardinality: one
    node:
      description: "The node to rename"
      the: dom.event.detail/rename
      as: Entity
      cardinality: one

command!: &vault/restore
  description: "Put a deleted node back into the tree."
  with:
    node:
      description: "The node to restore"
      the: dom.event.detail/restore
      as: Entity
      cardinality: one
    order:
      description: "The sibling order key it had when it was deleted"
      the: dom.event.detail/restore-order
      as: Text
      cardinality: one

command!: &vault/save-config
  description: "Save the Vault's complete shared settings snapshot."
  with:
    auto-open:
      description: "The requested landing behavior, stored as on or off."
      the: dom.event.detail/vault-config-auto-open
      as: Text
      cardinality: one
    startup:
      description: "The requested startup file or first-file sentinel."
      the: dom.event.detail/vault-config-startup
      as: Entity
      cardinality: one
    theme:
      description: "The requested system, light, or dark appearance behavior."
      the: dom.event.detail/vault-config-theme
      as: Text
      cardinality: one

command!: &vault/save-settings
  description: "Save this viewer's complete Vault settings snapshot."
  with:
    auto-open:
      description: "The requested landing behavior, stored as on or off."
      the: dom.event.detail/settings-auto-open
      as: Text
      cardinality: one
    startup:
      description: "The requested startup file or first-file sentinel."
      the: dom.event.detail/settings-startup
      as: Entity
      cardinality: one
    theme:
      description: "The requested light or dark appearance."
      the: dom.event.detail/settings-theme
      as: Text
      cardinality: one

command!: &vault/set-open
  description: "Record which folders this device has expanded."
  with:
    open:
      description: "The \"|\"-prefixed, space-separated id list"
      the: dom.event.detail/set-open
      as: Text
      cardinality: one

command!: &vault/set-tree-open-device
  description: "Save expanded folders without rewriting replica identity."
  with:
    open:
      description: "Pipe-prefixed, space-separated expanded folder ids."
      the: dom.event.detail/device-tree-open
      as: Text
      cardinality: one

command!: &wiki/comment-add
  with:
    note:
      description: "The note being commented on"
      the: dom.event.detail/cnote
      as: Entity
      cardinality: one
    snippet:
      description: "The commented block's text"
      the: dom.event.detail/csnippet
      as: Text
      cardinality: one
    text:
      description: "Comment body text"
      the: dom.event.detail/ctext
      as: Text
      cardinality: one
    time:
      description: "Client epoch-ms timestamp"
      the: dom.event.detail/time
      as: Float
      cardinality: one


# ==========================================================================
# Rules
# ==========================================================================

rule!:
  assert!: prose
  when:
    - assert: prose/edit
      where: { this: ?event, content: ?content, subject: ?this }

rule!:
  assert!: prose
  when:
    - assert: vault/new-linked-note
      where: { this: ?this, name: ?name, time: _, order: ?order, parent: ?parent }
    - assert: ==
      where: { this: ?content, is: "" }

rule!:
  assert!: prose
  when:
    - assert: vault/new-linked-root-note
      where: { this: ?this, name: ?name, time: _, order: ?order }
    - assert: ==
      where: { this: ?content, is: "" }

rule!:
  assert!: prose
  when:
    - assert: vault/new-note
      where: { this: ?this, name: ?name, time: _, order: ?order, parent: ?parent }
    - assert: ==
      where: { this: ?content, is: "" }

rule!:
  assert!: prose
  when:
    - assert: vault/new-root-note
      where: { this: ?this, name: ?name, time: _, order: ?order }
    - assert: ==
      where: { this: ?content, is: "" }

rule!:
  assert!: vault
  when:
    - assert: vault/new-note
      where: { this: ?active, name: ?name, time: _, order: ?order, parent: ?parent }
    - assert: vault
      where: { this: ?this, title: ?title, active: _ }

rule!:
  assert!: vault
  when:
    - assert: vault/new-root-note
      where: { this: ?active, name: ?name, time: _, order: ?order }
    - assert: vault
      where: { this: ?this, title: ?title, active: _ }

rule!:
  assert!: vault
  when:
    - assert: vault/open
      where: { node: ?active }
    - assert: vault
      where: { this: ?this, title: ?title, active: _ }

rule!:
  assert!: vault/config
  when:
    - assert: vault/save-config
      where: { theme: ?theme, startup: ?startup, auto-open: ?auto-open }
    - assert: vault/frame
      where: { this: ?this, title: _ }

rule!:
  assert!: vault/config
  when:
    - assert: vault/save-config
      where: { theme: ?theme, startup: ?startup, auto-open: ?auto-open }
    - assert: vault/frame
      where: { this: ?this, title: _ }

rule!:
  assert!: vault/here
  when:
    - assert: vault/open
      where: { node: ?active }
    - assert: tonk/replica
      where: { this: ?this, profile: ?profile, subject: ?subject }

rule!:
  assert!: vault/here-active
  when:
    - assert: vault/open-device
      where: { active: ?active }
    - assert: tonk/replica
      where: { this: ?this, profile: _, subject: _ }

rule!:
  assert!: vault/node
  when:
    - assert: vault/new-folder
      where: { this: ?this, name: ?name, time: _, order: ?order, parent: ?parent }
    - assert: ==
      where: { this: ?kind, is: "folder" }

rule!:
  assert!: vault/node
  when:
    - assert: vault/new-linked-note
      where: { this: ?this, name: ?name, time: _, order: ?order, parent: ?parent }
    - assert: ==
      where: { this: ?kind, is: "file" }

rule!:
  assert!: vault/node
  when:
    - assert: vault/new-linked-root-note
      where: { this: ?this, name: ?name, time: _, order: ?order }
    - assert: ==
      where: { this: ?kind, is: "file" }

rule!:
  assert!: vault/node
  when:
    - assert: vault/new-note
      where: { this: ?this, name: ?name, time: _, order: ?order, parent: ?parent }
    - assert: ==
      where: { this: ?kind, is: "file" }

rule!:
  assert!: vault/node
  when:
    - assert: vault/new-root-folder
      where: { this: ?this, name: ?name, time: _, order: ?order }
    - assert: ==
      where: { this: ?kind, is: "folder" }

rule!:
  assert!: vault/node
  when:
    - assert: vault/new-root-note
      where: { this: ?this, name: ?name, time: _, order: ?order }
    - assert: ==
      where: { this: ?kind, is: "file" }

rule!:
  assert!: vault/node-name
  when:
    - assert: vault/rename
      where: { name: ?name, node: ?this }

rule!:
  assert!: vault/node-order
  when:
    - assert: vault/move
      where: { node: ?this, order: ?order, parent: ?parent }

rule!:
  assert!: vault/node-order
  when:
    - assert: vault/move-root
      where: { node: ?this, order: ?order }

rule!:
  assert!: vault/node-order
  when:
    - assert: vault/restore
      where: { node: ?this, order: ?order }

rule!:
  retract!: vault/node-order
  when:
    - assert: vault/delete
      where: { node: ?this }
    - assert: vault/node-order
      where: { this: ?this, order: ?order }

rule!:
  assert!: vault/node-parent
  when:
    - assert: vault/move
      where: { node: ?this, order: ?order, parent: ?parent }

rule!:
  retract!: vault/node-parent
  when:
    - assert: vault/move-root
      where: { node: ?this, order: ?order }
    - assert: vault/node-parent
      where: { this: ?this, parent: ?parent }

rule!:
  assert!: vault/settings
  when:
    - assert: vault/save-settings
      where: { theme: ?theme, startup: ?startup, auto-open: ?auto-open }
    - assert: tonk/replica
      where: { this: ?this, profile: ?profile, subject: ?subject }

rule!:
  assert!: vault/tree
  when:
    - assert: vault/set-open
      where: { open: ?open }
    - assert: tonk/replica
      where: { this: ?this, profile: ?profile, subject: ?subject }

rule!:
  assert!: vault/tree-open
  when:
    - assert: vault/set-tree-open-device
      where: { open: ?open }
    - assert: tonk/replica
      where: { this: ?this, profile: _, subject: _ }

rule!:
  assert!: wiki/comment
  when:
    - assert: wiki/comment-add
      where: { this: ?this, note: ?note, text: ?text, time: ?time, snippet: ?snippet }


# ==========================================================================
# Views
# ==========================================================================

view!:
  this: tonk:member
  show:
    label: |2
      {name}

view!:
  this: tonk:prose
  show:
    ui: |2
      <div class="vault-editor">
        <tonk-prose
          onchange=prose/edit
          data-subject={this}
          placeholder="Write something…"
          auto-focus
          style="display: block; min-height: 12rem;"
        >{content}</tonk-prose>
      </div>
    directory: |2
      <div class="wiki-prose-row" data-note={this}>{content}</div>

view!:
  this: space:home
  show:
    ui: |2
      <tonk-display model=vault/page />

view!:
  this: tonk:vault/config
  show:
    directory: |2
      <div class="vault-config-rows" hidden>
        <div class="vault-config-row" data-theme={theme} data-auto-open={auto-open} data-startup={startup} data-vault={this}></div>
      </div>

view!:
  this: tonk:vault/frame
  show:
    ui: |2
      <div class="vault-root">
        <style>
          /* -- full bleed ------------------------------------------
             The binder wraps every sheet in a bordered card with a
             title strip. A file tree beside an editor is a whole
             application surface, not a card, so both come off. The
             height then has to be carried down by FLEX, not
             percentages: a percentage can't resolve against a
             flex-grown ancestor (the same reason the portal sub-chain
             in sheets.yaml fills by flex). */
          tonk-sheet:has(.vault-root) { border: none; }
          tonk-sheet:has(.vault-root) .tonk-sheet__head { display: none; }
          tonk-sheet:has(.vault-root) > tonk-display {
            display: flex; flex-direction: column; overflow: hidden;
          }
          tonk-sheet:has(.vault-root) > tonk-display > tonk-view {
            display: flex; flex-direction: column; flex: 1; min-height: 0;
          }

          .vault-root {
            display: grid;
            /* 269px, not a round number: the FAB docks at a 16px inset and its
               cells are 36px (sync tile) + 216px (space cell), so the divider
               after the space name paints at x = 268–269 (tonk-fab
               logic.rs/markup.rs). A 269px column puts the sidebar's 1px
               border exactly under that divider. Holds while the FAB rests at
               its default left dock in the full (non-compact) layout. */
            grid-template-columns: 269px minmax(0, 1fr);
            /* Fills whether the parent is the flex chain above or a plain
               block (a standalone route), so the sidebar always reaches
               the bottom edge. */
            flex: 1;
            height: 100%;
            min-height: 0;
            overflow: hidden;
          }
          /* The theme + type layer is shared with the wiki's body-mounted
             surfaces: the settings dialog's .vt-scrim and the .vt-errlog
             popover leave .vault-root to cover the whole viewport, and out
             there they would inherit the host theme's wine-tinted tokens. */
          .vault-root, .vt-scrim, .vt-errlog {
            /* The wiki's three faces — Gestalte (chrome + headings), Charter
               (note reading), IBM Plex Mono (code) — all loaded from the
               base64-inline <wp-fonts>. Inter is gone: it was never embedded,
               so it only ever fell back to the system sans anyway. Redefining
               the wa-* font vars at this scope is what removes the host faces
               from every descendant — custom properties reach shadow DOM
               where selectors cannot. */
            --grove-font-display: "Gestalte", "Gestalte Book", system-ui, -apple-system, sans-serif;
            --grove-font-sans: "Gestalte", "Gestalte Book", system-ui, -apple-system, sans-serif;
            --grove-font-serif: "Charter", "Bitstream Charter", "XCharter", "Sitka Text", Cambria, Georgia, serif;
            --grove-font-mono: "IBM Plex Mono", ui-monospace, Menlo, Monaco, monospace;
            --wa-font-family-body: var(--grove-font-sans);
            --wa-font-family-heading: var(--grove-font-display);
            --wa-font-family-code: var(--grove-font-mono);
            /* Monochrome, pinned. The wiki is black/white/gray and must not
               inherit the host theme's temperature — the portal's stone/lowfi
               tokens are warm- and wine-tinted, and every gray here arrives
               through a --wa-* token, so the full token layer the wiki
               consumes is restated in pure grays (r = g = b), light here and
               dark in the theme blocks below. Stone·ink belongs to the FABB;
               demo pages carry their own palettes and never read these. */
            --wa-color-surface-default: #ffffff;
            --wa-color-surface-raised: #f6f6f6;
            --wa-color-surface-border: #e4e4e4;
            --wa-color-text-normal: #1a1a1a;
            --wa-color-text-quiet: #8a8a8a;
            --wa-color-neutral-fill-quiet: #f0f0f0;
            --wa-color-neutral-fill-normal: #e4e4e4;
            --wa-color-neutral-fill-loud: #2e2e2e;
            --wa-color-neutral-on-quiet: #1a1a1a;
            --wa-color-neutral-on-normal: #1a1a1a;
            --wa-color-neutral-on-loud: #ffffff;
            --wa-color-neutral-border-quiet: #ececec;
            --wa-color-neutral-border-normal: #cfcfcf;
            --wa-color-neutral-border-loud: #767676;
            --wa-color-focus: #1a1a1a;
            --wa-color-danger-fill-loud: #cc3333;
            /* Links: Tonk Blue (71BBE7), which only WORKS as ink on a dark
               ground (~8:1 there, 2.1:1 on white — far under AA). Light mode
               gets the same hue stepped down to #256993 (~6:1 on white).
               tonk-prose reads --wa-color-text-link into --tonk-prose-link in
               both of its theme blocks, so this crosses the shadow boundary
               with no component involved. The stone·ink study was considered
               and declined: its law is "ink only, no accent" and its one hue
               sits at 16% lightness — a link colour needs to be an accent. */
            --wa-color-text-link: #256993;
            /* Grove is low-fi: sharp corners everywhere the radius tokens reach. */
            --wa-border-radius-s: 0px;
            --wa-border-radius-m: 0px;
            /* One source for the page bar and the sidebar control row so their
               controls stay aligned across the two columns. */
            --vault-bar-h: 48px;
            /* --wa-color-neutral-fill-quiet resolves to the SAME value as
               --wa-color-surface-raised in this theme, and the sidebar and top bar
               are both painted raised — so every hover that used it was invisible.
               Hover steps to fill-normal; the color-mix line then softens it so a
               hovered row still reads as weaker than a selected one. The plain
               declaration first is the fallback where color-mix is unsupported. */
            --vault-fill-hover: var(--wa-color-neutral-fill-normal);
            --vault-fill-hover: color-mix(in oklab, var(--wa-color-neutral-fill-normal) 55%, transparent);
            /* The host paints the Web Awesome brand tokens neon lime (#deff1a)
               in both themes. <tonk-prose> derives its selection and caret
               colours from those tokens inside its shadow root, and Web
               Awesome controls read the same tokens. Remapping them here
               folds all of that into the neutral scale — warm greys in light,
               the dark surfaces in dark — because custom properties cross the
               shadow boundary where selectors cannot. Selection takes the
               `normal` fill, not `quiet`: quiet is the raised-surface colour
               and would vanish. */
            --wa-color-brand-fill-quiet: var(--wa-color-neutral-fill-normal);
            --wa-color-brand-fill-normal: var(--wa-color-neutral-fill-normal);
            --wa-color-brand-fill-loud: var(--wa-color-neutral-fill-loud);
            --wa-color-brand-border-quiet: var(--wa-color-neutral-border-quiet);
            --wa-color-brand-border-normal: var(--wa-color-neutral-border-normal);
            --wa-color-brand-border-loud: var(--wa-color-neutral-border-loud);
            --wa-color-brand-on-quiet: var(--wa-color-neutral-on-quiet);
            --wa-color-brand-on-normal: var(--wa-color-neutral-on-normal);
            --wa-color-brand-on-loud: var(--wa-color-neutral-on-loud);
            /* The host declares its COMPONENT tokens on the root element as
               `var(--wa-color-…)`. A custom property resolves where it is
               DECLARED, so those became literals of the host's ink (#38182a in
               light) before our remap above ever applied, and then inherited
               into the wiki as that literal — which is how a purple tooltip
               survived a monochrome token layer. Re-declaring them here makes
               them resolve again, against the grays on this element. Same list
               as wa.css: `:where(:root), .wa-theme-default, .wa-light, .wa-dark`. */
            /* Outlined, not filled: a page can already carry a filled label
               and a filled button, and a solid tooltip on top of them reads as
               a third control rather than as help. WA paints the arrow from
               the background alone (`--arrow-color: var(--wa-tooltip-
               background-color)`), so an outlined box would sprout an
               unoutlined nub — the arrow is collapsed instead. Verified
               against the real component: body computes white, 1px #767676,
               12px, arrow ~1px. */
            --wa-tooltip-background-color: var(--wa-color-surface-default);
            --wa-tooltip-border-color: var(--wa-color-neutral-border-loud);
            --wa-tooltip-content-color: var(--wa-color-text-normal);
            --wa-tooltip-font-size: 12px;
            --wa-tooltip-arrow-size: 0px;
            --wa-form-control-activated-color: var(--wa-color-neutral-fill-loud);
            --wa-form-control-background-color: var(--wa-color-surface-default);
            --wa-form-control-border-color: var(--wa-color-neutral-border-loud);
            --wa-form-control-label-color: var(--wa-color-text-normal);
            --wa-form-control-value-color: var(--wa-color-text-normal);
            --wa-form-control-hint-color: var(--wa-color-text-quiet);
            --wa-form-control-placeholder-color: var(--wa-color-text-quiet);
            font-family: var(--wa-font-family-body);
            font-size: 13px;
            /* No tracking: the -0.006em here was Inter's, not Gestalte's. */
            letter-spacing: normal;
            color: var(--wa-color-text-normal);
            background: transparent;
          }
          .vault-data { display: none; }
          /* Tonk Blue proper earns its keep only on a dark ground — see the
             token comment above. The host stamps .wa-light / .wa-dark on the
             root element; the media query covers a root carrying neither. */
          /* Theme twins. The footer toggle stamps .wa-light / .wa-dark on the
             root element; the media query covers a root carrying neither. The
             dark ramp is the same pure grays, roles flipped — no cast. */
          @media (prefers-color-scheme: dark) {
            .vault-root, .vt-scrim, .vt-errlog {
              --wa-color-text-link: #71BBE7;
              --wa-color-surface-default: #161616;
              --wa-color-surface-raised: #1e1e1e;
              --wa-color-surface-border: #2f2f2f;
              --wa-color-text-normal: #ececec;
              --wa-color-text-quiet: #8f8f8f;
              --wa-color-neutral-fill-quiet: #232323;
              --wa-color-neutral-fill-normal: #2f2f2f;
              --wa-color-neutral-fill-loud: #d9d9d9;
              --wa-color-neutral-on-quiet: #ececec;
              --wa-color-neutral-on-normal: #ececec;
              --wa-color-neutral-on-loud: #161616;
              --wa-color-neutral-border-quiet: #262626;
              --wa-color-neutral-border-normal: #3d3d3d;
              --wa-color-neutral-border-loud: #9a9a9a;
              --wa-color-focus: #ececec;
              --wa-color-danger-fill-loud: #e05656;
            }
          }
          .wa-light .vault-root, .wa-light .vt-scrim, .wa-light .vt-errlog {
            --wa-color-text-link: #256993;
            --wa-color-surface-default: #ffffff;
            --wa-color-surface-raised: #f6f6f6;
            --wa-color-surface-border: #e4e4e4;
            --wa-color-text-normal: #1a1a1a;
            --wa-color-text-quiet: #8a8a8a;
            --wa-color-neutral-fill-quiet: #f0f0f0;
            --wa-color-neutral-fill-normal: #e4e4e4;
            --wa-color-neutral-fill-loud: #2e2e2e;
            --wa-color-neutral-on-quiet: #1a1a1a;
            --wa-color-neutral-on-normal: #1a1a1a;
            --wa-color-neutral-on-loud: #ffffff;
            --wa-color-neutral-border-quiet: #ececec;
            --wa-color-neutral-border-normal: #cfcfcf;
            --wa-color-neutral-border-loud: #767676;
            --wa-color-focus: #1a1a1a;
            --wa-color-danger-fill-loud: #cc3333;
          }
          .wa-dark .vault-root, .wa-dark .vt-scrim, .wa-dark .vt-errlog {
            --wa-color-text-link: #71BBE7;
            --wa-color-surface-default: #161616;
            --wa-color-surface-raised: #1e1e1e;
            --wa-color-surface-border: #2f2f2f;
            --wa-color-text-normal: #ececec;
            --wa-color-text-quiet: #8f8f8f;
            --wa-color-neutral-fill-quiet: #232323;
            --wa-color-neutral-fill-normal: #2f2f2f;
            --wa-color-neutral-fill-loud: #d9d9d9;
            --wa-color-neutral-on-quiet: #ececec;
            --wa-color-neutral-on-normal: #ececec;
            --wa-color-neutral-on-loud: #161616;
            --wa-color-neutral-border-quiet: #262626;
            --wa-color-neutral-border-normal: #3d3d3d;
            --wa-color-neutral-border-loud: #9a9a9a;
            --wa-color-focus: #ececec;
            --wa-color-danger-fill-loud: #e05656;
          }
          /* -- tree ------------------------------------------------ */
          vault-tree {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: auto;
            position: relative;
            border-right: var(--wa-border-width-s) solid var(--wa-color-surface-border);
            background: var(--wa-color-surface-raised);
          }
          .vt-head {
            display: flex; flex-direction: column; gap: var(--wa-space-xs);
            padding: 0 12px 10px;
            position: sticky; top: 0; z-index: 1;
            background: var(--wa-color-surface-raised);
          }
          /* Keep the sidebar controls aligned with the page bar. The workspace
             name and dividing rule are intentionally absent: this is an action
             row, not a second title bar. */
          .vt-headrow {
            display: flex; align-items: center; gap: var(--wa-space-xs);
            height: var(--vault-bar-h); box-sizing: border-box; flex: none;
            margin: 0 -12px; padding: 0 12px;
          }
          .vt-headfill { flex: 1 1 auto; }
          .vt-tools { display: flex; gap: 2px; }
          .vt-tool {
            width: 26px; height: 26px; padding: 5px;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--wa-color-text-quiet);
            background: none; border: none;
            border-radius: var(--wa-border-radius-s);
          }
          .vt-tool:hover {
            color: var(--wa-color-text-normal);
            background: var(--vault-fill-hover);
          }
          .vt-tool svg { width: 100%; height: 100%; display: block; }
          .vt-searchwrap { position: relative; display: flex; }
          .vt-searchwrap > svg {
            position: absolute; left: 9px; top: 50%; translate: 0 -50%;
            width: 14px; height: 14px; pointer-events: none;
            color: var(--wa-color-text-quiet);
          }
          .vt-search {
            flex: 1 1 auto; min-width: 0;
            font: inherit; color: inherit;
            padding: var(--wa-space-2xs) var(--wa-space-s);
            padding-left: 30px;
            background: var(--wa-color-surface-default);
            border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
            border-radius: var(--wa-border-radius-s);
            outline: none;
          }
          .vt-search:focus { border-color: var(--wa-color-neutral-border-loud); }
          .vt-list {
            --vt-indent: 18px; /* one tree level */
            --vt-caret: 14px;  /* chevron box; a note's name starts after it */
            /* No gap: the guide lines run row to row without a break. */
            display: flex; flex-direction: column; gap: 0;
            padding: 0 var(--wa-space-xs) var(--wa-space-l);
          }
          .vt-row {
            display: flex; align-items: center; gap: 0;
            min-height: 26px; padding: 0 var(--wa-space-2xs) 0 6px;
            cursor: pointer; border-radius: var(--wa-border-radius-s);
            user-select: none;
          }
          .vt-row:hover { background: var(--vault-fill-hover); }
          /* Selection reads identically for a folder and a note — it was
             previously the same fill as :hover, so a selected folder went
             invisible the moment the cursor left it. The OPEN note is
             distinguished by weight, not by a different fill. */
          .vt-row.is-selected,
          .vt-row.is-active {
            background: var(--wa-color-neutral-fill-normal);
          }
          .vt-row.is-active .vt-name { font-weight: var(--wa-font-weight-semibold); }
          .vt-row.is-selected .vt-name { color: var(--wa-color-text-normal); }
          /* One spacer per ancestor. Its line sits under that ancestor's
             chevron and spans the full row height, so across the gapless
             list it reads as one continuous guide down the open folder. */
          .vt-guide {
            flex: none; width: var(--vt-indent); align-self: stretch;
            position: relative;
          }
          .vt-guide::before {
            content: ""; position: absolute; top: 0; bottom: 0;
            left: calc(var(--vt-caret) / 2 - 0.5px); width: 1px;
            background: var(--wa-color-surface-border);
          }
          /* Lucide `chevron-right`, turned to point down while the folder is
             open. The glyph is drawn a little larger than its box so it reads
             at the weight of the folder icon beside it. A note keeps the
             empty box (`is-leaf`) so its name starts on the same column as
             the folder icons beside it. */
          .vt-caret {
            flex: none; width: var(--vt-caret); height: var(--vt-caret);
            margin-right: 4px;
            display: inline-flex; align-items: center; justify-content: center;
            color: var(--wa-color-text-quiet);
          }
          .vt-caret svg {
            width: 18px; height: 18px; flex: none; display: block;
            transition: rotate 120ms ease;
          }
          .vt-caret.is-open svg { rotate: 90deg; }
          /* Lucide `folder` / `folder-open`, in currentColor like every other
             icon in the app. */
          .vt-icon {
            flex: none; width: 16px; height: 16px; margin-right: 8px;
            color: var(--wa-color-text-quiet);
          }
          .vt-icon svg { width: 100%; height: 100%; display: block; }
          .vt-name {
            flex: 1 1 auto; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
          }
          .vt-row.is-folder .vt-name {
            font-weight: var(--wa-font-weight-semibold);
            color: var(--wa-color-text-quiet);
          }
          /* Rename edits the label in place. The field takes exactly the
             label's box — same slot, font, weight, line box, zero padding and
             border, no intrinsic input width — so the text does not move by a
             pixel when editing starts or ends. The row, not the field, shows
             the state: an inset ring on the default surface, the way Finder
             and VS Code frame an inline rename. */
          .vt-rename {
            flex: 1 1 auto; width: 0; min-width: 0;
            box-sizing: border-box; margin: 0; padding: 0;
            border: 0; border-radius: 0; outline: none; box-shadow: none;
            appearance: none; -webkit-appearance: none;
            min-height: 0; height: auto;
            font: inherit; line-height: inherit; letter-spacing: inherit;
            color: var(--wa-color-text-normal);
            background: transparent;
          }
          .vt-row.is-folder .vt-rename,
          .vt-row.is-active .vt-rename { font-weight: var(--wa-font-weight-semibold); }
          .vt-row.is-renaming,
          .vt-row.is-renaming:hover {
            background: var(--wa-color-surface-default);
            box-shadow: inset 0 0 0 1px var(--wa-color-neutral-border-loud);
          }
          .vt-empty {
            display: flex; flex-direction: column;
            align-items: center; gap: var(--wa-space-s);
            padding: var(--wa-space-l) var(--wa-space-s);
            color: var(--wa-color-text-quiet); text-align: center;
          }
          .vt-firstnote {
            font: inherit; cursor: pointer;
            padding: var(--wa-space-2xs) var(--wa-space-m);
            color: var(--wa-color-neutral-on-loud);
            background: var(--wa-color-neutral-fill-loud);
            border: none; border-radius: var(--wa-border-radius-s);
          }
          .vt-firstnote:hover { filter: brightness(1.08); }
          /* -- sidebar footer (Grove's bottom bar) ------------------ */
          /* Sticky, so it stays put while the tree scrolls behind it. The
             warnings triangle only appears once something has gone wrong;
             the log itself lives in the popover, not in the sidebar. */
          .vt-foot {
            position: sticky; bottom: 0;
            margin-top: auto;
            display: flex; align-items: center; gap: 2px;
            padding: 8px 10px;
            background: var(--wa-color-surface-raised);
          }
          .vt-errs { position: relative; }
          .vt-errs-count {
            position: absolute; top: -1px; right: -1px;
            min-width: 13px; height: 13px; padding: 0 3px;
            display: grid; place-items: center;
            font-size: 9px; line-height: 1;
            color: #fff;
            background: var(--wa-color-danger-fill-loud, #d33);
            border-radius: 7px;
          }
          .vt-errlog {
            position: fixed; z-index: 60;
            width: min(360px, calc(100vw - 24px));
            max-height: 40vh; overflow: auto;
            display: flex; flex-direction: column; gap: 6px;
            padding: 10px 12px;
            background: var(--wa-color-surface-raised);
            border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
            box-shadow: var(--wa-shadow-l, 0 8px 24px rgb(0 0 0 / .28));
            /* Body-mounted, outside .vault-root — restate the chrome stack. */
            font-family: "Gestalte", "Gestalte Book", system-ui, -apple-system, sans-serif;
            font-size: 11px; line-height: 1.5;
            color: var(--wa-color-text-normal);
          }
          .vt-errlog-head {
            display: flex; justify-content: space-between; align-items: center;
          }
          .vt-errlog-title {
            font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
            color: var(--wa-color-text-quiet);
          }
          .vt-errlog-clear {
            font: inherit; font-size: 11px; cursor: pointer;
            border: none; background: none; padding: 2px 4px;
            color: var(--wa-color-text-quiet);
          }
          .vt-errlog-clear:hover { color: var(--wa-color-text-normal); }
          .vt-warn {
            color: var(--wa-color-danger-fill-loud, #eb5757);
            word-break: break-all;
            font-family: var(--grove-font-mono, ui-monospace, monospace);
            font-size: 10px;
          }

          /* -- right-click menu ------------------------------------ */
          .vt-menu {
            position: fixed; z-index: 40; min-width: 148px;
            display: flex; flex-direction: column; padding: 4px;
            background: var(--wa-color-surface-raised);
            border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
            border-radius: var(--wa-border-radius-m);
            box-shadow: var(--wa-shadow-l, 0 8px 24px rgb(0 0 0 / .28));
          }
          .vt-menuitem {
            /* Hardened against the host's button base styles, which lay the
               label out with flex centering and generous metrics — text-align
               alone cannot win that fight, so display and the metrics are
               restated here. */
            display: block; width: 100%;
            font: inherit; font-size: 13px; line-height: 1.4;
            min-height: 0;
            text-align: left; cursor: pointer;
            padding: 4px 10px;
            color: var(--wa-color-text-normal);
            background: none; border: none;
            border-radius: var(--wa-border-radius-s);
          }
          /* The same fill as a selected tree row: visible on the raised
             surface (the quiet fill is not), and neutral like the rest of the
             chrome rather than the host's brand lime. */
          .vt-menuitem:hover,
          .vt-menuitem:focus-visible {
            background: var(--wa-color-neutral-fill-normal);
            color: var(--wa-color-text-normal);
            outline: none;
          }
          .vt-menusep {
            height: 1px; margin: 4px 2px;
            background: var(--wa-color-surface-border);
          }

          /* -- drag and drop --------------------------------------- */
          .vt-row[draggable="true"] { -webkit-user-drag: element; }
          .vt-row.is-drop-into {
            background: var(--wa-color-neutral-fill-normal);
            box-shadow: inset 0 0 0 1px var(--wa-color-neutral-border-loud);
          }
          /* A line, not a fill: "between these two" has to read differently
             from "inside this one". */
          .vt-row.is-drop-before { box-shadow: inset 0 2px 0 0 var(--wa-color-neutral-border-loud); }
          .vt-row.is-drop-after { box-shadow: inset 0 -2px 0 0 var(--wa-color-neutral-border-loud); }
          vault-tree.is-drop-root .vt-list {
            box-shadow: inset 0 0 0 1px var(--wa-color-neutral-border-loud);
            border-radius: var(--wa-border-radius-s);
          }

          /* -- move-to palette -------------------------------------- */
          .vt-palette {
            width: min(560px, calc(100vw - 32px));
            max-height: min(60vh, 460px);
            display: flex; flex-direction: column;
            background: var(--wa-color-surface-raised);
            border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
            border-radius: var(--wa-border-radius-m);
            box-shadow: var(--wa-shadow-l, 0 16px 48px rgb(0 0 0 / .45));
            overflow: hidden;
          }
          .vt-palette__input {
            font: inherit; font-size: var(--wa-font-size-m);
            color: var(--wa-color-text-normal);
            padding: var(--wa-space-m);
            background: transparent; border: none;
            border-bottom: var(--wa-border-width-s) solid var(--wa-color-surface-border);
            outline: none;
          }
          .vt-palette__list { flex: 1 1 auto; overflow: auto; padding: var(--wa-space-2xs); }
          .vt-palette__row {
            padding: var(--wa-space-xs) var(--wa-space-s);
            border-radius: var(--wa-border-radius-s);
            cursor: pointer; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
          }
          .vt-palette__row:hover { background: var(--wa-color-neutral-fill-quiet); }
          .vt-palette__row.is-on {
            background: var(--wa-color-neutral-fill-normal);
            color: var(--wa-color-text-normal);
          }
          .vt-palette__none {
            padding: var(--wa-space-m);
            color: var(--wa-color-text-quiet); text-align: center;
          }
          .vt-palette__hint {
            display: flex; justify-content: center; gap: var(--wa-space-s);
            padding: var(--wa-space-xs);
            font-size: var(--wa-font-size-xs);
            color: var(--wa-color-text-quiet);
            border-top: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          }
          .vt-palette__hint b { font-weight: var(--wa-font-weight-semibold); }

          /* -- confirm dialog -------------------------------------- */
          .vt-scrim {
            position: fixed; inset: 0; z-index: 60;
            display: flex; align-items: center; justify-content: center;
            background: rgb(0 0 0 / .45);
          }
          .vt-dialog {
            width: min(420px, calc(100vw - 32px));
            display: flex; flex-direction: column; gap: var(--wa-space-s);
            padding: var(--wa-space-l);
            background: var(--wa-color-surface-raised);
            border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
            border-radius: var(--wa-border-radius-m);
            box-shadow: var(--wa-shadow-l, 0 16px 48px rgb(0 0 0 / .4));
            font-size: var(--wa-font-size-s);
          }
          .vt-dialog__title {
            font-size: var(--wa-font-size-m);
            font-weight: var(--wa-font-weight-semibold);
          }
          .vt-dialog__path {
            font-family: var(--wa-font-family-code, ui-monospace, monospace);
            font-size: var(--wa-font-size-xs);
            padding: var(--wa-space-xs) var(--wa-space-s);
            color: var(--wa-color-text-normal);
            background: var(--wa-color-surface-default);
            border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
            border-radius: var(--wa-border-radius-s);
            word-break: break-word;
          }
          .vt-dialog__body { color: var(--wa-color-text-quiet); line-height: 1.5; }
          .vt-dialog__note {
            font-size: var(--wa-font-size-xs);
            color: var(--wa-color-text-quiet);
          }
          .vt-dialog__acts {
            display: flex; justify-content: flex-end; gap: var(--wa-space-s);
            margin-top: var(--wa-space-xs);
          }
          .vt-btn {
            font: inherit; cursor: pointer;
            padding: var(--wa-space-2xs) var(--wa-space-m);
            color: var(--wa-color-text-normal);
            background: var(--wa-color-surface-default);
            border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
            border-radius: var(--wa-border-radius-s);
          }
          .vt-btn:hover { background: var(--wa-color-neutral-fill-quiet); }
          .vt-btn--danger {
            color: #fff;
            background: var(--wa-color-danger-fill-loud, #d33);
            border-color: transparent;
          }
          /* Restate the fill: plain `.vt-btn:hover` is more specific than the
             variant class, so without this the hover swapped red for the
             near-white quiet fill under white text — an invisible button. */
          .vt-btn--danger:hover {
            background: var(--wa-color-danger-fill-loud, #d33);
            filter: brightness(1.1);
          }
          .vt-btn--primary {
            color: var(--wa-color-neutral-on-loud);
            background: var(--wa-color-neutral-fill-loud);
            border-color: transparent;
          }
          .vt-btn--primary:hover {
            background: var(--wa-color-neutral-fill-loud);
            filter: brightness(1.08);
          }

          /* -- settings dialog ------------------------------------- */
          .vt-settings { width: min(480px, calc(100vw - 32px)); gap: var(--wa-space-m); }
          .vt-settings__section {
            display: flex; flex-direction: column;
            border-top: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          }
          .vt-settings__heading {
            padding: var(--wa-space-m) 0 var(--wa-space-xs);
            font-size: var(--wa-font-size-xs);
            font-weight: var(--wa-font-weight-semibold);
            letter-spacing: .04em; text-transform: uppercase;
            color: var(--wa-color-text-quiet);
          }
          .vt-settings__picker {
            display: flex; flex-direction: column; gap: var(--wa-space-xs);
            padding: var(--wa-space-s) 0 0;
            color: var(--wa-color-text-quiet);
          }
          .vt-settings__picker select {
            width: 100%; font: inherit;
            padding: var(--wa-space-xs) var(--wa-space-s);
            color: var(--wa-color-text-normal);
            background: var(--wa-color-surface-default);
            border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
            border-radius: var(--wa-border-radius-s);
          }

          /* -- undo toast ------------------------------------------ */
          .vt-toast {
            /* Lifted clear of the workspace tab strip along the bottom
               edge, which would otherwise sit under the toast. */
            position: fixed; left: var(--wa-space-m); bottom: 64px;
            z-index: 55; max-width: 320px;
            display: flex; align-items: center; gap: var(--wa-space-m);
            padding: var(--wa-space-xs) var(--wa-space-s);
            font-size: var(--wa-font-size-s);
            color: var(--wa-color-text-normal);
            background: var(--wa-color-surface-raised);
            border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
            border-radius: var(--wa-border-radius-m);
            box-shadow: var(--wa-shadow-m, 0 6px 20px rgb(0 0 0 / .3));
          }
          .vt-toast span {
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
          }
          .vt-toast__act {
            flex: none; font: inherit; cursor: pointer;
            font-weight: var(--wa-font-weight-semibold);
            color: var(--wa-color-text-normal);
            background: none; border: none; padding: 2px 4px;
          }
          .vt-toast__act:hover { text-decoration: underline; }

          /* -- editor ---------------------------------------------- */
          .vault-main {
            display: flex; flex-direction: column;
            min-width: 0; min-height: 0; overflow: auto;
            overscroll-behavior: contain;
          }
          /* A quiet filename bar, not a headline: notes carry their own `#`
             H1, and a second big title just competes with it. */
          /* Grove's 48px header bar: crumbs + filename left, actions right,
             on the same card surface as the sidebar. */
          .vault-title {
            position: sticky; top: 0; z-index: 1;
            /* flex: none, or the 48px is merely a basis: .vault-main is a column
               flex container, and on a note taller than the pane the bar would
               surrender its share of the deficit and render at 29px. */
            height: var(--vault-bar-h); flex: 0 0 auto; box-sizing: border-box;
            display: flex; align-items: center;
            /* 6 here + 6 inside each icon button = the 12px inset the crumb text
               starts at on the left. Equal optical margins, not equal boxes. */
            padding: 0 6px 0 12px;
            border-bottom: var(--wa-border-width-s) solid var(--wa-color-surface-border);
            background: var(--wa-color-surface-raised);
            font-size: 13px;
            color: var(--wa-color-text-quiet);
          }
          .vault-title > vault-title {
            /* Baseline, not center: the crumbs span and the filename input
               have different box heights, so centering the boxes leaves their
               TEXT baselines a pixel or two apart. Flex baseline alignment
               lines the text up directly; the icon buttons opt back into
               centering below, since a glyph box has no useful baseline. */
            display: flex; align-items: baseline; gap: 6px;
            flex: 1 1 auto; min-width: 0;
          }
          .vault-title > vault-title > :is(.vtitle__menu, .vtitle__share) {
            align-self: center;
          }
          .vtitle__crumbs {
            display: inline-flex; align-items: center; gap: 6px;
            flex: 0 1 auto; min-width: 0; max-width: 45%;
            overflow: hidden;
            /* Same size and metrics as the filename input beside it — one
               breadcrumb line, visually. Hierarchy comes from weight and
               color alone (crumbs 400/quiet, name 600/normal); the matching
               block padding is what keeps the baselines level with an input,
               which centers its text in its own content box. */
            font-size: 14px; line-height: normal;
            padding: var(--wa-space-2xs) 0;
            color: var(--wa-color-text-quiet);
            white-space: nowrap;
          }
          .vtitle__crumbs:empty { display: none; }
          .vtitle__crumb { overflow: hidden; text-overflow: ellipsis; }
          .vtitle__crumbsep { flex: none; }
          /* Off-canvas trigger — desktop keeps the tree permanently docked,
             so it only earns its space on narrow layouts. */
          .vtitle__menu {
            display: none; flex: none;
            width: 28px; height: 28px; padding: 6px;
            align-items: center; justify-content: center;
            cursor: pointer; color: var(--wa-color-text-quiet);
            background: none; border: none;
            border-radius: var(--wa-border-radius-s);
          }
          .vtitle__menu:hover {
            color: var(--wa-color-text-normal);
            background: var(--vault-fill-hover);
          }
          /* 16px is the glyph size everywhere in the app. The button box grows with
             the band it sits in (30px here, 26px in the sidebar); the glyph does
             not, because that is what the eye actually measures. */
          .vtitle__menu svg { width: 16px; height: 16px; display: block; }
          /* Copy-link: icon-only, with the copy-label as its hover tooltip.
             Centre both the custom-element host and its internal button: Web
             Awesome's inline host otherwise keeps a text baseline and makes
             the link glyph sit high beside the other controls. */
          .vtitle__share {
            flex: none; align-self: center;
            width: 28px; height: 28px;
            display: inline-flex; align-items: center; justify-content: center;
            line-height: 0;
            color: var(--wa-color-text-quiet);
          }
          .vtitle__share::part(button) {
            width: 28px; height: 28px; padding: 6px;
            display: inline-flex; align-items: center; justify-content: center;
            background: none; border: none;
            border-radius: var(--wa-border-radius-s);
            color: inherit; cursor: pointer;
          }
          .vtitle__share::part(button):hover {
            color: var(--wa-color-text-normal);
            background: var(--vault-fill-hover);
          }
          /* The one focus treatment for icon buttons in the bar and the tree
             head. Inset so the tightened bar padding cannot clip it, and drawn in
             a palette token rather than the browser's or Web Awesome's accent. */
          .vtitle__menu:focus-visible,
          .vt-tool:focus-visible,
          .vtitle__share::part(button):focus-visible {
            outline: 2px solid var(--wa-color-text-normal);
            outline-offset: -2px;
            color: var(--wa-color-text-normal);
          }
          .vtitle__share-label { display: inline-flex; color: var(--wa-color-text-quiet); }
          .vtitle__share:hover .vtitle__share-label { color: var(--wa-color-text-normal); }
          .vtitle__share-label svg { width: 16px; height: 16px; display: block; }
          /* Collapsed tree — desktop only. Keep a slim rail containing the
             sidebar-owned toggle, and hide the rest of the navigation chrome. */
          @media (min-width: 641px) {
            .vault-root.is-tree-collapsed { grid-template-columns: 48px minmax(0, 1fr); }
            .vault-root.is-tree-collapsed vault-tree { overflow: hidden; }
            .vault-root.is-tree-collapsed .vt-head { padding: 0; }
            .vault-root.is-tree-collapsed .vt-headrow {
              justify-content: center; margin: 0; padding: 0;
            }
            .vault-root.is-tree-collapsed .vt-headfill,
            .vault-root.is-tree-collapsed .vt-tools,
            .vault-root.is-tree-collapsed .vt-searchwrap,
            .vault-root.is-tree-collapsed .vt-list,
            .vault-root.is-tree-collapsed .vt-foot { display: none; }
          }
          /* `.vault-doc` carries an explicit display rule below, which would
             otherwise beat the `hidden` attribute the pane starts with. */
          .vault-doc[hidden] { display: none; }
          .vault-scrim { display: none; }
          /* Reads as a label until you reach for it, then behaves like the
             input it actually is. */
          /* Chrome-free in every state: no hover box, no focus ring. It
             should read as the filename and behave as a field, with the
             caret and the selection doing all the signalling. */
          .vault-title .vtitle {
            display: block; box-sizing: border-box; width: auto;
            flex: 1 1 0; min-width: 8ch;
            /* The page name is the most specific thing on screen, so it outranks
               both the folder crumbs beside it (12px/400/quiet) and the workspace
               name across the divider (13px/500). It stays well under the note's
               own 34px H1, so the two never compete. `font: inherit` would reset
               the tracking to the UA default — inputs do not inherit it — hence
               the explicit letter-spacing. */
            font: inherit; font-size: 14px; font-weight: 600;
            letter-spacing: inherit;
            color: var(--wa-color-text-normal); cursor: text;
            padding: var(--wa-space-2xs) 0;
            background: transparent;
            border: none;
            outline: none;
            appearance: none;
          }
          /* No focus chrome either — the caret and the text selection are
             the only feedback the field needs. */
          .vault-title .vtitle:focus { outline: none; box-shadow: none; }
          .vault-title .vtitle:disabled { opacity: .5; }
          .vault-doc {
            flex: 1 1 auto; min-height: 0;
            /* Grove's page: air above the title and a 740px reading measure. */
            padding: 44px 0 30vh;
          }
          /* Keep the stock editor in a quiet centred reading column. */
          .vault-doc .vault-editor {
            box-sizing: border-box;
            width: min(100%, 740px);
            margin: 0 auto;
          }
          /* <tonk-prose> frames itself — border, radius, surface fill and an
             inner padding — which reads as a card floating in the pane. This
             IS the pane, so strip only that frame. Editing behavior and
             document rendering remain entirely Tonk-Prose's defaults. */
          .vault-doc tonk-prose {
            /* Notes read in Charter — the space's long-form face. */
            --tonk-prose-font: var(--grove-font-serif);
            --tonk-prose-heading-font: var(--grove-font-display);
            --tonk-prose-mono: var(--grove-font-mono);
            --tonk-prose-padding: 0;
            --tonk-prose-max-width: none;
            --tonk-prose-font-size: 15px;
            display: block;
            min-width: 0;
            border: none;
            border-radius: 0;
            background: transparent;
          }

          /* -- page headings ---------------------------------------- */
          /* The host styles bare h1-h6 as shrink-to-fit boxes with a surface
             background — a panel painted behind the text (the welcome page
             resets the same rules locally). Vault pages render their h-tags
             in light DOM inside .vault-doc, so undo the box once here, for
             every current and future page, and set the display face. Only
             box properties, the colour, and the family: margins, sizes, and
             weights stay with each page's own styles. */
          .vault-root .vault-doc :is(h1, h2, h3, h4, h5, h6) {
            display: block;
            width: auto; max-width: none;
            float: none;
            background: none; border: 0; box-shadow: none;
            /* The host's box is an inverse "cover": text-normal behind,
               neutral-fill-quiet as the text colour. With the background gone
               that left #eeedec headings on a white card in light mode (and
               the card's own colour in dark), so take the page's colour. */
            color: inherit;
            padding: 0;
            text-wrap: wrap;
            font-family: var(--grove-font-display);
          }

          /* <tonk-prose> rings itself on :focus-within. Sensible for an
             editor sitting in a form; noise when the editor IS the page. */
          .vault-doc tonk-prose:focus-within {
            border: none;
            box-shadow: none;
          }

          /* -- blank state ----------------------------------------- */
          /* An empty vault leaves `active` pointing at nothing renderable,
             so swap the whole editor out rather than let it resolve. The
             tree's own empty row is the signal — keyed on the vault-empty
             variant only, so a fruitless SEARCH doesn't blank the editor. */
          .vault-blank { display: none; }
          .vault-root:has(vault-tree .is-vault-empty) .vault-title,
          .vault-root:has(vault-tree .is-vault-empty) .vault-doc { display: none; }
          .vault-root:has(vault-tree .is-vault-empty) .vault-blank {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: var(--wa-space-2xs);
            flex: 1; min-height: 0;
            color: var(--wa-color-text-quiet);
          }
          .vault-blank__lead {
            margin: 0;
            font-size: var(--wa-font-size-l);
            color: var(--wa-color-text-normal);
          }
          .vault-blank__hint { margin: 0; font-size: var(--wa-font-size-s); }

          /* -- narrow layouts -------------------------------------- */
          /* The iframe's width is the sheet's, so this fires on phones and
             on a skinny desktop pane alike. The tree stops being a column
             and becomes an off-canvas drawer over the editor. */
          @media (max-width: 640px) {
            .vault-root { grid-template-columns: minmax(0, 1fr); }
            vault-tree {
              position: fixed; z-index: 45;
              top: 0; bottom: 0; left: 0;
              width: min(84vw, 320px);
              transform: translateX(-100%);
              transition: transform 160ms ease;
              border-right: var(--wa-border-width-s) solid var(--wa-color-surface-border);
            }
            vault-tree.is-open {
              transform: none;
              box-shadow: 0 0 48px rgb(0 0 0 / .5);
            }
            .vault-root:has(vault-tree.is-open) .vault-scrim {
              display: block; position: fixed; inset: 0; z-index: 44;
              background: rgb(0 0 0 / .45);
            }
            .vtitle__menu { display: inline-flex; }
            /* Pointer targets, not glyphs: the boxes grow, the 16px icons do not. */
            .vtitle__menu { width: 40px; height: 40px; }
            .vtitle__share { width: 40px; height: 40px; }
            .vtitle__share::part(button) { width: 40px; height: 40px; }
            .vt-tool { width: 36px; height: 36px; }
            .vault-doc { padding: var(--wa-space-m) var(--wa-space-m) 30vh; }
            .vault-title { padding: 0 6px; }
            /* Crumbs cede the narrow bar to the filename. */
            .vtitle__crumbs { display: none; }
            /* 16px keeps iOS Safari from zooming the page on focus. */
            .vault-title .vtitle, .vt-search, .vt-palette__input { font-size: 16px; }
            .vt-palette { width: calc(100vw - 24px); }
          }
        </style>

        <div class="vault-data" hidden>
          <tonk-display model=component></tonk-display>
          <tonk-display model=tonk:vault/node></tonk-display>
          <tonk-display model=tonk:vault/tree></tonk-display>
          <tonk-display model=tonk:vault/here></tonk-display>
          <tonk-display model=tonk:vault/config></tonk-display>
          <!-- Pages (vault-pages.yaml): hidden rows so <vault-active> can
               switch the editor display's model for notes that are pages. -->
          <tonk-display model=tonk:vault/page></tonk-display>
          <!-- Grove faces are base64-inline in the shared wp-fonts component;
               its cache makes mounting here and in pages inexpensive. -->
          <wp-fonts></wp-fonts>
        </div>

        <!-- `active` is NOT bound here any more: it is this device's, not the
             vault's, so `<vault-active>` applies it from the hidden
             `vault/here` row (part 9). A renderer binding as well would mean
             two writers fighting over the same attribute every frame. -->
        <vault-tree
          onsetopen=vault/set-tree-open-device
          onconfigsave=vault/save-config
          onnavigate=vault/open-device
          onnewrootnote=vault/new-root-note
          onnewrootfolder=vault/new-root-folder
          onnewnote=vault/new-note
          onnewfolder=vault/new-folder
          onrenamenode=vault/rename
          ondeletenode=vault/delete
          onrestorenode=vault/restore
          onmovenode=vault/move
          onmoverootnode=vault/move-root></vault-tree>

        <div class="vault-main">
          <div class="vault-scrim"></div>
          <div class="vault-title">
            <vault-title onrenamenode=vault/rename></vault-title>
          </div>
          <!-- The placeholder entity is load-bearing, not a nicety. An absent
               `entity` puts `<tonk-display>` in DIRECTORY mode, which mounts
               every prose document in the space — measured at 148 live
               `<tonk-prose>` editors on this vault before the placeholder was
               added. `id:vault/pending` resolves to no instance, so the
               display sits in its absence state until `<vault-active>`
               swaps in the real note. The pane starts hidden so that state
               is never seen. -->
          <div class="vault-doc" hidden>
            <vault-active>
              <tonk-display entity=id:vault/pending model=prose view=ui></tonk-display>
            </vault-active>
          </div>
          <div class="vault-blank">
            <p class="vault-blank__lead">No notes yet</p>
            <p class="vault-blank__hint">Create one with the buttons above the file tree.</p>
          </div>
        </div>
      </div>

view!:
  this: tonk:vault/here
  show:
    directory: |2
      <div class="vault-here-rows" hidden>
        <div class="vault-here-row" data-active={active} data-replica={this}></div>
      </div>

view!:
  this: tonk:vault/node
  show:
    directory: |2
      <div class="vault-node-rows">
        <div class="vault-node-row" subject={this} data-node={this} data-name={name} data-kind={kind} data-order={order} data-parent={parent}></div>
      </div>
    label: |2
      {name}

view!:
  this: tonk:vault/node-name
  show:
    label: |2
      {name}

view!:
  this: tonk:vault/open-link
  show:
    ui: |2
      <div class="workspace-directory" data-note={entity}>
        <style>
          /* A deep-linked Vault uses the same viewport ownership as the normal
             route: the shell stays fixed and only .vault-main scrolls. */
          html:has(.workspace-directory),
          body:has(.workspace-directory) {
            width: 100%;
            height: 100%;
            min-height: 0;
            margin: 0;
            overflow: hidden !important;
          }
          .workspace-directory {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: auto;
            max-height: 100dvh;
