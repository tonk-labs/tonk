# SPDX-License-Identifier: CC0-1.0
# Tonk asserted notation. Repeated top-level keys are intentional.
#
# Starter space — News
#
# Tonk News demo: stories, comments, and upvotes
#
# One of 8 notation documents that recreate the Tonk starter space in a
# fresh space. Evaluate them in file order:
#
#   tonk eval 1-vault.yaml
#   tonk eval 2-pages.yaml
#   tonk eval 3-news.yaml
#   tonk eval 4-todos.yaml
#   tonk eval 5-budget.yaml
#   tonk eval 6-dots.yaml
#   tonk eval 7-zork.yaml
#   tonk eval 8-playground.yaml
#
# Exported from the live space on 2026-09-08 with Tonk 0.6.12. Blobs are
# embedded as data: URIs. Runtime state (per-device state, session
# transcripts, agent heartbeats, the roster, and history) is left out.
#
# Author: Tonk <hello@tonk.xyz>. The authors' own work is CC0 1.0; embedded
# fonts and third-party artwork keep their own licenses (see LICENSE.txt
# in the vault).


# ==========================================================================
# Attributes
# ==========================================================================

attribute!: &a-comments
  description: "Comment count"
  the: blue.bumble.news/comments
  as: UnsignedInteger
  cardinality: one

attribute!: &a-ctext
  description: "The comment body"
  the: blue.bumble.news.comment/text
  as: Text
  cardinality: one

attribute!: &a-ctime
  description: "Original posting time, ms since the epoch"
  the: blue.bumble.news.comment/time
  as: Float
  cardinality: one

attribute!: &a-points
  description: "Upvote count"
  the: blue.bumble.news/points
  as: UnsignedInteger
  cardinality: one

attribute!: &a-story
  description: "The story originally commented on"
  the: blue.bumble.news.comment/story
  as: Entity
  cardinality: one

attribute!: &a-text
  description: "Story body text; \"-\" when absent"
  the: blue.bumble.news/text
  as: Text
  cardinality: one

attribute!: &a-time
  description: "Submission time, epoch milliseconds"
  the: blue.bumble.news/time
  as: Float
  cardinality: one

attribute!: &a-title
  description: "Story title"
  the: blue.bumble.news/title
  as: Text
  cardinality: one

attribute!: &a-url
  description: "Story URL; the sentinel \"-\" marks a text (Ask) post"
  the: blue.bumble.news/url
  as: Text
  cardinality: one

attribute!: &news-heading
  description: "Marks the vault note hosting the Tonk News demo"
  the: xyz.tonk.demo.news/heading
  as: Text
  cardinality: one


# ==========================================================================
# Concepts
# ==========================================================================

concept!: &comment
  description: "A comment on a story"
  with:
    story: a-story
    text: a-ctext
    time: a-ctime

concept!: &news-demo-page
  description: "The Tonk News demo - a reduced Hacker News rendered as a vault page"
  with:
    heading: news-heading

concept!: &news/comment
  this: tonk:news/comment
  description: "A comment on a story — optionally a reply to another comment — with its author."
  with:
    story: a-story
    text: a-ctext
    time: a-ctime
  maybe:
    author:
      description: "The poster's profile DID"
      the: blue.bumble.news.comment/author
      as: Entity
      cardinality: one
    handle:
      description: "The poster's display-name snapshot"
      the: blue.bumble.news.comment/handle
      as: Text
      cardinality: one
    parent:
      description: "The original parent comment, when this was a reply"
      the: blue.bumble.news.comment/parent
      as: Entity
      cardinality: one

concept!: &news/comment-content
  this: tonk:news/comment-content
  description: "The author-owned payload removed when a Tonk News comment is deleted."
  with:
    author:
      description: "The poster's profile DID"
      the: blue.bumble.news.comment/author
      as: Entity
      cardinality: one
    text: a-ctext

concept!: &news/comment-handle
  this: tonk:news/comment-handle
  description: "The optional display-name snapshot removed with an author-deleted comment."
  with:
    handle:
      description: "The poster's display-name snapshot"
      the: blue.bumble.news.comment/handle
      as: Text
      cardinality: one

concept!: &news/deleted-comment
  this: tonk:news/deleted-comment
  description: "A deleted Tonk News comment retained only to anchor its replies."
  with:
    deleted:
      description: "True after the author deletes the comment"
      the: blue.bumble.news.comment/deleted
      as: Boolean
      cardinality: one
    story: a-story
    time: a-ctime
  maybe:
    parent:
      description: "The original parent comment, when this was a reply"
      the: blue.bumble.news.comment/parent
      as: Entity
      cardinality: one

concept!: &story
  description: "A submitted story (link or Ask post)"
  with:
    comments: a-comments
    points: a-points
    text: a-text
    time: a-time
    title: a-title
    url: a-url


# ==========================================================================
# Commands (transient concepts fired by the UI)
# ==========================================================================

command!: &news/delete-comment
  description: "Delete a signed comment after matching its stored author."
  with:
    author:
      description: "The current profile DID presented by the author-only UI"
      the: dom.event.detail/delete-author
      as: Entity
      cardinality: one
    comment:
      description: "The comment being deleted"
      the: dom.event.detail/delete-comment
      as: Entity
      cardinality: one
    deleted:
      description: "The tombstone marker"
      the: dom.event.detail/delete-mark
      as: Boolean
      cardinality: one

command!: &news/post-comment
  description: "Post a top-level comment, signed by the poster's profile."
  with:
    author:
      description: "The poster's profile DID"
      the: dom.event.detail/comment-author
      as: Entity
      cardinality: one
    handle:
      description: "The poster's display name"
      the: dom.event.detail/comment-handle
      as: Text
      cardinality: one
    story:
      description: "The story commented on"
      the: dom.event.detail/comment-story
      as: Entity
      cardinality: one
    text:
      description: "The comment body"
      the: dom.event.detail/comment-text
      as: Text
      cardinality: one
    time:
      description: "Posting time, ms since the epoch (Date.now())"
      the: dom.event.detail/comment-time
      as: Float
      cardinality: one

command!: &news/reply
  description: "Reply to a comment, signed by the poster's profile."
  with:
    author:
      description: "The poster's profile DID"
      the: dom.event.detail/reply-author
      as: Entity
      cardinality: one
    handle:
      description: "The poster's display name"
      the: dom.event.detail/reply-handle
      as: Text
      cardinality: one
    parent:
      description: "The comment being replied to"
      the: dom.event.detail/reply-parent
      as: Entity
      cardinality: one
    story:
      description: "The story commented on"
      the: dom.event.detail/reply-story
      as: Entity
      cardinality: one
    text:
      description: "The comment body"
      the: dom.event.detail/reply-text
      as: Text
      cardinality: one
    time:
      description: "Posting time, ms since the epoch (Date.now())"
      the: dom.event.detail/reply-time
      as: Float
      cardinality: one

command!: &post-comment
  with:
    story:
      description: "The story being commented on"
      the: dom.event.detail/story
      as: Entity
      cardinality: one
    text:
      description: "Comment body text"
      the: dom.event.detail/ctext
      as: Text
      cardinality: one
    time:
      description: "Client epoch-ms timestamp"
      the: dom.event.detail/time
      as: Float
      cardinality: one

command!: &post-story
  with:
    text:
      description: "Submitted story body, dash sentinel when absent"
      the: dom.event.detail/text
      as: Text
      cardinality: one
    time:
      description: "Client epoch-ms timestamp"
      the: dom.event.detail/time
      as: Float
      cardinality: one
    title:
      description: "Submitted story title"
      the: dom.event.detail/title
      as: Text
      cardinality: one
    url:
      description: "Submitted story URL, dash sentinel for Ask posts"
      the: dom.event.detail/url
      as: Text
      cardinality: one

command!: &upvote
  with:
    item:
      description: "The story being upvoted, from data-vote"
      the: dom.event.current-target.dataset/vote
      as: Entity
      cardinality: one


# ==========================================================================
# Rules
# ==========================================================================

rule!:
  assert!: comment
  when:
    - assert: post-comment
      where: { this: ?this, text: ?text, time: ?time, story: ?story }

rule!:
  assert!: news/comment
  when:
    - assert: news/post-comment
      where: { this: ?this, text: ?text, time: ?time, story: ?story, author: ?author, handle: ?handle }

rule!:
  assert!: news/comment
  when:
    - assert: news/reply
      where: { this: ?this, text: ?text, time: ?time, story: ?story, author: ?author, handle: ?handle, parent: ?parent }

rule!:
  retract!: news/comment-content
  when:
    - assert: news/delete-comment
      where: { author: ?author, comment: ?this, deleted: ?deleted }
    - assert: news/comment
      where: { this: ?this, text: ?text, time: _, story: _, author: ?author, handle: _, parent: _ }

rule!:
  retract!: news/comment-handle
  when:
    - assert: news/delete-comment
      where: { author: ?author, comment: ?this, deleted: ?deleted }
    - assert: news/comment
      where: { this: ?this, text: _, time: _, story: _, author: ?author, handle: _, parent: _ }
    - assert: news/comment-handle
      where: { this: ?this, handle: ?handle }

rule!:
  assert!: news/deleted-comment
  when:
    - assert: news/delete-comment
      where: { author: ?author, comment: ?this, deleted: ?deleted }
    - assert: news/comment
      where: { this: ?this, text: _, time: ?time, story: ?story, author: ?author, handle: _, parent: _ }

rule!:
  assert!: news/deleted-comment
  when:
    - assert: news/delete-comment
      where: { author: ?author, comment: ?this, deleted: ?deleted }
    - assert: news/comment
      where: { this: ?this, text: _, time: ?time, story: ?story, author: ?author, handle: _, parent: ?parent }

rule!:
  assert!: story
  when:
    - assert: post-comment
      where: { text: _, time: _, story: ?this }
    - assert: story
      where: { this: ?this, url: ?url, text: ?text, time: ?time, title: ?title, points: ?points, comments: ?old }
    - assert: math/sum
      where: { is: ?comments, of: ?old, with: 1 }

rule!:
  assert!: story
  when:
    - assert: post-story
      where: { this: ?this, url: ?url, text: ?text, time: ?time, title: ?title }
    - assert: ==
      where: { this: 1, is: ?points }
    - assert: ==
      where: { this: 0, is: ?comments }

rule!:
  assert!: story
  when:
    - assert: upvote
      where: { item: ?this }
    - assert: story
      where: { this: ?this, url: ?url, text: ?text, time: ?time, title: ?title, points: ?old, comments: ?comments }
    - assert: math/sum
      where: { is: ?points, of: ?old, with: 1 }


# ==========================================================================
# Views
# ==========================================================================

view!:
  this: news-demo-page
  show:
    ui: |2
      <tn-news class="tn">
      <style>
        /* Full-bleed: the app IS the pane. The editor's is-page chain sets
           min-height:100% down to tonk-view but block boxes can't relay a
           percentage through an auto height, so each level becomes a flex
           column and the app stretches with flex:1. min-height stays auto on
           every level so tall content still grows and scrolls in vault-main. */
        .vault-doc.is-page:has(.tn) { display:flex; flex-direction:column; }
        .vault-doc.is-page:has(.tn) > vault-active,
        .vault-doc.is-page vault-active:has(.tn) > tonk-display,
        .vault-doc.is-page vault-active:has(.tn) > tonk-display > tonk-view {
          display:flex; flex-direction:column; flex:1 1 auto;
        }
        /* Light-only page, whatever the vault's theme: color-scheme keeps the
           browser's own form-control colours light, so input text stays dark
           on the white fields below even when the host runs .wa-dark. */
        .tn { background:#f6f6ef; font-family:Verdana,Geneva,sans-serif; font-size:10pt;
              color:#333; color-scheme:light; display:flex; flex-direction:column; flex:1 1 auto;
              max-width:none; margin:0; padding-bottom:0; }
        .tn a { text-decoration:none; }
        .tn .st { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
        .tn-head { background:#F27121; padding:3px 5px; line-height:16pt; }
        .tn-head a { color:#000; }
        .tn-head .logo { cursor:pointer; }
        .tn-head .logo b { margin-right:8px; color:#000; }
        .tn-head .logobox { border:1px solid #fff; color:#fff; font-weight:bold;
              padding:0 3px; margin-right:5px; font-size:10pt; }
        .tn-head .nav label { color:#000; cursor:pointer; }
        #tnp-top:checked ~ .tn-head .nav [data-p="top"] { color: #fff; }
        #tnp-top:checked ~ .tn-body [data-pane="top"] { display: block; }
        #tnp-new:checked ~ .tn-head .nav [data-p="new"] { color: #fff; }
        #tnp-new:checked ~ .tn-body [data-pane="new"] { display: block; }
        #tnp-past:checked ~ .tn-head .nav [data-p="past"] { color: #fff; }
        #tnp-past:checked ~ .tn-body [data-pane="past"] { display: block; }
        #tnp-comments:checked ~ .tn-head .nav [data-p="comments"] { color: #fff; }
        #tnp-comments:checked ~ .tn-body [data-pane="comments"] { display: block; }
        #tnp-ask:checked ~ .tn-head .nav [data-p="ask"] { color: #fff; }
        #tnp-ask:checked ~ .tn-body [data-pane="ask"] { display: block; }
        #tnp-submit:checked ~ .tn-head .nav [data-p="submit"] { color: #fff; }
        #tnp-submit:checked ~ .tn-body [data-pane="submit"] { display: block; }
        .tn-body [data-pane] { display:none; }
        /* flex:1 pins the footer to the pane's bottom edge on short lists. */
        .tn-body { padding:10px 8px; flex:1 1 auto; }
        .tn-itempane { display:none; padding:10px 8px; }
        .tn.is-item .tn-body { display:none; }
        .tn.is-item .tn-itempane { display:block; flex:1 1 auto; }
        .tn-itempane .on-story { display:none; }
        .tn-back { display:inline-block; color:#828282; font-size:8pt; cursor:pointer; margin-bottom:8px; }
        .tn-back:hover { text-decoration:underline; }
        [data-open-item] { cursor:pointer; }
        .tn-foot { border-top:2px solid #F27121; margin-top:12px; padding:8px;
              text-align:center; font-size:8pt; color:#828282; }
        .tn-foot label { color:#828282; cursor:pointer; }
        .tn-foot label:hover { text-decoration:underline; }
        /* The host app stylesheet is injected into every guest and ships BARE
           class names for the portal's own spaces menu — `.srow`, `.snew`,
           `.sempty`, `.hcell`. `.srow` is also this page's story row, and at
           equal specificity the host's copy won: it turned each row into a
           flex box with `justify-content:flex-end` (the whole list rendered
           right-aligned), padded it 16px and gave it a 44px floor. Ours are
           restated at two classes so the tie can't be re-decided by source
           order, and the properties the host sets are put back explicitly.
           Any generic class this page adds needs the same treatment. */
        .tn .srow { display:block; padding:2px 0; min-height:0;
              color:inherit; background:none; cursor:auto; text-decoration:none; }
        .tn .srow:hover, .tn .srow:active { background:none; }
        .srow-main { display:flex; align-items:baseline; }
        .rank { color:#828282; min-width:1.8em; text-align:right; margin-right:2px; flex:none; }
        .votearrow { color:#999; cursor:pointer; font-size:7.5pt; margin-right:4px;
              flex:none; user-select:none; }
        .votearrow:hover { color:#F27121; }
        .titleline a { color:#000; }
        .titleline a:visited { color:#828282; }
        .sitebit { color:#828282; font-size:8pt; }
        .subtext { color:#828282; font-size:7pt; display:block; margin-left:0; }
        .subtext a { color:#828282; }
        .subtext a:hover { text-decoration:underline; }
        /* The comment-count link is the element itself (see tn-itemlink). */
        .subtext tn-itemlink:hover, .chead tn-itemlink:hover { text-decoration:underline; }
        .entry { display:inline-block; }
        .crow { padding:5px 0; }
        .chead { color:#828282; font-size:8pt; }
        .cuser { color:#828282; }
        .cuser:empty { display:none; }
        .cdelete { display:none; color:#828282; cursor:pointer; user-select:none; }
        .crow.is-mine > .chead .cdelete { display:inline; }
        .cdelete:hover { text-decoration:underline; }
        /* A directory projection can place every live comment beneath one
           tonk-view. Hide only the row being removed, never that shared host. */
        .crow.is-deleting { display:none !important; }
        .crow[data-deleted="true"] > .ctext { color:#828282; font-style:italic; }
        /* "reply" under a comment, item pane only; the comments tab is a
           flat list like HN's. */
        .creply { display:inline-block; margin-top:4px; font-size:8pt; color:#000;
              text-decoration:underline; cursor:pointer; }
        .tn-body [data-pane="comments"] .creply { display:none; }
        /* Header navigation (item pane): root | parent | prev | next [–]. */
        .cnav { color:#828282; }
        .cnav-link, .cnav-toggle { cursor:pointer; user-select:none; }
        .cnav-link:hover { text-decoration:underline; }
        .crow.is-collapsed > .ctext, .crow.is-collapsed > .creply,
        .crow.is-collapsed > tn-reply-form { display:none; }
        /* A moment of tint on the comment a nav link just jumped to. */
        .crow.is-target { background:#ecebdf; }
        .chead a { color:#828282; }
        .chead a:hover { text-decoration:underline; }
        .ctext { font-size:9pt; margin:2px 0 0 0; }
        .pagetitle { font-size:10pt; color:#828282; margin:0 0 8px 0; }
        .subform td { font-size:10pt; padding:2px 4px; }
        .subform .lbl { color:#828282; }
        .subform .orlbl { color:#828282; font-size:8pt; }
        /* Forms as HN draws them: the browser's rounded fields and buttons. */
        .subform input, .subform textarea, .cform textarea, .rform textarea {
              font-family:monospace; font-size:10pt; color:#000; background:#fff;
              border:1px solid #8f8f8f; border-radius:4px; padding:3px 5px;
              box-sizing:content-box; max-width:calc(100% - 12px); }
        .subform button, .cform button, .rform button {
              font-family:Verdana,Geneva,sans-serif; font-size:10pt; color:#000;
              background:#efefef; border:1px solid #8f8f8f; border-radius:4px;
              padding:2px 8px; margin-top:6px; cursor:pointer; }
        .subform button:hover, .cform button:hover, .rform button:hover { background:#e4e4e4; }
        .posting-as { color:#828282; font-size:8pt; margin-left:6px; }
        .rform { display:block; margin:6px 0 4px; }
        .subhelp { color:#828282; font-size:8pt; }
        .note { color:#F27121; font-size:8pt; }
        .itemtop .titleline { font-size:10pt; }
        .itemtext { display:block; font-size:9pt; margin:8px 0; max-width:60em; }
        .cform { display:block; margin:10px 0 14px 0; }
        tn-comments-v4 { display:block; }
        .comments-list { margin-top:6px; }
      </style>
      <input type="radio" name="tnpage" id="tnp-top" class="st" checked><input type="radio" name="tnpage" id="tnp-new" class="st"><input type="radio" name="tnpage" id="tnp-past" class="st"><input type="radio" name="tnpage" id="tnp-comments" class="st"><input type="radio" name="tnpage" id="tnp-ask" class="st"><input type="radio" name="tnpage" id="tnp-submit" class="st">
      <div class="tn-head">
        <a class="logo" data-close-item><span class="logobox">T</span><b>Tonk News</b></a>
        <span class="nav"><label for="tnp-new" data-p="new">new</label> | <label for="tnp-past" data-p="past">past</label> | <label for="tnp-comments" data-p="comments">comments</label> | <label for="tnp-ask" data-p="ask">ask</label> | <label for="tnp-submit" data-p="submit">submit</label></span>
      </div>
      <div hidden><tonk-display model=component></tonk-display></div>
      <div class="tn-body">
        <div data-pane="top"><tn-stories mode="top"><tonk-display model=story></tonk-display></tn-stories></div>
        <div data-pane="new"><tn-stories mode="new"><tonk-display model=story></tonk-display></tn-stories></div>
        <div data-pane="past"><p class="pagetitle">Stories from a day ago and earlier.</p><tn-stories mode="past"><tonk-display model=story></tonk-display></tn-stories></div>
        <div data-pane="comments"><tn-comments-v4 class="comments-list" ondeletecomment=news/delete-comment><tonk-display model=tonk:news/comment></tonk-display><tonk-display model=tonk:news/deleted-comment></tonk-display></tn-comments-v4></div>
        <div data-pane="ask"><tn-stories mode="ask"><tonk-display model=story></tonk-display></tn-stories></div>
        <div data-pane="submit"><tn-submit onpost=post-story></tn-submit></div>
      </div>
      <div class="tn-itempane">
        <a class="tn-back" data-close-item>&#8592; back</a>
        <tonk-display class="tn-itemhost" entity=id:vault/pending model=story></tonk-display>
      </div>
      <div class="tn-foot">
        <label for="tnp-new">new</label> &#183; <label for="tnp-ask">ask</label> &#183; <label for="tnp-submit">submit</label><br>
        Tonk News: a local-first news space. Anyone in this space can submit, vote, and comment.
      </div>
      </tn-news>

view!:
  this: tonk:news/comment
  show:
    directory: |2
      <div class="crow" data-id="{this}" data-story="{story}" data-parent="{parent}" data-author="{author}">
        <span hidden class="d-time">{time}</span>
        <div class="chead"><span class="cuser">{handle}</span> <tn-age from=".d-time"></tn-age><span class="cnav"></span><span class="on-story"> | on:
          <tn-itemlink item="{story}"><tonk-display entity={story} model=story view=label></tonk-display></tn-itemlink></span><span class="cdelete" data-delete="{this}"> | delete</span>
        </div>
        <div class="ctext">{text}</div>
        <span class="creply" data-reply="{this}">reply</span>
      </div>

view!:
  this: tonk:news/deleted-comment
  show:
    directory: |2
      <div class="crow" data-id="{this}" data-story="{story}" data-parent="{parent}" data-deleted="true">
        <span hidden class="d-time">{time}</span>
        <div class="chead"><tn-age from=".d-time"></tn-age><span class="cnav"></span><span class="on-story"> | on:
          <tn-itemlink item="{story}"><tonk-display entity={story} model=story view=label></tonk-display></tn-itemlink></span>
        </div>
        <div class="ctext">[deleted]</div>
      </div>

view!:
  this: story
  show:
    ui: |2
      <div class="tn-item">
        <span hidden class="d-time">{time}</span><span hidden class="d-points">{points}</span><span hidden class="d-comments">{comments}</span>
        <div class="itemtop">
          <div class="srow-main">
            <span class="votearrow" title="upvote" onclick=upvote data-vote="{this}">&#9650;</span>
            <span class="entry">
