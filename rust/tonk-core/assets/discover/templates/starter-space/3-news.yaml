    const ready = (fn) => { const lib = globalThis.__tn; if (lib) fn(lib); else setTimeout(() => ready(fn), 40); };
    customElements.get('tn-comment-form') || customElements.define('tn-comment-form', class extends HTMLElement {
      // Top-level comment box. Signed with the profile from GET /api/profile
      // (`comment` → news/post-comment). If the profile cannot be read the
      // comment still posts, unsigned, through the legacy event
      // (`commentanon` → post-comment).
      connectedCallback() {
        if (this._built) return;
        this._built = true;
        this.innerHTML = [
          '<textarea rows="4" cols="60"></textarea><br>',
          '<button type="button">add comment</button>',
          '<span class="posting-as"></span> <span class="note"></span>'
        ].join('');
        const who = this.querySelector('.posting-as');
        ready((lib) => {
          lib.loadProfile().then((p) => { this._profile = p; who.textContent = 'posting as ' + p.name; },
            () => { this._profile = null; who.textContent = 'profile unavailable — posting anonymously'; });
        });
        this.querySelector('button').addEventListener('click', () => {
          const ta = this.querySelector('textarea');
          const text = ta.value.trim();
          if (!text) return;
          const story = this.getAttribute('story');
          if (!story || story.indexOf('{') !== -1) return;
          const p = this._profile;
          // Signed: verb-specific keys for news/post-comment (camelCase here
          // becomes dom.event.detail/comment-story …). Unsigned: the legacy
          // post-comment keys.
          const detail = p
            ? { commentStory: story, commentText: text, commentTime: Date.now(), commentAuthor: p.did, commentHandle: p.name }
            : { story: story, ctext: text, time: Date.now() };
          this.dispatchEvent(new CustomEvent(p ? 'comment' : 'commentanon', { bubbles: true, detail: detail }));
          ta.value = '';
          this.querySelector('.note').textContent = 'added';
          setTimeout(() => { this.querySelector('.note').textContent = ''; }, 1500);
        });
      }
    });

component!: &tn-title
  this: did:key:z6MkH1RP7AMpYF5Q7p9iAk6EaYpWeeuwK8kctQZgjjgHuQSx
  module: |2
    customElements.get('tn-title') || customElements.define('tn-title', class extends HTMLElement {
      // Title text comes in as `label="{title}"` (see tn-age for why), the
      // link target as `url`, and the item id for Ask posts (no url) as `item`.
      static get observedAttributes() { return ['url', 'item', 'label']; }
      attributeChangedCallback() { this._render(); }
      connectedCallback() { this._render(); }
      _render() {
        const unresolved = (v) => /^\{[^{}]*\}$/.test(v);
        const title = this.getAttribute('label') || '';
        const url = this.getAttribute('url') || '-';
        const item = this.getAttribute('item') || '';
        if (!title || unresolved(title) || unresolved(url) || unresolved(item)) return;
        const key = title + '\u0000' + url + '\u0000' + item;
        if (this._key === key) return;
        this._key = key;
        const a = document.createElement('a');
        a.textContent = title;
        let site = '';
        if (url && url !== '-') {
          a.href = url; a.target = '_blank'; a.rel = 'noopener';
          try { site = new URL(url).hostname.replace(/^www\./, ''); } catch (e) {}
        } else {
          a.setAttribute('data-open-item', item);
        }
        this.textContent = '';
        this.appendChild(a);
        if (site) {
          const s = document.createElement('span');
          s.className = 'sitebit';
          s.textContent = ' (' + site + ')';
          this.appendChild(s);
        }
      }
    });

component!: &tn-stories
  this: did:key:z6MkHqVNoZfYiQ8DsCBQXziri9ub6iKnhYYY9erj4Z2JVtyu
  module: |2
    customElements.get('tn-stories') || customElements.define('tn-stories', class extends HTMLElement {
      connectedCallback() {
        this._mo = new MutationObserver(() => this._q());
        this._mo.observe(this, { childList: true, subtree: true });
        this._q();
      }
      _q() {
        if (this._t) return;
        this._t = setTimeout(() => { this._t = null; this._apply(); }, 0);
      }
      _apply() {
        const rows = [...this.querySelectorAll('.srow')];
        if (!rows.length) return;
        const mode = this.getAttribute('mode') || 'top';
        const now = Date.now();
        const items = rows.map(r => {
          const t = parseFloat((r.querySelector('.d-time') || {}).textContent) || 0;
          const p = parseInt((r.querySelector('.d-points') || {}).textContent) || 0;
          const u = r.getAttribute('data-url') || '';
          return { r, t, p, u, hide: false };
        });
        if (mode === 'ask') items.forEach(x => x.hide = x.u !== '-');
        if (mode === 'past') items.forEach(x => x.hide = (now - x.t) < 86400000);
        const score = x => x.p / Math.pow((now - x.t) / 3600000 + 2, 1.8);
        const byTime = (a, b) => b.t - a.t;
        const byScore = (a, b) => score(b) - score(a);
        items.sort(mode === 'new' || mode === 'past' ? byTime : byScore);
        const parent = rows[0].parentElement;
        if (parent && parent.style.display !== 'flex') {
          parent.style.display = 'flex';
          parent.style.flexDirection = 'column';
        }
        let n = 0;
        for (const x of items) {
          const disp = x.hide ? 'none' : '';
          if (x.r.style.display !== disp) x.r.style.display = disp;
          if (!x.hide) {
            n += 1;
            if (x.r.style.order !== String(n)) x.r.style.order = String(n);
            const rank = x.r.querySelector('.rank');
            const label = n + '.';
            if (rank && rank.textContent !== label) rank.textContent = label;
          }
        }
      }
    });

component!: &tn-submit
  this: did:key:z6MkHwK9rnciCQeKzV6fyuke6TRGeWjiaqCCJzeLyvvKHhut
  module: |2
    customElements.get('tn-submit') || customElements.define('tn-submit', class extends HTMLElement {
      connectedCallback() {
        if (this._built) return;
        this._built = true;
        this.innerHTML = [
          '<table class="subform"><tbody>',
          '<tr><td class="lbl">title</td><td><input name="title" size="50" maxlength="120"></td></tr>',
          '<tr><td class="lbl">url</td><td><input name="url" size="50"></td></tr>',
              '<tr><td class="lbl">text</td><td><textarea name="text" rows="4" cols="49"></textarea></td></tr>',
          '<tr><td></td><td><button type="button">submit</button> <span class="note"></span></td></tr>',
          '</tbody></table>',
          '<p class="subhelp">Leave url blank to submit a question for discussion. If there is no url, text will appear at the top of the thread.</p>'
        ].join('');
        this.querySelector('button').addEventListener('click', () => {
          const g = n => this.querySelector('[name=' + n + ']').value.trim();
          const title = g('title');
          if (!title) { this._note('title is required'); return; }
          let url = g('url');
          if (url) {
            if (!/^https?:\/\//.test(url)) url = 'https://' + url;
            try { new URL(url); } catch (e) { this._note('that url does not look valid'); return; }
          }
          this.dispatchEvent(new CustomEvent('post', {
            bubbles: true,
            detail: { title: title, url: url || '-', text: g('text') || '-', time: Date.now() }
          }));
          this.querySelectorAll('input,textarea').forEach(i => i.value = '');
          this._note('submitted - it is on the new tab');
        });
      }
      _note(m) { this.querySelector('.note').textContent = m; }
    });


