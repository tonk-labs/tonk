# SPDX-License-Identifier: CC0-1.0
# Tonk asserted notation. Repeated top-level keys are intentional.
#
# Starter space — Budget
#
# Infra budget demo: a spreadsheet note
#
# One of 8 notation documents that recreate the Tonk starter space in a
# fresh space. Evaluate them in file order:
#
#   tonk eval 1-vault.yaml
#   tonk eval 2-pages.yaml
#   tonk eval 3-news.yaml
#   tonk eval 4-todos.yaml
#   tonk eval 5-budget.yaml
#   tonk eval 6-dots.yaml
#   tonk eval 7-zork.yaml
#   tonk eval 8-playground.yaml
#
# Exported from the live space on 2026-09-08 with Tonk 0.6.12. Blobs are
# embedded as data: URIs. Runtime state (per-device state, session
# transcripts, agent heartbeats, the roster, and history) is left out.
#
# Author: Tonk <hello@tonk.xyz>. The authors' own work is CC0 1.0; embedded
# fonts and third-party artwork keep their own licenses (see LICENSE.txt
# in the vault).


# ==========================================================================
# Attributes
# ==========================================================================

attribute!: &budget-csv
  description: "The sheet as CSV; cells starting with = are formulas evaluated client-side"
  the: xyz.tonk.budget/csv
  as: Text
  cardinality: one

attribute!: &budget-heading
  description: "Marks the vault note hosting the Budget demo; the page H1"
  the: xyz.tonk.demo.budget/heading
  as: Text
  cardinality: one


# ==========================================================================
# Concepts
# ==========================================================================

concept!: &budget-demo-page
  description: "The Budget demo - a synced spreadsheet with a lightweight formula engine"
  with:
    heading: budget-heading

concept!: &budget/sheet
  description: "A shared budget spreadsheet: whole CSV supersedes on every edit"
  with:
    csv: budget-csv

concept!: &budget/sheet-styles
  description: "Per-sheet presentation for the budget page: bold/italic/underline, alignment, fill and number format for rows, columns and cells, as one JSON map."
  with:
    styles:
      description: "The whole style map as JSON: {s:{sheet}, r:{row:{…}}, c:{col:{…}}, x:{\"r,c\":{…}}}"
      the: xyz.tonk.budget/styles
      as: Text
      cardinality: one

concept!: &budget/sheet-widths
  this: tonk:budget/sheet-widths
  description: "Column widths of a shared budget sheet — px per data column, comma-separated; last-writer-wins like the CSV."
  with:
    widths:
      description: "Column widths in px, one per data column, comma-separated (the row-number gutter is not included)"
      the: xyz.tonk.budget/widths
      as: Text
      cardinality: one


# ==========================================================================
# Commands (transient concepts fired by the UI)
# ==========================================================================

command!: &budget-sync
  with:
    csv:
      description: "The full CSV after the edit"
      the: dom.event.detail/csv
      as: Text
      cardinality: one
    sheet:
      description: "The shared sheet being updated"
      the: dom.event.detail/sheet
      as: Entity
      cardinality: one

command!: &budget/set-styles
  with:
    sheet:
      description: "The sheet whose style map is being replaced"
      the: dom.event.detail/styles-sheet
      as: Entity
      cardinality: one
    styles:
      description: "The whole style map as JSON"
      the: dom.event.detail/styles
      as: Text
      cardinality: one

command!: &budget/set-widths
  description: "Store the column widths after a drag or an auto-fit."
  with:
    sheet:
      description: "The shared sheet whose columns were resized"
      the: dom.event.detail/widths-sheet
      as: Entity
      cardinality: one
    widths:
      description: "The full width list, px per data column, comma-separated"
      the: dom.event.detail/widths
      as: Text
      cardinality: one


# ==========================================================================
# Rules
# ==========================================================================

rule!:
  assert!: budget/sheet
  when:
    - assert: budget-sync
      where: { csv: ?csv, sheet: ?this }

rule!:
  assert!: budget/sheet-styles
  when:
    - assert: budget/set-styles
      where: { sheet: ?this, styles: ?styles }

rule!:
  assert!: budget/sheet-widths
  when:
    - assert: budget/set-widths
      where: { sheet: ?this, widths: ?widths }


# ==========================================================================
# Views
# ==========================================================================

view!:
  this: budget-demo-page
  show:
    ui: |2
      <div class="budget-page">
      <style>
        .budget-page {
          max-width: 940px; width: min(940px, calc(100% - 28px));
          margin: 26px auto 48px; padding: 24px 24px 28px;
          background: var(--wa-color-surface-raised, #fff);
          border: 1px solid var(--wa-color-surface-border, #e6e6e9);
          border-radius: 14px;
          box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 32px rgba(0,0,0,.06);
          color: var(--wa-color-text-normal, #1d1d1f);
          font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
          --bs-line: var(--wa-color-surface-border, #e6e6e9);
          --bs-quiet: var(--wa-color-text-quiet, #8a8a8e);
          --bs-ink: var(--wa-color-text-normal, #1d1d1f);
          --bs-gut: color-mix(in srgb, var(--wa-color-surface-border, #ececef) 30%, transparent);
          --bs-hover: color-mix(in srgb, var(--wa-color-text-normal, #1d1d1f) 6%, transparent);
          --bs-sel: rgba(113, 187, 231, .16);
          --bs-selhead: rgba(113, 187, 231, .30);
          --bs-accent: #71BBE7;
        }
        .budget-page h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.02em; }
        /* The sheet takes keyboard focus after every commit; the active cell
           already draws its ring, so the element's own focus outline is noise. */
        budget-sheet { display: block; }
        budget-sheet:focus, budget-sheet:focus-visible { outline: none; }
        .budget-sub { margin: 0 0 14px; font-size: 13px; color: var(--bs-quiet); }
        .bs-hint { font-size: 12px; color: var(--bs-quiet); }
        .bs-hint b { font-weight: 600; }
        /* -- toolbar ----------------------------------------------------- */
        .bs-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px;
          flex-wrap: wrap; margin-bottom: 8px; }
        .bs-tools { display: inline-flex; align-items: center; gap: 2px; padding: 3px;
          border: 1px solid var(--bs-line); border-radius: 9px; }
        .bs-sep { width: 1px; height: 16px; margin: 0 4px; background: var(--bs-line); }
        /* The host styles every bare <button> as a 40px form control; every metric
           that rule sets is pinned here or the toolbar grows into a row of pills. */
        .bs-tb, .bs-mi, .bs-chev {
          display: inline-flex !important; align-items: center !important; justify-content: center !important;
          box-sizing: border-box !important; margin: 0 !important; border: 0 !important; border-radius: 6px !important;
          background: transparent !important; box-shadow: none !important; color: var(--bs-ink) !important;
          font: inherit !important; line-height: 1 !important; cursor: pointer !important; text-decoration: none !important;
        }
        .bs-tb { width: 26px !important; height: 26px !important; min-height: 0 !important; padding: 0 !important;
          font-size: 13px !important; font-weight: 600 !important; color: var(--bs-quiet) !important; }
        .bs-tb svg { width: 15px; height: 15px; }
        .bs-tb:hover { background: var(--bs-hover) !important; color: var(--bs-ink) !important; }
        .bs-tb.is-on { background: color-mix(in srgb, var(--bs-accent) 22%, transparent) !important; color: var(--bs-ink) !important; }
        .bs-tb:disabled { opacity: .35 !important; cursor: default !important; background: transparent !important; }
        .bs-tb--b { font-weight: 800 !important; }
        .bs-tb--i { font-style: italic !important; font-family: Georgia, "Times New Roman", serif !important; font-size: 15px !important; }
        .bs-tb--u { text-decoration: underline !important; text-underline-offset: 2px; }
        .bs-tb--fmt { font-size: 10.5px !important; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
        /* -- grid -------------------------------------------------------- */
        .bs-scroll { overflow-x: auto; border: 1px solid var(--bs-line); border-radius: 8px; }
        .bs-t { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
        .bs-t th, .bs-t td { border: 1px solid var(--bs-line); padding: 5px 9px; }
        .bs-gut { background: var(--bs-gut); color: var(--bs-quiet); font-size: 10.5px; font-weight: 500;
          text-align: center; min-width: 1.6em; user-select: none; -webkit-user-select: none; }
        .bs-t th.bs-gut { position: relative; padding: 3px 6px; }
        .bs-t th.bs-rowhead, .bs-t th.bs-colhead { cursor: pointer; }
        .bs-t th.bs-rowhead:hover, .bs-t th.bs-colhead:hover, .bs-t th.bs-corner:hover { background: var(--bs-hover); }
        .bs-t th.is-selhead { background: var(--bs-selhead); color: var(--bs-ink); }
        .bs-lbl { display: inline-block; min-width: 1.4em; }
        /* Row/column menus live behind a ⌄ that appears on hover or selection. */
        .bs-chev { position: absolute !important; right: 1px; top: 50%; transform: translateY(-50%);
          width: 16px !important; height: 16px !important; min-height: 0 !important; padding: 0 !important;
          font-size: 11px !important; color: var(--bs-quiet) !important; opacity: 0; transition: opacity 120ms ease; }
        .bs-t th:hover .bs-chev, .bs-t th.is-selhead .bs-chev { opacity: 1; }
        .bs-chev:hover { background: var(--bs-hover) !important; color: var(--bs-ink) !important; }
        .bs-t th.bs-colhead { padding-right: 18px; }
        .bs-cell { cursor: cell; min-width: 4em; white-space: nowrap; user-select: none; -webkit-user-select: none; }
        /* Selection: a tint painted OVER the cell (inset shadow, so a fill colour
           still shows through) and a Tonk-blue ring on the active cell. */
        .bs-t td.is-sel { box-shadow: inset 0 0 0 100vmax var(--bs-sel); }
        .bs-t td.is-active { outline: 2px solid var(--bs-accent); outline-offset: -2px; }
        /* Column widths (see the component): auto layout until someone drags or
           fits a column, then a <colgroup> + fixed layout where the sum of the
           <col> widths wins. Gutter 38px and "+" column 34px in both modes. */
        .bs-t.is-fixed { table-layout: fixed; width: 1px; }
        .bs-t col.bs-cg { width: 38px; }
        .bs-t col.bs-cp { width: 34px; }
        .bs-t th.bs-corner { width: 38px; box-sizing: border-box; }
        .bs-t td.bs-cell { overflow: hidden; text-overflow: ellipsis; }
        .bs-rz { position: absolute; top: 0; bottom: 0; right: -4px; width: 9px; z-index: 1;
          cursor: col-resize; touch-action: none; }
        .bs-rz::after { content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px; width: 2px;
          border-radius: 1px; background: var(--bs-quiet); opacity: 0; transition: opacity 120ms ease; }
        .bs-t tr:first-child:hover .bs-rz::after { opacity: .55; }
        budget-sheet.is-resizing, budget-sheet.is-resizing * { cursor: col-resize; user-select: none; }
        .bs-t td:nth-child(2), .bs-t th:nth-child(2) { white-space: normal; min-width: 13em; }
        .bs-head { font-weight: 700; }
        .bs-num { text-align: right; }
        .bs-formula { color: color-mix(in srgb, var(--bs-ink) 88%, #F27121); }
        .bs-neg { color: #F27121; }
        .bs-err { color: #F27121; font-weight: 600; }
        /* The "+" affordances: a header cell after the last column, a row after the
           last row. Quiet until hovered. The void cells under the + column keep the
           grid rectangular without drawing a column. */
        .bs-t th.bs-plus, .bs-t td.bs-plus { color: var(--bs-quiet); cursor: pointer; font-weight: 500; }
        .bs-t th.bs-plus { width: 34px; box-sizing: border-box; font-size: 14px; }
        .bs-t td.bs-plus { text-align: left; font-size: 12.5px; background: var(--bs-gut); }
        .bs-t th.bs-plus:hover, .bs-t td.bs-plus:hover { color: var(--bs-ink); background: var(--bs-hover); }
        .bs-t td.bs-void { border-top: 0; border-bottom: 0; border-right: 0; background: transparent; padding: 0; }
        .bs-t tr.bs-plusrow th { border-right: 0; }
        /* Editing: the input fills the cell as it is and shows only the caret;
           everything the host's form-control rules set on a bare <input> is reset. */
        .bs-in {
          display: block; width: 100%; min-width: 0; height: auto;
          box-sizing: border-box; margin: 0; padding: 0;
          border: 0; border-radius: 0; outline: none; box-shadow: none;
          background: transparent; color: inherit;
          font: inherit; line-height: inherit; text-align: inherit;
          caret-color: currentColor;
        }
        .bs-wait { color: var(--bs-quiet); font-size: 13px; padding: 14px; }
        .bs-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
          flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--bs-quiet); }
        .bs-count { font-variant-numeric: tabular-nums; }
        /* -- context menus (fixed, viewport-clamped by the component) ---------- */
        .bs-menu { position: fixed; z-index: 70; min-width: 210px; padding: 4px;
          background: var(--wa-color-surface-raised, #fff); border: 1px solid var(--bs-line);
          border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.14), 0 1px 2px rgba(0,0,0,.06);
          font-size: 13px; line-height: 1.3; }
        .bs-mi { width: 100% !important; height: auto !important; min-height: 0 !important;
          justify-content: flex-start !important; gap: 8px !important; padding: 6px 10px !important;
          text-align: left !important; font-size: 13px !important; font-weight: 400 !important; }
        .bs-mi:hover { background: var(--bs-hover) !important; }
        .bs-mi.is-on { color: var(--bs-ink) !important; }
        .bs-mi--danger { color: #cc3333 !important; }
        .bs-mi:disabled { opacity: .4 !important; cursor: default !important; background: transparent !important; }
        .bs-mlabel { flex: 1; }
        .bs-mcheck { color: var(--bs-quiet); font-size: 12px; }
        .bs-msep { height: 1px; margin: 4px 6px; background: var(--bs-line); }
        .bs-mhead { padding: 6px 10px 2px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
          text-transform: uppercase; color: var(--bs-quiet); }
        .bs-swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(0,0,0,.1); flex: 0 0 auto; }
        .budget-how { margin: 14px 0 0; font-size: 12px; color: var(--bs-quiet); }
      </style>
      <div hidden>
        <tonk-display model=component></tonk-display>
        <tonk-display model=budget/sheet></tonk-display>
        <tonk-display model=tonk:budget/sheet-widths></tonk-display>
        <tonk-display model=budget/sheet-styles></tonk-display>
      </div>
      <h1>{heading}</h1>
      <p class="budget-sub">What your stack costs per month — entry prices read off the vendors' own pricing pages (Aug 2026), totalled with live formulas. (The wiki's plain table block stores CSV without evaluating anything; this page adds a lightweight engine on top.)</p>
      <budget-sheet onsheetsync=budget-sync onwidthsync=budget/set-widths onstylesync=budget/set-styles></budget-sheet>
      <p class="budget-how">Method: the cheapest tier that properly covers the job, monthly billing, rounded USD/mo. A 0 means a free tier genuinely does it (GitHub Pages, Discourse&#8217;s free community plan&#8230;); blank means it isn&#8217;t that tool&#8217;s job. Notable: Notion charges per seat, so 40 wiki contributors is 40&#215;$12; Perplexity&#8217;s persistent agentic memory (&#8220;Brain&#8221;) is Max-only at $200. The sheet syncs live to everyone in this space: cells, formatting and column widths are each whole-sheet last-writer-wins, and undo is per viewer. Deleting a row or column rewrites the formulas that pointed past it; a formula that pointed <em>at</em> it shows #REF!.</p>
      </div>

view!:
  this: budget/sheet
  show:
    directory: |2
      <div class="budget-sheet-row" data-sheet={this}><span class="bs-csv" hidden>{csv}</span></div>

view!:
  this: budget/sheet-styles
  show:
    directory: |2
      <div class="budget-styles-row" data-sheet={this} data-styles={styles}></div>

view!:
  this: tonk:budget/sheet-widths
  show:
    directory: |2
      <div class="budget-widths-row" data-sheet={this} data-widths={widths}></div>


# ==========================================================================
# Components (web components loaded by the shell)
# ==========================================================================

component!: &budget-sheet-component
  this: did:key:z6Mk9MwKVynPFZn6oGmPthR5CqVT7SK9uSyZECM8qnszeTiT
  module: |2-
    customElements.get('budget-sheet') || customElements.define('budget-sheet', class extends HTMLElement {
      connectedCallback() {
        if (this._built) { this._arm(); return; }
        this._built = true;
        this.grid = null;
        this.styles = { s: {}, r: {}, c: {}, x: {} };
        this.lastCsv = null;
        this.lastStyles = null;
        this.editing = null;     // { r, c, seed }: seed = text that replaces the cell on open
        this.sel = null;         // { a: {r,c}, f: {r,c} } anchor + focus, an inclusive rectangle
        this.widths = null;      // px per data column, or null = auto layout
        this.lastWidths = null;  // the widths string last seen on the shared row
        this._drag = null;
        this._undo = []; this._redo = [];
        this.tabIndex = 0;       // keyboard target while no cell is being edited
        const ic = (d) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
          'stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
        this.innerHTML = [
          '<div class="bs-bar"><span class="bs-tools" role="toolbar" aria-label="Formatting">',
          '<button type="button" class="bs-tb" data-tb="undo" title="Undo (⌘Z)">', ic('<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>'), '</button>',
          '<button type="button" class="bs-tb" data-tb="redo" title="Redo (⇧⌘Z)">', ic('<path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>'), '</button>',
          '<span class="bs-sep"></span>',
          '<button type="button" class="bs-tb bs-tb--b" data-tb="b" title="Bold (⌘B)">B</button>',
          '<button type="button" class="bs-tb bs-tb--i" data-tb="i" title="Italic (⌘I)">I</button>',
          '<button type="button" class="bs-tb bs-tb--u" data-tb="u" title="Underline (⌘U)">U</button>',
          '<span class="bs-sep"></span>',
          '<button type="button" class="bs-tb" data-tb="a:l" title="Align left">', ic('<path d="M21 6H3M15 12H3M17 18H3"/>'), '</button>',
          '<button type="button" class="bs-tb" data-tb="a:c" title="Align centre">', ic('<path d="M21 6H3M17 12H7M19 18H5"/>'), '</button>',
          '<button type="button" class="bs-tb" data-tb="a:r" title="Align right">', ic('<path d="M21 6H3M21 12H9M21 18H7"/>'), '</button>',
          '<span class="bs-sep"></span>',
          '<button type="button" class="bs-tb" data-tb="fill" title="Fill colour">', ic('<path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/>'), '</button>',
          '<button type="button" class="bs-tb bs-tb--fmt" data-tb="fmt" title="Number format">123</button>',
          '<span class="bs-sep"></span>',
          '<button type="button" class="bs-tb" data-tb="clearfmt" title="Clear formatting">', ic('<path d="M4 7V4h16v3"/><path d="M5 20h6"/><path d="M13 4 8 20"/><path d="m15 15 5 5"/><path d="m20 15-5 5"/>'), '</button>',
          '</span><span class="bs-hint">Click to select, type or double-click to edit. Formulas start with <b>=</b> (SUM, AVG, MIN, MAX, COUNT, A1 refs, + - * /).</span></div>',
          '<div class="bs-scroll"><table class="bs-t"><colgroup></colgroup><tbody></tbody></table></div>',
          '<div class="bs-foot"><span class="bs-count"></span><span class="bs-hint">Right-click a row number or column letter — or use its ⌄ — for insert, delete, sort, fit and more.</span></div>'
        ].join('');

        // Clicks: toolbar, menus, the + affordances, headers select, cells select.
        this.addEventListener('click', (e) => {
          const tb = e.target.closest('.bs-tb');
          if (tb) { this._toolbar(tb.getAttribute('data-tb'), tb); return; }
          const mi = e.target.closest('.bs-mi');
          if (mi) { const act = mi.getAttribute('data-act'); this._closeMenu(); this._act(act); return; }
          if (e.target.closest('.bs-menu')) return;
          this._closeMenu();
          const add = e.target.closest('[data-add]');
          if (add) { this._addLine(add.getAttribute('data-add')); return; }
          const chev = e.target.closest('.bs-chev');
          if (chev) {
            const r = chev.getBoundingClientRect();
            if (chev.dataset.r !== undefined) { this._selectRow(+chev.dataset.r); this._openMenu(this._rowMenu(+chev.dataset.r), r.left, r.bottom); }
            else { this._selectCol(+chev.dataset.c); this._openMenu(this._colMenu(+chev.dataset.c), r.left, r.bottom); }
            return;
          }
          if (e.target.closest('.bs-rz')) return;
          const rh = e.target.closest('th.bs-rowhead');
          if (rh) { this._selectRow(+rh.dataset.r, e.shiftKey); return; }
          const ch = e.target.closest('th.bs-colhead');
          if (ch) { this._selectCol(+ch.dataset.c, e.shiftKey); return; }
          if (e.target.closest('th.bs-corner')) { this._selectAll(); return; }
        });
        this.addEventListener('dblclick', (e) => {
          const rz = e.target.closest('.bs-rz');
          if (rz) { e.preventDefault(); this._autoFit(parseInt(rz.dataset.c, 10)); return; }
          const td = e.target.closest('td.bs-cell');
          if (td && !td.querySelector('.bs-in')) this._edit(+td.dataset.r, +td.dataset.c);
        });
        this.addEventListener('contextmenu', (e) => {
          const rh = e.target.closest('th.bs-rowhead'), ch = e.target.closest('th.bs-colhead'), td = e.target.closest('td.bs-cell');
          if (!rh && !ch && !td) return;
          e.preventDefault();
          if (rh) { this._selectRow(+rh.dataset.r); this._openMenu(this._rowMenu(+rh.dataset.r), e.clientX, e.clientY); }
          else if (ch) { this._selectCol(+ch.dataset.c); this._openMenu(this._colMenu(+ch.dataset.c), e.clientX, e.clientY); }
          else {
            const r = +td.dataset.r, c = +td.dataset.c;
            if (!this._inSel(r, c)) this._select(r, c);
            this._openMenu(this._cellMenu(r, c), e.clientX, e.clientY);
          }
        });
        // Pointer: column resize handles, and press-and-drag range selection.
        this.addEventListener('pointerdown', (e) => {
          const rz = e.target.closest('.bs-rz');
          if (rz && e.button === 0) { e.preventDefault(); this._dragStart(parseInt(rz.dataset.c, 10), e); return; }
          const td = e.target.closest('td.bs-cell');
          if (!td || e.button !== 0 || td.querySelector('.bs-in')) return;
          if (this.editing) this._commit();
          const r = +td.dataset.r, c = +td.dataset.c;
          if (e.shiftKey && this.sel) this._extend(r, c); else this._select(r, c);
          this._selDrag = true;
          const up = () => { this._selDrag = false; window.removeEventListener('pointerup', up); };
          window.addEventListener('pointerup', up);
        });
        this.addEventListener('pointerover', (e) => {
