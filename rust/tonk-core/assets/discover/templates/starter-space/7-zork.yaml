# SPDX-License-Identifier: CC0-1.0
# Tonk asserted notation. Repeated top-level keys are intentional.
#
# Starter space — Zork
#
# Zork I demo: the terminal and its page
#
# One of 8 notation documents that recreate the Tonk starter space in a
# fresh space. Evaluate them in file order:
#
#   tonk eval 1-vault.yaml
#   tonk eval 2-pages.yaml
#   tonk eval 3-news.yaml
#   tonk eval 4-todos.yaml
#   tonk eval 5-budget.yaml
#   tonk eval 6-dots.yaml
#   tonk eval 7-zork.yaml
#   tonk eval 8-playground.yaml
#
# Exported from the live space on 2026-09-08 with Tonk 0.6.12. Blobs are
# embedded as data: URIs. Runtime state (per-device state, session
# transcripts, agent heartbeats, the roster, and history) is left out.
#
# Author: Tonk <hello@tonk.xyz>. The authors' own work is CC0 1.0; embedded
# fonts and third-party artwork keep their own licenses (see LICENSE.txt
# in the vault).


# ==========================================================================
# Concepts
# ==========================================================================

concept!: &zork-demo-page
  this: tonk:zork/demo-page
  description: "A Vault page that plays the MIT-licensed Zork I through a browser Z-machine."
  with:
    heading:
      description: "The title shown above the terminal."
      the: xyz.tonk.demo.zork/heading
      as: Text
      cardinality: one

concept!: &zork-input
  this: tonk:zork/input
  description: "A durable command waiting for the browser Z-machine to execute it."
  with:
    issued:
      description: "Queue order as Unix time in seconds or milliseconds."
      the: xyz.tonk.zork.input/issued
      as: Float
      cardinality: one
    nonce:
      description: "A caller-generated unique token so identical commands can be queued repeatedly."
      the: xyz.tonk.zork.input/nonce
      as: Text
      cardinality: one
    session:
      description: "The Zork page whose interpreter should receive the command."
      the: xyz.tonk.zork.input/session
      as: Entity
      cardinality: one
    text:
      description: "The command text, such as look or open mailbox."
      the: xyz.tonk.zork.input/text
      as: Text
      cardinality: one

concept!: &zork-processed
  this: tonk:zork/processed
  description: "Receipt proving that a queued Zork input was applied."
  with:
    processed:
      description: "Unix time in milliseconds when the next prompt was reached."
      the: xyz.tonk.zork.input/processed
      as: Float
      cardinality: one

concept!: &zork-session
  this: tonk:zork/session
  description: "The durable Zork transcript, portable game state, and command history."
  with:
    history:
      description: "JSON array of submitted commands."
      the: xyz.tonk.zork/history
      as: Text
      cardinality: one
    save:
      description: "Blob reference for the most recent explicit Zork save."
      the: xyz.tonk.zork/save
      as: Text
      cardinality: one
    state:
      description: "Inline base64 Quetzal state used for live session recovery."
      the: xyz.tonk.zork/state
      as: Text
      cardinality: one
    transcript:
      description: "Everything printed in the terminal, including commands."
      the: xyz.tonk.zork/transcript
      as: Text
      cardinality: one


# ==========================================================================
# Commands (transient concepts fired by the UI)
# ==========================================================================

command!: &zork-complete
  this: tonk:zork/complete
  description: "Atomically persist a remote command result and acknowledge its input record."
  with:
    history:
      description: "JSON command history after the remote command."
      the: dom.event.detail/zork-complete-history
      as: Text
      cardinality: one
    input:
      description: "The durable zork-input entity being acknowledged."
      the: dom.event.detail/zork-complete-input
      as: Entity
      cardinality: one
    processed:
      description: "Unix time in milliseconds when execution completed."
      the: dom.event.detail/zork-complete-processed
      as: Float
      cardinality: one
    save:
      description: "Most recent explicit-save blob reference, or blank."
      the: dom.event.detail/zork-complete-save
      as: Text
      cardinality: one
    session:
      description: "The Zork page whose session changed."
      the: dom.event.detail/zork-complete-session
      as: Entity
      cardinality: one
    state:
      description: "Inline base64 Quetzal recovery state after the remote command."
      the: dom.event.detail/zork-complete-state
      as: Text
      cardinality: one
    transcript:
      description: "Terminal transcript after the remote command."
      the: dom.event.detail/zork-complete-transcript
      as: Text
      cardinality: one

command!: &zork-persist
  this: tonk:zork/persist
  description: "Store the current Zork session on its page entity."
  with:
    history:
      description: "Current JSON command history."
      the: dom.event.detail/zork-persist-history
      as: Text
      cardinality: one
    save:
      description: "Most recent explicit-save blob reference, or blank."
      the: dom.event.detail/zork-persist-save
      as: Text
      cardinality: one
    session:
      description: "The Zork page whose session is being saved."
      the: dom.event.detail/zork-persist-session
      as: Entity
      cardinality: one
    state:
      description: "Current inline base64 Quetzal recovery state."
      the: dom.event.detail/zork-persist-state
      as: Text
      cardinality: one
    transcript:
      description: "Current terminal transcript."
      the: dom.event.detail/zork-persist-transcript
      as: Text
      cardinality: one


# ==========================================================================
# Rules
# ==========================================================================

rule!:
  assert!: zork-processed
  when:
    - assert: zork-complete
      where: { save: ?save, input: ?this, state: ?state, history: ?history, session: ?session, processed: ?processed, transcript: ?transcript }

rule!:
  assert!: zork-session
  when:
    - assert: zork-complete
      where: { save: ?save, input: ?input, state: ?state, history: ?history, session: ?this, processed: ?processed, transcript: ?transcript }

rule!:
  assert!: zork-session
  when:
    - assert: zork-persist
      where: { save: ?save, state: ?state, history: ?history, session: ?this, transcript: ?transcript }


# ==========================================================================
# Views
# ==========================================================================

view!:
  this: tonk:zork/demo-page
  show:
    ui: |2
      <main class="zork-page">
        <style>
          .vault-doc.is-page:has(.zork-page) { display:flex; flex-direction:column; }
          .vault-doc.is-page:has(.zork-page) > vault-active,
          .vault-doc.is-page vault-active:has(.zork-page) > tonk-display,
          .vault-doc.is-page vault-active:has(.zork-page) > tonk-display > tonk-view {
            display:flex; flex-direction:column; flex:1 1 auto;
          }
          .zork-page {
            --zk-black: #212121;
            --zk-bg: #212121;
            --zk-panel: #292929;
            --zk-border: #3a3a3a;
            --zk-text: #fafafa;
            --zk-muted: #99998f;
            --zk-green: #85bc6c;
            box-sizing: border-box;
            display: flex; flex-direction: column; flex: 1 1 auto; min-height: 100%;
            margin: 0; padding: 0;
            color: var(--zk-text); background: var(--zk-bg);
            color-scheme: dark;
          }
          .zork-page *, .zork-page *::before, .zork-page *::after { box-sizing: border-box; }
          .zork-page > div[hidden] { display: none !important; }
          zork-terminal-v10 { display: flex; flex: 1 1 auto; min-height: 0; width: 100%; }
          .zk-frame {
            display: grid; grid-template-rows: minmax(0, 1fr) auto;
            flex: 1 1 auto; min-width: 0; overflow: hidden;
            background: var(--zk-bg);
            font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
          }
          .zk-screen {
            display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
            min-height: 0; overflow: hidden; background: var(--zk-bg);
          }
          .zk-status {
            display: flex; align-items: center; gap: 10px; overflow: hidden;
            height: 30px; min-height: 30px; padding: 3px 10px;
            border-bottom: 1px solid var(--zk-green);
            color: var(--zk-green); background: var(--zk-black);
            font-size: 11px; font-weight: 600; white-space: nowrap;
          }
          .zk-location { order: 1; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
          .zk-score { order: 2; flex: 0 0 auto; margin-left: auto; color: inherit; opacity: .72; }
          .zk-agent-copy {
            order: 3; display: inline-flex; align-items: center;
            flex: 0 0 190px; width: 190px; min-width: 190px; max-width: 190px; height: 22px;
          }
          .zk-agent-copy > [slot] {
            display: inline-block; width: 172px; min-width: 172px; max-width: 172px;
            overflow: hidden; text-align: center; white-space: nowrap;
          }
          .zk-agent-copy::part(button) {
            box-sizing: border-box; display: inline-flex; justify-content: center; align-items: center;
            width: 190px; min-width: 190px; max-width: 190px; min-height: 22px;
            padding: 3px 7px; border: 1px solid var(--zk-green); border-radius: 3px;
            color: var(--zk-green); background: var(--zk-black); box-shadow: none;
            font: 600 10px/1.2 ui-monospace, "SFMono-Regular", Consolas, monospace;
          }
          .zk-agent-copy::part(button):hover { color: var(--zk-black); background: var(--zk-green); }
          .zk-agent-copy::part(button):focus-visible {
            outline: 1px solid var(--zk-green); outline-offset: 2px;
          }
          .zk-output {
            min-height: 0; margin: 0; padding: 18px 16px 28px;
            overflow: auto; scrollbar-color: #4a4a45 transparent;
            color: var(--zk-text); background: var(--zk-bg);
            font: 14px/1.55 ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            white-space: pre-wrap; overflow-wrap: anywhere;
          }
          .zk-output::selection, .zk-output *::selection { color: var(--zk-black); background: var(--zk-green); }
          .zk-bold { color: #fff; font-weight: 700; }
          .zk-italic { font-style: italic; }
          .zk-reverse { color: var(--zk-bg); background: var(--zk-text); }
          .zk-fixed { font-family: inherit; }
          .zk-form {
            display: flex; align-items: center; gap: 9px;
            margin: 0; padding: 10px 16px; border-top: 1px solid var(--zk-border);
            background: var(--zk-bg);
          }
          .zk-form label { color: var(--zk-green); font: 600 14px/1 ui-monospace, monospace; }
          .zk-input {
            display: block; flex: 1 1 auto; min-width: 0; height: auto; margin: 0; padding: 3px 0;
            border: 0; border-radius: 0; outline: 0; box-shadow: none;
            color: var(--zk-text); background: transparent;
            font: 14px/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace;
            caret-color: var(--zk-green);
          }
          .zk-input::placeholder { color: #77776f; opacity: 1; }
          .zk-input:disabled { opacity: .75; }
          .zk-bottom {
            display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
            min-height: 38px; padding: 5px 10px;
            border-top: 0;
            color: var(--zk-green); background: var(--zk-black); font-size: 11px;
          }
          .zk-bottom button {
            appearance: none; width: auto; min-height: 25px; margin: 0; padding: 3px 8px;
            border: 1px solid var(--zk-green); border-radius: 3px;
            color: var(--zk-green); background: var(--zk-black);
            font: 11px/1.2 ui-monospace, monospace; cursor: pointer;
          }
          .zk-bottom button:hover, .zk-bottom button:focus-visible {
            color: var(--zk-black); border-color: var(--zk-green); background: var(--zk-green); outline: none;
          }
          .zk-flash { margin-left: auto; color: var(--zk-green); font-size: 11px; }
          .zk-license {
            width: 100%; margin: 0; padding: 6px 14px;
            border-top: 1px solid var(--zk-border);
            color: #77776f; background: var(--zk-bg);
            font: 10px/1.4 ui-monospace, monospace; text-align: left;
          }
          .zk-license a { color: var(--zk-muted); text-decoration: none; }
          .zk-license a:hover { color: var(--zk-text); text-decoration: underline; }
          @media (max-width: 600px) {
            .zk-output { padding: 14px 12px 22px; font-size: 13px; }
            .zk-form { padding: 9px 12px; }
            .zk-status { gap: 6px; padding-inline: 8px; font-size: 10px; }
            .zk-agent-copy::part(button) { font-size: 9px; }
            .zk-bottom { gap: 5px; }
            .zk-bottom button { min-height: 32px; }
            .zk-license { padding-inline: 12px; }
          }
        </style>
        <div hidden><tonk-display model=component></tonk-display><tonk-display model=zork-session></tonk-display><tonk-display model=zork-input></tonk-display><tonk-display model=zork-processed></tonk-display></div>
        <zork-terminal-v10 with={dom.host/with} session={this} onzorksave=zork-persist onzorkcomplete=zork-complete aria-label="{heading}"></zork-terminal-v10>
        <p class="zk-license">Zork I source and story © Microsoft, <a href="https://github.com/historicalsource/zork1" target="_blank" rel="noopener">MIT License</a>. Browser interpreter © Daniel Lockard, <a href="https://github.com/daniellockard/zmachine" target="_blank" rel="noopener">MIT License</a>.</p>
      </main>

view!:
  this: tonk:zork/input
  show:
    directory: |2
      <div class="zork-input-row" data-input={this} data-session={session} data-issued={issued}><span>{text}</span></div>

view!:
  this: tonk:zork/processed
  show:
    directory: |2
      <div class="zork-processed-row" data-input={this} data-processed={processed}></div>

view!:
  this: tonk:zork/session
  show:
    directory: |2
      <div class="zork-session-row" data-session={this}><span class="zork-db-transcript">{transcript}</span><span class="zork-db-state">{state}</span><span class="zork-db-save">{save}</span><span class="zork-db-history">{history}</span></div>


