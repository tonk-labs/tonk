          const stored = sessionData(this);
          if (stored && stored.state === state && stored.save === save && stored.transcript === transcript && stored.history === history) {
            this.__lastPersist = { state, save, transcript, history };
            return;
          }
          const last = this.__lastPersist;
          if (last && last.state === state && last.save === save && last.transcript === transcript && last.history === history) return;
          this.__lastPersist = { state, save, transcript, history };
          this.dispatchEvent(new CustomEvent('zorksave', {
            bubbles: true,
            detail: {
              zorkPersistSession: this.getAttribute('session'),
              zorkPersistTranscript: transcript,
              zorkPersistState: state,
              zorkPersistSave: save,
              zorkPersistHistory: history
            }
          }));
        }
        boot(tries, sessionTries) {
          if (this.__booted || this.__booting) return;
          const scope = scopeOf(this);
          if (!scope) {
            if (tries > 0) this.__bootTimer = setTimeout(() => this.boot(tries - 1, sessionTries), 80);
            else this.fail('The page did not receive its space scope.');
            return;
          }
          this.updateAgentCopy();
          const saved = sessionData(this) || liveHandoff;
          if (!saved && sessionTries > 0) {
            this.__bootTimer = setTimeout(() => this.boot(tries, sessionTries - 1), 50);
            return;
          }
          this.__saveBlob = saved && saved.save ? saved.save : '';
          this.__booting = true;
          Promise.all([
            Promise.resolve(ZMachinePlatform),
            storedBytes(scope, saved && saved.state).catch(() => null),
            storedBytes(scope, saved && saved.save).catch(() => null)
          ]).then(([api, stateBytes, saveBytes]) => {
            if (!this.isConnected) return;
            this.engine = api;
            this.io = new VaultZorkIO(this, saved, saveBytes || stateBytes);
            this.machine = api.ZMachine.load(storyBytes(), this.io);
            let restored = false;
            if (stateBytes) {
              try { restored = restoreMachine(api, this.machine, stateBytes); }
              catch (_) { restored = false; }
            }
            if (!restored && saved && saved.state) {
              this.io.transcript = '';
              this.io.memorySave = null;
            }
            if (saved && saved.history) {
              try {
                const history = JSON.parse(saved.history);
                if (Array.isArray(history)) this.history = history.filter((item) => typeof item === 'string');
              } catch (_) {}
              this.historyAt = this.history.length;
            }
            this.io.initialize(this.machine.version);
            if (restored) {
              try {
                const room = this.machine.variables.peek(16);
                this.io.showStatusLine(
                  room ? this.machine.getObjectName(room) : 'Zork I',
                  api.toSigned16(this.machine.variables.peek(17)),
                  this.machine.variables.peek(18),
                  (this.machine.header.flags1 & 2) !== 0
                );
                this.flash('Session restored');
              } catch (_) {}
            }
            this.__booted = true;
            this.__booting = false;
            this.machine.run().catch((error) => this.fail(error && error.message ? error.message : String(error)));
          }).catch((error) => {
            this.__booting = false;
            this.fail(error && error.message ? error.message : String(error));
          });
        }
        fail(message) {
          const output = this.querySelector('.zk-output');
          output.textContent = 'Zork could not start.\n\n' + message;
          this.input.disabled = true;
          this.input.placeholder = 'Unavailable';
        }
      });
    })();


