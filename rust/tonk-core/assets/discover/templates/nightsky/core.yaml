component!: &nightsky-song-editor
  module: |
    // Portable Song settings: upload verified files, create a NEW track, select it.
    // No playback commands, autoplay, external upload service, or old-track mutation.
    (() => {
      // Deliberate self-serve limits: validation shares memory with the live page.
      // Remixers can change this one object after testing their target devices.
      const SONG_LIMITS = Object.freeze({audioBytes:32*1024*1024,artworkBytes:5*1024*1024,durationSeconds:600,validationPcmBytes:128*1024*1024,artworkPixels:20000000,validationSampleRate:22050});
      const validEntity = value => /^(?:did:key:|id:)[A-Za-z0-9:._/-]+$/.test(value || '');
      const validBlob = value => /^blob:[A-Za-z0-9]+$/.test(value || '');
      const endpoint = scope => {
        const at = String(scope || '').indexOf('@'), branch = String(scope || '').slice(0, at), repository = String(scope || '').slice(at + 1);
        if (at < 1 || !/^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$/.test(branch) || !/^did:key:[A-Za-z0-9]+$/.test(repository)) throw new Error('Open Song settings inside its destination Tonk space.');
        // Tonk's native routing keeps the validated DID and blob colons literal.
        return '/api/repository/' + repository + '/branch/' + branch + '/blob';
      };
      const sha256 = async bytes => Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)), byte => byte.toString(16).padStart(2, '0')).join('');
      const abort = () => new DOMException('Cancelled', 'AbortError');
      const defaultCover = new TextEncoder().encode('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><rect width="600" height="600" fill="#050a13"/><g fill="#dbe6ef"><circle cx="110" cy="130" r="2"/><circle cx="440" cy="185" r="2"/><circle cx="260" cy="360" r="2.5"/><circle cx="495" cy="460" r="1.5"/><circle cx="190" cy="495" r="1"/></g><circle cx="300" cy="280" r="130" fill="none" stroke="#879bad" stroke-opacity=".24"/></svg>');
      const safeName = (name, fallback) => String(name || fallback).replace(/[^A-Za-z0-9._ -]/g, '_').slice(0, 100) || fallback;
      const audioMime = file => {
        const byExtension = { mp3:'audio/mpeg', wav:'audio/wav', ogg:'audio/ogg', oga:'audio/ogg', opus:'audio/ogg', flac:'audio/flac', m4a:'audio/mp4', aac:'audio/aac', aif:'audio/aiff', aiff:'audio/aiff', webm:'audio/webm' };
        const mime = /^audio\/[a-z0-9.+-]+$/i.test(file.type || '') ? file.type.toLowerCase() : byExtension[String(file.name).split('.').pop().toLowerCase()];
        if (!mime) throw new Error('Choose a supported audio file such as MP3, WAV, OGG, FLAC or M4A.');
        return mime;
      };
      async function measureDuration(file, signal) {
        // Inspect the browser's streaming metadata before allocating decoded PCM.
        // A long compressed recording is rejected here, before decodeAudioData.
        if(signal.aborted)throw abort();
        return new Promise((resolve,reject)=>{
          const audio=document.createElement('audio'),url=URL.createObjectURL(file);let settled=false;
          const finish=(error,duration)=>{if(settled)return;settled=true;clearTimeout(timer);signal.removeEventListener('abort',cancel);audio.removeEventListener('loadedmetadata',ready);audio.removeEventListener('error',failed);audio.pause();audio.removeAttribute('src');audio.load();URL.revokeObjectURL(url);error?reject(error):resolve(duration);};
          const cancel=()=>finish(abort()),failed=()=>finish(new Error('This browser could not read the recording. Choose a supported audio file.'));
          const ready=()=>{const duration=audio.duration;if(!Number.isFinite(duration)||duration<=0||duration>SONG_LIMITS.durationSeconds)finish(new Error('Choose a recording with a duration of 10 minutes or less.'));else finish(null,duration);};
          const timer=setTimeout(()=>finish(new Error('Reading the recording took too long. Try another file.')),20000);
          signal.addEventListener('abort',cancel,{once:true});audio.addEventListener('loadedmetadata',ready);audio.addEventListener('error',failed);audio.preload='metadata';audio.src=url;audio.load();
        });
      }
      async function readResponse(response, limit, signal) {
        if (!response.body) throw new Error('Tonk returned an empty file response.');
        const reader = response.body.getReader(), chunks = []; let size = 0;
        try {
          while (true) { if (signal.aborted) throw abort(); const part = await reader.read(); if (part.done) break; size += part.value.length; if (size > limit) throw new Error('The stored file exceeded its expected size.'); chunks.push(part.value); }
          const bytes = new Uint8Array(size); let offset = 0; for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.length; } return bytes;
        } finally { await reader.cancel().catch(() => {}); }
      }
      // The helper verifies the actual stored bytes after POST, not just a returned ID.
      async function storeFile(base, asset, signal, guard, cache) {
        guard(); const cacheKey=base+'|'+asset.hash; let entity = cache.get(cacheKey);
        if (!entity) {
          const response = await fetch(base, { method:'POST', signal, headers:{'Content-Type':asset.mime,'X-Tonk-Blob-Name':asset.name}, body:asset.bytes });
          if (!response.ok) throw new Error('Tonk could not store the ' + asset.role + '. Retry when connected.');
          const result = await response.json(); guard();
          if (!validBlob(result.entity) || result.size !== asset.bytes.length || result.contentType !== asset.mime) throw new Error('Tonk returned unexpected ' + asset.role + ' metadata. The song has not been added.');
          entity = result.entity;
        }
        const response = await fetch(base + '/' + entity, { signal });
        if (!response.ok) { cache.delete(cacheKey); throw new Error('The stored ' + asset.role + ' could not be read back. Retry when connected.'); }
        const bytes = await readResponse(response, asset.bytes.length, signal);
        if (bytes.length !== asset.bytes.length || await sha256(bytes) !== asset.hash) { cache.delete(cacheKey); throw new Error('The stored ' + asset.role + ' failed verification. The song has not been added.'); }
        guard(); cache.set(cacheKey, entity); while (cache.size > 4) cache.delete(cache.keys().next().value); return entity;
      }
      const media = Object.freeze({ endpoint, sha256, storeFile, measureDuration, limits:SONG_LIMITS });
      const expose = () => { if (globalThis.Nightsky) globalThis.Nightsky.media = media; };
      expose(); document.addEventListener('nightsky-kit-ready', expose);

