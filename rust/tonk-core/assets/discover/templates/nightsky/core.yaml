        } catch { if (peer) this.retryPeer(peer); }
      }

      async onSignal(from, payload) {
        if (!this._alive || !this._open || !this._knownPeers.has(from)) return;
        let peer = this._peers.get(from);
        try {
          if (payload.sdp && payload.sdp.type === 'offer') {
            // Initial discovery and a recovery check can race. The lower ID keeps its offer;
            // the higher ID abandons its offer and answers, so both sides cannot become answerers.
            if (peer?.outgoing && !peer.open && this._id < from) return;
            this.drop(from);
            peer = this.newPeer(from, { ...this._peerInfo.get(from), ...payload }, false);
            peer.pc.ondatachannel = e => {
              if (this._peers.get(from) !== peer) return;
              if (e.channel.label === 'nightsky-cursor') this.wireCursor(peer, e.channel);
              else if (e.channel.label === 'song') this.wire(peer, e.channel);
              else e.channel.close();
            };
            await peer.pc.setRemoteDescription(payload.sdp);
            if (this._peers.get(from) !== peer) return;
            await peer.pc.setLocalDescription(await peer.pc.createAnswer());
            if (this._peers.get(from) === peer) this.description(peer);
            return;
          }
          if (!peer) return;
          if (payload.sdp && payload.sdp.type === 'answer' && peer.pc.signalingState === 'have-local-offer') {
            await peer.pc.setRemoteDescription(payload.sdp);
            if (this._peers.get(from) !== peer) return;
            for (const candidate of peer.ice.splice(0)) { try { await peer.pc.addIceCandidate(candidate); } catch {} }
          } else if (payload.candidate) {
            if (!peer.pc.remoteDescription) peer.ice.push(payload.candidate);
            else { try { await peer.pc.addIceCandidate(payload.candidate); } catch {} }
          }
        } catch { if (peer) this.retryPeer(peer); }
      }

      retryPeer(peer) {
        if (this._peers.get(peer.id) !== peer) return;
        this.drop(peer.id); this.schedulePeer(peer.id);
      }

      drop(id) {
        this.clearRetry(id);
        const p = this._peers.get(id);
        if (!p) return;
        this._peers.delete(id);
        for (const timer of p.timers) clearTimeout(timer);
        clearInterval(p.clockTimer);
        p.pc.onconnectionstatechange = p.pc.onicecandidate = p.pc.ondatachannel = null;
        if (p.dc) p.dc.onopen = p.dc.onclose = p.dc.onmessage = null;
        if (p.cursor) p.cursor.onopen = p.cursor.onclose = p.cursor.onmessage = null;
        this.emit('nightsky-cursor', { id: p.tag, active: false });
        try { p.pc.close(); } catch {}
        this.report();
      }

      wire(peer, dc) {
        peer.dc = dc;
        dc.onopen = () => {
          if (this._peers.get(peer.id) !== peer) return;
          peer.open = true;
          this.syncClock(peer);
          // Old clients ignore this message. Never open an extra channel until both
          // endpoints support it: old clients treated every channel as playback.
          this.sendTo(peer, { t: 'cursor-ready', version: 1 });
          if (this._cursorLatest && peer.cursor?.readyState === 'open') this.queueCursor(this._cursorLatest);
          if (this._person) this.sendTo(peer, this._person);
          if (this._state) this.sendTo(peer, this._state);
          this.report();
        };
        dc.onclose = () => this.retryPeer(peer);
        dc.onmessage = ev => {
          if (this._peers.get(peer.id) !== peer) return;
          let m; try { m = JSON.parse(ev.data); } catch { return; }
          const now = this.now();
          if (m.t === 'cursor-ready') { if (m.version === 1) { peer.cursorSupported = true; this.enableCursor(peer); } return; }
          if (m.t === 'sync' && Number.isFinite(m.a)) { this.sendTo(peer, { t: 'sync-reply', a: m.a, b: now, c: this.now() }); return; }
          if (m.t === 'sync-reply') { this.clockSample(peer, m, now); return; }
          if (m.t === 'anchor' && this.validState(m) && peer.clockReady && peer.tag === this.referenceTag() && this._state && m.version === this._state.version && m.by === this._state.by && m.state === this._state.state) {
            this._state = { ...this._state, at: m.at - peer.offset, positionMs: m.positionMs };
            this.emit('nightsky-align', this._state); return;
          }
          if (m.t === 'pulse' && Number.isFinite(m.at)) {
            if (!peer.clockReady) { peer.pendingPulse = m; return; }
            this.emit('nightsky-pulse', { at: m.at - peer.offset, local: false }); return;
          }
          if (m.t === 'person' && typeof m.name === 'string' && ['idle', 'listening', 'playing'].includes(m.state)) {
            peer.name = m.name.slice(0, 24); peer.state = m.state; peer.latencyMs = Number.isFinite(m.latencyMs) ? Math.max(0, Math.min(1500, m.latencyMs)) : 0; this.report(); return;
          }
          if (m.t === 'state' && this.validState(m)) {
            if (!peer.clockReady) { if (this.newer(m, peer.pending)) peer.pending = m; }
            else this.receive(peer, m);
          }
        };
      }

      // Cursor traffic is disposable: its own unreliable channel cannot queue behind
      // a lost pointer sample or delay a reliable playback/clock message.
      enableCursor(peer) {
        if (!this._alive || !peer.open || !peer.outgoing || !peer.cursorSupported || peer.cursorAttempted || this._peers.get(peer.id) !== peer) return;
        peer.cursorAttempted = true;
        try { this.wireCursor(peer, peer.pc.createDataChannel('nightsky-cursor', { ordered: false, maxRetransmits: 0 })); } catch {}
      }
      queueCursor(value) {
        if (!this._alive || !this.me()?.joined || !value || typeof value.active !== 'boolean') return;
        if (value.active && (!Number.isFinite(value.x) || !Number.isFinite(value.y))) return;
        const now = this.now(), spark = !!value.spark && value.active && now - this._cursorSparkAt >= 250;
        if (spark) this._cursorSparkAt = now;
        const cursor = { active: value.active, x: Math.max(0, Math.min(1, value.x || 0)), y: Math.max(0, Math.min(1, value.y || 0)), spark: spark || !!(value.active && this._cursorPending?.spark) };
        this._cursorLatest = { ...cursor, spark: false }; this._cursorPending = cursor;
        if (now - this._cursorSentAt >= 50) this.flushCursor();
        else if (!this._cursorTimer) this._cursorTimer = setTimeout(() => { this._cursorTimer = null; this.flushCursor(); }, 50 - (now - this._cursorSentAt));
      }
      flushCursor() {
        clearTimeout(this._cursorTimer); this._cursorTimer = null;
        const cursor = this._cursorPending; this._cursorPending = null;
        if (!cursor || !this._alive || !this.me()?.joined) return;
        this._cursorSentAt = this.now();
        const packet = JSON.stringify({ t: 'cursor', seq: ++this._cursorSeq, ...cursor });
        for (const peer of this._peers.values()) {
          const dc = peer.cursor;
          if (peer.open && dc?.readyState === 'open' && dc.bufferedAmount <= 1024) { try { dc.send(packet); } catch {} }
        }
      }
      wireCursor(peer, dc) {
        if (peer.cursor && peer.cursor !== dc) { try { dc.close(); } catch {} return; }
        peer.cursor = dc; peer.cursorAttempted = true;
        // A cursor-only setup failure never retries/restarts the reliable transport.
        // A complete RTC reconnect creates a fresh peer and negotiates again.
        const timeout = setTimeout(() => { if (this._peers.get(peer.id) === peer && dc.readyState !== 'open') { try { dc.close(); } catch {} } }, 5000);
        peer.timers.push(timeout);
        dc.onopen = () => { clearTimeout(timeout); if (this._peers.get(peer.id) === peer && this._cursorLatest) this.queueCursor(this._cursorLatest); };
        dc.onclose = () => { clearTimeout(timeout); if (this._peers.get(peer.id) === peer) this.emit('nightsky-cursor', { id: peer.tag, active: false }); };
        dc.onmessage = event => {
          if (!this._alive || !this.me()?.joined || !peer.open || this._peers.get(peer.id) !== peer || !this._knownPeers.has(peer.id) || typeof event.data !== 'string' || event.data.length > 256) return;
          let value; try { value = JSON.parse(event.data); } catch { return; }
          if (value.t !== 'cursor' || !Number.isSafeInteger(value.seq) || value.seq <= peer.cursorSeq || typeof value.active !== 'boolean' || value.active && (!Number.isFinite(value.x) || !Number.isFinite(value.y))) return;
          peer.cursorSeq = value.seq;
          const now = this.now(), spark = !!value.spark && value.active && now - peer.cursorSparkAt >= 250;
          if (spark) peer.cursorSparkAt = now;
          this.emit('nightsky-cursor', { id: peer.tag, seq: value.seq, active: value.active, x: Math.max(0, Math.min(1, value.x || 0)), y: Math.max(0, Math.min(1, value.y || 0)), spark });
        };
      }

      receive(peer, msg) {
        if (!this.newer(msg, this._state)) return;
        this.emit('nightsky-follow', { ...msg, at: msg.at - peer.offset });
      }

      // Four timestamps remove remote handler time from the round trip. Keep recent low-delay
      // samples, not the best sample forever: oscillators drift while the room is playing.
      clockSample(peer, m, now = this.now()) {
        if (!Number.isFinite(m.a) || !Number.isFinite(m.b) || !peer.probes.has(m.a)) return;
        peer.probes.delete(m.a);
        const c = Number.isFinite(m.c) ? m.c : m.b;
        const rtt = (now - m.a) - (c - m.b);
        if (c < m.b || rtt < -0.5 || rtt > 2000) return;
        peer.samples.push({ at: now, rtt: Math.max(0, rtt), offset: ((m.b - m.a) + (c - now)) / 2 });
        peer.samples = peer.samples.filter(s => now - s.at < 20000).slice(-32);
        const best = Math.min(...peer.samples.map(s => s.rtt));
        const clean = peer.samples.filter(s => s.rtt <= best + Math.max(1, best * 0.15)).sort((a, b) => a.offset - b.offset);
        const mid = Math.floor(clean.length / 2);
        peer.offset = clean.length % 2 ? clean[mid].offset : (clean[mid - 1].offset + clean[mid].offset) / 2;
        peer.rtt = best; peer.clockReady = peer.samples.length >= 3;
        peer.uncertaintyMs = best / 2 + Math.max(...clean.map(s => Math.abs(s.offset - peer.offset)));
        if (peer.clockReady && peer.pendingPulse) { this.emit('nightsky-pulse', { at: peer.pendingPulse.at - peer.offset, local: false }); peer.pendingPulse = null; }
        if (peer.clockReady && peer.pending) { const pending = peer.pending; peer.pending = null; this.receive(peer, pending); }
        this.report();
      }
      probe(peer) {
        if (!peer.open) return;
        const a = this.now();
        for (const time of peer.probes.keys()) if (a - time > 5000) peer.probes.delete(time);
        peer.probes.set(a, true); this.sendTo(peer, { t: 'sync', a });
      }
      syncClock(peer) {
        for (let i = 0; i < 10; i++) peer.timers.push(setTimeout(() => this.probe(peer), i * 70));
        peer.clockTimer = setInterval(() => this.probe(peer), 1000);
      }
      referenceTag() {
        return [this.me()?.tag, ...[...this._peers.values()].filter(p => p.open).map(p => p.tag)].filter(Boolean).sort()[0];
      }
      anchor() {
        // One deterministic peer supplies refinements. Others never echo them, preventing a clock feedback loop.
        if (this._alive && this._state && this.me()?.tag === this.referenceTag()) this.broadcast({ ...this._state, t: 'anchor' });
      }

      sendTo(peer, msg) { try { if (peer.open && peer.dc.readyState === 'open') peer.dc.send(JSON.stringify(msg)); } catch {} }
      broadcast(msg) { for (const p of this._peers.values()) this.sendTo(p, msg); }

      report() {
        const open = [...this._peers.values()].filter(p => p.open);
        const text = !this.me()?.joined ? 'Pick a name to join the room' : !this._url ? 'playing locally · live jam unavailable'
          : !this._open ? 'connecting to the jam…'
          : open.some(p => !p.clockReady) ? 'aligning speakers…'
          : open.length ? 'live: ' + open.length + ' peer' + (open.length === 1 ? '' : 's')
          : this._peers.size ? 'connecting listeners…' : 'ready for friends';
        const leadMs = open.length ? Math.min(2000, Math.max(open.some(p => !p.clockReady) ? 400 : 150, (this._person?.latencyMs || 0) + 40, ...open.map(p => p.latencyMs + (Number.isFinite(p.rtt) ? p.rtt * 2 : 100) + 40))) : 0;
        this.status(text, leadMs);
        this.emit('nightsky-people', open.map(p => ({ tag: p.tag, name: p.name, state: p.state })));
      }
    });

