nightsky-agent-file!: &nightsky-agent-source-36328345fccf7478
  path: "relay/Caddyfile.site.example"
  text: "# Merge this site into the EXISTING proxy configuration only after inspection.\n# Replace relay.example.com with the owner-approved DNS name.\nrelay.example.com {\n    # Query strings carry a room capability. Do not enable raw access logs.\n    log {\n        output discard\n    }\n    # Error/runtime logging also needs sanitization: see the separate global fragment.\n    # Caddy supports WebSocket upgrades automatically; preserve the query token.\n    reverse_proxy 127.0.0.1:8787 {\n        # Let established sockets drain briefly on a proxy config reload.\n        stream_close_delay 5m\n    }\n}\n"
