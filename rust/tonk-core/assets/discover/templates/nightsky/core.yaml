attribute!: &nightsky-remix-markdown
  description: "Local Nightsky remix and maintenance guide"
  the: xyz.nightsky.remix/markdown
  as: text
  cardinality: one

concept!: &nightsky-remix-guide
  description: "Namespaced guidance; does not replace space-wide agent instructions"
  with:
    markdown: nightsky-remix-markdown

view!:
  this: nightsky-remix-guide
  show:
    directory: |
      <pre data-id={this} style="white-space:pre-wrap;font:13px/1.6 system-ui;overflow-wrap:anywhere">{markdown}</pre>
    ui: |
      <pre data-id={this} style="white-space:pre-wrap;font:13px/1.6 system-ui;overflow-wrap:anywhere">{markdown}</pre>

nightsky-remix-guide!: &nightsky-remix-guide-main
  markdown: |
    # Make your own copy

    Give your agent the invite and say **“Make my own remix of this Tonk.”** The one prompt in the app also covers changing the song, visuals, reusable audio processing and optional shared listening. No ZIP, repository checkout or custom copying program is required.

    ## Agent recipe: native source to an owned remix

    1. **Resolve the reference.** Use `npx --yes @tonk/cli@0.6.14`; below, `tonk` means that pinned command, not a possibly older executable on PATH. Confirm `tonk --version` reports `0.6.14`, then read `tonk --help`. Discover commands with `tonk help -a` and guides with `tonk help -g`; start with `tonk help notation` and `tonk help events` (`guide` is obsolete). Other listed guides include `spaces`, `sync`, `views` and `tonk-display`; read the relevant topic before using unfamiliar commands.

       If online npm resolution stalls, a locally cached exact version is an optional fallback: `npx --offline --yes @tonk/cli@0.6.14 --version`. Use subsequent commands through that same offline prefix only if it succeeds and reports `0.6.14`. It fails if the package or dependencies are missing; do not use offline mode as a cold-install default or substitute another version. Otherwise resolve normal package access. The offline npm flag does not make Tonk's own data reads offline.

       Pin every source read with `--space SOURCE`. If the supplied scope cannot be read, obtain its Share invite and run `tonk join 'INVITE' --name SOURCE`; scope/workspace IDs alone do not grant access. Read the current guide through its name binding:

       ```sh
       tonk --space SOURCE eval --no-sync --dry-run --json -c 'name:
         this: id:nightsky-remix-guide-main
         entity: ?guide
       nightsky-remix-guide:
         this: ?guide
         markdown: ?markdown'
       ```

       Require one name result and one matching guide result in `matches_before`; read its `fields.markdown`, not the first historical guide row. Initial pull is lazy: subsequent code, schema and media reads may still fetch over the network.

    2. **Set up the destination.** Reuse the user's existing identity/account and work in a fresh folder; do not reset keys, isolate the registry or introduce containers unless requested. `space new` binds its working directory. Ask together for any missing recording, visual changes and shared-listening preference, while doing independent inspection. A named existing destination needs a collision/coexistence review; otherwise create a separate space with `tonk space new DESTINATION`. Check account status, the new subject, ownership and remote. If it was created local-only, use the supported `account login` / `space link` flow. An apparently signed-in device is not proof that linking succeeded. If login remains pending, inspect committed state and report what is waiting; do not repeatedly restart or kill authentication.

    3. **Inspect current definitions into local files.** In the fresh folder, run these tested read-only forms. `--no-sync` suppresses automatic pull/push, not lazy network reads:

       ```sh
       mkdir -m 700 inspection
       tonk --space SOURCE eval --no-sync --dry-run --json -c 'name:
         this: ?name
         entity: ?component
       component:
         this: ?component
         module: ?module' > inspection/current-components.json
       tonk --space SOURCE eval --no-sync --dry-run --json -c 'concept:' > inspection/concepts.json
       tonk --space SOURCE query command --json > inspection/commands.json
       tonk --space SOURCE eval --no-sync --dry-run --json -c 'rule:' > inspection/rules.json
       tonk --space SOURCE query view --json > inspection/views.json
       ```

       `eval` returns `matches_before` groups: join the `name` group's `results[].fields.entity` to the `component` group's `results[].this`, retaining current `id:nightsky-*` names and exact `fields.module`. These are grouped results, not flat joined rows. Concept results carry `fields.name`, JSON-string `fields.source` and `fields.transient`. Select current named Nightsky definitions; resolve duplicate-name ambiguity instead of taking the last row. Command queries return a top-level list; view queries return `{this, show}` records. Select views by the chosen schema entities and preserve every `show` facet. `query rule` is unsupported here; use `eval 'rule:'`. Record source content hash, component IDs/UTF-8 byte hashes and schema/view descriptors. Keep large payloads in files and exclude orphan component versions and unrelated apps.

    4. **Author and replay notation in dependency order.** Parse each schema's `source` JSON and preserve every descriptor field, including optional/type/cardinality information. Emit durable `concept!:` and transient `command!:` declarations; `show --notation` alone loses the command distinction in 0.6.14. Rule results carry JSON-string `fields.definition` with `{rule, polarity}`. Match embedded descriptors to selected schemas by structural equality ignoring only descriptions; reject unresolved dependencies or unfamiliar operand shapes. Preserve effect, head, ordered `when`/`unless`, constants and all explicit variables. When producing `where`, omit anonymous blanks; omit a generated `__` variable only if it occurs **once across the entire rule**. Preserve repeated generated variables and all retraction joins. Deduplicate only identical complete normalized structures, never just matching heads.

       Emit native variables as unquoted YAML tokens: `this: ?track`, not `this: "?track"`. Quoting turns the token into a string literal and breaks bindings. Quote string literals (including text that starts with `?`); preserve numbers and booleans as their native types. A generic YAML/JSON serializer that quotes every string needs an explicit distinction between native variable tokens and literal strings.

       Do not copy compiled rule bytes or blindly import CSV: the 0.6.14 reader skips large rule byte values. Install schema/commands and rules before compiling exact view `show` facets so event bindings regenerate. Install current modules as `component!: &nightsky-NAME` with exact JSON-quoted `module` strings; `show --notation` does not export component source correctly here. Dry-run each prepared notation file with `tonk --space DESTINATION eval FILE --dry-run`, then apply with `--no-sync`.

       Create one workspace using a fresh UUID URI, for example `nightsky!: &nightsky-app` with `this: id:nightsky-workspace-NEW-UUID` and a quoted `title`. Replace `NEW-UUID` with a generated UUID; mapping-form `this:` was rejected by 0.6.14. Copy the public guide and bind `nightsky-remix-guide-main` to its current entity so the copied prompt's lookup remains unambiguous. Preserve the current public file bundle; its verified manifest belongs on the **new workspace**, not the reference workspace. Exclude reference recordings unless selected, comments, saved-GIF instances, participants, relay configuration, membership, authority/delegations and global AGENTS.md. Keep the reference unchanged.

    5. **Verify and share the result.** Compare the new current component IDs/bytes, schema identities/transient flags and view facets against the inspected source; review reconstructed rule behavior. The 10 September fresh-client test reproduced 12 components, 27 schemas including 8 commands, 25 distinct rules and 17 view maps—observations for that version, not hardcoded future counts. Check one workspace, one selected track/player, empty copied comments, play/pause/seek and prepared-analysis state when used. Configure only a newly created blank home's landing view to display Nightsky; preserve every meaningful existing home. Confirm owner, subject, intended remote and an actual successful `push` before saying “hosted.” Open the new invite's landing route as well as the direct app route. Return the requested new Share invite; that intentional invitation is distinct from private relay/account secrets.

    ## Change the song

    Read `nightsky-track`, `nightsky-song-add`, `nightsky-song-select`, `nightsky-song-update` and `nightsky-active-track` before writing. Use the user's chosen local recording, or retrieve a selected native recording with `tonk --space SOURCE blob cat BLOB`. Add it with `tonk --space DESTINATION blob add FILE --type MIME --no-sync`, read the returned blob back, and compare SHA-256 against the original bytes. Derive duration from decoded audio; use an integer ceiling when the native field requires unsigned seconds. Extract embedded artwork when suitable instead of generating a replacement. Changed audio gets a fresh track/request identity through `nightsky-song-add`; verify selection through `nightsky-active-track`. Preserve earlier recordings and their comments. Only transfer recordings the user has rights to copy. Do not autoplay or emit playback commands during preparation.

    For a title, artist, album or year correction, use the narrow metadata update on the same track. Keep its audio, comments and identity. Prepared features are optional: the carried preparation tool requires ffmpeg and must match the exact recording/blob, SHA-256, decoded time grid and installed analysis fingerprint. Read back the uploaded sidecar and check seek/serialization parity before attaching `nightsky-analysis-asset`. Missing features fall back to local preparation. Native song commands remain available even though the upload/settings form is not mounted in the workspace.

    ## Change the experience

    | Change | Native component or API |
    | --- | --- |
    | Stars, colour, trails and gentle glow | `nightsky-sky` |
    | Play button and timeline | `nightsky-deck`, `nightsky-canvas`, `nightsky-scrubber` |
    | Text/GIF comments and timed cards | `nightsky-marks`, `nightsky-dialogue`, `nightsky-moments` |
    | Reusable audio descriptors | `Nightsky.Modules`; carried `tools/examples` sources |
    | Another presence visual | `Nightsky.room(element).presence` join/update/leave |
    | Live transport and scheduling | `nightsky-live`, `nightsky-player` |

    Read/export only the named component needed and use a guarded replacement. Keep namespaces, disconnect cleanup and unrelated data intact. Preserve deterministic seeking, immediate rhythmic motion, separately smoothed brightness, click-to-seek/drag-to-comment, reduced motion and DOM/Canvas2D fallbacks unless requested otherwise. Keep one chosen timeline design; interchangeable renderers are an API contract, not a new mode picker. Text/GIF content stays attached to its original track. Canonical audio sources are carried for deeper edits; do not hand-edit a generated module version.

    ## Optional shared listening

    Use the carried `cloudflare-relay/README.md` and public source files. A Cloudflare account is required; the Worker with SQLite Durable Object uses a Free-compatible configuration and included `workers.dev` address within account quotas. Verify the intended account, destination namespace and local tests before deploying. Missing billing-read permission is not a deployment blocker or a reason to broaden OAuth access: report that the plan could not be inspected, keep the Free-compatible configuration and do not change subscriptions or accept charges without authorization. One stable namespace for the new space admits new songs without per-song server edits; room keys include the Tonk scope and track. The Node/VPS alternative is in `relay/README.md` and uses an explicit room allowlist; obtain each room from the scoped player's `room()` API.

    Generate credentials privately. Keep relay tokens/capability URLs, private keys and account credentials out of chat, logs, shell arguments and public commits. Configure only the intended space's `nightsky-relay` fact. Its capability is shared with readers, not individual authentication. A Share invite explicitly requested by the user may be returned to them. No TURN or physical loudspeaker alignment is promised. Keep an existing relay available during migration until two real clients pass join, play, pause, seek, named-cursor and reconnect tests; also check an added song. Local listening needs no relay.

    ## Public tools carried by the app

    `nightsky-agent-file` contains the current version/hash manifest and exact public `AGENTS.md`, `REMIXING.md`, component/audio tools and relay source/configuration examples. These are app-scoped project material, not replacements for any space-wide instructions. Agents can query the files directly; the optional extractor below is a convenience for deeper offline work. It is not required to copy the app or change its song. Whole core notation, encoded demo media, private deployment artifacts and test results are not duplicated in this bundle.

    ## Optional: materialize public tools for deeper edits

    Ordinary agent edits can read native component/schema facts directly. This optional helper is for audio preparation or relay setup: query `nightsky-agent-file` through the reference's Tonk replica; no ZIP or GitHub checkout is required. Native facts, code and media may fetch on demand even after pull; a completed pull does not guarantee an offline-complete copy. These files are app-scoped project material, not a replacement for another space's AGENTS or instructions.

    Save the query without printing its full contents:

    ```sh
    npx --yes @tonk/cli@0.6.14 --space SOURCE query nightsky-agent-file --json > nightsky-agent-files.json
    ```

    The following read-only bootstrap extracts just the reviewed materializer to a new local file. Replace WORKSPACE_ENTITY with this app's workspace entity from the copied prompt. Read the resulting tool before running it.

    ```sh
    python3 - nightsky-agent-files.json WORKSPACE_ENTITY <<'PY'
    import hashlib, json, os, stat, sys
    fd = os.open(sys.argv[1], os.O_RDONLY | os.O_NOFOLLOW)
    with os.fdopen(fd, "rb") as source:
        assert stat.S_ISREG(os.fstat(source.fileno()).st_mode)
        raw = source.read(8*1024*1024 + 1)
    assert len(raw) <= 8*1024*1024
    rows = json.loads(raw)
    assert isinstance(rows, list) and len(rows) <= 4096
    manifests = [r for r in rows if r.get('path') == 'agent-files.manifest.json' and r.get('this') == sys.argv[2]]
    assert len(manifests) == 1
    manifest = manifests[0]
    assert hashlib.sha256(manifest['text'].encode()).hexdigest() == manifest['sha256']
    meta = json.loads(manifest['text'])
    assert meta['format'] == 1 and meta['version'] == manifest['bundle']
    files = [r for r in rows if r.get('path') == 'tools/materialize-native.mjs' and r.get('bundle') == meta['version']]
    assert len(files) == 1
    text = files[0]['text']; expected = '7d89e1c99e7fba9fa8bd96c2b369c666088cdee994570c6faedbf16abaa5c546'
    assert files[0]['sha256'] == expected and hashlib.sha256(text.encode()).hexdigest() == expected
    fd = os.open('nightsky-materialize.mjs', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
    with os.fdopen(fd, 'w') as out: out.write(text)
    print('Extracted reviewed materializer; inspect it before running.')
    PY
    node nightsky-materialize.mjs --input nightsky-agent-files.json --workspace WORKSPACE_ENTITY --out ./nightsky-local-tools
    ```

    The full materializer verifies the current manifest, explicit public path allowlist, every byte hash and exact bundle membership before writing a fresh directory. It rejects missing/extra files, traversal, symlinks and overwrites. Old bundle versions are ignored. It does not execute files, install packages, upload media or modify Tonk. Existing component source remains native; do not reconstruct or import a full app from these tooling rows. `core.yaml`, demo/base64 media, private relay receipts and test-result artifacts are deliberately not duplicated here.


