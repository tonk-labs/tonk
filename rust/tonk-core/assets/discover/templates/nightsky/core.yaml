  path: "relay/Caddyfile.runtime-logging.example"
  text: "# FRAGMENT for the existing global options block, NOT a replacement Caddyfile.\n# Merge with its existing default logger; keep unrelated logging requirements.\n# No debug mode. Access log filtering alone does not sanitize HTTP error logs.\nlog default {\n    level INFO\n    output file /var/log/caddy/runtime-sanitized.log {\n        roll_size 10MiB\n        roll_keep 3\n        roll_keep_for 168h\n    }\n    format filter {\n        wrap json\n        fields {\n            request>uri delete\n            request>headers delete\n        }\n    }\n}\n"
