# Nightsky — portable core
#
# Application source, not a gallery manifest. Repeated YAML heads are intentional.
# Preserve this file's bytes; never parse/rewrite it as an ordinary YAML mapping.
# Required core defines all schema, commands, views, ten listening components and the Song settings component.
# No music recording, cover, comments, saved GIFs, membership, relay capability,
# production entity identifiers or changes to the space's home are included.
#
# INSTALL: choose a disposable or explicitly intended destination space first.
#   tonk --space YOUR_SPACE eval core.yaml --dry-run
#   tonk --space YOUR_SPACE eval core.yaml
# Then evaluate the optional demo files in their manifest order, if wanted.
# Open the nightsky concept. Setting the space home is a separate user choice.
# Re-evaluating identical files is idempotent. This is not an upgrade installer:
# changed component definitions must be reviewed and old owned definitions
# retired explicitly; never blanket-retract another template's components.
# Reimport restores bundled setup/demo defaults if you edited those seed rows;
# independent comments, saved GIFs and tracks are not bundled or replaced.
#
# LOCAL LISTENING: add a track or install the optional demonstration, choose a
# name, and press Play. Without a configured signalling relay audio and visuals
# work on this device; multiplayer requires the separate relay setup below.
#
# YOUR OWN TRACK: use the unified agent prompt and native song commands to
# store verified audio/artwork, create a fresh track and select it. Preserve
# earlier songs/comments; metadata-only commands leave audio unchanged. For an agent:
# ingest files with `tonk blob add FILE`, then assert nightsky-track with title,
# artist, album, year, duration (whole seconds), audio,
# cover and alt. Audio/cover/alt are entity-valued blob: references. If there is
# no alternate rendition use the main audio blob again. Names/anchors must use
# your own prefix. Select the complete track with nightsky-song-select; do not
# replace another track's audio. Blob bytes must exist in the destination space.
# Prepared features are optional. The asset record binds the exact audio blob,
# audio SHA-256, compressed feature blob, compressed SHA-256 and source-derived
# algorithm version; an unsupported or missing asset falls back to local analysis.
# Never pair one rendition's features with a different recording or offset.
#
# OPTIONAL SHARED LISTENING: use the one Make your own copy agent prompt. The copyable prompt includes this destination's scope/workspace and
# asks for a private, tested setup using your own Cloudflare account.
# Read nightsky-remix-guide and query nightsky-agent-file from the local replica.
# Extract its verified public tools; cloudflare-relay/README.md travels with the
# app. No archive or external repository is required for native remixing.
# Follow the included README's current commands to deploy the Worker + Durable Object.
# Configure one namespace capability for this destination; added song rooms
# require no per-song server allowlist edits. No deployment is preconfigured.
# The small public tool files are carried as app-scoped text in this core.
# No duplicate core, base64 media, private receipts or credentials are carried.
# A VPS option remains at templates/nightsky/relay. Its explicit room allowlist
# must include the public room IDs from each scoped player.room() result.
# IDs hash destination scope and track (32-bit FNV; not collision-proof).
# Create ONE nightsky-relay row only in your own intended space. Generate its
# credentials privately; never publish capability URLs, tokens or private keys.
# Readers of that fact can obtain its shared capability; it is not individual
# authentication. The relay forwards SDP/ICE; audio stays in Tonk and playback/
# cursors use WebRTC data channels. Keep a rollback until two-client tests pass.
# Current clients disconnect peers if signalling closes. Google STUN is used;
# no TURN is supplied, so restrictive peer networks may prevent a connection.
# Do not use the original author's relay or credentials for a fork.
#
# EXTERNAL REQUESTS: no font CDN or runtime canvas library is required. GIF search
# contacts Wikimedia Commons and chosen GIFs load from their source URLs; source
# and license attribution are retained. Search is optional and needs no app key.
# HTML-in-Canvas is an optional native browser enhancement. Ordinary accessible
# DOM controls, Canvas2D/static sky and reduced-motion behavior remain available.
# Web Audio and WebRTC need browser support; playback starts after user input.
# Synchronization estimates do not guarantee acoustic alignment of loudspeakers.
#
# REMIX STARTERS (examples to request, not instructions automatically executed):
# - Keep the audio and dialogue APIs; replace only the sky with my own renderer.
# - Wire a timeline's rhythm to instant attacks and afterglow to sustained light.
# - Replace the playback controls while preserving seek/range event contracts.
# - Use Nightsky.room(element).presence events for another presence visual.
# - Add a new dialogue content concept alongside note/GIF on the same entity.
# Public audio functions are available at globalThis.Nightsky.Modules. The
# prepared timeline sample(t, out) reuses arrays and preserves seek-deterministic
# rhythm/integral/energy/texture/HPSS/motif signals. MIDI notes and separated
# instruments are not inferred; harmonic/percussive outputs are descriptors.

# Schema aliases use nightsky-; attributes use xyz.nightsky.*.

attribute!: &nightsky-track-title
  description: "Track title"
  the: xyz.nightsky.track/title
  as: text
  cardinality: one

attribute!: &nightsky-track-artist
  description: "Track artist"
  the: xyz.nightsky.track/artist
  as: text
  cardinality: one

attribute!: &nightsky-track-album
  description: "Track album"
  the: xyz.nightsky.track/album
  as: text
  cardinality: one

attribute!: &nightsky-track-year
  description: "Track year"
  the: xyz.nightsky.track/year
  as: text
  cardinality: one

attribute!: &nightsky-track-duration
  description: "Track duration"
  the: xyz.nightsky.track/duration
  as: unsigned-integer
  cardinality: one

attribute!: &nightsky-track-audio
  description: "Track audio"
  the: xyz.nightsky.track/audio
  as: entity
  cardinality: one

attribute!: &nightsky-track-cover
  description: "Track cover"
  the: xyz.nightsky.track/cover
  as: entity
  cardinality: one

