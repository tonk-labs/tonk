      "the": "xyz.tonk.view/ui",
      "of": "tonk:vault/welcome-page",
      "is": "string:<div class=\"wp-outer\">\n  <style>\n    /* Theme. The host toggles `.wa-light` / `.wa-dark` on the root\n       element from prefers-color-scheme; the tokens follow that class,\n       with a media-query fallback for a root that carries neither. */\n    .wp-outer {\n      container-type: inline-size;\n      --wp-bg: #FAFAFA;\n      --wp-fg: #212121;\n      --wp-line: #212121;\n      --wp-shot-forum: #C6C6C6;\n      --wp-shot-terminal: #141414;\n      --wp-shot-diagram: #F4F4EF;\n      --wp-shot-border: #2B2B2B;\n      --wp-muted: #686868;\n      background: var(--wp-bg);\n      color: var(--wp-fg);\n      min-height: 100%;\n    }\n    .wa-dark .wp-outer {\n      --wp-bg: #141414;\n      --wp-fg: #FAFAFA;\n      --wp-line: #FAFAFA;\n      --wp-shot-forum: #3A3A3A;\n      --wp-shot-terminal: #050505;\n      --wp-shot-diagram: #1E1E1B;\n      --wp-shot-border: #4A4A4A;\n      --wp-muted: #A8A8A8;\n    }\n    @media (prefers-color-scheme: dark) {\n      :root:not(.wa-light) .wp-outer {\n        --wp-bg: #141414;\n        --wp-fg: #FAFAFA;\n        --wp-line: #FAFAFA;\n        --wp-shot-forum: #3A3A3A;\n        --wp-shot-terminal: #050505;\n        --wp-shot-diagram: #1E1E1B;\n        --wp-shot-border: #4A4A4A;\n        --wp-muted: #A8A8A8;\n      }\n    }\n    .wp {\n      --tile: 320px;\n      --gap: 16px;\n      --col: 664px;\n      --indent: calc(var(--tile) + var(--gap));\n      --sans: Gestalte, \"Gestalte Book\", system-ui, -apple-system, sans-serif;\n      --serif: Charter, \"Bitstream Charter\", Georgia, \"Times New Roman\", serif;\n      --mono: \"IBM Plex Mono\", \"SF Mono\", Menlo, Consolas, monospace;\n      max-width: calc(var(--indent) + var(--col));\n      margin: 0 auto;\n      padding: 96px 32px 200px;\n      font-family: var(--serif);\n      font-size: 18px;\n      line-height: 1.5;\n      -webkit-font-smoothing: antialiased;\n    }\n    .wp *, .wp *::before, .wp *::after { box-sizing: border-box; }\n\n    /* Headings. The host styles bare h1/h2 as shrink-to-fit boxes with a\n       surface background, which breaks the float wrap and paints a\n       panel behind the text — so both are reset here at higher\n       specificity than the host's rules. */\n    .wp .wp-h1, .wp .wp-h2 {\n      display: block;\n      width: auto;\n      max-width: none;\n      float: none;\n      clear: none;\n      background: none;\n      border: 0;\n      box-shadow: none;\n      padding: 0;\n      margin: 0;\n      overflow: visible;\n      color: inherit;\n      font-family: var(--sans);\n      font-weight: 400;\n      letter-spacing: normal;\n      word-spacing: normal;\n      text-transform: none;\n      /* The host balances heading lines (`text-wrap: balance`), which\n         with a float beside the first line packs the SECOND line full\n         and leaves the first with two words. Plain greedy wrapping. */\n      text-wrap: wrap;\n      text-wrap-style: auto;\n      overflow-wrap: normal;\n      hyphens: manual;\n    }\n\n    /* Hero */\n    .wp .wp-h1 {\n      font-size: 78px;\n      line-height: 1.12;\n      margin: 0 0 60px;\n    }\n    /* The wordmark's baseline (its glyph bottoms, ~231/236 of the\n       viewBox) sits on the headline's baseline: an inline-block with a\n       block child has its baseline at its bottom edge. */\n    .wp-logo {\n      display: inline-block;\n      height: 1.45em;\n      width: auto;\n      vertical-align: -0.03em;\n      margin-right: 0.24em;\n    }\n    .wp-logo svg { display: block; height: 100%; width: auto; }\n    .wp-cta { margin-left: var(--indent); }\n\n    /* Sections */\n    .wp-section { margin-top: 136px; }\n    .wp-section::after { content: \"\"; display: block; clear: both; }\n    .wp-tile {\n      float: left;\n      width: var(--tile);\n      height: var(--tile);\n      margin: 0 var(--gap) 0 0;\n      position: relative;\n      overflow: hidden;\n    }\n    .wp-tile svg { width: 100%; height: 100%; display: block; }\n    .wp-sr-only {\n      position: absolute;\n      width: 1px;\n      height: 1px;\n      overflow: hidden;\n      clip: rect(0 0 0 0);\n      clip-path: inset(50%);\n      white-space: nowrap;\n    }\n    /* The heading is a normal block beside the floated tile: its first\n       line box is shortened by the float and pushed down so that the\n       baseline meets the tile's bottom edge; every following line is\n       below the float and runs from the tile's left edge. This is the\n       exact geometry used by tonk-site's LetterHeading component. */\n    .wp .wp-h2 {\n      font-size: 48px;\n      line-height: 1.15;\n      /* The Space host can zero heading padding after this view mounts.\n         Keep the heading itself unpadded and use a real first-child\n         spacer below so the wrap geometry cannot be overridden. */\n      padding-top: 0 !important;\n    }\n    .wp-heading-spacer {\n      display: block;\n      height: calc(var(--tile) - 0.84em);\n    }\n    .wp-body {\n      clear: both;\n      margin-left: var(--indent);\n      max-width: var(--col);\n      padding-top: 64px;\n      text-align: justify;\n      hyphens: none;\n    }\n    .wp-body p { margin: 0 0 1.5em; }\n    .wp-body p:last-child { margin-bottom: 0; }\n    .wp-body .wp-em { font-weight: 700; font-style: italic; }\n\n    /* Figures */\n    .wp-figure { margin: 56px 0 0; }\n    .wp-shot { width: 100%; border: 1px solid var(--wp-shot-border); }\n    .wp-shot.forum { aspect-ratio: 720 / 425; background: var(--wp-shot-forum); }\n    .wp-shot.terminal { aspect-ratio: 755 / 445; background: var(--wp-shot-terminal); }\n    .wp-inline-image {\n      display: block;\n      width: 100%;\n      height: auto;\n      aspect-ratio: 1024 / 604;\n      background: var(--wp-shot-forum);\n      border: 1px solid var(--wp-shot-border);\n    }\n    .wp-inline-image.forum-build {\n      aspect-ratio: 1024 / 643;\n      background: var(--wp-shot-terminal);\n    }\n    .wp-caption {\n      margin: 36px 0 0 var(--indent);\n      max-width: 520px;\n      font-family: var(--mono);\n      font-size: 13px;\n      line-height: 1.5;\n      text-align: left;\n    }\n\n    /* Interactive data soup, ported from tonk-site's SoupWidget. */\n    wp-soup {\n      display: block;\n      width: 100%;\n      aspect-ratio: 1170 / 1150;\n      background: var(--wp-bg);\n      border: 1px solid #DCE24A;\n      box-sizing: border-box;\n    }\n    .wp-soup-scene { width: 100%; height: 100%; display: block; }\n    .wp-soup-scene line {\n      stroke: var(--wp-fg);\n      stroke-width: 4;\n      stroke-linecap: round;\n    }\n    .wp-soup-label, .wp-soup-hint {\n      font-family: var(--mono);\n      fill: var(--wp-fg);\n    }\n    .wp-soup-label { font-size: 17px; }\n    .wp-soup-hint { font-size: 13px; fill: var(--wp-muted); }\n    .wp-soup-control {\n      width: 100%;\n      height: 100%;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n    }\n    .wp-soup-slider { width: 100%; margin: 0; accent-color: var(--wp-fg); }\n    .wp-soup-piece { transition: transform 100ms ease; }\n    .wp-soup-scene [data-role=\"a-circle\"],\n    .wp-soup-scene [data-role=\"a-ring\"],\n    .wp-soup-scene [data-role=\"e-circle\"],\n    .wp-soup-scene [data-role=\"space-circle\"] {\n      transition: r 100ms ease, stroke-width 100ms ease;\n    }\n    .wp-soup-multiply { mix-blend-mode: multiply; }\n    .wp-soup-flowing {\n      stroke-dasharray: 0 10;\n      animation: wp-soup-march 250ms linear infinite;\n    }\n    @keyframes wp-soup-march { to { stroke-dashoffset: -10px; } }\n    @media (prefers-color-scheme: dark) {\n      .wp-soup-multiply { mix-blend-mode: normal; }\n    }\n    @media (prefers-reduced-motion: reduce) {\n      .wp-soup-flowing { animation: none; }\n    }\n\n    /* The button, from tonk_button.svg (251 × 61 units): a #D9E020 fill\n       251 × 54, and a frame drawn OFFSET from it — 1px top and right,\n       5px bottom and left, from (4, 6) to (248, 61). The frame overhangs\n       the fill at the bottom; the fill overhangs the frame at the top\n       and right. `--u` scales one SVG unit. */\n    .wp-button {\n      --u: 0.79px;\n      position: relative;\n      display: inline-block;\n      width: calc(251 * var(--u));\n      height: calc(61 * var(--u));\n      padding: 0;\n      border: 0;\n      background: none;\n      color: #212121;\n      cursor: pointer;\n      font: inherit;\n      text-align: center;\n      vertical-align: top;\n    }\n    wp-how-to-tonk { display: inline-block; }\n    .wp-button .fill {\n      position: absolute;\n      left: 0; top: 0;\n      width: 100%;\n      height: calc(54 * var(--u));\n      background: #D9E020;\n    }\n    .wp-button .frame {\n      position: absolute;\n      left: calc(4 * var(--u));\n      top: calc(6 * var(--u));\n      width: calc(244 * var(--u));\n      height: calc(55 * var(--u));\n      border-style: solid;\n      border-color: var(--wp-line);\n      border-width: 1px 1px calc(5 * var(--u)) calc(5 * var(--u));\n    }\n    .wp-button .label {\n      position: absolute;\n      left: calc(9 * var(--u));\n      top: calc(7 * var(--u));\n      width: calc(238 * var(--u));\n      height: calc(49 * var(--u));\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      font-family: var(--sans);\n      font-weight: 400;\n      font-size: calc(28 * var(--u));\n      line-height: 1;\n      white-space: nowrap;\n    }\n    .wp-button:hover .fill { background: #E4EA3A; }\n    .wp-button:active .frame { transform: translate(-1px, -1px); }\n\n    /* Narrow pane */\n    @container (max-width: 860px) {\n      .wp { --tile: 150px; --gap: 10px; --col: 100%; padding: 56px 20px 120px; }\n      .wp .wp-h1 { font-size: 42px; line-height: 1.08; margin-bottom: 44px; }\n      .wp .wp-h2 { font-size: 34px; }\n      .wp-body, .wp-caption, .wp-cta { margin-left: 0; }\n      .wp-section { margin-top: 96px; }\n    }\n    /* Phone-width pane: on a short measure Charter's 1.5 leading reads\n       loose, so the body copy tightens a step. Headings, the mono\n       caption and the buttons set their own line-heights and keep them. */\n    @container (max-width: 600px) {\n      .wp { line-height: 1.4; }\n      /* Justified copy on a phone-width measure opens rivers between\n         words; hyphenation closes them. Needs the lang on .wp below —\n         browsers only hyphenate text with a declared language. */\n      .wp-body { -webkit-hyphens: auto; hyphens: auto; }\n    }\n  </style>\n\n  <wp-fonts></wp-fonts>\n\n  <div class=\"wp\" lang=\"en\">\n    <h1 class=\"wp-h1\"><span class=\"wp-logo\"><svg viewBox=\"0 0 890 236\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Tonk\" role=\"img\"><path d=\"M270.41 115.57C270.41 82.2148 296.983 55.1714 329.764 55.1714C362.539 55.1714 389.112 82.2148 389.112 115.57C389.112 148.932 362.539 175.975 329.764 175.975C296.983 175.975 270.41 148.932 270.41 115.57ZM576.511 3.05176e-05C547.396 3.05176e-05 522.91 7.66818 505.703 23.2353C496.913 31.1861 490.227 40.8795 485.759 51.9865C485.206 43.3086 482.67 31.1977 473.937 21.1754C463.712 9.4453 448.039 1.82331 427.461 2.20412C421.76 2.32529 417.229 7.04503 417.345 12.7514C417.46 18.3886 422.06 22.8833 427.668 22.8833C427.737 22.8833 427.812 22.8833 427.881 22.8833C442.044 22.6006 452.252 27.8338 458.282 34.6654C467.084 44.6415 465.072 59.8335 465.02 60.197C464.167 65.8168 468.012 71.079 473.626 71.9617C474.168 72.0483 478.537 72.6022 480.612 70.5654C479.673 76.2026 479.171 82.0763 479.171 88.1924C479.171 129.349 464.225 170.038 440.39 193.764C421.403 212.66 398.219 221.805 367.911 225.382C412.549 209.671 444.569 167.038 444.569 116.874C444.569 53.3655 393.262 1.88678 329.966 1.88678C266.675 1.88678 215.368 53.3655 215.368 116.874C215.368 180.383 266.675 231.868 329.966 231.868C332.121 231.868 334.254 231.793 336.375 231.677C384.126 231.1 417.569 222.722 443.508 196.902C468.196 172.328 483.592 130.555 483.592 88.1924C483.592 36.1771 519.197 3.86584 576.511 3.86584C670.703 3.86584 674.576 53.1693 674.657 59.9604C664.477 62.378 641.795 73.0926 641.795 93.2468V230.702H675.314C678.744 230.702 679.107 228.556 679.107 227.333V60.2085C679.107 53.9829 676.208 3.05176e-05 576.511 3.05176e-05Z\" fill=\"currentColor\"/><path d=\"M77.1707 4.5683L62.6623 4.58561C39.0811 4.63177 24.4574 15.3695 16.3356 23.9031C5.94862 34.8081 0 49.8733 0 65.2211C0 94.1512 19.5636 125.285 66.2994 125.285V101.658C33.5129 101.658 23.6043 82.0287 23.6043 65.2211C23.6043 50.029 32.7116 27.7516 63.1349 27.7516L77.1707 27.7458V207.448C64.6912 207.448 57.7858 194.968 57.7858 184.08L37.9743 184.092C37.9743 213.316 63.0946 230.383 76.9804 230.706H103.432C128.829 230.706 148.053 205.717 148.053 142.924V53.3063H158.924V101.658H207.164V4.5683H77.1707Z\" fill=\"currentColor\"/><path d=\"M859.713 143.694L828.344 143.463C836.656 139.101 843.337 133.937 848.461 129.073C874.844 104.049 888.222 62.1603 888.222 4.58282H871.99C871.99 57.5271 860.318 95.4466 837.302 117.286C826.817 127.227 808.475 138.721 780.444 137.543V4.58282H709.988V157.663C709.988 190.701 687.468 195.9 687.468 195.9C687.474 195.9 687.468 230.715 687.468 230.715H780.444V162.815C780.444 157.703 789.764 157.721 789.764 162.815C789.764 171.54 789.741 185.803 789.741 194.977C789.741 221.98 812.85 235.735 840.633 235.735C865.039 235.735 888.43 220.601 889.098 194.977C889.536 178.186 893.612 143.694 859.713 143.694Z\" fill=\"currentColor\"/></svg></span>{heading}</h1>\n\n    <section class=\"wp-section\">\n      <div class=\"wp-tile\" aria-hidden=\"true\"><svg viewBox=\"10.87 3.7 1350 1350\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" focusable=\"false\"><path d=\"M1371.04 0H0V1365.03H1371.04V0Z\" fill=\"#44EA44\"/><path d=\"M1284.07 1236.51H91.0391V1373.11H1284.07V1236.51Z\" fill=\"#38182A\"/><path d=\"M1295.64 11.1602H76.2402V271.35H1295.64V11.1602Z\" fill=\"#71BBE7\" stroke=\"black\" stroke-width=\"14.87\"/><path d=\"M1047.33 1023.38C1047.33 934.52 1046.46 751.61 1046.46 751.61H1072.69L1164.66 842.54H1276.87L1276.64 133.82H94.8711V835.16H200.841L284.241 751.62H313.361L313.961 1023.39C313.961 1120.89 173.071 1170.08 173.071 1170.08V1236.76H1202.21V1170.08C1202.21 1170.08 1047.32 1101.85 1047.32 1023.39L1047.33 1023.38Z\" fill=\"#4B6A6D\"/><path d=\"M94.4912 3.7H10.8711V1368.31H94.4912V3.7Z\" fill=\"#FF9100\"/><path d=\"M1360.87 3.7H1277.25V1362.21H1360.87V3.7Z\" fill=\"#EA86A5\"/></svg></div>\n      <h2 class=\"wp-h2\"><span class=\"wp-heading-spacer\" aria-hidden=\"true\"></span><span class=\"wp-sr-only\">T</span>his is a piece of small software.</h2>\n      <div class=\"wp-body\">\n        <p>Right now, you're using a piece of small software in Tonk. Small software is the type of software that you'd build for yourself, for some friends, or for colleagues.</p>\n        <p>Small software shouldn’t require a database service, an identity and authentication service, a hosting platform and a purchased domain name. You should never have to think about content delivery networks, load balancers or the API layer. These complexities are for the ambition to scale to millions of people; small software has the ambition to be high quality for exactly its purpose and nothing more.</p>\n        <p>Tonk gets rid of the unnecessary plumbing and, as a result, building in Tonk is fast and easy. I can simply express what behavior I want and it works right away. When I'm ready to share, I run a few commands to push my changes into the Tonk space. If I want to invite somebody to join me in this space, I just click the share button and I'm given an invite link.</p>\n      </div>\n      <figure class=\"wp-figure\">\n        <welcome-image entity=\"blob:CmZq5URy2ucFKNyZCFUtHiNvEaUNK4Z8UstvzwbjREFG\" with={dom.host/with} style=\"display:contents\"><img width=\"1024\" height=\"604\" class=\"wp-inline-image\"  alt=\"Screenshot of the Digital Micropublics group forum running in Tonk\" loading=\"lazy\" decoding=\"async\"></welcome-image>\n        <figcaption class=\"wp-caption\">An old school forum built in Tonk was used to generate discussion before and after an event in London on Digital Micropublics</figcaption>\n      </figure>\n    </section>\n\n    <section class=\"wp-section\">\n      <div class=\"wp-tile\" aria-hidden=\"true\"><svg viewBox=\"0 0 1402.8 1387.27\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" focusable=\"false\"><path d=\"M1395.36 7.43506H7.43555V1379.83H1395.36V7.43506Z\" fill=\"#D9E020\" stroke=\"black\" stroke-width=\"14.87\"/><path d=\"M1327.72 960.725C1327.72 1310.83 876.255 1321.4 876.255 1321.4H594.615\" stroke=\"#2C5256\" stroke-width=\"47\" stroke-miterlimit=\"10\"/><path d=\"M125.706 1292.45H674.486L673.146 283.625C673.146 106.645 735.206 92.9952 735.206 92.9952L735.256 38.8252C69.3056 38.8252 125.676 382.885 125.676 404.995L125.706 1292.45Z\" fill=\"#9B124A\"/><path d=\"M1327.59 983.555C1340.5 983.555 1350.95 973.096 1350.95 960.195C1350.95 947.294 1340.5 936.835 1327.59 936.835C1314.69 936.835 1304.23 947.294 1304.23 960.195C1304.23 973.096 1314.69 983.555 1327.59 983.555Z\" fill=\"#2C5256\"/><path d=\"M1558.35 791.365C1558.35 791.365 1564.72 710.925 1506.04 710.925\" stroke=\"#2C5256\" stroke-width=\"24\" stroke-miterlimit=\"10\"/><path d=\"M1430.25 669.365V591.595C1430.25 591.595 1490.61 608.665 1490.61 669.365H1430.25Z\" fill=\"#2C5256\"/><path d=\"M124.996 1127.22C315.716 956.495 1205.93 160.245 1205.93 160.245\" stroke=\"#FF92C9\" stroke-width=\"4\"/><path d=\"M259.775 1345.96C259.775 1345.96 45.8047 1351.8 45.8047 1201.11V1123.56H126.265C126.265 1123.56 130.485 1194.52 258.625 1194.52L259.775 1345.96Z\" fill=\"#9B124A\"/><path d=\"M673.965 1292.44H252.125V1345.96H673.965V1292.44Z\" fill=\"#9B124A\"/><path d=\"M1568.34 1058.83C1568.34 1058.83 1478.17 1060.02 1478.17 950.605\" stroke=\"#2C5256\" stroke-width=\"9\" stroke-miterlimit=\"10\"/><path d=\"M1136.04 734.775C1136.04 734.775 1308.88 761.405 1308.88 961.465\" stroke=\"#2C5256\" stroke-width=\"9\" stroke-miterlimit=\"10\"/></svg></div>\n      <h2 class=\"wp-h2\"><span class=\"wp-heading-spacer\" aria-hidden=\"true\"></span><span class=\"wp-sr-only\">L</span>ive software shared like you'd share a Google doc.</h2>\n      <div class=\"wp-body\">\n        <p>If AI makes software simple to build, shouldn’t it be simple to use together too? We dream of an age of small software, just-in-time software, bespoke to you software. It's a digital library of audiobooks you share with your mom. It's an application for the team to vote on when and where to go to lunch. It's an agentic multitool shared within the ops team.</p>\n        <p class=\"wp-em\">How do the software paradigms of today break in a software explosion?</p>\n        <p>Small software is weighed down by the paradigms of SaaS architecture. In order to unlock abundant small software, we must adapt to a world where instead of using a few big, expensive apps on a daily basis, I might use hundreds a day, thousands a week, or maybe even hundreds of thousands over a year.</p>\n      </div>\n      <figure class=\"wp-figure\">\n        <welcome-image entity=\"blob:9hKHdfALCDKRL5z3Xkn2JUM72DWSzsSBwAvdbyaPF2sU\" with={dom.host/with} style=\"display:contents\"><img width=\"1024\" height=\"643\" class=\"wp-inline-image forum-build\"  alt=\"Terminal showing the forum's seven files being pushed into a Tonk space\" loading=\"lazy\" decoding=\"async\"></welcome-image>\n        <figcaption class=\"wp-caption\">Our micropublics forum is defined by only seven files. My agent pushes the changes with couple commands. Share links for invites are minted in the menu bar.</figcaption>\n      </figure>\n    </section>\n\n    <section class=\"wp-section\">\n      <div class=\"wp-tile\" aria-hidden=\"true\"><svg viewBox=\"0 0 1415.32 1396.28\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" focusable=\"false\"><path d=\"M1395.57 1396.28L0 1377.37L18.54 9.15979L1415.32 0.609863L1395.57 1396.28Z\" fill=\"#38182A\"/><path d=\"M248.1 0H1.33008V1340.6H248.1V0Z\" fill=\"#7C7448\"/><path d=\"M633.87 335.9C633.87 335.9 617.35 349.48 246.42 349.48V1055.03C246.42 1055.03 253.2 1245.81 65.5098 1245.81V1340.59H631.59L633.87 335.9Z\" fill=\"#CCCCCC\"/><path d=\"M1372.65 1340.59L587.75 1340.46V1312.41H1372.65V1340.59Z\" fill=\"#CCCCCC\"/><path d=\"M651.23 895.62L1292.49 669.8\" stroke=\"#EA54AA\" stroke-width=\"10\" stroke-miterlimit=\"10\"/><path d=\"M641.779 913.45V306.07C641.779 306.07 664.319 47.5698 1007.06 47.5698C1256.32 47.5698 1355.98 186.06 1355.98 274.43\" stroke=\"#CCCCCC\" stroke-width=\"32\" stroke-miterlimit=\"10\"/><path d=\"M434.289 511.59C534.396 511.59 615.549 430.437 615.549 330.33C615.549 230.223 534.396 149.07 434.289 149.07C334.182 149.07 253.029 230.223 253.029 330.33C253.029 430.437 334.182 511.59 434.289 511.59Z\" fill=\"#71BBE7\" stroke=\"#EA246B\" stroke-width=\"21\" stroke-miterlimit=\"10\"/><path d=\"M533.6 1339.3C625.787 1339.3 700.52 1264.57 700.52 1172.38C700.52 1080.19 625.787 1005.46 533.6 1005.46C441.412 1005.46 366.68 1080.19 366.68 1172.38C366.68 1264.57 441.412 1339.3 533.6 1339.3Z\" fill=\"#CCCCCC\"/><path d=\"M750.119 1215.44C842.307 1215.44 917.039 1140.71 917.039 1048.52C917.039 956.333 842.307 881.6 750.119 881.6C657.932 881.6 583.199 956.333 583.199 1048.52C583.199 1140.71 657.932 1215.44 750.119 1215.44Z\" fill=\"#CCCCCC\"/><path d=\"M687.131 909.16H621.561V971.07H687.131V909.16Z\" fill=\"#C0C9B9\"/><path d=\"M1371.92 242.81H1303.05V661.45H1371.92V242.81Z\" fill=\"#CCCCCC\"/><path d=\"M4147.93 1607.84C4147.93 1607.84 4151.76 1509.97 4030.93 1510.52\" stroke=\"#9B124A\" stroke-width=\"54\" stroke-miterlimit=\"10\"/><path d=\"M4031.49 1483.57H3653.81V1503.65H4031.49V1483.57Z\" fill=\"#9B124A\"/></svg></div>\n      <h2 class=\"wp-h2\"><span class=\"wp-heading-spacer\" aria-hidden=\"true\"></span><span class=\"wp-sr-only\">F</span>lip the model of software to be local and small again</h2>\n      <div class=\"wp-body\">\n        <p>Imagine big software as a factory that needs its own power station, rules and roads. Whereas small software in Tonk is more like a house in a local neighborhood. Each house shares a public road, set of regulations and electricity grid. It would be absurd if every time you wanted to build a new house, you also had to also create a new power station, new laws and a new set of roads. If we fix the base layer as a shared system, then it's trivial to add and remove hundreds or even thousands of pieces of software without disruption.</p>\n        <p class=\"wp-em\">In Tonk, you hold on to your data and identity. The software comes to you.</p>\n        <p>Each new piece of software stops becoming a world of its own and instead becomes an interface into your world. Tonk is organized into spaces, which are containers of data and are the shareable unit of Tonk. When you bring a piece of software into a space, it extends the space and becomes a view into the data underneath.</p>\n        <p>You can synchronize tonk spaces to your machine through the CLI, so the data is always going to be available locally and all data access is signed by you alone, so it stays under your cryptographic control. Tonk services are designed to act as a relayer (dump pipes) like the electricity grid.</p>\n        <p class=\"wp-em\">And connecting your agent into a Tonk space is just as simple as sharing it with another person.</p>\n        <p>Tonk is a native medium for agents. All data has an address in the system. So, even if you know what an API is, you won’t need that to access data in a space. When you give your agent a share link, they set up a connection through the CLI and start to read and write to the space by using the system just like humans do. In fact, this is how agents build software in Tonk!</p>\n      </div>\n      <figure class=\"wp-figure\">\n        <wp-soup></wp-soup>\n        <figcaption class=\"wp-caption\">Data in a space is like a big soup. It has no imposed structure; each entry exists as an atomic element. Every piece of software or process expresses a view over those elements. Each client pulls out bespoke structure by defining what it cares about during query time. But in the end, all changes merge back into the same shared soup.</figcaption>\n      </figure>\n    </section>\n\n    <section class=\"wp-section\">\n      <div class=\"wp-tile\" aria-hidden=\"true\"><svg viewBox=\"0 0 1364 1352\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" focusable=\"false\"><path d=\"M1363.22 0H0V1351.37H1363.22V0Z\" fill=\"#C1C1C1\"/><path d=\"M327.52 613.69C327.52 1186.53 626.69 1323.99 1113.11 1323.99\" stroke=\"#38182A\" stroke-width=\"13\" stroke-miterlimit=\"10\" stroke-linecap=\"round\"/><path d=\"M231.12 1231.01L429.1 1106.46C429.53 1096.22 426.94 639.53 426.09 446.72C424.22 21.7404 94.9503 24.7203 60.7903 25.0303L21.6603 25.3903L21.5703 1332.06H452.04V1310.71C344.53 1310.71 275.41 1276.95 231.12 1231.02V1231.01Z\" fill=\"#38182A\"/><path d=\"M1116.5 27.48V1283.41\" stroke=\"#38182A\" stroke-width=\"5\" stroke-miterlimit=\"10\" stroke-linecap=\"round\"/><path d=\"M1301.99 25.0298C1301.99 25.0298 1301.41 71.2698 1301.41 634.27C1301.41 1161.77 1341.22 1303.78 1114.12 1303.78\" stroke=\"#38182A\" stroke-width=\"54\" stroke-miterlimit=\"10\"/></svg></div>\n      <h2 class=\"wp-h2\"><span class=\"wp-heading-spacer\" aria-hidden=\"true\"></span><span class=\"wp-sr-only\">N</span>ow it becomes affordable for anyone to build and share software.</h2>\n      <div class=\"wp-body\">\n        <p>We forget the personal computer was a radical invention. PBS's Triumph of the Nerds, when speaking of the 1975 Altair 8800, exclaims \"the question is, what do you do with it?\" At the time, it was a hobbyist machine; a fancy calculator. But early enthusiasts of the personal computer understood that most special quality of the personal computer: you could play when no other computing machine could let you play because it was too expensive.</p>\n        <p>That free space gave us digital art, electronic music, spreadsheets, digital publishing, computer games and more. What unexplored possibilities exist when digital collaboration no longer needs to feed an industry to secure its existence?</p>\n        <p>Maybe all those applications you loved that went out of business, will come back into your life, because small software can be playful and needs no justification for its existence beyond its value to you.</p>\n        <p>Explore that possibility with us, by making a free account, building into a Tonk space and sharing it with others to create your own world.</p>\n      </div>\n      <div class=\"wp-cta\" style=\"margin-top: 72px;\">\n        <wp-how-to-tonk><button class=\"wp-button\" type=\"button\"><span class=\"fill\"></span><span class=\"frame\"></span><span class=\"label\">How to Tonk</span></button></wp-how-to-tonk>\n      </div>\n    </section>\n  </div>\n</div>\n",
