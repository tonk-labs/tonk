# ===========================================================================
# notebook — a <tonk-notebook> document whose ```dialog-yaml fences are live cells.
# ===========================================================================
# A notebook IS a prose document. What makes it a notebook is that its fenced
# `dialog` code blocks are evaluated against the branch and their results
# rendered beneath them, which is the element's business, not the model's.
#
# Blocks are the STORED unit: the document the editor shows is the blocks
# projected (joined with a blank line), and an edit writes back only the
# blocks that changed. The notebook's `block` field is a SEQUENCE: one fact
# per block under `xyz.tonk.notebook/<position>`, so document order is the
# order the facts scan in, an insert touches one block, and two replicas
# inserting at once merge rather than fight over a list.
#
# See plan/notebook.md for the checkpoint model and plan/keyed-collections.md
# for the sequence field.
# ===========================================================================

# ---------------------------------------------------------------------------
# Attributes
# ---------------------------------------------------------------------------

attribute!: &notebook/title
  description: The notebook's title.
  the: xyz.tonk.notebook/title
  as: text

attribute!: &block/source
  description: A block's markdown source.
  the: xyz.tonk.notebook.block/source
  as: text

# ---------------------------------------------------------------------------
# Concepts
# ---------------------------------------------------------------------------

concept!: &notebook
  this: tonk:notebook
  description: |
    A notebook - prose with live dialog query cells. Its content is the
    `block` sequence: every block, keyed by a fractional position, in
    document order.
  with:
    title:
      description: The notebook's title.
      the: xyz.tonk.notebook/title
      cardinality: one
      as: text
    block:
      description: The notebook's blocks, in document order.
      the: xyz.tonk.notebook
      # Per ENTRY, and explicit: an omitted cardinality defaults to
      # `one`, which marks the field SCALAR for the renderer — the
      # template then substitutes `{block}` once instead of iterating
      # the entries, so the order rows never render and every block
      # reads as unplaced.
      cardinality: many
      as: {[position]: entity}

# The sequence alone, so a placement writes one entry rather than
# re-binding the notebook's every field (the wiki/board pattern).
concept!: &notebook/blocks
  description: A notebook's block sequence, as standalone entries.
  with:
    block:
      description: The notebook's blocks, in document order.
      the: xyz.tonk.notebook
      as: {[position]: entity}

# One block of a notebook. Carries a pointer back to its notebook so the
# block rows the element reads can be scoped, and so a block written before
# its placement lands still belongs somewhere.
concept!: &notebook/block
  this: tonk:notebook/block
  description: One markdown block of a notebook.
  with:
    notebook:
      description: The notebook this block belongs to.
      the: xyz.tonk.notebook.block/notebook
      cardinality: one
      as: entity
    source:
      description: The block's markdown source.
      the: xyz.tonk.notebook.block/source
      cardinality: one
      as: text

# ---------------------------------------------------------------------------
# The space shell.
#
# The space route mounts `<tonk-display entity={replica} model=tonk/space>`,
# so the model the shell renders has to resolve for the REPLICA entity, not
# a notebook. `tonk:notebook/space` is that model; its view mounts the scratch
# notebook as a nested display.
# ---------------------------------------------------------------------------

concept!: &notebook/space
  this: tonk:notebook/space
  description: A notebook view of the tonk replica.
  with:
    subject:
      description: The repository's subject DID (shared with tonk/replica)
      the: dialog.replica/subject
      as: entity

name!:
  this: id:tonk/space
  entity: tonk:notebook/space

view!:
  this: id:notebook/space/view
  model: tonk:notebook/space
  display: |
    <div class="notebook-space">
      <tonk-display entity="id:notebook/scratch" model=tonk:notebook></tonk-display>
    </div>

# ONE notebook. The element reads two hidden row sets: the notebook's own
# `block` sequence, one `.notebook-order__item` per entry in position order
# carrying the entry's key, and the block rows carrying each block's source.
view!:
  this: id:notebook/view
  model: tonk:notebook
  display: |
    <tonk-notebook
      data-subject={this}
      data-notebook={this}
      title={title}
      onblockedit=block/edit
      oninsert=block/insert
      onplace=block/place
      onremove=block/remove
      style="display: block;"
    >
      <div class="notebook-data" hidden>
        <div class="notebook-order">
          <span class="notebook-order__item" data-block={block} data-key={block/key}></span>
        </div>
        <tonk-display model=tonk:notebook/block></tonk-display>
      </div>
    </tonk-notebook>

# EVERY notebook — the directory view, which is what core's `/{*model}` route
# renders at `/space/{repo}/notebook`. A list of links, one per notebook.
view/directory!:
  this: id:notebook/directory
  model: tonk:notebook
  display: |
    <div class="notebook-index">
      <a class="notebook-index__item" href="notebook/{this}">
        <span class="notebook-index__title">{title}</span>
      </a>
    </div>

# The block rows the element reads: one per block, its source on the row.
view/directory!:
  this: id:notebook/block/rows
  model: tonk:notebook/block
  display: |
    <div class="notebook-block-rows">
      <div class="notebook-block-row"
        subject={this}
        data-block={this}
        data-notebook={notebook}
        data-source={source}></div>
    </div>

# ---------------------------------------------------------------------------
# Routes
# ---------------------------------------------------------------------------

route!: &route/notebook
  this: id:notebook/route
  path: "/notebook/{*entity}"
  concept: tonk:notebook/route

concept!: &notebook/route
  this: tonk:notebook/route
  description: A single notebook page (`/space/{repo}/notebook/{entity}`).
  with:
    entity:
      description: The notebook entity from the path, picked off the site.
      the: xyz.tonk.site/entity
      cardinality: one
      as: entity
    repo:
      description: The space repository, picked off the site entity.
      the: xyz.tonk.site/repo
      cardinality: one
      as: text
    branch:
      description: The space branch, picked off the site entity.
      the: xyz.tonk.site/branch
      cardinality: one
      as: text

view!:
  this: id:notebook/route/view
  model: tonk:notebook/route
  display: |
    <div class="notebook-space">
      <tonk-display with="{branch}@{repo}" entity={entity} model=tonk:notebook></tonk-display>
    </div>

# ---------------------------------------------------------------------------
# Commands and rules
# ---------------------------------------------------------------------------

command!: &block/edit
  description: Write one notebook block's source.
  with:
    subject:
      description: The block entity, stamped on the element's data-subject.
      the: dom.event.current-target.dataset/subject
      as: entity
    source:
      description: The block's new markdown source.
      the: dom.event.detail/source
      as: text
    notebook:
      description: |
        The notebook the block belongs to. Carried on every edit, not just a
        creating one: a block written with only its source does not match
        `tonk:notebook/block`, so it renders no row. Re-asserting it on an
        existing block is a no-op.
      the: dom.event.detail/notebook
      as: entity

# Placement is per block: put this block into its notebook's sequence under
# a position. The element derives the position between the block's
# neighbours (`dialog_artifacts::position`), so a move re-keys only what
# moved.
# Insert a block. The client does NOT name the entity.
#
# A block's identity is derived from this command's own body, the way every
# anchor-less assertion's is — so it falls out of `(source, notebook, after,
# before)` and the client has nothing to mint. That matters: the client used
# to build an entity from the document's block COUNT
# (`{notebook}/block-{len}-{nth}`), which is a position wearing an identity's
# clothes. Delete a block and add another and the count returns to a value it
# already had, so the new block minted an entity that already existed: two
# different blocks, one entity, sharing a source and each other's sequence
# entries. That is the "same block appears twice, blocks vanish while typing"
# failure.
#
# `after`/`before` are the neighbours the block was typed between. They are
# `maybe:` because the first and last block of a document have only one, and
# they are part of the identity so that the same text typed in two places
# stays two blocks. Identical text between the identical pair IS the same
# block, which is the one collision worth having.
command!: &block/insert
  description: Insert one block into a notebook, deriving its identity.
  with:
    # `inserted`, not `source`: an insert must not share its shape with
    # `block/edit`, or one event decodes as both commands and every edit
    # would also mint a block. The analyzer rejects the overlap outright
    # (`OverlappingTransientCommands`), which is how this was caught.
    source:
      description: The block's markdown source.
      the: dom.event.detail/inserted
      as: text
    notebook:
      description: The notebook the block belongs to.
      the: dom.event.detail/notebook
      as: entity
    # The neighbours' POSITIONS, not their entities.
    #
    # The element already reads every block's key off its row, so it can say
    # where the new block landed directly. Sending entities instead would
    # mean the rule had to look each neighbour's key up — a premise that
    # cannot match for the first or last block of a document, which have no
    # neighbour on one side. `coalesce` does not rescue that: it defends
    # against an absent VALUE, not an unmatched PREMISE.
    #
    # `""` is the empty bound, which `dialog/position` reads as "no bound on
    # this side". That is the formula's own convention, not one invented
    # here.
    after:
      description: The position of the block this one follows, or "".
      the: dom.event.detail/after
      as: text
    before:
      description: The position of the block this one precedes, or "".
      the: dom.event.detail/before
      as: text

command!: &block/place
  description: Place one block in its notebook's sequence.
  with:
    subject:
      description: The block entity.
      the: dom.event.current-target.dataset/subject
      as: entity
    notebook:
      description: The notebook whose sequence the block joins.
      the: dom.event.detail/notebook
      as: entity
    key:
      description: The block's position in the sequence.
      the: dom.event.detail/key
      as: text

command!: &block/remove
  description: Take one block out of its notebook's sequence.
  with:
    subject:
      description: The block entity.
      the: dom.event.current-target.dataset/subject
      as: entity
    notebook:
      description: The notebook whose sequence the block leaves.
      the: dom.event.detail/notebook
      as: entity
    # Its own attribute, not `detail/key`: two transient commands with the
    # same shape would both decode from one event, and the retraction
    # would fire alongside every placement.
    key:
      description: The position the block held.
      the: dom.event.detail/removed
      as: text

# The inserted block IS the command entity: `?this` flows from the command
# match into the head, exactly as `table/create-sheet` does. Nothing derives a
# name from the document's shape, so no two blocks can collide by being typed
# at the same length.
rule!:
  description: Persist an inserted block.
  assert!: notebook/block
  when:
    - assert: block/insert
      where:
        this: ?this
        source: ?source
        notebook: ?notebook

# ...and place it, in the same step.
#
# `dialog/position` derives the key from the neighbours' positions, biased by
# the member entity — so two replicas inserting the same block between the
# same neighbours converge on one key, and distinct blocks disperse. The
# element computes no position: it reports the two it landed between and the
# formula does the rest.
#
# ONE rule, because the bounds arrive already resolved. Taking neighbour
# ENTITIES instead would need a premise to look each one's key up, and that
# premise cannot match for a block with no neighbour on one side — the first
# and last of every document — so the block would be asserted and never
# placed.
rule!:
  description: Place an inserted block in its notebook's sequence.
  assert!: notebook/blocks
  when:
    - assert: block/insert
      where:
        this: ?block
        notebook: ?this
        after: ?after
        before: ?before
    - assert: dialog/position
      where:
        member: ?block
        after: ?after
        before: ?before
        is: ?block/key

rule!:
  description: Persist a block edit onto its block.
  assert!: notebook/block
  when:
    - assert: block/edit
      where:
        subject: ?this
        source: ?source
        notebook: ?notebook

# The head's entry is `block: {?block/key: ?block}`: the body binds the
# block to the field and the position to its key, and the fact lands under
# `xyz.tonk.notebook/<key>`.
rule!:
  description: Persist a placement into the notebook's sequence.
  assert!: notebook/blocks
  when:
    - assert: block/place
      where:
        subject: ?block
        notebook: ?this
        key: ?block/key

rule!:
  description: Retract a block's entry from the notebook's sequence.
  retract!: notebook/blocks
  when:
    - assert: block/remove
      where:
        subject: ?block
        notebook: ?this
        key: ?block/key

# The block's own facts go too. Retracting only the entry leaves the block
# behind with its source, and a block that has a source but no entry is
# exactly the shape the element treats as "placement never landed" — so it
# renders at the end and is re-keyed on the next commit. A deleted block
# would come straight back.
rule!:
  description: Retract a removed block's own facts.
  retract!: notebook/block
  when:
    - assert: block/remove
      where:
        subject: ?this
        notebook: ?notebook
    - assert: notebook/block
      where:
        this: ?this
        notebook: ?notebook
        source: ?source

# ---------------------------------------------------------------------------
# Seed
# ---------------------------------------------------------------------------

notebook!:
  this: id:notebook/scratch
  title: "Scratch"
  block: {N1: id:notebook/scratch/1}

notebook!:
  this: id:notebook/scratch
  block: {N5: id:notebook/scratch/2}

notebook!:
  this: id:notebook/scratch
  block: {N9: id:notebook/scratch/3}

# The seeded blocks must be exactly what `split` produces from the projected
# document, or the first edit re-partitions the whole notebook: a heading is
# grouped with the paragraph it introduces.
notebook/block!:
  this: id:notebook/scratch/1
  notebook: id:notebook/scratch
  source: |-
    # Scratch

    A `dialog-yaml` fence is a live cell: it evaluates against this branch and renders its results underneath.

notebook/block!:
  this: id:notebook/scratch/2
  notebook: id:notebook/scratch
  source: |-
    ```dialog-yaml
    concept:
    ```

notebook/block!:
  this: id:notebook/scratch/3
  notebook: id:notebook/scratch
  source: >-
    Query cells run on their own, because a query has no effect. Cells that
    assert are recognized and held: they need a checkpoint to land in, which
    is not built yet.
