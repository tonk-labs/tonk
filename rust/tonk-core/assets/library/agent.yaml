# The agent library: what an agent's own space is about.
#
# Seeded into every agent space in place of `core.yaml`; see BUG-218 in
# tonk-team.
#
# An agent is a space. Its subject DID is the agent wherever an account
# DID could stand: a member, an assignee, an author, an audience. The
# account that provisioned it keeps its key, delegated to it, and is
# responsible for what it does. The two relate the way an account and its
# devices do:
#
#   account       ->  device       (account/device-link, profile.yaml)
#   agent space   ->  peer         (agent/peer, here)
#
# A peer is one authorization of an LLM host (an OAuth session): its own
# key, holding a powerline from the agent space. Each MCP session of a
# peer is an agent/session: it signs its writes with its own key, derived
# from the peer's seed and the session id.
#
# This file replaces `core.yaml` in an agent space. It declares only what
# describes the agent, so an agent reading its own schema finds itself,
# and nothing about workspaces, boards or notes it never uses.
#
# Every attribute below is one something already writes, or one the
# provisioning in BUG-218 writes. Where a fact is already stored under an
# existing attribute, this file reads that attribute rather than coining a
# new one, so existing agent spaces match without a migration.

# ── The agent ──────────────────────────────────────────────────────

# The agent itself.
#
# ENTITY: the agent space's subject DID — the agent's DID.
#
# One concept over the facts provisioning already writes on that DID:
# the space's name, its kind mark, and the provider whose apps it serves.
# They used to be three concepts (`tonk/repository`, `tonk/agent-space`,
# `tonk/agent-provider`); an agent asking "who am I" should get one row.
concept!: &agent
  description: An agent, identified by its space's DID.
  with:
    name:
      description: >
        What the agent is called, e.g. "Claude". The space's display
        name; the same fact `tonk/repository` reads.
      the: xyz.tonk.repo/name
      as: text
    kind:
      description: What kind of space this is — `case:agent`.
      the: xyz.tonk.repo/kind
      as: entity
    provider:
      description: >
        The LLM provider whose apps this agent serves, `claude` or
        `chatgpt`. An agent is only offered again to an app of the same
        provider.
      the: xyz.tonk.agent-space/provider
      as: text
  maybe:
    description:
      description: A short description of what this agent is for.
      the: xyz.tonk.repo/description
      as: text

# The space's own name, as every space carries it. The same concept as
# `core.yaml`'s, over the same attributes: the hosted MCP guide tells an
# agent to read a space's name with `tonk/repository:`, and that must
# work in the agent's own space too.
#
# ENTITY: the space's subject DID — here, the agent's DID.
concept!: &tonk/repository
  description: A space's display name, carried in the space itself.
  with:
    name:
      description: The space's display name.
      the: xyz.tonk.repo/name
      as: text
  maybe:
    description:
      description: A short description written by the space owner.
      the: xyz.tonk.repo/description
      as: text

# Who the agent acts for: the account responsible for its work.
#
# ENTITY: the agent's DID, like `agent`.
#
# Its own record, not a field of `agent`, and stored rather than derived
# from the roster. It is written once, at provisioning, from the account
# that seals the agent's key and delegates to it. That is a fact about
# custody, not about a role, so it does not move if the roster does.
concept!: &agent/principal
  description: The account an agent acts for and answers to.
  with:
    account:
      description: >
        The account's DID: the issuer of every `account -> agent` grant
        and the founder of this space.
      the: xyz.tonk.agent/principal
      as: entity

# ── Members ─────────────────────────────────────────────────────────

# A member of this space. The same concept, over the same attributes, as
# `core.yaml`'s, so a roster reads an agent space like any other.
#
# An agent space has two: its founding account (`tonk:founder`) and the
# agent itself (`tonk:agent`). The agent being a member of its own space
# is what lets it appear wherever members are listed or picked.
concept!: &member
  description: A member of a space.
  with:
    member:
      description: The member's DID.
      the: xyz.tonk.membership/member
      as: entity
    role:
      description: >
        `tonk:founder` for the account that created the space,
        `tonk:agent` for the agent itself, `tonk:member` for anyone
        invited.
      the: xyz.tonk.membership/role
      as: entity
    name:
      description: The member's display name in this space.
      the: xyz.tonk.membership/name
      as: text

# ── Peers ───────────────────────────────────────────────────────────

# One peer of the agent: an LLM host's authorization to act as it.
#
# The same shape as `account/device-link`, for the same reasons. `this`
# IS THE DELEGATION: the agent space's powerline to the peer's key, keyed
# by its blob hash as dialog keyed it when the chain was retained. The
# peer's DID is that delegation's own audience, read here from dialog's
# decomposition on the same entity rather than copied, so the row cannot
# disagree with the proof. Revoking the powerline takes the row with it.
#
# The powerline never expires: a peer reaches other spaces only through
# grants, which do, and renewing it would need the account.
#
# Replaces `core.yaml`'s `agent/session`, which described the powerline
# and which nothing ever wrote; that name now means one MCP session.
concept!: &agent/peer
  description: One LLM host's authorization to act as this agent.
  # ENTITY: THE DELEGATION.
  with:
    peer:
      description: The peer's DID — the powerline's audience.
      the: dialog.ucan/audience
      as: text
    created-at:
      description: When the peer was authorized, unix seconds.
      the: xyz.tonk.agent-peer/created-at
      as: natural:64
    title:
      description: The host it was authorized for, e.g. "Claude".
      the: xyz.tonk.agent-peer/title
      as: text

# One session of a peer: one MCP session, which signs its writes with
# its own key.
#
# ENTITY: the session's DID — the key it signs with.
#
# Recorded the first time the session writes, so an agent can recognise
# its own past writes and say which session made them.
concept!: &agent/session
  description: One MCP session of a peer, by the key it signs with.
  with:
    peer:
      description: The `agent/peer` (its delegation) this session belongs to.
      the: xyz.tonk.agent-session/peer
      as: entity
    first-seen:
      description: When this session first wrote, unix seconds.
      the: xyz.tonk.agent-session/first-seen
      as: natural:64

# ── What the agent can reach ────────────────────────────────────────

# A space the agent has access to: the directory entry approval writes.
#
# ENTITY: the space's subject DID.
#
# The access itself is the delegation chain (`ucan/delegation` below,
# issuer the account, audience the agent, subject the space); this row
# only names the space and says where it syncs.
concept!: &agent/space
  description: A space this agent has access to.
  with:
    name:
      description: The space's name as the account knows it.
      the: xyz.tonk.space/name
      as: text
    home:
      description: Where the space syncs.
      the: xyz.tonk.space/home-address
      as: text

# A delegation this space retained: the proof itself, as dialog stores it.
# The same concept as `profile.yaml`'s.
#
# ENTITY: the delegation's blob hash — the entity `agent/peer` hangs its
# fields on.
concept!: &ucan/delegation
  description: A delegation retained on this branch.
  with:
    issuer:
      description: Who signed it.
      the: dialog.ucan/issuer
      as: text
    audience:
      description: Who receives the authority.
      the: dialog.ucan/audience
      as: text
    subject:
      description: >
        What the authority is over. A powerline carries the any-subject
        DID rather than being absent.
      the: dialog.ucan/subject
      as: text
    command:
      description: The delegated command path, e.g. `/use/get`.
      the: dialog.ucan/command
      as: text
  maybe:
    expiration:
      description: Unix seconds, absent when the delegation never expires.
      the: dialog.ucan/expiration
      as: natural

# ── What the agent knows ────────────────────────────────────────────

# A skill: instructions the agent keeps for itself, carried from one
# conversation to the next. What it has learned about a space, a
# workflow it follows, a mistake not to repeat.
#
# Borrowed from the tonk-team space, where `skill` is instructions a
# space gives the agents working in it, over the same attributes. So a
# skill reads the same wherever it is written: one a space hands an
# agent, and one the agent writes down for itself, are the same shape,
# and the agent can copy one into the other.
#
# ENTITY: content-addressed, or whatever the author chooses; a skill is
# not keyed by anything but itself.
concept!: &skill
  description: >
    Instructions an agent keeps. List them at the start of a
    conversation to remember how you work.
  with:
    title:
      description: What the skill is for, in a few words.
      the: xyz.tonk.skill/title
      as: text
    body:
      description: The instructions, as Markdown.
      the: xyz.tonk.skill/body
      as: text

# A command a skill tells the agent how to use. Many per skill.
#
# ENTITY: the skill.
concept!: &skill/command
  description: A command a skill tells agents how to use.
  with:
    command:
      description: The command.
      the: xyz.tonk.skill/command
      as: entity
      pick: :all

# A concept a skill is about. Many per skill.
#
# ENTITY: the skill.
concept!: &skill/concept
  description: A concept a skill is about.
  with:
    concept:
      description: The concept.
      the: xyz.tonk.skill/concept
      as: entity
      pick: :all
