# Generated by scripts/onboarding/playground.py from core.yaml.
concept!: &onboarding/agent-invite
  this: tonk:onboarding/agent-invite
  description: An account-scoped handoff joined with the repository name for the agent prompt.
  with:
    name:
      description: The repository's display name.
      the: xyz.tonk.repo/name
      cardinality: one
      as: text
    link:
      description: The complete account-scoped handoff URL.
      the: xyz.tonk.agent-invite/link
      cardinality: one
      as: text
    account:
      description: The browser account the agent must connect as.
      the: xyz.tonk.agent-invite/account
      cardinality: one
      as: entity

rule!:
  description: Joins the repository name with its ready account-scoped agent handoff.
  assert: onboarding/agent-invite
  when:
    - assert: tonk/repository
      where:
        this: ?this
        name: ?name
    - assert: tonk/agent-handoff-state
      where:
        this: ?this
        status: "ready"
        link: ?link
        account: ?account

view!:
  this: tonk:onboarding/agent-invite
  show:
    ui: |
      <div class="agent-prompt">
        <style>
          .agent-prompt { padding: var(--wa-space-l); border-radius: var(--wa-border-radius-l); background: var(--wa-color-surface-lowered); display: flex; flex-direction: column; gap: var(--wa-space-m); }
          .agent-prompt p { margin: 0; line-height: var(--wa-line-height-normal); text-wrap: pretty; }
          .agent-prompt__action { display: flex; gap: var(--wa-space-s); align-items: center; }
          .agent-prompt__copy {
            --agent-copy-ink: var(--fabb-ink, #38182a);
            --agent-copy-surface: var(--fabb-on-ink, #f7f6f5);
          }
          .agent-prompt__copy::part(button) {
            box-sizing: border-box;
            min-width: 144px;
            min-height: 44px;
            padding: 0 16px;
            border: 0;
            border-radius: 0;
            align-items: center;
            justify-content: center;
            background: var(--agent-copy-surface);
            color: var(--agent-copy-ink);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--agent-copy-ink) 28%, transparent);
            font: 600 13px/1 'IBM Plex Sans Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif;
            letter-spacing: .02em;
            text-transform: lowercase;
            transition: scale 150ms ease-out, background-color 150ms ease-out;
          }
          .agent-prompt__copy::part(button):hover {
            background: color-mix(in srgb, var(--agent-copy-ink) 6%, var(--agent-copy-surface));
            color: var(--agent-copy-ink);
          }
          .agent-prompt__copy::part(button):active {
            scale: .96;
            background: color-mix(in srgb, var(--agent-copy-ink) 12%, var(--agent-copy-surface));
            color: var(--agent-copy-ink);
          }
          .agent-prompt__copy::part(button):focus-visible {
            background: var(--agent-copy-surface);
            color: var(--agent-copy-ink);
            outline: 2px solid var(--agent-copy-ink);
            outline-offset: 3px;
          }
          .agent-prompt__copy::part(copy-icon),
          .agent-prompt__copy::part(success-icon),
          .agent-prompt__copy::part(error-icon) {
            color: inherit;
            animation: none;
          }
          .agent-prompt__copy[disabled]::part(button) { opacity: .4; cursor: not-allowed; scale: 1; }
          .agent-prompt__copy::part(tooltip__base) { display: none; }
          @media (prefers-reduced-motion: reduce) {
            .agent-prompt__copy::part(button) { transition: none; }
            .agent-prompt__copy::part(button):active { scale: 1; }
          }
          .agent-prompt__note { color: var(--wa-color-text-quiet); font-size: var(--wa-font-size-s); }
        </style>
        <p>Copy the prompt and give it to an agent of your choice. Then tell it what you want to build on the Agent playground page.</p>
        <p class="agent-prompt__note">Your agent will connect to this space and be instructed to work only on the Agent playground page. If it needs to link your account, Tonk will open a browser approval. Keep this space open to see the connection confirmed and watch your changes arrive.</p>
        <div class="agent-prompt__action">
          <wa-copy-button class="agent-prompt__copy" copy-label="Copy prompt" success-label="Prompt copied" error-label="Could not copy" value="You're helping build only the &quot;Agent playground&quot; page in the &quot;{name}&quot; Tonk space.

      Connect to the exact space this prompt came from:

        npx --yes @tonk/cli connect '{link}'

      The command uses the space’s synced name for local registration and prints the chosen local name. Use --name only if you want a different local alias. This handoff requires account {account}. If the CLI reports a different account, explain the mismatch and ask me before switching. Only after I consent, rerun the same command with `--switch-account {account}`. Browser passkey approval is still required; tell me to approve the requested account in my Tonk browser. Do not log out first. It pulls this space and sends a connection acknowledgement back to its UI. Allow the command to finish, including browser approval. Only report connected after it prints &quot;Agent connection confirmed&quot;. If interrupted after joining, run `npx --yes @tonk/cli --space NAME connect` (using the local name printed by the command). A synced status alone does not confirm the agent connection. If that resume reports revoked authority, rerun the original invite with a different local name: `npx --yes @tonk/cli connect INVITE --name NEW_NAME`.

      Then run `npx --yes @tonk/cli status` and `npx --yes @tonk/cli help tutorial`. The command binds your working directory to the connected space; elsewhere, pass --space with the printed local name. Ask me what I want to build on the Agent playground page. Use `npx --yes @tonk/cli` for each CLI command that changes data, schemas, or views; changes sync directly into this space. Scope all work to the existing Agent playground page (entity did:key:z6MkF65VFoAVjUMUBsQ7uMzEe5cfxPeJ2M6WZi2ENNqXi4fo, concept playground-page / concept:CzJUmTs4SBYNXhePYAZGdumwKeg5rnnK4oVv74utdNHd). Inspect that page and its playground/* concepts first. Change only its page-specific view, components, and data; use new playground-specific concepts when needed. Preserve the page entity and its place in the navigation. Do not change the space home, other pages, shared components, shared schemas, or space-wide settings. Render the result inside the Agent playground page, not on the space home. If the requested work needs changes outside this page, explain why and ask me first.

      While working here, you may use playground/agent to report your status and playground/deed to record activity. Read their schemas before writing. Their time fields use epoch milliseconds as float literals. The playground checklist is optional; follow what I ask you to build.">
            <span slot="copy-icon" aria-hidden="true">copy prompt</span>
            <span slot="success-icon" aria-hidden="true">prompt copied</span>
            <span slot="error-icon" aria-hidden="true">could not copy</span>
          </wa-copy-button>
        </div>
      </div>

view!:
  this: tonk:blank
  show:
    playground-agent: |
      <div class="playground-agent">
        <style>.playground-agent tonk-display > [slot][hidden] { display: none !important; }</style>
        <tonk-page on:invite=tonk:agent-handoff></tonk-page>
        <tonk-origin>
          <tonk-display entity={subject} model=tonk:onboarding/agent-invite>
            <tonk-display slot="no-entity" entity={subject} model=tonk:agent-handoff-state>
              <p slot="no-entity">Preparing agent connection…</p>
            </tonk-display>
          </tonk-display>
        </tonk-origin>
      </div>
