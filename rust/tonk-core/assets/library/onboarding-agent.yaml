# Generated by scripts/onboarding/playground.py from core.yaml.
# Explicit new invitation; automatic mount requests omit this marker.
event!: &on/new-agent-invite
  type: "click"
  where:
    time: ".timeStamp"
    fresh: '"new"'

concept!:
  this: tonk:new-agent-invite
  description: Create a separate agent invitation when the user asks for one.
  with:
    time:
      description: The time a separate invitation was explicitly requested.
      the: xyz.tonk.agent-handoff/time
      as: float
      cardinality: one
    fresh:
      description: Explicit new-invitation marker; absent from automatic mounts.
      the: xyz.tonk.agent-handoff/fresh
      as: text
      cardinality: one

# New-mode controls also remain reachable when a transient link is unavailable.
concept!:
  this: tonk:connection-invite-controls
  description: Session-only explicit action for another scoped invitation.
  with:
    mode:
      description: Marker emitted only by the scoped invitation adapter.
      the: xyz.tonk.agent-handoff/mode
      as: text
      cardinality: one

view!:
  this: tonk:connection-invite-controls
  show:
    ui: |
      <button class="connection-invite-new" on:new-agent-invite=tonk:new-agent-invite>new invite</button>
      <style>
        .connection-invite-new {
          min-height: 44px; padding: 0 16px; border: 0; border-radius: 0;
          background: transparent; color: var(--fabb-ink, #38182a);
          box-shadow: inset 0 0 0 1px currentColor;
          font: 600 13px/1 'IBM Plex Sans Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif;
          letter-spacing: .02em; cursor: pointer;
        }
        .connection-invite-new:hover { background: color-mix(in srgb, currentColor 6%, transparent); }
        .connection-invite-new:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
      </style>


view!:
  this: tonk:agent-handoff-state
  show:
    ui: |
      <p data-agent-handoff-status>{status}</p>
      <tonk-display entity={this} model=tonk:connection-invite-controls>
        <span slot="no-entity" hidden></span>
      </tonk-display>


concept!: &onboarding/agent-invite
  this: tonk:onboarding/agent-invite
  description: An agent invitation joined with the repository name for the copied prompt.
  with:
    name:
      description: The repository's display name.
      the: xyz.tonk.repo/name
      cardinality: one
      as: text
    link:
      description: The complete agent invitation URL.
      the: xyz.tonk.agent-invite/link
      cardinality: one
      as: text
    account:
      description: The account required by legacy handoffs; unused by bearer invitations.
      the: xyz.tonk.agent-invite/account
      cardinality: one
      as: entity

rule!:
  description: Joins the repository name with its ready agent invitation.
  assert: onboarding/agent-invite
  when:
    - assert: tonk/repository
      where:
        this: ?this
        name: ?name
    - assert: tonk/agent-handoff-state
      where:
        this: ?this
        status: "ready"
        link: ?link
        account: ?account

view!:
  this: tonk:onboarding/agent-invite
  show:
    ui: |
      <tonk-component>
        <script type="tonk/module">
          customElements.get("tonk-agent-prompt") ||
            customElements.define("tonk-agent-prompt", class extends HTMLElement {
              static observedAttributes = ["link"];
              connectedCallback() {
                this.observer = new MutationObserver(() => this.render());
                this.observer.observe(this, { childList: true, subtree: true });
                this.render();
              }
              disconnectedCallback() { this.observer?.disconnect(); }
              attributeChangedCallback() { if (this.isConnected) this.render(); }
              render() {
                let mode = "";
                try {
                  const hash = new URL(this.getAttribute("link")).hash;
                  mode = hash.startsWith("#tonk-agent-v1=") ? "scoped" : "unsupported";
                } catch (_) {}
                for (const block of this.querySelectorAll("[data-agent-mode]")) {
                  block.hidden = block.dataset.agentMode !== mode;
                }
              }
            });
        </script>
      </tonk-component>
      <tonk-agent-prompt link={link}>
      <div class="agent-prompt">
        <style>
          tonk-agent-prompt [hidden] { display: none !important; }
          tonk-agent-prompt [data-agent-mode] { display: flex; flex-direction: column; gap: var(--wa-space-m); }
          .agent-prompt { padding: var(--wa-space-l); border-radius: var(--wa-border-radius-l); background: var(--wa-color-surface-lowered); display: flex; flex-direction: column; gap: var(--wa-space-m); }
          .agent-prompt p { margin: 0; line-height: var(--wa-line-height-normal); text-wrap: pretty; }
          .agent-prompt__action { display: flex; flex-wrap: wrap; gap: var(--wa-space-s); align-items: center; }
          .agent-prompt__copy {
            --agent-copy-ink: var(--fabb-ink, #38182a);
            --agent-copy-surface: var(--fabb-on-ink, #f7f6f5);
          }
          .agent-prompt__copy::part(button) {
            box-sizing: border-box;
            min-width: 144px;
            min-height: 44px;
            padding: 0 16px;
            border: 0;
            border-radius: 0;
            align-items: center;
            justify-content: center;
            background: var(--agent-copy-surface);
            color: var(--agent-copy-ink);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--agent-copy-ink) 28%, transparent);
            font: 600 13px/1 'IBM Plex Sans Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif;
            letter-spacing: .02em;
            text-transform: lowercase;
            transition: scale 150ms ease-out, background-color 150ms ease-out;
          }
          .agent-prompt__copy::part(button):hover {
            background: color-mix(in srgb, var(--agent-copy-ink) 6%, var(--agent-copy-surface));
            color: var(--agent-copy-ink);
          }
          .agent-prompt__copy::part(button):active {
            scale: .96;
            background: color-mix(in srgb, var(--agent-copy-ink) 12%, var(--agent-copy-surface));
            color: var(--agent-copy-ink);
          }
          .agent-prompt__copy::part(button):focus-visible {
            background: var(--agent-copy-surface);
            color: var(--agent-copy-ink);
            outline: 2px solid var(--agent-copy-ink);
            outline-offset: 3px;
          }
          .agent-prompt__copy::part(copy-icon),
          .agent-prompt__copy::part(success-icon),
          .agent-prompt__copy::part(error-icon) {
            color: inherit;
            animation: none;
          }
          .agent-prompt__copy[disabled]::part(button) { opacity: .4; cursor: not-allowed; scale: 1; }
          .agent-prompt__copy::part(tooltip__base) { display: none; }
          @media (prefers-reduced-motion: reduce) {
            .agent-prompt__copy::part(button) { transition: none; }
            .agent-prompt__copy::part(button):active { scale: 1; }
          }
          .agent-prompt__new {
            min-height: 44px; padding: 0 16px; border: 0; border-radius: 0;
            background: transparent; color: var(--fabb-ink, #38182a);
            box-shadow: inset 0 0 0 1px currentColor;
            font: 600 13px/1 'IBM Plex Sans Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif;
            letter-spacing: .02em; cursor: pointer;
          }
          .agent-prompt__new:hover { background: color-mix(in srgb, currentColor 6%, transparent); }
          .agent-prompt__new:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
          .agent-prompt__note { color: var(--wa-color-text-quiet); font-size: var(--wa-font-size-s); }
        </style>
        <p>Copy the prompt and give it to an agent of your choice. Then tell it what you want to build on the Agent playground page.</p>
        <div data-agent-mode="unsupported" hidden>
          <p class="agent-prompt__note">This older invitation cannot connect an agent. Create a new agent invitation from an updated Tonk deployment. To access your own spaces from the terminal, run <code>tonk link</code>.</p>
        </div>
        <div data-agent-mode="scoped" hidden>
        <p class="agent-prompt__note">Your agent will connect to this space and be instructed to work only on the Agent playground page. This link grants build access to anyone who has it until it expires or you revoke it. You can close Tonk after copying. The connection receipt confirms a completed sync; it does not show whether an agent is online.</p>
        <div class="agent-prompt__action">
          <wa-copy-button class="agent-prompt__copy" copy-label="Copy prompt" success-label="Prompt copied" error-label="Could not copy" value="You're helping build only the &quot;Agent playground&quot; page in the &quot;{name}&quot; Tonk space.

      Connect to the exact space this prompt came from:

        npx --yes @tonk/cli connect '{link}'

      This reusable bearer link contains the invitation key and grants for this space. Keep it private. Run the command without CLI account login, browser approval, or account-switch flags. The command prints the chosen local name; use --name if you need a different local alias. Only report connected after it prints &quot;Agent connection confirmed&quot;, which follows a successful pull and acknowledged receipt push. If interrupted, resume without the link using `npx --yes @tonk/cli --space NAME connect`. If access expires or is revoked, ask me for a fresh invite. Local data and offline edits remain available. Multiple holders of this link share the same invitation authority and receipt; the receipt does not establish exclusive use or online presence.

      Then run `npx --yes @tonk/cli --space NAME status` and `npx --yes @tonk/cli help tutorial`. The command binds your original working directory to the connected space; elsewhere, pass --space with the printed local name. Ask me what I want to build on the Agent playground page. Use `npx --yes @tonk/cli` for each CLI command that changes data, schemas, or views; changes sync directly into this space. Scope all work to the existing Agent playground page (entity did:key:z6MkF65VFoAVjUMUBsQ7uMzEe5cfxPeJ2M6WZi2ENNqXi4fo, concept playground-page / concept:CzJUmTs4SBYNXhePYAZGdumwKeg5rnnK4oVv74utdNHd). Inspect that page and its playground/* concepts first. Change only its page-specific view, components, and data; use new playground-specific concepts when needed. Preserve the page entity and its place in the navigation. Do not change the space home, other pages, shared components, shared schemas, or space-wide settings. Render the result inside the Agent playground page, not on the space home. If the requested work needs changes outside this page, explain why and ask me first.

      While working here, you may use playground/agent to report your status and playground/deed to record activity. Read their schemas before writing. Their time fields use epoch milliseconds as float literals. The playground checklist is optional; follow what I ask you to build.">
            <span slot="copy-icon" aria-hidden="true">copy prompt</span>
            <span slot="success-icon" aria-hidden="true">prompt copied</span>
            <span slot="error-icon" aria-hidden="true">could not copy</span>
          </wa-copy-button>
          <button class="agent-prompt__new" on:new-agent-invite=tonk:new-agent-invite aria-label="Create another independent agent invite">new invite</button>
        </div>
        </div>
      </div>
      </tonk-agent-prompt>

view!:
  this: tonk:blank
  show:
    playground-agent: |
      <div class="playground-agent">
        <style>.playground-agent tonk-display > [slot][hidden] { display: none !important; }</style>
        <tonk-page on:invite=tonk:agent-handoff></tonk-page>
        <tonk-origin>
          <tonk-display entity={subject} model=tonk:onboarding/agent-invite>
            <tonk-display slot="no-entity" entity={subject} model=tonk:agent-handoff-state>
              <p slot="no-entity">Preparing agent connection…</p>
            </tonk-display>
          </tonk-display>
        </tonk-origin>
      </div>
