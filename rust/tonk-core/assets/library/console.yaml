# ===========================================================================
# console — the `/console` introspection page.
# ===========================================================================
# A read-only window onto what this device's reactor is actually doing:
# which queries are subscribed on which branch, what transactions have come
# in, and where each replica's sync stands.
#
# This document is NOT seeded at profile bootstrap. It is fetched and
# evaluated onto the profile branch the FIRST TIME a tab asks for
# `/console` — the route miss in the service worker's `stamp_site_on` is
# the trigger. Once evaluated the routes below are durable facts on the
# branch, so the miss path never runs again for this profile.
#
# Everything the console shows is an OVERLAY fact: the worker publishes the
# reactor's live state into the profile branch's session overlay (the same
# mechanism the sync chip uses), so nothing here is ever committed and
# nothing replicates to another device. A console row describes THIS
# device's worker and no other.
# ===========================================================================

# ---------------------------------------------------------------------------
# Subscriptions
# ---------------------------------------------------------------------------

# One live subscription in the reactor — a `(branch, query)` pair with the
# set of subscribers attached to it. The reactor holds these in a map keyed
# by query hash; the publisher mints one entity per entry so a subscription
# that comes and goes appears and disappears as a row.
concept!: &console/subscription
  description: A live query subscription held by this device's reactor.
  with:
    space:
      description: >
        The repository the subscription is registered against — the
        grouping key. A location token rather than a DID so the row reads
        the way the address bar does; the profile's own subscriptions
        carry the `profile:<name>` token.
      the: xyz.tonk.console.subscription/space
      cardinality: one
      as: text
    branch:
      description: The branch within that repository the query runs against.
      the: xyz.tonk.console.subscription/branch
      cardinality: one
      as: text
    query:
      description: >
        The subscribed query, rendered as dialog-yaml notation — the same
        language the inspector shows and the editor edits, so a query reads
        here the way it reads everywhere else. Handed to `<tonk-notation>`,
        which tokenizes and highlights it. This is the thing you came to the
        console to read.
      the: xyz.tonk.console.subscription/query
      cardinality: one
      as: text
    opened-at:
      description: >
        When the subscription was opened, ISO-8601. Rendered by
        `<wa-relative-time sync>`, which counts up on its own — so the age
        of a subscription stays true between refreshes.
      the: xyz.tonk.console.subscription/opened-at
      cardinality: one
      as: text
    subscribers:
      description: >
        How many open channels are attached to this subscription. Several
        tabs asking the same question of the same branch share one entry,
        so this is where that sharing shows up.
      the: xyz.tonk.console.subscription/subscribers
      cardinality: one
      as: unsigned-integer
    concept-name:
      description: >
        The concept this subscription watches, as a readable name
        (`tonk:site`) — the collapsed row's label, the thing a
        `<tonk-display model=…>` was pointed at. Derived from the query's
        attribute namespace, because a display resolves its model to a query
        before subscribing and only the query crosses the bridge.
      the: xyz.tonk.console.subscription/concept-name
      cardinality: one
      as: text
    bytes-pushed:
      description: >
        Total bytes pushed to subscribers since this subscription opened. A
        running total rather than a log: the reactor keeps no update history,
        so this is the cheap summary that survives a reload while the
        streamed detail does not.
      the: xyz.tonk.console.subscription/bytes-pushed
      cardinality: one
      as: unsigned-integer
    updates:
      description: >
        How many updates this subscription has pushed since it opened —
        deltas that carried a real change, not the initial snapshot each
        subscriber gets on attach. A poll that finds nothing changed pushes
        no frame and is not counted, so this is the number of times the
        answer to this query actually moved.
      the: xyz.tonk.console.subscription/updates
      cardinality: one
      as: unsigned-integer
    group:
      description: >
        The `(repository, branch)` group this row nests under. The group's
        view iterates its members through the reverse of this link.
      the: xyz.tonk.console.subscription/group
      cardinality: one
      as: entity
  maybe:
    hash:
      description: >
        The subscription's query hash — its identity within the branch,
        shown so a row can be correlated with a worker log line.
      the: xyz.tonk.console.subscription/hash
      cardinality: one
      as: text
    pending:
      description: >
        How many of those subscribers have not yet received their first
        snapshot. A row that sits with pending subscribers is one whose
        poll is not landing.
      the: xyz.tonk.console.subscription/pending
      cardinality: one
      as: unsigned-integer
    last-update:
      description: >
        When this subscription last pushed an update, ISO-8601. Optional by
        design: a query that has not changed since it opened has none, and
        that absence is the useful signal — a required field would instead
        make every never-updated row fail to resolve and vanish.
      the: xyz.tonk.console.subscription/last-update
      cardinality: one
      as: text

# One `(repository, branch)` pair, with the subscriptions live on it. The
# console renders these as the tree's top level, so a repository and branch
# are named once and their queries hang beneath — rather than every row
# repeating both.
concept!: &console/group
  description: A repository+branch the console groups subscriptions under.
  with:
    space:
      description: The repository this group covers.
      the: xyz.tonk.console.group/space
      cardinality: one
      as: text
    branch:
      description: The branch within it.
      the: xyz.tonk.console.group/branch
      cardinality: one
      as: text
    subscriptions:
      description: How many subscriptions are live on this branch.
      the: xyz.tonk.console.group/subscriptions
      cardinality: one
      as: unsigned-integer
    subscription:
      description: >
        The subscriptions in this group — one fact per member, so the view
        iterates them into nested tree items. Cardinality MANY, and
        explicitly so: an omitted cardinality defaults to `one`, which marks
        the field scalar and would render a single child instead of the list.
      the: xyz.tonk.console.group/subscription
      cardinality: many
      as: entity

# One update, as it is delivered.
#
# These facts are asserted and retracted in the SAME turn: the assert makes
# the subscription deliver them, the retract leaves the branch clean. They
# exist to be seen in transit, never stored — which is why no view renders
# them. A view draws the facts that exist now, and by the time it draws,
# there are none; the log is accumulated by the element below, which appends
# each row as it passes.
concept!: &console/update
  description: One update delivered to a subscription, in transit.
  with:
    subscription:
      description: >
        Hash of the subscription the update went to — how a feed line is
        matched to the row it belongs to.
      the: xyz.tonk.console.update/subscription
      cardinality: one
      as: text
    concept:
      description: The concept that subscription watches, for the label.
      the: xyz.tonk.console.update/concept
      cardinality: one
      as: text
    at:
      description: When it was pushed, ISO-8601.
      the: xyz.tonk.console.update/at
      cardinality: one
      as: text
    bytes:
      description: Size of the delta frame in bytes, untruncated.
      the: xyz.tonk.console.update/bytes
      cardinality: one
      as: unsigned-integer
    payload:
      description: >
        The delta itself, truncated — the data actually flushed to
        subscribers, which is the thing the console exists to show.
      the: xyz.tonk.console.update/payload
      cardinality: one
      as: text

# ---------------------------------------------------------------------------
# The route
# ---------------------------------------------------------------------------

# The route table concept, mirroring the declaration in `core.yaml` and
# `profile.yaml`. Re-declared rather than assumed because lowering runs
# `analyze_local` — no running system — so every name a document uses has to
# resolve within that document, whatever the target branch already carries.
# `route` is not one of the built-in concepts (`concept`, `command`, `event`,
# `view`, `rule`, …), so nothing supplies it for free.
#
# This is the one place the console pins `this:` rather than letting the
# anchor derive an entity, and the pin is load-bearing: an unpinned
# declaration is content-addressed to `concept:6kT88mB4…`, a DIFFERENT
# concept from the `tonk:route` the service worker's `match_route` reads the
# table through. The routes below would then lower into a table nothing
# routes against, and `/console` would 404 with every fact present and
# correct. Re-asserting the identical pinned declaration onto a branch that
# already carries it de-duplicates, which is what makes the install
# idempotent.
concept!: &route
  this: tonk:route
  description: A route — maps a path pattern to the model the SW mounts.
  with:
    path:
      description: The axum/matchit path pattern.
      the: xyz.tonk.route/path
      cardinality: one
      as: text
    concept:
      description: The route model to render when this path matches.
      the: xyz.tonk.route/concept
      cardinality: one
      as: entity

route!: &route/console
  path: "/console"
  concept: console/route

# The console page model. Same three site fields every profile route model
# picks up: the console renders the whole branch rather than one entity, so
# `repo`/`branch` are what it needs to address the endpoint its nested
# displays read from.
concept!: &console/route
  description: The /console page — a window onto this device's reactor.
  with:
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text
    repo:
      description: The repository location token, picked off the site entity.
      the: xyz.tonk.site/repo
      cardinality: one
      as: text
    branch:
      description: The branch, picked off the site entity.
      the: xyz.tonk.site/branch
      cardinality: one
      as: text

view!:
  this: console/route
  show:
    ui: |
      <div class="display-view-slot">
        <style>
          .console {
            padding: var(--wa-space-l);
            font-family: var(--wa-font-family-body);
            color: var(--wa-color-text-normal);
          }
          /* Plain heading. `<h1>` inherits a boxed/inverted treatment from
             the surrounding chrome otherwise, which reads as a button. */
          .console__head {
            margin: 0 0 var(--wa-space-2xs);
            padding: 0;
            background: none;
            font-size: var(--wa-font-size-l);
            font-weight: var(--wa-font-weight-semibold);
            color: var(--wa-color-text-normal);
          }
          .console__note {
            margin: 0 0 var(--wa-space-l);
            font-size: var(--wa-font-size-s);
            color: var(--wa-color-text-quiet);
          }
          .console__section {
            margin-bottom: var(--wa-space-l);
          }
          .feed__row {
            display: grid;
            grid-template-columns: auto auto auto 1fr;
            gap: var(--wa-space-xs);
            align-items: baseline;
            padding: 2px 0;
            font-size: var(--wa-font-size-xs);
            color: var(--wa-color-text-quiet);
            font-variant-numeric: tabular-nums;
          }
          .feed__concept {
            font-family: var(--wa-font-family-code);
            color: var(--wa-color-text-normal);
          }
          .feed__payload {
            margin: 0;
            font-family: var(--wa-font-family-code);
            font-size: var(--wa-font-size-2xs);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            max-height: 4lh;
            overflow-y: auto;
          }
          /* Nothing yet. The feed is a live tap, not a history: it shows
             what is delivered while the page is open, so an empty log is the
             normal state on a quiet system rather than a fault. */
          .feed:empty::after {
            content: "waiting for updates…";
            font-size: var(--wa-font-size-xs);
            color: var(--wa-color-text-quiet);
          }
          .console__label {
            margin: 0 0 var(--wa-space-xs);
            font-size: var(--wa-font-size-xs);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--wa-color-text-quiet);
          }
        </style>
        <tonk-title text="Console — Tonk"></tonk-title>
        <div class="console">
          <h1 class="console__head">Console</h1>
          <p class="console__note">
            Live state from this device's worker. Nothing here is stored or
            shared — it describes this browser only.
          </p>
          <!-- The live update feed: everything flushed to any subscription
               while this page is open.
               `with=` is REQUIRED, not decoration — a subscription with no
               routing context (no own `with`, no `with` ancestor) is refused
               outright by the host, which answers `error` instead of ever
               calling back. -->
          <section class="console__section">
            <p class="console__label">Updates</p>
            <console-update-log
              subscription="*"
              with="main@profile:tonk"
              limit="40"
            ></console-update-log>
          </section>
          <section class="console__section">
            <p class="console__label">Subscriptions</p>
            <!-- Loads every `component` on the branch (here, the update
                 feed's element) into this realm. Hidden: it defines
                 elements, it renders nothing. -->
            <tonk-display model="component" hidden></tonk-display>
            <tonk-display model="console/group"></tonk-display>
          </section>
        </div>
      </div>

# The grouping level: one collapsible `<wa-details>` per (repository,
# branch), with its subscriptions inside.
#
# `<wa-details>` rather than `<wa-tree>`, which was the obvious choice and
# does not work here. A tree assigns children through a SLOT, and slot
# assignment only ever sees an element's DIRECT children — but every nested
# view arrives wrapped in the `tonk-display`/`tonk-view` layers the renderer
# mounts it through, so the child `<wa-tree-item>`s land two levels too deep,
# are never assigned, and the group renders with no children and no expand
# toggle. `display: contents` cannot rescue that: it changes layout, not
# slotting. `<wa-details>` has a plain default slot that takes whatever it is
# given, wrappers included.
view!:
  this: console/group
  show:
    directory: |
      <div class="console-groups">
        <style>
          .console-groups > tonk-display,
          .console-groups > tonk-display > tonk-view {
            display: block;
          }
          .console-group {
            margin-bottom: var(--wa-space-xs);
            /* Pull the body in against its summary so the rows read as
               children of the group rather than as a detached block. */
            --spacing: var(--wa-space-xs);
          }
          /* The rows, indented under the summary with a rule down the left —
             the tree line the grouping is meant to convey. */
          .console-group__rows {
            margin-left: var(--wa-space-xs);
            padding-left: var(--wa-space-m);
            border-left: 1px solid var(--wa-color-surface-border);
          }
          .console-group__label {
            display: inline-flex;
            align-items: baseline;
            gap: var(--wa-space-xs);
          }
          .console-group__space {
            font-weight: var(--wa-font-weight-semibold);
          }
          .console-group__branch {
            font-family: var(--wa-font-family-code);
            font-size: var(--wa-font-size-xs);
            color: var(--wa-color-text-quiet);
          }
          /* The subscription rows inside a group: the display wrappers are
             pure rendering layers, so make them transparent and let each
             row be a block in the group's flow. */
          .console-group tonk-display,
          .console-group tonk-display > tonk-view {
            display: block;
          }
        </style>
        <wa-details class="console-group" open>
          <span slot="summary" class="console-group__label">
            <span class="console-group__space">{space}</span>
            <span class="console-group__branch">{branch}</span>
            <wa-badge variant="neutral">{subscriptions}</wa-badge>
          </span>
          <div class="console-group__rows">
            <tonk-display entity={subscription} model="console/subscription"></tonk-display>
          </div>
        </wa-details>
      </div>

# One subscription, as a network-panel row.
#
# Collapsed it is a single line: the concept name, how many updates it has
# pushed, and when the last one arrived — enough to scan a list and see what
# is busy. Expanded it reveals the query in notation and the log of updates
# actually delivered.
#
# `<wa-details>` again rather than a tree item, for the same slotting reason
# the group uses it: the nested update rows arrive wrapped in
# `tonk-display`/`tonk-view` layers, which a slot-assigning component would
# not see.
view!:
  this: console/subscription
  show:
    ui: |
      <wa-details class="sub" appearance="plain">
        <style>
          .sub {
            --spacing: var(--wa-space-xs);
            border-bottom: 1px solid var(--wa-color-surface-border);
          }
          .sub__summary {
            display: flex;
            align-items: baseline;
            gap: var(--wa-space-xs);
            width: 100%;
            font-size: var(--wa-font-size-s);
          }
          .sub__concept {
            font-family: var(--wa-font-family-code);
            font-weight: var(--wa-font-weight-semibold);
          }
          /* Counts and timings sit right, like a network panel's size and
             time columns, so the concept names stay scannable down the
             left edge. */
          .sub__stats {
            display: flex;
            align-items: baseline;
            gap: var(--wa-space-s);
            margin-left: auto;
            color: var(--wa-color-text-quiet);
            font-size: var(--wa-font-size-xs);
            font-variant-numeric: tabular-nums;
          }
          .sub__body {
            padding-top: var(--wa-space-2xs);
          }
          /* The notation render. styles.css styles `tonk-notation
             .tonk-cm-*` on the element itself, so the tokens pick up the
             same palette as the editor with no wrapper class needed. */
          .sub__query {
            min-width: 0;
            overflow-x: auto;
          }
          .sub__query .tonk-notation-pre {
            margin: 0;
            font-size: var(--wa-font-size-xs);
          }
          .sub__log-label {
            margin: var(--wa-space-xs) 0 var(--wa-space-3xs);
            font-size: var(--wa-font-size-2xs);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--wa-color-text-quiet);
          }
          .sub__hash {
            font-family: var(--wa-font-family-code);
            opacity: 0.6;
          }
          .feed__row {
            display: grid;
            grid-template-columns: auto auto 1fr;
            gap: var(--wa-space-xs);
            align-items: baseline;
            padding: 2px 0;
            font-size: var(--wa-font-size-xs);
            color: var(--wa-color-text-quiet);
            font-variant-numeric: tabular-nums;
          }
          .feed__payload {
            margin: 0;
            font-family: var(--wa-font-family-code);
            font-size: var(--wa-font-size-2xs);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            max-height: 8lh;
            overflow-y: auto;
          }
          /* Nothing has arrived yet. The feed only shows updates delivered
             WHILE the page is open — it is a live tap, not a history — so an
             empty log is the normal state for a quiet subscription rather
             than a fault. */
          .feed:empty::after {
            content: "waiting for updates…";
            font-size: var(--wa-font-size-xs);
            color: var(--wa-color-text-quiet);
          }
        </style>
        <span slot="summary" class="sub__summary">
          <span class="sub__concept">{concept-name}</span>
          <span class="sub__stats">
            <span title="subscribers">&#9679; {subscribers}</span>
            <span title="updates pushed">&#8635; {updates}</span>
            <span title="total bytes pushed">{bytes-pushed} B</span>
            <!-- A subscription whose query has never changed carries no
                 `last-update` fact, so this simply does not render for it —
                 which reads as "nothing yet", the thing worth knowing. -->
            <wa-relative-time date={last-update} sync></wa-relative-time>
          </span>
        </span>
        <div class="sub__body">
          <!-- `text=` rather than a `<script type="text/tonk-notation">`
               child: the template scanner treats `<script>` and `<style>`
               bodies as raw text and skips them, so a `{query}` written
               inside one renders literally instead of interpolating. The
               attribute is substituted normally. -->
          <div class="sub__query">
            <tonk-notation text={query}></tonk-notation>
          </div>
          <p class="sub__log-label">
            Updates
            <span class="sub__hash">{hash}</span>
          </p>

        </div>
      </wa-details>

# The update feed: a web component, defined here as branch data.
#
# It has to be a component rather than a view. A view renders the facts that
# exist NOW, so a streamed update — published and immediately gone — would
# make a row appear and vanish rather than build a log. Accumulating across
# events is exactly what a template cannot do and an element can.
#
# It is nonetheless authored HERE, in the library, not as a Rust crate:
# `<tonk-component>` executes this module once per realm, so the console
# defines its own element without a new crate or a shell change.
#
# The feed rides a BroadcastChannel, so nothing is stored anywhere — not in
# the worker, not on the branch. Close the page and the log is gone, which is
# the honest lifetime for "what is flowing right now".
# The `component` concept, mirroring `core.yaml`'s declaration. Re-declared
# for the same reason as `route` above: lowering runs `analyze_local`, with no
# running system, so every name a document uses has to resolve within that
# document — and `component` is not one of the built-in concepts.
#
# Unpinned, unlike `route`: the console mounts these through
# `<tonk-display model=component>`, which resolves the model by NAME on the
# branch, so the content-derived entity is the right identity and no `this:`
# is needed to make the two sides agree.
concept!: &component
  description: A JS module defining web components for the branch's views
  with:
    module:
      description: |
        JS module source. Runs once per realm; guard definitions with
        `customElements.get(name) ||` since a name can't be redefined
        (replacing a component takes effect on the next page load).
      the: xyz.tonk.component/module
      cardinality: one
      as: text

# The bridge from the `component` concept to the `<tonk-component>` loader,
# mirroring `core.yaml`. Needed here for the same reason the concept is: this
# document is evaluated onto the PROFILE branch, which carries `profile.yaml`
# rather than the full standard library, so neither the concept nor its view
# is already present. Without the view the loader display resolves the model,
# finds no view, and renders the default-view notice instead of mounting the
# component — the module never executes and the feed element is never
# defined.
view!:
  this: component
  show:
    ui: |
      <tonk-component module={module} />

# The DIRECTORY facet is the one that matters here: the loader mounts as
# `<tonk-display model=component>` with no entity, and a model-only display
# resolves `directory`, not `ui`. Declaring only `ui` left it in
# `default-view` — the model resolved, no view matched, and the module never
# executed.
view!:
  this: component
  show:
    directory: |
      <div class="component-loader" hidden>
        <tonk-component subject={this} module={module}></tonk-component>
      </div>

component!: &console/feed-component
  module: |
    // The update feed. Accumulates rows the branch does not keep.
    //
    // The worker holds ONE update at a time: each is published onto a single
    // entity with cardinality-one fields, so the next supersedes it. A view
    // over that would only ever show the latest line. But a subscription
    // delivers each supersede as a delta, so an element watching the stream
    // sees every update as it passes and can keep as many as it likes. The
    // log lives here, in this element's DOM, and nowhere else.
    customElements.get("console-update-log") ||
      customElements.define(
        "console-update-log",
        class extends HTMLElement {
          connectedCallback() {
            // Scopes this instance to one subscription: every row mounts a
            // log, and the feed carries every subscription's updates.
            this.subscription = this.getAttribute("subscription") || "";
            this.limit = Number(this.getAttribute("limit") || 25);
            if (!this.list) {
              this.list = document.createElement("div");
              this.list.className = "feed";
            }
            // Keep the accumulated log across re-attachment: the row's view
            // re-renders and this element is moved rather than replaced, and
            // rebuilding the list would drop every line already collected.
            if (!this.contains(this.list)) this.replaceChildren(this.list);

            // Subscribe on a microtask, not inline.
            //
            // A custom element's `connectedCallback` can run while the
            // element is being placed by a render pass — and can even be
            // delivered after it has been detached again (the reaction-queue
            // hazard). Subscribing from there raced the render: the host
            // wired the subscription to an element the pass then replaced,
            // and the surviving element in the DOM was never subscribed at
            // all. Deferring lets the pass settle, and the guard drops the
            // callback if this element lost.
            Promise.resolve().then(() => {
              if (!this.isConnected || this.handle) return;
              this.subscribe();
            });
          }

          disconnectedCallback() {
            // Cancels upstream; without it a row that scrolled out of the
            // DOM keeps a live subscription open for the page's lifetime.
            if (this.handle && this.handle.cancel) this.handle.cancel();
            this.handle = null;
          }

          subscribe() {
            // The host claims this event and wires the subscription, calling
            // back through the `reset` / `update` methods below. Same
            // machinery every `<tonk-display>` uses — which is the point: it
            // already crosses the sealed guest's opaque-origin boundary,
            // where a BroadcastChannel cannot.
            const detail = {
              query: {
                terms: {
                  this: { "?": { name: "this" } },
                  subscription: { "?": { name: "subscription" } },
                  concept: { "?": { name: "concept" } },
                  at: { "?": { name: "at" } },
                  bytes: { "?": { name: "bytes" } },
                  payload: { "?": { name: "payload" } },
                },
                predicate: {
                  with: {
                    subscription: {
                      the: "xyz.tonk.console.update/subscription",
                      as: "Text",
                      cardinality: "one",
                    },
                    concept: {
                      the: "xyz.tonk.console.update/concept",
                      as: "Text",
                      cardinality: "one",
                    },
                    at: {
                      the: "xyz.tonk.console.update/at",
                      as: "Text",
                      cardinality: "one",
                    },
                    bytes: {
                      the: "xyz.tonk.console.update/bytes",
                      as: "UnsignedInteger",
                      cardinality: "one",
                    },
                    payload: {
                      the: "xyz.tonk.console.update/payload",
                      as: "Text",
                      cardinality: "one",
                    },
                  },
                },
              },
              tag: "console-updates",
            };
            this.dispatchEvent(
              new CustomEvent("tonk-subscribe", {
                detail,
                bubbles: true,
                composed: true,
                // REQUIRED. The host claims the event by calling
                // `preventDefault()`, which is a no-op on a non-cancelable
                // event — so without this the subscription is silently never
                // registered and the element waits forever for a frame that
                // is never sent.
                cancelable: true,
              }),
            );
            this.handle = detail.subscription || null;
          }

          // The host calls this when a subscription cannot be opened —
          // notably when there is no routing context. Rendered rather than
          // swallowed: a silent feed is indistinguishable from a quiet one.
          error(detail) {
            const line = document.createElement("div");
            line.className = "feed__row feed__row--error";
            line.textContent = `feed unavailable: ${
              (detail && detail.message) || "unknown error"
            }`;
            this.list.replaceChildren(line);
          }

          // The host calls these. `reset` is the initial snapshot (normally
          // empty — nothing is stored), `update` is each delta.
          reset(conclusions) {
            (conclusions || []).forEach((row) => this.record(row));
          }

          update(delta) {
            // Only `asserted`: a supersede reports the OLD row as retracted
            // and the new one as asserted, so appending on both would double
            // every line.
            ((delta && delta.asserted) || []).forEach((row) => this.record(row));
          }

          record(row) {
            // A conclusion is `{this, fields: {...}}` — the values live
            // under `fields`, not on the row itself.
            const f = (row && row.fields) || {};
            const at = f.at;
            if (!at) return;
            // No per-row filter. The worker holds ONE update slot, carrying
            // whichever subscription most recently delivered — so a feed
            // scoped to a single row would match almost nothing. This is the
            // whole system's traffic, each line labelled with the concept it
            // belongs to, which is what a network panel shows anyway.
            if (this.subscription && this.subscription !== "*"
                && f.subscription !== this.subscription) return;
            // The same fact is re-asserted per update on one entity, so a
            // repeated frame would duplicate the line. The timestamp is what
            // distinguishes one update from the next.
            if (at === this.lastAt) return;
            this.lastAt = at;

            const line = document.createElement("div");
            line.className = "feed__row";

            const time = document.createElement("span");
            time.className = "feed__time";
            time.textContent = new Date(at).toLocaleTimeString();

            const who = document.createElement("span");
            who.className = "feed__concept";
            who.textContent = f.concept || "";

            const size = document.createElement("span");
            size.className = "feed__size";
            size.textContent = `${f.bytes ?? 0} B`;

            const body = document.createElement("pre");
            body.className = "feed__payload";
            // textContent, never innerHTML: this is database content being
            // rendered into the tool that inspects it, and it is not the
            // console's place to let stored data inject markup.
            body.textContent = f.payload || "";

            line.append(time, who, size, body);
            this.list.prepend(line);

            // Bounded: a tab left open on a busy branch would otherwise grow
            // this list without limit. The cap is what keeps "no retention"
            // true of the page as well as the worker.
            while (this.list.children.length > this.limit) {
              this.list.lastElementChild.remove();
            }
          }
        },
      );
