# ===========================================================================
# code-editor — a CodeMirror editor, <code-editor>, as branch data.
# ===========================================================================
# <code-editor> is defined below with `element!:`, so installing this
# component gives a space a code editor with nothing from the host: no
# bundle, no fetch. <prose-editor> embeds it in its code blocks.
#
# Languages are records, not part of the element. A `code-editor/language`
# names the words a block may use for it (`python`, `py`) and carries its
# pack as source. The editor ships two, YAML and Dialog YAML, below; every
# other language is a component of its own, `language/<id>`, installed
# from the palette like this one. A block asks the space for the record of
# the language it names, and only that pack is evaluated; a block in a
# language the space lacks is plain text until one is installed, and then
# it redraws. A language nobody here has heard of is installed the same
# way, as a record anyone can assert: the element has no list of them.
# ===========================================================================

# ---------------------------------------------------------------------------
# Element — <tonk-code> ported to an `element!`.
#
# The methods in `code-editor/` are its custom-element class, and `core` is
# its CodeMirror core (`rust/tonk-code/src-js/editor.ts`, through
# `library.ts`), built by `rust/tonk-code/scripts/build.mjs` into an
# expression returning `createEditor`, the stylesheet, the modules packs
# share and `loadPack`. Rebuild after changing `rust/tonk-code/src-js`:
# `npm run build` there, which also regenerates the languages below and
# every `language/<id>` component.
#
# Not `tonk-code`: the host owns that name, so a page can have both.
#
# Attributes: value, language, readonly, placeholder, line-numbers,
# active-line, auto-focus, source, language-server. Properties: `value`,
# `view` (the CodeMirror `EditorView`, null until mounted), `errorCount`.
# Methods: `connect(client)`, `disconnect()`. Events: `change` and `run`
# with `{value, doc}`, `ready` with `{view}`, `diagnostics` with `{value,
# doc, count, errorCount}`, `code-editor-connect` with `{source, language,
# url}` and `code-editor-disconnect` with `{source}`.
#
# The language server. An editor with a `source` (the document's URI, as
# `tonk-buffer:///<repo>/<branch>/<name>`) opens it on the language server
# at `language-server` (`/api/language-server` by default), and every
# frame the server sends for it arrives as a `diagnostics` event: the
# verdict on the text as typed, which a host waits for before running it.
# It announces itself with `code-editor-connect` first; an ancestor that
# claims the event (`preventDefault`) supplies the client by calling
# `connect`, and otherwise the core's own session does. A client must come
# from this core (`LSPClient` among its exports): one built on another
# CodeMirror, such as the host's <tonk-diagnostics-provider> hands to
# <tonk-code>, is refused, which is why the events are not
# <tonk-code>'s `tonk-code-connect`.
# ---------------------------------------------------------------------------

element!: &code-editor
  description: A CodeMirror code editor; `language` names a `code-editor/language` the space has, `change` carries each edit, and a `source` puts the document on the language server, whose verdicts arrive as `diagnostics`.
  method:
    connected: !include/text ./code-editor/connected.js
    disconnected: !include/text ./code-editor/disconnected.js
    attribute-changed: !include/text ./code-editor/attribute-changed.js
    mount: !include/text ./code-editor/mount.js
    language: !include/text ./code-editor/language.js
    resolve: !include/text ./code-editor/resolve.js
    request: !include/text ./code-editor/request.js
    query: !include/text ./code-editor/query.js
    watch: !include/text ./code-editor/watch.js
    unwatch: !include/text ./code-editor/unwatch.js
    emit: !include/text ./code-editor/emit.js
    announce: !include/text ./code-editor/announce.js
    withdraw: !include/text ./code-editor/withdraw.js
    connect: !include/text ./code-editor/connect.js
    disconnect: !include/text ./code-editor/disconnect.js
    core: !include/text ./code-editor/core.js
  getter:
    # The document; before the editor mounts, the `value` attribute it
    # mounts from.
    value: |
      (self) => self.__code?.editor?.view.state.doc.toString() ?? self.getAttribute('value') ?? ''
    # The live CodeMirror view, once mounted.
    view: |
      (self) => self.__code?.editor?.view ?? null
    # Errors in the language server's latest frame; 0 before one lands.
    error-count: |
      (self) => self.__code?.errors ?? 0
  setter:
    # Patches only the span that differs, so the caret stays put, and
    # fires no `change`. Before the mount, a write goes to the attribute.
    value: |
      (self, next) => {
        const text = String(next ?? '');
        const editor = self.__code?.editor;
        if (editor) editor.setValue(text);
        else if (self.getAttribute('value') !== text) self.setAttribute('value', text);
      }

# ---------------------------------------------------------------------------
# Languages — the concept every language is a record of, the two the
# editor ships, and the palette's list of the rest. Generated by
# `rust/tonk-code/scripts/build.mjs`; edit the build, not this region.
# ---------------------------------------------------------------------------

# BEGIN GENERATED: languages
concept!: &code-editor/language
  description: |
    A language <code-editor> highlights. A block names it by any of its
    words; `source` is its pack, the text of `(shared) => LanguageSupport`
    evaluated against the editor's own CodeMirror modules.
  with:
    name:
      description: The language's name, for people.
      the: xyz.tonk.code-editor.language/name
      as: text
    word:
      description: A word a block names the language by, lower-cased.
      the: xyz.tonk.code-editor.language/word
      as: text
      pick: :all
    source:
      description: The pack, as JavaScript source.
      the: xyz.tonk.code-editor.language/source
      as: text

# One more word for a language, on its own: words accumulate, one
# assertion each.
concept!: &code-editor/language/word
  description: A word a block names a <code-editor> language by.
  with:
    word:
      description: A word a block names the language by, lower-cased.
      the: xyz.tonk.code-editor.language/word
      as: text
      pick: :all

