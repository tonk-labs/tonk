# ===========================================================================
# table — a <tonk-table> spreadsheet whose workbook is ONE automerge document.
# ===========================================================================
# The workbook lives in a memory cell named after the `tonk:table` entity
# (see document.yaml); the branch holds only a pointer, `document/heads`.
# `<tonk-table subject={this} document>` is all a view needs: no command
# bindings and no hidden data rows. Cell edits from several people merge —
# two people who fill one empty cell write the same key, so there is one
# cell and the other value is kept as a visible conflict — and editing
# writes nothing into the body of branch history.
#
# Cells stay readable as facts. The host mirrors the workbook, at this
# branch's heads, into the session overlay as `table/sheet` and
# `table/cell` facts: `tonk query table/cell` lists them and views and
# rules can read them. The mirror is READ-ONLY — asserting a `table/cell`
# fact does not edit the workbook. Agents write with the `document/put`
# and `document/remove` commands:
#
#   document/put!:
#     document: id:table/book
#     path: "sheets/<sheet>/cells/B2"
#     value: "=A1*2"
#
# Only the raw INPUT is stored ("=B2*C2", "3.5"); computed values are
# derived — every replica's IronCalc engine recomputes them.
#
# The same concepts also describe a workbook written when cells were
# individual claims, and the seed below. The first open converts those
# claims into the document and retracts them, the same way on every
# replica.
# ===========================================================================

# ---------------------------------------------------------------------------
# Attributes
# ---------------------------------------------------------------------------

attribute!: &sheet/table
  description: The workbook a sheet belongs to.
  the: xyz.tonk.table.sheet/table
  as: entity

attribute!: &sheet/name
  description: The sheet's display name.
  the: xyz.tonk.table.sheet/name
  as: text

attribute!: &sheet/order
  description: Lexicographic key ordering sheets in the tab strip.
  the: xyz.tonk.table.sheet/order
  as: text

attribute!: &cell/sheet
  description: The sheet a cell belongs to.
  the: xyz.tonk.table.cell/sheet
  as: entity

attribute!: &cell/at
  description: The cell's A1-style address ("B2").
  the: xyz.tonk.table.cell/at
  as: text

attribute!: &cell/content
  description: |
    The cell's raw user input — a formula ("=B2*C2") or a literal
    ("3.5", "Widget"). Never the computed value: values are derived by
    the engine on every replica.
  the: xyz.tonk.table.cell/content
  as: text

attribute!: &cell/style
  description: Optional style JSON (font/fill/format), absent when plain.
  the: xyz.tonk.table.cell/style
  as: text

attribute!: &column/sheet
  description: The sheet a sized column belongs to.
  the: xyz.tonk.table.column/sheet
  as: entity

attribute!: &column/at
  description: The column's letters ("B").
  the: xyz.tonk.table.column/at
  as: text

attribute!: &column/width
  description: The column's width in px, as decimal text.
  the: xyz.tonk.table.column/width
  as: text

attribute!: &row/sheet
  description: The sheet a sized row belongs to.
  the: xyz.tonk.table.row/sheet
  as: entity

attribute!: &row/at
  description: The row's 1-based number, as text ("2").
  the: xyz.tonk.table.row/at
  as: text

attribute!: &row/height
  description: The row's height in px, as decimal text.
  the: xyz.tonk.table.row/height
  as: text

# ---------------------------------------------------------------------------
# Concepts
# ---------------------------------------------------------------------------

concept!: &table
  this: tonk:table
  description: A spreadsheet workbook edited with <tonk-table>; its body is an automerge document.
  with:
    name:
      description: The workbook's display name.
      the: xyz.tonk.table/name
      as: text
    format:
      description: |
        The document format, "automerge/table@1". The same attribute
        document.yaml declares: its presence is what makes this entity a
        document.
      the: xyz.tonk.document/format
      as: text

# The read shapes. In a converted workbook these are MIRROR facts, in the
# session overlay; in a seed or a claims-era workbook they are durable
# claims awaiting conversion.
concept!: &table/sheet
  this: tonk:table/sheet
  description: One sheet of a table workbook.
  with:
    table: sheet/table
    name: sheet/name
    order: sheet/order

concept!: &table/cell
  this: tonk:table/cell
  description: One non-empty cell of a sheet.
  with:
    sheet: cell/sheet
    at: cell/at
    content: cell/content
  maybe:
    style: cell/style

# Claims-era sizing, read by the conversion only.
concept!: &table/column
  this: tonk:table/column
  description: An explicitly-sized column of a claims-era sheet.
  with:
    sheet: column/sheet
    at: column/at
    width: column/width

concept!: &table/row
  this: tonk:table/row
  description: An explicitly-sized row of a claims-era sheet.
  with:
    sheet: row/sheet
    at: row/at
    height: row/height

# ---------------------------------------------------------------------------
# Views — the live grid. `subject={this}` names the workbook and `document`
# selects the element's document mode: it asks the host for this entity's
# workbook at this branch's heads and sends its edits back as path writes.
# ---------------------------------------------------------------------------

view!:
  this: table
  show:
    ui: |
      <tonk-table subject={this} document></tonk-table>

# A directory view so `tonk render table` (list of workbooks) resolves.
view!:
  this: table
  show:
    directory: |
      <div class="table-directory">
        <tonk-display entity={this} model={dom.host/model}></tonk-display>
      </div>

# ---------------------------------------------------------------------------
# Starter content: one workbook, one sheet, and the demo cells, seeded as
# claims. The first open converts them into the workbook document and
# retracts them; from then on `tonk query table/cell` reads the mirror.
# Only raw input is seeded; D-column values compute on load.
# ---------------------------------------------------------------------------

table!:
  this: id:table/book
  name: "Demo"
  format: "automerge/table@1"

table/sheet!:
  this: id:table/book/sheet1
  table: id:table/book
  name: "Sheet1"
  order: "m"

table/cell!:
  this: id:table/book/s1!A1
  sheet: id:table/book/sheet1
  at: "A1"
  content: "Item"
---
