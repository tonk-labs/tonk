# Sample data for developing the viewer, modelled on the "Trip to
# Pistoia" itinerary sheet in the wireframe. Three concepts:
#
#   - `trip-title` {title}     - a trip's title, on its own.
#   - `stop`       {day,...}     - one sheet row.
#   - `trip`       {title,stop} - the unified concept the view uses.
#
# The trip entity carries its title (via `trip-title`) and its stops
# (via `trip`), each asserted independently against the same entity:
# the title once, then one `trip!` per stop. No field is ever
# repeated. None of this is part of the standard library; remove the
# whole section once the viewer has real content.

concept!: &trip-title
  description: A trip's title, on its own.
  with:
    title:
      description: Trip title, shown above the sheet
      the: xyz.tonk.trip/title
      cardinality: one
      as: text

concept!: &trip
  description: A trip - a title and an ordered set of stops.
  with:
    title:
      description: Trip title, shown above the sheet
      the: xyz.tonk.trip/title
      cardinality: one
      as: text
    stop:
      description: The stops that make up this trip
      the: xyz.tonk.trip/stop
      cardinality: many
      as: entity

concept!: &stop
  description: One row of a trip sheet - a day, an item, a time, a cost.
  with:
    day:
      description: Day label (e.g. "mon")
      the: xyz.tonk.stop/day
      cardinality: one
      as: text
    item:
      description: What happens at this stop
      the: xyz.tonk.stop/item
      cardinality: one
      as: text
    time:
      description: Time of day (e.g. "10:00")
      the: xyz.tonk.stop/time
      cardinality: one
      as: text
    cost:
      description: Cost label (e.g. "EUR 15")
      the: xyz.tonk.stop/cost
      cardinality: one
      as: text

# The trip view: a sheet with a header row, then one nested
# `<tonk-display>` per stop. The nested display omits `view`, so it
# resolves the built-in view for `model=stop` (the stop-row view
# below). A cardinality-many `{stop}` binding repeats the element
# per value.
view!:
  this: id:tonk-workspace/trip-view
  model: trip
  display: |
    <div class="sheet">
      <style>
        /* Theme-neutral: inherit the page's text color and use
           translucent rules/secondary text so the sheet reads in
           both the light and dark shells. No hardcoded palette. */
        .sheet {
          display: flex;
          flex-direction: column;
          padding: 16px 20px;
          color: inherit;
          font-family: inherit;
          font-size: 13.5px;
        }
        .sheet__head,
        .sheet__row {
          display: grid;
          grid-template-columns: 60px 1fr 90px 90px;
          gap: 12px;
          padding: 8px 0;
          border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent);
        }
        .sheet__head {
          font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
          font-size: 11px;
          text-transform: lowercase;
          letter-spacing: 0.04em;
          opacity: 0.55;
          font-weight: 600;
          border-bottom: 1.5px solid color-mix(in srgb, currentColor 55%, transparent);
        }
        /* Each stop is wrapped in its own <tonk-display>; collapse the
           wrapper so the rows lay out as direct children of the sheet. */
        .sheet > tonk-display { display: contents; }
        .sheet__row span:nth-child(1) {
          font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
          opacity: 0.55;
        }
        .sheet__head span:nth-child(4),
        .sheet__row span:nth-child(4),
        .sheet__total span:last-child { text-align: right; }
        /* A summary footer row, matching the wireframe's "total" line. */
        .sheet__total {
          display: grid;
          grid-template-columns: 60px 1fr 90px 90px;
          gap: 12px;
          padding: 10px 0 0;
          font-weight: 600;
        }
        .sheet__total span:first-child {
          grid-column: 1 / 3;
          opacity: 0.55;
        }
      </style>
      <div class="sheet__head">
        <span>day</span><span>item</span><span>time</span><span>cost</span>
      </div>
      <tonk-display entity={stop} model=stop></tonk-display>
      <div class="sheet__total">
        <span>total</span><span></span><span>-</span>
      </div>
    </div>

# The stop-row view, published under the built-in `view` concept
# (no `this:` pin needed) so the nested `<tonk-display model=stop>`
# resolves it by model.
view!:
  model: stop
  display: |
    <div class="sheet__row">
      <span>{day}</span><span>{item}</span><span>{time}</span><span>{cost}</span>
    </div>

