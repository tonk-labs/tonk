# Tonk standard library.
#
# The built-in concepts, views, commands, and rules the runtime
# seeds into a repository at creation. Served as a static asset
# (`/library/core.yaml`) and fetched + lowered by the service
# worker in the repository-creation path, rather than embedded at
# compile time. Editing this file changes the standard library
# without rebuilding the wasm.
#
# Lowering runs `analyze_local` (no running system), so every
# `&anchor` / bare-name reference must resolve within this file.
#
# Two source sections, formerly `tonk-workspace/bootstrap.yaml` and
# `tonk-board/bootstrap.yaml`. The `view` concept is shared between
# them (pinned to `tonk:view`) and declared once here.

# ============================================================
# VIEW
# ============================================================

# The `view` concept. Shape matches what `<tonk-display>` queries
# (resolve.rs `view_predicate`): a `model` (the concept it renders)
# and a `display` (the HTML template). Pinned to the stable
# `tonk:view` URI so <tonk-display> can refer to the built-in view
# concept directly, without a name-resolution round-trip.
concept!: &view
  this: tonk:view
  description: A display template (model, display) for rendering an entity
  with:
    model:
      description: Concept this view renders
      the: xyz.tonk.view/model
      cardinality: one
      as: entity
    display:
      description: HTML template for the view
      the: xyz.tonk.view/display
      cardinality: one
      as: text

concept!: &view/directory
  this: tonk:view/directory
  description: A directory view used by tonk-display when entity is not set.
  with:
    model:
      description: Concept this view renders
      the: xyz.tonk.view/model
      cardinality: one
      as: entity
    display:
      description: HTML template for the view
      the: xyz.tonk.view/directory
      cardinality: one
      as: text

# The default directory view: `model: _:_` matches any model with no
# specific `view/directory`. <tonk-display> with no `entity` resolves a
# directory view for the model first; finding none, it falls back to
# this. It renders the model's instances in a <wa-carousel>, one slide
# per instance, each a nested single-entity <tonk-display> (which then
# resolves its own view, or this default's detail counterpart). The
# nested `model` is threaded from the host via `{dom.host/model}`,
# since an instance carries no pointer to its own model.
view/directory!:
  this: id:tonk:view/directory/default
  model: _:_
  display: |
    <wa-carousel navigation>
      <wa-carousel-item subject={this}>
        <tonk-display entity={this} model={dom.host/model} />
      </wa-carousel-item>
    </wa-carousel>

# ============================================================
# WORKSPACE
# ============================================================

# The `artifact` concept. Binds an entity to a model and a view,
# plus the tab metadata (title, icon) the viewer shell shows. Its
# (entity, model, view) map one-to-one onto
# `<tonk-display entity model view>`. Pinned to `tonk:artifact` so
# the viewer can query artifacts by a stable concept entity.
concept!: &artifact
  this: tonk:artifact
  description: An entity displayed as a sheet/tab in the viewer.
  with:
    title:
      description: Title shown in the tab
      the: xyz.tonk.artifact/title
      cardinality: one
      as: text
    subtitle:
      description: Dimmed metadata line shown after the name in the card header
      the: xyz.tonk.artifact/subtitle
      cardinality: one
      as: text
    icon:
      description: Icon shown in the tab
      the: xyz.tonk.artifact/icon
      cardinality: one
      as: text
    entity:
      description: Entity displayed in the sheet
      the: xyz.tonk.artifact/entity
      cardinality: one
      as: entity
    model:
      description: Model concept used to display the entity
      the: xyz.tonk.artifact/model
      cardinality: one
      as: entity
    view:
      description: View concept used to display the entity
      the: xyz.tonk.artifact/view
      cardinality: one
      as: entity

# The `workspace` concept: the UI surface below the header. It owns
# its sheets (cardinality-many). Pinned to `tonk:workspace` so the
# shell can query a workspace by a stable concept entity.
concept!: &workspace
  this: tonk:workspace
  description: A workspace surface - a named set of sheets shown as tabs.
  with:
    name:
      description: Workspace name, shown in the header
      the: xyz.tonk.workspace/name
      cardinality: one
      as: text
    sheet:
      description: The sheets (tabs) in this workspace
      the: xyz.tonk.workspace/sheet
      cardinality: many
      as: entity
    active:
      description: |
        The currently selected sheet, shown in the canvas. Cardinality
        one, so re-asserting it replaces the previous selection - a
        single moving pointer driven by the `activate-sheet` command.
      the: xyz.tonk.workspace/active
      cardinality: one
      as: entity

# The `sheet` concept: one tab in a workspace. A sheet is an
# artifact (same title/icon/entity/model/view fields, same attribute
# URIs) plus an `order` lexicographic key that positions the tab. So
# every sheet is also a valid artifact; the extra `order` field is
# what makes it a workspace member.
concept!: &workspace/sheet
  this: tonk:sheet
  description: A workspace tab - an artifact plus a lexicographic order key.
  with:
    title:
      description: Title shown in the tab
      the: xyz.tonk.artifact/title
      cardinality: one
      as: text
    subtitle:
      description: Dimmed metadata line shown after the name in the card header
      the: xyz.tonk.artifact/subtitle
      cardinality: one
      as: text
    icon:
      description: Icon shown in the tab
      the: xyz.tonk.artifact/icon
      cardinality: one
      as: text
    entity:
      description: Entity displayed in the sheet
      the: xyz.tonk.artifact/entity
      cardinality: one
      as: entity
    model:
      description: Model concept used to display the entity
      the: xyz.tonk.artifact/model
      cardinality: one
      as: entity
    view:
      description: View concept used to display the entity
      the: xyz.tonk.artifact/view
      cardinality: one
      as: entity
    order:
      description: Lexicographic order key positioning the tab
      the: xyz.tonk.sheet/order
      cardinality: one
      as: text

# Tab selection. Clicking a tab fires the transient `activate-sheet`
# command, reading which sheet was clicked from the bound element's
# `data-sheet`. The inductive rule below finds the workspace that owns
# that sheet and points its cardinality-one `active` field at the
# clicked sheet (replacing the prior selection). The command itself is
# swept after the cycle - only the `active` pointer persists.
command!: &workspace/activate-sheet
  description: A request to make `sheet` the active sheet of its workspace.
  with:
    sheet:
      description: The sheet to activate, from the binder's `activate` event detail
      the: dom.event.detail/sheet
      as: entity

# A minimal projection of the workspace's `active` pointer: the
# workspace entity (`this`) and its `active` sheet, on the same
# `xyz.tonk.workspace/active` attribute the `workspace` concept reads.
# The rule asserts THIS (binding only `this` + `active`), rather than
# re-asserting the whole `workspace` concept (which would force
# binding every field). Writing `active` here updates the same triple
# the workspace view sees.
concept!: &workspace/active-sheet
  description: The active-sheet pointer of a workspace, as a standalone fact.
  with:
    active:
      description: The selected sheet
      the: xyz.tonk.workspace/active
      cardinality: one
      as: entity

# The inductive rule: when an `activate-sheet` command fires, find the
# workspace that owns the clicked sheet and point its `active` field at
# that sheet. Binding `?this` through the `workspace` membership means
# the command needs only the sheet - no workspace id plumbed through
# the DOM. The command is transient (satisfies the install-time
# trigger gate, swept after commit); only the `active` pointer
# persists.
rule!:
  assert!: workspace/active-sheet
  when:
    - assert: workspace/activate-sheet
      where: { sheet: ?active }
    - assert: workspace
      where: { this: ?this, sheet: ?active }

# The workspace view: a top bar over a `<tonk-sheet-binder>`, matching
# the wireframe's Layout F. The binder takes the workspace's `{sheet}`
# members (each mounted through its sheet-mount view as a
# `<tonk-sheet>`), projects the bottom tab strip from them, and shows
# the `active` sheet's panel. Clicking a tab fires `activate-sheet`,
# which re-points `active`.
view!: &workspace/view
  this: id:tonk-workspace/workspace-view
  model: workspace
  display: |
    <div class="workspace">
      <style>
        /* Styling uses the app's Web Awesome design tokens (--wa-*)
           rather than hardcoded colours, so the viewer follows the
           active theme and light/dark automatically. */
        .workspace {
          display: flex;
          flex-direction: column;
          height: 100%;
          font-family: var(--wa-font-family-body);
          color: var(--wa-color-text-normal);
          /* Transparent so the page's dot-grid paper shows through
             (matching the wireframe). */
          background: transparent;
        }

        /* Top bar: repo name + sync status on the left, icon slots on
           the right. Placeholder chrome for now. */
        .workspace__topbar {
          display: flex;
          align-items: center;
          gap: var(--wa-space-m);
          flex: none;
          height: 52px;
          padding: 0 var(--wa-space-l);
          /* A surface fill so the bar reads as chrome over the
             transparent dot-grid canvas. */
          background: var(--wa-color-surface-raised);
          border-bottom: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          font-size: var(--wa-font-size-m);
        }
        .workspace__brand { font-weight: var(--wa-font-weight-bold); }
        .workspace__crumb {
          color: var(--wa-color-text-quiet);
          font-family: var(--wa-font-family-code);
          font-size: var(--wa-font-size-s);
        }
        .workspace__title { font-weight: var(--wa-font-weight-semibold); }
        .workspace__sync {
          display: inline-flex;
          align-items: center;
          gap: var(--wa-space-xs);
          padding: var(--wa-space-3xs) var(--wa-space-s);
          font-size: var(--wa-font-size-s);
          color: var(--wa-color-success-on-quiet);
          background: var(--wa-color-success-fill-quiet);
          border-radius: var(--wa-border-radius-s);
        }
        .workspace__sync::before {
          content: "";
          width: 7px; height: 7px; border-radius: 50%;
          background: var(--wa-color-success-fill-loud); flex: none;
        }
        .workspace__spacer { flex: 1; }
        .workspace__actions {
          display: inline-flex;
          align-items: center;
          gap: var(--wa-space-m);
          color: var(--wa-color-text-quiet);
        }
        .workspace__icon {
          width: 20px; height: 20px;
          border-radius: var(--wa-border-radius-s);
          border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          flex: none;
        }

        /* The binder fills the space below the top bar: the active sheet
           panel fills the rest, the projected tab strip pins to the
           bottom. */
        .workspace__binder {
          display: flex;
          flex-direction: column;
          flex: 1;
          min-height: 0;
        }

        /* The view mounts each sheet through a `<tonk-display>` wrapper;
           those wrappers are the binder's flex children (the panels).
           The active panel FILLS the available height; the rest
           collapse (their inner <tonk-sheet> is `hidden`). Scrolling
           happens inside the sheet's card. */
        .workspace__binder > tonk-display {
          flex: 1;
          min-height: 0;
          padding: var(--wa-space-l);
          box-sizing: border-box;
          order: 1;
        }
        .workspace__binder > tonk-display:not(:has(tonk-sheet:not([hidden]))) {
          display: none;
        }
        .workspace__binder > tonk-display > tonk-view {
          display: block;
          height: 100%;
          min-height: 0;
        }

        /* The sheet card: a header strip the sheet projects from its
           attributes, over the sheet's content. Transparent body so the
           page's dot-grid shows through; bordered frame. */
        .workspace__binder tonk-sheet {
          display: flex;
          flex-direction: column;
          height: 100%;
          min-height: 0;
          color: inherit;
          font-family: inherit;
          border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          background: transparent;
          overflow: hidden;
        }
        /* The card body: everything after the projected header. The
           sheet's content <tonk-display> is the last child; it scrolls. */
        .workspace__binder tonk-sheet > tonk-display {
          flex: 1;
          min-height: 0;
          overflow: auto;
        }
        .workspace__binder tonk-sheet > tonk-display > tonk-view {
          display: block;
          min-height: 100%;
        }

        /* The card header the sheet projects (status dot + name +
           subtitle). A surface fill so it reads as chrome over the
           transparent body. */
        .tonk-sheet__head {
          display: flex;
          align-items: center;
          gap: var(--wa-space-s);
          flex: none;
          padding: var(--wa-space-s) var(--wa-space-m);
          background: var(--wa-color-surface-raised);
          border-bottom: var(--wa-border-width-s) solid var(--wa-color-surface-border);
        }
        .tonk-sheet__dot {
          width: 7px; height: 7px; border-radius: 50%;
          background: currentColor; flex: none;
        }
        .tonk-sheet__name { font-size: var(--wa-font-size-s); font-weight: var(--wa-font-weight-semibold); }
        .tonk-sheet__meta { font-size: var(--wa-font-size-s); color: var(--wa-color-text-quiet); }

        /* The bottom tab strip the binder projects. Equal-width bullet
           segments separated by rules; the active tab gets a brand
           accent top bar. The binder sets the CSS `order` per tab. */
        .tonk-sheet-binder__tabs {
          display: flex;
          align-items: stretch;
          flex: none;
          height: 48px;
          order: 2;
          /* Left inset so the first tab aligns with the sheet card's
             left edge (the panel padding above). */
          padding-left: var(--wa-space-l);
          /* A surface fill matching the top bar (not the darker lowered
             surface). */
          background: var(--wa-color-surface-raised);
          border-top: var(--wa-border-width-s) solid var(--wa-color-surface-border);
        }
        /* Tabs are content-width (short), left-aligned, separated by
           rules — not stretched to fill the strip (the wireframe). */
        .tonk-sheet-binder__tab {
          flex: none;
          display: inline-flex;
          align-items: center;
          gap: var(--wa-space-s);
          padding: 0 var(--wa-space-l);
          font: inherit;
          font-size: var(--wa-font-size-s);
          color: var(--wa-color-text-quiet);
          background: transparent;
          border: none;
          border-right: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          border-top: 2px solid transparent;
          cursor: pointer;
          white-space: nowrap;
        }
        /* The leading status bullet (hollow when inactive). */
        .tonk-sheet-binder__tab::before {
          content: "";
          width: 7px; height: 7px;
          border-radius: 50%;
          border: var(--wa-border-width-s) solid currentColor;
          background: transparent;
          flex: none;
        }
        .tonk-sheet-binder__tab:hover {
          color: var(--wa-color-text-normal);
          background: var(--wa-color-neutral-fill-quiet);
        }

        /* Active tab: brand-accent top bar, raised surface, filled
           bullet, normal-weight bright text — the selected sheet. */
        .tonk-sheet-binder__tab.is-active {
          color: var(--wa-color-text-normal);
          font-weight: var(--wa-font-weight-semibold);
          background: var(--wa-color-surface-default);
          border-top-color: var(--wa-color-brand-fill-loud);
        }
        .tonk-sheet-binder__tab.is-active::before {
          background: var(--wa-color-brand-fill-loud);
          border-color: var(--wa-color-brand-fill-loud);
        }
      </style>

      <div class="workspace__topbar">
        <span class="workspace__brand">tonk</span>
        <span class="workspace__crumb">&lsaquo; all repos</span>
        <span class="workspace__title">{name}</span>
        <span class="workspace__sync">synced</span>
        <span class="workspace__spacer"></span>
        <span class="workspace__actions">
          <span class="workspace__icon"></span>
          <span class="workspace__icon"></span>
          <span class="workspace__icon"></span>
        </span>
      </div>

      <tonk-sheet-binder class="workspace__binder" active={active} onactivate=workspace/activate-sheet>
        <tonk-display entity={sheet} model=tonk:sheet />
      </tonk-sheet-binder>
    </div>

# The sheet-mount view (default view for `workspace/sheet`): wraps the
# sheet's content in a `<tonk-sheet>` carrying its metadata as
# attributes. `<tonk-sheet>` projects the card header from
# `title`/`subtitle`/`icon` and `<tonk-sheet-binder>` projects the tab
# strip from the same attributes; the view supplies only the
# attributes and the content. The sheet's content renders directly
# from the sheet's own `entity`/`model`/`view` fields - a sheet is
# self-describing, so no intermediate concept is needed.
view!:
  this: id:tonk-workspace/sheet-mount
  model: tonk:sheet
  display: |
    <tonk-sheet sheet={this} order={order} title={title} subtitle={subtitle} icon={icon}>
      <tonk-display entity={entity} model={model} view={view} />
    </tonk-sheet>

# ============================================================
# BOARD
# ============================================================
#
# v1 is the hierarchical shape: board owns columns; column owns
# tiles. Future work projects this from a flat tile concept using
# deductive rules; the view templates won't change when that
# happens.

concept!: &board-view
  description: A named board (hierarchical v1, owns columns directly)
  with:
    name:
      description: Display name
      the: xyz.tonk.board/name
      cardinality: one
      as: text
    column:
      description: Columns in this board
      the: xyz.tonk.board/column
      cardinality: many
      as: entity

concept!: &column-view
  description: A column on a board
  with:
    order:
      description: LexoRank-style order key within the board
      the: xyz.tonk.column/order
      cardinality: one
      as: text
    width:
      description: Column width in grid units (1 unit is 64px)
      the: xyz.tonk.column/width
      cardinality: one
      as: unsigned-integer
    tile:
      description: Tiles in this column
      the: xyz.tonk.column/tile
      cardinality: many
      as: entity

concept!: &tile
  description: One tile in a column
  with:
    order:
      description: Order key within the column
      the: xyz.tonk.tile/order
      cardinality: one
      as: text
    model:
      description: Concept the tile body renders
      the: xyz.tonk.tile/model
      cardinality: one
      as: entity
    entity:
      description: Entity the tile body renders
      the: xyz.tonk.tile/entity
      cardinality: one
      as: entity

concept!: &inspector-view
  description: An inspector tile body — renders <tonk-inspector source="…">
  with:
    source:
      description: Space name to inspect (passed through as the source attribute)
      the: xyz.tonk.inspector/source
      cardinality: one
      as: text

# The imperative escape hatch: `<tonk-portal>` writes an
# author-supplied HTML document into a sandboxed iframe, for work the
# declarative template stack can't express (canvas, WebGL, widgets).
# The `content` is first-class dialog data, fetched by a nested
# `<tonk-display model=portal>` like any other concept.
concept!: &portal
  description: Imperative HTML rendered in an isolated iframe
  with:
    content:
      description: HTML document written into the portal iframe
      the: xyz.tonk.portal/content
      cardinality: one
      as: text
    height:
      description: Iframe height in pixels
      the: xyz.tonk.portal/height
      cardinality: one
      as: unsigned-integer

# One view per concept, keyed by `model`. Each nested
# `<tonk-display>` passes only `model=…` (and `entity=…`); with no
# `view` attribute it resolves the view whose `model` matches. The
# chain iterates one level of the hierarchy per template via
# `subject={field}` and bottoms out in the tile's content display.

view!:
  this: tonk:board
  model: board-view
  display: |
    <tonk-strip>
      <style>
        /* Board layout travels with the view, so any route that
           mounts `model=board-view` renders the strip identically
           (board route, bare display route, embedded tile). The
           only thing a route still owns is giving this view a
           full-height box to fill: the strip's `block-size: 100%`
           resolves against whatever height its host establishes.

           The `tonk-display`/`tonk-view` layers that wrap each
           level are pure rendering wrappers, not layout boxes;
           `display: contents` makes them transparent so the strip
           is a flex container over real `<tonk-column>` items, and
           so the strip itself inherits its host's height instead of
           collapsing to content. */
        tonk-display:has(> tonk-view > tonk-strip),
        tonk-display > tonk-view:has(> tonk-strip) {
          display: contents;
        }

        tonk-strip {
          --pitch: 16px;
          --cell: 64px;
          /* Narrow gutter between columns — just enough that the
             contrasting strip fill reads as a seam. */
          --gap: 4px;

          display: flex;
          flex-direction: row;
          align-items: stretch;
          gap: var(--gap);
          padding: 0;
          box-sizing: border-box;
          block-size: 100%;
          inline-size: 100%;
          overflow-x: auto;
          overflow-y: hidden;
          scroll-snap-type: x proximity;
          /* The strip's fill shows through every seam — between
             columns AND between tiles within a column (since
             `<tonk-column>` is transparent). The neutral-fill token
             adapts with dark / light mode. */
          background-color: var(--wa-color-neutral-fill-normal);
        }

        /* The `tonk-display`/`tonk-view` wrappers between the strip
           and each column are transparent to the strip's flex flow,
           so each `<tonk-column>` is a direct flex item (its
           `flex: 0 0 calc(--col-w * --cell)` sizes the column, not
           the wrapping display). */
        tonk-strip > tonk-display,
        tonk-strip > tonk-display > tonk-view {
          display: contents;
        }
      </style>
      <tonk-display entity={column} model=column-view />
    </tonk-strip>

view!:
  this: tonk:board/column
  model: column-view
  display: |
    <tonk-column style="--col-w: {width};">
      <style>
        tonk-column {
          /* Width is driven by `--col-w` set on the element by this
             template (one --cell unit is 64px). Tiles stack
             top-to-bottom inside; overflow is handled here at the
             column level so the column's dot-grid background scrolls
             together with the tiles. */
          flex: 0 0 calc(var(--col-w, 12) * 64px);
          block-size: 100%;
          display: flex;
          flex-direction: column;
          gap: 4px;
          overflow-y: auto;
          overflow-x: hidden;
          scroll-snap-align: start;
          min-block-size: 0;
          /* Transparent so the strip's seam fill shows through the
             column-to-column and tile-to-tile gaps. The column's
             grid layer still paints (a `background-image`, not a
             fill) against whatever the strip provides underneath. */
          background-color: transparent;
        }

        tonk-column::-webkit-scrollbar { display: none; }

        /* Tiles size to their content along the column's main axis
           and stack top-to-bottom. Overflow happens at the COLUMN
           level (the column is the scroller), never inside a tile,
           so a tile renders its content unclipped and the user
           scrolls the whole column. Tiles paint the dark canvas
           fill; the gaps expose the strip's lighter seam fill. */
        tonk-column > .tile {
          flex: 0 0 auto;
          inline-size: 100%;
          box-sizing: border-box;
          background-color: var(--wa-color-neutral-fill-quiet);

          /* Two-layer engineering graph-paper background, applied to
             each tile (the surface the dark canvas occupies). The
             grid travels with the tile content because the tile is
             the visible canvas. `background-attachment: local` ties
             the grid to the column's scroll so the dots travel with
             vertical scroll. */
          --dot-gap: 16px;
          --dot-size-dim: 0.5px;
          --dot-size-bright: 0.5px;
          --dot-color-dim: color-mix(in oklab, currentColor 16%, transparent);
          --dot-color-bright: color-mix(in oklab, currentColor 25%, transparent);
          background-image:
            radial-gradient(
              circle,
              var(--dot-color-bright) var(--dot-size-bright),
              transparent calc(var(--dot-size-bright) + 0.5px)
            ),
            radial-gradient(
              circle,
              var(--dot-color-dim) var(--dot-size-dim),
              transparent calc(var(--dot-size-dim) + 0.5px)
            );
          background-size:
            calc(var(--dot-gap) * 4) calc(var(--dot-gap) * 4),
            var(--dot-gap) var(--dot-gap);
          background-position:
            calc(var(--dot-gap) * -2) calc(var(--dot-gap) * -2),
            calc(var(--dot-gap) / -2) calc(var(--dot-gap) / -2);
          background-attachment: local;
        }

        /* The inner `<tonk-display>` participates in the column's
           scroll — it must NOT clip or scroll on its own. */
        tonk-column > .tile > tonk-display,
        tonk-column > .tile > tonk-display > tonk-view {
          display: block;
          inline-size: 100%;
          overflow: visible;
        }
      </style>
      <div class="tile" subject={tile}>
        <tonk-display entity={tile} model=tile />
      </div>
    </tonk-column>

view!:
  this: tonk:board/tile
  model: tile
  display: |
    <tonk-display entity={entity} model={model} />

view!:
  this: tonk:inspector-view
  model: inspector-view
  display: |
    <tonk-inspector source={source} />

# The canonical bridge from the `portal` concept to the
# `<tonk-portal>` element. `html:` forces both bindings through
# setAttribute so `attributeChangedCallback` fires — required for
# `height`, an unsigned-integer the renderer would otherwise route to a
# JS property. Users never write this; nesting a
# `<tonk-display model=portal>` over a portal entity resolves it by
# model and renders it.
view!:
  this: tonk:portal
  model: portal
  display: |
    <tonk-portal html:content={content} html:height={height} />

