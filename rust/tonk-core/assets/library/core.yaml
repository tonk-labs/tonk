# override - the default model-resolved view is the portal bridge.
workspace/sheet!:
  this: id:tonk-workspace/sheet/sketch
  title: "Sketch"
  subtitle: "an imperative canvas in a sandboxed iframe"
  icon: "palette"
  entity: id:tonk-workspace/sketch
  model: portal
  view: tonk:view
  order: "c"

