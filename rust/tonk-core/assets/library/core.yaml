# Tonk standard library.
#
# The built-in concepts, views, commands, and rules the runtime
# seeds into a repository at creation. Served as a static asset
# (`/library/core.yaml`) and fetched + lowered by the service
# worker in the repository-creation path, rather than embedded at
# compile time. Editing this file changes the standard library
# without rebuilding the wasm.
#
# Lowering runs `analyze_local` (no running system), so every
# `&anchor` / bare-name reference must resolve within this file.
#
# Two source sections, formerly `tonk-workspace/bootstrap.yaml` and
# `tonk-board/bootstrap.yaml`. The `view` concept is shared between
# them (pinned to `tonk:view`) and declared once here.

# ============================================================
# VIEW
# ============================================================

# The `view` concept. Shape matches what `<tonk-display>` queries
# (resolve.rs `view_predicate`): a `model` (the concept it renders)
# and a `display` (the HTML template). Pinned to the stable
# `tonk:view` URI so <tonk-display> can refer to the built-in view
# concept directly, without a name-resolution round-trip.
concept!: &view
  this: tonk:view
  description: A display template (model, display) for rendering an entity
  with:
    model:
      description: Concept this view renders
      the: xyz.tonk.view/model
      cardinality: one
      as: entity
    display:
      description: HTML template for the view
      the: xyz.tonk.view/display
      cardinality: one
      as: text

concept!: &view/directory
  this: tonk:view/directory
  description: A directory view used by tonk-display when entity is not set.
  with:
    model:
      description: Concept this view renders
      the: xyz.tonk.view/model
      cardinality: one
      as: entity
    display:
      description: HTML template for the view
      the: xyz.tonk.view/directory
      cardinality: one
      as: text

# The default directory view: `model: _:_` matches any model with no
# specific `view/directory`. <tonk-display> with no `entity` resolves a
# directory view for the model first; finding none, it falls back to
# this. It renders the model's instances in a <wa-carousel>, one slide
# per instance, each a nested single-entity <tonk-display> (which then
# resolves its own view, or this default's detail counterpart). The
# nested `model` is threaded from the host via `{dom.host/model}`,
# since an instance carries no pointer to its own model.
view/directory!:
  this: id:tonk:view/directory/default
  model: _:_
  display: |
    <wa-carousel class="vertical seamless" pagination orientation="vertical">
      <wa-carousel-item subject={this}>
        <tonk-display entity={this} model={dom.host/model} />
      </wa-carousel-item>
    </wa-carousel>


# ============================================================
# WORKSPACE
# ============================================================

# The `artifact` concept. Binds an entity to a model and a view,
# plus the tab metadata (title, icon) the viewer shell shows. Its
# (entity, model, view) map one-to-one onto
# `<tonk-display entity model view>`. Pinned to `tonk:artifact` so
# the viewer can query artifacts by a stable concept entity.
concept!: &artifact
  this: tonk:artifact
  description: An entity displayed as a sheet/tab in the viewer.
  with:
    title:
      description: Title shown in the tab
      the: xyz.tonk.artifact/title
      cardinality: one
      as: text
    subtitle:
      description: Dimmed metadata line shown after the name in the card header
      the: xyz.tonk.artifact/subtitle
      cardinality: one
      as: text
    icon:
      description: Icon shown in the tab
      the: xyz.tonk.artifact/icon
      cardinality: one
      as: text
    entity:
      description: Entity displayed in the sheet
      the: xyz.tonk.artifact/entity
      cardinality: one
      as: entity
    model:
      description: Model concept used to display the entity
      the: xyz.tonk.artifact/model
      cardinality: one
      as: entity
    view:
      description: View concept used to display the entity
      the: xyz.tonk.artifact/view
      cardinality: one
      as: entity

# The `empty-artifact` concept: a freshly created, not-yet-configured
# sheet. It carries only a `title` (the typed name) on the shared
# `xyz.tonk.artifact/title` attribute, and its view renders the
# "empty artifact" canvas (a deeplink to hand to an agent, plus
# instructions). Pinned to `tonk:empty-artifact` so the create rule can
# point a new sheet's `model` at it by a stable URI.
concept!: &empty-artifact
  this: tonk:empty-artifact
  description: A newly created, not-yet-configured sheet awaiting content.
  with:
    title:
      description: The artifact's name, shown on the empty canvas
      the: xyz.tonk.artifact/title
      cardinality: one
      as: text

# The `sheet` concept: one tab in a workspace. A sheet is an
# artifact (same title/icon/entity/model/view fields, same attribute
# URIs) plus an `order` lexicographic key that positions the tab. So
# every sheet is also a valid artifact; the extra `order` field is
# what makes it a workspace member.
concept!: &workspace/sheet
  this: tonk:sheet
  description: A workspace tab - an artifact plus a lexicographic order key.
  with:
    title:
      description: Title shown in the tab
      the: xyz.tonk.artifact/title
      cardinality: one
      as: text
    subtitle:
      description: Dimmed metadata line shown after the name in the card header
      the: xyz.tonk.artifact/subtitle
      cardinality: one
      as: text
    icon:
      description: Icon shown in the tab
      the: xyz.tonk.artifact/icon
      cardinality: one
      as: text
    entity:
      description: Entity displayed in the sheet
      the: xyz.tonk.artifact/entity
      cardinality: one
      as: entity
    model:
      description: Model concept used to display the entity
      the: xyz.tonk.artifact/model
      cardinality: one
      as: entity
    view:
      description: View concept used to display the entity
      the: xyz.tonk.artifact/view
      cardinality: one
      as: entity
    order:
      description: Lexicographic order key positioning the tab
      the: xyz.tonk.sheet/order
      cardinality: one
      as: text

# Tab selection. Clicking a tab fires the transient `activate-sheet`
# command, reading which sheet was clicked from the binder's `activate`
# event detail. The inductive rule below points the binder's
# cardinality-one `active` field at the clicked sheet (replacing the
# prior selection). The command itself is swept after the cycle - only
# the `active` pointer persists.
command!: &workspace/activate-sheet
  description: A request to make `sheet` the active sheet of the binder.
  with:
    sheet:
      description: The sheet to activate, from the binder's `activate` event detail
      the: dom.event.detail/sheet
      as: entity

# The Enable-sync command. Submitting the topbar's "Enable sync" form
# asserts this transient command; the worker's `CreateSpaceHandler`
# (which serves both this and `space/create`, keyed on the shared `name`
# attribute) idempotently attaches the remote to the named space — the
# repo already exists, so the create step no-ops and only the attach
# runs. `remote` is the URL typed (or the `<tonk-default-remote>` button
# populated); `name` is the space's local repository name. The workspace
# concept's `{name}` is a display label, NOT the repo name, so the
# `<tonk-sync-state>` element (which resolves the repo from its
# `<tonk-repository>` ancestor) stamps the real name into the form's
# hidden `name` input on click — the one identifier notation can't read
# from the event. `prevent-default` stops the page reloading.
command!: &space/enable-sync
  description: A request to attach a sync remote to the current space.
  with:
    name:
      description: The space's local repository name, stamped into the hidden `name` input
      the: dom.event.current-target.elements.name/value
      as: text
    remote:
      description: The sync URL, read from the form's `remote` input on submit
      the: dom.event.current-target.elements.remote/value
      as: text
    prevent-default:
      description: Stop the form submission from reloading the page
      the: dom.event.do/prevent-default

# Mint a repository invite. The share form's `<tonk-credential>` generates
# an ephemeral keypair in the browser, fills the `audience` input with its
# public did:key, and keeps the private seed in the DOM. Submitting asserts
# this transient; the worker's `InviteHandler` delegates the *origin*
# repository's access to that DID and asserts an `invitation` fact keyed by
# the DID. The repository is not a field here — the handler reads it from
# the command's origin (the branch the commit landed in) — so the form
# carries only the public DID, never the secret seed.
command!: &tonk/invite
  description: Mint a repo invite delegated to a browser-generated audience DID.
  with:
    audience:
      description: The ephemeral did:key from `<tonk-credential>`, read from the form.
      the: dom.event.current-target.elements.audience/value
      as: entity
    prevent-default:
      description: Stop the form submission from reloading the page
      the: dom.event.do/prevent-default

# The durable fact the invite handler asserts: the delegation chain it
# minted, keyed by the audience DID. The share view reads `access` back via
# `<tonk-display model=invitation entity={audience}>` and assembles the
# final URL locally (joining `?access=` with the `#seed` the browser still
# holds). Storing the chain is safe — it is a scoped capability, not a
# secret; the secret seed never leaves the browser.
concept!: &invitation
  this: tonk:invitation
  description: A delegation chain granting access to a repo, keyed by audience DID.
  with:
    access:
      description: base58 delegation chain — the `?access=` part of the invite URL.
      the: xyz.tonk.invitation/access
      cardinality: one
      as: text
    remote:
      description: Sync endpoint — the `&remote=` part; empty when local-only.
      the: xyz.tonk.invitation/remote
      cardinality: one
      as: text

# The invite-link view — the default view for the `invitation` model, so
# `<tonk-display model=invitation>` mounts it with no explicit `view=`. It
# renders only once the worker has asserted the fact for the audience DID
# (before that the display is empty). The readonly input shows the
# assembled absolute URL: `{base}?access={access}{remote}#{seed}`, where
# `base` (`{origin}/join`) and `seed` are host attributes the wrapping
# `<tonk-credential>` set on this element, and `access` + `remote` are the
# durable fact. `remote` is a ready-to-append `&remote=<url>` suffix (empty
# for a local-only repo) so the recipient knows where to sync from. The
# seed and base come from the host attributes, never the database.
# `<wa-copy-button>` copies the same value.
view!: &invitation/link
  this: id:invitation/link
  model: invitation
  display: |
    <div class="invite-link">
      <wa-input
        class="invite-link__url"
        label="Invite link"
        readonly
        value="{dom.host/data-base}?access={access}{remote}#{dom.host/data-seed}"
      ></wa-input>
      <wa-copy-button
        class="invite-link__copy"
        value="{dom.host/data-base}?access={access}{remote}#{dom.host/data-seed}"
      ></wa-copy-button>
    </div>

# The repository's own name, stored in its content branch so the repo
# is self-describing — the name travels with the repository rather than
# living only in the joining profile's replica index. The banner reads
# it via `<tonk-display model=tonk:repository entity={subject}>`;
# `tonk/rename-repository` edits it. The concept is pinned to
# `tonk:repository` so the display can resolve its view, but its
# *instances* are keyed by the replica's `subject` DID (the entity the
# name attaches to is the subject, there is no separate `subject`
# field). The banner falls back to "Untitled" when unset.
concept!: &tonk/repository
  this: tonk:repository
  description: A shared repository which is the subject of a tonk/replica.
  with:
    name:
      description: The repository's display name.
      the: xyz.tonk.repo/name
      cardinality: one
      as: text

# Rename the current repository. The editable banner input dispatches
# this on commit (blur/enter); `name` reads the input's value and
# `subject` reads the repository identity stamped on the banner so the
# rule below knows which repository to rename. The command is transient:
# the rule fires once and the command is swept before the durable commit.
command!: &tonk/rename-repository
  description: Rename the repository.
  with:
    subject:
      description: The repository's subject DID, stamped on the banner element.
      the: dom.event.current-target.dataset/subject
      as: entity
    name:
      description: The new name, read from the banner input's value on commit.
      the: dom.event.current-target/value
      as: text

# Apply the rename: assert the new `tonk/repository` name against the
# repository entity named by the command's `subject`. Binding `subject`
# to `?this` makes the command's subject DID the head's entity directly,
# so the (cardinality-one) name overwrites in place on that repository.
rule!:
  description: Renames the repository from a rename-repository command
  assert!: tonk/repository
  when:
    - assert: tonk/rename-repository
      where:
        subject: ?this
        name: ?name

# The repository-name banner: a borderless text input that looks like
# plain title text until focused. It shows the current `{name}` and
# carries the repository's identity (`{this}` is the subject DID) on
# `data-subject` so the `tonk/rename-repository` command can read it.
# `onchange` fires on commit (blur or Enter), reading the new value from
# `dom.event.current-target/value`; the rename rule above then writes it
# back. The banner mounts this via `<tonk-display model=tonk:repository
# entity={subject}>`, so a repo with no name yet (just the seeded
# "Untitled") still renders an editable field.
view!:
  this: id:tonk:repository/name-view
  model: tonk:repository
  display: |
    <tonk-editable
      class="workspace__title-input"
      value={name}
      data-subject={this}
      onchange=tonk/rename-repository
      aria-label="Repository name"
    ></tonk-editable>

# A read-only label view kind. Its `display` template lives under a
# distinct attribute (`xyz.tonk.view/label`) so a model can carry both
# the editable `tonk:view` banner above AND a plain-text label view
# without the two colliding under the default `tonk:view` resolution.
# `<tonk-display>` selects it explicitly with `view=tonk:view/label`.
concept!: &view/label
  this: tonk:view/label
  description: A plain, read-only label view selected via `view=tonk:view/label`.
  with:
    model:
      description: Concept this view renders
      the: xyz.tonk.view/model
      cardinality: one
      as: entity
    display:
      description: HTML template for the label view
      the: xyz.tonk.view/label
      cardinality: one
      as: text

# The repository's name as plain, non-editable text. The Hub card
# mounts this via `<tonk-display model=tonk:repository entity={subject}
# view=tonk:view/label>` inside a per-space `<tonk-repository>` routing
# context, so each card shows its own space's current name (read from
# that space's `tonk/repository`, the cross-device source of truth)
# rather than an editable banner. Falls back to nothing when unset.
view/label!:
  this: id:tonk:repository/label-view
  model: tonk:repository
  display: |
    {name}

# Tab close. Clicking a tab's close button fires the transient
# `close-sheet` command. `sheet` is the closed sheet; `next` is the
# neighbour the binder picked (by tab order) to fall back to when the
# closed sheet was the active one. The two rules below (a) retract the
# sheet's `order` so it no longer matches the sheet directory (the tab
# disappears; the underlying artifact survives), and (b) move the
# binder's `active` to `next` if the closed sheet was active.
command!: &workspace/close-sheet
  description: A request to close `sheet`, demoting it back to a plain artifact.
  with:
    sheet:
      description: |
        The sheet to close, from the binder's `close` event detail.
        Carried on a close-specific attribute (`dom.event.detail/closed`),
        NOT `dom.event.detail/sheet` - the latter is what the
        `activate-sheet` command reads, so reusing it here would make a
        close also read as an activate request and select the closed
        tab.
      the: dom.event.detail/closed
      as: entity
    next:
      description: The neighbour sheet to activate if the closed one was active
      the: dom.event.detail/next
      as: entity

# A minimal projection of a sheet's `order` key - the one field a
# `tonk:sheet` carries over a plain `artifact`. A `retract!:` rule over
# this dissociates exactly the `order` triple, rather than re-asserting
# the whole `tonk:sheet` (which would force binding every field).
concept!: &workspace/sheet-order
  description: A sheet's order key, as a standalone fact.
  with:
    order:
      description: Lexicographic order key positioning the tab
      the: xyz.tonk.sheet/order
      cardinality: one
      as: text

# Retract the order: when `close-sheet` fires, drop the closed sheet's
# `order` triple. The sheet's artifact facts (title/entity/model/...)
# persist - only the `order` that made it a `tonk:sheet` is removed, so
# the directory query (which requires `order`) no longer matches it and
# the tab disappears. The artifact could be re-promoted to a sheet
# later by re-asserting an `order`.
rule!:
  description: Demotes a closed sheet back to a plain artifact
  retract!: workspace/sheet-order
  when:
    - assert: workspace/close-sheet
      where: { sheet: ?this }
    - assert: workspace/sheet-order
      where: { this: ?this, order: ?order }

# Reassign active: when the closed sheet was the binder's active one,
# point `active` at the neighbour the binder supplied. The binder is
# the replica's (bound through `tonk/replica`); the `active: ?sheet`
# join gates this to the active-sheet case, so closing a non-active
# sheet leaves `active` untouched (no match).
rule!:
  description: Moves the binder's active pointer to the neighbour when the active sheet closes
  assert!: tonk/binder
  when:
    - assert: workspace/close-sheet
      where: { sheet: ?sheet, next: ?active }
    - assert: tonk/replica
      where: { this: ?this, subject: ?subject }
    - assert: tonk/binder
      where: { this: ?this, active: ?sheet }

# The sheet-mount view (default view for `workspace/sheet`): wraps the
# sheet's content in a `<tonk-sheet>` carrying its metadata as
# attributes. `<tonk-sheet>` projects the card header from
# `title`/`subtitle`/`icon` and `<tonk-sheet-binder>` projects the tab
# strip from the same attributes; the view supplies only the
# attributes and the content. The sheet's content renders directly
# from the sheet's own `entity`/`model`/`view` fields - a sheet is
# self-describing, so no intermediate concept is needed.



view!:
  this: id:tonk-workspace/sheet-mount
  model: tonk:sheet
  display: |
    <tonk-sheet sheet={this} order={order} title={title} subtitle={subtitle} icon={icon}>
      <tonk-display entity={entity} model={model} view={view} />
    </tonk-sheet>

# The empty-artifact canvas: what a freshly created sheet renders until
# it has real content. Mirrors the wireframe's "empty artifact
# (terminal)" frame - the artifact name, an agent-link row to hand to an
# agent, and a short instructional block. Styling uses the app's Web
# Awesome tokens so it follows the active theme.
view!:
  this: tonk:empty-artifact/view
  model: tonk:empty-artifact
  display: |
    <div class="empty-artifact">
      <style>
        .empty-artifact {
          display: flex;
          flex-direction: column;
          gap: var(--wa-space-2xl);
          width: 100%;
          max-width: 620px;
          margin: 0 auto;
          padding: var(--wa-space-3xl) var(--wa-space-2xl);
          color: var(--wa-color-text-normal);
          font-family: var(--wa-font-family-body);
        }
        /* The artifact name, large and light, with a file glyph. The
           app stylesheet gives every `h1` an inverted "headline cover"
           background; override it back to plain text here so the title
           reads as a heading, not a highlighted block. */
        .empty-artifact__title {
          display: flex;
          align-items: center;
          gap: var(--wa-space-s);
          margin: 0;
          padding: 0;
          background: transparent;
          color: var(--wa-color-text-normal);
          font-family: var(--wa-font-family-body);
          font-size: var(--wa-font-size-2xl);
          font-weight: var(--wa-font-weight-normal);
          letter-spacing: -0.02em;
        }
        .empty-artifact__glyph { color: var(--wa-color-text-quiet); flex: none; }
        /* The agent-link panel: an uppercase mono label over a copy
           control. `<tonk-invite>` renders the button
           (`.empty-artifact__share`) with a copy icon + label; clicking
           it mints a fresh artifact-scoped invite and copies it, swapping
           the icon to a check on success (like `<wa-copy-button>`). */
        .empty-artifact__deeplink {
          display: flex;
          flex-direction: column;
          gap: var(--wa-space-xs);
          align-items: flex-start;
        }
        .empty-artifact__deeplink-label {
          font-family: var(--wa-font-family-code);
          font-size: var(--wa-font-size-xs);
          letter-spacing: 0.06em;
          text-transform: uppercase;
          color: var(--wa-color-text-quiet);
        }
        .empty-artifact__share {
          display: inline-flex;
          align-items: center;
          gap: var(--wa-space-s);
          padding: var(--wa-space-s) var(--wa-space-l);
          font: inherit;
          font-size: var(--wa-font-size-m);
          font-weight: var(--wa-font-weight-semibold);
          color: var(--wa-color-brand-on-loud);
          background: var(--wa-color-brand-fill-loud);
          border: none;
          border-radius: var(--wa-border-radius-m);
          cursor: pointer;
        }
        .empty-artifact__share:hover { background: var(--wa-color-brand-fill-loud); filter: brightness(1.06); }
        .empty-artifact__share .tonk-invite__icon { font-size: 16px; flex: none; }
        /* The copy-failed fallback: the link in a bordered field + the
           native copy control. */
        .tonk-invite__result {
          display: flex;
          align-items: stretch;
          width: 100%;
          border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          border-radius: var(--wa-border-radius-s);
          overflow: hidden;
        }
        .tonk-invite__url {
          flex: 1;
          min-width: 0;
          display: flex;
          align-items: center;
          overflow-x: auto;
          white-space: nowrap;
          font-family: var(--wa-font-family-code);
          font-size: var(--wa-font-size-s);
          color: var(--wa-color-text-normal);
          padding: var(--wa-space-s) var(--wa-space-m);
          background: var(--wa-color-neutral-fill-quiet);
        }
        /* A quoted instructional block with a brand left-accent bar. */
        .empty-artifact__instr {
          display: flex;
          flex-direction: column;
          gap: var(--wa-space-2xs);
          padding-left: var(--wa-space-m);
          border-left: 2px solid var(--wa-color-brand-fill-loud);
          font-size: var(--wa-font-size-m);
          line-height: var(--wa-line-height-normal);
          color: var(--wa-color-text-quiet);
        }
        .empty-artifact__instr p { margin: 0; }
        .empty-artifact__instr b { color: var(--wa-color-text-normal); font-weight: var(--wa-font-weight-semibold); }
      </style>
      <h1 class="empty-artifact__title">
        <wa-icon class="empty-artifact__glyph" name="file" variant="regular"></wa-icon>
        {title}
      </h1>
      <section class="empty-artifact__deeplink">
        <div class="empty-artifact__deeplink-label">agent link &middot; paste into your agent</div>
        <tonk-invite
          artifact={this}
          concept="tonk:artifact"
          button-class="empty-artifact__share"
          label="copy"></tonk-invite>
      </section>
      <div class="empty-artifact__instr">
        <p>Paste this link into your agent's chat to start building.</p>
        <p>The agent will edit <b>{title}</b> directly &mdash; you'll see changes here as they happen.</p>
      </div>
    </div>

# ============================================================
# BOARD
# ============================================================
#
# v1 is the hierarchical shape: board owns columns; column owns
# tiles. Future work projects this from a flat tile concept using
# deductive rules; the view templates won't change when that
# happens.

concept!: &board
  description: A named board (hierarchical v1, owns columns directly)
  with:
    name:
      description: Display name
      the: xyz.tonk.board/name
      cardinality: one
      as: text
    column:
      description: Columns in this board
      the: xyz.tonk.board/column
      cardinality: many
      as: entity

concept!: &column-view
  description: A column on a board
  with:
    order:
      description: LexoRank-style order key within the board
      the: xyz.tonk.column/order
      cardinality: one
      as: text
    width:
      description: Column width in grid units (1 unit is 64px)
      the: xyz.tonk.column/width
      cardinality: one
      as: unsigned-integer
    tile:
      description: Tiles in this column
      the: xyz.tonk.column/tile
      cardinality: many
      as: entity

concept!: &tile
  description: One tile in a column
  with:
    order:
      description: Order key within the column
      the: xyz.tonk.tile/order
      cardinality: one
      as: text
    model:
      description: Concept the tile body renders
      the: xyz.tonk.tile/model
      cardinality: one
      as: entity
    entity:
      description: Entity the tile body renders
      the: xyz.tonk.tile/entity
      cardinality: one
      as: entity

concept!: &inspector
  description: An inspector tile body — renders <tonk-inspector source="…">
  with:
    source:
      description: Space name to inspect (passed through as the source attribute)
      the: xyz.tonk.inspector/source
      cardinality: one
      as: text

# The imperative escape hatch: `<tonk-portal>` writes an
# author-supplied HTML document into a sandboxed iframe, for work the
# declarative template stack can't express (canvas, WebGL, widgets).
# The `content` is first-class dialog data, fetched by a nested
# `<tonk-display model=portal>` like any other concept.
concept!: &portal
  description: Imperative HTML rendered in an isolated iframe
  with:
    content:
      description: HTML document written into the portal iframe
      the: xyz.tonk.portal/content
      cardinality: one
      as: text

# One view per concept, keyed by `model`. Each nested
# `<tonk-display>` passes only `model=…` (and `entity=…`); with no
# `view` attribute it resolves the view whose `model` matches. The
# chain iterates one level of the hierarchy per template via
# `subject={field}` and bottoms out in the tile's content display.

view!:
  this: tonk:board
  model: board
  display: |
    <tonk-strip>
      <style>
        /* Board layout travels with the view, so any route that
           mounts `model=board` renders the strip identically
           (board route, bare display route, embedded tile). The strip
           caps its OWN height at the viewport (`block-size: 100dvh`)
           rather than borrowing a fixed height from the document — so
           its columns scroll vertically inside a bounded box and the
           strip scrolls horizontally, without locking the page. (Other
           views let the page scroll; the board is a self-contained
           fixed-height scroller.)

           The `tonk-display`/`tonk-view` layers that wrap each
           level are pure rendering wrappers, not layout boxes;
           `display: contents` makes them transparent so the strip
           is a flex container over real `<tonk-column>` items. */
        tonk-display:has(> tonk-view > tonk-strip),
        tonk-display > tonk-view:has(> tonk-strip) {
          display: contents;
        }

        tonk-strip {
          --pitch: 16px;
          --cell: 64px;
          /* Narrow gutter between columns — just enough that the
             contrasting strip fill reads as a seam. */
          --gap: 4px;

          display: flex;
          flex-direction: row;
          align-items: stretch;
          gap: var(--gap);
          padding: 0;
          box-sizing: border-box;
          block-size: 100dvh;
          inline-size: 100%;
          overflow-x: auto;
          overflow-y: hidden;
          scroll-snap-type: x proximity;
          /* The strip's fill shows through every seam — between
             columns AND between tiles within a column (since
             `<tonk-column>` is transparent). The neutral-fill token
             adapts with dark / light mode. */
          background-color: var(--wa-color-neutral-fill-normal);
        }

        /* The `tonk-display`/`tonk-view` wrappers between the strip
           and each column are transparent to the strip's flex flow,
           so each `<tonk-column>` is a direct flex item (its
           `flex: 0 0 calc(--col-w * --cell)` sizes the column, not
           the wrapping display). */
        tonk-strip > tonk-display,
        tonk-strip > tonk-display > tonk-view {
          display: contents;
        }
      </style>
      <tonk-display entity={column} model=column-view />
    </tonk-strip>

view/directory!:
  this: tonk:board/directory
  model: board
  display: |
    <tonk-display entity={this} model={dom.host/model} view={dom.host/view} />

view!:
  this: tonk:board/column
  model: column-view
  display: |
    <tonk-column style="--col-w: {width};">
      <style>
        tonk-column {
          /* Width is driven by `--col-w` set on the element by this
             template (one --cell unit is 64px). Tiles stack
             top-to-bottom inside; overflow is handled here at the
             column level so the column's dot-grid background scrolls
             together with the tiles. */
          flex: 0 0 calc(var(--col-w, 12) * 64px);
          block-size: 100%;
          display: flex;
          flex-direction: column;
          gap: 4px;
          overflow-y: auto;
          overflow-x: hidden;
          scroll-snap-align: start;
          min-block-size: 0;
          /* Transparent so the strip's seam fill shows through the
             column-to-column and tile-to-tile gaps. The column's
             grid layer still paints (a `background-image`, not a
             fill) against whatever the strip provides underneath. */
          background-color: transparent;
        }

        tonk-column::-webkit-scrollbar { display: none; }

        /* Tiles size to their content along the column's main axis
           and stack top-to-bottom. Overflow happens at the COLUMN
           level (the column is the scroller), never inside a tile,
           so a tile renders its content unclipped and the user
           scrolls the whole column. Tiles paint the dark canvas
           fill; the gaps expose the strip's lighter seam fill. */
        tonk-column > .tile {
          flex: 0 0 auto;
          inline-size: 100%;
          box-sizing: border-box;
          background-color: var(--wa-color-neutral-fill-quiet);

          /* Two-layer engineering graph-paper background, applied to
             each tile (the surface the dark canvas occupies). The
             grid travels with the tile content because the tile is
             the visible canvas. `background-attachment: local` ties
             the grid to the column's scroll so the dots travel with
             vertical scroll. */
          --dot-gap: 16px;
          --dot-size-dim: 0.5px;
          --dot-size-bright: 0.5px;
          --dot-color-dim: color-mix(in oklab, currentColor 16%, transparent);
          --dot-color-bright: color-mix(in oklab, currentColor 25%, transparent);
          background-image:
            radial-gradient(
              circle,
              var(--dot-color-bright) var(--dot-size-bright),
              transparent calc(var(--dot-size-bright) + 0.5px)
            ),
            radial-gradient(
              circle,
              var(--dot-color-dim) var(--dot-size-dim),
              transparent calc(var(--dot-size-dim) + 0.5px)
            );
          background-size:
            calc(var(--dot-gap) * 4) calc(var(--dot-gap) * 4),
            var(--dot-gap) var(--dot-gap);
          background-position:
            calc(var(--dot-gap) * -2) calc(var(--dot-gap) * -2),
            calc(var(--dot-gap) / -2) calc(var(--dot-gap) / -2);
          background-attachment: local;
        }

        /* The inner `<tonk-display>` participates in the column's
           scroll — it must NOT clip or scroll on its own. */
        tonk-column > .tile > tonk-display,
        tonk-column > .tile > tonk-display > tonk-view {
          display: block;
          inline-size: 100%;
          overflow: visible;
        }
      </style>
      <div class="tile" subject={tile}>
        <tonk-display entity={tile} model=tile />
      </div>
    </tonk-column>

view!:
  this: tonk:board/tile
  model: tile
  display: |
    <tonk-display entity={entity} model={model} />

view!:
  this: tonk:inspector
  model: inspector
  display: |
    <tonk-inspector source={source} />



view/directory!:
  this: tonk:inspector/directory
  model: inspector
  display: |
    <tonk-inspector source=home />

# The canonical bridge from the `portal` concept to the
# `<tonk-portal>` element. `html:` forces the binding through
# setAttribute so `attributeChangedCallback` fires. Users never write
# this; nesting a `<tonk-display model=portal>` over a portal entity
# resolves it by model and renders it.
view!:
  this: tonk:portal
  model: portal
  display: |
    <tonk-portal html:content={content} />

concept!: &db/session:
  this: concept:session
  description: Database session information
  with:
    profile:
      description: |
          Profile entity (as did:key) representing persistent identity on this device
      the: dialog.session/profile
      as: entity
    operator:
      description: |
          Operator entity (as did:key) representing an identifier used in this session to query and commit
      the: dialog.session/operator
      as: entity
    branch:
      description: |
          Active branch(es) in this session. Can be multiple when overlays are used.
      the: dialog.session/branch
      as: entity
      cardinality: many

concept!: &db/origin:
  this: concept:origin
  description: |
      Entity representing unique identifier for the active repository on this device.

      It can be used to assert/query device specific information.
  with:
    subject:
      description: |
          The repository subject (as did:key) representing it's unique identifier
      the: dialog.origin/subject
      as: entity
    profile:
      description: |
          Profile entity (as did:key) representing persistent identity on this device
      the: dialog.origin/profile
      as: entity

concept!: &db/branch:
  this: concept:branch
  description: |
      This represents a branch on some origin.
       Note that individual replicas can create same named branches and they
       likely going to be an different revisions, which is why branch is unique
       per origin as opposed to per repository.
  with:
    name:
      description: The branch name
      the: dialog.branch/name
      as: text
    origin:
      description: The origin of this branch
      the: dialog.branch/origin
      as: entity
    tree:
      description: The tree root of this branch
      the: dialog.branch/tree
      as: entity
    period:
      description: Synchronization point with an upstream
      the: dialog.branch/period
      as: entity
    moment:
      description: Number of commits made since last synchronization
      the: dialog.branch/moment
      as: entity

# A space (replica) the profile has access to. These records live on
# the profile repository's meta branch — one per repository this device
# has joined or created. The Tonk Hub at `/` queries them through a
# `<tonk-repository profile>` so the user can pick which space to open.
concept!: &space
  this: tonk:space
  description: A repository this profile can open, by its local name.
  with:
    name:
      description: Local name of the space, used in its `/space/{name}` URL
      the: xyz.tonk.replica/name
      cardinality: one
      as: text
    subject:
      description: The repository's subject DID (stable identity)
      the: xyz.tonk.replica/subject
      cardinality: one
      as: entity
    kind:
      description: >
        tonk:repository for a real space, tonk:profile for the
        profile's own self-replica. The Hub view hides the latter
        in CSS via [data-kind].
      the: xyz.tonk.replica/kind
      cardinality: one
      as: entity


# Set the binder shell as the space's default view. The display route
# mounts `<tonk-display model="tonk/space">`; this alias resolves it to
# `tonk:binder`, so directory mode renders the `tonk:shell` view (the
# topbar over the sheet binder) for the device's replica binder.
name!:
  this: id:tonk/space
  entity: tonk:binder

command!: &workspace/create-sheet
  description: Create a new sheet in the workspace
  with:
    name:
      description: Name of the artifact, from the binder's `create` event detail
      the: dom.event.detail/name
      as: text
    order:
      description: |
        Lexicographic order key for the new tab, computed by the binder
        (after the last existing tab) and carried on the `create` event
        detail.
      the: dom.event.detail/order
      as: text
    # The command entity is derived from its fields, so a per-event
    # nonce keeps successive creates (same name/order) distinct. The
    # binder stamps it on the event detail as a whole-number token;
    # `dom.event/time-stamp` itself is fractional and won't coerce to an
    # unsigned integer. Not ideal, but it mints unique entities and lets
    # us switch to a revision-based approach later.
    time:
      description: A monotonic integer nonce, from the binder's event detail
      the: dom.event.detail/time
      as: unsigned-integer


# A created sheet is self-describing: its `entity` is the sheet entity
# itself (`?this`), its `model` is `tonk:empty-artifact`, and its `view`
# is the built-in default. The companion rule below asserts the
# `empty-artifact` title against that same entity, so the empty-artifact
# canvas can render the sheet's name. `entity: ?this` is expressed as an
# equality between two variables, which unifies the head's `entity`
# field with the command's `this`.
rule!:
  description: Creates a new workspace sheet
  assert!: workspace/sheet
  when:
    - assert: workspace/create-sheet
      where:
        this: ?this
        name: ?title
        order: ?order
    - assert: ==
      where:
        this: ?entity
        is: ?this
    - assert: ==
      where:
        this: ?model
        is: tonk:empty-artifact
    - assert: ==
      where:
        this: ?view
        is: tonk:view
    - assert: ==
      where:
        this: ?subtitle
        is: ""
    - assert: ==
      where:
        this: ?icon
        is: "blank"

# Give the new sheet entity its empty-artifact title (the typed name),
# so the empty-artifact view bound to it shows the artifact name.
rule!:
  description: Titles the new sheet's empty-artifact entity
  assert!: empty-artifact
  when:
    - assert: workspace/create-sheet
      where:
        this: ?this
        name: ?title
        order: ?order

rule!:
  description: Activates the freshly created sheet on the binder
  assert!: tonk/binder
  when:
    - assert: workspace/create-sheet
      where:
        this: ?active
        name: ?title
        order: ?order
    # The binder is the replica's (bound through `tonk/replica`); point
    # its `active` at the new sheet so creating lands the user on the
    # new empty artifact (the head's `active` field unifies with the
    # created sheet `?active`).
    - assert: tonk/replica
      where:
        this: ?this
        subject: ?subject



concept!: &tonk/replica
  this: tonk:replica
  description: |
      Replica of the shared repositiory on this device. It is unique per device
      and can be used to associate device specific metadata about the repository.

  with:
    subject:
      description: |
          The repository subject (as did:key) representing it's unique identifier
      the: dialog.origin/subject
      as: entity
    profile:
      description: |
          Profile entity (as did:key) representing persistent identity on this device
      the: dialog.origin/profile
      as: entity

# what's up
view/directory!:
  this: tonk:shell
  model: tonk:binder
  display: |
    <div class="workspace-directory">
      <style>
        /* The route gives this view root (`.workspace-directory`) a
           viewport-min height. Flex-fill the nested `<tonk-display>`
           rendering chain so that height reaches the workspace, which
           then fills the page (tab strip at the bottom) — the same fill
           the seamless carousel applies to its slides. Without it the
           nested wrapper sits at content height and the workspace stops
           short. (`<style>` lives on this `<div>` rather than inside
           `<tonk-display>`, which discards child markup when it renders
           its resolved view.) */
        .workspace-directory {
          display: flex;
          flex-direction: column;
        }
        .workspace-directory > tonk-display,
        .workspace-directory > tonk-display > tonk-view {
          display: flex;
          flex-direction: column;
          flex: 1 1 auto;
          min-height: 0;
        }
        .workspace-directory > tonk-display > tonk-view > * {
          flex: 1 1 auto;
          min-height: 0;
        }

      </style>
      <div class="workspace__topbar">
        <span class="workspace__brand">tonk</span>
        <a class="workspace__crumb" href="/">&lsaquo; all repos</a>
        <span class="workspace__title"><tonk-display entity={subject} model=tonk:repository></tonk-display></span>
        <tonk-sync-state></tonk-sync-state>
        <span class="workspace__spacer"></span>
        <span class="workspace__actions">
          <wa-button class="workspace__share" appearance="plain" data-dialog="open share-repo" aria-label="Share this repo" title="Share this repo">
            <wa-icon name="share-nodes" label="Share"></wa-icon>
          </wa-button>
        </span>
      </div>

      <!-- Enable-sync dialog: shown via the `<tonk-sync-state>` enable
           trigger on a no-upstream space. That element stamps the
           resolved repo name into the hidden `name` input on click; the
           `remote` input + `<tonk-default-remote>` button collect the
           URL; submit asserts the transient `space/enable-sync` command.
           Lives in this always-rendered directory view (with the topbar)
           so sync can be enabled on any space, including an empty one. -->
      <wa-dialog id="enable-sync" label="Enable sync" class="workspace__sync-dialog">
        <form id="enable-sync-form" class="workspace__sync-form" onsubmit=space/enable-sync>
          <input type="hidden" name="name">
          <wa-input name="remote" label="Sync server" placeholder="https://…" autocomplete="off" autofocus required></wa-input>
          <tonk-default-remote field="remote">Use this server</tonk-default-remote>
        </form>
        <wa-button slot="footer" variant="neutral" appearance="plain" data-dialog="close">Cancel</wa-button>
        <wa-button slot="footer" variant="primary" type="submit" form="enable-sync-form" data-dialog="close">Enable</wa-button>
      </wa-dialog>

      <!-- Share dialog. `<tonk-credential>` generates an ephemeral keypair
           in the browser: it fills the form's hidden `audience` input with
           the public did:key (the command reads it) and threads the same
           did:key into the nested `<tonk-display>`'s `entity` plus the
           private seed into its `data-seed` (both via `bind:`). Submitting
           asserts `tonk/invite`; the worker delegates the origin repo to
           that DID and asserts the `invitation` fact keyed by the DID. The
           nested display then resolves that fact and composes the link:
           `?access={access}` (from the worker, non-secret) joined with
           `#{dom.host/data-seed}` (the browser-held seed) — so the secret
           never crosses to the worker or into the database. -->
      <wa-dialog id="share-repo" label="Share this repo" class="workspace__share-dialog">
        <tonk-credential>
          <form id="share-form" onsubmit=tonk/invite>
            <input type="hidden" name="audience" bind:did="value">
          </form>
          <tonk-display
            model=invitation
            bind:did="entity"
            bind:seed="data-seed"
            bind:base="data-base">
            <!-- Until the worker asserts the invitation fact for this
                 audience DID (after "Create link" is submitted), the
                 display has no entity to render. Provide a `no-entity` slot
                 child so it shows a quiet pending affordance instead of the
                 built-in "Not found" callout — the link is being generated,
                 not missing. -->
            <div slot="no-entity" class="invite-link invite-link--pending">
              <wa-spinner></wa-spinner>
              <span>Generating link…</span>
            </div>
          </tonk-display>
        </tonk-credential>
        <wa-button slot="footer" variant="neutral" appearance="plain" data-dialog="close">Close</wa-button>
        <wa-button slot="footer" variant="primary" type="submit" form="share-form">Create link</wa-button>
      </wa-dialog>

      <tonk-display model=workspace/sheet data-active={active} />
    </div>


view/directory!:
  this: tonk:sheet-binder
  model: tonk:sheet
  display: |
    <div class="workspace">
      <style>
        /* Styling uses the app's Web Awesome design tokens (--wa-*)
           rather than hardcoded colours, so the viewer follows the
           active theme and light/dark automatically. */
        .workspace {
          display: flex;
          flex-direction: column;
          /* Content-driven by default: as a board tile the workspace
             takes only the space it needs. When it is the page's own
             view, the route gives the view root a viewport-min height
             (see the `.display-route` rule in the app stylesheet), so
             the tab strip pins to the bottom there. */
          font-family: var(--wa-font-family-body);
          color: var(--wa-color-text-normal);
          /* Transparent so the page's dot-grid paper shows through
             (matching the wireframe). */
          background: transparent;
        }
        /* The binder fills the space below the top bar: the active sheet
           panel fills the rest, the projected tab strip pins to the
           bottom. */
        .workspace__binder {
          display: flex;
          flex-direction: column;
          flex: 1;
          min-height: 0;
        }

        /* The view mounts each sheet through a `<tonk-display>` wrapper;
           those wrappers are the binder's flex children (the panels).
           The active panel FILLS the available height; the rest
           collapse (their inner <tonk-sheet> is `hidden`). Scrolling
           happens inside the sheet's card. */
        .workspace__binder > tonk-display {
          display: flex;
          flex-direction: column;
          flex: 1;
          min-height: 0;
          padding: var(--wa-space-l);
          box-sizing: border-box;
          order: 1;
        }
        .workspace__binder > tonk-display:not(:has(tonk-sheet:not([hidden]))) {
          display: none;
        }
        .workspace__binder > tonk-display > tonk-view {
          display: flex;
          flex-direction: column;
          flex: 1;
          min-height: 0;
        }

        /* The sheet card: a header strip the sheet projects from its
           attributes, over the sheet's content. Transparent body so the
           page's dot-grid shows through; bordered frame. */
        .workspace__binder tonk-sheet {
          display: flex;
          flex-direction: column;
          flex: 1;
          min-height: 0;
          color: inherit;
          font-family: inherit;
          border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          background: transparent;
          overflow: hidden;
        }
        /* The card body: everything after the projected header. The
           sheet's content <tonk-display> is the last child; it scrolls. */
        .workspace__binder tonk-sheet > tonk-display {
          flex: 1;
          min-height: 0;
          overflow: auto;
        }
        .workspace__binder tonk-sheet > tonk-display > tonk-view {
          display: block;
          min-height: 100%;
        }
        /* A portal sheet: `<tonk-portal>`'s iframe has no intrinsic
           content height, so a percentage height collapses it to the
           iframe's default 150px — a percentage can't resolve against
           the flex-grown content display (its height is not "definite"
           in that sense). Carry the height down the whole portal
           sub-chain by flex instead, the same fill the directory chain
           uses: the content display and its view each fill by `flex: 1`,
           and the portal fills the view. No percentages, so nothing to
           collapse. */
        .workspace__binder tonk-sheet > tonk-display:has(> tonk-view > tonk-portal) {
          display: flex;
          flex-direction: column;
        }
        .workspace__binder tonk-sheet > tonk-display > tonk-view:has(> tonk-portal) {
          display: flex;
          flex-direction: column;
          flex: 1;
          min-height: 0;
        }
        .workspace__binder tonk-sheet > tonk-display > tonk-view > tonk-portal {
          display: block;
          flex: 1;
          min-height: 0;
          /* Positioning context for the iframe below. */
          position: relative;
        }
        /* `<tonk-portal>` sizes its iframe `height: 100%`, but that
           percentage can't resolve against the portal's flex-grown
           height (flex-grown is not "definite" for a replaced element's
           percentage), so the iframe collapses to its intrinsic 150px.
           Absolutely positioning it fills the portal: an abs box's
           percentage height resolves against its containing block's used
           height, flex-grown or not. */
        .workspace__binder tonk-sheet > tonk-display > tonk-view > tonk-portal > iframe {
          position: absolute;
          inset: 0;
        }

        /* The card header the sheet projects (status dot + name +
           subtitle). A surface fill so it reads as chrome over the
           transparent body. */
        .tonk-sheet__head {
          display: flex;
          align-items: center;
          gap: var(--wa-space-s);
          flex: none;
          padding: var(--wa-space-s) var(--wa-space-m);
          background: var(--wa-color-surface-raised);
          border-bottom: var(--wa-border-width-s) solid var(--wa-color-surface-border);
        }
        .tonk-sheet__dot {
          width: 7px; height: 7px; border-radius: 50%;
          background: currentColor; flex: none;
        }
        .tonk-sheet__name { font-size: var(--wa-font-size-s); font-weight: var(--wa-font-weight-semibold); }
        .tonk-sheet__meta { font-size: var(--wa-font-size-s); color: var(--wa-color-text-quiet); }

        /* The bottom tab strip the binder projects. Equal-width bullet
           segments separated by rules; the active tab gets a brand
           accent top bar. The binder sets the CSS `order` per tab. */
        .tonk-sheet-binder__tabs {
          display: flex;
          align-items: stretch;
          flex: none;
          height: 48px;
          order: 2;
          /* Left inset so the first tab aligns with the sheet card's
             left edge (the panel padding above). */
          padding-left: var(--wa-space-l);
          /* A surface fill matching the top bar (not the darker lowered
             surface). */
          background: var(--wa-color-surface-raised);
          border-top: var(--wa-border-width-s) solid var(--wa-color-surface-border);
        }
        /* Tabs are content-width (short), left-aligned, separated by
           rules — not stretched to fill the strip (the wireframe). */
        .tonk-sheet-binder__tab {
          flex: none;
          display: inline-flex;
          align-items: center;
          gap: var(--wa-space-s);
          padding: 0 var(--wa-space-l);
          font: inherit;
          font-size: var(--wa-font-size-s);
          color: var(--wa-color-text-quiet);
          background: transparent;
          border: none;
          border-right: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          border-top: 2px solid transparent;
          cursor: pointer;
          white-space: nowrap;
        }
        /* The leading status bullet (hollow when inactive). */
        .tonk-sheet-binder__tab::before {
          content: "";
          width: 7px; height: 7px;
          border-radius: 50%;
          border: var(--wa-border-width-s) solid currentColor;
          background: transparent;
          flex: none;
        }
        .tonk-sheet-binder__tab:hover {
          color: var(--wa-color-text-normal);
          background: var(--wa-color-neutral-fill-quiet);
        }

        /* Active tab: brand-accent top bar, raised surface, filled
           bullet, normal-weight bright text — the selected sheet. */
        .tonk-sheet-binder__tab.is-active {
          color: var(--wa-color-text-normal);
          font-weight: var(--wa-font-weight-semibold);
          background: var(--wa-color-surface-default);
          border-top-color: var(--wa-color-brand-fill-loud);
        }
        .tonk-sheet-binder__tab.is-active::before {
          background: var(--wa-color-brand-fill-loud);
          border-color: var(--wa-color-brand-fill-loud);
        }

        /* The close button the binder appends to each tab. A small
           `×` glyph after the title, hidden until the tab is hovered
           (the wireframe's editor-tab behaviour). It brightens to the
           danger colour on its own hover. */
        .tonk-sheet-binder__close {
          width: 16px; height: 16px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          flex: none;
          font-size: var(--wa-font-size-m);
          line-height: 1;
          color: var(--wa-color-text-quiet);
          border-radius: var(--wa-border-radius-s);
          visibility: hidden;
          cursor: pointer;
        }
        .tonk-sheet-binder__tab:hover .tonk-sheet-binder__close,
        .tonk-sheet-binder__tab.is-active .tonk-sheet-binder__close {
          visibility: visible;
        }
        .tonk-sheet-binder__close:hover {
          color: var(--wa-color-danger-on-quiet);
          background: var(--wa-color-danger-fill-quiet);
        }

        /* The "+" add-sheet button the binder appends after the tabs. A
           dashed-border square that solidifies and brightens on hover,
           matching the wireframe's `tab-strip__add`. */
        .tonk-sheet-binder__add {
          align-self: center;
          flex: none;
          margin-left: var(--wa-space-s);
          width: 28px; height: 28px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          font-size: var(--wa-font-size-l);
          line-height: 1;
          color: var(--wa-color-text-quiet);
          background: transparent;
          border: var(--wa-border-width-s) dashed var(--wa-color-surface-border);
          border-radius: var(--wa-border-radius-s);
          cursor: pointer;
        }
        .tonk-sheet-binder__add:hover {
          color: var(--wa-color-text-normal);
          border-style: solid;
          border-color: var(--wa-color-text-normal);
        }

        /* The inline create form the binder swaps in for the "+" button
           while naming a new sheet: an underlined name input plus
           create / esc controls, with a brand-accent top bar like an
           active tab. */
        .tonk-sheet-binder__create {
          align-self: stretch;
          display: inline-flex;
          align-items: center;
          gap: var(--wa-space-s);
          margin-left: var(--wa-space-s);
          padding: 0 var(--wa-space-m);
          border-top: 2px solid var(--wa-color-brand-fill-loud);
          background: var(--wa-color-surface-default);
        }
        .tonk-sheet-binder__create-input {
          min-width: 160px;
          padding: var(--wa-space-2xs) 0;
          font: inherit;
          font-size: var(--wa-font-size-s);
          color: var(--wa-color-text-normal);
          background: transparent;
          border: none;
          border-bottom: var(--wa-border-width-s) solid var(--wa-color-text-normal);
          outline: none;
        }
        .tonk-sheet-binder__create-input::placeholder { color: var(--wa-color-text-quiet); }
        .tonk-sheet-binder__create-commit,
        .tonk-sheet-binder__create-cancel {
          flex: none;
          font: inherit;
          cursor: pointer;
          border: none;
          border-radius: var(--wa-border-radius-s);
          padding: var(--wa-space-2xs) var(--wa-space-s);
        }
        .tonk-sheet-binder__create-commit {
          font-size: var(--wa-font-size-s);
          color: var(--wa-color-brand-on-loud);
          background: var(--wa-color-brand-fill-loud);
        }
        .tonk-sheet-binder__create-cancel {
          font-family: var(--wa-font-family-code);
          font-size: var(--wa-font-size-xs);
          color: var(--wa-color-text-quiet);
          background: transparent;
        }
        .tonk-sheet-binder__create-cancel:hover { color: var(--wa-color-text-normal); }


        /* Empty state. The binder reveals `[slot="empty"]` and flags
           itself `data-empty` when it has no sheets. The launchpad fills
           the canvas area above the (add-only) tab strip, centered over
           the dot-grid paper - matching the wireframe's "empty repo"
           frame. The binder hides it (`hidden`) whenever a sheet exists. */
        .workspace-launchpad {
          flex: 1 1 auto;
          order: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 0;
          padding: var(--wa-space-2xl);
        }
        .workspace-launchpad[hidden] { display: none; }
        .workspace-launchpad__inner {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: var(--wa-space-m);
          max-width: 28rem;
          text-align: center;
        }
        /* Opt out of the global heading highlight-cover (the dark filled
           box from styles.css `h1..h6`): a plain heading in the normal
           text colour reads correctly in both light and dark. */
        .workspace-launchpad__title {
          display: block;
          margin: 0;
          padding: 0;
          background: none;
          font-family: var(--wa-font-family-code);
          font-size: var(--wa-font-size-2xl);
          font-weight: var(--wa-font-weight-bold);
          letter-spacing: normal;
          color: var(--wa-color-text-normal);
        }
        .workspace-launchpad__hint {
          margin: 0;
          color: var(--wa-color-text-quiet);
          font-family: var(--wa-font-family-code);
          font-size: var(--wa-font-size-s);
        }
        /* The prominent "add artifact" button: a hatched/dashed frame
           that solidifies on hover, echoing the strip's "+" add control
           and the wireframe's center call to action. */
        .workspace-launchpad__add {
          margin-top: var(--wa-space-s);
          padding: var(--wa-space-s) var(--wa-space-l);
          font-family: var(--wa-font-family-code);
          font-size: var(--wa-font-size-m);
          font-weight: var(--wa-font-weight-semibold);
          color: var(--wa-color-text-normal);
          background: transparent;
          border: var(--wa-border-width-s) dashed var(--wa-color-surface-border);
          border-radius: var(--wa-border-radius-s);
          cursor: pointer;
        }
        .workspace-launchpad__add:hover {
          border-style: solid;
          border-color: var(--wa-color-text-normal);
          background: var(--wa-color-neutral-fill-quiet);
        }
      </style>

      <tonk-sheet-binder active={dom.host/data-active} class="workspace__binder" onactivate=workspace/activate-sheet onclose=workspace/close-sheet oncreate=workspace/create-sheet>
        <div slot="empty" class="workspace-launchpad" hidden>
          <div class="workspace-launchpad__inner">
            <h1 class="workspace-launchpad__title">nothing here yet.</h1>
            <p class="workspace-launchpad__hint">start by creating an artifact &mdash; the agent will fill it.</p>
            <button type="button" class="workspace-launchpad__add" data-create>+ add artifact</button>
          </div>
        </div>
        <tonk-display entity={this} model=tonk:sheet />
      </tonk-sheet-binder>
    </div>

command!: &tonk/initialize
  description: Initialize a freshly created or joined replica
  with:
    reason:
       description: Reason to initialize the replica
       as: text
       the: xyz.tonk.init/reason

concept!: &tonk/binder
  this: tonk:binder
  description: A binder view of the the tonk replica
  with:
    active:
      description: Currently active sheet
      the: xyz.tonk.binder/active
      as: entity
    subject:
      description: >
        The repository's subject DID. The binder and the replica share
        an entity, so the binder carries the replica's `subject` and the
        shell view can read `{subject}` directly to mount the
        repository-name banner — no bridge view needed.
      the: dialog.origin/subject
      as: entity

# Tab selection: when an `activate-sheet` command fires, point the
# binder's `active` at the clicked sheet (replacing the prior
# selection). The binder is the replica's (one per device, bound
# through `tonk/replica`), so the command needs only the sheet - no
# binder id plumbed through the DOM. Mirrors the close/create rules.
rule!:
  assert!: tonk/binder
  when:
    - assert: workspace/activate-sheet
      where: { sheet: ?active }
    - assert: tonk/replica
      where: { this: ?this, subject: ?subject }

# Sets active sheet of the binder to about:blank unless
# it already has an active sheet. This ensures that every
# replica also matches a binder model.
rule!:
  assert!: tonk/binder
  when:
    - assert: tonk/initialize
      where:
         this: ?init
    - assert: tonk/replica
      where:
         this: ?this
         subject: ?subject
    - assert: ==
      where:
        this: ?active
        is: about:blank
  unless:
    - assert: tonk/binder
      where:
        this: ?this

rule!:
  assert!: tonk/repository
  when:
    - assert: tonk/initialize
      where:
         this: ?init
    - assert: tonk/replica
      where:
         subject: ?this
    - assert: ==
      where:
        this: ?name
        is: Untitled
  unless:
    - assert: tonk/repository
      where:
        this: ?this

tonk/initialize!:
   reason: Initialize a new tonk repository

# ============================================================
# Tree inspector — `<tonk-tree>` over the branch's search-tree
# index. Visit `/space/{repo}/dialog:diagnose` to explore the
# dialog-search-tree state under the DB: index/segment nodes,
# their keys (color-coded components, shared prefixes dimmed),
# byte sizes, and entries. The view renders `<tonk-tree>`, which
# resolves its repository from the `<tonk-repository>` routing
# ancestor and drives itself from the worker's `tree/*` query
# formulas — no entity needed (it inspects the whole branch).
# ============================================================
concept!: &diagnose
  this: dialog:diagnose
  description: Marker model for the search-tree inspector view.
  with:
    name:
      description: A label for the inspector (unused; satisfies the concept shape).
      the: dialog.diagnose/name
      cardinality: one
      as: text

# A directory-kind view (not a plain `view!`): a `/space/{repo}/dialog:diagnose`
# URL carries no entity, so `<tonk-display>` resolves a `view/directory`
# for the model. The inspector needs no entity — it renders the whole
# branch's tree — so the directory view is the right kind.
view/directory!:
  this: id:dialog:diagnose/view
  model: dialog:diagnose
  display: |
    <tonk-tree></tonk-tree>
