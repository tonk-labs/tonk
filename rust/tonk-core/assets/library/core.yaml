# Tonk standard library.
#
# The built-in concepts, views, commands, and rules the runtime
# seeds into a repository at creation. Served as a static asset
# (`/library/core.yaml`) and fetched + lowered by the service
# worker in the repository-creation path, rather than embedded at
# compile time. Editing this file changes the standard library
# without rebuilding the wasm.
#
# Lowering runs `analyze_local` (no running system), so every
# `&anchor` / bare-name reference must resolve within this file.
#
# Two source sections, formerly `tonk-workspace/bootstrap.yaml` and
# `tonk-board/bootstrap.yaml`. The `view` concept is shared between
# them (pinned to `tonk:view`) and declared once here.

# ============================================================
# VIEW
# ============================================================

# The `view` concept. Shape matches what `<tonk-display>` queries
# (resolve.rs `view_predicate`): a `concept` (the concept it renders)
# and a `display` (the HTML template). Pinned to the stable
# `tonk:view` URI so <tonk-display> can refer to the built-in view
# concept directly, without a name-resolution round-trip.
concept!: &view
  this: tonk:view
  description: A display template (concept, display) for rendering an entity
  with:
    concept:
      description: Concept this view renders
      the: xyz.tonk.view/concept
      cardinality: one
      as: entity
    display:
      description: HTML template for the view
      the: xyz.tonk.view/display
      cardinality: one
      as: text

concept!: &view/directory
  this: tonk:view/directory
  description: A directory view used by tonk-display when entity is not set.
  with:
    concept:
      description: Concept this view renders
      the: xyz.tonk.view/concept
      cardinality: one
      as: entity
    display:
      description: HTML template for the view
      the: xyz.tonk.view/directory
      cardinality: one
      as: text

# The default directory view: `concept: tonk:_` matches any concept with no
# specific `view/directory`. `tonk:_` is the wildcard-concept sentinel — a
# valid entity URI standing in for "no specific concept" (the `concept` field
# is `as: entity`, so the value must be a real entity, not bare text).
# <tonk-display> with no `entity` resolves a directory view for the concept
# first; finding none, it falls back to this. It renders the concept's
# instances in a <wa-carousel>, one slide per instance, each a nested
# single-entity <tonk-display> (which then resolves its own view, or this
# default's detail counterpart). The nested `concept` is threaded from the
# host via `{dom.host/concept}`, since an instance carries no pointer to
# its own concept.
view/directory!:
  this: id:tonk:view/directory/default
  concept: tonk:_
  display: |
    <wa-carousel class="vertical seamless" pagination orientation="vertical">
      <wa-carousel-item subject={this}>
        <tonk-display this={this} concept={dom.host/concept} />
      </wa-carousel-item>
    </wa-carousel>


# ============================================================
# WORKSPACE
# ============================================================

# The `artifact` concept. Binds an entity to a concept and a view,
# plus the tab metadata (title, icon) the viewer shell shows. Its
# (entity, concept, view) map one-to-one onto
# `<tonk-display entity concept view>`. Pinned to `tonk:artifact` so
# the viewer can query artifacts by a stable concept entity.
concept!: &artifact
  this: tonk:artifact
  description: An entity displayed as a sheet/tab in the viewer.
  with:
    title:
      description: Title shown in the tab
      the: xyz.tonk.artifact/title
      cardinality: one
      as: text
    subtitle:
      description: Dimmed metadata line shown after the name in the card header
      the: xyz.tonk.artifact/subtitle
      cardinality: one
      as: text
    icon:
      description: Icon shown in the tab
      the: xyz.tonk.artifact/icon
      cardinality: one
      as: text
    entity:
      description: Entity displayed in the sheet
      the: xyz.tonk.artifact/entity
      cardinality: one
      as: entity
    concept:
      description: Concept used to display the entity
      the: xyz.tonk.artifact/concept
      cardinality: one
      as: entity
    view:
      description: View concept used to display the entity
      the: xyz.tonk.artifact/view
      cardinality: one
      as: entity

# The `empty-artifact` concept: a freshly created, not-yet-configured
# sheet. It carries only a `title` (the typed name) on the shared
# `xyz.tonk.artifact/title` attribute, and its view renders the
# "empty artifact" canvas (a deeplink to hand to an agent, plus
# instructions). Pinned to `tonk:empty-artifact` so the create rule can
# point a new sheet's `concept` at it by a stable URI.
concept!: &empty-artifact
  this: tonk:empty-artifact
  description: A newly created, not-yet-configured sheet awaiting content.
  with:
    title:
      description: The artifact's name, shown on the empty canvas
      the: xyz.tonk.artifact/title
      cardinality: one
      as: text

# The `sheet` concept: one tab in a workspace. A sheet is an
# artifact (same title/icon/entity/concept/view fields, same attribute
# URIs) plus an `order` lexicographic key that positions the tab. So
# every sheet is also a valid artifact; the extra `order` field is
# what makes it a workspace member.
concept!: &workspace/sheet
  this: tonk:sheet
  description: A workspace tab - an artifact plus a lexicographic order key.
  with:
    title:
      description: Title shown in the tab
      the: xyz.tonk.artifact/title
      cardinality: one
      as: text
    subtitle:
      description: Dimmed metadata line shown after the name in the card header
      the: xyz.tonk.artifact/subtitle
      cardinality: one
      as: text
    icon:
      description: Icon shown in the tab
      the: xyz.tonk.artifact/icon
      cardinality: one
      as: text
    entity:
      description: Entity displayed in the sheet
      the: xyz.tonk.artifact/entity
      cardinality: one
      as: entity
    concept:
      description: Concept used to display the entity
      the: xyz.tonk.artifact/concept
      cardinality: one
      as: entity
    view:
      description: View concept used to display the entity
      the: xyz.tonk.artifact/view
      cardinality: one
      as: entity
    order:
      description: Lexicographic order key positioning the tab
      the: xyz.tonk.sheet/order
      cardinality: one
      as: text

# Tab selection. Clicking a tab fires the transient `activate-sheet`
# command, reading which sheet was clicked from the binder's `activate`
# event detail. The inductive rule below points the binder's
# cardinality-one `active` field at the clicked sheet (replacing the
# prior selection). The command itself is swept after the cycle - only
# the `active` pointer persists.
command!: &workspace/activate-sheet
  description: A request to make `sheet` the active sheet of the binder.
  with:
    sheet:
      description: The sheet to activate, from the binder's `activate` event detail
      the: dom.event.detail/sheet
      as: entity

# The Enable-sync command. Submitting the topbar's "Enable sync" form
# asserts this transient command; the worker's `CreateSpaceHandler`
# (which serves both this and `space/create`, keyed on the shared `name`
# attribute) idempotently attaches the remote to the named space — the
# repo already exists, so the create step no-ops and only the attach
# runs. `remote` is the URL typed (or the `<tonk-default-remote>` button
# populated); `name` is the space's local repository name. The workspace
# concept's `{name}` is a display label, NOT the repo name, so the
# `<tonk-sync-state>` element (which resolves the repo from its
# `<tonk-repository>` ancestor) stamps the real name into the form's
# hidden `name` input on click — the one identifier notation can't read
# from the event. `prevent-default` stops the page reloading.
command!: &space/enable-sync
  description: A request to attach a sync remote to the current space.
  with:
    name:
      description: The space's local repository name, stamped into the hidden `name` input
      the: dom.event.current-target.elements.name/value
      as: text
    remote:
      description: The sync URL, read from the form's `remote` input on submit
      the: dom.event.current-target.elements.remote/value
      as: text
    prevent-default:
      description: Stop the form submission from reloading the page
      the: dom.event.do/prevent-default

# Mint a repository invite. Clicking Share submits this transient; the
# worker's `InviteHandler` generates a fresh membership keypair, delegates
# the *origin* repository's access to its DID, asserts a durable
# `tonk:authorization` fact (the public delegation chain) and asserts the
# private seed as a `tonk:credential` into the reactor's session overlay
# (never replicated). The repository is not a field here — the handler
# reads it from the command's origin (the branch the commit landed in).
# `time` carries the submit event's timestamp so each click is a distinct
# transient and reliably re-fires the handler (rotating the credential).
command!: &tonk/invite
  this: tonk:invite
  description: Mint a repo invite — generates a membership keypair and delegation.
  with:
    time:
      description: The submit event's timestamp; makes each click distinct.
      the: dom.event/time-stamp
      as: float
    marker:
      description: |
          Per-command marker read from the share form's `data-invite`. Gives
          `tonk:invite` an attribute no other command carries, so a
          `tonk:pause-sync` transient (otherwise an identical {this, time}
          shape) does not also decode as an invite.
      the: dom.event.current-target.dataset/invite
      as: entity
    prevent-default:
      description: Stop the form submission from reloading the page
      the: dom.event.do/prevent-default

# Toggle auto-sync for the space in scope. The sync chip submits this (via the
# confirm dialog when pausing, directly via the resume overlay when paused).
# `time` carries the click timestamp so each submit is a distinct transient and
# reliably re-fires the toggle handler. The worker reads the origin repo, flips
# the durable `enabled` preference, and publishes the matching status — the
# command carries no payload beyond the timestamp.
command!: &tonk/pause-sync
  this: tonk:pause-sync
  description: Toggle auto-sync (pause ⇄ resume) for the space in scope.
  with:
    time:
      description: The submit event's timestamp; makes each click distinct.
      the: dom.event/time-stamp
      as: float
    marker:
      description: |
          Per-command marker read from the pause form's `data-pause-sync`.
          Gives `tonk:pause-sync` an attribute no other command carries, so
          this transient does not also decode as `tonk:invite`.
      the: dom.event.current-target.dataset/pause-sync
      as: entity
    prevent-default:
      description: Stop the form submission from reloading the page
      the: dom.event.do/prevent-default

# The durable, public half of an invite: the base58 delegation chain the
# handler minted, keyed by the membership DID. Replicates like any fact —
# a delegation chain is a scoped capability, not a secret.
concept!: &authorization
  this: tonk:authorization
  description: A delegation chain granting access to a repo, keyed by membership DID.
  with:
    proof:
      description: base58 delegation chain — the `?access=` part of the invite URL.
      the: xyz.tonk.authorization/proof
      cardinality: one
      as: text
    remote:
      description: Sync endpoint — the `&remote=` part; empty when local-only.
      the: xyz.tonk.authorization/remote
      cardinality: one
      as: text

# The private, ephemeral half of an invite: the membership keypair's seed.
# Asserted only into the reactor's session overlay (never written to the
# branch tree, never replicated), so the secret stays out of storage. Keyed
# by the same membership DID as its `tonk:authorization`, so `tonk:invitation`
# joins the two.
concept!: &credential
  this: tonk:credential
  description: The private ed25519 seed of a membership principal (overlay-only).
  with:
    seed:
      description: base58 keypair seed — the `#` fragment of the invite URL.
      the: xyz.tonk.credential/seed
      cardinality: one
      as: text

# The invite, as a join of the public `tonk:authorization` and the
# overlay-only `tonk:credential` on the membership DID. Declaring all three
# attributes makes this concept resolve only an entity that has both halves
# — the durable proof/remote AND the overlay seed — so the share view
# renders only once the handler has asserted both.
concept!: &invitation
  this: tonk:invitation
  description: An invite that can be used to join a space (authorization + credential).
  with:
    access:
      description: base58 delegation chain — the `?access=` part of the invite URL.
      the: xyz.tonk.authorization/proof
      cardinality: one
      as: text
    remote:
      description: Sync endpoint — the `&remote=` part; empty when local-only.
      the: xyz.tonk.authorization/remote
      cardinality: one
      as: text
    code:
      description: base58 keypair seed — the `#` fragment of the invite URL.
      the: xyz.tonk.credential/seed
      cardinality: one
      as: text

# The invite-link view — the default view for the `invitation` concept, so
# `<tonk-display concept=invitation>` mounts it with no explicit `view=`. It
# renders only once the handler has asserted both halves for the repo's
# subject (before that the display is empty). The readonly input shows the
# assembled absolute URL: `{base}?access={access}{remote}#{code}`, where
# `base` (`{origin}/join`) is the `data-base` host attribute a wrapping
# `<tonk-origin>` set, `access`/`remote` are the durable authorization, and
# `code` is the overlay-only seed. `remote` is a ready-to-append
# `&remote=<url>` suffix (empty for a local-only repo) so the recipient
# knows where to sync from. `<wa-copy-button>` copies the same value.
view!: &invitation/link
  this: id:invitation/link
  concept: invitation
  display: |
    <div class="invite-link">
      <style>
        /* Full-width invite field: the URL input fills the row and the
           copy button rides inside it as a suffix, so it reads as one
           control (matching the wireframe) rather than a narrow box with
           a tiny detached icon. */
        .invite-link { display: block; }
        .invite-link__url { display: block; width: 100%; }
      </style>
      <wa-input
        class="invite-link__url"
        label="Invite link"
        readonly
        value="{dom.host/data-base}?access={access}{remote}#{code}"
      >
        <wa-copy-button
          slot="end"
          class="invite-link__copy"
          value="{dom.host/data-base}?access={access}{remote}#{code}"
        ></wa-copy-button>
      </wa-input>
    </div>

# The agent-invite concept: the live `tonk:invitation` joined with the
# repository's display `name`, both keyed by the repo subject. The rule
# below derives it so the agent-prompt view can template the repo name and
# the invite URL from one concept. It resolves only once the invitation's
# both halves (durable authorization + overlay credential) exist, so the
# canvas shows "Generating link…" until the mint lands.
concept!: &tonk/agent-invite
  this: tonk:agent-invite
  description: A live invite joined with the repo's display name, for the agent prompt.
  with:
    name:
      description: The repository's display name.
      the: xyz.tonk.repo/name
      cardinality: one
      as: text
    access:
      description: base58 delegation chain — the `?access=` part of the invite URL.
      the: xyz.tonk.authorization/proof
      cardinality: one
      as: text
    remote:
      description: Sync endpoint — the `&remote=` part; empty when local-only.
      the: xyz.tonk.authorization/remote
      cardinality: one
      as: text
    code:
      description: base58 keypair seed — the `#` fragment of the invite URL.
      the: xyz.tonk.credential/seed
      cardinality: one
      as: text

# Derive `tonk:agent-invite` by joining the repo's `tonk:repository` name
# and its live `tonk:invitation` on the same subject (`?this`). `?this`
# becomes the derived entity; the same-named vars fill the conclusion's
# fields.
rule!:
  description: Joins the repo name with the live invitation for the agent prompt
  assert!: tonk/agent-invite
  when:
    - assert: tonk/repository
      where:
        this: ?this
        name: ?name
    - assert: invitation
      where:
        this: ?this
        access: ?access
        remote: ?remote
        code: ?code

# The agent-prompt view — the default view for `tonk:agent-invite`, so
# `<tonk-display concept=tonk:agent-invite>` mounts it with no explicit
# `view=`. It renders a full, paste-able agent prompt (task + bootstrap
# commands) with the minted invite URL embedded, instead of a bare link.
# The repo `{name}` and invite `{access}`/`{remote}`/`{code}` are concept
# fields; the page title arrives as the `data-page` host attribute and the
# origin base as `data-base` (from `<tonk-origin>`). `<wa-copy-button>`
# copies the assembled prompt via its `value`.
view!:
  this: id:agent-invite/prompt
  concept: tonk:agent-invite
  display: |
    <div class="agent-prompt">
      <style>
        .agent-prompt { border: var(--wa-border-width-s) solid var(--wa-color-surface-border); border-radius: var(--wa-border-radius-m); background: var(--wa-color-surface-lowered); overflow: hidden; }
        .agent-prompt__bar { display: flex; align-items: center; justify-content: space-between; padding: var(--wa-space-s) var(--wa-space-m); border-bottom: var(--wa-border-width-s) solid var(--wa-color-surface-border); }
        .agent-prompt__label { font-family: var(--wa-font-family-code); font-size: var(--wa-font-size-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--wa-color-text-quiet); }
        .agent-prompt__copy { color: var(--wa-color-text-quiet); }
        .agent-prompt__copy::part(button) {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          padding: var(--wa-space-xs);
          border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          border-radius: var(--wa-border-radius-m);
          background: var(--wa-color-surface-default);
          color: var(--wa-color-text-quiet);
          transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
        }
        .agent-prompt__copy::part(button):hover {
          background: var(--wa-color-neutral-fill-quiet);
          border-color: var(--wa-color-neutral-border-loud);
          color: var(--wa-color-text-normal);
        }
        .agent-prompt__copy::part(copy-icon) { font-size: 15px; }
        .agent-prompt__pre { margin: 0; padding: var(--wa-space-l) var(--wa-space-m); font-family: var(--wa-font-family-code); font-size: var(--wa-font-size-s); line-height: var(--wa-line-height-normal); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--wa-color-text-normal); }
      </style>
      <div class="agent-prompt__bar">
        <span class="agent-prompt__label">prompt for your agent</span>
        <wa-copy-button class="agent-prompt__copy" value="You're helping build the &quot;{name}&quot; repo.

    Claim access and orient yourself, then fill the &quot;{dom.host/data-page}&quot; page. Work the repo's data, schemas and views — not this page alone. Everything you change lands here for review before it's applied.

      mkdir -p ~/tonk/{name} &amp;&amp; cd ~/tonk/{name}
      tonk join '{dom.host/data-base}?access={access}{remote}#{code}'
      tonk guide        # how to drive the CLI
      tonk schema       # concepts already on the branch

    Then build."></wa-copy-button>
      </div>
      <pre class="agent-prompt__pre">You're helping build the "{name}" repo.

    Claim access and orient yourself, then fill the "{dom.host/data-page}" page. Work the repo's data, schemas and views — not this page alone. Everything you change lands here for review before it's applied.

      mkdir -p ~/tonk/{name} &amp;&amp; cd ~/tonk/{name}
      tonk join '{dom.host/data-base}?access={access}{remote}#{code}'
      tonk guide        # how to drive the CLI
      tonk schema       # concepts already on the branch

    Then build.</pre>
    </div>

# A space member, as seen in the "shared with" roster. Reads the
# `Membership` + `MemberRole` facts the worker records on the content
# branch (the synced branch, so the roster converges across the space).
# `member` is the member profile's DID entity; `role` is `tonk:founder`
# for the creator or `tonk:member` for invite claimers. Declaring both
# attributes makes an instance resolve only once its role is stamped.
concept!: &member
  this: tonk:member
  description: A member of a space — a profile on the roster.
  with:
    member:
      description: The member profile's DID (the `member` of the Membership)
      the: xyz.tonk.membership/member
      cardinality: one
      as: entity
    role:
      description: "The member's role: tonk:founder (creator) or tonk:member (joiner)"
      the: xyz.tonk.membership/role
      cardinality: one
      as: entity
    name:
      description: The member's self-asserted display name for this space
      the: xyz.tonk.membership/name
      cardinality: one
      as: text

# A single roster row — the default view for `concept: tonk:member`. Each
# member is one entry in the "shared with" list: a sigil-glyph avatar, the
# member's display name (with the DID tail beneath as a fallback id), and a
# role badge.
#
# The `<tonk-sigil>` avatar masks against a sprite that the sealed guest
# loads over the host bridge and installs as the global default (see
# `load_sigil_sprite` in tonk-guest) — so the identity glyph renders inside
# the opaque iframe with no cross-origin fetch. `did={member}` seeds it from
# the member DID so the glyph matches everywhere that member is shown.
#
# The DID's last 8 chars sit under the name as a stable disambiguator (the
# full value is in `title`); CSS `direction:rtl` truncation clips the HEAD
# with an ellipsis, leaving the tail visible.
#
# The role badge label comes from CSS `::after` keyed on `data-role`, so the
# raw `tonk:founder` / `tonk:member` URI never shows; the raw {role} text is
# kept (visually hidden) only to drive the attribute.
view!: &member/row
  this: id:tonk:member/row
  concept: tonk:member
  display: |
    <div class="roster__row" data-role={role}>
      <tonk-sigil class="roster__avatar" did={member}></tonk-sigil>
      <span class="roster__identity">
        <span class="roster__name">{name}</span>
        <span class="roster__did" title={member}><bdi>{member}</bdi></span>
      </span>
      <span class="roster__role" data-role={role}>{role}</span>
    </div>

# The roster — every `tonk:member` instance rendered as a row. Mounted
# in the invite panel via `<tonk-display concept=tonk:member>` (no
# `entity`, so the directory view resolves and iterates all members).
view/directory!:
  this: id:tonk:member/roster
  concept: tonk:member
  display: |
    <div class="roster">
      <style>
        /* Share-dialog roster section: a labelled block under the invite
           link. (Styled here because the roster view always mounts with
           it, and the share dialog has no <style> of its own.) */
        .roster-section {
          margin-top: var(--wa-space-l);
        }
        .roster-section__label {
          margin: 0 0 var(--wa-space-2xs);
          font-size: var(--wa-font-size-xs);
          text-transform: uppercase;
          letter-spacing: 0.06em;
          color: var(--wa-color-text-quiet);
        }
        .roster {
          display: flex;
          flex-direction: column;
        }
        /* Each member instance mounts as a nested <tonk-display>; let the
           row fill the width so avatar / did / badge lay out across it. */
        .roster > tonk-display,
        .roster > tonk-display > tonk-view {
          display: block;
        }
        .roster__row {
          display: flex;
          align-items: center;
          gap: var(--wa-space-s);
          padding: var(--wa-space-xs) 0;
          border-bottom: 1px solid var(--wa-color-surface-border);
          font-size: var(--wa-font-size-s);
        }
        .roster > tonk-display:last-child .roster__row {
          border-bottom: none;
        }
        /* The sigil-glyph avatar: a deterministic identity glyph hashed
           from the member DID, CLIPPED to a circle. The sigil renders a
           square SVG; `border-radius:50%` + `overflow:hidden` on the host
           clips it round (matching the wireframe avatars). The sprite is
           supplied by the sealed guest, so it paints inside the opaque
           iframe. */
        .roster__avatar {
          flex: none;
          width: 28px;
          height: 28px;
          border-radius: 50%;
          border: 1px solid var(--wa-color-surface-border);
          overflow: hidden;
        }
        /* The DID's LAST 8 chars: `direction:rtl` makes the overflow clip
           the head (with a leading ellipsis), so the tail stays visible.
           `<bdi>` keeps the DID itself rendering left-to-right inside the
           rtl box. Monospace, quiet — a fallback identity until names land. */
        /* The name + DID column. Grows to fill the row, pushing the role
           badge to the right edge. */
        .roster__identity {
          display: flex;
          flex-direction: column;
          flex: 1 1 auto;
          min-width: 0;
        }
        /* The display name — the primary identifier. */
        .roster__name {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          font-size: var(--wa-font-size-s);
          color: var(--wa-color-text-normal);
        }
        .roster__did {
          /* Cap to about the last 8 chars (+ the leading ellipsis); the
             full DID is in `title`. A quiet sub-line under the name. */
          max-width: 9ch;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          direction: rtl;
          text-align: left;
          font-family: var(--wa-font-family-code);
          font-size: var(--wa-font-size-xs);
          color: var(--wa-color-text-quiet);
        }
        /* The raw role URI is hidden; the badge label comes from ::after
           keyed on data-role. Square brutalist chip, matching the wireframe:
           founder is filled (loud), member is outline. */
        .roster__role {
          flex: none;
          font-size: 0;
          line-height: 0;
          color: transparent;
        }
        .roster__role::after {
          display: inline-block;
          font-family: var(--wa-font-family-code);
          font-size: 11px;
          line-height: 1.4;
          letter-spacing: 0.02em;
          text-transform: lowercase;
          padding: 1px 7px;
          border: 1px solid var(--wa-color-text-normal);
          color: var(--wa-color-text-normal);
          content: attr(data-role);
        }
        .roster__role[data-role="tonk:founder"]::after {
          content: "founder";
          background: var(--wa-color-text-normal);
          color: var(--wa-color-surface-default);
        }
        .roster__role[data-role="tonk:member"]::after {
          content: "member";
          color: var(--wa-color-text-quiet);
          border-color: var(--wa-color-surface-border);
        }
      </style>
      <tonk-display this={this} concept={dom.host/concept} />
    </div>

# The repository's own name, stored in its content branch so the repo
# is self-describing — the name travels with the repository rather than
# living only in the joining profile's replica index. The banner reads
# it via `<tonk-display concept=tonk:repository this={subject}>`;
# `tonk/rename-repository` edits it. The concept is pinned to
# `tonk:repository` so the display can resolve its view, but its
# *instances* are keyed by the replica's `subject` DID (the entity the
# name attaches to is the subject, there is no separate `subject`
# field). The banner falls back to "Untitled" when unset.
concept!: &tonk/repository
  this: tonk:repository
  description: A shared repository which is the subject of a tonk/replica.
  with:
    name:
      description: The repository's display name.
      the: xyz.tonk.repo/name
      cardinality: one
      as: text

# Rename the current repository. The editable banner input dispatches
# this on commit (blur/enter); `name` reads the input's value and
# `subject` reads the repository identity stamped on the banner so the
# rule below knows which repository to rename. The command is transient:
# the rule fires once and the command is swept before the durable commit.
command!: &tonk/rename-repository
  description: Rename the repository.
  with:
    subject:
      description: The repository's subject DID, stamped on the banner element.
      the: dom.event.current-target.dataset/subject
      as: entity
    name:
      description: The new name, read from the banner input's value on commit.
      the: dom.event.current-target/value
      as: text

# Apply the rename: assert the new `tonk/repository` name against the
# repository entity named by the command's `subject`. Binding `subject`
# to `?this` makes the command's subject DID the head's entity directly,
# so the (cardinality-one) name overwrites in place on that repository.
rule!:
  description: Renames the repository from a rename-repository command
  assert!: tonk/repository
  when:
    - assert: tonk/rename-repository
      where:
        subject: ?this
        name: ?name

# The repository-name banner: a borderless text input that looks like
# plain title text until focused. It shows the current `{name}` and
# carries the repository's identity (`{this}` is the subject DID) on
# `data-subject` so the `tonk/rename-repository` command can read it.
# `onchange` fires on commit (blur or Enter), reading the new value from
# `dom.event.current-target/value`; the rename rule above then writes it
# back. The banner mounts this via `<tonk-display concept=tonk:repository
# this={subject}>`, so a repo with no name yet (just the seeded
# "Untitled") still renders an editable field.
view!:
  this: id:tonk:repository/name-view
  concept: tonk:repository
  display: |
    <tonk-editable
      class="workspace__title-input"
      value={name}
      data-subject={this}
      onchange=tonk/rename-repository
      aria-label="Repository name"
    ></tonk-editable>

# ============================================================
# SELF-IDENTITY CHIP
# ============================================================

# The signed-in member's own identity for this space. Resolves against
# the `state:self` overlay the worker stamps on this space branch
# (mirroring the sync chip's `state:here`), so self-identity reaches
# the sealed iframe with no profile-branch access. `did` feeds the
# sigil; `name` is the editable display name.
concept!: &tonk/identity
  this: tonk:identity
  description: The signed-in member's own identity for this space.
  with:
    did:
      description: The self profile DID (feeds the sigil glyph).
      the: xyz.tonk.identity/did
      cardinality: one
      as: entity
    name:
      description: The self display name shown (and edited) in the chip.
      the: xyz.tonk.identity/name
      cardinality: one
      as: text

# The chip view: sigil + an inline-editable name. Editing commits on
# blur/Enter exactly like the repository-title banner, dispatching the
# worker-backed `profile/rename` command. `data-rename` carries the
# marker that distinguishes this transient from `tonk/rename-repository`.
view!:
  this: id:tonk:identity/chip
  concept: tonk:identity
  display: |
    <span class="workspace__identity">
      <tonk-sigil class="workspace__identity-avatar" did={did}></tonk-sigil>
      <tonk-editable
        class="workspace__identity-name"
        value={name}
        data-rename="tonk:profile"
        onchange=profile/rename
        aria-label="Your name"
      ></tonk-editable>
    </span>

# Rename the signed-in member (set their display name). The editable
# chip input dispatches this on commit (blur/Enter); `name` reads the
# input's value and `marker` reads the `data-rename` attribute so the
# worker handler matches this transient distinctly from
# `tonk/rename-repository`. No rule: a typed-Rust handler in
# tonk-worker reacts (it must reach the profile meta branch).
command!: &profile/rename
  description: Rename the signed-in member (set their display name).
  with:
    name:
      description: The new name, read from the editable's value on commit.
      the: dom.event.current-target/value
      as: text
    marker:
      description: Per-command marker (data-rename) distinguishing this from repo rename.
      the: dom.event.current-target.dataset/rename
      as: entity

# A read-only label view kind. Its `display` template lives under a
# distinct attribute (`xyz.tonk.view/label`) so a model can carry both
# the editable `tonk:view` banner above AND a plain-text label view
# without the two colliding under the default `tonk:view` resolution.
# `<tonk-display>` selects it explicitly with `view=tonk:view/label`.
concept!: &view/label
  this: tonk:view/label
  description: A plain, read-only label view selected via `view=tonk:view/label`.
  with:
    concept:
      description: Concept this view renders
      the: xyz.tonk.view/concept
      cardinality: one
      as: entity
    display:
      description: HTML template for the label view
      the: xyz.tonk.view/label
      cardinality: one
      as: text

# The repository's name as plain, non-editable text. The Hub card
# mounts this via `<tonk-display concept=tonk:repository this={subject}
# view=tonk:view/label>` inside a per-space `<tonk-repository>` routing
# context, so each card shows its own space's current name (read from
# that space's `tonk/repository`, the cross-device source of truth)
# rather than an editable banner. Falls back to nothing when unset.
view/label!:
  this: id:tonk:repository/label-view
  concept: tonk:repository
  display: |
    {name}

# Tab close. Clicking a tab's close button fires the transient
# `close-sheet` command carrying just the closed sheet. The rule below
# retracts the sheet's `order` so it no longer matches the sheet
# directory (the tab disappears; the underlying artifact survives).
# Reassigning the live selection to a neighbour is the binder element's
# job: on close it moves `active` to the neighbour and dispatches an
# `activate` (the single `active` writer), so no `next` field and no
# reassign rule are needed here.
command!: &workspace/close-sheet
  description: A request to close `sheet`, demoting it back to a plain artifact.
  with:
    sheet:
      description: |
        The sheet to close, from the binder's `close` event detail.
        Carried on a close-specific attribute (`dom.event.detail/closed`),
        NOT `dom.event.detail/sheet` - the latter is what the
        `activate-sheet` command reads, so reusing it here would make a
        close also read as an activate request and select the closed
        tab.
      the: dom.event.detail/closed
      as: entity

# A minimal projection of a sheet's `order` key - the one field a
# `tonk:sheet` carries over a plain `artifact`. A `retract!:` rule over
# this dissociates exactly the `order` triple, rather than re-asserting
# the whole `tonk:sheet` (which would force binding every field).
concept!: &workspace/sheet-order
  description: A sheet's order key, as a standalone fact.
  with:
    order:
      description: Lexicographic order key positioning the tab
      the: xyz.tonk.sheet/order
      cardinality: one
      as: text

# Retract the order: when `close-sheet` fires, drop the closed sheet's
# `order` triple. The sheet's artifact facts (title/entity/concept/...)
# persist - only the `order` that made it a `tonk:sheet` is removed, so
# the directory query (which requires `order`) no longer matches it and
# the tab disappears. The artifact could be re-promoted to a sheet
# later by re-asserting an `order`.
rule!:
  description: Demotes a closed sheet back to a plain artifact
  retract!: workspace/sheet-order
  when:
    - assert: workspace/close-sheet
      where: { sheet: ?this }
    - assert: workspace/sheet-order
      where: { this: ?this, order: ?order }

# The sheet-mount view (default view for `workspace/sheet`): wraps the
# sheet's content in a `<tonk-sheet>` carrying its metadata as
# attributes. `<tonk-sheet>` projects the card header from
# `title`/`subtitle`/`icon` and `<tonk-sheet-binder>` projects the tab
# strip from the same attributes; the view supplies only the
# attributes and the content. The sheet's content renders directly
# from the sheet's own `entity`/`concept`/`view` fields - a sheet is
# self-describing, so no intermediate concept is needed.



view!:
  this: id:tonk-workspace/sheet-mount
  concept: tonk:sheet
  display: |
    <tonk-sheet sheet={this} order={order} title={title} subtitle={subtitle} icon={icon}>
      <tonk-display this={entity} concept={concept} view={view} />
    </tonk-sheet>

# The empty-artifact canvas: what a freshly created sheet renders until
# it has real content. Mirrors the wireframe's "empty artifact
# (terminal)" frame - the artifact name, an agent-link row to hand to an
# agent, and a short instructional block. Styling uses the app's Web
# Awesome tokens so it follows the active theme.
view!:
  this: tonk:empty-artifact/view
  concept: tonk:empty-artifact
  display: |
    <div class="empty-artifact">
      <style>
        .empty-artifact {
          display: flex;
          flex-direction: column;
          gap: var(--wa-space-2xl);
          width: 100%;
          max-width: 620px;
          margin: 0 auto;
          padding: var(--wa-space-3xl) var(--wa-space-2xl);
          color: var(--wa-color-text-normal);
          font-family: var(--wa-font-family-body);
        }
        /* The artifact name, large and light, with a file glyph. The
           app stylesheet gives every `h1` an inverted "headline cover"
           background; override it back to plain text here so the title
           reads as a heading, not a highlighted block. */
        .empty-artifact__title {
          display: flex;
          align-items: center;
          gap: var(--wa-space-s);
          margin: 0;
          padding: 0;
          background: transparent;
          color: var(--wa-color-text-normal);
          font-family: var(--wa-font-family-body);
          font-size: var(--wa-font-size-2xl);
          font-weight: var(--wa-font-weight-normal);
          letter-spacing: -0.02em;
        }
        .empty-artifact__glyph { color: var(--wa-color-text-quiet); flex: none; }
        /* The agent-link panel: an uppercase mono label over the
           declarative invite. `<tonk-origin>` + `<tonk-display
           concept=tonk:agent-invite>` mint on mount and render the prompt
           (see the `id:agent-invite/prompt` view). */
        .empty-artifact__deeplink {
          display: flex;
          flex-direction: column;
          gap: var(--wa-space-xs);
          align-items: flex-start;
        }
        .empty-artifact__deeplink-label {
          font-family: var(--wa-font-family-code);
          font-size: var(--wa-font-size-xs);
          letter-spacing: 0.06em;
          text-transform: uppercase;
          color: var(--wa-color-text-quiet);
        }
        /* A quoted instructional block with a brand left-accent bar. */
        .empty-artifact__instr {
          display: flex;
          flex-direction: column;
          gap: var(--wa-space-2xs);
          padding-left: var(--wa-space-m);
          border-left: 2px solid var(--wa-color-brand-fill-loud);
          font-size: var(--wa-font-size-m);
          line-height: var(--wa-line-height-normal);
          color: var(--wa-color-text-quiet);
        }
        .empty-artifact__instr p { margin: 0; }
        .empty-artifact__instr b { color: var(--wa-color-text-normal); font-weight: var(--wa-font-weight-semibold); }
      </style>
      <h1 class="empty-artifact__title">
        <wa-icon class="empty-artifact__glyph" name="file" variant="regular"></wa-icon>
        {title}
      </h1>
      <section class="empty-artifact__deeplink">
        <div class="empty-artifact__deeplink-label">agent link &middot; paste into your agent</div>
        <!-- Mint a repo invite on mount via the same `tonk:invite` command
             the repo-share dialog uses. `<tonk-origin>` supplies the real
             host origin (`data-base`) and the repo subject DID (`entity`,
             via `bind:subject`) so the sealed guest can resolve the
             `tonk:invitation` join without reading `window` or the routing
             ancestors itself. The default `id:invitation/link` view renders
             the assembled URL + copy button; until both halves land, the
             `no-entity` slot shows a pending affordance. -->
        <tonk-page onmount=tonk:invite data-invite="tonk:invite"></tonk-page>
        <tonk-origin>
          <tonk-display
            bind:subject="entity"
            bind:base="data-base"
            concept=tonk:agent-invite
            data-page="{title}">
            <div slot="no-entity" class="empty-artifact__deeplink-label">Generating link…</div>
          </tonk-display>
        </tonk-origin>
      </section>
      <div class="empty-artifact__instr">
        <p>Paste this link into your agent's chat to start building.</p>
        <p>The agent will edit <b>{title}</b> directly &mdash; you'll see changes here as they happen.</p>
      </div>
    </div>

# ============================================================
# BOARD
# ============================================================
#
# v1 is the hierarchical shape: board owns columns; column owns
# tiles. Future work projects this from a flat tile concept using
# deductive rules; the view templates won't change when that
# happens.

concept!: &board
  description: A named board (hierarchical v1, owns columns directly)
  with:
    name:
      description: Display name
      the: xyz.tonk.board/name
      cardinality: one
      as: text
    column:
      description: Columns in this board
      the: xyz.tonk.board/column
      cardinality: many
      as: entity

concept!: &column-view
  description: A column on a board
  with:
    order:
      description: LexoRank-style order key within the board
      the: xyz.tonk.column/order
      cardinality: one
      as: text
    width:
      description: Column width in grid units (1 unit is 64px)
      the: xyz.tonk.column/width
      cardinality: one
      as: unsigned-integer
    tile:
      description: Tiles in this column
      the: xyz.tonk.column/tile
      cardinality: many
      as: entity

concept!: &tile
  description: One tile in a column
  with:
    order:
      description: Order key within the column
      the: xyz.tonk.tile/order
      cardinality: one
      as: text
    concept:
      description: Concept the tile body renders
      the: xyz.tonk.tile/concept
      cardinality: one
      as: entity
    entity:
      description: Entity the tile body renders
      the: xyz.tonk.tile/entity
      cardinality: one
      as: entity

concept!: &inspector
  description: An inspector tile body — renders <tonk-inspector source="…">
  with:
    source:
      description: Space name to inspect (passed through as the source attribute)
      the: xyz.tonk.inspector/source
      cardinality: one
      as: text

# The imperative escape hatch: `<tonk-portal>` writes an
# author-supplied HTML document into a sandboxed iframe, for work the
# declarative template stack can't express (canvas, WebGL, widgets).
# The `content` is first-class dialog data, fetched by a nested
# `<tonk-display concept=portal>` like any other concept.
concept!: &portal
  description: Imperative HTML rendered in an isolated iframe
  with:
    content:
      description: HTML document written into the portal iframe
      the: xyz.tonk.portal/content
      cardinality: one
      as: text

# One view per concept, keyed by `concept`. Each nested
# `<tonk-display>` passes only `concept=…` (and `this=…`); with no
# `view` attribute it resolves the view whose `concept` matches. The
# chain iterates one level of the hierarchy per template via
# `subject={field}` and bottoms out in the tile's content display.

view!:
  this: tonk:board
  concept: board
  display: |
    <tonk-strip>
      <style>
        /* Board layout travels with the view, so any route that
           mounts `concept=board` renders the strip identically
           (board route, bare display route, embedded tile). The strip
           caps its OWN height at the viewport (`block-size: 100dvh`)
           rather than borrowing a fixed height from the document — so
           its columns scroll vertically inside a bounded box and the
           strip scrolls horizontally, without locking the page. (Other
           views let the page scroll; the board is a self-contained
           fixed-height scroller.)

           The `tonk-display`/`tonk-view` layers that wrap each
           level are pure rendering wrappers, not layout boxes;
           `display: contents` makes them transparent so the strip
           is a flex container over real `<tonk-column>` items. */
        tonk-display:has(> tonk-view > tonk-strip),
        tonk-display > tonk-view:has(> tonk-strip) {
          display: contents;
        }

        tonk-strip {
          --pitch: 16px;
          --cell: 64px;
          /* Narrow gutter between columns — just enough that the
             contrasting strip fill reads as a seam. */
          --gap: 4px;

          display: flex;
          flex-direction: row;
          align-items: stretch;
          gap: var(--gap);
          padding: 0;
          box-sizing: border-box;
          block-size: 100dvh;
          inline-size: 100%;
          overflow-x: auto;
          overflow-y: hidden;
          scroll-snap-type: x proximity;
          /* The strip's fill shows through every seam — between
             columns AND between tiles within a column (since
             `<tonk-column>` is transparent). The neutral-fill token
             adapts with dark / light mode. */
          background-color: var(--wa-color-neutral-fill-normal);
        }

        /* The `tonk-display`/`tonk-view` wrappers between the strip
           and each column are transparent to the strip's flex flow,
           so each `<tonk-column>` is a direct flex item (its
           `flex: 0 0 calc(--col-w * --cell)` sizes the column, not
           the wrapping display). */
        tonk-strip > tonk-display,
        tonk-strip > tonk-display > tonk-view {
          display: contents;
        }
      </style>
      <tonk-display this={column} concept=column-view />
    </tonk-strip>

view/directory!:
  this: tonk:board/directory
  concept: board
  display: |
    <tonk-display this={this} concept={dom.host/concept} view={dom.host/view} />

view!:
  this: tonk:board/column
  concept: column-view
  display: |
    <tonk-column style="--col-w: {width};">
      <style>
        tonk-column {
          /* Width is driven by `--col-w` set on the element by this
             template (one --cell unit is 64px). Tiles stack
             top-to-bottom inside; overflow is handled here at the
             column level so the column's dot-grid background scrolls
             together with the tiles. */
          flex: 0 0 calc(var(--col-w, 12) * 64px);
          block-size: 100%;
          display: flex;
          flex-direction: column;
          gap: 4px;
          overflow-y: auto;
          overflow-x: hidden;
          scroll-snap-align: start;
          min-block-size: 0;
          /* Transparent so the strip's seam fill shows through the
             column-to-column and tile-to-tile gaps. The column's
             grid layer still paints (a `background-image`, not a
             fill) against whatever the strip provides underneath. */
          background-color: transparent;
        }

        tonk-column::-webkit-scrollbar { display: none; }

        /* Tiles size to their content along the column's main axis
           and stack top-to-bottom. Overflow happens at the COLUMN
           level (the column is the scroller), never inside a tile,
           so a tile renders its content unclipped and the user
           scrolls the whole column. Tiles paint the dark canvas
           fill; the gaps expose the strip's lighter seam fill. */
        tonk-column > .tile {
          flex: 0 0 auto;
          inline-size: 100%;
          box-sizing: border-box;
          background-color: var(--wa-color-neutral-fill-quiet);

          /* Two-layer engineering graph-paper background, applied to
             each tile (the surface the dark canvas occupies). The
             grid travels with the tile content because the tile is
             the visible canvas. `background-attachment: local` ties
             the grid to the column's scroll so the dots travel with
             vertical scroll. */
          --dot-gap: 16px;
          --dot-size-dim: 0.5px;
          --dot-size-bright: 0.5px;
          --dot-color-dim: color-mix(in oklab, currentColor 16%, transparent);
          --dot-color-bright: color-mix(in oklab, currentColor 25%, transparent);
          background-image:
            radial-gradient(
              circle,
              var(--dot-color-bright) var(--dot-size-bright),
              transparent calc(var(--dot-size-bright) + 0.5px)
            ),
            radial-gradient(
              circle,
              var(--dot-color-dim) var(--dot-size-dim),
              transparent calc(var(--dot-size-dim) + 0.5px)
            );
          background-size:
            calc(var(--dot-gap) * 4) calc(var(--dot-gap) * 4),
            var(--dot-gap) var(--dot-gap);
          background-position:
            calc(var(--dot-gap) * -2) calc(var(--dot-gap) * -2),
            calc(var(--dot-gap) / -2) calc(var(--dot-gap) / -2);
          background-attachment: local;
        }

        /* The inner `<tonk-display>` participates in the column's
           scroll — it must NOT clip or scroll on its own. */
        tonk-column > .tile > tonk-display,
        tonk-column > .tile > tonk-display > tonk-view {
          display: block;
          inline-size: 100%;
          overflow: visible;
        }
      </style>
      <div class="tile" subject={tile}>
        <tonk-display this={tile} concept=tile />
      </div>
    </tonk-column>

view!:
  this: tonk:board/tile
  concept: tile
  display: |
    <tonk-display this={entity} concept={concept} />

view!:
  this: tonk:inspector
  concept: inspector
  display: |
    <tonk-inspector source={source} />



view/directory!:
  this: tonk:inspector/directory
  concept: inspector
  display: |
    <tonk-inspector source=home />

# The canonical bridge from the `portal` concept to the
# `<tonk-portal>` element. `html:` forces the binding through
# setAttribute so `attributeChangedCallback` fires. Users never write
# this; nesting a `<tonk-display concept=portal>` over a portal entity
# resolves it by concept and renders it.
view!:
  this: tonk:portal
  concept: portal
  display: |
    <tonk-portal html:content={content} />

concept!: &db/session:
  this: concept:session
  description: Database session information
  with:
    profile:
      description: |
          Profile entity (as did:key) representing persistent identity on this device
      the: dialog.session/profile
      as: entity
    operator:
      description: |
          Operator entity (as did:key) representing an identifier used in this session to query and commit
      the: dialog.session/operator
      as: entity
    branch:
      description: |
          Active branch(es) in this session. Can be multiple when overlays are used.
      the: dialog.session/branch
      as: entity
      cardinality: many

concept!: &db/origin:
  this: concept:origin
  description: |
      Entity representing unique identifier for the active repository on this device.

      It can be used to assert/query device specific information.
  with:
    subject:
      description: |
          The repository subject (as did:key) representing it's unique identifier
      the: dialog.origin/subject
      as: entity
    profile:
      description: |
          Profile entity (as did:key) representing persistent identity on this device
      the: dialog.origin/profile
      as: entity

concept!: &db/branch:
  this: concept:branch
  description: |
      This represents a branch on some origin.
       Note that individual replicas can create same named branches and they
       likely going to be an different revisions, which is why branch is unique
       per origin as opposed to per repository.
  with:
    name:
      description: The branch name
      the: dialog.branch/name
      as: text
    origin:
      description: The origin of this branch
      the: dialog.branch/origin
      as: entity
    tree:
      description: The tree root of this branch
      the: dialog.branch/tree
      as: entity
    period:
      description: Synchronization point with an upstream
      the: dialog.branch/period
      as: entity
    moment:
      description: Number of commits made since last synchronization
      the: dialog.branch/moment
      as: entity

# A space (replica) the profile has access to. These records live on
# the profile repository's meta branch — one per repository this device
# has joined or created. The Tonk Hub at `/` queries them through a
# `<tonk-repository profile>` so the user can pick which space to open.
concept!: &space
  this: tonk:space
  description: A repository this profile can open, by its local name.
  with:
    name:
      description: Local name of the space, used in its `/space/{name}` URL
      the: xyz.tonk.replica/name
      cardinality: one
      as: text
    subject:
      description: The repository's subject DID (stable identity)
      the: xyz.tonk.replica/subject
      cardinality: one
      as: entity
    kind:
      description: >
        tonk:repository for a real space, tonk:profile for the
        profile's own self-replica. The Hub view hides the latter
        in CSS via [data-kind].
      the: xyz.tonk.replica/kind
      cardinality: one
      as: entity


# Set the binder shell as the space's default view. The space route mounts
# `<tonk-display this={replica} concept=tonk/space>`; this alias resolves
# `tonk/space` to `tonk:binder`, so the single-mode `tonk:shell` view (the topbar
# over the sheet binder) renders for that one replica's binder.
name!:
  this: id:tonk/space
  entity: tonk:binder

command!: &workspace/create-sheet
  description: Create a new sheet in the workspace
  with:
    name:
      description: Name of the artifact, from the binder's `create` event detail
      the: dom.event.detail/name
      as: text
    order:
      description: |
        Lexicographic order key for the new tab, computed by the binder
        (after the last existing tab) and carried on the `create` event
        detail.
      the: dom.event.detail/order
      as: text
    # The command entity is derived from its fields, so a per-event
    # nonce keeps successive creates (same name/order) distinct. The
    # binder stamps it on the event detail as a whole-number token;
    # `dom.event/time-stamp` itself is fractional and won't coerce to an
    # unsigned integer. Not ideal, but it mints unique entities and lets
    # us switch to a revision-based approach later.
    time:
      description: A monotonic integer nonce, from the binder's event detail
      the: dom.event.detail/time
      as: unsigned-integer


# A created sheet is self-describing: its `entity` is the sheet entity
# itself (`?this`), its `concept` is `tonk:empty-artifact`, and its `view`
# is the built-in default. The companion rule below asserts the
# `empty-artifact` title against that same entity, so the empty-artifact
# canvas can render the sheet's name. `entity: ?this` is expressed as an
# equality between two variables, which unifies the head's `entity`
# field with the command's `this`.
rule!:
  description: Creates a new workspace sheet
  assert!: workspace/sheet
  when:
    - assert: workspace/create-sheet
      where:
        this: ?this
        name: ?title
        order: ?order
    - assert: ==
      where:
        this: ?entity
        is: ?this
    - assert: ==
      where:
        this: ?concept
        is: tonk:empty-artifact
    - assert: ==
      where:
        this: ?view
        is: tonk:view
    - assert: ==
      where:
        this: ?subtitle
        is: ""
    - assert: ==
      where:
        this: ?icon
        is: "blank"

# Give the new sheet entity its empty-artifact title (the typed name),
# so the empty-artifact view bound to it shows the artifact name.
rule!:
  description: Titles the new sheet's empty-artifact entity
  assert!: empty-artifact
  when:
    - assert: workspace/create-sheet
      where:
        this: ?this
        name: ?title
        order: ?order

rule!:
  description: Activates the freshly created sheet
  assert!: tonk/binder
  when:
    - assert: workspace/create-sheet
      where:
        this: ?active
        name: ?title
        order: ?order
    # The binder is the replica's (bound through `tonk/replica`); record
    # its default `active` at the new sheet so creating lands the user on
    # the new empty artifact (the head's `active` field unifies with the
    # created sheet `?active`). `subject` carries the replica's identity so
    # the partial update keeps the binder's required field.
    - assert: tonk/replica
      where:
        this: ?this
        subject: ?subject



concept!: &tonk/replica
  this: tonk:replica
  description: |
      Replica of the shared repositiory on this device. It is unique per device
      and can be used to associate device specific metadata about the repository.

  with:
    subject:
      description: |
          The repository subject (as did:key) representing it's unique identifier
      the: dialog.origin/subject
      as: entity
    profile:
      description: |
          Profile entity (as did:key) representing persistent identity on this device
      the: dialog.origin/profile
      as: entity

# This device's live sync STATUS — the observation the chip renders. The worker
# stamps it into an overlay on the SPACE branch keyed on the well-known
# singleton `state:here`, so the sealed-guest chip (which can only reach the
# space branch) reads it with no replica entity. Distinct from the durable
# `enabled` pause preference, which is a boolean keyed on the replica entity
# (worker-only, off the chip's path).
concept!: &tonk/sync
  this: tonk:sync
  description: This device's live sync status for the space in scope.
  with:
    status:
      description: |
          Live observation — sync:idle | sync:pending | sync:offline | sync:local | sync:paused.
      the: xyz.tonk.sync/status
      cardinality: one
      as: entity

# ============================================================
# SITE — a tab's location and what it renders
# ============================================================
#
# `tonk:site` is the per-tab entity (a `site:<uuid>` minted by the host). The
# service worker stamps the tab's location + matched route on it; the rendering
# shell reads them from it. Multiple tabs coexist as distinct site entities in
# the same branch overlay, isolated by entity URI.

concept!: &site
  this: tonk:site
  description: A tab's location and the route concept it renders.
  with:
    path:
      description: Currently active path on this site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text
    anchor:
      description: Currently active anchor (URL hash) on this site.
      the: xyz.tonk.site/anchor
      cardinality: one
      as: text
    replica:
      description: Currently active replica on this site.
      the: xyz.tonk.site/replica
      cardinality: one
      as: entity
    route:
      description: Matched route of this site.
      the: xyz.tonk.site/route
      cardinality: one
      as: entity
    concept:
      description: Matched route's concept (the concept the shell mounts).
      the: xyz.tonk.site/concept
      cardinality: one
      as: entity

# A site renders the route concept it matched. The shell mounts a fixed
# `<tonk-display this=site:… concept=tonk:site>`; this view nests into the
# matched `{concept}` on the SAME site entity, so the route concept
# (e.g. `tonk:space/route`) resolves on the site (picking its `site/*` fields)
# and its own view renders. One indirection: site → its matched route concept.
view!: &site/view
  this: id:tonk:site/view
  concept: tonk:site
  display: |
    <tonk-display this={this} concept={concept} />

# ============================================================
# ROUTING — routes are concepts picked by the SW per tab
# ============================================================
#
# A `route!` maps a path pattern to a route CONCEPT. The SW (Level 1) matches the
# remaining path after the space prefix, picks the route concept, and asserts the
# tab's `tonk:site` with `concept` = that concept. The guest mounts
# `<tonk-display this=site:… concept={the matched concept}>`; the route concept
# resolves on the site entity (picking the `site/*` fields it needs) and its
# view renders. Patterns use axum/matchit 0.8 brace syntax (`{section}`), fed to
# `matchit::insert`.
#
# Route concepts are distinct PINNED concepts (`tonk:space/route`, …). Two routes
# with the same field shape stay distinct by their pinned `this`, so their views
# never collide — `concept` discriminates.

# The durable route table the SW reads to build its matchit router: a path
# pattern → the route concept to render. `route!` instances populate it.
concept!: &route
  this: tonk:route
  description: A route — maps a path pattern to the concept the SW mounts.
  with:
    path:
      description: The axum/matchit path pattern.
      the: xyz.tonk.route/path
      cardinality: one
      as: text
    concept:
      description: The route concept to render when this path matches.
      the: xyz.tonk.route/concept
      cardinality: one
      as: entity




# ---- Route concepts and their views ----

# The space's default page — a bare `/space/{name}/`. Picks the tab's `replica`
# off the site entity and renders a view of it (the binder, by default).
concept!: &space/route
  this: tonk:space/route
  description: The space's default page.
  with:
    replica:
      description: The tab's active replica, picked off the site entity.
      the: xyz.tonk.site/replica
      cardinality: one
      as: entity

view!: &space/route/view
  this: id:tonk:space/route/view
  concept: tonk:space/route
  display: |
    <tonk-display this={replica} concept=tonk/space />

# ---- Seeded routes (bootstrap) ----
#
# Built-in routes every space starts with. The SW matches against these.
route!: &route/space
  this: id:tonk:route/space
  path: "/"
  concept: tonk:space/route
# The sync chip — the default view for `concept: tonk:sync`. A pill whose dot
# colour + label come from `status` via CSS (rules in the shell topbar's
# <style>). The chip is the pause-trigger: clicking it opens the "Pause sync?"
# confirm dialog (`data-dialog`). When paused, a `resume` button overlays on
# top of the chip (shown by CSS only at `data-sync-status=sync:paused`) and
# submits the toggle command directly (`form=pause-sync-form`) — a direct
# resume, no dialog. The worker owns the state and the toggle.
view!: &sync/chip
  this: id:tonk:sync/chip
  concept: tonk:sync
  display: |
    <span class="workspace__sync-control" data-sync-status={status}>
      <span class="workspace__sync" data-sync-status={status} role="button" tabindex="0" data-dialog="open pause-sync" aria-label="Pause sync" title="Pause sync"></span>
      <button class="workspace__sync-resume" type="submit" form="pause-sync-form" aria-label="Resume sync" title="Resume sync"></button>
    </span>

# The workspace shell — the single-mode view for `concept: tonk:binder`. Rendered
# for ONE concrete replica (the binder instance IS the replica entity), so
# `{this}`/`{subject}`/`{active}` resolve to that tab's replica. The route mounts
# it via `<tonk-display this={replica} concept=tonk/space>` (tonk/space aliases
# tonk:binder), so the shell is scoped to this tab's replica, not folded over
# every replica.
view!:
  this: tonk:shell
  concept: tonk:binder
  display: |
    <div class="workspace-directory">
      <style>
        /* The route gives this view root (`.workspace-directory`) a
           viewport-min height. Flex-fill the nested `<tonk-display>`
           rendering chain so that height reaches the workspace, which
           then fills the page (tab strip at the bottom) — the same fill
           the seamless carousel applies to its slides. Without it the
           nested wrapper sits at content height and the workspace stops
           short. (`<style>` lives on this `<div>` rather than inside
           `<tonk-display>`, which discards child markup when it renders
           its resolved view.) */
        .workspace-directory {
          display: flex;
          flex-direction: column;
          /* The view root owns its fill: the route gives the slot a
             viewport box and the pass-through display chain flexes height
             down to here, but the route indirection means this root is no
             longer the slot's direct child, so it claims the viewport
             height itself rather than relying on a positional app rule. */
          min-height: 100dvh;
        }
        .workspace-directory > tonk-display,
        .workspace-directory > tonk-display > tonk-view {
          display: flex;
          flex-direction: column;
          flex: 1 1 auto;
          min-height: 0;
        }
        .workspace-directory > tonk-display > tonk-view > * {
          flex: 1 1 auto;
          min-height: 0;
        }
        /* `<tonk-display>` hides a non-active lifecycle-state slot child by
           setting the `hidden` attribute. The UA `[hidden]{display:none}`
           rule is weak, so any `display:` a layout rule applies to the
           slot child would defeat it (leaving the pending spinner showing
           under the resolved view). Force it. */
        tonk-display > [slot][hidden] {
          display: none !important;
        }

        /* Sync chip (wireframe brutalist pill): a square 1px-bordered mono
           lowercase tag with a status dot. Text + border + dot colour come
           from the `--sync-*` theme tokens, keyed on the `data-sync-status`
           the `tonk:sync` view stamps. The worker owns the value: sync:idle
           (synced, green) | sync:pending (syncing…, amber + pulse) |
           sync:offline (remote unreachable, warn) | sync:local (no remote,
           grey). */
        .workspace__sync {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 2px 8px;
          border: 1px solid currentColor;
          border-radius: 0;
          font-family: var(--wa-font-family-code);
          font-size: 11px;
          line-height: 1.4;
          text-transform: lowercase;
          letter-spacing: 0.02em;
          cursor: pointer;
          /* `currentColor` drives the border (above), the dot (below), and
             the label, so each state only sets one `color:`. Default =
             offline. */
          color: var(--sync-offline);
        }
        /* The chip control stacks the pause-trigger chip and a resume overlay.
           The overlay (a real `wa-button`, so it can submit the toggle form)
           sits on top of the chip and is shown only when paused — clicking it
           resumes directly, no dialog. */
        .workspace__sync-control {
          position: relative;
          display: inline-flex;
        }
        /* The resume affordance is a transparent button covering the whole
           paused chip — the chip below shows `○ paused`, this captures the
           click and submits the toggle. No icon, no label: the wireframe
           paused chip is just the hollow-ring pill. Hidden unless paused. */
        .workspace__sync-resume {
          position: absolute;
          inset: 0;
          margin: 0;
          padding: 0;
          border: 0;
          background: transparent;
          cursor: pointer;
          display: none;
        }
        .workspace__sync-control[data-sync-status="sync:paused"] .workspace__sync-resume {
          display: block;
        }
        .workspace__sync::before {
          content: "";
          inline-size: 8px;
          block-size: 8px;
          border-radius: 50%;
          background: currentColor;
        }
        .workspace__sync::after { content: "offline"; }
        .workspace__sync[data-sync-status="sync:idle"] {
          color: var(--sync-idle);
        }
        .workspace__sync[data-sync-status="sync:idle"]::after { content: "synced"; }
        .workspace__sync[data-sync-status="sync:pending"] {
          color: var(--sync-pending);
        }
        .workspace__sync[data-sync-status="sync:pending"]::after { content: "syncing…"; }
        .workspace__sync[data-sync-status="sync:pending"]::before {
          animation: workspace-sync-pulse 1s ease-out infinite;
        }
        .workspace__sync[data-sync-status="sync:offline"] {
          color: var(--sync-offline);
        }
        .workspace__sync[data-sync-status="sync:offline"]::after { content: "offline"; }
        .workspace__sync[data-sync-status="sync:local"] {
          color: var(--sync-local);
        }
        .workspace__sync[data-sync-status="sync:local"]::after { content: "local"; }
        /* Paused (durable pause preference; wired by the pause-sync command).
           One muted grey drives text, border, and the hollow-ring dot via
           `currentColor` — text and border match like every other state. */
        .workspace__sync[data-sync-status="sync:paused"] {
          color: var(--sync-paused);
        }
        .workspace__sync[data-sync-status="sync:paused"]::before {
          background: transparent;
          box-shadow: inset 0 0 0 1.5px currentColor;
        }
        .workspace__sync[data-sync-status="sync:paused"]::after { content: "paused"; }
        @keyframes workspace-sync-pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.35; }
        }

      </style>
      <div class="workspace__topbar">
        <span class="workspace__brand">tonk</span>
        <a class="workspace__crumb" href="/">&lsaquo; all repos</a>
        <span class="workspace__title"><tonk-display this={subject} concept=tonk:repository></tonk-display></span>
        <!-- The sync chip: subscribes to the `tonk:sync` `state:here` overlay
             the worker stamps on THIS space branch (the one the shell is
             already scoped to), so it needs no extra repository context. The
             `no-entity` slot shows `pending` ("syncing…") until the first
             status lands — which is honest, since a status check / sync fires
             on load. Without the slot `<tonk-display>` would dump the
             missing-instance notation as text. -->
        <tonk-display this=state:here concept=tonk:sync>
          <span slot="no-entity" class="workspace__sync" data-sync-status="sync:pending" role="button" tabindex="0" data-dialog="open pause-sync" aria-label="Pause sync" title="Pause sync"></span>
        </tonk-display>
        <span class="workspace__spacer"></span>
        <span class="workspace__actions">
          <!-- Identity chip: shows the signed-in member's sigil + their
               editable display name. Resolves against the `state:self`
               overlay the worker stamps on load (see task-5/6). Editing
               the name commits via the worker-backed `profile/rename`
               command (no declarative rule — the Rust handler writes to
               the profile meta branch). The empty `no-entity` slot renders
               nothing while `state:self` is briefly absent (e.g. just after
               an overlay clear) — without it `<tonk-display>` would dump the
               missing-instance notation as text, mirroring the sync chip. -->
          <tonk-display this=state:self concept=tonk:identity>
            <span slot="no-entity" class="workspace__identity" aria-hidden="true"></span>
          </tonk-display>
          <!-- One click both opens the share dialog (`data-dialog`) and
               submits the dialog's share form (`form=share-form`, the HTML
               external-submit attribute) — so the invite mints on open with
               no separate "Create link" click. The form carries no payload
               beyond the click timestamp; the worker mints the keypair and
               delegation. A user click is the trigger, so there is no
               render-driven auto-fire loop. -->
          <wa-button class="workspace__share" appearance="plain" type="submit" form="share-form" data-dialog="open share-repo" aria-label="Share this repo" title="Share this repo">
            <wa-icon name="share-nodes" label="Share"></wa-icon>
          </wa-button>
        </span>
      </div>

      <!-- Enable-sync dialog: shown via the `<tonk-sync-state>` enable
           trigger on a no-upstream space. That element stamps the
           resolved repo name into the hidden `name` input on click; the
           `remote` input + `<tonk-default-remote>` button collect the
           URL; submit asserts the transient `space/enable-sync` command.
           Lives in this always-rendered directory view (with the topbar)
           so sync can be enabled on any space, including an empty one. -->
      <wa-dialog id="enable-sync" label="Enable sync" class="workspace__sync-dialog">
        <form id="enable-sync-form" class="workspace__sync-form" onsubmit=space/enable-sync>
          <input type="hidden" name="name">
          <wa-input name="remote" label="Sync server" placeholder="https://…" autocomplete="off" autofocus required></wa-input>
          <tonk-default-remote field="remote">Use this server</tonk-default-remote>
        </form>
        <wa-button slot="footer" variant="neutral" appearance="plain" data-dialog="close">Cancel</wa-button>
        <wa-button slot="footer" variant="primary" type="submit" form="enable-sync-form" data-dialog="close">Enable</wa-button>
      </wa-dialog>

      <!-- Pause-sync confirm dialog + form. The sync chip opens this
           (`data-dialog="open pause-sync"`); its "Pause sync" button submits
           `pause-sync-form`, asserting the transient `tonk:pause-sync` command.
           The worker reads the origin repo, flips the durable `enabled` boolean
           on the replica, and publishes the matching status. The same form is
           submitted by the chip's resume overlay — the command is a toggle, so
           resume needs no separate command. -->
      <form id="pause-sync-form" data-pause-sync="tonk:pause-sync" onsubmit=tonk:pause-sync></form>
      <wa-dialog id="pause-sync" label="Pause sync?" class="workspace__pause-dialog">
        <p class="workspace__pause-meta">sync · substrate kill-switch</p>
        <p>Your changes won't reach other devices and agents until you resume. Local edits are buffered; incoming edits are queued.</p>
        <wa-button slot="footer" variant="neutral" appearance="plain" data-dialog="close">Cancel</wa-button>
        <wa-button slot="footer" variant="primary" type="submit" form="pause-sync-form" data-dialog="close" autofocus>
          <wa-icon slot="start" name="pause"></wa-icon>
          Pause sync
        </wa-button>
      </wa-dialog>

      <!-- Share dialog. Clicking the topbar Share button (above) submits
           `share-form` via the `form=` external-submit attribute, asserting
           the `tonk:invite` command. The worker generates a membership
           keypair, delegates the origin repo to it, asserts the public
           `tonk:authorization` durably and the private seed as an
           overlay-only `tonk:credential` — both keyed by the repo's
           subject DID. The nested `<tonk-display this={subject}>`
           resolves the `tonk:invitation` join (authorization + credential)
           and composes the link. `<tonk-origin>` supplies the `data-base`
           (`{origin}/join`) host attribute so the template can build an
           absolute URL without reading `window` itself. The secret seed
           lives only in the worker's session overlay and the assembled
           URL — never in replicated storage. -->
      <wa-dialog id="share-repo" label="Share this repo" class="workspace__share-dialog">
        <style>
          /* Share dialog: a quiet intro line over the link, then the
             roster, then a quiet footer explaining the membership rule —
             matching the wireframe's copy + rhythm. */
          .share-dialog__intro {
            margin: 0 0 var(--wa-space-m);
            font-size: var(--wa-font-size-s);
            color: var(--wa-color-text-quiet);
          }
          .share-dialog__note {
            margin: var(--wa-space-l) 0 0;
            font-size: var(--wa-font-size-xs);
            line-height: 1.5;
            color: var(--wa-color-text-quiet);
          }
        </style>
        <p class="share-dialog__intro">One link · anyone who follows it becomes a member · stays active forever</p>
        <form id="share-form" data-invite="tonk:invite" onsubmit=tonk:invite></form>
        <tonk-origin>
          <tonk-display
            this={subject}
            concept=invitation
            bind:base="data-base">
            <!-- Until the handler asserts both halves of the invitation,
                 the display has no instance to render. A `no-entity` slot
                 child shows a quiet pending affordance instead of the
                 built-in "Not found" callout — the link is being generated,
                 not missing. -->
            <div slot="no-entity" class="invite-link invite-link--pending">
              <wa-spinner></wa-spinner>
              <span>Generating link…</span>
            </div>
          </tonk-display>
        </tonk-origin>
        <!-- The roster: everyone who's a member of this space. No
             `entity`, so the `tonk:member` directory view resolves and
             iterates every member, one row each (sigil + DID + role). -->
        <div class="roster-section">
          <p class="roster-section__label">Shared with</p>
          <tonk-display concept=tonk:member></tonk-display>
        </div>
        <p class="share-dialog__note">Everyone who follows this link becomes a member of this space. The link stays active, so share it only with people you want to let in.</p>
      </wa-dialog>

      <tonk-display concept=workspace/sheet data-binder={this} data-active={active} />
    </div>


view/directory!:
  this: tonk:sheet-binder
  concept: tonk:sheet
  display: |
    <div class="workspace">
      <style>
        /* Styling uses the app's Web Awesome design tokens (--wa-*)
           rather than hardcoded colours, so the viewer follows the
           active theme and light/dark automatically. */
        .workspace {
          display: flex;
          flex-direction: column;
          /* Content-driven by default: as a board tile the workspace
             takes only the space it needs. When it is the page's own
             view, the route gives the view root a viewport-min height
             (see the `.display-route` rule in the app stylesheet), so
             the tab strip pins to the bottom there. */
          font-family: var(--wa-font-family-body);
          color: var(--wa-color-text-normal);
          /* Transparent so the page's dot-grid paper shows through
             (matching the wireframe). */
          background: transparent;
        }
        /* The binder fills the space below the top bar: the active sheet
           panel fills the rest, the projected tab strip pins to the
           bottom. */
        .workspace__binder {
          display: flex;
          flex-direction: column;
          flex: 1;
          min-height: 0;
        }

        /* The view mounts each sheet through a `<tonk-display>` wrapper;
           those wrappers are the binder's flex children (the panels).
           The active panel FILLS the available height; the rest
           collapse (their inner <tonk-sheet> is `hidden`). Scrolling
           happens inside the sheet's card. */
        .workspace__binder > tonk-display {
          display: flex;
          flex-direction: column;
          flex: 1;
          min-height: 0;
          padding: var(--wa-space-l);
          box-sizing: border-box;
          order: 1;
        }
        .workspace__binder > tonk-display:not(:has(tonk-sheet:not([hidden]))) {
          display: none;
        }
        .workspace__binder > tonk-display > tonk-view {
          display: flex;
          flex-direction: column;
          flex: 1;
          min-height: 0;
        }

        /* The sheet card: a header strip the sheet projects from its
           attributes, over the sheet's content. Transparent body so the
           page's dot-grid shows through; bordered frame. */
        .workspace__binder tonk-sheet {
          display: flex;
          flex-direction: column;
          flex: 1;
          min-height: 0;
          color: inherit;
          font-family: inherit;
          border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          background: transparent;
          overflow: hidden;
        }
        /* The card body: everything after the projected header. The
           sheet's content <tonk-display> is the last child; it scrolls. */
        .workspace__binder tonk-sheet > tonk-display {
          flex: 1;
          min-height: 0;
          overflow: auto;
        }
        .workspace__binder tonk-sheet > tonk-display > tonk-view {
          display: block;
          min-height: 100%;
        }
        /* A portal sheet: `<tonk-portal>`'s iframe has no intrinsic
           content height, so a percentage height collapses it to the
           iframe's default 150px — a percentage can't resolve against
           the flex-grown content display (its height is not "definite"
           in that sense). Carry the height down the whole portal
           sub-chain by flex instead, the same fill the directory chain
           uses: the content display and its view each fill by `flex: 1`,
           and the portal fills the view. No percentages, so nothing to
           collapse. */
        .workspace__binder tonk-sheet > tonk-display:has(> tonk-view > tonk-portal) {
          display: flex;
          flex-direction: column;
        }
        .workspace__binder tonk-sheet > tonk-display > tonk-view:has(> tonk-portal) {
          display: flex;
          flex-direction: column;
          flex: 1;
          min-height: 0;
        }
        .workspace__binder tonk-sheet > tonk-display > tonk-view > tonk-portal {
          display: block;
          flex: 1;
          min-height: 0;
          /* Positioning context for the iframe below. */
          position: relative;
        }
        /* `<tonk-portal>` sizes its iframe `height: 100%`, but that
           percentage can't resolve against the portal's flex-grown
           height (flex-grown is not "definite" for a replaced element's
           percentage), so the iframe collapses to its intrinsic 150px.
           Absolutely positioning it fills the portal: an abs box's
           percentage height resolves against its containing block's used
           height, flex-grown or not. */
        .workspace__binder tonk-sheet > tonk-display > tonk-view > tonk-portal > iframe {
          position: absolute;
          inset: 0;
        }

        /* The card header the sheet projects (status dot + name +
           subtitle). A surface fill so it reads as chrome over the
           transparent body. */
        .tonk-sheet__head {
          display: flex;
          align-items: center;
          gap: var(--wa-space-s);
          flex: none;
          padding: var(--wa-space-s) var(--wa-space-m);
          background: var(--wa-color-surface-raised);
          border-bottom: var(--wa-border-width-s) solid var(--wa-color-surface-border);
        }
        .tonk-sheet__dot {
          width: 7px; height: 7px; border-radius: 50%;
          background: currentColor; flex: none;
        }
        .tonk-sheet__name { font-size: var(--wa-font-size-s); font-weight: var(--wa-font-weight-semibold); }
        .tonk-sheet__meta { font-size: var(--wa-font-size-s); color: var(--wa-color-text-quiet); }

        /* The bottom tab strip the binder projects. Equal-width bullet
           segments separated by rules; the active tab gets a brand
           accent top bar. The binder sets the CSS `order` per tab. */
        .tonk-sheet-binder__tabs {
          display: flex;
          align-items: stretch;
          flex: none;
          height: 48px;
          order: 2;
          /* Left inset so the first tab aligns with the sheet card's
             left edge (the panel padding above). */
          padding-left: var(--wa-space-l);
          /* A surface fill matching the top bar (not the darker lowered
             surface). */
          background: var(--wa-color-surface-raised);
          border-top: var(--wa-border-width-s) solid var(--wa-color-surface-border);
        }
        /* Tabs are content-width (short), left-aligned, separated by
           rules — not stretched to fill the strip (the wireframe). */
        .tonk-sheet-binder__tab {
          flex: none;
          display: inline-flex;
          align-items: center;
          gap: var(--wa-space-s);
          padding: 0 var(--wa-space-l);
          font: inherit;
          font-size: var(--wa-font-size-s);
          color: var(--wa-color-text-quiet);
          background: transparent;
          border: none;
          border-right: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          border-top: 2px solid transparent;
          cursor: pointer;
          white-space: nowrap;
        }
        /* The leading status bullet (hollow when inactive). */
        .tonk-sheet-binder__tab::before {
          content: "";
          width: 7px; height: 7px;
          border-radius: 50%;
          border: var(--wa-border-width-s) solid currentColor;
          background: transparent;
          flex: none;
        }
        .tonk-sheet-binder__tab:hover {
          color: var(--wa-color-text-normal);
          background: var(--wa-color-neutral-fill-quiet);
        }

        /* Active tab: brand-accent top bar, raised surface, filled
           bullet, normal-weight bright text — the selected sheet. */
        .tonk-sheet-binder__tab.is-active {
          color: var(--wa-color-text-normal);
          font-weight: var(--wa-font-weight-semibold);
          background: var(--wa-color-surface-default);
          border-top-color: var(--wa-color-brand-fill-loud);
        }
        .tonk-sheet-binder__tab.is-active::before {
          background: var(--wa-color-brand-fill-loud);
          border-color: var(--wa-color-brand-fill-loud);
        }

        /* The close button the binder appends to each tab. A small
           `×` glyph after the title, hidden until the tab is hovered
           (the wireframe's editor-tab behaviour). It brightens to the
           danger colour on its own hover. */
        .tonk-sheet-binder__close {
          width: 16px; height: 16px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          flex: none;
          font-size: var(--wa-font-size-m);
          line-height: 1;
          color: var(--wa-color-text-quiet);
          border-radius: var(--wa-border-radius-s);
          visibility: hidden;
          cursor: pointer;
        }
        .tonk-sheet-binder__tab:hover .tonk-sheet-binder__close,
        .tonk-sheet-binder__tab.is-active .tonk-sheet-binder__close {
          visibility: visible;
        }
        .tonk-sheet-binder__close:hover {
          color: var(--wa-color-danger-on-quiet);
          background: var(--wa-color-danger-fill-quiet);
        }

        /* The "+" add-sheet button the binder appends after the tabs. A
           dashed-border square that solidifies and brightens on hover,
           matching the wireframe's `tab-strip__add`. */
        .tonk-sheet-binder__add {
          align-self: center;
          flex: none;
          margin-left: var(--wa-space-s);
          width: 28px; height: 28px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          font-size: var(--wa-font-size-l);
          line-height: 1;
          color: var(--wa-color-text-quiet);
          background: transparent;
          border: var(--wa-border-width-s) dashed var(--wa-color-surface-border);
          border-radius: var(--wa-border-radius-s);
          cursor: pointer;
        }
        .tonk-sheet-binder__add:hover {
          color: var(--wa-color-text-normal);
          border-style: solid;
          border-color: var(--wa-color-text-normal);
        }

        /* The inline create form the binder swaps in for the "+" button
           while naming a new sheet: an underlined name input plus
           create / esc controls, with a brand-accent top bar like an
           active tab. */
        .tonk-sheet-binder__create {
          align-self: stretch;
          display: inline-flex;
          align-items: center;
          gap: var(--wa-space-s);
          margin-left: var(--wa-space-s);
          padding: 0 var(--wa-space-m);
          border-top: 2px solid var(--wa-color-brand-fill-loud);
          background: var(--wa-color-surface-default);
        }
        .tonk-sheet-binder__create-input {
          min-width: 160px;
          padding: var(--wa-space-2xs) 0;
          font: inherit;
          font-size: var(--wa-font-size-s);
          color: var(--wa-color-text-normal);
          background: transparent;
          border: none;
          border-bottom: var(--wa-border-width-s) solid var(--wa-color-text-normal);
          outline: none;
        }
        .tonk-sheet-binder__create-input::placeholder { color: var(--wa-color-text-quiet); }
        .tonk-sheet-binder__create-commit,
        .tonk-sheet-binder__create-cancel {
          flex: none;
          font: inherit;
          cursor: pointer;
          border: none;
          border-radius: var(--wa-border-radius-s);
          padding: var(--wa-space-2xs) var(--wa-space-s);
        }
        .tonk-sheet-binder__create-commit {
          font-size: var(--wa-font-size-s);
          color: var(--wa-color-brand-on-loud);
          background: var(--wa-color-brand-fill-loud);
        }
        .tonk-sheet-binder__create-cancel {
          font-family: var(--wa-font-family-code);
          font-size: var(--wa-font-size-xs);
          color: var(--wa-color-text-quiet);
          background: transparent;
        }
        .tonk-sheet-binder__create-cancel:hover { color: var(--wa-color-text-normal); }


        /* Empty state. The binder reveals `[slot="empty"]` and flags
           itself `data-empty` when it has no sheets. The launchpad fills
           the canvas area above the (add-only) tab strip, centered over
           the dot-grid paper - matching the wireframe's "empty repo"
           frame. The binder hides it (`hidden`) whenever a sheet exists. */
        .workspace-launchpad {
          flex: 1 1 auto;
          order: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 0;
          padding: var(--wa-space-2xl);
        }
        .workspace-launchpad[hidden] { display: none; }
        .workspace-launchpad__inner {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: var(--wa-space-m);
          max-width: 28rem;
          text-align: center;
        }
        /* Opt out of the global heading highlight-cover (the dark filled
           box from styles.css `h1..h6`): a plain heading in the normal
           text colour reads correctly in both light and dark. */
        .workspace-launchpad__title {
          display: block;
          margin: 0;
          padding: 0;
          background: none;
          font-family: var(--wa-font-family-code);
          font-size: var(--wa-font-size-2xl);
          font-weight: var(--wa-font-weight-bold);
          letter-spacing: normal;
          color: var(--wa-color-text-normal);
        }
        .workspace-launchpad__hint {
          margin: 0;
          color: var(--wa-color-text-quiet);
          font-family: var(--wa-font-family-code);
          font-size: var(--wa-font-size-s);
        }
        /* The prominent "add artifact" button: a hatched/dashed frame
           that solidifies on hover, echoing the strip's "+" add control
           and the wireframe's center call to action. */
        .workspace-launchpad__add {
          margin-top: var(--wa-space-s);
          padding: var(--wa-space-s) var(--wa-space-l);
          font-family: var(--wa-font-family-code);
          font-size: var(--wa-font-size-m);
          font-weight: var(--wa-font-weight-semibold);
          color: var(--wa-color-text-normal);
          background: transparent;
          border: var(--wa-border-width-s) dashed var(--wa-color-surface-border);
          border-radius: var(--wa-border-radius-s);
          cursor: pointer;
        }
        .workspace-launchpad__add:hover {
          border-style: solid;
          border-color: var(--wa-color-text-normal);
          background: var(--wa-color-neutral-fill-quiet);
        }
      </style>

      <tonk-sheet-binder class="workspace__binder" default-active={dom.host/data-active} onactivate=workspace/activate-sheet onclose=workspace/close-sheet oncreate=workspace/create-sheet>
        <div slot="empty" class="workspace-launchpad" hidden>
          <div class="workspace-launchpad__inner">
            <h1 class="workspace-launchpad__title">nothing here yet.</h1>
            <p class="workspace-launchpad__hint">start by creating an artifact &mdash; the agent will fill it.</p>
            <button type="button" class="workspace-launchpad__add" data-create>+ add artifact</button>
          </div>
        </div>
        <tonk-display this={this} concept=tonk:sheet />
      </tonk-sheet-binder>
    </div>

command!: &tonk/initialize
  description: Initialize a freshly created or joined replica
  with:
    reason:
       description: Reason to initialize the replica
       as: text
       the: xyz.tonk.init/reason

concept!: &tonk/binder
  this: tonk:binder
  description: A binder view of the the tonk replica
  with:
    subject:
      description: |
        The repository's subject DID. The binder and the replica share
        an entity, so the binder carries the replica's `subject` and the
        shell view can read `{subject}` directly to mount the
        repository-name banner — no bridge view needed.
      the: dialog.origin/subject
      as: entity
  maybe:
    active:
      description: |
        The binder's default/initial sheet selection — like a form
        control's `defaultValue`. Optional: a freshly created or joined
        replica has selected no tab yet, so the field is simply absent
        and the binder falls back to the first sheet by order. The
        binder element owns the LIVE selection in its own DOM state
        (instant on click); this field only seeds the initial selection
        on mount and records the latest pick so it survives a reload.
      the: xyz.tonk.binder/active
      as: entity

# Tab selection: when an `activate-sheet` command fires, record the
# clicked sheet as the binder's default `active` selection (replacing the
# prior one). The binder is the replica's (one per device, bound through
# `tonk/replica`), so the command needs only the sheet — no binder id
# plumbed through the DOM. The shell view reads `{active}` straight off
# the binder concept to seed the live tab; the binder element owns the live
# selection thereafter, so this write only persists the default for the
# next mount.
rule!:
  assert!: tonk/binder
  when:
    - assert: workspace/activate-sheet
      where: { sheet: ?active }
    - assert: tonk/replica
      where: { this: ?this, subject: ?subject }

rule!:
  assert!: tonk/repository
  when:
    - assert: tonk/initialize
      where:
         this: ?init
    - assert: tonk/replica
      where:
         subject: ?this
    - assert: ==
      where:
        this: ?name
        is: Untitled
  unless:
    - assert: tonk/repository
      where:
        this: ?this

tonk/initialize!:
   reason: Initialize a new tonk repository

# ============================================================
# Tree inspector — `<tonk-tree>` over the branch's search-tree
# index. Visit `/space/{repo}/dialog:diagnose` to explore the
# dialog-search-tree state under the DB: index/segment nodes,
# their keys (color-coded components, shared prefixes dimmed),
# byte sizes, and entries. The view renders `<tonk-tree>`, which
# resolves its repository from the `<tonk-repository>` routing
# ancestor and drives itself from the worker's `tree/*` query
# formulas — no entity needed (it inspects the whole branch).
# ============================================================
concept!: &diagnose
  this: dialog:diagnose
  description: Marker concept for the search-tree inspector view.
  with:
    name:
      description: A label for the inspector (unused; satisfies the concept shape).
      the: dialog.diagnose/name
      cardinality: one
      as: text

# A directory-kind view (not a plain `view!`): a `/space/{repo}/dialog:diagnose`
# URL carries no entity, so `<tonk-display>` resolves a `view/directory`
# for the concept. The inspector needs no entity — it renders the whole
# branch's tree — so the directory view is the right kind.
view/directory!:
  this: id:dialog:diagnose/view
  concept: dialog:diagnose
  display: |
    <tonk-tree></tonk-tree>
