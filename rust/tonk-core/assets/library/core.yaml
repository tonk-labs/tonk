# Tonk standard library.
#
# The built-in concepts, views, commands, and rules the runtime
# seeds into a repository at creation. Served as a static asset
# (`/library/core.yaml`) and fetched + lowered by the service
# worker in the repository-creation path, rather than embedded at
# compile time. Editing this file changes the standard library
# without rebuilding the wasm.
#
# Lowering runs `analyze_local` (no running system), so every
# `&anchor` / bare-name reference must resolve within this file.
#
# Two source sections, formerly `tonk-workspace/bootstrap.yaml` and
# `tonk-board/bootstrap.yaml`. The `view` concept is shared between
# them (pinned to `tonk:view`) and declared once here.

# ============================================================
# VIEW
# ============================================================

# `view` is a BUILT-IN concept (tonk-schema's registry, beside
# `concept`, `command`, `event` and `rule`). It is declared there
# rather than here because the analyzer has to understand a view
# structurally: a `show:` template can bind `on:<name>=<command>`,
# and those are resolved at lowering into the view's `bindings`
# rather than re-queried per name on every refresh.
#
# An in-document declaration SHADOWS a builtin, so declaring it
# here again would silently restore runtime resolution. What lives
# in the libraries are its INSTANCES: the `view!:` blocks below.

# The default directory view: `this: tonk:_` matches any model whose
# own `show` dictionary has no `directory` entry. `tonk:_` is the
# wildcard-model sentinel — a valid entity URI standing in for "no
# specific model". <tonk-display> with no `entity` reads the model's
# own `directory` facet first; finding none, it falls back to this.
# It renders the model's instances in a <wa-carousel>, one slide per
# instance, each a nested single-entity <tonk-display> (which then
# resolves its own view, or the notation fallback). The nested
# `model` is threaded from the host via `{dom.host/model}`, since an
# instance carries no pointer to its own model.
view!:
  this: tonk:_
  show:
    directory: |
      <wa-carousel class="vertical seamless" pagination orientation="vertical">
        <wa-carousel-item subject={this}>
          <tonk-display entity={this} model={dom.host/model} />
        </wa-carousel-item>
      </wa-carousel>


# ============================================================
# EVENTS
# ============================================================

# `event` is a BUILT-IN concept (tonk-schema's registry, beside
# `command` and `rule`), not a library one — an `event!:` declaration is
# schema an author writes, so it must resolve on any branch rather than
# only where this library has been seeded. What lives here are its
# INSTANCES: the DOM event set. A terminal seeds its own.
#
# An `event!:` declaration is the seam between a host's input model and
# a command's domain shape: it names the platform event to listen for,
# whether to suppress the platform's default handling, and a `where:`
# map from COMMAND FIELD NAME to source.
#
# A template binds one with `on:<name>=<command>`, which resolves the
# declaration named `on/<name>` — `/` is not legal in an HTML attribute
# name but `:` is, so the identifier and the attribute differ by exactly
# that substitution. Only the single `on:` prefix is reserved, so
# `bind:base`, `xlink:href` and `xml:lang` are untouched.
#
# This replaces spelling the extraction inside the command's `with:`
# map as `dom.event.*` identifiers. That form made a command's identity
# its plumbing: two verbs reading the same DOM path were the same
# concept (hence `sheet-name` / `rename-name` in table.yaml, contorted
# only to stay distinct), and the command could not be reused by a host
# with no DOM. Here the command stays domain-shaped and every platform
# difference lives in one artifact whose whole job is platform
# difference.
#
# `on<event>=` keeps working — the two attribute forms are distinct, so
# templates migrate one at a time.
# A `where:` source is one of three forms, each syntactically distinct
# so a typo cannot be mistaken for a different kind:
#
#   {field}   template interpolation, in the scope of the element the
#             event fired on — a field of the enclosing repeat subject.
#             `{this}` is the subject itself.
#   .path     a property read off the live event, spelled the way the
#             platform spells it (`.currentTarget.dataset.todo`). No
#             case translation, so the old kebab/camel trap is gone.
#   "text"    a literal, for defaults the interaction never supplies.
#
# A bare word is an error rather than a literal: `timeStamp` without its
# dot would otherwise silently become the string "timeStamp", which is
# the class of mistake this exists to catch.

# Activation. `{this}` covers the whole `data-*` stash-and-recover
# pattern: the renderer already stamps `data-this` on every repeat row,
# so the subject needs no template attribute at all.
event!: &on/click
  type: "click"
  where:
    subject: "{this}"

# Activation on a row, carrying a per-event nonce so two identical
# clicks mint distinct entities. `time` is why a command that creates
# something needs no hand-written nonce field.
event!: &on/click-once
  type: "click"
  where:
    subject: "{this}"
    time: ".timeStamp"

# Form submission. `prevent-default` lives here rather than in the
# command, which is what keeps the command rule-consumable: an action
# field in a command's `with:` map stores no value, so a rule premise
# over it matches zero rows however successfully the command transacts.
event!: &on/submit
  type: "submit"
  prevent-default: true
  where:
    subject: "{this}"

# A native control's committed value.
event!: &on/change
  type: "change"
  where:
    subject: "{this}"
    value: ".currentTarget.value"

# A native control's checked state.
event!: &on/toggle
  type: "change"
  where:
    subject: "{this}"
    checked: ".currentTarget.checked"


# ============================================================
# WORKSPACE
# ============================================================

# The blank canvas: what a lean (no-template) repo renders. It is the
# default target of the `tonk/space` alias (below). Mirrors the mock's
# connect-an-agent frame: a prompt
# (the same `tonk:invite` mint the share path uses, rendered via the
# `tonk:agent-invite` prompt view).
concept!: &blank
  this: tonk:blank
  description: A lean repo's starting canvas — connect an agent or build by hand.
  with:
    subject:
      description: The repository's subject DID (the replica's subject).
      the: dialog.replica/subject
      cardinality: one
      as: entity

view!:
  this: tonk:blank
  show:
    ui: |
      <div class="blank-canvas">
        <style>
          .blank-canvas {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100dvh;
            gap: var(--wa-space-2xl);
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            padding: var(--wa-space-3xl) var(--wa-space-2xl);
            color: var(--wa-color-text-normal);
            font-family: var(--wa-font-family-body);
          }
          .blank-canvas__label {
            font-family: var(--wa-font-family-code);
            font-size: var(--wa-font-size-xs);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--wa-color-text-quiet);
          }
          .blank-canvas__deeplink {
            display: flex;
            flex-direction: column;
            gap: var(--wa-space-xs);
            align-items: flex-start;
          }
          /* `tonk-display` is light DOM and projects lifecycle slots by
             toggling `hidden`. Its custom-element display rule outranks the UA
             default, so enforce the inactive state here. */
          .blank-canvas__deeplink tonk-display > [slot][hidden] {
            display: none !important;
          }
        </style>
        <section class="blank-canvas__deeplink">
          <tonk-page on:invite=tonk:agent-handoff></tonk-page>
          <tonk-display
            entity={subject}
            model=tonk:agent-invite
            data-page="this repo">
            <tonk-display
              slot="no-entity"
              entity={subject}
              model=tonk:agent-handoff-state>
              <div slot="no-entity" class="blank-canvas__label">Generating link…</div>
            </tonk-display>
          </tonk-display>
        </section>
      </div>

# The Enable-sync command. Submitting the sync chip's "Enable sync" form
# asserts this transient command; the worker's `CreateSpaceHandler`
# (which serves both this and `space/create`, keyed on the shared `name`
# attribute) idempotently attaches the remote to the named space — the
# repo already exists, so the create step no-ops and only the attach
# runs. `remote` is the URL typed (or the `<tonk-default-remote>` button
# populated); `name` is the space's local repository name. The workspace
# concept's `{name}` is a display label, NOT the repo name, so the
# `<tonk-sync-state>` element (which resolves the repo from its
# `with` ancestor) stamps the real name into the form's
# hidden `name` input on click — the one identifier notation can't read
# from the event.
#
# It carries `create-space`'s attributes deliberately: the two ARE one
# command as far as the worker is concerned (`CreateSpaceHandler` serves
# both, keyed on the shared `name`). Two notation names, one shape.
#
# `prevent-default` used to be a field here. A side effect declared as a
# command field stores no value, so a rule premise over it matches zero
# rows however successfully the command transacted; it belongs on the
# `event!:` declaration of whatever binds this.
command!: &space/enable-sync
  description: A request to attach a sync remote to the current space.
  with:
    name:
      description: The space's local repository name, stamped into the hidden `name` input
      the: xyz.tonk.command.create-space/name
      as: text
    remote:
      description: The sync URL, read from the form's `remote` input on submit
      the: xyz.tonk.command.create-space/remote
      as: text

# Mint a repository invite. Clicking Share submits this transient; the
# worker's `InviteHandler` generates a fresh membership keypair, delegates
# the *origin* repository's access to its DID, asserts a durable
# `tonk:authorization` fact (the public delegation chain) and asserts the
# private seed as a `tonk:credential` into the reactor's session overlay
# (never replicated). The repository is not a field here — the handler
# reads it from the command's origin (the branch the commit landed in).
#
# How the share affordance's mount fills it. `<tonk-page>` raises `mount`
# as a CustomEvent, so its `timeStamp` is what makes each dispatch
# distinct.
event!: &on/invite
  type: "mount"
  where:
    time: ".timeStamp"

command!: &tonk/invite
  this: tonk:invite
  description: Mint a repo invite — generates a membership keypair and delegation.
  with:
    time:
      description: |
          The activation's timestamp; makes each dispatch distinct so a repeat
          click reliably re-fires the handler and rotates the credential.

          It used to be accompanied by a marker field read from a
          `data-invite` attribute, whose whole job was to stop a
          `tonk:pause-sync` transient — an identical {this, time} otherwise —
          from also decoding as an invite. Each command now owns its
          attribute namespace, so the two are disjoint and the marker is gone.
      the: xyz.tonk.command.invite/time
      as: float

# Load the requesting tab's site for its current path. Asserted transiently by
# `<tonk-site>` (via the regular transact API) instead of a `/site` fetch: the
# element supplies its own minted `site:<uuid>` as `this` and the route `path`.
# The transient rides the normal event path, routed at the `<tonk-site>`'s
# own `with` context (the origin repo/branch). The
# worker's `LoadHandler` matches `path` against this branch's `route!` table and
# stamps the resolved `tonk:site` (+ captured route params) onto `this` in this
# branch's overlay — superseding in place on navigation. One field, so it keeps
# decoding against an older seeded descriptor.
command!: &tonk/load
  this: tonk:load
  description: Stamp the requesting tab's site for its current path on this branch.
  with:
    path:
      description: The route path the tab is at, matched against the route table.
      the: xyz.tonk.site/path
      as: text

# NOTE: `tonk:pause-sync` is defined on the PROFILE branch (profile.yaml), not
# here. The FAB's `<ui-sync-status onpause=tonk:pause-sync>` cap dispatches it on
# the profile context carrying the target space, so pause needs nothing seeded
# on a space's own branch. It used to live here and be submitted by a hidden
# space-side form, which broke on any space seeded before that form existed.

# The durable, public half of an invite: the base58 delegation chain the
# handler minted, keyed by the membership DID. Replicates like any fact —
# a delegation chain is a scoped capability, not a secret.
concept!: &authorization
  this: tonk:authorization
  description: A delegation chain granting access to a repo, keyed by membership DID.
  with:
    proof:
      description: base58 delegation chain — the `?access=` part of the invite URL.
      the: xyz.tonk.authorization/proof
      cardinality: one
      as: text
    remote:
      description: >
        Legacy sync-endpoint URL suffix. Empty for invites minted since
        the endpoint moved into the delegation chain's signed
        `home.address` meta.
      the: xyz.tonk.authorization/remote
      cardinality: one
      as: text

# The private, ephemeral half of an invite: the membership keypair's seed
# and the finished URL built from it. Asserted only into the reactor's
# session overlay (never written to the branch tree, never replicated), so
# the secrets stay out of storage — the URL carries the seed in its `#`
# fragment, so it is exactly as secret as the seed. Keyed by the same
# membership DID as its `tonk:authorization`, so `tonk:invitation` joins the
# two.
concept!: &credential
  this: tonk:credential
  description: The private ed25519 seed of a membership principal, and its invite URL (overlay-only).
  with:
    seed:
      description: base58 keypair seed — the `#` fragment of the invite URL.
      the: xyz.tonk.credential/seed
      cardinality: one
      as: text
    link:
      description: The complete invite URL, shortened when the shortcut service answered.
      the: xyz.tonk.credential/link
      cardinality: one
      as: text

# The invite, as a join of the public `tonk:authorization` and the
# overlay-only `tonk:credential` on the membership DID. Declaring the
# attributes of both halves makes this concept resolve only an entity that
# has both — the durable proof/remote AND the overlay seed/link — so the
# share view renders only once the handler has asserted both.
#
# `link` is the whole URL, assembled (and shortened) by the mint handler.
# Views render it directly. `access`/`remote`/`code` remain the raw parts,
# still available to anything that needs to rebuild the URL by hand.
concept!: &invitation
  this: tonk:invitation
  description: An invite that can be used to join a space (authorization + credential).
  with:
    link:
      description: The complete invite URL — what a view renders and copies.
      the: xyz.tonk.credential/link
      cardinality: one
      as: text
    access:
      description: base58 delegation chain — the `?access=` part of the invite URL.
      the: xyz.tonk.authorization/proof
      cardinality: one
      as: text
    remote:
      description: >
        Legacy sync-endpoint URL suffix. Empty for invites minted since
        the endpoint moved into the delegation chain's signed
        `home.address` meta.
      the: xyz.tonk.authorization/remote
      cardinality: one
      as: text
    code:
      description: base58 keypair seed — the `#` fragment of the invite URL.
      the: xyz.tonk.credential/seed
      cardinality: one
      as: text

# The invite-link view — the default view for the `invitation` model, so
# `<tonk-display model=invitation>` mounts it with no explicit `view=`. It
# renders only once the handler has asserted both halves for the repo's
# subject (before that the display is empty). The readonly input shows
# `{link}`: the URL the mint handler assembled and shortened. The view no
# longer concatenates it from parts — shortening is an async round-trip a
# template can't make, so the whole URL arrives ready to render.
# `<wa-copy-button>` copies the same value.
view!:
  this: invitation
  show:
    ui: |
      <div class="invite-link">
        <style>
          /* Full-width invite field: the URL input fills the row and the
             copy button rides inside it as a suffix, so it reads as one
             control (matching the wireframe) rather than a narrow box with
             a tiny detached icon. */
          .invite-link { display: block; }
          .invite-link__url { display: block; width: 100%; }
        </style>
        <wa-input
          class="invite-link__url"
          label="Share link"
          readonly
          value="{link}"
        >
          <wa-copy-button
            slot="end"
            class="invite-link__copy"
            value="{link}"
          ></wa-copy-button>
        </wa-input>
      </div>

# Agent handoffs have separate command and overlay attributes from ordinary sharing.
concept!:
  this: tonk:agent-handoff
  description: Request an agent invitation scoped to the current browser account.
  with:
    time:
      description: The time this handoff was requested.
      the: xyz.tonk.agent-handoff/time
      as: float
      cardinality: one

concept!: &tonk/agent-handoff-state
  this: tonk:agent-handoff-state
  description: Session-only agent invitation response, independent of ordinary sharing.
  with:
    status:
      description: Ready marker or a pending or failure explanation.
      the: xyz.tonk.agent-handoff/status
      as: text
      cardinality: one
    link:
      description: Scoped invitation URL when ready, otherwise empty.
      the: xyz.tonk.agent-handoff/link
      as: text
      cardinality: one
    account:
      description: Required account for legacy handoffs; a profile placeholder for bearer invitations.
      the: xyz.tonk.agent-handoff/account
      as: entity
      cardinality: one

view!:
  this: tonk:agent-handoff-state
  show:
    ui: |
      <p data-agent-handoff-status>{status}</p>
      <tonk-display entity={this} model=tonk:connection-invite-controls>
        <span slot="no-entity" hidden></span>
      </tonk-display>

# Explicit new invitation; automatic mount requests omit this marker.
event!: &on/new-agent-invite
  type: "click"
  where:
    time: ".timeStamp"
    fresh: '"new"'

concept!:
  this: tonk:new-agent-invite
  description: Create a separate agent invitation when the user asks for one.
  with:
    time:
      description: The time a separate invitation was explicitly requested.
      the: xyz.tonk.agent-handoff/time
      as: float
      cardinality: one
    fresh:
      description: Explicit new-invitation marker; absent from automatic mounts.
      the: xyz.tonk.agent-handoff/fresh
      as: text
      cardinality: one

# New-mode controls also remain reachable when a transient link is unavailable.
concept!:
  this: tonk:connection-invite-controls
  description: Session-only explicit action for another scoped invitation.
  with:
    mode:
      description: Marker emitted only by the scoped invitation adapter.
      the: xyz.tonk.agent-handoff/mode
      as: text
      cardinality: one

view!:
  this: tonk:connection-invite-controls
  show:
    ui: |
      <tonk-component>
        <script type="tonk/module">
          customElements.get("tonk-agent-invite-controls") ||
            customElements.define("tonk-agent-invite-controls", class extends HTMLElement {
              static observedAttributes = ["mode"];
              connectedCallback() {
                this.observer = new MutationObserver(() => this.render());
                this.observer.observe(this, { childList: true, subtree: true });
                this.afterRegistration = () => {
                  if (["account", "activation"].includes(this.getAttribute("mode"))) {
                    this.dispatchEvent(new CustomEvent("mount", { bubbles: true }));
                  }
                };
                window.addEventListener("tonk:registration-closed", this.afterRegistration);
                this.onclick = event => {
                  const button = event.target.closest("[data-invite-account]");
                  if (!button || button.hidden) return;
                  globalThis.tonk.register(JSON.stringify({
                    reason: this.getAttribute("mode") === "activation"
                      ? "agent-invite-activation" : "agent-invite-account"
                  }));
                };
                this.render();
              }
              disconnectedCallback() {
                this.observer?.disconnect();
                window.removeEventListener("tonk:registration-closed", this.afterRegistration);
                this.onclick = null;
              }
              attributeChangedCallback() { if (this.isConnected) this.render(); }
              render() {
                const mode = this.getAttribute("mode");
                for (const button of this.querySelectorAll("[data-invite-action]")) {
                  button.hidden = !button.dataset.inviteAction.split(" ").includes(mode);
                }
                const account = this.querySelector("[data-invite-account]");
                if (account) {
                  const label = mode === "activation" ? "verify account" : "create an account or sign in";
                  if (account.textContent !== label) account.textContent = label;
                }
              }
            });
        </script>
      </tonk-component>
      <tonk-agent-invite-controls mode={mode} on:invite=tonk:agent-handoff>
        <button class="connection-invite-new" data-invite-account data-invite-action="account activation" hidden>create an account or sign in</button>
        <button class="connection-invite-new" data-invite-action="retry" hidden on:new-agent-invite=tonk:new-agent-invite>try again</button>
        <button class="connection-invite-new" data-invite-action="new" hidden on:new-agent-invite=tonk:new-agent-invite>new invite</button>
        <button class="connection-invite-new" data-invite-action="sync" hidden on:new-agent-invite=tonk:new-agent-invite>turn on sync</button>
      </tonk-agent-invite-controls>
      <style>
        tonk-agent-invite-controls [hidden] { display: none !important; }
        .connection-invite-new {
          min-height: 36px; padding: 0 16px; border: 0; border-radius: 0;
          background: transparent; color: var(--wa-color-text-normal);
          box-shadow: inset 0 0 0 1px currentColor;
          font: 600 13px/1 'IBM Plex Sans Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif;
          letter-spacing: .02em; cursor: pointer;
        }
        .connection-invite-new:hover { background: color-mix(in srgb, currentColor 6%, transparent); }
        .connection-invite-new:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
      </style>

concept!: &tonk/agent-invite
  this: tonk:agent-invite
  description: An agent invitation joined with the repository name for the copied prompt.
  with:
    name:
      description: The repository's display name.
      the: xyz.tonk.repo/name
      cardinality: one
      as: text
    link:
      description: The complete agent invitation URL.
      the: xyz.tonk.agent-invite/link
      cardinality: one
      as: text
    account:
      description: The account required by legacy handoffs; unused by bearer invitations.
      the: xyz.tonk.agent-invite/account
      cardinality: one
      as: entity

# A refused invite mint, asserted into the session overlay by the worker.
# The empty-canvas and empty-sheet agent-link panels use it as the fallback
# behind `tonk:agent-invite`: while neither exists they show a short pending
# label; if minting is refused they replace that label with the worker-owned
# reason sentence.
concept!: &share/blocked
  this: tonk:share/blocked
  description: Why the latest invite request could not produce a shareable link.
  with:
    blocked:
      description: Stable refusal class.
      the: xyz.tonk.share/blocked
      cardinality: one
      as: text
    detail:
      description: Human-readable refusal reason.
      the: xyz.tonk.share/detail
      cardinality: one
      as: text
    time:
      description: Timestamp of the invite request this refusal answers.
      the: xyz.tonk.share/time
      cardinality: one
      as: float

view!:
  this: tonk:share/blocked
  show:
    ui: |
      <div class="local-invite-notice">
        <style>
          .local-invite-notice {
            display: flex;
            flex-direction: column;
            gap: 7px;
            width: min(432px, 100%);
            --edge-ink: #38182a;
            --edge-soft: #5b4953;
            --edge-panel: #f7f6f5;
            --edge-ring: rgba(56,24,42,.28);
            color: var(--edge-soft);
            font-family: "IBM Plex Sans", Helvetica, Arial, sans-serif;
          }
          :root.wa-dark .local-invite-notice {
            --edge-ink: #e2dfdd;
            --edge-soft: #c8c3bf;
            --edge-panel: #1b1718;
            --edge-ring: rgba(226,223,221,.28);
          }
          .local-invite-notice__label {
            min-height: 36px;
            padding: 9px 12px;
            display: flex;
            align-items: flex-end;
            background: var(--edge-panel);
            box-shadow: 0 0 0 1px var(--edge-ring);
            font-size: 12px;
            font-weight: 600;
            text-transform: lowercase;
          }
          .local-invite-notice p {
            margin: 0;
            min-height: 36px;
            padding: 12px 14px;
            background: var(--edge-panel);
            box-shadow: 0 0 0 1px var(--edge-ring);
            font-size: 13px;
            line-height: 1.55;
            text-wrap: pretty;
          }
        </style>
        <span class="local-invite-notice__label">sharing unavailable</span>
        <p>{detail}</p>
      </div>

# Only a ready invitation response can produce an agent prompt. Its
# derived attributes must differ from the response attributes, or a pending
# response with an empty link satisfies the prompt concept directly.
rule!:
  description: Joins the repository name with its ready agent invitation.
  assert: tonk/agent-invite
  when:
    - assert: tonk/repository
      where:
        this: ?this
        name: ?name
    - assert: tonk/agent-handoff-state
      where:
        this: ?this
        status: "ready"
        link: ?link
        account: ?account

# Human-facing invitation; the machine instructions live only in the copy value.
view!:
  this: tonk:agent-invite
  show:
    ui: |
      <tonk-component>
        <script type="tonk/module">
          customElements.get("tonk-agent-prompt") ||
            customElements.define("tonk-agent-prompt", class extends HTMLElement {
              static observedAttributes = ["link"];
              connectedCallback() {
                this.observer = new MutationObserver(() => this.render());
                this.observer.observe(this, { childList: true, subtree: true });
                this.render();
              }
              disconnectedCallback() { this.observer?.disconnect(); }
              attributeChangedCallback() { if (this.isConnected) this.render(); }
              render() {
                let mode = "";
                try {
                  const hash = new URL(this.getAttribute("link")).hash;
                  mode = /^#tonk-agent-v[12]=/.test(hash) ? "scoped" : "unsupported";
                } catch (_) {}
                for (const block of this.querySelectorAll("[data-agent-mode]")) {
                  block.hidden = block.dataset.agentMode !== mode;
                }
                let page;
                try { page = new URL(this.getAttribute("link")); } catch (_) {}
                const local = page && ["localhost", "127.0.0.1", "[::1]"].includes(page.hostname);
                const copy = this.querySelector(".agent-prompt__copy");
                const prompt = copy?.getAttribute("value") || "";
                if (local && prompt.includes("npx --yes @tonk/cli")) {
                  const localPrompt = prompt
                    .replaceAll("npx --yes @tonk/cli", "tonk")
                    .replace(
                      "tonk join '",
                      `TONK_CONNECTION_ORIGIN=${JSON.stringify(page.origin)} tonk join '`,
                    );
                  copy.setAttribute("value", localPrompt);
                }
              }
            });
        </script>
      </tonk-component>
      <tonk-agent-prompt link={link}>
      <div class="agent-prompt">
        <style>
          tonk-agent-prompt [hidden] { display: none !important; }
          tonk-agent-prompt [data-agent-mode] { display: flex; flex-direction: column; gap: var(--wa-space-m); }
          .agent-prompt { padding: var(--wa-space-l); border-radius: var(--wa-border-radius-l); background: var(--wa-color-surface-lowered); display: flex; flex-direction: column; gap: var(--wa-space-m); }
          .agent-prompt p { margin: 0; line-height: var(--wa-line-height-normal); text-wrap: pretty; }
          .agent-prompt__action { display: flex; align-items: stretch; }
          .agent-prompt__copy {
            display: inline-flex;
            align-self: flex-start;
            max-inline-size: 100%;
            --agent-copy-ink: var(--wa-color-neutral-on-loud);
            --agent-copy-surface: var(--wa-color-text-normal);
          }
          .agent-prompt__copy::part(button) {
            display: inline-flex;
            box-sizing: border-box;
            min-width: 144px;
            min-height: 44px;
            padding: 0 16px;
            border: 0;
            border-radius: 0;
            align-items: center;
            justify-content: center;
            background: var(--agent-copy-surface);
            color: var(--agent-copy-ink);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--agent-copy-ink) 28%, transparent);
            font: 600 13px/1 'IBM Plex Sans Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif;
            letter-spacing: .02em;
            text-transform: lowercase;
            transition: scale 150ms ease-out, background-color 150ms ease-out;
          }
          .agent-prompt__copy::part(button):hover {
            background: color-mix(in srgb, var(--agent-copy-ink) 6%, var(--agent-copy-surface));
            color: var(--agent-copy-ink);
          }
          .agent-prompt__copy::part(button):active {
            scale: .96;
            background: color-mix(in srgb, var(--agent-copy-ink) 12%, var(--agent-copy-surface));
            color: var(--agent-copy-ink);
          }
          .agent-prompt__copy::part(button):focus-visible {
            background: var(--agent-copy-surface);
            color: var(--agent-copy-ink);
            outline: 2px solid var(--wa-color-text-normal);
            outline-offset: 3px;
          }
          .agent-prompt__copy::part(copy-icon),
          .agent-prompt__copy::part(success-icon),
          .agent-prompt__copy::part(error-icon) {
            color: inherit;
            animation: none;
          }
          .agent-prompt__copy[disabled]::part(button) { opacity: .4; cursor: not-allowed; scale: 1; }
          .agent-prompt__copy::part(tooltip__base) { display: none; }
          @media (prefers-reduced-motion: reduce) {
            .agent-prompt__copy::part(button) { transition: none; }
            .agent-prompt__copy::part(button):active { scale: 1; }
          }
          .agent-prompt__new {
            min-height: 44px; padding: 0 16px; border: 0; border-radius: 0;
            background: transparent; color: var(--wa-color-text-normal);
            box-shadow: inset 0 0 0 1px currentColor;
            font: 600 13px/1 'IBM Plex Sans Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif;
            letter-spacing: .02em; cursor: pointer;
          }
          .agent-prompt__new:hover { background: color-mix(in srgb, currentColor 6%, transparent); }
          .agent-prompt__new:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
          .agent-prompt__note { color: var(--wa-color-text-quiet); font-size: var(--wa-font-size-s); }
        </style>
        <div data-agent-mode="unsupported" hidden>
          <p class="agent-prompt__note">this invitation is no longer supported. reload tonk to get the latest version, then create a new invite and use <code>tonk join</code>.</p>
          <button class="agent-prompt__new" on:new-agent-invite=tonk:new-agent-invite>new invite</button>
        </div>
        <div data-agent-mode="scoped" hidden>
        <p>copy the prompt and give it to your agent. then tell it what you want to build.</p>
        <p class="agent-prompt__note">anyone with this link can read and change this space until it expires or you revoke it. keep it private. you can close tonk after copying.</p>
        <div class="agent-prompt__action">
          <wa-copy-button class="agent-prompt__copy" copy-label="copy prompt" success-label="prompt copied" error-label="could not copy" value="You're helping build the &quot;{name}&quot; Tonk space.

      Connect to the exact space this prompt came from:

        npx --yes @tonk/cli join '{link}'

      This reusable bearer link contains the invitation key and grants for this space. Keep it private. Run the command without CLI account login, browser approval, or account-switch flags. The command prints the chosen local name; use --name if you need a different local alias. Only report connected after it prints &quot;Agent connection confirmed&quot;, which follows a successful pull and acknowledged receipt push. If interrupted, resume without the link using `npx --yes @tonk/cli --space NAME join`. If access expires or is revoked, ask me for a fresh invite. Local data and offline edits remain available. Multiple holders of this link share the same invitation authority and receipt; the receipt does not establish exclusive use or online presence.

      Then run `npx --yes @tonk/cli --space NAME status` and `npx --yes @tonk/cli help tutorial`. The command binds your original working directory to the connected space; elsewhere, pass --space with the printed local name. Ask me what I want to build. Use `npx --yes @tonk/cli` for each CLI command that changes data, schemas, or views; changes sync directly into this space. Finish with `npx --yes @tonk/cli space home &lt;concept&gt;` to put the result on the space home.">
            <span slot="copy-icon" aria-hidden="true">copy prompt</span>
            <span slot="success-icon" aria-hidden="true">prompt copied</span>
            <span slot="error-icon" aria-hidden="true">could not copy</span>
          </wa-copy-button>
        </div>
        </div>
      </div>
      </tonk-agent-prompt>

# Connection receipt, written only after the CLI has pulled this space.
# A durable acknowledgement, deliberately not an online/heartbeat signal.
concept!: &agent-connection
  this: tonk:agent-connection
  description: Confirmation that an agent CLI pulled this space and sent a reply.
  with:
    status:
      description: Human-readable acknowledgement of a completed agent connection.
      the: xyz.tonk.agent-connection/status
      cardinality: one
      as: text

view!:
  this: tonk:agent-connection
  show:
    directory: |
      <div class="agent-connection-receipts" aria-label="Agent connection receipts">
        <style>
          .agent-connection-receipts {
            position: fixed;
            left: 50%;
            bottom: max(64px, calc(env(safe-area-inset-bottom) + 56px));
            z-index: 12;
            width: min(432px, calc(100vw - 48px));
            max-height: 40dvh;
            overflow-y: auto;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 7px;
          }
        </style>
        <tonk-display entity={this} model=tonk:agent-connection />
      </div>
    ui: |
      <details open class="agent-connection" data-this={this}>
        <summary aria-label="Dismiss agent connection notification">×</summary>
        <span role="status">agent setup confirmed</span><span class="agent-connection-note">this confirms a completed sync, not whether the agent is online.</span>
        <style>
          .agent-connection {
            position: relative;
            box-sizing: border-box;
            border: 0;
            border-radius: 0;
            margin: 0;
            width: 100%;
            min-height: 44px;
            padding: 12px 52px 12px 24px;
            background: var(--wa-color-surface-raised);
            color: var(--wa-color-text-normal);
            box-shadow: 0 0 0 1px var(--wa-color-neutral-border-normal);
            -webkit-backdrop-filter: blur(12px) saturate(1.5);
            backdrop-filter: blur(12px) saturate(1.5);
            font: 400 13px/1.45 var(--wa-font-family-body);
            text-align: center;
            animation: agent-connection-enter .4s cubic-bezier(.25,.46,.45,.94) both,
              agent-connection-exit .4s ease-out 120s forwards;
          }
          .agent-connection-note { display: block; margin-top: 4px; color: var(--wa-color-text-quiet); }
          .agent-connection:not([open]) { display: none; }
          .agent-connection > summary {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0;
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 100%;
            min-height: 44px;
            list-style: none;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
          }
          .agent-connection > summary::after { display: none; }
          .agent-connection > summary::-webkit-details-marker { display: none; }
          .agent-connection > summary:hover { background: rgb(56 24 42 / 6%); }
          .agent-connection > summary:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: -3px;
          }
          @keyframes agent-connection-enter {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
          }
          @keyframes agent-connection-exit {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(12px); visibility: hidden; }
          }

          @media (prefers-reduced-motion: reduce) {
            .agent-connection { animation-duration: 0s; }
          }
        </style>
      </details>

# A space member, as seen in the "shared with" roster. Reads the
# `Membership` + `MemberRole` facts the worker records on the content
# branch (the synced branch, so the roster converges across the space).
# `member` is the member account's DID entity; `role` is `tonk:founder`
# for the creator or `tonk:member` for invite claimers. Declaring both
# attributes makes an instance resolve only once its role is stamped.
concept!: &member
  this: tonk:member
  description: A member of a space — an account on the roster.
  with:
    member:
      description: The member account's DID (the `member` of the Membership)
      the: xyz.tonk.membership/member
      cardinality: one
      as: entity
    role:
      description: "The member's role: tonk:founder (creator) or tonk:member (joiner)"
      the: xyz.tonk.membership/role
      cardinality: one
      as: entity
    name:
      description: The member's self-asserted display name for this space
      the: xyz.tonk.membership/name
      cardinality: one
      as: text

# A single roster row — the default view for `model: tonk:member`. Each
# member is one entry in the "shared with" list: the member's display name
# (with the DID tail beneath as a fallback id), and a role badge.
#
# The DID's last 8 chars sit under the name as a stable disambiguator (the
# full value is in `title`); CSS `direction:rtl` truncation clips the HEAD
# with an ellipsis, leaving the tail visible.
#
# The role badge label comes from CSS `::after` keyed on `data-role`, so the
# raw `tonk:founder` / `tonk:member` URI never shows; the raw {role} text is
# kept (visually hidden) only to drive the attribute.
# Removing a member. Acts on the space it fires in. The worker's handler
# does the chain work; the service refuses a removal minted under a
# member's `/use` chain, so holding the space is what makes it take
# effect, not the role on the roster. Promotion is not a form: the FAB
# dispatches it after the page mints the admin hop under the passkey.
#
# The field used to be read from a `data-expel` attribute, chosen for
# being read by no other command — the attribute doubling as the command's
# shape. `xyz.tonk.command.expel-member/member` is that distinctness by
# construction, so the name can just say what it means.
command!: &member/expel
  description: Remove a member from this space.
  with:
    member:
      description: The DID of the member to remove.
      the: xyz.tonk.command.expel-member/member
      as: entity

view!:
  this: tonk:member
  show:
    ui: |
      <div class="roster__row" data-role={role}>
        <span class="roster__identity">
          <span class="roster__name">{name}</span>
          <span class="roster__did" title={member}><bdi>{member}</bdi></span>
        </span>
        <span class="roster__role" data-role={role}>{role}</span>
      </div>

# The roster — every `tonk:member` instance rendered as a row. Mounted
# in the invite panel via `<tonk-display model=tonk:member>` (no
# `entity`, so the directory view resolves and iterates all members).
view!:
  this: tonk:member
  show:
    directory: |
      <div class="roster">
        <style>
          /* Share-dialog roster section: a labelled block under the invite
             link. (Styled here because the roster view always mounts with
             it, and the share dialog has no <style> of its own.) */
          .roster-section {
            margin-top: var(--wa-space-l);
          }
          .roster-section__label {
            margin: 0 0 var(--wa-space-2xs);
            font-size: var(--wa-font-size-xs);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--wa-color-text-quiet);
          }
          .roster {
            display: flex;
            flex-direction: column;
          }
          /* Each member instance mounts as a nested <tonk-display>; let the
             row fill the width so avatar / did / badge lay out across it. */
          .roster > tonk-display,
          .roster > tonk-display > tonk-view {
            display: block;
          }
          .roster__row {
            display: flex;
            align-items: center;
            gap: var(--wa-space-s);
            padding: var(--wa-space-xs) 0;
            border-bottom: 1px solid var(--wa-color-surface-border);
            font-size: var(--wa-font-size-s);
          }
          .roster > tonk-display:last-child .roster__row {
            border-bottom: none;
          }
          /* The sigil-glyph avatar: a deterministic identity glyph hashed
             from the member DID, CLIPPED to a circle. The sigil renders a
             square SVG; `border-radius:50%` + `overflow:hidden` on the host
             clips it round (matching the wireframe avatars). The sprite is
             supplied by the sealed guest, so it paints inside the opaque
             iframe. */
          /* The DID's LAST 8 chars: `direction:rtl` makes the overflow clip
             the head (with a leading ellipsis), so the tail stays visible.
             `<bdi>` keeps the DID itself rendering left-to-right inside the
             rtl box. Monospace, quiet — a fallback identity until names land. */
          /* The name + DID column. Grows to fill the row, pushing the role
             badge to the right edge. */
          .roster__identity {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-width: 0;
          }
          /* The display name — the primary identifier. */
          .roster__name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: var(--wa-font-size-s);
            color: var(--wa-color-text-normal);
          }
          .roster__did {
            /* Cap to about the last 8 chars (+ the leading ellipsis); the
               full DID is in `title`. A quiet sub-line under the name. */
            max-width: 9ch;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            direction: rtl;
            text-align: left;
            font-family: var(--wa-font-family-code);
            font-size: var(--wa-font-size-xs);
            color: var(--wa-color-text-quiet);
          }
          /* The raw role URI is hidden; the badge label comes from ::after
             keyed on data-role. Square brutalist chip, matching the wireframe:
             founder is filled (loud), member is outline. */
          .roster__role {
            flex: none;
            font-size: 0;
            line-height: 0;
            color: transparent;
          }
          .roster__role::after {
            display: inline-block;
            font-family: var(--wa-font-family-code);
            font-size: 11px;
            line-height: 1.4;
            letter-spacing: 0.02em;
            text-transform: lowercase;
            padding: 1px 7px;
            border: 1px solid var(--wa-color-text-normal);
            color: var(--wa-color-text-normal);
            content: attr(data-role);
          }
          .roster__role[data-role="tonk:founder"]::after {
            content: "founder";
            background: var(--wa-color-text-normal);
            color: var(--wa-color-surface-default);
          }
          .roster__role[data-role="tonk:admin"]::after {
            content: "admin";
          }
          .roster__role[data-role="tonk:member"]::after {
            content: "member";
            color: var(--wa-color-text-quiet);
            border-color: var(--wa-color-surface-border);
          }
        </style>
        <tonk-display entity={this} model={dom.host/model} />
      </div>

# NOTE: the FAB's pause affordance is no longer a space-side view. It moved to
# the host-chrome `<ui-sync-status onpause=tonk:pause-sync>` cap, which
# dispatches the profile-branch `tonk:pause-sync` command (profile.yaml)
# carrying the target space. So there is no `tonk:view/fab-pause` here anymore —
# an older space missing it no longer breaks the FAB.

# A transplant scar: this space adopted its history from another
# subject, re-rooted under a fresh key (typically because the old
# subject's keys were lost). Written by `tonk space transplant` in the
# first commit minted under the new subject, so the record sits at the
# origin boundary and the seam stays queryable. `origin` is the old
# subject's DID entity — the same form membership and directory rows
# use, so the scar joins against facts still anchored on it.
concept!:
  this: tonk:transplant
  description: A record of this space adopting its history from another subject.
  with:
    origin:
      description: The subject DID the history was adopted from
      the: xyz.tonk.transplant/origin
      cardinality: one
      as: entity
    revision:
      description: >
        The origin's last published head record, byte-exact. The record
        is operator-signed, so the endpoint of the adopted history stays
        verifiable after the origin's own stores are gone.
      the: xyz.tonk.transplant/revision
      cardinality: one
      as: bytes
    tree:
      description: The tree root the transplant adopted
      the: xyz.tonk.transplant/tree
      cardinality: one
      as: text

# The repository's own name, stored in its content branch so the repo
# is self-describing — the name travels with the repository rather than
# living only in the joining profile's replica index. The banner reads
# it via `<tonk-display model=tonk:repository entity={subject}>`;
# `tonk/rename-repository` edits it. The concept is pinned to
# `tonk:repository` so the display can resolve its view, but its
# *instances* are keyed by the replica's `subject` DID (the entity the
# name attaches to is the subject, there is no separate `subject`
# field). The banner falls back to "Untitled" when unset.
concept!: &tonk/repository
  this: tonk:repository
  description: A shared repository which is the subject of a tonk/replica.
  with:
    name:
      description: >
        The repository's display name. Seeded at creation (the worker
        writes it into the repo's own `tonk/repository` on the content
        branch) and carried over sync on join, so a real repository
        always has one; the banner still falls back to "Untitled" if a
        read races ahead of the fact.
      the: xyz.tonk.repo/name
      cardinality: one
      as: text

# Agent working context carried by the repository itself. The instance is keyed
# by the same stable repository subject DID as `tonk/repository`, so it syncs
# with the space rather than belonging to one filesystem checkout or replica.
attribute!: &tonk/agents-markdown
  the: xyz.tonk.repo/agents
  description: >
    Markdown working context for agents using this repository.
    Keep durable concepts, workflows, decisions, and recurring pitfalls here;
    omit credentials, invite links, transient status, and one-off completions.
  cardinality: one
  as: text

concept!: &tonk/agents
  this: tonk:agents
  description: AGENTS.md context attached to the repository subject DID.
  with:
    markdown: tonk/agents-markdown

# Rename the current repository. The editable banner input dispatches
# this on commit (blur/enter); `name` reads the input's value and
# `subject` reads the repository identity stamped on the banner so the
# rule below knows which repository to rename. The command is transient:
# the rule fires once and the command is swept before the durable commit.
# How the banner input's commit fills the rename. `subject` stays a
# `data-*` read rather than `{this}`: the banner is not inside a repeat
# row, and its subject is the repository rather than the view's own
# entity, so the two are genuinely different values here.
event!: &on/repository-rename
  type: "change"
  where:
    subject: ".currentTarget.dataset.subject"
    name: ".currentTarget.value"

command!: &tonk/rename-repository
  description: Rename the repository.
  with:
    subject:
      description: The repository being renamed.
      the: xyz.tonk.rename-repository/subject
      as: entity
    name:
      description: The new name.
      the: xyz.tonk.rename-repository/name
      as: text

# Apply the rename: assert the new `tonk/repository` name against the
# repository entity named by the command's `subject`. Binding `subject`
# to `?this` makes the command's subject DID the head's entity directly,
# so the (cardinality-one) name overwrites in place on that repository.
rule!:
  description: Renames the repository from a rename-repository command
  assert!: tonk/repository
  when:
    - assert: tonk/rename-repository
      where:
        subject: ?this
        name: ?name

# The repository-name banner: a borderless text input that looks like
# plain title text until focused. It shows the current `{name}` and
# carries the repository's identity (`{this}` is the subject DID) on
# `data-subject` so the `tonk/rename-repository` command can read it.
# `onchange` fires on commit (blur or Enter), reading the new value from
# `dom.event.current-target/value`; the rename rule above then writes it
# back. The banner mounts this via `<tonk-display model=tonk:repository
# entity={subject}>`; a repo whose name fact has not landed yet resolves
# no model, and the mount's `slot="no-model"` renders "Untitled" until it
# does (the worker seeds the name at creation, sync carries it on join).
view!:
  this: tonk:repository
  show:
    ui: |
      <tonk-editable
        class="workspace__title-input"
        value={name}
        data-subject={this}
        on:repository-rename=tonk/rename-repository
        aria-label="Space name"
      ></tonk-editable>

# ============================================================
# SELF-IDENTITY CHIP
# ============================================================

# The signed-in member's own identity for this space. Resolves against
# the `state:self` overlay the worker stamps on this space branch
# (mirroring the sync chip's `state:here`), so self-identity reaches
# the sealed iframe with no profile-branch access. `did` feeds the
# sigil; `name` is the editable display name.
concept!: &tonk/identity
  this: tonk:identity
  description: The signed-in member's own identity for this space.
  with:
    did:
      description: The self profile DID (feeds the sigil glyph).
      the: xyz.tonk.identity/did
      cardinality: one
      as: entity
    name:
      description: The self display name shown (and edited) in the chip.
      the: xyz.tonk.identity/name
      cardinality: one
      as: text

# Rename the signed-in member (set their display name). The editable chip
# input dispatches this on commit (blur/Enter). No rule: a typed-Rust
# handler in tonk-worker reacts (it must reach the profile meta branch).
#
# This and `tonk/rename-repository` both read `currentTarget.value`, and a
# marker field read from `data-rename` is what used to keep the two
# shapes disjoint — without it every space rename also renamed the
# profile. Separate attribute namespaces do that now.
command!: &profile/rename
  description: Rename the signed-in member (set their display name).
  with:
    name:
      description: The new name, read from the editable's value on commit.
      the: xyz.tonk.command.profile-rename/name
      as: text

# The repository's name, as two extra facets of `tonk:repository`'s
# dictionary. `label` — plain, non-editable text: the Hub card mounts
# `<tonk-display model=tonk:repository entity={subject} view=label>`
# inside a per-space `with={subject}` routing context, so each card
# shows its own space's current name (read from that space's
# `tonk/repository`, the cross-device source of truth) rather than an
# editable banner. `title` — the browser tab's title: the space
# chrome mounts `view=title` inside a per-space `with={id}` routing
# context; `<tonk-title>` renders nothing — it pushes the text to the
# host page, which owns `document.title`. Distinct facets, so the
# editable banner, the plain text, and the title never collide under
# the default `ui` resolution.
view!:
  this: tonk:repository
  show:
    label: |
      {name}

view!:
  this: tonk:repository
  show:
    title: |
      <tonk-title text="{name} — Tonk"></tonk-title>

concept!: &inspector
  description: An inspector tile body — renders <tonk-inspector source="…">
  with:
    source:
      description: Space name to inspect (passed through as the source attribute)
      the: xyz.tonk.inspector/source
      cardinality: one
      as: text

# The imperative escape hatch: `<tonk-portal>` writes an
# author-supplied HTML document into a sandboxed iframe, for work the
# declarative template stack can't express (canvas, WebGL, widgets).
# The `content` is first-class dialog data, fetched by a nested
# `<tonk-display model=portal>` like any other concept.
concept!: &portal
  description: Imperative HTML rendered in an isolated iframe
  with:
    content:
      description: HTML document written into the portal iframe
      the: xyz.tonk.portal/content
      cardinality: one
      as: text

# One view per concept, keyed by `model`. Each nested
# `<tonk-display>` passes only `model=…` (and `entity=…`); with no
# `view` attribute it resolves the view whose `model` matches. The
# chain iterates one level of the hierarchy per template via
# `subject={field}` and bottoms out in the tile's content display.

view!:
  this: inspector
  show:
    ui: |
      <tonk-inspector source={source} />



view!:
  this: inspector
  show:
    directory: |
      <tonk-inspector />

# The canonical bridge from the `portal` concept to the
# `<tonk-portal>` element. `html:` forces the binding through
# setAttribute so `attributeChangedCallback` fires. Users never write
# this; nesting a `<tonk-display model=portal>` over a portal entity
# resolves it by model and renders it.
view!:
  this: portal
  show:
    ui: |
      <tonk-portal html:content={content} />

# An author-defined custom element carried as branch data.
#
# `element!: &tally-widget` publishes `id:tally-widget` pointing at the
# entity the assertion derives, and the browser resolves a tag through
# that name the moment it first meets the tag in the DOM. Nothing is
# registered ahead of time, and repointing the name — at a definition
# authored elsewhere, or back at an earlier one — swaps the element for
# everything that refers to it.
#
# The entity is DERIVED, so it is a digest of the whole body, methods
# included. An element is a value: two definitions with the same
# methods and the same description ARE the same element, and changing
# a method makes a different one. The tag is the mutable part — a name
# pointing at whichever value it currently means — which is what makes
# a definition swappable at all.
#
# That bears on DERIVATION, not on editing. A body that derives its
# own entity is the whole element, so re-deriving from a single method
# mints a one-method element rather than patching the existing one.
# Editing in place is untouched: name the entity and assert only the
# key you are changing —
#
#     element!:
#       this: <the entity &tally-widget names>
#       method:
#         connected: |
#           (self) => { ... }
#
# — which supersedes that one fact and leaves the rest standing,
# exactly as re-authoring one view facet does. `tonk element add`
# takes the other road, reading the current methods and carrying them
# forward before it re-derives, because the CLI works in tags rather
# than entities and a fresh value has to repoint the anchor.
#
# The tag itself is deliberately NOT a field. It lives in the anchor,
# where it can be repointed; a copy of it in the body would be a
# second, immutable answer to the same question.
#
# `method` is a keyed dictionary, the same construct as a view's
# `show`. A view is a dictionary of templates keyed by facet; an
# element is a dictionary of functions keyed by method.
#
# The concept is anchored, not pinned, like the other view-layer
# concepts here: a pin is for a concept some code names by URI, and
# nothing names this one.
#
# `description` is the only field a body must set. Both dictionaries
# below are keyed collections, which are zero-or-more, so omitting one
# declares an empty map rather than leaving a field unset — an
# `element!:` carrying a description alone is a complete assertion. It
# defines an element with no methods and no defaults: the tag resolves,
# the row lists, and the browser leaves the tag inert because there is
# nothing to register.
concept!: &element
  description: A custom element definition carried as branch data
  with:
    description:
      description: |
        What this element is for, in the author's own words — the same
        thing a concept's `description` carries, and required for the
        same reason: an element is read by people and by agents that
        have only the branch to go on, and a tag name alone does not
        say what `<tally-widget>` is meant to do.

        It is an ordinary field, but it does reach the entity digest
        along with the methods, so two elements that differ only in
        their description are two different values. That is the right
        reading: the description is part of what the definition says.
      the: xyz.tonk.element/description
      cardinality: one
      as: text
    method:
      description: |
        The element's methods, keyed by name, each a JS arrow-function
        expression taking the element as its first argument.

        Four keys are dispatched by the DOM lifecycle: `connected`,
        `disconnected`, `adopted` — all `(self) => …` — and
        `attribute-changed`, `(self, name, before, after) => …`.

        Two more cover a definition being REPLACED while instances are
        live, which the DOM has no notion of. `released`, `(self) =>
        …`, runs on the OUTGOING definition before the swap: undo what
        `connected` set up, and stash anything worth keeping on the
        element. `swapped`, `(self) => …`, runs on the incoming one and
        takes over the live instance; without it the runtime re-runs
        `connected`, which is right only when nothing needed undoing.

        The reserved `define` key is the escape hatch for what a method
        table cannot express (`static formAssociated`, extending a
        built-in): `() => class extends HTMLElement { … }`, whose
        returned class the runtime registers INSTEAD of the generated
        wrapper, ignoring every other key. Any other key becomes a
        method on the element, callable as `el.<name>()`; a key that
        would shadow a member of `HTMLElement.prototype` is refused.

        That is also how one method calls another — `self.total()`
        inside `connected`. The call resolves through the live table
        rather than through the definition it was written in, so
        re-authoring `total` alone changes what an untouched
        `connected` computes.

        There is no `observedAttributes` to declare.
        `attribute-changed` is driven by a `MutationObserver` over
        every attribute; `attributeChangedCallback`'s list is read once
        when the tag is registered and so could never grow with an
        edited method.
      the: xyz.tonk.element.method
      as: {[symbol]: text}
      cardinality: one
    getter:
      description: |
        Property reads, keyed by property name, each `(self) => …`.

        `value: (self) => …` makes `el.value` read through the branch's
        current definition the way `el.total()` calls through it, so a
        re-authored getter changes what a page already reading the
        property sees. A method could not do this job: `el.value` and
        `el.value()` are different things, and a consumer written
        against the DOM expects the first.

        Its own dictionary rather than a prefix inside `method`,
        because a getter, a setter and a method have three different
        signatures and a key like `get.value` could not be told apart
        from a method genuinely called that. The cost is one more live
        query per watched tag.

        A key that would shadow a member every element already has is
        refused, the same as a method key.
      the: xyz.tonk.element.getter
      as: {[symbol]: text}
      cardinality: one
    setter:
      description: |
        Property writes, keyed by property name, each
        `(self, next) => …`.

        Paired with `getter` by name: declaring both makes the property
        read-write, `getter` alone makes it read-only, and `setter`
        alone makes it write-only — which is a real shape (a sink that
        takes a value and renders it) rather than a mistake, so it is
        allowed.
      the: xyz.tonk.element.setter
      as: {[symbol]: text}
      cardinality: one
    attribute:
      description: |
        Default values for the element's attributes, keyed by
        attribute name. An instance missing one has it written on
        before `connected` runs, so every hook, every CSS rule and
        every `getAttribute` reads the same value whether the view
        supplied it or not.

        This is NOT `observedAttributes`, and it narrows nothing.
        `attribute-changed` fires for every attribute whether or not
        it appears here, because the runtime watches them with a
        `MutationObserver` rather than declaring a list up front.
        Narrowing to a declared list would only restore the footgun
        that observer exists to avoid: an attribute left out of the
        list goes silently unnoticed. So an attribute needs no entry
        here to work — it needs one to have a DEFAULT, which is the
        only thing this map supplies.

        An attribute whose default is empty is written `size: ""` —
        present and empty, like `<input disabled="">`.

        Most elements declare none, and the map is then simply absent.
        That is what a keyed collection means: zero-or-more, so an
        `element!:` body omitting it is complete, not partial.

        What all four dictionaries here cost, stated once: a GENERIC
        concept query binds every field the concept declares, and a
        keyed collection with no entries binds nothing — so `tonk query
        element` answers only for an element that declares ALL FOUR,
        which almost none do. `tonk element` reads the domains directly
        and lists them all, which is why it exists, and the browser
        registry runs one query per dictionary for the same reason.
        Fixing it properly means teaching the query layer to widen an
        empty collection, which is a dialog-query change rather than a
        schema one.
      the: xyz.tonk.element.attribute
      as: {[symbol]: text}
      cardinality: one

# The older shape: one anonymous JS module that calls
# `customElements.define` itself. Superseded by `element` for new work
# but still fully supported — the two COEXIST on a branch and nothing
# has to be migrated.
#
# They coexist because they share nothing — no pin or migration is
# involved. A component's facts are `xyz.tonk.component/module`; an
# element's are `xyz.tonk.element.method/<key>`. The two names are
# distinct, so neither concept's query can match the other's rows, each
# has its own loader, and a branch can mount both directories. `tonk
# element` lists both, naming the concept each row came from.
#
# What `component` cannot offer is identity. An assertion that omits
# `this:` is keyed by its own body digest, so editing the module writes
# a SECOND row rather than replacing the first — the directory mounts
# both, and the `customElements.get(name) ||` guard every such module
# carries lets whichever executes first win. That is the reason to
# prefer `element` for new work, not a reason `component` stops
# working.
concept!: &component
  description: A JS module defining web components for the branch's views
  with:
    module:
      description: |
        JS module source. Runs once per realm; guard definitions with
        `customElements.get(name) ||` since a name can't be redefined
        (replacing a component takes effect on the next page load).
      the: xyz.tonk.component/module
      cardinality: one
      as: text

# The bridge from the `component` concept to the `<tonk-component>`
# loader element. The single-entity view loads one module; the
# directory view is what templates mount (a hidden
# `<tonk-display model=component />` in their shell view) to load
# every component asserted on the branch.
view!:
  this: component
  show:
    ui: |
      <tonk-component module={module} />

view!:
  this: component
  show:
    directory: |
      <div class="component-loader" hidden>
        <tonk-component subject={this} module={module}></tonk-component>
      </div>

concept!: &db/session:
  this: concept:session
  description: Database session information
  with:
    profile:
      description: |
          Profile entity (as did:key) representing persistent identity on this device
      the: dialog.session/profile
      as: entity
    operator:
      description: |
          Operator entity (as did:key) representing an identifier used in this session to query and commit
      the: dialog.session/operator
      as: entity
    branch:
      description: |
          Active branch(es) in this session. Can be multiple when overlays are used.
      the: dialog.session/branch
      as: entity
      cardinality: many

concept!: &db/branch:
  this: concept:branch
  description: |
      A branch on some replica (see `tonk:replica`). Individual replicas can
      create same-named branches that sit at different revisions, which is
      why a branch is unique per replica rather than per repository.
  with:
    name:
      description: The branch name
      the: dialog.branch/name
      as: text
    replica:
      description: The replica this branch belongs to
      the: dialog.branch/replica
      as: entity
    tree:
      description: The tree root of this branch
      the: dialog.branch/tree
      as: entity
    revision:
      description: The current revision entity of this branch
      the: dialog.branch/revision
      as: entity
    edition:
      description: Causal depth (Lamport edition) of the current revision
      the: dialog.branch/edition
      as: unsigned-integer

# A space (replica) the profile has access to. These records live on
# the profile repository's main branch — one per repository this device
# has joined or created. The Tonk Hub at `/` queries them on the profile
# main branch (`with="main@profile:tonk"`) so the user can pick which space to open.
concept!: &space
  this: tonk:space
  description: A repository this profile can open, by its local name.
  with:
    name:
      description: Local name of the space, used in its `/space/{name}` URL
      the: xyz.tonk.replica/name
      cardinality: one
      as: text
    subject:
      description: The repository's subject DID (stable identity)
      the: xyz.tonk.replica/subject
      cardinality: one
      as: entity
    kind:
      description: >
        tonk:repository for a real space, tonk:profile for the
        profile's own self-replica. The Hub view hides the latter
        in CSS via [data-kind].
      the: xyz.tonk.replica/kind
      cardinality: one
      as: entity

# The space's default content: the blank canvas. The space route mounts
# `<tonk-display entity={replica} model=tonk/space>`; this alias resolves
# `tonk/space` to `tonk:blank`. `name!` is cardinality-one, so anything
# authored into a space later can re-point the alias at its own root
# model and take over the space home.
name!:
  this: id:tonk/space
  entity: tonk:blank

concept!: &tonk/replica
  this: tonk:replica
  description: |
      Replica of the shared repositiory on this device. It is unique per device
      and can be used to associate device specific metadata about the repository.

  with:
    subject:
      description: |
          The repository subject (as did:key) representing it's unique identifier
      the: dialog.replica/subject
      as: entity
    profile:
      description: |
          Profile entity (as did:key) representing persistent identity on this device
      the: dialog.replica/profile
      as: entity

# This device's live sync STATUS — the observation the chip renders. The worker
# stamps it into an overlay on the SPACE branch keyed on the well-known
# singleton `state:here`, so the sealed-guest chip (which can only reach the
# space branch) reads it with no replica entity. Distinct from the durable
# `enabled` pause preference, which is a boolean keyed on the replica entity
# (worker-only, off the chip's path).
concept!: &tonk/sync
  this: tonk:sync
  description: This device's live sync status for the space in scope.
  with:
    status:
      description: |
          Live observation — sync:idle | sync:pending | sync:offline | sync:local | sync:paused.
      the: xyz.tonk.sync/status
      cardinality: one
      as: entity

# ============================================================
# SITE — a tab's location and what it renders
# ============================================================
#
# `tonk:site` is the per-tab entity (a `site:<uuid>` minted by the host). The
# service worker stamps the tab's location + matched route on it; the rendering
# shell reads them from it. Multiple tabs coexist as distinct site entities in
# the same branch overlay, isolated by entity URI.

concept!: &site
  this: tonk:site
  description: A tab's location and the route concept it renders.
  with:
    path:
      description: Currently active path on this site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text
    anchor:
      description: Currently active anchor (URL hash) on this site.
      the: xyz.tonk.site/anchor
      cardinality: one
      as: text
    space:
      description: The space (repository name) on this site.
      the: xyz.tonk.site/space
      cardinality: one
      as: text
    branch:
      description: The active branch name on this site (defaults to "main").
      the: xyz.tonk.site/branch
      cardinality: one
      as: text
    replica:
      description: Currently active replica on this site.
      the: xyz.tonk.site/replica
      cardinality: one
      as: entity
    branch-entity:
      description: >
        The same branch as an entity, so a view can walk from where the
        tab is to what that branch follows. The name beside it is a
        location token; this is the graph node.
      the: xyz.tonk.site/branch-entity
      cardinality: one
      as: entity
    profile-branch:
      description: >
        The branch the profile is on, whichever repository this tab is
        on: what reaches the profile as `{profile-branch}@profile:tonk`.
      the: xyz.tonk.site/profile-branch
      cardinality: one
      as: text
    route:
      description: Matched route of this site.
      the: xyz.tonk.site/route
      cardinality: one
      as: entity
    concept:
      description: Matched route's concept (the model the shell mounts).
      the: xyz.tonk.site/concept
      cardinality: one
      as: entity

# A site renders the route model it matched. The shell mounts a fixed
# `<tonk-display entity=site:… model=tonk:site>`; this view nests into the
# matched `{concept}` on the SAME site entity, so the route model
# (e.g. `tonk:space/route`) resolves on the site (picking its `site/*` fields)
# and its own view renders. One indirection: site → its matched route model.
view!:
  this: tonk:site
  show:
    ui: |
      <tonk-display entity={this} model={concept} />

# ============================================================
# ROUTING — routes are models picked by the SW per tab
# ============================================================
#
# A `route!` maps a path pattern to a route MODEL. The SW (Level 1) matches the
# remaining path after the space prefix, picks the route model, and asserts the
# tab's `tonk:site` with `concept` = that model. The guest mounts
# `<tonk-display entity=site:… model={the matched concept}>`; the route model
# resolves on the site entity (picking the `site/*` fields it needs) and its
# view renders. Patterns use axum/matchit 0.8 brace syntax (`{section}`), fed to
# `matchit::insert`.
#
# Route models are distinct PINNED concepts (`tonk:space/route`, …). Two routes
# with the same field shape stay distinct by their pinned `this`, so their views
# never collide — `model` discriminates.

# The durable route table the SW reads to build its matchit router: a path
# pattern → the route model to render. `route!` instances populate it.
concept!: &route
  this: tonk:route
  description: A route — maps a path pattern to the model the SW mounts.
  with:
    path:
      description: The axum/matchit path pattern.
      the: xyz.tonk.route/path
      cardinality: one
      as: text
    concept:
      description: The route model to render when this path matches.
      the: xyz.tonk.route/concept
      cardinality: one
      as: entity

# A seed that EXISTS and where its bytes came from — global, durable,
# and silent about whether anything installed it. The entity is the
# content hash of the bytes, so two devices fetching the same library
# converge on one entity without coordinating.
#
# `seed/installed` below adds the install-specific fields on this same
# entity. Keeping them apart means a fetched-but-uninstalled seed can
# never look half-installed, and `version` never has an absent case a
# reader has to interpret.
concept!: &seed/available
  this: tonk:seed/available
  description: A seed that exists, and where its bytes came from.
  with:
    source:
      description: >
        Where these bytes were fetched from. The entity is the content
        hash alone, so the source rides alongside because a custom seed
        is a different URL at the same shape.
      the: xyz.tonk.seed/source
      cardinality: one
      as: text
    replaces:
      description: >
        The installed seed this one would supersede — the backlink that
        makes an available seed answerable on its own ("this is an
        update to what you are running") rather than only by joining it
        against the space's install record.
      the: xyz.tonk.seed/replaces
      cardinality: one
      as: entity

# The seed a space is RUNNING — the install-specific half, asserted on
# the same entity as `seed/available`.
concept!: &seed/installed
  this: tonk:seed/installed
  description: The seed a space is running — what an upgrade withdraws.
  with:
    prior:
      description: >
        The seed this one replaced, or `seed:none` on a first install —
        present on every seed rather than absent on the first, so the
        chain reads uniformly.
      the: xyz.tonk.seed/prior
      cardinality: one
      as: entity
    version:
      description: >
        The version of the commit that installed this seed. A version,
        not a revision: a revision includes the tree its commit produces,
        so a fact inside a commit can never name it, while a version is
        knowable before the batch is written — which is what lets this
        record ride the same commit as the claims it describes.

        It is also the record of WHAT the seed installed, since a
        commit's history lists every claim it wrote.
      the: xyz.tonk.seed/version
      cardinality: one
      as: text




# ---- Route models and their views ----

# The space's default page — a bare `/space/{name}/`. Picks the tab's `replica`
# off the site entity and renders a view of it (the binder, by default).
concept!: &space/route
  this: tonk:space/route
  description: The space's default page.
  with:
    replica:
      description: The tab's active replica, picked off the site entity.
      the: xyz.tonk.site/replica
      cardinality: one
      as: entity
    repo:
      description: The space repository, picked off the site entity.
      the: xyz.tonk.site/repo
      cardinality: one
      as: text
    branch:
      description: The space branch, picked off the site entity.
      the: xyz.tonk.site/branch
      cardinality: one
      as: text

# `with=` here, like every other route view: the space view's own content
# can nest routing consumers (the notebook space mounts an editor), and
# context reaches them only by cascading down stamped `with` attributes.
view!:
  this: tonk:space/route
  show:
    ui: |
      <tonk-display with="{branch}@{repo}" entity={replica} model=tonk/space />

# The workspace shell — the declarative two-portal composition the space route
# resolves to. It renders OUTER-side (the top document mounts
# `<tonk-display model=tonk:site>`, whose site view nests `{concept}` =
# `tonk:workspace/shell` on the same site entity). The shell owns the page
# layout and mounts the CONTENT portal: a sealed `<tonk-portal runtime>` whose
# guest renders the space's content. The FAB portal is a later task — a slot
# comment for now.
#
# It renders on the site entity, so it reuses the site's `space`/`replica`
# fields (`space` names the routing context, picked off the site).
concept!: &workspace/shell
  this: tonk:workspace/shell
  description: Two-portal workspace shell — content portal plus FAB overlay.
  with:
    space:
      description: The active space (repository name), picked off the site.
      the: xyz.tonk.site/space
      cardinality: one
      as: text
    branch:
      description: The active branch name, picked off the site.
      the: xyz.tonk.site/branch
      cardinality: one
      as: text
    replica:
      description: The active replica, picked off the site.
      the: xyz.tonk.site/replica
      cardinality: one
      as: entity
    repo:
      description: The space repository, picked off the site entity.
      the: xyz.tonk.site/repo
      cardinality: one
      as: text

# The shell mounts the space's content via the `tonk/space` alias on the active
# replica, which resolves to `tonk:blank` until something re-points it. The
# `.display-view-slot` wrapper is the bare-route fill-height layout.
#
# The content display is scoped with `with="{branch}@{repo}"`, exactly as
# the directory/entity route views scope theirs: consumers below the home
# route that build worker URLs (`<tonk-upload>`, the blob media view's
# `{dom.host/with}`) need the branch@repo pair on their host chain —
# subscriptions inherit the site's pinned context without it, but URL
# builders have nothing to inherit.
view!:
  this: tonk:workspace/shell
  show:
    ui: |
      <div class="workspace-shell" style="display:flex; flex-direction:column; min-height:100dvh;">
        <tonk-display model=tonk:agent-connection with="{branch}@{repo}">
          <span slot="no-entity"></span>
        </tonk-display>
        <div class='display-view-slot'>
          <tonk-display entity={replica} model=tonk/space with="{branch}@{repo}" />
        </div>
      </div>

# The directory page — `/space/{name}/{model}`. The `{model}` path param is
# stamped on the site entity (`xyz.tonk.site/model`) and picked here; the view
# mounts a directory `<tonk-display model={model}>` (no entity → the model's
# `view/directory` renders, e.g. the board strip, the inspector, the tree). The
# param uses the slash-tolerant `path` extent in its route pattern so a
# namespaced model (`tonk/person`) is captured whole.
concept!: &directory/route
  this: tonk:directory/route
  description: A model directory page (`/space/{name}/{model}`).
  with:
    model:
      description: The model name from the path, picked off the site entity.
      the: xyz.tonk.site/model
      cardinality: one
      as: text
    repo:
      description: The space repository, picked off the site entity.
      the: xyz.tonk.site/repo
      cardinality: one
      as: text
    branch:
      description: The space branch, picked off the site entity.
      the: xyz.tonk.site/branch
      cardinality: one
      as: text

# The directory display carries its own `with` so its view's content
# (`<tonk-tree>`, `<tonk-inspector>`) resolves the route's target space —
# `<tonk-display>` forwards this context onto the view it mounts, so no
# routing wrapper element is needed.
view!:
  this: tonk:directory/route
  show:
    ui: |
      <tonk-display with="{branch}@{repo}" model={model} />

# The artifact page — `/space/{name}/{entity}@{model}`. Binds a concrete entity
# to a model: the view renders that one instance (`<tonk-display entity model>`).
concept!: &artifact/route
  this: tonk:artifact/route
  description: A single artifact page (`/space/{name}/{entity}@{model}`).
  with:
    entity:
      description: The target entity from the path, picked off the site entity.
      the: xyz.tonk.site/entity
      cardinality: one
      as: entity
    model:
      description: The model name from the path, picked off the site entity.
      the: xyz.tonk.site/model
      cardinality: one
      as: text
    repo:
      description: The space repository, picked off the site entity.
      the: xyz.tonk.site/repo
      cardinality: one
      as: text
    branch:
      description: The space branch, picked off the site entity.
      the: xyz.tonk.site/branch
      cardinality: one
      as: text

view!:
  this: tonk:artifact/route
  show:
    ui: |
      <tonk-display with="{branch}@{repo}" entity={entity} model={model} />

# The ad-hoc page — `/space/{name}/{entity}@{model}!{view}`. As the artifact
# page, but with an explicit `view` chosen for the entity rather than the
# model's default.
concept!: &adhoc/route
  this: tonk:adhoc/route
  description: An entity rendered with an explicit view (`{entity}@{model}!{view}`).
  with:
    entity:
      description: The target entity from the path, picked off the site entity.
      the: xyz.tonk.site/entity
      cardinality: one
      as: entity
    model:
      description: The model name from the path, picked off the site entity.
      the: xyz.tonk.site/model
      cardinality: one
      as: text
    view:
      description: The show facet from the path, picked off the site entity.
      the: xyz.tonk.site/view
      cardinality: one
      as: text
    repo:
      description: The space repository, picked off the site entity.
      the: xyz.tonk.site/repo
      cardinality: one
      as: text
    branch:
      description: The space branch, picked off the site entity.
      the: xyz.tonk.site/branch
      cardinality: one
      as: text

view!:
  this: tonk:adhoc/route
  show:
    ui: |
      <tonk-display with="{branch}@{repo}" entity={entity} model={model} view={view} />

# ---- Seeded routes (bootstrap) ----
#
# Built-in routes every space starts with. The SW matches against these. Patterns
# use the route grammar: `{name}` is one segment, `{name:path}` is slash-tolerant
# (so a namespaced `{model:path}` captures `tonk/person` whole), `@` and `!` are
# literal delimiters between params. The SW matches most-specific-first, so the
# bare `/`, the `@`/`!` artifact patterns, and the plain `{model}` directory never
# shadow one another.
#
# The bare `/` route resolves the declarative workspace shell (the site's
# `{concept}` indirection mounts it on the site entity); the sub-routes resolve
# the directory/artifact/ad-hoc page concepts.
route!: &route/space
  this: id:tonk:route/space
  path: "/"
  concept: tonk:workspace/shell

route!: &route/adhoc
  this: id:tonk:route/adhoc
  path: "/{*entity}@{*model}!{*view}"
  concept: tonk:adhoc/route

route!: &route/artifact
  this: id:tonk:route/artifact
  path: "/{*entity}@{*model}"
  concept: tonk:artifact/route

route!: &route/directory
  this: id:tonk:route/directory
  path: "/{*model}"
  concept: tonk:directory/route

# ============================================================
# Tree inspector — `<tonk-tree>` over the branch's search-tree
# index. Visit `/space/{repo}/dialog:diagnose` to explore the
# dialog-search-tree state under the DB: index/segment nodes,
# their keys (color-coded components, shared prefixes dimmed),
# byte sizes, and entries. The view renders `<tonk-tree>`, which
# resolves its repository from the `with` routing
# ancestor and drives itself from the worker's `tree/*` query
# formulas — no entity needed (it inspects the whole branch).
# ============================================================
concept!: &diagnose
  this: dialog:diagnose
  description: Marker model for the search-tree inspector view.
  with:
    name:
      description: A label for the inspector (unused; satisfies the concept shape).
      the: db.diagnose/name
      cardinality: one
      as: text

# A directory-kind view (not a plain `view!`): a `/space/{repo}/dialog:diagnose`
# URL carries no entity, so `<tonk-display>` resolves a `view/directory`
# for the model. The inspector needs no entity — it renders the whole
# branch's tree — so the directory view is the right kind.
view!:
  this: dialog:diagnose
  show:
    directory: |
      <tonk-tree></tonk-tree>

# ============================================================
# BLOB
# ============================================================

# Extrinsic metadata for content-addressed blobs. The entity IS the
# blob reference (`blob:<base58-hash>`); intrinsic metadata (size)
# lives in the repository's blob index, not in facts.
concept!: &blob
  this: tonk:blob
  description: A content-addressed binary blob (image, file, media)
  with:
    content-type:
      description: MIME type of the blob's content
      the: xyz.tonk.blob/content-type
      cardinality: one
      as: text
    name:
      description: Human-readable file name
      the: xyz.tonk.blob/name
      cardinality: one
      as: text

# ============================================================
# BLOB MEDIA VIEW
# ============================================================

# The standard renderer for `tonk:blob` entities, seeded as ordinary
# branch data so it is overridable: re-assert a view with the same
# `this:` to replace it. Image content types render inline; every
# other type renders as a file card with a lazy download action.
#
# The renderer is author JavaScript riding the view as an inert
# `<script type="tonk/module">` holder, executed once per realm by
# `<tonk-component>`. Bytes are fetched through the relayed
# `window.fetch` and handed to the media element as an object URL —
# inside the sealed guest a native `src=/api/…` load bypasses the
# relay and the service worker. The blob route is scoped by the
# host's `with` attribute ("{branch}@{repo}"), forwarded through the
# `{dom.host/with}` binding.
view!:
  this: tonk:blob
  show:
    ui: |
      <div subject={this}>
        <tonk-component>
          <script type="tonk/module">
            customElements.get("tonk-blob-media") ||
              customElements.define("tonk-blob-media", class extends HTMLElement {
                static observedAttributes = ["entity", "content-type", "name", "with"];
                #objectUrl = null;
                #generation = 0;
                connectedCallback() { this.render(); }
                attributeChangedCallback() { if (this.isConnected) this.render(); }
                disconnectedCallback() { this.#generation++; delete this.dataset.rendered; this.revoke(); }
                revoke() {
                  if (this.#objectUrl) {
                    URL.revokeObjectURL(this.#objectUrl);
                    this.#objectUrl = null;
                  }
                }
                url() {
                  const scope = this.getAttribute("with") || "";
                  const entity = this.getAttribute("entity") || "";
                  const at = scope.indexOf("@");
                  if (at < 1 || !entity || scope.includes("{")) return null;
                  return "/api/repository/" + scope.slice(at + 1) +
                    "/branch/" + scope.slice(0, at) + "/blob/" + entity;
                }
                async objectUrl() {
                  const url = this.url();
                  if (!url) return null;
                  const resp = await window.fetch(url);
                  if (!resp.ok) return null;
                  return URL.createObjectURL(await resp.blob());
                }
                render() {
                  const key = [
                    this.getAttribute("with"),
                    this.getAttribute("entity"),
                    this.getAttribute("content-type"),
                    this.getAttribute("name"),
                  ].join("|");
                  if (this.dataset.rendered === key) return;
                  this.dataset.rendered = key;
                  this.#generation++;
                  const root = this.shadowRoot || this.attachShadow({ mode: "open" });
                  const type = this.getAttribute("content-type") || "";
                  const name = this.getAttribute("name") || this.getAttribute("entity") || "";
                  this.revoke();
                  if (type.startsWith("image/")) {
                    root.innerHTML = "<style>img { max-width: 100%; }</style>" +
                      "<img part=\"media\">";
                    root.querySelector("img").alt = name;
                    const generation = this.#generation;
                    this.objectUrl().then((u) => {
                      if (!u) {
                        delete this.dataset.rendered;
                        return;
                      }
                      if (generation !== this.#generation) {
                        URL.revokeObjectURL(u);
                        return;
                      }
                      this.#objectUrl = u;
                      root.querySelector("img").src = u;
                    }).catch(() => { delete this.dataset.rendered; });
                    return;
                  }
                  root.innerHTML =
                    "<style>" +
                    "[part=card] { display: flex; align-items: center; gap: 0.75rem; " +
                    "padding: 0.75rem 1rem; border: 1px solid #d0d0d0; border-radius: 8px; " +
                    "max-width: 28rem; font-family: system-ui, sans-serif; }" +
                    "[part=name] { flex: 1; overflow-wrap: anywhere; }" +
                    "[part=badge] { font-size: 0.75rem; color: #666; border: 1px solid #ddd; " +
                    "border-radius: 4px; padding: 0.1rem 0.4rem; white-space: nowrap; }" +
                    "[part=action] { cursor: pointer; }" +
                    "</style>" +
                    "<div part=\"card\"><span part=\"name\"></span>" +
                    "<span part=\"badge\"></span>" +
                    "<button part=\"action\" type=\"button\">Download</button></div>";
                  root.querySelector("[part=name]").textContent = name;
                  root.querySelector("[part=badge]").textContent = type || "file";
                  root.querySelector("[part=action]").addEventListener("click", async () => {
                    let u;
                    try {
                      u = await this.objectUrl();
                    } catch {
                      return;
                    }
                    if (!u) return;
                    const a = document.createElement("a");
                    a.href = u;
                    a.download = name;
                    a.click();
                    URL.revokeObjectURL(u);
                  });
                }
              });
          </script>
        </tonk-component>
        <tonk-blob-media entity={this} content-type={content-type} name={name} with={dom.host/with}></tonk-blob-media>
      </div>
