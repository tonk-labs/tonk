# Tonk wiki template.
#
# A Notion-style wiki (after the Grove mock): a sidebar page tree, a
# block-based page canvas with wikilinks, and a comments/backlinks
# panel. Seeded on top of core.yaml only when the "wiki" template is
# chosen at repo creation. Overrides the default `tonk/space` alias so
# the space route mounts the wiki shell.
#
# core.yaml is always concatenated ahead of this template into one
# seed document, so the concepts this template depends on (tonk:view,
# tonk:view/directory, tonk:replica, the `component` loader concept)
# are already declared there and must not be redeclared here.
#
# Architecture: the interactive surfaces (tree, block editor, panel)
# are web components carried as `component!:` rows and loaded by the
# shell's hidden `<tonk-display model=component />`. Branch data flows
# INTO them as invisible "data row" directory views (plain divs with
# `data-*` attributes) that the components read and observe; actions
# flow OUT as bubbling CustomEvents wired declaratively on the
# component elements (`on<event>=<command>` + `dom.event.detail/*`).
# Components never mutate inside a `<tonk-display>` subtree — the
# renderer addresses bound nodes by child-index paths, so injected
# DOM there would corrupt bindings. They build their own DOM instead.

# ============================================================
# CONCEPTS
# ============================================================

# A wiki page: a node in the sidebar tree. `parent` is optional —
# root pages simply lack it. `order` is a lexicographic key sorting
# siblings.
concept!: &wiki/page
  this: tonk:wiki/page
  description: A wiki page - a titled node in the page tree.
  with:
    title:
      description: Page title, shown in the tree and as the canvas heading
      the: xyz.tonk.wiki.page/title
      cardinality: one
      as: text
    order:
      description: Lexicographic key ordering the page among its siblings
      the: xyz.tonk.wiki.page/order
      cardinality: one
      as: text
  maybe:
    parent:
      description: The parent page; absent on root pages
      the: xyz.tonk.wiki.page/parent
      cardinality: one
      as: entity

# Single-field projections of a page, so rules can upsert one field
# (rename) or retract the one fact whose absence unmatches the page
# from the tree (delete) without re-binding every field.
concept!: &wiki/page-title
  description: A page's title, as a standalone fact.
  with:
    title:
      description: Page title
      the: xyz.tonk.wiki.page/title
      cardinality: one
      as: text

concept!: &wiki/page-order
  description: A page's order key, as a standalone fact.
  with:
    order:
      description: Lexicographic sibling order key
      the: xyz.tonk.wiki.page/order
      cardinality: one
      as: text

# A content block on a page. `text` is an inline-HTML fragment (plain
# text for most blocks; wikilinks are `<a class="wikilink"
# data-page=…>` anchors the editor inserts). `type` is one of:
# text | h1 | h2 | h3 | bulleted | numbered | divider.
concept!: &wiki/block
  this: tonk:wiki/block
  description: A content block on a wiki page.
  with:
    page:
      description: The page this block belongs to
      the: xyz.tonk.wiki.block/page
      cardinality: one
      as: entity
    order:
      description: Lexicographic key ordering the block on its page
      the: xyz.tonk.wiki.block/order
      cardinality: one
      as: text
    type:
      description: Block type (text, h1, h2, h3, bulleted, numbered, divider)
      the: xyz.tonk.wiki.block/type
      cardinality: one
      as: text
    text:
      description: Inline-HTML content of the block
      the: xyz.tonk.wiki.block/text
      cardinality: one
      as: text

# Single-field block projections, for the same reason as the page
# ones: partial upserts (edit text, turn type, move) and the delete
# retraction.
concept!: &wiki/block-text
  description: A block's text, as a standalone fact.
  with:
    text:
      description: Inline-HTML content
      the: xyz.tonk.wiki.block/text
      cardinality: one
      as: text

concept!: &wiki/block-type
  description: A block's type, as a standalone fact.
  with:
    type:
      description: Block type
      the: xyz.tonk.wiki.block/type
      cardinality: one
      as: text

concept!: &wiki/block-order
  description: A block's order key, as a standalone fact.
  with:
    order:
      description: Lexicographic block order key
      the: xyz.tonk.wiki.block/order
      cardinality: one
      as: text

# A comment on a block. `state` is "open" or "resolved" (text, not
# boolean: event-detail booleans coerce strictly, text round-trips
# through `data-*` attributes cleanly).
concept!: &wiki/comment
  this: tonk:wiki/comment
  description: A comment anchored to a wiki block.
  with:
    block:
      description: The block the comment is anchored to
      the: xyz.tonk.wiki.comment/block
      cardinality: one
      as: entity
    page:
      description: The page the anchored block lives on
      the: xyz.tonk.wiki.comment/page
      cardinality: one
      as: entity
    author:
      description: Display name of the comment author
      the: xyz.tonk.wiki.comment/author
      cardinality: one
      as: text
    body:
      description: The comment text
      the: xyz.tonk.wiki.comment/body
      cardinality: one
      as: text
    state:
      description: '"open" or "resolved"'
      the: xyz.tonk.wiki.comment/state
      cardinality: one
      as: text

concept!: &wiki/comment-state
  description: A comment's open/resolved state, as a standalone fact.
  with:
    state:
      description: '"open" or "resolved"'
      the: xyz.tonk.wiki.comment/state
      cardinality: one
      as: text

concept!: &wiki/comment-body
  description: A comment's body, as a standalone fact.
  with:
    body:
      description: The comment text
      the: xyz.tonk.wiki.comment/body
      cardinality: one
      as: text

# A wikilink as a queryable fact: block `from` (on page `page`) links
# to page `to`. The editor asserts one whenever it inserts a link, so
# backlinks are a directory query over this concept — not a parse of
# block HTML.
concept!: &wiki/link
  this: tonk:wiki/link
  description: A wikilink fact - block `from` on page `page` links to page `to`.
  with:
    from:
      description: The block carrying the link
      the: xyz.tonk.wiki.link/from
      cardinality: one
      as: entity
    page:
      description: The page the linking block lives on
      the: xyz.tonk.wiki.link/page
      cardinality: one
      as: entity
    to:
      description: The page the link points at
      the: xyz.tonk.wiki.link/to
      cardinality: one
      as: entity

# The wiki root, bound to the replica entity exactly like the sheets
# binder: it shares `dialog.origin/subject` with `tonk/replica`, so
# every replica IS a wiki row and the shell view can render for it
# without any extra seeding. `active` records the last selected page
# so it survives a reload; the components own the live selection.
concept!: &wiki
  this: tonk:wiki
  description: A wiki view of the tonk replica.
  with:
    subject:
      description: The repository's subject DID (shared with tonk/replica)
      the: dialog.origin/subject
      as: entity
  maybe:
    active:
      description: The last activated page; absent until a page is clicked
      the: xyz.tonk.wiki/active
      cardinality: one
      as: entity

# ============================================================
# COMMANDS (transient, event-derived)
# ============================================================

# Select a page. Fired by the tree (row click), the editor (wikilink
# click), and the panel (backlink click).
command!: &wiki/activate-page
  description: A request to make `page` the active wiki page.
  with:
    page:
      description: The page to activate, from the event detail
      the: dom.event.detail/activate
      as: entity

# Create a root page. The component computes the sibling `order` key
# and stamps `time` (a whole-number nonce) so successive creates with
# the same title mint distinct command entities — the created page's
# entity IS the command entity.
command!: &wiki/create-page
  description: Create a new root page.
  with:
    title:
      description: Title of the new page
      the: dom.event.detail/create-title
      as: text
    order:
      description: Sibling order key, computed by the tree component
      the: dom.event.detail/create-order
      as: text
    time:
      description: A monotonic integer nonce from the component
      the: dom.event.detail/time
      as: unsigned-integer

# Create a child page. A separate command from `create-page`: an
# event-detail path that fails to resolve aborts the whole assertion,
# so an optional `parent` field can't ride the same command.
command!: &wiki/create-subpage
  description: Create a new page inside `parent`.
  with:
    title:
      description: Title of the new page
      the: dom.event.detail/sub-title
      as: text
    parent:
      description: The parent page
      the: dom.event.detail/sub-parent
      as: entity
    order:
      description: Sibling order key, computed by the tree component
      the: dom.event.detail/sub-order
      as: text
    time:
      description: A monotonic integer nonce from the component
      the: dom.event.detail/time
      as: unsigned-integer

command!: &wiki/rename-page
  description: Rename `page` to `title`.
  with:
    page:
      description: The page to rename
      the: dom.event.detail/rename
      as: entity
    title:
      description: The new title
      the: dom.event.detail/rename-title
      as: text

command!: &wiki/delete-page
  description: Remove `page` from the tree.
  with:
    page:
      description: The page to delete
      the: dom.event.detail/delete
      as: entity

# Create a block. The editor computes `order` (between neighbours or
# after the last block) and sends the initial `type`/`text` — an
# Enter-split carries the trailing half of the split block.
command!: &wiki/create-block
  description: Create a new block on `page`.
  with:
    page:
      description: The page the block is created on
      the: dom.event.detail/block-page
      as: entity
    order:
      description: Block order key, computed by the editor
      the: dom.event.detail/block-order
      as: text
    type:
      description: Initial block type
      the: dom.event.detail/block-type
      as: text
    text:
      description: Initial inline-HTML content (may be empty)
      the: dom.event.detail/block-text
      as: text
    time:
      description: A monotonic integer nonce from the editor
      the: dom.event.detail/time
      as: unsigned-integer

command!: &wiki/edit-block
  description: Replace `block`'s text.
  with:
    block:
      description: The edited block
      the: dom.event.detail/edit
      as: entity
    text:
      description: The new inline-HTML content
      the: dom.event.detail/edit-text
      as: text

command!: &wiki/turn-block
  description: Change `block`'s type.
  with:
    block:
      description: The block to convert
      the: dom.event.detail/turn
      as: entity
    type:
      description: The new block type
      the: dom.event.detail/turn-type
      as: text

command!: &wiki/move-block
  description: Re-key `block` to a new order position.
  with:
    block:
      description: The block to move
      the: dom.event.detail/move
      as: entity
    order:
      description: The new order key, computed by the editor
      the: dom.event.detail/move-order
      as: text

command!: &wiki/delete-block
  description: Remove `block` from its page.
  with:
    block:
      description: The block to delete
      the: dom.event.detail/delete-block
      as: entity

command!: &wiki/add-comment
  description: Comment on `block`.
  with:
    block:
      description: The block the comment anchors to
      the: dom.event.detail/comment-block
      as: entity
    page:
      description: The page that block lives on
      the: dom.event.detail/comment-page
      as: entity
    author:
      description: Display name of the author
      the: dom.event.detail/comment-author
      as: text
    body:
      description: The comment text
      the: dom.event.detail/comment-body
      as: text
    time:
      description: A monotonic integer nonce from the panel
      the: dom.event.detail/time
      as: unsigned-integer

command!: &wiki/resolve-comment
  description: Set `comment`'s state ("open" or "resolved").
  with:
    comment:
      description: The comment to update
      the: dom.event.detail/resolve
      as: entity
    state:
      description: The new state, computed by the panel (toggle)
      the: dom.event.detail/resolve-state
      as: text

command!: &wiki/delete-comment
  description: Delete `comment`.
  with:
    comment:
      description: The comment to delete
      the: dom.event.detail/delete-comment
      as: entity

# Record a wikilink the editor inserted. (Link removal is not yet
# tracked — a stale link degrades to a harmless extra backlink until
# the linking block is deleted or re-linked.)
command!: &wiki/link-add
  description: Record that block `from` on `page` now links to `to`.
  with:
    from:
      description: The block carrying the link
      the: dom.event.detail/link-from
      as: entity
    page:
      description: The page that block lives on
      the: dom.event.detail/link-page
      as: entity
    to:
      description: The linked page
      the: dom.event.detail/link-to
      as: entity

# ============================================================
# RULES
# ============================================================

# Selection: point the replica's wiki `active` at the clicked page.
rule!:
  description: Records the activated page as the wiki's default selection
  assert!: wiki
  when:
    - assert: wiki/activate-page
      where: { page: ?active }
    - assert: tonk/replica
      where: { this: ?this, subject: ?subject }

# Page creation. The created page's entity is the command entity
# (`?this` flows from the command match into the head).
rule!:
  description: Creates a root page
  assert!: wiki/page
  when:
    - assert: wiki/create-page
      where: { this: ?this, title: ?title, order: ?order }

rule!:
  description: Creates a child page
  assert!: wiki/page
  when:
    - assert: wiki/create-subpage
      where: { this: ?this, title: ?title, parent: ?parent, order: ?order }

# Land the user on the page they just created.
rule!:
  description: Activates a freshly created root page
  assert!: wiki
  when:
    - assert: wiki/create-page
      where: { this: ?active, title: ?title, order: ?order }
    - assert: tonk/replica
      where: { this: ?this, subject: ?subject }

rule!:
  description: Activates a freshly created child page
  assert!: wiki
  when:
    - assert: wiki/create-subpage
      where: { this: ?active, title: ?title, order: ?order }
    - assert: tonk/replica
      where: { this: ?this, subject: ?subject }

rule!:
  description: Renames a page
  assert!: wiki/page-title
  when:
    - assert: wiki/rename-page
      where: { page: ?this, title: ?title }

# Deleting a page retracts its `order` — the one fact whose absence
# unmatches it from the page directory. Its other facts (title,
# blocks) persist; descendants keep pointing at the retracted page
# and the tree component hides unreachable rows.
rule!:
  description: Removes a deleted page from the tree
  retract!: wiki/page-order
  when:
    - assert: wiki/delete-page
      where: { page: ?this }
    - assert: wiki/page-order
      where: { this: ?this, order: ?order }

# Block lifecycle.
rule!:
  description: Creates a block
  assert!: wiki/block
  when:
    - assert: wiki/create-block
      where: { this: ?this, page: ?page, order: ?order, type: ?type, text: ?text }

rule!:
  description: Replaces an edited block's text
  assert!: wiki/block-text
  when:
    - assert: wiki/edit-block
      where: { block: ?this, text: ?text }

rule!:
  description: Converts a block to a new type
  assert!: wiki/block-type
  when:
    - assert: wiki/turn-block
      where: { block: ?this, type: ?type }

rule!:
  description: Moves a block to a new order position
  assert!: wiki/block-order
  when:
    - assert: wiki/move-block
      where: { block: ?this, order: ?order }

rule!:
  description: Removes a deleted block from its page
  retract!: wiki/block-order
  when:
    - assert: wiki/delete-block
      where: { block: ?this }
    - assert: wiki/block-order
      where: { this: ?this, order: ?order }

# Comments.
rule!:
  description: Creates a comment (state starts "open")
  assert!: wiki/comment
  when:
    - assert: wiki/add-comment
      where: { this: ?this, block: ?block, page: ?page, author: ?author, body: ?body }
    - assert: ==
      where: { this: ?state, is: "open" }

rule!:
  description: Toggles a comment's resolved state
  assert!: wiki/comment-state
  when:
    - assert: wiki/resolve-comment
      where: { comment: ?this, state: ?state }

rule!:
  description: Deletes a comment
  retract!: wiki/comment-body
  when:
    - assert: wiki/delete-comment
      where: { comment: ?this }
    - assert: wiki/comment-body
      where: { this: ?this, body: ?body }

# Wikilinks. The link entity is the command entity, which is derived
# from its fields — re-inserting the same link is naturally
# idempotent.
rule!:
  description: Records an inserted wikilink
  assert!: wiki/link
  when:
    - assert: wiki/link-add
      where: { this: ?this, from: ?from, page: ?page, to: ?to }

# ============================================================
# DATA-ROW VIEWS (invisible; feed the components)
# ============================================================
#
# Each directory view renders one bare `data-*` div per instance.
# The components read and observe these rows; the `.wiki-data` pane
# in the shell hides them. `subject={this}` marks the repeat root.

view/directory!:
  this: tonk:wiki/page-rows
  model: tonk:wiki/page
  display: |
    <div class="wiki-page-rows">
      <div class="wiki-page-row" subject={this} data-page={this} data-title={title} data-order={order} data-parent={parent}></div>
    </div>

view/directory!:
  this: tonk:wiki/block-rows
  model: tonk:wiki/block
  display: |
    <div class="wiki-block-rows">
      <div class="wiki-block-row" subject={this} data-block={this} data-page={page} data-order={order} data-type={type} data-text={text}></div>
    </div>

view/directory!:
  this: tonk:wiki/comment-rows
  model: tonk:wiki/comment
  display: |
    <div class="wiki-comment-rows">
      <div class="wiki-comment-row" subject={this} data-comment={this} data-block={block} data-page={page} data-author={author} data-body={body} data-state={state}></div>
    </div>

view/directory!:
  this: tonk:wiki/link-rows
  model: tonk:wiki/link
  display: |
    <div class="wiki-link-rows">
      <div class="wiki-link-row" subject={this} data-link={this} data-from={from} data-page={page} data-to={to}></div>
    </div>

# A label view so other views can render a page reference as its
# title (`<tonk-display … view=tonk:view/label>`).
view/label!: &wiki/page-label
  model: tonk:wiki/page
  display: |
    {title}

# ============================================================
# COMPONENTS
# ============================================================
#
# Loaded once per realm by the shell's `<tonk-display model=component />`.
# Shared conventions:
#   - read state from the hidden data rows (document-wide queries),
#     re-render on a debounced MutationObserver tick;
#   - never touch DOM inside a `<tonk-display>`;
#   - dispatch bubbling CustomEvents; the shell view wires each event
#     type to a command on the component element;
#   - `active` attribute = the persisted selection; fall back to the
#     first root page by order.

# Shared helpers: row reading + lexicographic order keys. Loaded
# before the widgets (components load in directory order; this row's
# stable `this:` sorts first by design — but each widget also guards
# on the helper's presence, so order is a nicety, not a contract).
component!:
  this: id:wiki/component/00-lib
  module: |
    (() => {
      if (globalThis.__wikiLib) return;
      const rows = (sel) => Array.from(document.querySelectorAll(sel));
      const byOrder = (a, b) =>
        (a.order < b.order ? -1 : a.order > b.order ? 1 : a.id < b.id ? -1 : 1);
      globalThis.__wikiLib = {
        pages() {
          return rows('.wiki-page-row').map((r) => ({
            id: r.dataset.page, title: r.dataset.title || 'Untitled',
            parent: r.dataset.parent || null, order: r.dataset.order || '',
          })).sort(byOrder);
        },
        blocks(page) {
          return rows('.wiki-block-row').filter((r) => r.dataset.page === page)
            .map((r) => ({
              id: r.dataset.block, page: r.dataset.page,
              order: r.dataset.order || '', type: r.dataset.type || 'text',
              text: r.dataset.text || '',
            })).sort(byOrder);
        },
        comments(page) {
          return rows('.wiki-comment-row').filter((r) => r.dataset.page === page)
            .map((r) => ({
              id: r.dataset.comment, block: r.dataset.block, page: r.dataset.page,
              author: r.dataset.author || '', body: r.dataset.body || '',
              state: r.dataset.state || 'open',
            }));
        },
        backlinks(page) {
          return rows('.wiki-link-row').filter((r) => r.dataset.to === page)
            .map((r) => ({ from: r.dataset.from, page: r.dataset.page, to: r.dataset.to }));
        },
        // A key strictly between `a` and `b` ('' = open bound), over
        // the alphabet a-z. Sorting always tiebreaks on id, so a rare
        // degenerate key stays harmless.
        between(a, b) {
          a = a || ''; b = b || '';
          let out = '';
          for (let i = 0; ; i++) {
            const ca = i < a.length ? a.charCodeAt(i) : 96;
            const cb = b && i < b.length ? b.charCodeAt(i) : 123;
            if (ca === cb) { out += a[i]; continue; }
            const m = Math.floor((ca + cb) / 2);
            if (m > ca) return out + String.fromCharCode(m);
            out += String.fromCharCode(ca === 96 ? 97 : ca);
            b = '';
          }
        },
        after(list) {
          const last = list.length ? list[list.length - 1].order : '';
          return globalThis.__wikiLib.between(last, '');
        },
        // Watch the data rows and call `fn` on a debounced tick.
        // Observes the whole body (robust against the renderer
        // replacing the data pane wholesale) but ignores mutation
        // batches that originate inside the widgets themselves —
        // otherwise every render would re-trigger the observer in a
        // permanent 30ms loop.
        watch(host, fn) {
          globalThis.__wikiLib.unwatch(host);
          let t = null;
          const kick = () => { clearTimeout(t); t = setTimeout(fn, 30); };
          const inWidget = (m) => {
            const el = m.target.nodeType === 1 ? m.target : m.target.parentElement;
            return el && el.closest && el.closest('wiki-tree,wiki-editor,wiki-panel');
          };
          const mo = new MutationObserver((ms) => { if (!ms.every(inWidget)) kick(); });
          mo.observe(document.body, { subtree: true, childList: true,
            attributes: true, attributeFilter: [
              'data-title', 'data-order', 'data-parent', 'data-text',
              'data-type', 'data-page', 'data-body', 'data-state', 'data-to'] });
          host.__wikiMo = mo;
          kick();
        },
        unwatch(host) {
          if (host.__wikiMo) { host.__wikiMo.disconnect(); host.__wikiMo = null; }
        },
        emit(host, type, detail) {
          host.dispatchEvent(new CustomEvent(type, { bubbles: true, detail }));
        },
        esc(s) {
          return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        },
        strip(html) {
          const d = document.createElement('div');
          d.innerHTML = html || '';
          return d.textContent || '';
        },
      };
    })();

# The sidebar page tree: search, "New page", indented rows with
# add-subpage / delete actions. Live selection follows the `active`
# attribute the shell binds from the wiki concept.
component!:
  this: id:wiki/component/tree
  module: |
    (() => {
      if (customElements.get('wiki-tree')) return;
      customElements.define('wiki-tree', class extends HTMLElement {
        static get observedAttributes() { return ['active']; }
        connectedCallback() {
          // Re-arm the data watch on EVERY connect: a re-connect (the
          // renderer moving the element) ran disconnectedCallback,
          // which tore the observer down. The poll also absorbs the
          // no-ordering contract between component modules and this
          // element's upgrade.
          const arm = () => {
            const lib = globalThis.__wikiLib;
            if (!lib) { setTimeout(arm, 40); return; }
            if (this.isConnected) lib.watch(this, () => this.render());
          };
          if (this.__init) { arm(); return; }
          this.__init = true;
          this.collapsed = new Set();
          this.query = '';
          this.innerHTML =
            '<div class="wt-head">' +
            '<input class="wt-search" placeholder="Search pages…">' +
            '<button type="button" class="wt-new" data-act="new">+ New page</button>' +
