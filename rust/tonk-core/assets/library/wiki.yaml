            if (sib) {
              const beyond = act === 'up' ? sib.previousElementSibling : sib.nextElementSibling;
              const a = act === 'up' ? (beyond ? beyond.dataset.order : '') : sib.dataset.order;
              const b = act === 'up' ? sib.dataset.order : (beyond ? beyond.dataset.order : '');
              lib.emit(this, 'moveblock', {
                move: state.block, moveOrder: lib.between(a, b) });
            }
          }
        }
        jump(block) {
          const el = this.querySelector('.we-block[data-block="' + block + '"]');
          if (!el) return;
          el.scrollIntoView({ block: 'center', behavior: 'smooth' });
          el.classList.remove('is-flash');
          void el.offsetWidth;
          el.classList.add('is-flash');
        }
      });
    })();

# The right panel: comments and backlinks tabs for the active page.
# The composer opens when the editor broadcasts `wiki:compose` (a
# realm-window event — not a command; only the resulting submit is).
component!:
  this: id:wiki/component/panel
  module: |
    (() => {
      if (customElements.get('wiki-panel')) return;
      customElements.define('wiki-panel', class extends HTMLElement {
        static get observedAttributes() { return ['active']; }
        connectedCallback() {
          // Same re-arm-on-every-connect discipline as the tree.
          const arm = () => {
            const lib = globalThis.__wikiLib;
            if (!lib) { setTimeout(arm, 40); return; }
            if (this.isConnected) lib.watch(this, () => this.render());
          };
          if (this.__init) { arm(); return; }
          this.__init = true;
          this.tab = 'comments';
          this.compose = null;
          this.innerHTML =
            '<div class="wp-tabs">' +
            '<button type="button" class="wp-tab" data-tab="comments">Comments</button>' +
            '<button type="button" class="wp-tab" data-tab="backlinks">Backlinks</button>' +
            '</div><div class="wp-compose" hidden>' +
            '<div class="wp-compose-target"></div>' +
            '<textarea class="wp-text" placeholder="Add a comment…"></textarea>' +
            '<div class="wp-compose-acts">' +
            '<button type="button" class="wp-cancel">Cancel</button>' +
            '<button type="button" class="wp-submit">Comment</button>' +
            '</div></div><div class="wp-body"></div>';
          this.addEventListener('click', (e) => this.onClick(e));
          window.addEventListener('wiki:compose', (e) => {
            this.compose = e.detail;
            this.render();
            const t = this.querySelector('.wp-text');
            if (t) t.focus();
          });
          arm();
        }
        disconnectedCallback() {
          const lib = globalThis.__wikiLib;
          lib && lib.unwatch(this);
        }
        attributeChangedCallback() { if (this.__init) this.render(); }
        activePage() {
          const lib = globalThis.__wikiLib;
          const pages = lib.pages();
          const set = this.getAttribute('active');
          return (set && pages.some((p) => p.id === set))
            ? set : (pages.find((p) => !p.parent) || pages[0] || {}).id;
        }
        onClick(e) {
          const lib = globalThis.__wikiLib;
          const tab = e.target.closest('.wp-tab');
          if (tab) { this.tab = tab.dataset.tab; this.render(); return; }
          if (e.target.closest('.wp-cancel')) { this.compose = null; this.render(); return; }
          if (e.target.closest('.wp-submit')) {
            const body = this.querySelector('.wp-text').value.trim();
            if (body && this.compose) {
              lib.emit(this, 'addcomment', {
                commentBlock: this.compose.block, commentPage: this.compose.page,
                commentAuthor: 'Local', commentBody: body, time: Date.now() });
            }
            this.compose = null;
            this.render();
            return;
          }
          const act = e.target.closest('[data-comment-act]');
          if (act) {
            const id = act.dataset.comment;
            if (act.dataset.commentAct === 'resolve') {
              lib.emit(this, 'resolvecomment', {
                resolve: id, resolveState: act.dataset.state === 'open' ? 'resolved' : 'open' });
            } else {
              lib.emit(this, 'deletecomment', { deleteComment: id });
            }
            return;
          }
          const card = e.target.closest('.wp-card[data-block]');
          if (card) {
            window.dispatchEvent(new CustomEvent('wiki:jump', { detail: { block: card.dataset.block } }));
            return;
          }
          const back = e.target.closest('.wp-card[data-nav]');
          if (back) lib.emit(this, 'navigate', { activate: back.dataset.nav });
        }
        render() {
          const lib = globalThis.__wikiLib;
          if (!lib) return;
          const body = this.querySelector('.wp-body');
          if (!body) return;
          const page = this.activePage();
          for (const t of this.querySelectorAll('.wp-tab'))
            t.classList.toggle('is-active', t.dataset.tab === this.tab);
          const composer = this.querySelector('.wp-compose');
          composer.hidden = !this.compose;
          if (this.compose) {
            const target = lib.blocks(this.compose.page).find((b) => b.id === this.compose.block);
            this.querySelector('.wp-compose-target').textContent =
              (lib.strip(target ? target.text : '') || 'this block').slice(0, 80);
          }
          if (this.tab === 'comments') {
            const comments = lib.comments(page);
            body.innerHTML = comments.length ? comments.map((c) => {
              const target = lib.blocks(page).find((b) => b.id === c.block);
              return '<div class="wp-card' + (c.state === 'resolved' ? ' is-resolved' : '') +
                '" data-block="' + c.block + '">' +
                '<div class="wp-meta"><b>' + lib.esc(c.author) + '</b>' +
                (c.state === 'resolved' ? '<span class="wp-badge">resolved</span>' : '') + '</div>' +
                '<div class="wp-cbody">' + lib.esc(c.body) + '</div>' +
                '<div class="wp-snippet">' + lib.esc(lib.strip(target ? target.text : '').slice(0, 60)) + '</div>' +
                '<div class="wp-acts">' +
                '<button type="button" data-comment-act="resolve" data-comment="' + c.id + '" data-state="' + c.state + '">' +
                (c.state === 'open' ? 'resolve' : 'reopen') + '</button>' +
                '<button type="button" data-comment-act="delete" data-comment="' + c.id + '">delete</button>' +
                '</div></div>';
            }).join('') :
              '<div class="wp-empty">&gt; 0 comments on this page<br><span>hover a block &middot; click the pen icon</span></div>';
          } else {
            const links = lib.backlinks(page);
            const pages = lib.pages();
            body.innerHTML = links.length ? links.map((l) => {
              const src = pages.find((p) => p.id === l.page);
              const blk = lib.blocks(l.page).find((b) => b.id === l.from);
              return '<div class="wp-card" data-nav="' + l.page + '">' +
                '<div class="wp-meta"><b>' + lib.esc(src ? src.title : 'Untitled') + '</b></div>' +
                '<div class="wp-snippet">' + lib.esc(lib.strip(blk ? blk.text : '').slice(0, 80)) + '</div>' +
                '</div>';
            }).join('') :
              '<div class="wp-empty">&gt; nothing links here yet<br><span>type [[ in any page to link this one</span></div>';
          }
        }
      });
    })();

# ============================================================
# THE SHELL
# ============================================================
#
# The single-mode view for `model: tonk:wiki` — rendered for one
# concrete replica, exactly like the sheets shell. The hidden
# `.wiki-data` pane mounts the component loader and every data-row
# directory; the visible grid mounts the three components with their
# command wiring.
view!:
  this: tonk:wiki/shell
  model: tonk:wiki
  display: |
    <div class="wiki-root">
      <style>
        .wiki-root {
          display: grid;
          grid-template-columns: 260px minmax(0, 1fr) 300px;
          min-height: 100dvh;
          max-height: 100dvh;
          font-family: var(--wa-font-family-body);
          color: var(--wa-color-text-normal);
          background: transparent;
        }
        .wiki-data { display: none; }

        /* -- tree ------------------------------------------------ */
        wiki-tree {
          display: flex;
          flex-direction: column;
          min-height: 0;
          overflow: auto;
          border-right: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          background: var(--wa-color-surface-raised);
          font-size: var(--wa-font-size-s);
        }
        .wt-head { display: flex; flex-direction: column; gap: var(--wa-space-s); padding: var(--wa-space-m); }
        .wt-search {
          font: inherit; color: inherit;
          padding: var(--wa-space-2xs) var(--wa-space-s);
          background: var(--wa-color-surface-default);
          border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          outline: none;
        }
        .wt-new {
          font: inherit; text-align: left; cursor: pointer;
          padding: var(--wa-space-2xs) var(--wa-space-s);
          color: var(--wa-color-text-quiet);
          background: transparent;
          border: var(--wa-border-width-s) dashed var(--wa-color-surface-border);
        }
        .wt-new:hover { color: var(--wa-color-text-normal); border-style: solid; }
        .wt-list { display: flex; flex-direction: column; gap: 1px; padding: 0 var(--wa-space-xs); }
        .wt-row {
          display: flex; align-items: center; gap: var(--wa-space-2xs);
          min-height: 28px; padding-right: var(--wa-space-2xs);
          cursor: pointer; border-radius: var(--wa-border-radius-s);
        }
        .wt-row:hover { background: var(--wa-color-neutral-fill-quiet); }
        .wt-row.is-active { background: var(--wa-color-neutral-fill-normal); font-weight: var(--wa-font-weight-semibold); }
        .wt-fold, .wt-dot {
          flex: none; width: 16px; text-align: center;
          color: var(--wa-color-text-quiet);
          background: none; border: none; font: inherit; cursor: pointer; padding: 0;
        }
        .wt-title { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .wt-acts { display: none; gap: 1px; }
        .wt-row:hover .wt-acts { display: inline-flex; }
        .wt-act {
          width: 18px; height: 18px; padding: 0;
          font: inherit; line-height: 1; cursor: pointer;
          color: var(--wa-color-text-quiet);
          background: none; border: none;
        }
        .wt-act:hover { color: var(--wa-color-text-normal); background: var(--wa-color-neutral-fill-quiet); }

        /* -- editor ---------------------------------------------- */
        wiki-editor {
          display: block; position: relative;
          min-height: 0; overflow: auto;
          padding: var(--wa-space-3xl) var(--wa-space-2xl) 40vh;
        }
        .we-page { max-width: 720px; margin: 0 auto; }
        .we-title {
          font-size: var(--wa-font-size-3xl);
          font-weight: var(--wa-font-weight-bold);
          outline: none;
          margin: 0 0 var(--wa-space-l);
          padding: 0; background: transparent; color: inherit;
        }
        .we-block {
          display: flex; align-items: flex-start; gap: var(--wa-space-s);
          position: relative;
          padding: 2px 0;
          line-height: var(--wa-line-height-normal);
        }
        /* A full-height gutter that reaches from the text to the
           buttons, so the hover target never breaks as the cursor
           travels left; fading (not display:none) keeps it in layout
           and clickable the whole way across. */
        .we-gut {
          position: absolute; left: -84px; top: 0; bottom: 0; width: 84px;
          display: flex; align-items: flex-start; justify-content: flex-end;
          gap: 2px; padding: 1px 6px 0 0;
          opacity: 0; pointer-events: none;
          transition: opacity 120ms ease;
        }
        .we-block:hover .we-gut { opacity: 1; pointer-events: auto; }
        .we-g {
          width: 24px; height: 24px; padding: 0;
          display: inline-flex; align-items: center; justify-content: center;
          font-size: var(--wa-font-size-s); line-height: 1; cursor: pointer;
          color: var(--wa-color-text-quiet);
          background: none; border: none;
          border-radius: var(--wa-border-radius-s);
          transition: background 100ms ease, color 100ms ease, scale 100ms ease;
        }
        .we-g:hover { color: var(--wa-color-text-normal); background: var(--wa-color-neutral-fill-quiet); }
        .we-g:active { scale: 0.94; }
        /* Whole-block (Notion-style) drag selection: our wash is the
           cue; the real cross-block Range that backs copy is hidden. */
        .we-block.is-selected {
          background: var(--wa-color-brand-fill-quiet);
          border-radius: var(--wa-border-radius-s);
        }
        wiki-editor.is-block-selecting ::selection { background: transparent; }
        wiki-editor.is-block-selecting .we-ce { caret-color: transparent; }
        .we-marker {
          flex: none; min-width: 18px; text-align: right;
          color: var(--wa-color-text-quiet);
          user-select: none;
        }
        .we-block.we-text .we-marker,
        .we-block.we-h1 .we-marker, .we-block.we-h2 .we-marker,
        .we-block.we-h3 .we-marker, .we-block.we-divider .we-marker { display: none; }
        .we-body { flex: 1 1 auto; min-width: 0; }
        .we-ce {
          outline: none; white-space: pre-wrap; word-break: break-word;
          caret-color: var(--wa-color-brand-fill-loud);
        }
        .we-ce:empty::before,
        .we-ce:has(> br:only-child)::before {
          content: "Type '/' for commands, [[ to link a page";
          color: var(--wa-color-text-quiet);
          opacity: 0; pointer-events: none;
        }
        .we-ce:focus:empty::before,
        .we-ce:focus:has(> br:only-child)::before { opacity: 1; }
        /* Opt the headings out of the app stylesheet's headline cover:
           plain sized text, not a filled block. */
        .we-h1 .we-ce { font-size: var(--wa-font-size-2xl); font-weight: var(--wa-font-weight-bold); }
        .we-h2 .we-ce { font-size: var(--wa-font-size-xl); font-weight: var(--wa-font-weight-semibold); }
        .we-h3 .we-ce { font-size: var(--wa-font-size-l); font-weight: var(--wa-font-weight-semibold); }
        .we-divider hr {
          border: none; margin: var(--wa-space-m) 0;
          border-top: var(--wa-border-width-s) dashed var(--wa-color-surface-border);
        }
        .wiki-root a.wikilink {
          color: var(--wa-color-brand-on-quiet);
          text-decoration: none;
          border-bottom: 1px solid var(--wa-color-brand-fill-loud);
          cursor: pointer;
        }
        .we-append {
          display: inline-block;
          margin-top: var(--wa-space-m);
          color: var(--wa-color-text-quiet);
          cursor: pointer; font-size: var(--wa-font-size-s);
        }
        .we-append:hover { color: var(--wa-color-text-normal); }
        .we-menu {
          position: absolute; z-index: 40;
          min-width: 220px; max-height: 300px; overflow: auto;
          background: var(--wa-color-surface-raised);
          border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          box-shadow: var(--wa-shadow-m);
          font-size: var(--wa-font-size-s);
        }
        .we-mi { padding: var(--wa-space-2xs) var(--wa-space-m); cursor: pointer; }
        .we-mi:hover, .we-mi.is-hot { background: var(--wa-color-neutral-fill-quiet); }
        .we-block.is-flash { animation: wiki-flash 1.2s ease; }
        @keyframes wiki-flash {
          0%, 40% { background: var(--wa-color-brand-fill-quiet); }
          100% { background: transparent; }
        }

        /* -- panel ----------------------------------------------- */
        wiki-panel {
          display: flex; flex-direction: column;
          min-height: 0; overflow: auto;
          border-left: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          background: var(--wa-color-surface-raised);
          font-size: var(--wa-font-size-s);
        }
        .wp-tabs {
          display: flex; flex: none;
          border-bottom: var(--wa-border-width-s) solid var(--wa-color-surface-border);
        }
        .wp-tab {
          flex: 1; padding: var(--wa-space-s);
          font: inherit; cursor: pointer;
          color: var(--wa-color-text-quiet);
          background: none; border: none;
          border-top: 2px solid transparent;
        }
        .wp-tab.is-active {
          color: var(--wa-color-text-normal);
          font-weight: var(--wa-font-weight-semibold);
          border-top-color: var(--wa-color-brand-fill-loud);
        }
        .wp-body { display: flex; flex-direction: column; gap: var(--wa-space-s); padding: var(--wa-space-m); }
        .wp-card {
          display: flex; flex-direction: column; gap: var(--wa-space-2xs);
          padding: var(--wa-space-s) var(--wa-space-m);
          border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          background: var(--wa-color-surface-default);
          cursor: pointer;
        }
        .wp-card.is-resolved { opacity: .55; }
        .wp-meta { display: flex; align-items: center; gap: var(--wa-space-s); }
        .wp-badge {
          font-size: var(--wa-font-size-xs);
          color: var(--wa-color-text-quiet);
          border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          padding: 0 var(--wa-space-2xs);
        }
        .wp-snippet {
          color: var(--wa-color-text-quiet);
          font-size: var(--wa-font-size-xs);
          border-left: 2px solid var(--wa-color-surface-border);
          padding-left: var(--wa-space-s);
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .wp-acts { display: flex; gap: var(--wa-space-s); }
        .wp-acts button {
          font: inherit; font-size: var(--wa-font-size-xs);
          color: var(--wa-color-brand-on-quiet);
          background: none; border: none; padding: 0; cursor: pointer;
        }
        .wp-empty {
          color: var(--wa-color-text-quiet);
          padding: var(--wa-space-l) var(--wa-space-2xs);
          line-height: 1.7;
        }
        .wp-empty span { opacity: .7; }
        .wp-compose {
          display: flex; flex-direction: column; gap: var(--wa-space-s);
          margin: var(--wa-space-m);
          padding: var(--wa-space-m);
          border: var(--wa-border-width-s) solid var(--wa-color-brand-fill-loud);
        }
        .wp-compose[hidden] { display: none; }
        .wp-compose-target {
          font-size: var(--wa-font-size-xs);
          color: var(--wa-color-text-quiet);
          border-left: 2px solid var(--wa-color-surface-border);
          padding-left: var(--wa-space-s);
        }
        .wp-text {
          font: inherit; color: inherit;
          min-height: 64px; padding: var(--wa-space-s);
          background: var(--wa-color-surface-default);
          border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          outline: none; resize: vertical;
        }
        .wp-compose-acts { display: flex; justify-content: flex-end; gap: var(--wa-space-s); }
        .wp-compose-acts button { font: inherit; cursor: pointer; padding: var(--wa-space-2xs) var(--wa-space-m); }
        .wp-cancel { color: var(--wa-color-text-quiet); background: none; border: none; }
        .wp-submit {
          color: var(--wa-color-brand-on-loud);
          background: var(--wa-color-brand-fill-loud);
          border: none;
        }
      </style>

      <div class="wiki-data" hidden>
        <tonk-display model=component></tonk-display>
        <tonk-display model=tonk:wiki/page></tonk-display>
        <tonk-display model=tonk:wiki/block></tonk-display>
        <tonk-display model=tonk:wiki/comment></tonk-display>
        <tonk-display model=tonk:wiki/link></tonk-display>
      </div>

      <wiki-tree active={active}
        onnavigate=wiki/activate-page
        oncreatepage=wiki/create-page
        oncreatesub=wiki/create-subpage
        ondeletepage=wiki/delete-page></wiki-tree>

      <wiki-editor active={active}
        onnavigate=wiki/activate-page
        onedit=wiki/edit-block
        oncreateblock=wiki/create-block
        ondeleteblock=wiki/delete-block
        onturnblock=wiki/turn-block
        onmoveblock=wiki/move-block
        onlinkadd=wiki/link-add
        onrenamepage=wiki/rename-page></wiki-editor>

      <wiki-panel active={active}
        onnavigate=wiki/activate-page
        onaddcomment=wiki/add-comment
        onresolvecomment=wiki/resolve-comment
        ondeletecomment=wiki/delete-comment></wiki-panel>
    </div>

# Route the space to the wiki shell: the space route mounts
# `<tonk-display entity={replica} model=tonk/space>`; this alias
# resolves `tonk/space` to `tonk:wiki`, so the shell renders for that
# replica (overriding core.yaml's default `tonk:blank`).
name!:
  this: id:tonk/space
  entity: tonk:wiki

# ============================================================
# STARTER CONTENT
# ============================================================
#
# One page, one block — enough that the fresh repo opens into a
# living canvas instead of an empty pane. Stable `id:` URIs keep
# re-seeding idempotent. Order keys deliberately sit mid-alphabet so
# there is always room to insert before them.

wiki/page!:
  this: id:wiki/home
  title: "Home"
  order: "m"

wiki/block!:
  this: id:wiki/home/welcome
  page: id:wiki/home
  order: "m"
  type: "text"
  text: "Welcome to your wiki. Click anywhere and type; press / for block commands, [[ to link pages."
