# Tonk profile library — the minimal standard library seeded onto the
# profile repository's meta branch.
#
# The profile branch only backs the Tonk Hub at `/`: a picker over the
# spaces this profile can open. It does NOT render workspaces, boards,
# sheets, inspectors, or any artifact view — those live on each space's
# own content branch and are seeded from the full `core.yaml`. This
# document carries what the Hub needs rather than the whole standard
# library, whose 60+ expressions the profile never uses.
#
# Lowering runs `analyze_local` (no running system), so every
# `&anchor` / bare-name reference must resolve within this file. Both
# definitions below are self-contained: the directory view's
# `model: space` resolves to the `&space` anchor here.

# A space the account has access to. These convergent directory records live
# on the profile repository's main branch — one per repository across the
# account, with `local` overlaid by each device. The Hub queries them in the
# top site's `with="main@profile:tonk"` context so the user can pick which
# space to open or replicate locally.
concept!: &space
  this: tonk:space
  description: A space on this account.
  with:
    subject:
      description: >
        The repository's subject DID (its stable identity). The Hub card
        links to `/space/{subject}`; the route reads the routing key as
        the suffix after the last `:`.

        These `xyz.tonk.space/*` attributes hang on the repository's own
        entity — NOT on a per-device replica row. Replica rows key on
        (device profile, subject), and profile main now syncs through
        the account, so listing them would show one card per device per
        space. The directory entry is asserted once per space and every
        device converges on it.
      the: xyz.tonk.space/subject
      cardinality: one
      as: entity
  maybe:
    owner:
      description: >
        The providing account, when it is the account registered on this
        branch. Derived by a rule from `provider`, so a row can tell a
        space this account hosts (removing it deletes the hosted copy)
        from one it was invited to (removing it leaves).
      the: xyz.tonk.space/owner
      cardinality: one
      as: entity
    presence:
      description: >
        Where this space stands ON THIS DEVICE: case:remote when no
        replica is held here, case:seeding while its content branch is
        still being seeded, case:replicated once it is. A remote row
        renders as a hollow space that replicates on first visit.

        Derived by the rules below from this device's replica rather
        than stored, so it cannot drift from it. The remote case is a
        negated premise (`unless: space/replica`) rather than an absent
        fact, so every row carries a presence and a view can select on
        it. The Hub card reflects this via [data-presence].
      the: xyz.tonk.space/presence
      cardinality: one
      as: entity
    name:
      description: >
        The directory mirror of the space's display name — written at
        create and kept current by the rename command — so a device
        that has not replicated the space can still label its card.
      the: xyz.tonk.space/name
      cardinality: one
      as: text
    provider:
      description: >
        The account providing this space with the access service. Its
        presence records that the space is provisioned (its remote is
        served): `/provider/add` runs when the upstream is attached,
        never per share, and this fact is what a share consults. The
        sync engine retracts it when the service answers that the
        subject is no longer served, returning the space to local-only.
        The value is the providing account's DID entity — identical
        from every replica, so the record converges where per-device
        timestamps would not.
      the: xyz.tonk.space/provider
      cardinality: one
      as: entity
    home-address:
      description: >
        The sync endpoint this space is served from — the UCAN address
        `main`'s upstream syncs through. The queryable twin of the
        `home.address` the space's grants carry in their signed meta,
        which rides inside the delegation envelope and cannot be
        queried. Written wherever the mount configuration is mirrored
        into the directory: attaching an upstream, creating with a
        remote, and mounting a joined space. Absent for a local-only
        space.
      the: xyz.tonk.space/home-address
      cardinality: one
      as: text
    founded-at:
      description: >
        When this account created the space. Its presence distinguishes a
        local-only space made here from a space joined through somebody
        else's invite; hosted ownership is still decided by `provider`.
      the: xyz.tonk.space/founded-at
      cardinality: one
      as: unsigned-integer

# The Add Space command. The Hub's space-create element sends this shape
# with a fresh command entity and follows its completion in the local overlay.
# The worker records the replica, seeds the repository, and navigates the
# creator. The command is transient and is swept before the durable commit.
# The event declaration remains available to older declarative create forms.
event!: &on/space-create
  type: "submit"
  prevent-default: true
  where:
    name: ".currentTarget.elements.name.value"
    open: ".currentTarget.elements.open.value"

command!: &space/create
  description: A request to create a new space.
  with:
    name:
      description: >
        The space name. The Hub sends "Untitled", which the worker
        uniquifies against existing space labels ("Untitled", "Untitled 2", …).
        The user renames the space in place on arrival.
      the: xyz.tonk.command.create-space/name
      as: text
    open:
      description: >
        Whether to navigate into the space once it exists. Absent means
        create only — the space appears in the Hub and the person stays
        where they are; the Hub's create control passes `true` because that IS
        what clicking "create new space" asks for. Creating and opening
        are separate wants: an agent or script creating a space in the
        background must not yank the page out from under whoever is
        using it.
      the: xyz.tonk.command.create-space/open
      as: text

# Pull a space the account has but this device does not. The Hub's
# remote rows are hollow — the directory names them but no replica is
# held here — and replication used to be implicit: the first data-plane
# request naming an unmounted repo tripped the mount as a side effect.
# This makes it something you can ASK for. The worker's provider runs
# the SAME routine the lazy path does, so both report identical state.
#
# Carries its target `space` rather than firing on the dispatch origin:
# the affordance is a Hub card on the profile branch, naming precisely
# the space this device has no replica of.
command!: &space/replicate
  this: tonk:space/replicate
  description: Pull a space this device holds no replica of.
  with:
    space:
      description: The space to pull, as its subject DID.
      the: xyz.tonk.command.replicate-space/space
      as: entity

# The device-local Remove Space command. A joined-space leave or local-only
# delete submits this transient; the worker's `RemoveSpaceHandler` retracts
# the replica record from this branch, evicts the space from the reactor
# (stopping background sync), and deletes its local storage. An owned hosted
# space does NOT submit it: `<space-remove>` routes that verb through the
# reviewed account-space deletion flow instead.
# The command is transient: it fires the handler once and is swept before
# the durable commit.
#
# The COMMAND's field used to be `dataset/remove` too, deliberately NOT
# `dataset/subject`: `tonk/rename-repository` transients already carried
# `dataset/subject`, and a remove matched on that attribute alone would
# have decoded every rename — turning each rename into a deletion. The
# distinct DOM read path doubled as the command's unique shape.
# `xyz.tonk.command.remove-space/subject` is that distinctness by
# construction, so the field is named for what it is. The DOM attribute
# it is read FROM keeps its name: `<space-remove>` locates this form
# by it.
#
# How the confirm's submit fills it.
#
# The source is the form's `data-remove`, not a `{subject}` template
# field, because that attribute is load-bearing for something else:
# `<space-remove>` finds this form by `form[data-remove]` to write the
# confirm copy into it. Stamping a second attribute carrying the same DID
# just to feed the command would be two names for one fact. Reading the
# one that already exists is what an `event!:` declaration is for —
# platform specifics live here so the command stays domain-shaped.
event!: &on/space-remove
  type: "submit"
  prevent-default: true
  where:
    subject: ".currentTarget.dataset.remove"

command!: &space/remove
  description: A request to remove a space from this device (its list entry and local data).
  with:
    subject:
      description: The subject DID of the space to remove.
      the: xyz.tonk.command.remove-space/subject
      as: entity

# Load the requesting tab's site for its current path. Mirrors core.yaml's
# `&tonk/load` — seeded here too because the top-level `<tonk-site>` stamps onto
# the PROFILE branch (its ancestors resolve no named repo, so the claim routes
# here). The worker's `LoadHandler` matches `path` against this branch's `route!`
# table and stamps `tonk:site` onto the element-supplied `this`.
command!: &tonk/load
  this: tonk:load
  description: Stamp the requesting tab's site for its current path on this branch.
  with:
    path:
      description: The route path the tab is at, matched against the route table.
      the: xyz.tonk.site/path
      as: text

# `view` is a BUILT-IN concept (tonk-schema's registry, beside
# `concept`, `command`, `event` and `rule`). It is declared there
# rather than here because the analyzer has to understand a view
# structurally: a `show:` template can bind `on:<name>=<command>`,
# and those are resolved at lowering into the view's `bindings`
# rather than re-queried per name on every refresh.
#
# An in-document declaration SHADOWS a builtin, so declaring it
# here again would silently restore runtime resolution. What lives
# in the libraries are its INSTANCES: the `view!:` blocks below.

# The Hub directory view: the picker shown at `/`. One card per space,
# linking to its `/space/{subject}` page. A space is identified by its
# subject did:key; the route reads the routing key as the suffix after
# the last `:`, so `{subject}` (a full did:key) resolves to that key.
# The card's name is NOT read from this profile-side record — it is read
# from the listed space's OWN repository: the row's `with={subject}`
# context opens that space's routing context and a
# `<tonk-display model=tonk:repository view=label>` inside it
# shows the repo's current name (the cross-device source of truth).
# Rendered as a directory (no entity) over the `space` model on the
# profile meta branch.
view!:
  this: space
  style:
    ui: |
      /* The hub chrome: the space directory at `/` and the /settings route.
         Both views render it (logo, column, two-cell bar, account view,
         spaces stack), so it is declared once here and embedded by both —
         `/settings` reads it as `ui@space`, which is why a change lands on
         both pages or neither.

         Self-contained on purpose: the tokens below are literal, so this
         travels with the view rather than depending on a stylesheet the
         host injects. */

      :root{
        --page:#e8e6e4; --ink:#38182a; --on-ink:#f7f6f5; --soft:#5b4953;
        /* the current role — a place you are in, split from the CTA register
           (Aug 20): near-ink, one step toward the page, so a tab never
           outshouts an action. Filled by the colour pass — same hue as the ink,
           +10 points of lightness and a little less saturation. */
        --cur:#552e44;
        --ring:rgba(56,24,42,0.85); --sep:rgba(56,24,42,.28); --frost:rgba(253,252,252,0.72);
        --frost-solid:#f7f6f5; /* frost pre-composited over the flat page — same look, no filter */
        --panel:#d0ccc8; --card:#fcfbfb; --card-hover:#eeedec;
        --wash:rgba(56,24,42,.06); --wash-2:rgba(56,24,42,.12);
        /* wash-p is the hover for SOLID-INK surfaces, so it must be a wash of
           on-ink, not of ink — a 16% ink wash over ink composites to exactly
           the resting color (the generator derived the light twin from the
           wrong end; the dark twin already derives from on-ink). rose-white,
           the scheme's own light, not the old cream. */
        --wash-p:rgba(247,246,245,.16);
        --canvas:#e4e2e0; --stub-ink:#9f968e;
        --veil:rgba(232,230,228,.9); --dim:rgba(56,24,42,.32); --track:rgba(56,24,42,.22);
        --cond:"IBM Plex Sans Condensed","Bahnschrift","Arial Narrow",sans-serif;
        --sans:"IBM Plex Sans",Helvetica,Arial,sans-serif;
        --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
        --ease:cubic-bezier(.25,.46,.45,.94);
      }
      @media (prefers-color-scheme: dark){
        :root{
          --page:#161313; --ink:#e2dfdd; --on-ink:#221c1d; --soft:#c8c3bf;
          --cur:#cdc9c5; /* the same step toward the page, inverted */
          --ring:rgba(226,223,221,0.55); --sep:rgba(226,223,221,.28); --frost:rgba(29,24,25,0.78);
          --frost-solid:#1b1718;
          --panel:#3c3335; --card:#261f20; --card-hover:#322a2b;
          --wash:rgba(226,223,221,.09); --wash-2:rgba(226,223,221,.15); --wash-p:rgba(34,28,29,.14);
          --canvas:#1c1718; --stub-ink:#736265;
          /* in the dark the veil is the page itself — bone rings and labels punch
             through any translucency and ghost false edges into the panel's seams,
             so the spaces step back fully. the light twin keeps its .9 whisper. */
          --veil:#161313; --dim:rgba(0,0,0,.45); --track:rgba(226,223,221,.25);
        }
      }

      /* ── The Hub — the space directory at `/`.
         Named `.hub-page`, not `.hub`: `tonk-ui/styles.css` still carries a
         `.hub` block from an earlier launcher (a 56rem centred column),
         which clipped this page to a band down the middle of the viewport.
         That CSS is dead — nothing renders `.hub-card` / `.hub-route` any
         more — but it is not this change's to delete.
         Chrome, and it runs on the same material as the FAB: a neutral
         page, 36px frost blocks with ink rings, lowercase condensed words
         seated bottom-right, ink only.

         COLORS LIVE ABOVE: the token block at the top of this style,
         taken from the fabb wireframes as literal values rather than
         aliases over a component library's theme. That is what lets this
         page stand on its own — nothing has to be injected into the guest
         for the hub to have its colors, and the dark twin is the media
         query above, not a class someone else stamps. ── */
      .hub-page {
        position:relative; min-height:100dvh; background:var(--page);
        color:var(--ink); font-family:var(--cond);
      }
      .hub-page *, .hub-page *::before, .hub-page *::after { box-sizing:border-box; }
      /* selection is chrome too — ink, never the browser's blue */
      .hub-page ::selection { background:var(--ink); color:var(--on-ink); }
      .hub-page :focus-visible { outline:none;
        box-shadow:inset 0 0 0 2px var(--on-ink), inset 0 0 0 4px var(--ink); }
      /* A real reset, not a token one. Web Awesome skins NATIVE controls
         inside `@layer wa-native` — `button` gets `display:inline-flex`,
         padding, a min-height, a radius and a border — so a cell built on
         a <button> and one built on an <a> laid their words out
         differently, and the mode cap came out a rounded slab instead of
         an 18px pill. Unlayered author rules outrank layered ones, so this
         wins without `!important`. */
      /* `:where()` so the reset contributes NO specificity: a plain
         `.hub-page button` is (0,1,1) and silently outranks every (0,1,0)
         cell rule below — which stripped `.hcell`'s padding and left "new
         space" flush against the corner while the anchor cell next to it
         sat correctly. A reset must lose every tie it takes part in. */
      .hub-page :where(button) {
        font:inherit; letter-spacing:inherit; color:inherit; text-align:inherit;
        background:none; border:0; border-radius:0; margin:0; padding:0;
        min-width:0; min-height:0; block-size:auto; inline-size:auto;
        box-shadow:none; appearance:none; -webkit-appearance:none;
        cursor:pointer; }
      .hub-page :where(a) { color:inherit; text-decoration:none; }

      /* the block: 36px, frost + ink ring. every cell derives from it. */
      .blk { height:36px; background:var(--frost);
        -webkit-backdrop-filter:blur(12px) saturate(1.5); backdrop-filter:blur(12px) saturate(1.5);
        box-shadow:0 0 0 1px var(--ring); }
      .chrome { font-family:var(--cond); font-weight:600; font-size:13px;
        line-height:1; letter-spacing:.02em; text-transform:lowercase; }

      /* ── centered launcher — the mark leads the column, in flow (a fixed
         corner mark was the left anchor's partner, and the anchor is gone) ── */
      .hub-logo { display:flex; justify-content:center; margin:48px 0 0;
        color:var(--ink); user-select:none; }
      .hub-logo svg { display:block; width:132px; height:auto; }
      /* two cells now: account 144 · spaces 432 = 576 — the settings cell
         left the bar for the account view (settings is an account place,
         and under the name is where hands look for it). 576 is the shared
         ceremony width, and the hub speaks it too. */
      .hubcol { width:min(576px, calc(100vw - 32px)); margin:56px auto 120px; }
      .hubbar { position:relative; z-index:10; display:flex; align-items:stretch;
        width:100%; height:36px; background:var(--frost-solid);
        box-shadow:0 0 0 1px var(--ring); }
      /* every word sits bottom-right on the 9px seat */
      .hcell { display:flex; align-items:flex-end; justify-content:flex-end; gap:8px;
        padding:0 10px 9px 12px; font-size:13px; line-height:1; white-space:nowrap;
        text-decoration:none; color:inherit; flex:none; }
      .hcell:hover { background:var(--wash); }
      .hcell:active { background:var(--wash-2); }
      /* the account cell flushes its name LEFT against the bar's end */
      .hc-acct { width:144px; min-width:0; justify-content:flex-start; }
      .hc-view { width:432px; border-left:1px solid var(--sep); }
      /* the view you are in wears CURRENT (near-ink) — solid ink stays the
         CTA register, so a tab never outshouts an action */
      .hc-acct[aria-current="page"], .hc-view[aria-current="page"] {
        background:var(--cur); color:var(--on-ink); }
      .hc-acct[aria-current="page"]:hover, .hc-view[aria-current="page"]:hover,
      .hc-acct[aria-current="page"]:active, .hc-view[aria-current="page"]:active {
        background:linear-gradient(var(--wash-p),var(--wash-p)), var(--cur); }
      /* exactly one cell wears the CURRENT coat and it follows the view:
         spaces while the roster shows, the account cell while its page
         (linking ceremony or account stack) is up. The mock's solid-ink
         account cell belongs only to its fully signed-out state, where
         the roster is gone — an unlinked profile here still has one. */
      hub-bar[linking="true"] .hc-acct { cursor:default; }
      .hcell .g { font-size:14px; font-weight:500; }
      .settings-icon { width:9px; height:9px; flex:none; margin-bottom:1px; }

      /* ── the account view — the second tab's page: it REPLACES the
         spaces list under the bar. The current account is the tab itself,
         so the rows are only ways onward: settings first, one row per
         other account carrying its switch verb, then the add door — the
         page's one CTA, solid ink. ── */
      .hub-page hub-bar { position:relative; display:block; width:100%; }
      /* The menu's own `open` attribute drives its visibility, rather
         than a `hidden` attribute script has to remember to toggle. */
      .account-trigger { overflow:hidden; }
      .account-trigger [data-account-label] { overflow:hidden; text-overflow:ellipsis;
        white-space:nowrap; text-transform:none; }
      .account-menu { display:flex; flex-direction:column; gap:7px; width:100%; margin-top:7px;
        color:var(--ink); }
      .account-menu[hidden] { display:none; }
      .account-menu__profiles { display:flex; flex-direction:column; gap:7px; }
      .account-menu__profiles:empty { display:none; }
      /* the account page's rows hang from the bar as bar-sized cells with
         the stack's 7px gaps of page between them */
      .account-menu__profiles-seat { display:flex; flex-direction:column; gap:7px; }
      .account-menu__profiles-seat > span[data-when-linked] { display:contents; }
      .account-menu__profiles-seat tonk-display { display:flex; flex-direction:column; gap:7px; }
      .account-menu__profiles-seat tonk-display:not(:has(.account-menu__row:not([data-active]))) { display:none; }
      /* the account you are on is the bar; the list holds the others */
      .account-menu__row[data-active] { display:none; }
      .account-menu__row { display:flex; align-items:flex-end; justify-content:flex-end;
        gap:8px; width:100%; min-height:36px; padding:0 10px 9px 16px; text-align:left;
        background:var(--frost-solid); font:inherit; color:inherit; cursor:pointer;
        box-shadow:0 0 0 1px var(--ring); }
      .account-menu__row:hover { background:linear-gradient(var(--wash),var(--wash)), var(--frost-solid); }
      .account-menu__row:active { background:linear-gradient(var(--wash-2),var(--wash-2)), var(--frost-solid); }
      /* the name holds the left end; user words ride untouched */
      .account-menu__row .an { margin-right:auto; text-transform:none;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        padding-bottom:4px; margin-bottom:-4px; }
      .account-menu__row .g { font-size:14px; font-weight:500; }
      /* the add door — the page's one CTA */
      .account-menu__row--ink { background:var(--ink); color:var(--on-ink);
        box-shadow:0 0 0 1px var(--ink); }
      .account-menu__row--ink:hover, .account-menu__row--ink:active {
        background:linear-gradient(var(--wash-p),var(--wash-p)), var(--ink); }
      .account-menu__error { padding:10px 12px; background:var(--frost-solid);
        color:var(--ink); font-family:var(--sans); font-size:12px; line-height:1.45;
        text-wrap:pretty; overflow-wrap:anywhere; box-shadow:0 0 0 1px var(--ring); }
      .account-menu__error[hidden] { display:none; }

      /* ── settings — a page of the account tab (the wireframe's reading):
         the stack steps aside and the section hangs from the same bar.
         The panel's own styling (body and rows) is scoped to
         `<account-settings>` in `tonk-ui/styles.css`; only the hub
         seat's geometry lives here. ── */
      .settings { display:flex; flex-direction:column; align-items:stretch;
        margin-top:7px; }
      .settings[hidden] { display:none; }

      /* ── the spaces stack — 432, blocks with 7px gaps of pure page ── */
      .stack { width:100%; margin-top:7px; display:flex;
        flex-direction:column; gap:7px; }
      .stack[hidden] { display:none; }
      /* The account cell while its name is still replicating: a <wa-skeleton>
         standing in for the name that has not arrived. A name is a fact; until
         one arrives the cell shows the SHAPE of one rather than a guess (the
         profile handle) or a word about the machinery.

         `--color` is overridden so the bar is the page's own ink at low alpha
         rather than the neutral fill: the wireframes' rule is that waiting
         never takes a color. The sheen carries the motion, so nothing here
         animates by hand. */
      hub-bar [data-account-skeleton] {
        display:block; width:88px; height:0.7em; align-self:center;
        flex:0 0 auto; border-radius:2px;
        /* A travelling highlight over a dim base -- the sheen, done in two
           stops of the cell's OWN ink so waiting never takes a color. The
           band is 400% wide and slides, which is what reads as motion; the
           base stays put. */
        background:linear-gradient(90deg,
          color-mix(in srgb, currentColor 12%, transparent) 0%,
          color-mix(in srgb, currentColor 12%, transparent) 35%,
          color-mix(in srgb, currentColor 30%, transparent) 50%,
          color-mix(in srgb, currentColor 12%, transparent) 65%,
          color-mix(in srgb, currentColor 12%, transparent) 100%);
        background-size:400% 100%;
        animation:tonk-sheen 2.2s ease-in-out infinite; }
      hub-bar [data-account-skeleton][hidden] { display:none; }
      @keyframes tonk-sheen {
        from { background-position:200% 0; }
        to { background-position:-200% 0; } }
      /* the wrapper, not the link, is the positioning context: the verbs
         and the confirm cluster sit OUTSIDE the anchor (a control inside
         one is invalid markup, and a label inside one navigates instead of
         doing its job) while reading as part of the row */
      .srow-wrap { position:relative; }
      .srow { display:flex; align-items:flex-end;
        justify-content:flex-end; padding:0 10px 9px 16px; cursor:pointer;
        text-decoration:none; color:var(--ink);
        background:var(--frost-solid);
        -webkit-backdrop-filter:none; backdrop-filter:none; }
      .srow:hover { background:linear-gradient(var(--wash),var(--wash)), var(--frost-solid); }
      .srow:active { background:linear-gradient(var(--wash-2),var(--wash-2)), var(--frost-solid); }
      /* the ellipsis clip needs descender room: at line-height 1 the box
         ends at the baseline's feet and takes the tails off g, p and y.
         The padding gives the clip air; the negative margin hands it back
         so the seat does not move. */
      .srow .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        text-transform:none; padding-bottom:4px; margin-bottom:-4px;
        max-width:calc(100% - 130px); }
      /* a space still seeding, and one this device has not replicated:
         quieter, but still openable — visiting replicates it */
      .srow-wrap[data-status="tonk:blank"] .srow .n { opacity:.6; }
      .srow-wrap:not([data-local="true"]) .srow .n { color:var(--soft); }
      /* the verbs — soft until approached, left of the row. Soft ink is
         metadata-only, so they take full ink the moment they are live. */
      .verbs { position:absolute; left:16px; bottom:9px; display:flex; gap:18px;
        opacity:0; transition:opacity .15s var(--ease); color:var(--soft); }
      .srow-wrap:hover .verbs, .srow-wrap:focus-within .verbs { opacity:1; }
      space-remove { display:contents; }
      .verbs tonk-share { display:contents; }
      .verbs [data-share-copy-label] { display:none; }
      .verbs tonk-share:not([data-share-state]) [data-share-copy-label="idle"],
      .verbs tonk-share[data-share-state="idle"] [data-share-copy-label="idle"],
      .verbs tonk-share[data-share-state="copying"] [data-share-copy-label="copying"],
      .verbs tonk-share[data-share-state="copied"] [data-share-copy-label="copied"],
      .verbs tonk-share[data-share-state="blocked"] [data-share-copy-label="failed"],
      .verbs tonk-share[data-share-state="failed"] [data-share-copy-label="failed"] { display:inline; }
      .verbs button, .verbs .verb-remove { display:inline-flex; align-items:center;
        color:inherit; font:inherit; letter-spacing:inherit;
        text-transform:lowercase; cursor:pointer; }
      .verbs button:hover, .verbs .verb-remove:hover { color:var(--ink);
        text-decoration:underline; text-underline-offset:3px; }
      .verbs button:disabled { opacity:.55; cursor:wait; text-decoration:none; }
      /* creation is the stack's final, and only, solid ink row */
      space-create, .snew-form { display:block; }
      .snew:disabled { cursor:wait; }
      [data-create-status] { margin:8px 0 0; font:13px/1.5 var(--sans); }
      [data-create-status][data-announce-only] { position:absolute; width:1px; height:1px; padding:0; margin:0; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
      .snew { display:flex; align-items:flex-end; justify-content:flex-end; gap:8px;
        width:100%; height:36px; padding:0 10px 9px 16px; background:var(--ink);
        color:var(--on-ink); box-shadow:0 0 0 1px var(--ink); cursor:pointer; }
      .snew:hover { background:linear-gradient(var(--wash-p),var(--wash-p)), var(--ink); }.remove-form { margin:0; font-family:var(--sans); font-weight:600;
        font-size:13.5px; line-height:1.6; text-transform:none; }
      .m-cancel { display:flex; align-items:flex-end; justify-content:flex-end;
        min-width:144px; height:36px; padding:0 10px 9px 24px; border:0;
        background:var(--card); color:var(--ink); font:inherit; font-size:13px;
        cursor:pointer; }
      .m-cancel:hover { background:linear-gradient(var(--wash),var(--wash)), var(--card); }
      .m-go { height:36px; display:flex; align-items:flex-end; justify-content:flex-end;
        min-width:144px; padding:0 10px 9px 24px; border:0; background:var(--ink);
        color:var(--on-ink); box-shadow:0 0 0 1px var(--ink); font-size:13px;
        cursor:pointer; white-space:nowrap; }
      /* brightness on near-black reads as nothing — wash it instead */
      .m-go:hover { background:linear-gradient(var(--wash-p),var(--wash-p)), var(--ink); }

      @media (prefers-reduced-motion: reduce) {
        .verbs, .account-menu__row { transition:none; }
      }

      /* ── one breakpoint, the bar's own fold. Approach hides nothing from
         a hand that cannot hover. ── */
      @media (hover:none), (max-width:640px) {
        .verbs { opacity:1; gap:24px; }
        /* the 44 target law, invisibly — centres 44 apart, no overlap */
        .verbs button, .verbs .verb-remove { padding:16px; margin:-16px -12px; }
        .verbs button:hover, .verbs .verb-remove:hover { text-decoration:none; }
        .srow .n { max-width:calc(100% - 150px); }
      }
      @media (max-width:640px) {
        .hub-logo { margin-top:20px; }
        .hub-logo svg { width:98px; }
        .hubcol { width:calc(100vw - 32px); margin:40px auto 120px; }
        /* account holds its 144; the spaces cell follows the column */
        .hc-view { width:auto; flex:1; min-width:0; }
        .hubbar, .hcell { height:44px; min-height:44px; }
        .account-menu__row, .srow, .snew { min-height:44px; }
        .m-cancel, .m-go { min-height:44px; }
      }
      /* One page: the bar's path says whether the stack or the account
         section shows, and the section says whether its rows are for a
         browser with an account here or without one. */
      .hub-page:has(hub-bar[path^="/settings"]) [data-spaces-view],
      .hub-page:has(hub-bar[path="/account"]) [data-spaces-view] { display:none; }
      .hub-page:not(:has(hub-bar[path^="/settings"])):not(:has(hub-bar[path="/account"])) [data-settings-view] { display:none; }
      account-settings:not([data-linked="true"]) [data-when-linked] { display:none; }
      /* an account page with no account lists nothing: only the cluster shows */
      .hub-page:has(hub-bar[path="/account"]) [data-settings-view]:has(account-settings:not([data-linked="true"])) { display:none; }
  show:
    directory: |
        <div class="stack chrome" data-spaces-view aria-label="spaces">
          <link rel="stylesheet" with:src="ui">
          <!-- No empty-state bar. An account with no spaces and an
               account whose spaces are still arriving look identical
               from here, so any words this row could carry are wrong in
               one of those two cases. The waiting is stated where the
               waiting is known: the account cell, which holds a skeleton
               while the link runs. An empty stack simply shows the one
               row that is always true — "create new space". -->
          <!-- `data-id={this}` designates the repeat row — the WRAPPER, not the
               link, so the verbs and the confirm cluster travel with the row
               while staying outside it: reaching for the action never opens the space.
               Each per-space consumer carries its OWN subject; the routing
               helpers read an element's own attribute and never walk ancestors. -->
          <div class="srow-wrap" data-presence={presence} data-id={this}>
            <a class="srow blk" href="/space/{subject}"><span class="n">{name}</span></a>
            <!-- Both verbs sit outside the anchor and are laid over it: a
                 <button> inside an <a> is invalid markup the parser reshapes,
                 and a <label for> inside one navigates rather than opening the
                 confirm. Hovering the row reveals them (`.srow-wrap:hover`),
                 so the reveal still follows the row and not just the verbs. -->
            <space-remove data-space-subject={subject} data-space-name={name}
              data-space-provider={provider} data-space-founded={founded-at}
              data-space-owner={owner}>
              <span class="verbs">
                <tonk-share space={subject}><button type="button" class="copy-verb"><span data-share-copy-label="idle">copy link</span><span data-share-copy-label="copying">copying…</span><span data-share-copy-label="copied">copied</span><span data-share-copy-label="failed">couldn't copy</span></button></tonk-share>
                <button class="verb-remove" type="button" data-space-remove-open disabled>checking&hellip;</button>
              </span>
              <tonk-dialog data-space-remove-dialog heading="confirm leaving space">
                <form id="remove-{subject}" class="remove-form" on:space-remove=space/remove data-remove={subject}>
                  Leave {name}? This removes the space and its local data from this
                  device. You'll need another invite link to join again. Other
                  members keep access.
                </form>
                <button class="m-cancel" slot="actions" type="button" data-dialog="close">cancel</button>
                <button class="m-go" slot="actions" type="submit" html:form="remove-{subject}" data-space-remove-submit>leave space</button>
              </tonk-dialog>
            </space-remove>
          </div>
          <!-- Creating asks nothing up front: the space starts "Untitled" (the
               worker uniquifies the sentinel) and is renamed in place with the
               bar's block cursor the moment you land in it. No remote is
               carried: the worker resolves where a space syncs from the
               account's own registration, so a space created before anyone
               registers stays local until it is shared. -->
          <space-create>
            <form class="snew-form">
              <button class="snew chrome" type="submit" disabled><span data-create-label>create new space</span><span class="g" aria-hidden="true">+</span></button>
            </form>
            <p data-create-status role="status" aria-live="polite" hidden></p>
          </space-create>
        </div>
    # The space page's waiting room. Reached only when the space's own
    # content has not arrived but the account's DIRECTORY ROW for it has
    # — so this device knows the space exists and is entitled to it, and
    # the bytes are simply still coming. Named `downloading` because
    # that is the whole message: no error, no invitation advice.
    #
    # The name is the directory mirror (`xyz.tonk.space/name`), written
    # at create and kept current by rename, which exists so a device
    # that has not replicated a space can still label it.
    downloading: |
      <div class="space-unknown">
        <tab-title text="{name} — Tonk"></tab-title>
        <a class="space-unknown-mast" href="/" aria-label="Tonk home"><img src="/images/tonk-wordmark.svg" alt=""></a>
        <div class="space-unknown-wall">
          <h1 class="space-unknown-statement">downloading {name}</h1>
          <p class="space-unknown-narrator">This space is on its way to this device. It opens as soon as enough of it has arrived.</p>
        </div>
      </div>


# ============================================================
# FAB — floating action button view (rendered in the FAB portal iframe)
# ============================================================
#
# These declarations live on the profile branch because the FAB portal is
# scoped to it (`with="main@profile:tonk"`). The
# guest renders `tonk:profile/fab` via a `<tonk-display>` mounted
# by the shell's FAB portal content string.
#
# Identity note (V1 — not yet wired): the FAB portal `content` string in
# core.yaml embeds only `data-space`; `data-did` and `data-name` are NOT
# embedded. The `did={dom.host/data-did}` and `{dom.host/data-name}`
# template slots below are placeholders that render empty until a follow-up
# wires the worker to stamp `state:self` identity onto the profile/meta
# branch and the shell to embed those values in the portal content string.

# The member's display name, read directly from THIS (profile meta) branch —
# the durable `ProfileName` override the worker stamps on `profile/rename`
# (attribute `xyz.tonk.profile/display-name`, keyed by the profile DID). The
# FAB is sealed to the profile/meta branch, so unlike the space roster's names
# (which live in each space's own repo and are unreachable from the sealed
# guest) this one is an ordinary in-branch read. Absent until the user renames
# (the worker's `petname` fallback is computed, not persisted), so the bar's
# name slot renders empty until a name is set.
concept!: &profile/name
  this: tonk:profile/name
  description: The member's display-name override on the profile meta branch.
  with:
    name:
      description: The chosen display name (xyz.tonk.profile/display-name).
      the: xyz.tonk.profile/display-name
      cardinality: one
      as: text

# Rename the signed-in member (set their display name). Lives here as well as
# in core.yaml because the FAB is sealed to the profile/meta branch: the
# guest's `<tonk-display>` resolves the command's concept descriptor by a
# phase-1 lookup against THIS branch (seeded from the lean profile.yaml), so
# the command must be present here for the editable's rename binding to
# fire. The worker's globally-registered `ProfileRenameHandler` does the
# work (persist `ProfileName`, restamp `MemberName` across every space's
# roster, republish self-identity) — this descriptor only has to decode
# the new name.
#
# It used to carry a `tonk:profile` marker as well, because this and
# `tonk/rename-repository` both read `currentTarget.value` and a shape
# matched on that attribute alone made every space rename also rename the
# profile. Each command's own attribute namespace keeps them disjoint now.
# The editable commits on `change`, the event a text input fires when
# the value settles — a blur or Enter, not a keystroke. Mirrors
# `on/repository-rename`, which edits a space's name the same way.
event!: &on/profile-rename
  type: "change"
  where:
    name: ".currentTarget.value"

command!: &profile/rename
  description: Rename the signed-in member (set their display name).
  with:
    name:
      description: The new name, read from the editable's value on commit.
      the: xyz.tonk.command.profile-rename/name
      as: text

# Toggle auto-sync (pause ⇄ resume) for a space. Dispatched by the FAB's
# `<ui-sync-status onpause=…>` cap on alt/option-click. Defined here on the
# PROFILE branch (not on each space's branch) and dispatched on the profile
# context, so the FAB's pause affordance depends on nothing seeded per-space —
# older spaces missing a `fab-pause` view no longer break it. The `space` field
# names WHICH replica to flip; the worker's PauseSyncHandler reads it in place
# of the dispatch origin. `time` makes each click a distinct transient so the
# toggle reliably re-fires.
#
# It used to carry a marker field too, whose only job was to keep this
# shape distinct from `tonk:invite`'s identical {this, time}. Each
# command now owns its attribute namespace, so the two cannot collide.

# Ask whether a newer seed is waiting for a space, without installing it.
# The command fetches the space's own seed source, compares the bytes
# against what it is running, and asserts the answer as an OVERLAY fact:
# the result is this device's observation at this moment, not something
# true of the space, so it must not replicate. `time` makes each ask a
# distinct transient.
command!: &tonk/check-update
  this: tonk:check-update
  description: Ask whether a newer seed is waiting for a space.
  with:
    time:
      description: The click's timestamp; makes each ask a distinct transient.
      the: xyz.tonk.command.check-update/time
      as: float
    space:
      description: The space to check, as its subject DID.
      the: xyz.tonk.command.check-update/space
      as: entity

# A seed-update check IN FLIGHT on this device, keyed on the replica —
# the entity that already pairs this profile with this subject, so a
# check on one device says nothing about another. Replica records live
# on the profile meta branch and never replicate, which is exactly the
# scope of "am I checking right now".
#
# Presence IS the state: the attribute is asserted before the fetch and
# retracted when the check settles, so a view asks whether it exists
# rather than comparing against a `case:` value. It holds the check's
# own transient entity rather than a boolean, so a marker stranded by a
# crashed worker is identifiable and a second check cannot silently
# clobber the first.
concept!: &replica/checking
  this: tonk:replica/checking
  description: A seed-update check in flight on this device.
  with:
    checking:
      description: The dispatched check's transient entity.
      the: xyz.tonk.replica/checking
      cardinality: one
      as: entity

# When the last check COMPLETED on this device. Separate from the
# in-flight marker above so it survives the next check starting: a
# single status field would have to overwrite the previous result to
# say "pending", losing the answer the view is showing.
concept!: &replica/checked
  this: tonk:replica/checked
  description: When this device last completed a seed-update check.
  with:
    checked:
      description: The completing check's timestamp.
      the: xyz.tonk.replica/checked
      cardinality: one
      as: float

# Why the last check FAILED, asserted only on failure and retracted on
# the next success. Text rather than a case: an unreachable source and
# a malformed document are different problems and the message is the
# useful part. A space that never recorded a seed is NOT a failure —
# it simply has no installed-seed fact, and that absence is the answer.
concept!: &replica/check-failure
  this: tonk:replica/check-failure
  description: Why this device's last seed-update check failed.
  with:
    failure:
      description: What went wrong, as reported to the person.
      the: xyz.tonk.replica/check-failure
      cardinality: one
      as: text

# A seed that EXISTS and where its bytes came from — global, durable,
# and silent about whether anything installed it. The entity is the
# content hash of the bytes, so two devices fetching the same library
# converge on one entity without coordinating.
#
# `seed/installed` below adds the install-specific fields on this same
# entity. Keeping them apart means a fetched-but-uninstalled seed can
# never look half-installed, and `version` never has an absent case a
# reader has to interpret.
concept!: &seed/available
  this: tonk:seed/available
  description: A seed that exists, and where its bytes came from.
  with:
    source:
      description: >
        Where these bytes were fetched from. The entity is the content
        hash alone, so the source rides alongside because a custom seed
        is a different URL at the same shape.
      the: xyz.tonk.seed/source
      cardinality: one
      as: text
    replaces:
      description: >
        The installed seed this one would supersede — the backlink that
        makes an available seed answerable on its own ("this is an
        update to what you are running") rather than only by joining it
        against the space's install record.
      the: xyz.tonk.seed/replaces
      cardinality: one
      as: entity

command!: &tonk/pause-sync
  this: tonk:pause-sync
  description: Toggle auto-sync (pause ⇄ resume) for a space.
  with:
    time:
      description: The click's timestamp; makes each dispatch a distinct transient.
      the: xyz.tonk.command.pause-sync/time
      as: float
    space:
      description: The target space DID — the replica whose auto-sync is flipped.
      the: xyz.tonk.pause-sync/space
      as: entity

# The FAB fallback seat — the nearest corner restored on the next page load,
# stored on `state:fab`. The live page keeps the exact point along the nearest
# edge; element.rs persists this compatible corner after every pointer-up drop.
concept!: &fab/dock
  this: tonk:fab/dock
  description: Persisted FAB dock (profile-meta claim).
  with:
    dock:
      description: The fallback corner restored on the next page load.
      the: xyz.tonk.fab/dock
      cardinality: one
      as: entity

# ============================================================
# JOIN — redeem an invite at /join (runs on the profile meta branch)
# ============================================================

# Redeem an invite URL. Fired by `<page-mount on:join=tonk:join>` on the
# /join view: the element reads the page location (the service worker can't
# see the `#fragment`, where an open invite's seed rides) and delivers it in
# the mount event's `detail` (a flat, URL-shaped record). The worker's
# `JoinHandler` reads the complete `href`, claims the
# invite, and drives the overlay-only `tonk:join/status` (pending → failed,
# or retract + durable replica on success). Lives here, not in core.yaml:
# the join happens on the PROFILE meta branch (it records a replica), so
# the command + view must resolve there.
# How the page element's mount fills it: the complete href, fragment and
# all, off the mount event's `detail`.
event!: &on/join
  type: "mount"
  where:
    url: ".detail.href"

command!: &tonk/join
  this: tonk:join
  description: Redeem an invite URL and join its space.
  with:
    url:
      description: The complete invite URL, including any fragment.
      the: xyz.tonk.command.join/url
      as: text

# The in-flight join, overlay-only, at the fixed `tonk:join/status` entity.
# Just `status` (`tonk:pending` while claiming, `tonk:failed` on error) so it
# resolves the moment a join starts — a concept also requiring reason/kind
# would only resolve once those exist (never in pending). On success the
# handler retracts this and asserts the durable replica instead; the Hub
# (durable replicas) never shows in-flight or failed joins.
concept!: &join/status
  this: tonk:join/status
  description: An in-flight join attempt's state (overlay-only).
  with:
    status:
      description: The attempt state, either pending or failed.
      the: xyz.tonk.join/status
      cardinality: one
      as: entity

# The failure detail for a join, at the same `tonk:join/status` entity —
# asserted alongside `status: tonk:failed`. A separate concept so the
# pending state (status only) still resolves; the view reads this for the
# message when failed.
concept!: &join/failure
  this: tonk:join/failure
  description: Why a join attempt failed (overlay-only).
  with:
    reason:
      description: Human-readable failure message.
      the: xyz.tonk.join/reason
      cardinality: one
      as: text
    kind:
      description: >
        The failure class: malformed, audience-mismatch, revoked,
        unavailable, refused, or claim-failed.
      the: xyz.tonk.join/kind
      cardinality: one
      as: text

# The /join view — a directory view for `tonk:join/status`, mounted by a
# no-entity `<tonk-display model=tonk:join/status>` (see the Leptos /join
# route). Directory chrome renders even with zero instances, so the
# `<page-mount>` trigger mounts and fires `tonk:join` on load before any
# status exists. The per-instance repeat shows the shared pulse while pending and
# the failure callout (`model=tonk:join/failure`) once a join fails. On
# success there is no status to show: the worker posts a navigate message
# to the originating client (see the host's navigate provider), which redirects into
# `/space/<subject>` while the chrome's "Joining…" stands until the page
# leaves.
view!:
  this: tonk:join/status
  show:
    directory: |
      <div class="join-card-wrap">
        <!-- `data-id={this}` marks the repeat row, so the opening and
             failure surfaces are per-status. -->
        <div class="join-status" data-id={this}>
          <div class="join-opening" aria-live="polite">
            <span class="join-opening-status">opening this space</span>
            <span class="tonk-pulse" aria-hidden="true"></span>
          </div>
          <tonk-display entity={this} model=tonk:join/failure>
            <span slot="no-entity"></span>
            <span slot="no-model"></span>
            <span slot="loading"></span>
          </tonk-display>
        </div>
      </div>

# The failure view — the default view for `tonk:join/failure`, so the join
# directory's per-instance `<tonk-display model=tonk:join/failure>` renders
# it only when a failure exists (i.e. status: failed). Shows the reason.
view!:
  this: tonk:join/failure
  show:
    ui: |
      <!-- Revoked and deleted intentionally share this one screen. The
           diagnostic reason remains in the console/worker status; rendering it
           here would reveal whether the space still exists. Bind the wall to
           the failure row: static chrome renders even on an empty frame while
           the join is pending or the entity query is still resolving. -->
      <section class="edge-wall edge-wall--closed" data-id={this} role="status" aria-labelledby="edge-closed-title" aria-describedby="edge-closed-guidance">
        <h1 class="edge-statement" id="edge-closed-title">this share link expired</h1>
        <div class="edge-narrator" id="edge-closed-guidance">ask the person who shared this space to send you a new link</div>
        <div class="edge-run">
          <a class="ebtn solid" href="/">go to home</a>
        </div>
      </section>

# ============================================================
# ROUTING (profile branch) — mirrors core.yaml, scoped to the profile
# ============================================================
#
# The profile is itself a routable target: `<tonk-site path=…>` posts to
# `/api/profile/branch/main/site`, the SW asserts this tab's `tonk:site` on this
# branch (matching the path against the `route!` table below), and the element
# renders `<tonk-display entity=site:… model=tonk:site>`. The site view nests the
# matched `{concept}` on the same site entity — the same indirection a space uses.

# A tab's location + the route concept it renders. Mirrors core.yaml's `&site`.
concept!: &site
  this: tonk:site
  description: A tab's location and the route concept it renders.
  with:
    path:
      description: Currently active path on this site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text
    anchor:
      description: Currently active anchor (URL hash) on this site.
      the: xyz.tonk.site/anchor
      cardinality: one
      as: text
    space:
      description: The space (repository name) on this site.
      the: xyz.tonk.site/space
      cardinality: one
      as: text
    branch:
      description: The active branch name on this site (defaults to "main").
      the: xyz.tonk.site/branch
      cardinality: one
      as: text
    branch-entity:
      description: >
        The same branch as an entity, so a view can walk from where the
        tab is to what that branch follows: `branch-entity` ->
        `tonk.dialog.branch/upstream` -> that branch's replica ->
        its subject. The name beside it is a location token; this is
        the graph node.
      the: xyz.tonk.site/branch-entity
      cardinality: one
      as: entity
    profile-branch:
      description: >
        The branch the profile is on, whichever repository this tab is
        on: what reaches the profile as `{profile-branch}@profile:tonk`.
      the: xyz.tonk.site/profile-branch
      cardinality: one
      as: text
    replica:
      description: Currently active replica on this site.
      the: xyz.tonk.site/replica
      cardinality: one
      as: entity
    route:
      description: Matched route of this site.
      the: xyz.tonk.site/route
      cardinality: one
      as: entity
    concept:
      description: Matched route's concept (the model the shell mounts).
      the: xyz.tonk.site/concept
      cardinality: one
      as: entity

# The site view: render the matched route concept on this same site entity.
view!:
  this: tonk:site
  show:
    ui: |
      <tonk-display entity={this} model={concept} />

# The route table concept. Mirrors core.yaml's `&route`.
concept!: &route
  this: tonk:route
  description: A route — maps a path pattern to the model the SW mounts.
  with:
    path:
      description: The axum/matchit path pattern.
      the: xyz.tonk.route/path
      cardinality: one
      as: text
    concept:
      description: The route model to render when this path matches.
      the: xyz.tonk.route/concept
      cardinality: one
      as: entity

# What a seed version seeded, one attribute per component kind, on the
# seed version's own entity. The kinds are split rather than folded into
# one `component` because retraction differs by kind (a view retracts from
# a pin, a concept must already be on the branch, a rule wants its effect
# URI) and the order matters — a concept retracted before the views naming
# it would dangle. `route` doubles as the router's precedence signal: a
# route named here came from the seed, and one that is not came from the
# space, which wins an equal-specificity tie.
concept!: &seed/installed
  this: tonk:seed/installed
  description: The seed a space is running — what an upgrade withdraws.
  with:
    prior:
      description: >
        The seed this one replaced, or `seed:none` on a first install —
        present on every seed rather than absent on the first, so the
        chain reads uniformly.
      the: xyz.tonk.seed/prior
      cardinality: one
      as: entity
    version:
      description: >
        The version of the commit that installed this seed. A version,
        not a revision: a revision includes the tree its commit produces,
        so a fact inside a commit can never name it, while a version is
        knowable before the batch is written — which is what lets this
        record ride the same commit as the claims it describes.

        This is the whole upgrade mechanism: nothing tags individual
        definitions, so an upgrade reads THIS commit's history, inverts
        its assertions into retractions, and applies them alongside the
        new library in one atomic commit.
      the: xyz.tonk.seed/version
      cardinality: one
      as: text

# The profile's only route for now: `/` renders the Hub.
route!: &route/home
  this: id:tonk:route/home
  path: "/"
  concept: tonk:hub

# The account's page: the same hub view with the account section
# showing its choices — settings, the other accounts on this browser,
# adding one — or, with no account here, signing up.
route!: &route/account
  this: id:tonk:route/account
  path: "/account"
  concept: tonk:hub

# ============================================================
# PROFILE SWITCHER — the accounts this browser holds
# ============================================================

# One row of the account switcher.
#
# One row per branch of the profile: the account it follows, named off
# that branch, and where the account is served from. OVERLAY facts the
# worker republishes each time it reads the roster. They have to be:
# they describe OTHER branches, which a sealed guest cannot reach. The
# worker can read every branch, so it stamps what it finds where the
# guest is looking.
#
# Overlay rather than a durable mirror is what keeps them honest. A
# committed copy would be a second home for a name owned elsewhere, free
# to disagree after a rename on another device, with nothing to
# invalidate it. These are rebuilt from source on every roster read.
concept!: &profile/row
  this: tonk:profile/row
  description: A branch of this profile to switch to.
  with:
    name:
      description: The branch's name — what a switch activates.
      the: xyz.tonk.roster/name
      cardinality: one
      as: text
    label:
      description: The account name to show, as of this read.
      the: xyz.tonk.roster/label
      cardinality: one
      as: text
    provider:
      description: The access service the account is attached to. Empty for a local workspace.
      the: xyz.tonk.roster/provider
      cardinality: one
      as: text
    active:
      description: Whether this is the profile the browser is using now.
      the: xyz.tonk.roster/active
      cardinality: one
      as: boolean

# Switching reads the row's own handle off the clicked button, so a
# command can only ever name a profile this device already has.
event!: &on/switch-profile
  type: "click"
  prevent-default: true
  where:
    handle: ".currentTarget.dataset.handle"
    time: ".timeStamp"

# Adding an account rotates onto a fresh profile and opens the regular
# signup ceremony on it. The rotation is worker work; the ceremony is a
# top-page passkey dialog the worker asks the page to raise.
event!: &on/add-profile
  type: "click"
  prevent-default: true
  where:
    time: ".timeStamp"

command!: &profile/add
  this: tonk:add-profile
  description: Rotate onto a fresh profile and open the account ceremony.
  with:
    time:
      description: The click's timestamp, so a retry after a cancelled ceremony re-fires.
      the: xyz.tonk.command.add-profile/time
      as: float

command!: &profile/switch
  this: tonk:switch-profile
  description: Make another branch of this profile the active one.
  with:
    handle:
      description: The name of the branch to switch to.
      the: xyz.tonk.command.switch-profile/handle
      as: text
    time:
      description: The click's timestamp, so switching back re-fires.
      the: xyz.tonk.command.switch-profile/time
      as: float

# The settings page's acts. Each is a command the page fires with a
# click; the worker does the work and reports where it got to as a
# `state:ceremony` row the page reads back. Nothing here answers the
# click with a response body.
event!: &on/sign-out
  type: "click"
  prevent-default: true
  where:
    time: ".timeStamp"

command!: &profile/sign-out
  this: tonk:sign-out
  description: Sign this device out of the account on the active branch.
  with:
    time:
      description: The click's timestamp, so signing out again re-fires.
      the: xyz.tonk.command.sign-out/time
      as: float

# The account entity is read off the control rather than typed here,
# because a command field is a fact the click asserts, not a constant.
event!: &on/add-passkey
  type: "click"
  prevent-default: true
  where:
    account: ".currentTarget.dataset.account"

command!: &account/add-passkey
  this: tonk:add-passkey
  description: Seal the account under another passkey, proving with the current one.
  with:
    account:
      description: The account, read off the control.
      the: xyz.tonk.command.add-passkey/account
      as: entity

# The address rides on the control that armed the deletion, stamped
# there by the registration view: the command carries the verified
# email so the worker can bind it into the purge it signs.
event!: &on/delete-account
  type: "click"
  prevent-default: true
  where:
    email: ".currentTarget.dataset.email"

command!: &account/delete
  this: tonk:delete-account
  description: Delete this account from every service and this device.
  with:
    email:
      description: The verified address the deletion is for.
      the: xyz.tonk.delete-account/email
      as: text

# A terminal's request rides the location (`/settings/link?audience=…`);
# the element copies it onto the approve control so the click can
# assert it. `expected-account` is blank when the terminal named none,
# and a blank field is omitted rather than asserted.
event!: &on/authorize-device
  type: "click"
  prevent-default: true
  where:
    audience: ".currentTarget.dataset.audience"
    callback: ".currentTarget.dataset.callback"
    name: ".currentTarget.dataset.name"
    expected-account: ".currentTarget.dataset.expectedAccount"

command!: &device/authorize
  this: tonk:authorize-device
  description: Delegate the account to a waiting terminal.
  with:
    audience:
      description: The terminal's DID.
      the: xyz.tonk.authorize-device/audience
      as: entity
    callback:
      description: >
        Where the terminal listens, base58 over the URL: a bare URL
        carries a `:` and would decode as an entity.
      the: xyz.tonk.authorize-device/callback
      as: text
    name:
      description: What the terminal calls itself.
      the: xyz.tonk.authorize-device/name
      as: text
    expected-account:
      description: The account the terminal expects, when it named one.
      the: xyz.tonk.authorize-device/expected-account
      as: entity

# The switcher list. Renders every profile but the active one: the active
# account is already named in the bar above, and offering to switch to
# where you are is a no-op the worker would reject anyway.
view!:
  this: tonk:profile/row
  show:
    directory: |
      <div class="account-menu__profiles" aria-label="other accounts on this browser">
        <button class="account-menu__row" type="button" data-id={this} data-profile={name}
          data-handle={name} html:data-active={active} on:switch-profile=tonk:switch-profile>
          <span class="account-menu__name">{label}</span>
        </button>
      </div>

# The signup ceremony's progress, as the worker reports it.
#
# The hub used to hold "a signup is up" on the document body, because the
# route view re-renders whenever profile facts land — the passkey itself
# lands one — and that replaced the element mid-ceremony. An overlay row
# survives re-renders by not living in the DOM at all.
concept!: &ceremony/status
  this: state:ceremony
  description: Where a passkey-gated ceremony got to.
  with:
    ceremony:
      description: Which ceremony this row describes.
      the: xyz.tonk.ceremony/ceremony
      cardinality: one
      as: text
    state:
      description: Where it got to — pending-ceremony, working, done, failed, refused.
      the: xyz.tonk.ceremony/state
      cardinality: one
      as: text
    detail:
      description: What refused or failed it, empty otherwise.
      the: xyz.tonk.ceremony/detail
      cardinality: one
      as: text

# ============================================================
# ELEMENTS — custom elements this branch defines
# ============================================================

# The same concept `core.yaml` declares, repeated here for the same
# reason `profile/rename` is: the hub and FAB are sealed to the profile
# meta branch, and a guest resolves a definition by querying THIS
# branch. A concept that lives only in core.yaml is unreachable from
# here, however correct it is there.
#
# Kept verbatim rather than trimmed. The two copies describe one shape,
# and a copy that has been edited down is one that has started to
# disagree.
concept!: &element
  description: A custom element definition carried as branch data
  with:
    description:
      description: |
        What this element is for, in the author's own words — the same
        thing a concept's `description` carries, and required for the
        same reason: an element is read by people and by agents that
        have only the branch to go on, and a tag name alone does not
        say what `<tally-widget>` is meant to do.

        It is an ordinary field, but it does reach the entity digest
        along with the methods, so two elements that differ only in
        their description are two different values. That is the right
        reading: the description is part of what the definition says.
      the: xyz.tonk.element/description
      cardinality: one
      as: text
    method:
      description: |
        The element's methods, keyed by name, each a JS arrow-function
        expression taking the element as its first argument.

        Four keys are dispatched by the DOM lifecycle: `connected`,
        `disconnected`, `adopted` — all `(self) => …` — and
        `attribute-changed`, `(self, name, before, after) => …`.

        Two more cover a definition being REPLACED while instances are
        live, which the DOM has no notion of. `released`, `(self) =>
        …`, runs on the OUTGOING definition before the swap: undo what
        `connected` set up, and stash anything worth keeping on the
        element. `swapped`, `(self) => …`, runs on the incoming one and
        takes over the live instance; without it the runtime re-runs
        `connected`, which is right only when nothing needed undoing.

        The reserved `define` key is the escape hatch for what a method
        table cannot express (`static formAssociated`, extending a
        built-in): `() => class extends HTMLElement { … }`, whose
        returned class the runtime registers INSTEAD of the generated
        wrapper, ignoring every other key. Any other key becomes a
        method on the element, callable as `el.<name>()`; a key that
        would shadow a member of `HTMLElement.prototype` is refused.

        That is also how one method calls another — `self.total()`
        inside `connected`. The call resolves through the live table
        rather than through the definition it was written in, so
        re-authoring `total` alone changes what an untouched
        `connected` computes.

        There is no `observedAttributes` to declare.
        `attribute-changed` is driven by a `MutationObserver` over
        every attribute; `attributeChangedCallback`'s list is read once
        when the tag is registered and so could never grow with an
        edited method.
      the: xyz.tonk.element.method
      as: {[symbol]: text}
      cardinality: one
    getter:
      description: |
        Property reads, keyed by property name, each `(self) => …`.

        `value: (self) => …` makes `el.value` read through the branch's
        current definition the way `el.total()` calls through it, so a
        re-authored getter changes what a page already reading the
        property sees. A method could not do this job: `el.value` and
        `el.value()` are different things, and a consumer written
        against the DOM expects the first.

        Its own dictionary rather than a prefix inside `method`,
        because a getter, a setter and a method have three different
        signatures and a key like `get.value` could not be told apart
        from a method genuinely called that. The cost is one more live
        query per watched tag.

        A key that would shadow a member every element already has is
        refused, the same as a method key.
      the: xyz.tonk.element.getter
      as: {[symbol]: text}
      cardinality: one
    setter:
      description: |
        Property writes, keyed by property name, each
        `(self, next) => …`.

        Paired with `getter` by name: declaring both makes the property
        read-write, `getter` alone makes it read-only, and `setter`
        alone makes it write-only — which is a real shape (a sink that
        takes a value and renders it) rather than a mistake, so it is
        allowed.
      the: xyz.tonk.element.setter
      as: {[symbol]: text}
      cardinality: one
    attribute:
      description: |
        Default values for the element's attributes, keyed by
        attribute name. An instance missing one has it written on
        before `connected` runs, so every hook, every CSS rule and
        every `getAttribute` reads the same value whether the view
        supplied it or not.

        This is NOT `observedAttributes`, and it narrows nothing.
        `attribute-changed` fires for every attribute whether or not
        it appears here, because the runtime watches them with a
        `MutationObserver` rather than declaring a list up front.
        Narrowing to a declared list would only restore the footgun
        that observer exists to avoid: an attribute left out of the
        list goes silently unnoticed. So an attribute needs no entry
        here to work — it needs one to have a DEFAULT, which is the
        only thing this map supplies.

        An attribute whose default is empty is written `size: ""` —
        present and empty, like `<input disabled="">`.

        Most elements declare none, and the map is then simply absent.
        That is what a keyed collection means: zero-or-more, so an
        `element!:` body omitting it is complete, not partial.

        What all four dictionaries here cost, stated once: a GENERIC
        concept query binds every field the concept declares, and a
        keyed collection with no entries binds nothing — so `tonk query
        element` answers only for an element that declares ALL FOUR,
        which almost none do. `tonk element` reads the domains directly
        and lists them all, which is why it exists, and the browser
        registry runs one query per dictionary for the same reason.
        Fixing it properly means teaching the query layer to widen an
        empty collection, which is a dialog-query change rather than a
        schema one.
      the: xyz.tonk.element.attribute
      as: {[symbol]: text}
      cardinality: one

# A passkey registered for this account.
#
# Directory-shaped: one row per passkey, so the settings page lists them
# by iterating rather than by an element reading an array out of a fetch.
concept!: &account/passkey
  this: tonk:account/passkey
  description: A passkey that can recover this account.
  with:
    created-on:
      description: The device or browser the passkey was made on.
      the: xyz.tonk.recovery/created-on
      cardinality: one
      as: text
    created-at:
      description: When it was made, unix seconds.
      the: xyz.tonk.recovery/created-at
      cardinality: one
      as: unsigned-integer

# The settings page's account pane.
#
# Every value here is a fact the worker already publishes: the name and
# address off `tonk:account/registered`, the passkeys as their own rows.
# The acts are commands. What is left for an element is the passkey
# ceremony, which needs a live `navigator.credentials` call.
view!:
  this: tonk:account/registered
  show:
    settings: |
      <div data-account-registered>
        <div class="srowd">
          <span>display name</span>
          <!-- The name is a different concept from the registration:
               `tonk:account/name` is the account's own display name and
               `tonk:account/registered` is where it enrolled. Nesting a
               display rather than interpolating is what keeps each field
               on the concept that declares it. -->
          <span class="sname-seat">
            <tonk-display model="tonk:account/name" view="editable"></tonk-display>
          </span>
        </div>
        <div class="srowd"><span>account email</span><b data-settings-email>{email}</b></div>
        <div class="sect">passkeys</div>
        <tonk-display model="tonk:account/passkey"></tonk-display>
        <p class="expl">
          Your passkey replaces a password and may be saved to a device, browser
          profile, or password manager.
        </p>
        <!-- The deletion dialog lives on the registration because the
             command carries the verified address, stamped on the submit
             control here. What it deletes is listed from `space/owned`;
             the element counts those rows into the sentence and arms
             the submit once the phrase is typed. -->
        <tonk-dialog data-delete-account-dialog heading="confirm account deletion">
          <div class="confirm-body">
            <span data-delete-scope>loading what this deletes&hellip;</span>
            <span data-delete-owned hidden><tonk-display model="tonk:space/owned" view="deletion"></tonk-display></span>
            <span data-delete-question>are you sure you want to delete all data associated with this account?</span>
            <span data-delete-consequence>this action is permanent. there is no option to recover your data.</span>
            <span data-delete-passkey>your passkey will be asked for.</span>
            <div class="armrow">
              <label for="delete-confirmation">type <b data-delete-confirm-label>delete account</b> to confirm:</label>
              <input class="armfield" id="delete-confirmation" data-delete-confirm type="text"
                autocomplete="off" autocapitalize="off" spellcheck="false"
                aria-label="deletion confirmation" />
            </div>
          </div>
          <button class="m-cancel" slot="actions" type="button" data-dialog="close">cancel</button>
          <button class="m-go" slot="actions" type="button" data-delete-account-submit data-email={email}
            on:delete-account=tonk:delete-account disabled><span data-delete-submit-label>delete account</span></button>
        </tonk-dialog>
      </div>

# The name, editable in place: a text input whose `change` (Enter or
# blur) is the rename command. Its own view because it is its own
# concept, and because the FAB edits the same fact the same way.

# The name as the hub bar shows it: the text and nothing else, so the
# cell reads as the member's name. Without this facet the display fell
# back to its default notation (`name: "Jack"`), which is a diagnostic,
# not a label.
view!:
  this: tonk:account/name
  show:
    directory: |
      <span data-account-name data-of={this}>{name}</span>

view!:
  this: tonk:account/name
  show:
    editable: |
      <input class="sname" type="text" data-settings-name value={name} aria-label="display name"
        autocomplete="off" on:profile-rename=profile/rename>

view!:
  this: tonk:account/passkey
  show:
    directory: |
      <div class="srowd" data-id={this}>
        <b class="lft" data-settings-passkey-device>{created-on}</b>
        <b data-settings-passkey-created>{created-at}</b>
      </div>

# The hub bar's tab and ceremony behaviour, as branch data.
#
# What is left in the bar once its contents are views: which tab is
# showing, whether a signup ceremony is up, and where that ceremony
# should sit. All three are DOM state with no fact behind them, or —
# in the ceremony's case — a measurement only this element can take.
#
# The ceremony cannot measure the bar itself. The hub is a sealed guest
# at an opaque origin, so the top page that draws the dialog cannot
# reach in; the bar measures and reports, and `reseat` repeats that
# whenever the bar moves.
#
# `tab` is an attribute rather than internal state so CSS selects on it
# (`[tab=account] .stack { display: none }`) instead of a script
# toggling `hidden` on every switch.
element!: &hub-bar
  description: The hub's bar — two links, the account's page and home; the cell for where the page is reads as current.
  attribute:
    path: "/"
  method:
    # Where the page is, read off the host's context and mirrored onto
    # `path`: the chrome's style keys the visible section on it, and the
    # cell for that section reads as current. The guest's own location
    # is about:srcdoc and says nothing.
    route: |
      (self) => {
        const path = window.tonk?.context?.path;
        if (typeof path !== 'string' || !path) return;
        if (self.getAttribute('path') !== path) self.setAttribute('path', path);
        const account = path === '/account' || path === '/settings' || path.startsWith('/settings/');
        for (const [selector, current] of [['[data-account-trigger]', account], ['[data-return-spaces]', !account]]) {
          const cell = self.querySelector(selector);
          if (!cell) continue;
          if (current) cell.setAttribute('aria-current', 'page');
          else cell.removeAttribute('aria-current');
        }
      }
    connected: |
      (self) => {
        self.route();
        const moved = () => self.route();
        window.addEventListener('tonk:context', moved);
        self._moved = moved;
      }
    disconnected: |
      (self) => {
        if (self._moved) window.removeEventListener('tonk:context', self._moved);
      }
    released: |
      (self) => self.disconnected()

# The hub's account bar and menu.
#
# The account name comes from `tonk:account/name`, the switcher list from
# `tonk:profile/row`, and whether a signup is up from the ceremony row —
# all of them facts, so a re-render rebuilds the bar instead of losing it.
# The Hub route model + its view: the space directory over this (profile) branch.
# `tonk:hub` is the concept the `/` route resolves to; its view renders the
# `space` directory view, the same picker the legacy `<tonk-hub>` element mounted.
concept!: &hub
  this: tonk:hub
  description: The Tonk Hub — a picker over the profile's spaces.
  with:
    # Picked off the site entity. The hub view renders the `space`
    # directory and doesn't read it, but a `concept!` must declare at
    # least one field, and `path` is the natural one a route model carries.
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text

view!:
  this: tonk:hub
  show:
    ui: |
      <div class="hub-page">
        <link rel="stylesheet" with:src="ui@space">
        <!-- The hub chrome's CSS is the `space` view's own `style: ui`,
             which also says which of the two sections below shows. -->
        <tab-title text="Tonk"></tab-title>
        <div class="hub-logo" role="img" aria-label="tonk"><svg viewBox="0 0 1024 343" width="132" height="44" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M337.41 169.57C337.41 136.215 363.983 109.171 396.764 109.171C429.539 109.171 456.112 136.215 456.112 169.57C456.112 202.932 429.539 229.975 396.764 229.975C363.983 229.975 337.41 202.932 337.41 169.57ZM643.51 54C614.396 54 589.91 61.6682 572.703 77.2353C563.913 85.1861 557.227 94.8795 552.759 105.986C552.206 97.3086 549.67 85.1977 540.937 75.1754C530.712 63.4453 515.039 55.8233 494.461 56.2041C488.76 56.3253 484.229 61.045 484.345 66.7514C484.46 72.3886 489.06 76.8833 494.668 76.8833C494.737 76.8833 494.812 76.8833 494.881 76.8833C509.044 76.6006 519.252 81.8339 525.282 88.6654C534.084 98.6415 532.072 113.834 532.02 114.197C531.167 119.817 535.012 125.079 540.626 125.962C541.168 126.048 545.537 126.602 547.612 124.565C546.673 130.203 546.171 136.076 546.171 142.192C546.171 183.349 531.225 224.038 507.39 247.764C488.403 266.66 465.219 275.805 434.911 279.382C479.549 263.671 511.569 221.038 511.569 170.874C511.569 107.365 460.262 55.8868 396.966 55.8868C333.675 55.8868 282.368 107.365 282.368 170.874C282.368 234.383 333.675 285.868 396.966 285.868C399.121 285.868 401.254 285.793 403.375 285.677C451.126 285.1 484.569 276.722 510.508 250.902C535.196 226.328 550.592 184.555 550.592 142.192C550.592 90.1771 586.197 57.8658 643.51 57.8658C737.703 57.8658 741.576 107.169 741.657 113.96C731.477 116.378 708.795 127.093 708.795 147.247V284.702H742.314C745.744 284.702 746.107 282.556 746.107 281.333V114.209C746.107 107.983 743.208 54 643.51 54Z" fill="currentColor"/><path d="M144.171 58.5683L129.662 58.5856C106.081 58.6318 91.4574 69.3695 83.3356 77.9031C72.9486 88.8081 67 103.873 67 119.221C67 148.151 86.5636 179.285 133.299 179.285V155.658C100.513 155.658 90.6043 136.029 90.6043 119.221C90.6043 104.029 99.7116 81.7516 130.135 81.7516L144.171 81.7458V261.448C131.691 261.448 124.786 248.968 124.786 238.08L104.974 