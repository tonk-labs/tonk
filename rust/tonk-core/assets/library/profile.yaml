# Tonk profile library — the minimal standard library seeded onto the
# profile repository's meta branch.
#
# The profile branch only backs the Tonk Hub at `/`: a picker over the
# spaces this profile can open. It does NOT render workspaces, boards,
# sheets, inspectors, or any artifact view — those live on each space's
# own content branch and are seeded from the full `core.yaml`. Seeding
# the whole standard library here cost ~2s of DB writes on every first
# load for 60+ expressions the profile never uses; this lean document
# carries only the two definitions the Hub needs.
#
# Lowering runs `analyze_local` (no running system), so every
# `&anchor` / bare-name reference must resolve within this file. Both
# definitions below are self-contained: the directory view's
# `model: space` resolves to the `&space` anchor here.

# A space (replica) the profile has access to. These records live on
# the profile repository's meta branch — one per repository this device
# has joined or created. The Hub queries them through a
# `<tonk-repository profile>` so the user can pick which space to open.
concept!: &space
  this: tonk:space
  description: A repository this profile can open.
  with:
    subject:
      description: >
        The repository's subject DID (its stable identity). The Hub card
        links to `/space/{subject}`; the route reads the routing key as
        the suffix after the last `:`.
      the: xyz.tonk.replica/subject
      cardinality: one
      as: entity
    kind:
      description: >
        tonk:repository for a real space, tonk:profile for the
        profile's own self-replica. The Hub view hides the latter
        in CSS via [data-kind].
      the: xyz.tonk.replica/kind
      cardinality: one
      as: entity
    status:
      description: >
        tonk:blank while the space's content branch is still
        seeding, tonk:initialized once seeded. The Hub card
        reflects it via [data-status] (an installing animation).
      the: xyz.tonk.replica/status
      cardinality: one
      as: entity

# The Add Space command. Submitting the Hub's form asserts this
# transient command; the worker's `create_space` handler decodes it and
# does the work (record the replica, create + seed the repository, flip
# the status). `name` reads from the form on submit:
# `event.currentTarget.elements.name.value` — the `<wa-input name="name">`
# inside `<form onsubmit=space/create>`. `prevent-default` stops the page
# from reloading: `method="dialog"` does NOT work here because the form is
# slotted into `<wa-dialog>` and the native `<dialog>` lives across the
# shadow boundary, so the form has no native-dialog ancestor in its own
# tree and the browser falls back to a GET submit. The command is
# transient: it fires the handler once and is swept before the durable
# commit.
command!: &space/create
  description: A request to create a new space by the name typed into the form.
  with:
    name:
      description: The space name, read from the form's `name` input on submit
      the: dom.event.current-target.elements.name/value
      as: text
    remote:
      description: >
        Optional sync URL, read from the form's `remote` input. The
        worker's `CreateSpaceHandler` matches on `name` alone (so this
        command keeps decoding against an older profile descriptor that
        lacks this field), and reads `remote` opportunistically: blank
        creates a local-only space, a URL is attached after creation as
        the `origin` remote with `main` tracking `origin/main`. The
        `<tonk-default-remote>` button fills it with this server. Single
        word `remote` (not `remote-url`) because read-path segments are
        kebab→camel-cased.
      the: dom.event.current-target.elements.remote/value
      as: text
    prevent-default:
      description: Stop the form submission from reloading the page
      the: dom.event.do/prevent-default

# The `view/directory` concept — the shape `<tonk-display>` queries to
# find a directory view (a `model` + a `display` template under
# `xyz.tonk.view/directory`). The `view/directory!:` instance below is
# an instance of it, so its concept must be present on this branch too.
concept!: &view/directory
  this: tonk:view/directory
  description: A directory view used by tonk-display when entity is not set.
  with:
    model:
      description: Concept this view renders
      the: xyz.tonk.view/model
      cardinality: one
      as: entity
    display:
      description: HTML template for the view
      the: xyz.tonk.view/directory
      cardinality: one
      as: text

# The Hub directory view: the picker shown at `/`. One card per space,
# linking to its `/space/{subject}` page. A space is identified by its
# subject did:key; the route reads the routing key as the suffix after
# the last `:`, so `{subject}` (a full did:key) resolves to that key.
# The card's name is NOT read from this profile-side record — it is read
# from the listed space's OWN repository: a nested `<tonk-repository
# name={subject}>` opens that space's routing context and a
# `<tonk-display model=tonk:repository view=tonk:view/label>` inside it
# shows the repo's current name (the cross-device source of truth).
# Rendered as a directory (no entity) over the `space` model on the
# profile meta branch.
view/directory!:
  this: id:tonk:space/directory
  model: space
  display: |
    <div class="hub">
      <header class="hub-header">
        <h1 class="hub-title">Spaces</h1>
        <wa-button class="hub-new" variant="neutral" data-dialog="open space-create">New space</wa-button>
      </header>
      <wa-dialog id="space-create" label="New space" class="hub-dialog">
        <form id="space-create-form" class="hub-form" onsubmit=space/create>
          <wa-input name="name" label="Space name" placeholder="e.g. pictures" autocomplete="off" autofocus required></wa-input>
          <wa-input name="remote" label="Sync server (optional)" placeholder="leave blank for a local-only space"></wa-input>
          <tonk-default-remote field="remote">Use this server</tonk-default-remote>
        </form>
        <wa-button slot="footer" variant="neutral" appearance="plain" data-dialog="close">Cancel</wa-button>
        <wa-button slot="footer" variant="primary" type="submit" form="space-create-form" data-dialog="close">Create</wa-button>
      </wa-dialog>
      <a class="hub-card" href="/space/{subject}" data-kind={kind} data-status={status} with={this}>
        <span class="hub-card__sigil"><tonk-sigil>{subject}</tonk-sigil></span>
        <span class="hub-card__body">
          <span class="hub-card__name"><tonk-host><tonk-repository name={subject}><tonk-branch name="main"><tonk-display entity={subject} model=tonk:repository view=tonk:view/label><span slot="no-entity" class="hub-card__untitled" hidden>Untitled</span><span slot="no-model" class="hub-card__untitled" hidden>Untitled</span><span slot="no-view" class="hub-card__untitled" hidden>Untitled</span><span slot="loading" class="hub-card__untitled" hidden>Untitled</span></tonk-display></tonk-branch></tonk-repository></tonk-host></span>
          <span class="hub-card__url">/space/{subject}</span>
          <span class="hub-card__status"></span>
        </span>
        <span class="hub-card__sync"><tonk-host><tonk-repository name={subject}><tonk-branch name="main"><tonk-sync-badge></tonk-sync-badge></tonk-branch></tonk-repository></tonk-host></span>
      </a>
    </div>

# ============================================================
# JOIN — redeem an invite at /join (runs on the profile meta branch)
# ============================================================

# Redeem an invite URL. Fired by `<tonk-page onmount=tonk:join>` on the
# /join view: the element reads the page location (the service worker can't
# see the `#fragment`, where an open invite's seed rides) and delivers it in
# the mount event's `detail` (a flat, URL-shaped record). The worker's
# `JoinHandler` reassembles the URL from `search` + `hash`, claims the
# invite, and drives the overlay-only `tonk:join/status` (pending → failed,
# or retract + durable replica on success). Lives here, not in core.yaml:
# the join happens on the PROFILE meta branch (it records a replica), so
# the command + view must resolve there.
command!: &tonk/join
  this: tonk:join
  description: Redeem an invite URL and join its space.
  with:
    search:
      description: The full query string with its leading question mark, from detail.search.
      the: dom.event.detail/search
      as: text
    hash:
      description: The URL hash fragment carrying the seed, from detail.hash, page-only.
      the: dom.event.detail/hash
      as: text

# The in-flight join, overlay-only, at the fixed `tonk:join/status` entity.
# Just `status` (`tonk:pending` while claiming, `tonk:failed` on error) so it
# resolves the moment a join starts — a concept also requiring reason/kind
# would only resolve once those exist (never in pending). On success the
# handler retracts this and asserts the durable replica instead; the Hub
# (durable replicas) never shows in-flight or failed joins.
concept!: &join/status
  this: tonk:join/status
  description: An in-flight join attempt's state (overlay-only).
  with:
    status:
      description: The attempt state, either pending or failed.
      the: xyz.tonk.join/status
      cardinality: one
      as: entity

# The failure detail for a join, at the same `tonk:join/status` entity —
# asserted alongside `status: tonk:failed`. A separate concept so the
# pending state (status only) still resolves; the view reads this for the
# message when failed.
concept!: &join/failure
  this: tonk:join/failure
  description: Why a join attempt failed (overlay-only).
  with:
    reason:
      description: Human-readable failure message.
      the: xyz.tonk.join/reason
      cardinality: one
      as: text
    kind:
      description: The failure class, one of malformed, audience-mismatch, or claim-failed.
      the: xyz.tonk.join/kind
      cardinality: one
      as: text

# The `view` concept — the shape `<tonk-display>` queries to resolve a
# default (entity-set) view: a `model` + a `display` template. The
# join-failure `view!:` instance below is an instance of it, so its concept
# must be present on this branch. (The Hub above gets by with only
# `view/directory`; the join failure needs an entity-set view, hence this.)
concept!: &view
  this: tonk:view
  description: A display template for rendering an entity.
  with:
    model:
      description: Concept this view renders
      the: xyz.tonk.view/model
      cardinality: one
      as: entity
    display:
      description: HTML template for the view
      the: xyz.tonk.view/display
      cardinality: one
      as: text

# This device's live sync state, keyed on the well-known singleton entity
# `state:here` (one space is in scope per page). The worker stamps `status`
# into this branch's OVERLAY (transient observation) on each status check;
# the sync chip subscribes to it instead of polling a status route. Lives on
# the profile meta branch (like the join overlay), so the chip reads it
# under a `<tonk-repository profile>` context.
concept!: &sync
  this: tonk:sync
  description: This device's sync state for the space in scope.
  with:
    status:
      description: |
          Live observation — sync:idle | sync:push | sync:pull | sync:offline.
      the: xyz.tonk.sync/status
      cardinality: one
      as: entity

# The sync chip — the default view for `model: tonk:sync`. A pill whose dot
# colour + label come from `status` via CSS, so the template needs no
# per-state branches. Pure presentation; the worker owns the state.
view!: &sync/chip
  this: id:tonk:sync/chip
  model: tonk:sync
  display: |
    <span class="workspace__sync" data-sync-status={status}>
      <style>
        .workspace__sync {
          display: inline-flex;
          align-items: center;
          gap: var(--wa-space-xs);
          padding: var(--wa-space-3xs) var(--wa-space-s);
          border-radius: var(--wa-border-radius-pill, 999px);
          font-size: var(--wa-font-size-s);
          color: var(--wa-color-text-quiet);
          background: var(--wa-color-neutral-fill-quiet);
        }
        .workspace__sync::before {
          content: "";
          inline-size: 7px;
          block-size: 7px;
          border-radius: 50%;
          background: var(--wa-color-text-quiet);
        }
        .workspace__sync::after { content: "offline"; }
        .workspace__sync[data-sync-status="sync:idle"]::before {
          background: var(--wa-color-success-fill-loud, #22c55e);
        }
        .workspace__sync[data-sync-status="sync:idle"]::after { content: "synced"; }
        .workspace__sync[data-sync-status="sync:push"]::before,
        .workspace__sync[data-sync-status="sync:pull"]::before {
          background: var(--wa-color-brand-fill-loud, #a855f7);
        }
        .workspace__sync[data-sync-status="sync:push"]::after,
        .workspace__sync[data-sync-status="sync:pull"]::after { content: "syncing…"; }
      </style>
    </span>

# The /join view — a directory view for `tonk:join/status`, mounted by a
# no-entity `<tonk-display model=tonk:join/status>` (see the Leptos /join
# route). Directory chrome renders even with zero instances, so the
# `<tonk-page>` trigger mounts and fires `tonk:join` on load before any
# status exists. The per-instance repeat shows a spinner while pending and
# the failure callout (`model=tonk:join/failure`) once a join fails. On
# success there is no status to show: the worker posts a navigate message
# to the originating client (see `<tonk-host>`), which redirects into
# `/space/<subject>` while the chrome's "Joining…" stands until the page
# leaves.
view/directory!:
  this: id:tonk:join/status/view
  model: tonk:join/status
  display: |
    <main class="join-view">
      <tonk-page onmount=tonk:join></tonk-page>
      <wa-card class="join-card">
        <div slot="header"><h1>Joining…</h1></div>
        <wa-spinner></wa-spinner>
        <div class="join-status" with={this}>
          <tonk-display entity={this} model=tonk:join/failure></tonk-display>
        </div>
      </wa-card>
    </main>

# The failure view — the default view for `tonk:join/failure`, so the join
# directory's per-instance `<tonk-display model=tonk:join/failure>` renders
# it only when a failure exists (i.e. status: failed). Shows the reason.
view!: &join/failure-view
  this: id:tonk:join/failure/view
  model: tonk:join/failure
  display: |
    <wa-callout variant="danger" class="join-error">
      <wa-icon slot="icon" name="circle-exclamation"></wa-icon>
      <strong>Couldn’t join</strong>
      <p>{reason}</p>
    </wa-callout>
