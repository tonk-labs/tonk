                      add account<span class="g" aria-hidden="true">+</span>
                    </button>
                  </div>
                </div>
                <div class="pane" data-pane="account">
                  <tonk-display model="tonk:account/registered" view="settings"></tonk-display>
                  <div class="srowd">
                    <span>another passkey for this account</span>
                    <button class="cta" type="button" data-add-passkey data-account="tonk:add-passkey"
