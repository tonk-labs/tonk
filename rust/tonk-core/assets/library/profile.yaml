        <main class="hubcol">
          <ui-hub-account></ui-hub-account>

        <div class="stack chrome" data-spaces-view aria-label="spaces">
          <div class="sempty">no spaces yet</div>
          <!-- `data-id={this}` designates the repeat row — the WRAPPER, not the
               link, so the verbs and the confirm cluster travel with the row
               while staying outside it: reaching for remove never navigates.
               Each per-space consumer carries its OWN subject; the routing
               helpers read an element's own attribute and never walk ancestors. -->
          <div class="srow-wrap" data-status={status} data-local={local} data-id={this}>
            <a class="srow blk" href="/space/{subject}"><span class="n">{name}</span></a>
            <!-- Both verbs sit outside the anchor and are laid over it: a
                 <button> inside an <a> is invalid markup the parser reshapes,
                 and a <label for> inside one navigates rather than opening the
                 confirm. Hovering the row reveals them (`.srow-wrap:hover`),
                 so the reveal still follows the row and not just the verbs. -->
            <ui-space-remove>
              <span class="verbs">
                <ui-copy-link url="/space/{subject}" label="copy link"></ui-copy-link>
                <button class="verb-remove" type="button" data-space-remove-open>remove</button>
              </span>
              <tonk-dialog data-space-remove-dialog heading="confirm space removal">
                <form id="remove-{subject}" class="remove-form" onsubmit=space/remove data-remove={subject}>
                  Remove {name} from this device? A synced space can be rejoined with
                  a share link; a local-only space is gone for good. Removing it
                  does not delete other members' copies.
                </form>
                <button class="m-cancel" slot="actions" type="button" data-dialog="close">cancel</button>
                <button class="m-go" slot="actions" type="submit" html:form="remove-{subject}">remove space</button>
              </tonk-dialog>
            </ui-space-remove>
          </div>
          <!-- Creating asks nothing up front: the space starts "Untitled" (the
               worker uniquifies the sentinel) and is renamed in place with the
               bar's block cursor the moment you land in it. No remote is
               carried: the worker resolves where a space syncs from the
               account's own registration, so a space created before anyone
               registers stays local until it is shared. -->
          <form class="snew-form" onsubmit=space/create>
            <input type="hidden" name="name" value="Untitled">
            <button class="snew chrome" type="submit">create a new space<span class="g" aria-hidden="true">&#9656;</span></button>
          </form>
        </div>

        </main>
      </div>

# ============================================================
# FAB — floating action button view (rendered in the FAB portal iframe)
# ============================================================
#
# These declarations live on the profile branch because the FAB portal is
# scoped to it (`with="main@profile:tonk"`). The
# guest renders `tonk:profile/fab` via a `<tonk-display>` mounted
# by the shell's FAB portal content string.
#
# Identity note (V1 — not yet wired): the FAB portal `content` string in
# core.yaml embeds only `data-space`; `data-did` and `data-name` are NOT
# embedded. The `did={dom.host/data-did}` and `{dom.host/data-name}`
# template slots below are placeholders that render empty until a follow-up
# wires the worker to stamp `state:self` identity onto the profile/meta
# branch and the shell to embed those values in the portal content string.

# The member's display name, read directly from THIS (profile meta) branch —
# the durable `ProfileName` override the worker stamps on `profile/rename`
# (attribute `xyz.tonk.profile/display-name`, keyed by the profile DID). The
# FAB is sealed to the profile/meta branch, so unlike the space roster's names
# (which live in each space's own repo and are unreachable from the sealed
# guest) this one is an ordinary in-branch read. Absent until the user renames
# (the worker's `petname` fallback is computed, not persisted), so the bar's
# name slot renders empty until a name is set.
concept!: &profile/name
  this: tonk:profile/name
  description: The member's display-name override on the profile meta branch.
  with:
    name:
      description: The chosen display name (xyz.tonk.profile/display-name).
      the: xyz.tonk.profile/display-name
      cardinality: one
      as: text

# Rename the signed-in member (set their display name). Lives here as well as
# in core.yaml because the FAB is sealed to the profile/meta branch: the
# guest's `<tonk-display>` resolves the command's concept descriptor by a
# phase-1 lookup against THIS branch (seeded from the lean profile.yaml), so
# the command must be present here for the editable's `onchange=profile/rename`
# to fire. The worker's globally-registered `ProfileRenameHandler` does the
# work (persist `ProfileName`, restamp `MemberName` across every space's
# roster, republish self-identity) — this descriptor only has to decode the
# new name and the `tonk:profile` marker that distinguishes it from the repo
# rename, which shares the same `dom.event.current-target` shape.
command!: &profile/rename
  description: Rename the signed-in member (set their display name).
  with:
    name:
      description: The new name, read from the editable's value on commit.
      the: dom.event.current-target/value
      as: text
    marker:
      description: Per-command marker (data-rename) distinguishing this from repo rename.
      the: dom.event.current-target.dataset/rename
      as: entity

# Toggle auto-sync (pause ⇄ resume) for a space. Dispatched by the FAB's
# `<ui-sync-status onpause=…>` cap on alt/option-click. Defined here on the
# PROFILE branch (not on each space's branch) and dispatched on the profile
# context, so the FAB's pause affordance depends on nothing seeded per-space —
# older spaces missing a `fab-pause` view no longer break it. The `space` field
# names WHICH replica to flip; the worker's PauseSyncHandler reads it in place
# of the dispatch origin. `time` makes each click a distinct transient so the
# toggle reliably re-fires; `marker` keeps the shape distinct from `tonk:invite`.
command!: &tonk/pause-sync
  this: tonk:pause-sync
  description: Toggle auto-sync (pause ⇄ resume) for a space.
  with:
    time:
      description: The click's timestamp; makes each dispatch a distinct transient.
      the: dom.event/time-stamp
      as: float
    space:
      description: The target space DID — the replica whose auto-sync is flipped.
      the: xyz.tonk.pause-sync/space
      as: entity
    marker:
      description: Per-command marker keeping the shape distinct from tonk:invite.
      the: dom.event.current-target.dataset/pause-sync
      as: entity

# The FAB fallback seat — the nearest corner restored on the next page load,
# stored on `state:fab`. The live page keeps the exact point along the nearest
# edge; element.rs persists this compatible corner after every pointer-up drop.
concept!: &fab/dock
  this: tonk:fab/dock
  description: Persisted FAB dock (profile-meta claim).
  with:
    dock:
      description: The fallback corner restored on the next page load.
      the: xyz.tonk.fab/dock
      cardinality: one
      as: entity

# ============================================================
# JOIN — redeem an invite at /join (runs on the profile meta branch)
# ============================================================

# Redeem an invite URL. Fired by `<tonk-page onmount=tonk:join>` on the
# /join view: the element reads the page location (the service worker can't
# see the `#fragment`, where an open invite's seed rides) and delivers it in
# the mount event's `detail` (a flat, URL-shaped record). The worker's
# `JoinHandler` reads the complete `href`, claims the
# invite, and drives the overlay-only `tonk:join/status` (pending → failed,
# or retract + durable replica on success). Lives here, not in core.yaml:
# the join happens on the PROFILE meta branch (it records a replica), so
# the command + view must resolve there.
command!: &tonk/join
  this: tonk:join
  description: Redeem an invite URL and join its space.
  with:
    url:
      description: The complete invite URL, including any fragment, from detail.href.
      the: dom.event.detail/href
      as: text

# The in-flight join, overlay-only, at the fixed `tonk:join/status` entity.
# Just `status` (`tonk:pending` while claiming, `tonk:failed` on error) so it
# resolves the moment a join starts — a concept also requiring reason/kind
# would only resolve once those exist (never in pending). On success the
# handler retracts this and asserts the durable replica instead; the Hub
# (durable replicas) never shows in-flight or failed joins.
concept!: &join/status
  this: tonk:join/status
  description: An in-flight join attempt's state (overlay-only).
  with:
    status:
      description: The attempt state, either pending or failed.
      the: xyz.tonk.join/status
      cardinality: one
      as: entity

# The failure detail for a join, at the same `tonk:join/status` entity —
# asserted alongside `status: tonk:failed`. A separate concept so the
# pending state (status only) still resolves; the view reads this for the
# message when failed.
concept!: &join/failure
  this: tonk:join/failure
  description: Why a join attempt failed (overlay-only).
  with:
    reason:
      description: Human-readable failure message.
      the: xyz.tonk.join/reason
      cardinality: one
      as: text
    kind:
      description: >
        The failure class: malformed, audience-mismatch, revoked,
        unavailable, refused, or claim-failed.
      the: xyz.tonk.join/kind
      cardinality: one
      as: text

# The /join view — a directory view for `tonk:join/status`, mounted by a
# no-entity `<tonk-display model=tonk:join/status>` (see the Leptos /join
# route). Directory chrome renders even with zero instances, so the
# `<tonk-page>` trigger mounts and fires `tonk:join` on load before any
# status exists. The per-instance repeat shows the shared pulse while pending and
# the failure callout (`model=tonk:join/failure`) once a join fails. On
# success there is no status to show: the worker posts a navigate message
# to the originating client (see the host's navigate provider), which redirects into
# `/space/<subject>` while the chrome's "Joining…" stands until the page
# leaves.
view!:
  this: tonk:join/status
  show:
    directory: |
      <div class="join-card-wrap">
        <!-- Only the in-flight and failed states live here. The resting
             (paste) state is the ROUTE view's, because this directory is
             empty until a join starts and an empty nested directory renders
             nothing. `data-id={this}` marks the repeat row; the wall is
             inside it, so the whole surface is per-status. -->
        <div class="join-status" data-id={this}>
          <div class="join-opening" aria-live="polite">
            <span>opening this space</span>
            <span class="tonk-pulse" aria-hidden="true"></span>
          </div>
          <tonk-display entity={this} model=tonk:join/failure>
            <span slot="no-entity"></span>
            <span slot="no-model"></span>
            <span slot="loading"></span>
          </tonk-display>
        </div>
      </div>

# The failure view — the default view for `tonk:join/failure`, so the join
# directory's per-instance `<tonk-display model=tonk:join/failure>` renders
# it only when a failure exists (i.e. status: failed). Shows the reason.
view!:
  this: tonk:join/failure
  show:
    ui: |
      <!-- Revoked and deleted intentionally share this one screen. The
           diagnostic reason remains in the console/worker status; rendering it
           here would reveal whether the space still exists. -->
      <section class="edge-wall edge-wall--closed" aria-labelledby="edge-closed-title">
        <div class="edge-statement" id="edge-closed-title">this share link is closed</div>
        <div class="edge-field edge-field--settled">
          <span class="edge-noun">share link</span>
          <span class="edge-value">closed</span>
        </div>
        <div class="edge-narrator">this link no longer opens a space; ask its sender for a current share link</div>
        <div class="edge-run">
          <a class="ebtn quiet" href="/">start a new space</a>
          <tonk-join-retry class="ebtn solid" kind={kind}>join this space</tonk-join-retry>
        </div>
      </section>

# ============================================================
# ROUTING (profile branch) — mirrors core.yaml, scoped to the profile
# ============================================================
#
# The profile is itself a routable target: `<tonk-site path=…>` posts to
# `/api/profile/branch/main/site`, the SW asserts this tab's `tonk:site` on this
# branch (matching the path against the `route!` table below), and the element
# renders `<tonk-display entity=site:… model=tonk:site>`. The site view nests the
# matched `{concept}` on the same site entity — the same indirection a space uses.

# A tab's location + the route concept it renders. Mirrors core.yaml's `&site`.
concept!: &site
  this: tonk:site
  description: A tab's location and the route concept it renders.
  with:
    path:
      description: Currently active path on this site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text
    anchor:
      description: Currently active anchor (URL hash) on this site.
      the: xyz.tonk.site/anchor
      cardinality: one
      as: text
    space:
      description: The space (repository name) on this site.
      the: xyz.tonk.site/space
      cardinality: one
      as: text
    branch:
      description: The active branch name on this site (defaults to "main").
      the: xyz.tonk.site/branch
      cardinality: one
      as: text
    replica:
      description: Currently active replica on this site.
      the: xyz.tonk.site/replica
      cardinality: one
      as: entity
    route:
      description: Matched route of this site.
      the: xyz.tonk.site/route
      cardinality: one
      as: entity
    concept:
      description: Matched route's concept (the model the shell mounts).
      the: xyz.tonk.site/concept
      cardinality: one
      as: entity

# The site view: render the matched route concept on this same site entity.
view!:
  this: tonk:site
  show:
    ui: |
      <tonk-display entity={this} model={concept} />

# The route table concept. Mirrors core.yaml's `&route`.
concept!: &route
  this: tonk:route
  description: A route — maps a path pattern to the model the SW mounts.
  with:
    path:
      description: The axum/matchit path pattern.
      the: xyz.tonk.route/path
      cardinality: one
      as: text
    concept:
      description: The route model to render when this path matches.
      the: xyz.tonk.route/concept
      cardinality: one
      as: entity

# The profile's only route for now: `/` renders the Hub.
route!: &route/home
  this: id:tonk:route/home
  path: "/"
  concept: tonk:hub

# The Hub route model + its view: the space directory over this (profile) branch.
# `tonk:hub` is the concept the `/` route resolves to; its view renders the
# `space` directory view, the same picker the legacy `<tonk-hub>` element mounted.
concept!: &hub
  this: tonk:hub
  description: The Tonk Hub — a picker over the profile's spaces.
  with:
    # Picked off the site entity. The hub view renders the `space`
    # directory and doesn't read it, but a `concept!` must declare at
    # least one field, and `path` is the natural one a route model carries.
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text

view!:
  this: tonk:hub
  show:
    ui: |
      <div class="display-view-slot">
        <tonk-title text="Tonk"></tonk-title>
        <tonk-display model="space"></tonk-display>
      </div>

# The /join route: redeem an invite. The shell's top-level `<tonk-site>`
# routes every path against this table, so without an entry `/join` matched
# nothing and the site rendered an empty `tonk:site` ("required attribute
# missing"). Mirrors the Hub: `/join` → `tonk:join/route`, whose entity view
# (on the site entity) mounts the no-entity `<tonk-display
# model="tonk:join/status">` directory. That directory's chrome carries the
# `<tonk-page onmount=tonk:join>` trigger, which reads the page location
# (the SW can't see the `#fragment` seed) and fires `tonk:join`.
route!: &route/join
  this: id:tonk:route/join
  path: "/join"
  concept: tonk:join/route

concept!: &join/route
  this: tonk:join/route
  description: The /join page — redeem an invite on the profile meta branch.
  with:
    # The hub carries `path` for the same reason: a route model must declare
    # at least one field, and the view doesn't read it (the join trigger
    # reads the location itself).
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text

view!:
  this: tonk:join/route
  show:
    ui: |
      <div class="display-view-slot">
        <tonk-title text="Tonk"></tonk-title>
        <main class="join-view">
          <style>
            .join-view {
              --edge-page:#e8e6e4; --edge-ink:#38182a; --edge-on:#f7f6f5;
              --edge-soft:#5b4953; --edge-card:#f7f6f5;
              --edge-ring:rgba(56,24,42,.85); --edge-wash:rgba(56,24,42,.12);
              min-height:100vh; min-height:100dvh; padding:1px; color:var(--edge-ink);
              background:var(--edge-page); font-family:'IBM Plex Sans Condensed',
                'Bahnschrift','Arial Narrow',system-ui,sans-serif;
              font-weight:600; letter-spacing:.02em; -webkit-font-smoothing:antialiased;
            }
            :root.wa-dark .join-view {
              --edge-page:#161313; --edge-ink:#e2dfdd; --edge-on:#221c1d;
              --edge-soft:#c8c3bf; --edge-card:#1b1718;
              --edge-ring:rgba(226,223,221,.55); --edge-wash:rgba(226,223,221,.15);
            }
            .edge-mast { position:fixed; left:48px; top:48px; width:132px;
              color:var(--edge-ink); z-index:2; }
            .edge-mast img { display:block; width:100%; height:auto; }
            :root.wa-dark .edge-mast img { filter:invert(1); }
            .edge-wall { width:min(432px, calc(100vw - 32px)); margin-left:216px;
              margin-top:43px; display:flex; flex-direction:column; gap:7px; }
            .edge-statement, .edge-field, .edge-narrator { min-height:36px;
              background:var(--edge-card); box-shadow:0 0 0 1px var(--edge-ring); }
            .edge-statement { padding:10px 14px; display:flex; align-items:flex-end;
              font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:13.5px;
              line-height:1.55; text-wrap:balance; }
            .edge-field { height:36px; min-width:0; padding:0 10px 8px 12px;
              display:flex; align-items:flex-end; gap:12px; overflow:hidden; }
            .edge-noun { flex:none; color:var(--edge-soft); font-size:13px;
              line-height:1; text-transform:lowercase; }
            .edge-value { flex:1; min-width:0; color:var(--edge-ink); font:inherit;
              font-size:13px; line-height:1; text-align:right; }
            .edge-input { border:0; outline:0; padding:0; background:transparent;
              caret-color:transparent; }
            .edge-cur { width:7px; height:13px; margin-left:-7px;
              background:var(--edge-ink); mix-blend-mode:difference;
              animation:edge-cursor 1.05s steps(1,end) infinite; }
            .edge-narrator { padding:10px 14px; color:var(--edge-soft);
              font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:13px;
              font-weight:400; line-height:1.55; text-wrap:pretty; }
            .edge-narrator__invalid { display:none; }
            .edge-run { display:flex; gap:0; }
            .ebtn { min-height:40px; flex:1 1 0; padding:8px 10px; display:flex;
              align-items:flex-end; justify-content:flex-end; color:var(--edge-ink);
              text-decoration:none; text-transform:lowercase; cursor:pointer; }
            .ebtn.quiet { background:var(--edge-card);
              box-shadow:0 0 0 1px var(--edge-ring); }
            .ebtn.solid { color:var(--edge-on); background:var(--edge-ink); }
            .ebtn.solid button { width:100%; min-height:40px; padding:8px 10px;
              display:flex; align-items:flex-end; justify-content:flex-end;
              border:0; color:inherit; background:transparent; font:inherit;
              text-transform:lowercase; cursor:pointer; }
            .ebtn:active, .ebtn.solid button:active { scale:.96; }
            tonk-invite-link { display:none; }
            .edge-wall:has(tonk-invite-link[data-state="invalid"]) .edge-field {
              animation:edge-reject .45s ease 2; }
            .edge-wall:has(tonk-invite-link[data-state="invalid"])
              .edge-narrator__default { display:none; }
            .edge-wall:has(tonk-invite-link[data-state="invalid"])
              .edge-narrator__invalid { display:inline; }
            @keyframes edge-reject { 0%,100% { background:var(--edge-card); }
              50% { background:var(--edge-wash); } }
            @keyframes edge-cursor { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
            /* A join in flight or failed gives the status display a row;
               `data-state=ready` is `<tonk-display>`'s own signal for that,
               so the form steps aside without depending on the row's markup. */
            .join-view:has(.join-status-slot[data-state="ready"]) .join-paste { display: none; }
            .join-opening { width:min(432px, calc(100vw - 32px)); min-height:36px;
              margin-left:216px; margin-top:43px; padding:10px 14px;
              display:flex; align-items:center; justify-content:space-between;
              background:var(--edge-card); box-shadow:0 0 0 1px var(--edge-ring); }
            .join-status:has(tonk-display[data-state="ready"]) .join-opening { display:none; }
            @media (max-width:680px) {
              .edge-mast { left:16px; top:18px; width:98px; min-height:44px;
                display:flex; align-items:center; }
              .edge-wall, .join-opening { margin-left:16px; margin-top:132px; }
              .edge-run { flex-direction:column; }
              .edge-field, .ebtn, .ebtn.solid button { min-height:44px; }
              .edge-field { height:44px; padding-bottom:0; align-items:stretch; }
              .edge-input { min-height:44px; font-size:16px; }
              .edge-noun, .edge-cur { align-self:flex-end; margin-bottom:8px; }
            }
            @media (prefers-reduced-motion:reduce) {
              .edge-cur, .edge-wall:has(tonk-invite-link[data-state="invalid"])
                .edge-field { animation:none; }
            }
          </style>
          <a class="edge-mast" href="/" aria-label="Tonk home"><img src="/images/tonk-wordmark.svg" alt=""></a>
          <tonk-page onmount=tonk:join></tonk-page>
          <!-- `onmount`, not `onsubmit`: `<tonk-invite-link>` cancels the
               submit, resolves the pasted text (expanding a short link on
               its minting origin), and re-fires it as a bubbling `mount`
               carrying `detail.href` — the one read path `tonk:join`
               declares. Same command, same handler, whether the invite
               arrived in the address bar or in this box. -->
          <form class="join-paste edge-wall edge-wall--no-access" onmount=tonk:join>
            <div class="edge-statement">you do not have access to this space</div>
            <label class="edge-field">
              <span class="edge-noun">share link</span>
              <input class="edge-value edge-input" name="url" type="url" autocomplete="off" required aria-label="share link">
              <i class="edge-cur" aria-hidden="true"></i>
            </label>
            <tonk-invite-link field="url"></tonk-invite-link>
            <div class="edge-narrator">
              <span class="edge-narrator__default">paste the complete share link you were sent</span>
              <span class="edge-narrator__invalid">a share link is a complete web address carrying its access information</span>
            </div>
            <div class="edge-run">
              <a class="ebtn quiet" href="/">start a new space</a>
              <button class="ebtn solid" type="submit">join this space</button>
            </div>
          </form>
          <!-- The `tonk:join` trigger lives INSIDE the status display, not
               beside the form. `<tonk-page>` waits for its enclosing
               `<tonk-display>` to mark `data-bound` before firing, and a
               trigger placed in the route view waits on the ROUTE's display —
               which does not finish binding until its children render, so the
               page never painted. Nested here it waits on the status display
               instead, which binds independently, and the form above it is
               plain markup that renders regardless of any command. -->
          <tonk-display class="join-status-slot" model="tonk:join/status">
            <span slot="empty"></span>
            <span slot="loading"></span>
            <span slot="no-entity"></span>
          </tonk-display>
        </main>
      </div>

# The /inspector and /diagnose routes: the same query-inspector and
# search-tree views a space exposes, but pinned to the PROFILE branch so
# you can explore the profile DB (the hub's replicas, the member name,
# sync state) directly. `<tonk-inspector>` and `<tonk-tree>` resolve their
# repository from their own `with` — here the profile endpoint — so they
# query `/api/profile/branch/main/query` rather than a named space.
route!: &route/inspector
  this: id:tonk:route/inspector
  path: "/inspector"
  concept: tonk:inspector/route

concept!: &inspector/route
  this: tonk:inspector/route
  description: The /inspector page — a query inspector over the profile DB.
  with:
    # A route model must declare at least one field; the view doesn't read
    # it (the inspector needs no entity — it inspects the whole branch).
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text

view!:
  this: tonk:inspector/route
  show:
    ui: |
      <div class="display-view-slot">
        <tonk-title text="Tonk"></tonk-title>
        <tonk-inspector with="main@profile:tonk"></tonk-inspector>
      </div>

route!: &route/diagnose
  this: id:tonk:route/diagnose
  path: "/diagnose"
  concept: tonk:diagnose/route

concept!: &diagnose/route
  this: tonk:diagnose/route
  description: The /diagnose page — the search-tree inspector over the profile DB.
  with:
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text

view!:
  this: tonk:diagnose/route
  show:
    ui: |
      <div class="display-view-slot">
        <tonk-title text="Tonk"></tonk-title>
        <tonk-tree with="main@profile:tonk"></tonk-tree>
      </div>

# The space route: the profile routes ANY `/space/{id}/...` to the same UI — a
# full-size repo portal with the FAB floating on top — and hands the rest of the
# path to a NESTED `<tonk-site>` inside the portal, which routes it against the
# space's own route table. So `/space/{id}`, `/space/{id}/inspector`, etc. all
# render the same chrome; only the nested router's path differs.
# Two routes, same concept: the bare space root (`/space/{id}`, no sub-path) and
# any sub-path (`/space/{id}/{*rest}`). A `{*rest}` span may not capture nothing,
# so the bare form is its own route; it leaves `rest` unstamped, and the nested
# `<tonk-site>` defaults its absent `path` to `/`.
#
# The view keeps `<tonk-site path={rest}>` even when `rest` is absent because
# `rest` is a `cardinality: one` (scalar) field: `<tonk-display>` stamps the
# concept's scalar field names onto the `<tonk-view>` (`data-scalar-fields`), so
# the planner renders them as plain substitutions rather than iteration axes that
# would clone the host zero times — and drop it — when the value is empty.
route!: &route/space-root
  this: id:tonk:route/space-root
  path: "/space/{id}"
  concept: tonk:space/chrome

route!: &route/space-sub
  this: id:tonk:route/space-sub
  path: "/space/{id}/{*rest}"
  concept: tonk:space/chrome

# The space chrome model. `{id}` (the repository) and `{rest}` (the sub-path) are
# captured from the path and stamped on the site; the view reads them. `rest` is
# optional — the bare space route does not capture it, and the nested `<tonk-site>`
# defaults its absent `path` to `/`.
concept!: &space-chrome
  this: tonk:space/chrome
  description: The space chrome — repo portal with the FAB on top.
  with:
    id:
      description: The space repository id, picked off the site entity.
      the: xyz.tonk.site/id
      cardinality: one
      as: text
  maybe:
    rest:
      description: The sub-path within the space, picked off the site entity.
      the: xyz.tonk.site/rest
      cardinality: one
      as: text

view!:
  this: tonk:space/chrome
  show:
    ui: |
      <style>
        /* A space this device does not hold answers every query with a
           404, which `<tonk-display>` classifies as `unknown` — a
           terminal state, unlike `offline`, so nothing retries and
           nothing arrives later. The title display below is the one
           element here that both queries the space and reports its
           state, so it carries the notice; when it fires, the portal
           has nothing to render and is hidden. The FAB stays: it
           carries the space switcher, which is the way off a page
           that is otherwise a dead end. `<tonk-fab>` hides its own
           share and roster in this case (see fab.css's
           `[data-unknown-space]`), since those act on a space that
           is not here. */
        /* The absent-space state is profile chrome, not space content. It uses
           the same edge wall, palette, typography, and compact geometry as the
           `/join` ceremony instead of inheriting Web Awesome's pill skin. */
        .space-unknown {
          --edge-page:#e8e6e4; --edge-ink:#38182a; --edge-on:#f7f6f5;
          --edge-soft:#5b4953; --edge-card:#f7f6f5;
          --edge-ring:rgba(56,24,42,.85); --edge-wash:rgba(56,24,42,.12);
          position:fixed; inset:0; min-height:100vh; min-height:100dvh;
          overflow:auto; padding:1px; background:var(--edge-page);
          color:var(--edge-ink); font-family:'IBM Plex Sans Condensed',
            'Bahnschrift','Arial Narrow',system-ui,sans-serif;
          font-weight:600; letter-spacing:.02em; -webkit-font-smoothing:antialiased; }
        :root.wa-dark .space-unknown {
          --edge-page:#161313; --edge-ink:#e2dfdd; --edge-on:#221c1d;
          --edge-soft:#c8c3bf; --edge-card:#1b1718;
          --edge-ring:rgba(226,223,221,.55); --edge-wash:rgba(226,223,221,.15); }
        .space-unknown *, .space-unknown *::before, .space-unknown *::after {
          box-sizing:border-box; }
        .space-unknown ::selection { background:var(--edge-ink); color:var(--edge-on); }
        .space-unknown :focus-visible { outline:none;
          box-shadow:inset 0 0 0 2px var(--edge-on),
            inset 0 0 0 4px var(--edge-ink); }
        .space-unknown-mast { position:fixed; left:48px; top:48px; width:132px;
          color:var(--edge-ink); z-index:2; }
        .space-unknown-mast img { display:block; width:100%; height:auto; }
        :root.wa-dark .space-unknown-mast img { filter:invert(1); }
        .space-unknown-wall { width:min(432px, calc(100vw - 32px)); margin-left:216px;
          margin-top:43px; display:flex; flex-direction:column; gap:7px; }
        .space-unknown-statement, .space-unknown-narrator { min-height:36px;
          margin:0; background:var(--edge-card);
          box-shadow:0 0 0 1px var(--edge-ring); }
        .space-unknown-statement { padding:10px 14px; display:flex; align-items:flex-end;
          color:var(--edge-ink);
          font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:13.5px;
          font-weight:600; line-height:1.55; text-wrap:balance; }
        .space-unknown-narrator { padding:10px 14px; color:var(--edge-soft);
          font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:13px;
          font-weight:400; line-height:1.55; text-wrap:pretty; }
        .space-unknown-run { display:flex; }
        .space-unknown-join { width:100%; min-height:40px; padding:8px 10px;
          display:flex; align-items:flex-end; justify-content:flex-end; gap:8px;
          background:var(--edge-ink); color:var(--edge-on); text-decoration:none;
          text-transform:lowercase; cursor:pointer; transition-property:scale;
          transition-duration:150ms; transition-timing-function:ease-out; }
        .space-unknown-join:hover {
          background:linear-gradient(var(--edge-wash),var(--edge-wash)), var(--edge-ink); }
        .space-unknown-join:active { scale:.96; }
        @media (max-width:680px) {
          .space-unknown-mast { left:16px; top:18px; width:98px; min-height:44px;
            display:flex; align-items:center; }
          .space-unknown-wall { margin-left:16px; margin-top:132px; }
          .space-unknown-join { min-height:44px; }
        }
        @media (prefers-reduced-motion:reduce) {
          .space-unknown-join { transition:none; }
        }
        /* Keyed off the display's own state, NOT a wrapper element: wrapping
           these siblings in a container changed which element the template
           engine picks as the repeat node (the outermost subject-referencing
           element), so `<tonk-site>` became the repeat node and `<tonk-fab>`
           was dropped from the output entirely. `:has()` reaches the sibling
           display without adding an element. */
        tonk-view:has(tonk-display[data-state="no-model"]) tonk-site { display: none; }
      </style>
      <tonk-site with="main@{id}" allow="main@{id}" path={rest}></tonk-site>
      <tonk-fab with="main@profile:tonk" space={id}></tonk-fab>
      <tonk-display with={id} entity={id} model=tonk:repository view=title>
        <!-- `no-model` is now the absent-space panel below, which sets its
             own title; a second `no-model` child would render alongside it
             and fight over `document.title` (update_slot_children shows
             EVERY matching child, not the first). `no-entity` keeps the
             quiet placeholder: the concept resolved, the row just is not
             here yet. -->
        <tonk-title slot="no-entity" text="Untitled — Tonk"></tonk-title>
        <!-- The absent-space case. A repository this device has not
             replicated answers every query with the EMPTY SET, so
             `tonk:repository` resolves to nothing and this display lands
             in `no-model` — the same state a not-yet-synced concept
             reaches, which is exactly right: the space may arrive later,
             and when it does the standing subscription delivers a real
             frame and this panel is replaced in place.

             Slotted rather than left to the built-in fallback, which
             would show "Model not found — concept: tonk:repository" to
             someone whose actual problem is that they were never invited. -->
        <div slot="no-model" class="space-unknown">
          <tonk-title text="Not here — Tonk"></tonk-title>
          <a class="space-unknown-mast" href="/" aria-label="Tonk home"><img src="/images/tonk-wordmark.svg" alt=""></a>
          <div class="space-unknown-wall">
            <h1 class="space-unknown-statement">you don't have this space</h1>
            <p class="space-unknown-narrator">It isn't on this device, and this account has no access to it. If someone shared it with you, open their share link to join.</p>
          <!-- A plain top-level path. The guest classifies this as in-app
               (it resolves against the synthetic per-space origin) and asks
               the host to navigate; the host recognises `/join` as a
               PROFILE route and navigates the outer frame there instead of
               rewriting it to `/space/{did}/join`. See `real_href` /
               `is_top_level_route` in tonk-portal. -->
          <!-- A plain `<a>`, NOT `<wa-button href>`: the guest's click relay
               finds links with `closest("a[href]")`, and Web Awesome renders
               its anchor inside a SHADOW ROOT, which `closest` does not
               cross. The relay never matched, so the browser navigated the
               sealed FRAME to /join instead of the host navigating the top
               window — the join page booting inside an opaque origin with no
               service worker. Styled as a button below. -->
            <div class="space-unknown-run">
              <a class="space-unknown-join" href="/join">join a space<span aria-hidden="true">&#9656;</span></a>
            </div>
          </div>
        </div>
        <!-- A space created before the title facet existed has no
             `show: {title: …}` entry on its branch, so `view=title`
             resolves nothing and the display enters `no-view` — a `danger`
             state. `update_slot_children` toggles `hidden`, it never adds
             or removes children, so with no matching slot child the
             built-in red `<wa-callout>` fires. This inert child suppresses
             that callout while pushing no title, leaving the tab exactly
             as it was — the behavior for older spaces. -->
        <span slot="no-view"></span>
      </tonk-display>

# The catch-all: any path no static/`/space/…` route claims lands here. The
# router matches most-specific-first, so this `{*rest}` span never shadows `/`,
# `/join`, `/inspector`, `/diagnose`, or `/space/{id}` — it only catches what
# nothing else does (a mistyped `/board`, a stale deep link). Without it such a
# path matches no route, the site is never stamped, and the shell spins forever.
route!: &route/not-found
  this: id:tonk:route/not-found
  path: "/{*rest}"
  concept: tonk:not-found

concept!: &not-found
  this: tonk:not-found
  description: The 404 page — a path the profile has no route for.
  with:
    # The attempted path, picked off the site, shown back to the user.
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text

view!:
  this: tonk:not-found
  show:
    ui: |
      <div class="display-view-slot">
        <style>
          .nf { display: flex; flex-direction: column; align-items: center;
                justify-content: center; gap: 8px; height: 100%; padding: 32px;
                text-align: center; color: var(--wa-color-text-normal); }
          .nf__code { font-size: 3rem; font-weight: 600; line-height: 1;
                      color: var(--wa-color-text-quiet); }
          .nf__msg { font-size: 1rem; color: var(--wa-color-text-quiet); }
          .nf__path { font-family: var(--wa-font-family-code, monospace);
                      color: var(--wa-color-text-normal); }
          .nf__home { margin-top: 8px; text-decoration: none; }
        </style>
        <tonk-title text="Tonk"></tonk-title>
        <div class="nf">
          <div class="nf__code">404</div>
          <div class="nf__msg">No page at <span class="nf__path">{path}</span></div>
          <a class="nf__home" href="/"><wa-button variant="brand">Back to Hub</wa-button></a>
        </div>
      </div>

# ════════════════════════════════════════════════════════════════════
# Account facts
#
# Everything below is true about the ACCOUNT rather than about one space
# or one device: who the account is, which devices may act for it, what
# holds its secret, how it is registered with an access service, and
# which profiles this device can open. These live on the account branch
# and replicate with it, so a new device learns them by pulling rather
# than by asking a service.
#
# Not every concept here is read through its declaration today — the FAB
# subscribes to the raw `xyz.tonk.*` attributes instead, deliberately, so
# a space seeded from an older library does not break the read (see
# `tonk-fab/src/member_roster.rs`). That is a fine reason to query by
# attribute. It is not a reason to leave the schema undocumented: the
# declaration is what says a fact exists and what it means.
# ════════════════════════════════════════════════════════════════════

# The account-wide display name, keyed by the immutable account subject.
#
# Cardinality-one, so two devices renaming concurrently converge on one
# deterministic value. No wall-clock ordering is implied: this is
# dialog's merge, not last-write-wins.
concept!: &account/name
  this: tonk:account/name
  description: The account's display name.
  # ENTITY: the account's own DID.
  with:
    name:
      description: >
        The authoritative account display name
        (xyz.tonk.account/display-name). Distinct from
        `tonk:profile/name`, which is one device's own override.
      the: xyz.tonk.account/display-name
      cardinality: one
      as: text

# The account's registration with an access service.
#
# Registration state as a FACT, not as a cached HTTP answer: every
# device reads it with an ordinary query and converges through sync, so
# a device that never ran the enrollment still knows whether the account
# is servable. Written when enrollment records `Registered` and again
# when activation promotes it to `Active`.
# Registration, activation and suspension are three INDEPENDENT facts,
# each written once by the act that proves it and never rewritten.
#
# They compose rather than replace: a suspended account is still a
# registered one, and an activated account keeps its registration. That
# is why each is its own concept with every field required, instead of
# optional fields on one row — absence of the concept is the signal, so
# nothing needs a field that is sometimes missing.
#
# This replaces a single cardinality-one `status` string, which had two
# faults. String variants are unvalidated: `is_active()` was a `==
# "Active"` match that a typo defeats silently. And one slot written by
# both enrollment and activation is a race — dialog's merge picks a
# winner, so an account that IS activated could converge back to
# registered. Adding a fact only ever narrows, so concurrent writers
# converge instead of fighting.
concept!: &account/registered
  this: tonk:account/registered
  description: The account enrolled an address with an access service.
  # ENTITY: the account's own DID.
  with:
    registered-at:
      description: When enrollment recorded the address, unix seconds.
      the: xyz.tonk.account/registered-at
      cardinality: one
      as: unsigned-integer
    email:
      description: The address enrollment named.
      the: xyz.tonk.account/customer-email
      cardinality: one
      as: text
    provider:
      description: >
        Where this account syncs: the UCAN endpoint its spaces attach
        their remotes to. Known at enrollment and unchanged by
        activation, so it belongs here rather than on the activation
        fact — a client can attach its remote immediately and let the
        gate answer.

        That is what makes activation observable without asking: the
        remote answers 403 while the customer is unconfirmed and 200
        once the emailed link is opened, so a device learns it was
        activated from the sync it was already doing.
      the: xyz.tonk.account/provider-address
      cardinality: one
      as: text

# Activation. Its PRESENCE is what makes an account served; nothing has
# to overwrite the registration to say so.
concept!: &account/active
  this: tonk:account/active
  description: The account confirmed its address and is served.
  # ENTITY: the account's own DID.
  with:
    activated-at:
      description: >
        When the emailed link was opened and the service confirmed it,
        unix seconds.
      the: xyz.tonk.account/activated-at
      cardinality: one
      as: unsigned-integer

# Suspension: the service withdrew.
concept!: &account/suspended
  this: tonk:account/suspended
  description: The service withdrew from serving this account.
  # ENTITY: the account's own DID.
  with:
    suspended-at:
      description: >
        When the withdrawal took effect, unix seconds. A support
        conversation starts with when service stopped.
      the: xyz.tonk.account/suspended-at
      cardinality: one
      as: unsigned-integer
    reason:
      description: Why the service withdrew, in words a person can act on.
      the: xyz.tonk.account/suspension-reason
      cardinality: one
      as: text

# The onboarding account: a real account this device minted for itself,
# custodied locally, before anyone signed up.
#
# ENTITY: the onboarding account's own DID.
#
# It exists so a device can create and own spaces immediately — signup is
# not a precondition for using Tonk. Its secret is sealed to a keypair on
# this device rather than to a passkey, which is exactly what makes it
# INTERIM: nothing recovers it elsewhere, and signing up rotates every
# custodied seed onto the real account and retires this one.
#
# Recorded as a fact so it can be seen. The secret itself stays in a
# credential site; this is only the DID and the moment, so an inspector can
# answer "which account am I acting as, and is it the real one?".
#
# This account HAS custody before any passkey exists: a custodian keypair
# on this device, a KEK sealed to it, and the account secret sealed under
# that. All three live in credential sites, so unlike a passkey's envelope
# there is no `secret:message` to find — the custodian is a local key, not
# a principal anything else can address. `custodian` names it so the
# arrangement is at least visible.
concept!: &account/onboarding
  this: tonk:account/onboarding
  description: A locally custodied account, held until a real one replaces it.
  with:
    minted-at:
      description: When this device minted the onboarding account, unix seconds.
      the: xyz.tonk.account/onboarding-minted-at
      cardinality: one
      as: unsigned-integer
  maybe:
    custodian:
      description: >
        The local keypair holding this account: what its secret is sealed
        under before a passkey exists. A device-local key, so nothing
        addresses it and no sealed message names it as recipient — this is
        the only record that it is what currently holds the account.
      the: xyz.tonk.account/onboarding-custodian
      cardinality: one
      as: entity
    retired-at:
      description: >
        When a real account took over, unix seconds. Its presence is what
        says this account is no longer the one in use — the row stays so
        the handover is visible rather than silently gone.
      the: xyz.tonk.account/onboarding-retired-at
      cardinality: one
      as: unsigned-integer

# The account's status, DERIVED from the facts above.
#
# ENTITY: the account's own DID.
#
# Deductive (`assert:`, no bang), so it is computed on read and never
# stored. A stored status would be a writable slot that could disagree with
# the facts it summarises; deriving it means the summary cannot drift from
# what actually happened.
#
# The four cases are mutually exclusive, and each rule below states the
# whole condition rather than relying on rule order:
#
#   case:onboarding  a locally custodied account, not yet registered
#   case:registered  enrolled, and neither activated nor suspended
#   case:active      activated and not suspended
#   case:suspended   the service withdrew
concept!: &account/status
  this: tonk:account/status
  description: The account's status, derived from its registration facts.
  with:
    status:
      description: >
        `case:onboarding`, `case:registered`, `case:active`, or
        `case:suspended` — an entity label rather than text, so a typo
        cannot silently read as a different state.
      the: xyz.tonk.account/status
      cardinality: one
      as: entity

# An onboarding account that has not been handed over is interim.
rule!:
  description: A live onboarding account is interim
  assert: account/status
  when:
    - assert: account/onboarding
      where: { this: ?this }
    - assert: ==
      where:
        this: ?status
        is: case:onboarding
  unless:
    - assert: account/registered
      where: { this: ?this }
    - assert: account/onboarding
      where: { this: ?this, retired-at: _ }

# Registered is the fallback: enrolled, and neither later fact has
# arrived. Both are excluded, not just activation — a suspended account
# still carries its registration, so testing activation alone would derive
# two cases at once.
rule!:
  description: An account that is neither active nor suspended is registered
  assert: account/status
  when:
    - assert: account/registered
      where:
        this: ?this
    - assert: ==
      where:
        this: ?status
        is: case:registered
  unless:
    - assert: account/active
      where: { this: ?this }
    - assert: account/suspended
      where: { this: ?this }

# Activated and not withdrawn.
rule!:
  description: An activated account that is not suspended is active
  assert: account/status
  when:
    - assert: account/active
      where: { this: ?this }
    - assert: ==
      where:
        this: ?status
        is: case:active
  unless:
    - assert: account/suspended
      where: { this: ?this }

# Suspension wins outright.
rule!:
  description: A suspended account is suspended
  assert: account/status
  when:
    - assert: account/suspended
      where: { this: ?this }
    - assert: ==
      where:
        this: ?status
        is: case:suspended

# Where anything sealed for this account is addressed.
#
# A device that holds a space seed seals it to this address and publishes
# the result as a `secret:message`, which a `secret:principal` names as
# its seed; only a live passkey ceremony derives the private half and can
# open one. So every device can deposit
# and none can read, which is what lets a seed reach a new device without
# any device holding the account's secret.
#
# An address, not a store: nothing is kept here. The X25519 `did:key` is
# what `conceal` is aimed at, and the sealed bytes land in their own rows.
#
# Written by the ceremony that creates the account secret, and again at
# rotation.
concept!: &account/sealed-inbox
  this: tonk:account/sealed-inbox
  description: The address anything sealed for this account is sent to.
  # ENTITY: the account's own DID.
  with:
    address:
      description: >
        The X25519 `did:key:z6LS…` as an entity — the public half of the
        account secret, derived from it, so rotation publishes a new one.
        Cardinality-one: sealed rows name their own recipient, so no
        history is needed here.
      the: xyz.tonk.account/sealed-inbox
      cardinality: one
      as: entity

# A passkey that can recover this account.
#
# ENTITY: the custody DID — the principal the passkey's PRF output
# derives. The same entity that is the `to` of the `secret:message`
# holding that passkey's sealed envelope, so the two join on `this`.
#
# One row per passkey, which is the point. This used to hang off the
# ACCOUNT, so an account with three passkeys had one creation record and
# dialog's per-attribute merge could pair one device's timestamp with
# another's label.
#
# No `account` field: the envelope already says which account this
# recovers. Its `secret:message` names this custody DID as `to` and the
# account as `sender`, so the link is a join, not a second copy.
#
# Enumerating an account's passkeys therefore means querying
# `secret:message` by `sender` and reading the `to`s — the custody DID is
# PRF-derived, so nothing can compute it without a live assertion.
concept!: &recovery/passkey
  this: recovery:passkey
  description: A passkey that can recover this account.
  with:
    credential-id:
      description: >
        The credential id the authenticator returns, at creation and on
        every assertion. What an assertion names to select this
        credential.
      the: xyz.tonk.recovery/credential-id
      cardinality: one
      as: text
    created-at:
      description: Unix seconds at credential creation.
      the: xyz.tonk.recovery/created-at
      cardinality: one
      as: unsigned-integer
    created-on:
      description: Browser and operating-system label, e.g. "Chrome on macOS".
      the: xyz.tonk.recovery/created-on
      cardinality: one
      as: text
  maybe:
    name:
      description: >
        The WebAuthn `user.name` this credential was created with — the
        address, where one was given. What a passkey manager lists the
        entry under, so it is what a person recognises their own passkey
        by. Absent for a credential created without one, which the
        ceremony names with an opaque random string instead.
      the: xyz.tonk.recovery/name
      cardinality: one
      as: text
    display-name:
      description: >
        The WebAuthn `user.displayName`. Usually the same address as
        `name`; kept separately because WebAuthn keeps them separately
        and an authenticator may show either.
      the: xyz.tonk.recovery/display-name
      cardinality: one
      as: text

# ── Device links ────────────────────────────────────────────────────

# A device link: the authorization one device holds to act for this
# account, and what the linked-device list renders.
#
# Named for what it actually is rather than for the general case. Every
# authorization minted today is a device link, so a general
# `account/authorization` would be a shape with one instance. A broader
# concept can be added when a second purpose exists, with a rule
# projecting this into it — that is cheaper than a general name whose
# rows are all one kind.
#
# `this` IS THE DELEGATION — its blob hash, as dialog keyed it when the
# chain was retained. Not a device DID, not an id of ours. That is the
# whole design: the delegation is the authorization, it is signed, and it
# confers the authority, so a record keyed by anything else would be a
# second source of truth that could disagree with the proof.
#
# Dialog decomposes the proof onto that same entity — `dialog.ucan/issuer`,
# `/audience`, `/subject`, `/command`, `/expiration` — so the row and the
# proof share one subject. Joining them is `this`; there is deliberately no
# `proof:` field, because a copy of the chain beside it is exactly the
# second source this shape avoids. `xyz.tonk.device/*` below are only the
# fields dialog does not carry.
#
# Revoking the delegation takes this row with it: an authorization cannot
# linger in a list after the authority it describes is gone.
#
# The attributes stay in the `xyz.tonk.device` namespace rather than
# `xyz.tonk.authorization`, which already means an invite's access proof —
# one namespace holding both would make "authorization" ambiguous between
# a device link and a share link.
concept!: &account/device-link
  this: tonk:account/device-link
  description: One device's authorization to act for this account.
  # ENTITY: THE DELEGATION — its blob hash, as dialog keyed it when
  # the chain was retained. Not a device DID and not an id of ours.
  with:
    created-at:
      description: >
        When the authorization was minted, unix seconds. Distinct from
        the delegation's `notBefore`, which bounds validity: this records
        the act, so a re-issued grant with the same window still gets a
        new time.
      the: xyz.tonk.device/created-at
      cardinality: one
      as: unsigned-integer
    title:
      description: >
        Human label, e.g. "Chrome on macOS". Kept here so a list renders
        offline rather than requiring a round trip.
      the: xyz.tonk.device/title
      cardinality: one
      as: text
    reason:
      description: >
        Why the delegation exists — `case:device-link` for a device. An
        entity label rather than text, so a typo cannot silently read as
        a different reason.

        Duplicated from the delegation's signed `meta` because `meta` is
        NOT decomposed into facts: it rides inside the envelope and
        cannot be queried. The signed copy stays authoritative; this one
        lets a list filter without opening envelopes.
      the: xyz.tonk.device/reason
      cardinality: one
      as: entity

# ── Sealed messages ─────────────────────────────────────────────────

# A sealed message: ciphertext only its recipient can open.
#
# ENTITY: derived from the MESSAGE itself, not from the parties. Sealing
# is randomized (fresh ephemeral key and nonce per call), so sealing the
# same plaintext twice yields different bytes and therefore a different
# entity. That is deliberate: the row identifies THIS envelope, so a
# re-seal adds a row rather than silently replacing what it supersedes,
# and rotation retracts the old one explicitly.
#
# Deliberately general — nothing here is about accounts or seeds. What a
# particular envelope CONTAINS is said by whatever points at it: a
# `secret:principal` names its seed this way, and the account's own
# secret sealed under a passkey is the same shape with `to` set to the
# custody DID that passkey derives.
concept!: &secret/message
  this: secret:message
  description: Ciphertext only its recipient can open.
  with:
    to:
      description: >
        Who can open it — the recipient the bytes were sealed to. For a
        passkey envelope, the custody DID that passkey derives: only a
        fresh assertion of that passkey opens it.
      the: xyz.tonk.secret/to
      cardinality: one
      as: entity
    message:
      description: The sealed bytes.
      the: xyz.tonk.secret/message
      cardinality: one
      as: bytes
  maybe:
    from:
      description: >
        Who sealed it, when that is known and worth recording. Optional
        because most sealing has no meaningful sender: a seed sealed to a
        recipient is just custody, and naming a sender would invent an
        author the seal does not bind. Set it only where provenance is
        real — the seal itself binds recipient and subject as associated
        data, so this is description, never authority.
      the: xyz.tonk.secret/sender
      cardinality: one
      as: entity

# A principal whose ed25519 seed is held sealed, so it can be re-derived.
#
# ENTITY: the principal's own DID. One row per principal, which is the
# thing being described — `seed` points at the envelope carrying it, and
# that envelope already names its recipient. Sealing the same seed to a
# second recipient (an admin as recovery custodian) adds a second
# `secret:message` and a second `seed` relation here, rather than needing
# the entity to carry a recipient of its own.
concept!: &secret/principal
  this: secret:principal
  description: A principal whose ed25519 seed is held sealed.
  with:
    kind:
      description: >
        What this principal is: `tonk:space` for a space's signing key,
        `tonk:invite` for an invite principal's.
      the: xyz.tonk.secret/kind
      cardinality: one
      as: entity
    seed:
      description: >
        The `secret:message` whose plaintext is this principal's ed25519
        seed. Recovery reads it, opens it with the recipient's key, and
        re-derives the principal this entity names.
      the: xyz.tonk.secret/seed
      cardinality: one
      as: entity

# ── Delegations ─────────────────────────────────────────────────────

# A delegation this branch retained: the proof itself, as dialog stores it.
#
# ENTITY: the delegation's blob hash — the same entity `tonk:account/
# device-link` and `secret:principal` hang their own fields on, so those
# concepts join to this one on `this`.
#
# NOT a tonk concept in the usual sense: every field here is dialog's own
# decomposition, written when the chain was retained (`dialog.ucan/*`).
# Declared so an inspector can see them at all — without a concept the
# facts exist and nothing can name them, which is why "who can act on
# what" was queryable only by hand-rolling attribute selectors.
#
# `expiration` and `not-before` are optional because dialog omits them
# entirely for a delegation that never expires or has no lower bound; a
# required field would hide exactly the powerlines that matter most.
concept!: &ucan/delegation
  this: ucan:delegation
  description: A delegation retained on this branch.
  with:
    issuer:
      description: Who signed it.
      the: dialog.ucan/issuer
      cardinality: one
      as: text
    audience:
      description: Who receives the authority.
      the: dialog.ucan/audience
      cardinality: one
      as: text
    subject:
      description: >
        What the authority is over. A powerline — authority over anything —
        carries the any-subject DID rather than being absent, which keeps
        the lookup a plain equality.
      the: dialog.ucan/subject
      cardinality: one
      as: text
    command:
      description: The delegated command path, e.g. `/use/get`.
      the: dialog.ucan/command
      cardinality: one
      as: text
  maybe:
    expiration:
      description: Unix seconds, absent when the delegation never expires.
      the: dialog.ucan/expiration
      cardinality: one
      as: unsigned-integer
      # `dialog.ucan/notBefore` is deliberately not declared: the notation's
      # attribute parser rejects a camelCase last segment, and that is the
      # name dialog writes. A lower validity bound is therefore readable
      # only by attribute, not through this concept.

# ── Profiles this device knows ──────────────────────────────────────

# One profile this browser can open.
#
# ENTITY: the profile's own DID, like every other identity in this file.
# The storage name is not part of it and does not need to be: a profile
# is opened by name (`Profile::open(name)`), so the name determines the
# DID and the pair would carry no more information than the DID alone.
#
# DEVICE-LOCAL. Alone in this file, this never replicates — it is the
# list of profiles that exist on THIS browser, which is not a fact about
# any account.
#
# One field, because one is all that is original here. The handle to
# open exists nowhere else; everything a switcher row shows about a
# profile already exists on that profile's own account branch —
# `tonk:account/name` for the label, `tonk:account/registered` for the
# address — and is read from there rather than copied.
#
# Nothing here says whether the profile is SIGNED IN, and nothing
# should. Being signed in is a delegation that exists and verifies: the
# `account -> profile` device link, whose `dialog.ucan/audience` is this
# profile and whose `dialog.ucan/issuer` is an account that is itself
# active (`tonk:account/active`). Signing out REVOKES that delegation
# and retracts it, so the authority is gone rather than merely
# unrecorded — which is what makes the question answerable from the
# proof instead of from a stamp that can disagree with it.
concept!: &device/profile
  this: device:profile
  description: A profile this device can open.
  with:
    name:
      description: >
        The storage name the profile opens under — its activation
        handle. What the switcher passes to open this profile, and the
        only fact about a profile that lives here rather than on the
        profile's own account branch.
      the: xyz.tonk.roster/name
      cardinality: one
      as: text
