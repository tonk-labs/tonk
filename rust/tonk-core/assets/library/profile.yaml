# Tonk profile library — the minimal standard library seeded onto the
# profile repository's meta branch.
#
# The profile branch only backs the Tonk Hub at `/`: a picker over the
# spaces this profile can open. It does NOT render workspaces, boards,
# sheets, inspectors, or any artifact view — those live on each space's
# own content branch and are seeded from the full `core.yaml`. Seeding
# the whole standard library here cost ~2s of DB writes on every first
# load for 60+ expressions the profile never uses; this lean document
# carries only the two definitions the Hub needs.
#
# Lowering runs `analyze_local` (no running system), so every
# `&anchor` / bare-name reference must resolve within this file. Both
# definitions below are self-contained: the directory view's
# `model: space` resolves to the `&space` anchor here.

# A space (replica) the profile has access to. These records live on
# the profile repository's meta branch — one per repository this device
# has joined or created. The Hub queries them on the profile meta branch
# (the top site's `with="meta@profile:tonk"` context) so the user can pick
# which space to open.
concept!: &space
  this: tonk:space
  description: A repository this profile can open.
  with:
    subject:
      description: >
        The repository's subject DID (its stable identity). The Hub card
        links to `/space/{subject}`; the route reads the routing key as
        the suffix after the last `:`.
      the: xyz.tonk.replica/subject
      cardinality: one
      as: entity
    kind:
      description: >
        tonk:repository for a real space, tonk:profile for the
        profile's own self-replica. The Hub view hides the latter
        in CSS via [data-kind].
      the: xyz.tonk.replica/kind
      cardinality: one
      as: entity
    status:
      description: >
        tonk:blank while the space's content branch is still
        seeding, tonk:initialized once seeded. The Hub card
        reflects it via [data-status] (an installing animation).
      the: xyz.tonk.replica/status
      cardinality: one
      as: entity
  maybe:
    name:
      description: |
        Local name of the space. Optional: a space recorded before
        names were stored, or one created/joined without a local name,
        simply omits it. A required field here would empty the whole
        Hub (the directory join drops every nameless replica).
      the: xyz.tonk.replica/name
      cardinality: one
      as: text

# The Add Space command. Submitting the Hub's form asserts this
# transient command; the worker's `create_space` handler decodes it and
# does the work (record the replica, create + seed the repository, flip
# the status). `name` reads from the form on submit:
# `event.currentTarget.elements.name.value` — the `<wa-input name="name">`
# inside `<form onsubmit=space/create>`. `prevent-default` stops the page
# from reloading: `method="dialog"` does NOT work here because the form is
# slotted into `<wa-dialog>` and the native `<dialog>` lives across the
# shadow boundary, so the form has no native-dialog ancestor in its own
# tree and the browser falls back to a GET submit. The command is
# transient: it fires the handler once and is swept before the durable
# commit.
command!: &space/create
  description: A request to create a new space by the name typed into the form.
  with:
    name:
      description: The space name, read from the form's `name` input on submit
      the: dom.event.current-target.elements.name/value
      as: text
    remote:
      description: >
        Sync URL, read from the form's hidden `remote` input. The
        worker's `CreateSpaceHandler` matches on `name` alone (so this
        command keeps decoding against an older profile descriptor that
        lacks this field), and reads `remote` opportunistically: the Hub
        form defaults it to this server via `<tonk-default-remote auto>`;
        if that URL cannot be resolved, blank still creates a local-only
        space. A URL is attached after creation as the `origin` remote
        with `main` tracking `origin/main`. Single
        word `remote` (not `remote-url`) because read-path segments are
        kebab→camel-cased.
      the: dom.event.current-target.elements.remote/value
      as: text
    template:
      description: >
        Which template to seed: "wiki" for linked pages, "sheets" for
        the tabbed workspace, "board" for the card canvas, or
        blank/absent for the lean default (the blank canvas). Read from
        the wizard's `template` control on submit, exactly as `name`
        and `remote` are. The worker's CreateSpaceHandler reads it via
        template_from_facts; an older form that omits it decodes as
        blank.
      the: dom.event.current-target.elements.template/value
      as: text
    prevent-default:
      description: Stop the form submission from reloading the page
      the: dom.event.do/prevent-default

# Load the requesting tab's site for its current path. Mirrors core.yaml's
# `&tonk/load` — seeded here too because the top-level `<tonk-site>` stamps onto
# the PROFILE branch (its ancestors resolve no named repo, so the claim routes
# here). The worker's `LoadHandler` matches `path` against this branch's `route!`
# table and stamps `tonk:site` onto the element-supplied `this`.
command!: &tonk/load
  this: tonk:load
  description: Stamp the requesting tab's site for its current path on this branch.
  with:
    path:
      description: The route path the tab is at, matched against the route table.
      the: xyz.tonk.site/path
      as: text

# The `view/directory` concept — the shape `<tonk-display>` queries to
# find a directory view (a `model` + a `display` template under
# `xyz.tonk.view/directory`). The `view/directory!:` instance below is
# an instance of it, so its concept must be present on this branch too.
concept!: &view/directory
  this: tonk:view/directory
  description: A directory view used by tonk-display when entity is not set.
  with:
    model:
      description: Concept this view renders
      the: xyz.tonk.view/model
      cardinality: one
      as: entity
    display:
      description: HTML template for the view
      the: xyz.tonk.view/directory
      cardinality: one
      as: text

# The Hub directory view: the picker shown at `/`. One card per space,
# linking to its `/space/{subject}` page. A space is identified by its
# subject did:key; the route reads the routing key as the suffix after
# the last `:`, so `{subject}` (a full did:key) resolves to that key.
# The card's name is NOT read from this profile-side record — it is read
# from the listed space's OWN repository: the row's `with={subject}`
# context opens that space's routing context and a
# `<tonk-display model=tonk:repository view=tonk:view/label>` inside it
# shows the repo's current name (the cross-device source of truth).
# Rendered as a directory (no entity) over the `space` model on the
# profile meta branch.
view/directory!:
  this: id:tonk:space/directory
  model: space
  display: |
    <div class="spot">
      <style>
        /* The Hub launcher ("spot") — the picker shown at `/`. Every COLOR
           comes from a Web Awesome theme token so the page participates in
           the shared light/dark theme like the rest of the app (no bespoke
           light-only palette). The bespoke Control Panel TYPOGRAPHY is kept:
           the three self-hosted faces (Gestalte display, IBM Plex Sans body,
           IBM Plex Mono meta — all @font-face'd in styles.css) are named once
           here as scoped tokens so the launcher's type stays distinct from the
           WA default (Space Grotesk) and is customizable in one place. */
        .spot {
          --spot-font-display: "Gestalte", "Times New Roman", Georgia, serif;
          --spot-font-ui: "IBM Plex Sans", Helvetica, Arial, sans-serif;
          --spot-font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
          /* Carry the launcher's UI face into the Web Awesome components mounted
             inside it (wa-card / wa-input / wa-button read --wa-font-family-body),
             so the whole launcher — bespoke chrome AND WA controls — is IBM Plex
             Sans, not the app-wide Space Grotesk. Scoped to .spot, so it doesn't
             leak into WA-themed views elsewhere. */
          --wa-font-family-body: var(--spot-font-ui);
          position: relative; min-height: 100dvh;
          background: var(--wa-color-surface-default);
          color: var(--wa-color-text-normal);
          font-family: var(--spot-font-ui);
          display: flex; flex-direction: column; padding: 26px 38px 30px;
        }
        /* header: brand (logo + badge) left, New spot trigger right */
        .spot-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex: none; }
        .spot-brand { display: flex; align-items: center; gap: 12px; }
        /* The "tonk" wordmark — a display-scale heading (the `3xl` type token,
           ~41px, matching the deployed logo image's height so "tonk" dominates
           the "spot" badge). Live text, not an image, so it takes the theme ink
           and stays legible in dark mode; GestalteName is the dedicated wordmark
           cut (weight 500), lowercase. */
        .spot-logo { font-family: "GestalteName", "Gestalte", sans-serif;
          font-size: var(--wa-font-size-4xl); font-weight: 500; line-height: 1;
          text-transform: lowercase; color: var(--wa-color-text-normal); }
        /* The "spot" badge — a fixed yellow-green chip (the wireframe's one
           literal accent, #DEFF1A, identical in light and dark). The fill is
           bright in BOTH modes, so its text stays DARK for legibility (the app
           brand token's on-loud ink) rather than following the theme ink, which
           would go light-on-lime in dark mode. Not tied to the app brand token
           for the fill: the wireframe hardcodes this specific lime here. */
        .spot-badge { font-family: var(--spot-font-ui); font-weight: 600; font-size: 19px;
          line-height: 1.1; padding: 3px 11px; color: var(--wa-color-brand-on-loud); background: #DEFF1A; }
        /* Nav/trigger buttons ("+ new spot", close, back) are themed chrome
           INSIDE a driving <label>: the label toggles the wizard's paging
           radio via its `for`. The wa-button MUST NOT swallow the click (its
           shadow <button> would capture it and the radio would never toggle),
           so it is `pointer-events: none` and the label alone is interactive.
           Hover feedback is driven off the LABEL's :hover onto the button's
           base part, since the button can't receive :hover itself. */
        .spot-new, .onb-nav { cursor: pointer; }
        .spot-new wa-button, .onb-nav wa-button { pointer-events: none; }
        /* "+ new spot" reads as plain ink text at the wireframe size (18px);
           on hover the ink lifts to the brand accent (matching the wireframe's
           "+ new spot" affordance). */
        .spot-new wa-button { font-size: 18px; }
        .spot-new wa-button::part(base),
        .onb-nav wa-button::part(base) { color: var(--wa-color-text-normal); font-weight: 400; }
        .spot-new:hover wa-button::part(base),
        .onb-nav:hover wa-button::part(base) { color: var(--wa-color-brand-on-quiet); }
        /* list — vertically centered */
        .spot-list { flex: 1; display: flex; flex-direction: column; justify-content: center;
          gap: 0; max-width: 880px; width: 100%; margin: 0 auto; padding: 30px 0; }
        .spot-dir-head { font-family: var(--spot-font-display); font-size: 22px; font-weight: 700;
          letter-spacing: -.5px; color: var(--wa-color-text-normal); padding: 0 0 10px;
          border-bottom: var(--wa-border-width-s) solid var(--wa-color-text-normal); margin-bottom: 8px; }
        /* One row: sync dot + space name. The wireframe also lists owner /
           member-count / last-updated columns, but the profile's `space` model
           carries none of those facts (only subject/kind/status/name), so we
           show what we actually have rather than mock columns. No "open" label:
           the whole row is the link. */
        .srow { display: grid; grid-template-columns: 56px minmax(0,1fr); align-items: stretch;
          background: transparent; text-decoration: none; color: var(--wa-color-text-normal); }
        .srow > span { display: flex; align-items: center; padding: 18px 0; font-size: 15px; white-space: nowrap; }
        .srow-dot { justify-content: center; }
        .srow-name { padding-left: 4px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .srow:hover { background: var(--wa-color-neutral-fill-quiet); }
        .srow:hover .srow-open { color: var(--wa-color-brand-on-quiet); }
        /* hide the profile's self-replica row */
        .srow[data-kind="tonk:profile"] { display: none; }
        /* dim the row while the content branch is still seeding */
        .srow[data-status="tonk:blank"] .srow-name { opacity: .6; }
        .spot-untitled { color: var(--wa-color-text-quiet); }

        /* ── Create-spot wizard ─────────────────────────────────────────────
           A CSS-paged wizard driven by native radios (the guest WA bundle
           registers no <wa-radio-group>, so the radios stay native but every
           surface is a Web Awesome component or WA-token-styled). One radio
           group toggles the overlay: wiz-closed (default) hides it; wiz-start
           opens it at the start screen; wiz-tmpl/wiz-agent page within it. The
           overlay is a full-screen sheet over the launcher. */
        .spot-wiz { position: absolute; opacity: 0; pointer-events: none; }
        .spot-overlay { display: none; position: fixed; inset: 0; z-index: 50;
          background: var(--wa-color-surface-default); color: var(--wa-color-text-normal); }
        #wiz-start:checked ~ .spot-overlay,
        #wiz-tmpl:checked ~ .spot-overlay,
        #wiz-agent:checked ~ .spot-overlay { display: block; }
        /* chooser paging: the wiz radios (siblings of .spot-overlay) switch screens */
        .onb-screen { display: none; position: absolute; inset: 0; flex-direction: column;
          align-items: center; justify-content: center; gap: 34px; padding: 60px 40px; }
        #wiz-start:checked ~ .spot-overlay .onb-screen--start { display: flex; }
        #wiz-tmpl:checked ~ .spot-overlay .onb-screen--details,
        #wiz-agent:checked ~ .spot-overlay .onb-screen--details { display: flex; }
        .onb-tpl { display: none; }
        .onb-nav { position: absolute; top: 16px; }
        .onb-nav--close { right: 20px; }
        .onb-nav--back { left: 20px; }
        .onb-head { text-align: center; max-width: 560px; }
        .onb-kick { font-family: var(--spot-font-mono); font-size: 11.5px; letter-spacing: .13em;
          text-transform: uppercase; color: var(--wa-color-text-quiet); margin-bottom: 10px; }
        .onb-head h3 { font-family: var(--spot-font-display); font-weight: 300; font-size: 38px;
          letter-spacing: -1.3px; margin: 0 0 12px; color: var(--wa-color-text-normal);
          /* opt out of the global heading "headline-cover" dark box */
          background: none; padding: 0; display: block; }
        .onb-lede { font-size: 16px; line-height: 1.5; color: var(--wa-color-text-quiet); margin: 0; }
        /* Start-screen choices + template grid are Web Awesome cards wrapped
           in a <label> so a click toggles the driving radio. The card carries
           the surface/border/hover; the label only forwards the click. */
        .onb-choices { display: grid; grid-template-columns: repeat(2, minmax(0,300px)); gap: 18px; }
        /* The template picker: a grid of card <label>s (2x2 at four
           templates), shown once the template path is chosen. */
        .onb-grid { display: none; grid-template-columns: repeat(2, minmax(0,280px));
          gap: 18px; justify-content: center; }
        #wiz-tmpl:checked ~ .spot-overlay .onb-grid { display: grid; }
        /* Screen-1 choice cards: a <label> wrapping a wa-card. The wa-card owns
           the surface/border; the label forwards the click to the paging radio. */
        /* Brutalist card hover (from the wireframe): a hard, un-blurred offset
           drop-shadow plus a 1px nudge up-left, so the card reads as physically
           lifting off the page. The shadow colour is the theme's own text ink
           (`--wa-color-text-normal`) mixed down to a low alpha — so it's dark on
           the light surface and light on the dark surface automatically, the
           same lift in both modes, with no hard-coded rgb. Matches the
           wireframe's `6px 6px 0 rgba(0,0,0,.14)` in light mode. */
        .spot { --onb-lift-shadow: 6px 6px 0
          color-mix(in srgb, var(--wa-color-text-normal) 15%, transparent); }
        .onb-card, .onb-tcard {
          transition: transform .12s ease, box-shadow .12s ease;
        }
        .onb-tcard:hover {
          transform: translate(-1px, -1px);
          box-shadow: var(--onb-lift-shadow);
        }
        /* The <label> wrapper hugs the wa-card (block, full height), so the
           brutalist lift shadow rides on the LABEL itself — the global
           `wa-card { box-shadow: none }` reset would otherwise swallow a shadow
           set on the card. */
        .onb-card { display: block; cursor: pointer; }
        .onb-card wa-card { height: 100%; display: block; }
        .onb-card wa-card::part(body) { display: flex; flex-direction: column; gap: 8px; }
        .onb-card:hover {
          transform: translate(-1px, -1px);
          box-shadow: var(--onb-lift-shadow);
        }
        /* Template card: a bordered box laid out as a column. Hover lifts it
           (shared brutalist shadow above); the CHECKED radio paints its card
           with the brand lime (fill + border + dark ink) so the selected
           template is unmistakable — clearly distinct from the hover lift. */
        .onb-tcard { display: flex; flex-direction: column; gap: 8px; cursor: pointer;
          padding: var(--wa-space-l); text-align: left;
          border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          background: var(--wa-color-surface-default); }
        /* Selected template: mostly just a brand-coloured border, with only the
           faintest brand wash behind it (a low-alpha mix, not the solid
           `brand-fill-quiet`, which read too green — especially in dark mode).
           Reads as "chosen" without a loud fill. The radios sit just before
           .onb-grid inside the details screen, so the checked one reaches its
           card via the general-sibling combinator into the grid. */
        #tpl-wiki:checked   ~ .onb-grid .onb-tcard[data-for="tpl-wiki"],
        #tpl-sheets:checked ~ .onb-grid .onb-tcard[data-for="tpl-sheets"],
        #tpl-board:checked  ~ .onb-grid .onb-tcard[data-for="tpl-board"],
        #tpl-blank:checked  ~ .onb-grid .onb-tcard[data-for="tpl-blank"] {
          border-color: var(--wa-color-brand-fill-loud);
          box-shadow: inset 0 0 0 1px var(--wa-color-brand-fill-loud);
          background: color-mix(in srgb, var(--wa-color-brand-fill-loud) 8%, var(--wa-color-surface-default));
        }
        .onb-card__name { font-family: var(--spot-font-display); font-weight: 400; font-size: 22px;
          letter-spacing: -.4px; color: var(--wa-color-text-normal); }
        .onb-card__desc { font-size: 13.5px; line-height: 1.45; color: var(--wa-color-text-quiet); }
        .onb-card__cta { font-family: var(--spot-font-mono); font-size: 12.5px;
          color: var(--wa-color-text-quiet); margin-top: 4px; }
        .onb-card:hover .onb-card__cta { color: var(--wa-color-brand-on-quiet); }
        /* Illustrative art blocks (schematic previews). All strokes/fills come
           from neutral/brand tokens so they invert with the theme. */
        .onb-art { height: 78px; margin-bottom: 6px; display: flex; align-items: center;
          justify-content: center; gap: 12px; overflow: hidden;
          border: var(--wa-border-width-s) solid var(--wa-color-surface-border); }
        /* Both schematic-art backgrounds are quiet neutral surfaces — the loud
           brand tint read as distracting here. The template one is a touch
           lowered so the two choices still differ subtly. */
        .onb-art--tmpl { background: var(--wa-color-surface-lowered); }
        .onb-art--agent { background: var(--wa-color-neutral-fill-quiet); }
        .onb-swatch { width: 30px; height: 46px; background: var(--wa-color-surface-default);
          border: var(--wa-border-width-s) solid var(--wa-color-text-normal); }
        .onb-lines { display: flex; flex-direction: column; gap: 7px; width: 96px; }
        .onb-lines i { height: 6px; background: var(--wa-color-text-normal); opacity: .5; display: block; }
        .onb-lines i:last-child { width: 62%; }
        .onb-prompt { display: flex; flex-direction: column; gap: 7px; width: 150px; padding: 0 8px; }
        .onb-prompt i { height: 6px; background: var(--wa-color-text-normal); opacity: .7; display: block; }
        .onb-prompt i:nth-child(2) { width: 88%; } .onb-prompt i:nth-child(3) { width: 72%; }
        .onb-prompt i:last-child { width: 40%; opacity: .4; }
        .tmpl__art { height: 96px; margin-bottom: 6px; display: flex; align-items: center;
          justify-content: center; overflow: hidden;
          border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
          background: var(--wa-color-surface-lowered); }
        .tmpl__art--wiki { align-items: flex-start; flex-direction: column; gap: 8px; padding: 18px 20px; }
        .tmpl__art--wiki .title { width: 112px; height: 14px; background: var(--wa-color-text-normal);
          display: block; margin-bottom: 2px; }
        .tmpl__art--wiki i { height: 7px; background: var(--wa-color-neutral-fill-normal); display: block; width: 100%; }
        .tmpl__art--wiki i:nth-of-type(4) { width: 72%; }
        .tmpl__art--board { align-items: flex-start; gap: 10px; padding: 16px 18px; }
        .tmpl__art--board .col { flex: 1; display: flex; flex-direction: column; gap: 7px; }
        .tmpl__art--board .col i { display: block; width: 100%; height: 12px;
          background: var(--wa-color-neutral-fill-normal); }
        .tmpl__art--board .col i.tall { height: 30px; }
        .tmpl__art--sheets { padding: 20px 22px; }
        .tmpl__art--sheets .grid { width: 100%; height: 54px; display: block;
          background:
            linear-gradient(var(--wa-color-neutral-fill-normal) 1.5px, transparent 1.5px) 0 0 / 100% 18px,
            linear-gradient(90deg, transparent calc(33.333% - .75px), var(--wa-color-neutral-fill-normal) calc(33.333% - .75px), var(--wa-color-neutral-fill-normal) calc(33.333% + .75px), transparent calc(33.333% + .75px), transparent calc(66.666% - .75px), var(--wa-color-neutral-fill-normal) calc(66.666% - .75px), var(--wa-color-neutral-fill-normal) calc(66.666% + .75px), transparent calc(66.666% + .75px));
          border-bottom: var(--wa-border-width-s) solid var(--wa-color-neutral-fill-normal); }
        .onb-agent-note { display: none; text-align: center; }
        #wiz-agent:checked ~ .spot-overlay .onb-agent-note { display: block; }
        .onb-fields { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 620px; }
      </style>

      <!-- wizard state radio group: closed by default; each open state is a
           distinct screen so "New spot" (→ wiz-start) always resets to start -->
      <input class="spot-wiz" type="radio" name="__wiz" id="wiz-closed" checked>
      <input class="spot-wiz" type="radio" name="__wiz" id="wiz-start">
      <input class="spot-wiz" type="radio" name="__wiz" id="wiz-tmpl">
      <input class="spot-wiz" type="radio" name="__wiz" id="wiz-agent">

      <header class="spot-top">
        <div class="spot-brand">
          <span class="spot-logo">tonk</span>
          <span class="spot-badge">spot</span>
        </div>
        <!-- The <label> drives the wiz-start radio; the wa-button is styled
             chrome inside it (pointer-events flow to the label). Neutral+plain
             so it reads as plain ink text ("+ new spot"), matching the
             wireframe — not the brand lime, which read as a small green pill. -->
        <label class="spot-new" for="wiz-start">
          <wa-button variant="neutral" appearance="plain">
            <wa-icon slot="start" name="plus"></wa-icon>new spot
          </wa-button>
        </label>
      </header>

      <div class="spot-list">
        <div class="spot-dir-head">Directory</div>
        <!-- `data-id={this}` designates the repeat row; `with={subject}`
             gives every consumer in the row its routing context — the
             space's repo DID from the record's `subject` FIELD, not the
             record entity itself (`{this}` is the `tonk:space` row, a
             derived entity that names no repository). A bare repo means
             its main branch; honored because the profile site is
             `allow="*"`. -->
        <a class="srow" href="/space/{subject}" data-kind={kind} data-status={status} data-id={this} with={subject}>
          <span class="srow-dot"><ui-sync-status></ui-sync-status></span>
          <span class="srow-name">
            <tonk-display entity={subject} model=tonk:repository view=tonk:view/label>
              <span slot="no-entity" class="spot-untitled" hidden>Untitled</span>
              <span slot="no-model" class="spot-untitled" hidden>Untitled</span>
              <span slot="no-view" class="spot-untitled" hidden>Untitled</span>
              <span slot="loading" class="spot-untitled" hidden>Untitled</span>
            </tonk-display>
          </span>
        </a>
      </div>

      <div class="spot-overlay">
        <form class="onb-overlay-body" onsubmit=space/create data-close-radio="wiz-closed">
          <input type="hidden" name="remote" value="">
          <tonk-default-remote field="remote" auto></tonk-default-remote>

          <!-- Screen 1: start chooser (navigation only, no submit) -->
          <div class="onb-screen onb-screen--start">
            <label class="onb-nav onb-nav--close" for="wiz-closed">
              <wa-button variant="neutral" appearance="plain" size="small">close</wa-button>
            </label>
            <div class="onb-head">
              <div class="onb-kick">new spot</div>
              <h3>How do you want to start?</h3>
              <p class="onb-lede">Seed a ready-made layout, or start blank and hand the spot to an agent.</p>
            </div>
            <div class="onb-choices">
              <label class="onb-card" for="wiz-tmpl">
                <wa-card appearance="outlined">
                  <div class="onb-art onb-art--tmpl">
                    <div class="onb-swatch"></div>
                    <div class="onb-lines"><i></i><i></i><i></i></div>
                  </div>
                  <div class="onb-card__name">From a template</div>
                  <div class="onb-card__desc">Seed the view with a ready-made layout.</div>
                  <div class="onb-card__cta">choose a template &rsaquo;</div>
                </wa-card>
              </label>
              <label class="onb-card" for="wiz-agent">
                <wa-card appearance="outlined">
                  <div class="onb-art onb-art--agent">
                    <div class="onb-prompt"><i></i><i></i><i></i><i></i></div>
                  </div>
                  <div class="onb-card__name">Build with an agent</div>
                  <div class="onb-card__desc">Start blank; hand the spot to an agent from inside it.</div>
                  <div class="onb-card__cta">name it &rsaquo;</div>
                </wa-card>
              </label>
            </div>
          </div>

          <!-- Screen 2: details — the only submit. Name (required, visible)
               + template picker (template path) or agent note (agent path). -->
          <div class="onb-screen onb-screen--details">
            <label class="onb-nav onb-nav--back" for="wiz-start">
              <wa-button variant="neutral" appearance="plain" size="small">
                <wa-icon slot="start" name="angle-left"></wa-icon>back
              </wa-button>
            </label>
            <label class="onb-nav onb-nav--close" for="wiz-closed">
              <wa-button variant="neutral" appearance="plain" size="small">close</wa-button>
            </label>
            <div class="onb-head">
              <div class="onb-kick">new spot</div>
              <h3>Name your spot</h3>
            </div>
            <!-- Template picker. Native radios drive a 3-up grid of card
                 <label>s (reliable side-by-side layout, matching the
                 wireframe); the checked radio paints its card with the brand
                 lime so the selection is unmistakable. The radios feed the form
                 as `template`; blank is the default. -->
            <input class="onb-tpl" type="radio" name="template" value="blank" id="tpl-blank" checked>
            <input class="onb-tpl" type="radio" name="template" value="sheets" id="tpl-sheets">
            <input class="onb-tpl" type="radio" name="template" value="wiki" id="tpl-wiki">
            <input class="onb-tpl" type="radio" name="template" value="board" id="tpl-board">
            <div class="onb-grid">
              <label class="onb-tcard" data-for="tpl-wiki" for="tpl-wiki">
                <div class="tmpl__art tmpl__art--wiki">
                  <span class="title"></span><i></i><i></i><i></i><i></i>
                </div>
                <div class="onb-card__name">Wiki</div>
                <div class="onb-card__desc">Linked pages of editable blocks, with comments.</div>
              </label>
              <label class="onb-tcard" data-for="tpl-sheets" for="tpl-sheets">
                <div class="tmpl__art tmpl__art--sheets"><span class="grid"></span></div>
                <div class="onb-card__name">Sheets</div>
                <div class="onb-card__desc">A tabbed workspace of artifacts.</div>
              </label>
              <label class="onb-tcard" data-for="tpl-board" for="tpl-board">
                <div class="tmpl__art tmpl__art--board">
                  <div class="col"><i class="tall"></i><i></i></div>
                  <div class="col"><i></i><i></i><i></i></div>
                  <div class="col"><i></i><i class="tall"></i></div>
                </div>
                <div class="onb-card__name">Board</div>
                <div class="onb-card__desc">Columns of text, checklist and table cards on a pannable canvas.</div>
              </label>
              <label class="onb-tcard" data-for="tpl-blank" for="tpl-blank">
                <div class="onb-card__name">Blank</div>
                <div class="onb-card__desc">An empty canvas to build by hand or with an agent.</div>
              </label>
            </div>
            <p class="onb-agent-note onb-lede">An agent will build this spot from a blank canvas.</p>
            <div class="onb-fields">
              <wa-input name="name" label="Spot name" placeholder="e.g. pictures" autocomplete="off" required></wa-input>
              <wa-button type="submit" variant="brand">Create spot</wa-button>
            </div>
          </div>
        </form>
      </div>
    </div>

# ============================================================
# FAB — floating action button view (rendered in the FAB portal iframe)
# ============================================================
#
# These declarations live on profile/meta because the FAB portal is
# scoped to the profile branch (`with="meta@profile:tonk"`). The
# guest renders `tonk:profile/fab` via a `<tonk-display>` mounted
# by the shell's FAB portal content string.
#
# Identity note (V1 — not yet wired): the FAB portal `content` string in
# core.yaml embeds only `data-space`; `data-did` and `data-name` are NOT
# embedded. The `did={dom.host/data-did}` and `{dom.host/data-name}`
# template slots below are placeholders that render empty until a follow-up
# wires the worker to stamp `state:self` identity onto the profile/meta
# branch and the shell to embed those values in the portal content string.

# The FAB concept — a structural marker; the view reads all display
# values directly from the host element's data attributes via the
# `{dom.host/data-*}` template escape hatch (the same mechanism the
# invite-link and agent-prompt views use for `data-base`/`data-page`).
# The outer shell view template embeds `{space}` (from the site entity)
# plus identity fields into the `<tonk-display>` element's `data-*`
# attributes inside the portal content string, so the FAB view template
# reads them back as `{dom.host/data-space}` etc.
concept!: &profile/fab
  this: tonk:profile/fab
  description: The FAB overlay view (profile-sourced workspace chrome).
  with:
    space:
      description: >
        The active space name. The FAB portal content string (in the shell
        view) embeds `{space}` from the site entity as `data-space` on the
        `<tonk-display>` element; the view template reads it back as
        `{dom.host/data-space}`. Declared here so the concept body satisfies
        the analyzer's at-least-one-field requirement — the field is not
        resolved from the branch DB.
      the: xyz.tonk.site/space
      cardinality: one
      as: text

# A compact space-list view kind for the FAB switcher. Its `display`
# template lives under `xyz.tonk.view/fab-menu` — a distinct RDF
# attribute from `xyz.tonk.view/directory` (used by `tonk:view/directory`)
# — so a model can carry both a full Hub directory and this compact roster
# without the two colliding when queried. `<tonk-display>` selects it
# explicitly via `view=tonk:view/fab-menu`.
concept!: &view/fab-menu
  this: tonk:view/fab-menu
  description: A compact space-list view kind for the FAB space switcher.
  with:
    model:
      description: Concept this view renders
      the: xyz.tonk.view/model
      cardinality: one
      as: entity
    display:
      description: HTML template for the FAB compact space menu
      the: xyz.tonk.view/fab-menu
      cardinality: one
      as: text

# The FAB compact space roster — one anchor per `tonk:space` instance,
# linking to `/space/{subject}` (the space DID, same as the Hub uses).
# Rendered inside the FAB chrome's `.fab__menu` via
# `<tonk-display model="space" view="tonk:view/fab-menu">`.
view/fab-menu!:
  this: id:tonk:fab/space-menu
  model: space
  display: |
    <a class="fab__menu-item" href="/space/{subject}" with={subject}><tonk-display entity={subject} model=tonk:repository view=tonk:view/label><span slot="no-entity">Untitled</span><span slot="no-model">Untitled</span><span slot="no-view">Untitled</span><span slot="loading">…</span></tonk-display></a>

# The member's display name, read directly from THIS (profile meta) branch —
# the durable `ProfileName` override the worker stamps on `profile/rename`
# (attribute `xyz.tonk.profile/display-name`, keyed by the profile DID). The
# FAB is sealed to the profile/meta branch, so unlike the space roster's names
# (which live in each space's own repo and are unreachable from the sealed
# guest) this one is an ordinary in-branch read. Absent until the user renames
# (the worker's `petname` fallback is computed, not persisted), so the bar's
# name slot renders empty until a name is set.
concept!: &profile/name
  this: tonk:profile/name
  description: The member's display-name override on the profile meta branch.
  with:
    name:
      description: The chosen display name (xyz.tonk.profile/display-name).
      the: xyz.tonk.profile/display-name
      cardinality: one
      as: text

# Rename the signed-in member (set their display name). Lives here as well as
# in core.yaml because the FAB is sealed to the profile/meta branch: the
# guest's `<tonk-display>` resolves the command's concept descriptor by a
# phase-1 lookup against THIS branch (seeded from the lean profile.yaml), so
# the command must be present here for the editable's `onchange=profile/rename`
# to fire. The worker's globally-registered `ProfileRenameHandler` does the
# work (persist `ProfileName`, restamp `MemberName` across every space's
# roster, republish self-identity) — this descriptor only has to decode the
# new name and the `tonk:profile` marker that distinguishes it from the repo
# rename, which shares the same `dom.event.current-target` shape.
command!: &profile/rename
  description: Rename the signed-in member (set their display name).
  with:
    name:
      description: The new name, read from the editable's value on commit.
      the: dom.event.current-target/value
      as: text
    marker:
      description: Per-command marker (data-rename) distinguishing this from repo rename.
      the: dom.event.current-target.dataset/rename
      as: entity

# A no-entity directory view over the single profile-name row → an inline
# editable bound to the name. Mounted in the FAB bar via
# `<tonk-display model="tonk:profile/name">`. The `<tonk-editable>` commits on
# Enter/blur (Escape cancels), firing `onchange=profile/rename`; the
# `data-rename="tonk:profile"` marker distinguishes it from the repository
# rename. Identical in shape to the topbar identity chip in core.yaml.
view/directory!:
  this: id:tonk:profile/name-view
  model: tonk:profile/name
  display: |
    <tonk-editable
      class="fab__name-input"
      value={name}
      data-rename="tonk:profile"
      onchange=profile/rename
      aria-label="Your name"
    ></tonk-editable>

# A directory view (no entity): the FAB portal mounts
# `<tonk-display model=tonk:profile/fab>` with no entity, so this
# directory view resolves. Space + identity arrive as `data-*` host
# attributes on the `<tonk-display>` element in the portal content.
view/directory!: &profile/fab/view
  this: id:tonk:profile/fab/view
  model: tonk:profile/fab
  display: |
    <tonk-fab>
      <div class="fab">
        <!-- LEFT CAP — the grab handle. A round-left segment (36×36) holding
             the live sync ring: the same host-chrome `<ui-sync-status>` element
             the Hub cards use, scoped to the active space's branch
             (`{dom.host/data-space}`, the space DID the shell embeds — same
             context the repo-name display below uses). It subscribes to the
             space's `state:here` sync status and updates as the background drain
             reconciles. When collapsed the whole bar shrinks to just this cap
             (a floating disc); dragging grabs it. `.fab__circle` sizes the disc. -->
        <span class="fab__seg fab__cap-l fab__circle"><ui-sync-status with={dom.host/data-space}></ui-sync-status></span>
        <!-- Hidden pause-sync form, submitted by alt/option-click on the cap
             (element.rs). Lives in a SPACE-branch view (core.yaml's
             `tonk:view/fab-pause`) mounted inside the space's `with` context —
             so its `onsubmit=tonk:pause-sync` binding both resolves its
             descriptor AND routes its claim to the space's content branch,
             where the worker's handler flips the durable preference. The
             cap's `<ui-sync-status>` ring shows the resulting paused state. -->
        <tonk-display class="fab__pause" with={dom.host/data-space} model="tonk:repository" view="tonk:view/fab-pause" hidden></tonk-display>
        <!-- ACCOUNT — its own segment (wireframe's `mr_oats`): the signed-in
             profile name, an inline editable that renames the profile. Shown
             whenever the bar is expanded (no disclosure gate). -->
        <span class="fab__seg fab__account">
          <span class="fab__name"><tonk-display model="tonk:profile/name"></tonk-display></span>
        </span>
        <!-- SPOT — its own segment (wireframe's `myspace`): the active space's
             repo name, and the switcher menu (opened on click). Read from — and
             renamed on — the space's OWN repository (the cross-device source of
             truth). A `with={DID}` context opens that space's
             routing context; omitting `view=` resolves the repository's DEFAULT
             entity view, `tonk:repository/name-view` (core.yaml), an inline
             `<tonk-editable value={name} data-subject={this}
             onchange=tonk/rename-repository>` — the same chip the workspace
             topbar uses. Committing (Enter/blur) fires `tonk/rename-repository`
             against this nested space branch, and its declarative rule writes
             the new name there (no worker handler). `{dom.host/data-space}` is the
             active space's subject DID, embedded by the shell on the portal
             `<tonk-display>` and readable from chrome (a zero-instance directory
             view feeds chrome a host-only conclusion; see tonk-display). -->
        <span class="fab__seg fab__repo">
          <span class="fab__space">
            <tonk-display with={dom.host/data-space} entity={dom.host/data-space} model=tonk:repository><span slot="no-entity">Untitled</span><span slot="no-model">Untitled</span><span slot="loading">…</span></tonk-display>
          </span>
          <ui-dropdown class="fab__menu" exclude={dom.host/data-space}>
            <tonk-display model="space" view="tonk:view/fab-menu"></tonk-display>
            <a class="fab__menu-item fab__menu-item--action" href="/">
              <span class="fab__menu-glyph" aria-hidden="true">↰</span> all spots
            </a>
            <button class="fab__menu-item fab__menu-item--action" type="button" data-dialog="open fab-space-create">
              <span class="fab__menu-glyph" aria-hidden="true">+</span> new
            </button>
          </ui-dropdown>
        </span>
        <!-- Share / invite. Like the repo switcher, this is a hover zone: the
             bar shows "share" until an invite is minted, hovering reveals the
             member roster, and once minted the bar shows the invite link with a
             copy button. The invite and the roster both live on the SPACE's OWN
             content branch (the cross-device source of truth) — `tonk:invite`,
             `tonk:agent-invite`, `tonk:member` and the two compact `fab-*` views
             are seeded by core.yaml there, not on this profile/meta branch — so,
             exactly like the repo-name chip above, they are reached through a
             `with={DID}` context that opens the space's routing
             context (honored because the FAB portal allows `*`). Clicking "share"
             submits the hidden `fab-invite-form`, firing `tonk:invite`; the
             worker's InviteHandler mints the membership keypair + delegation
             against this nested space branch (its origin repo). `<tonk-origin>`
             supplies `{origin}/join` as `data-base` for the copyable URL. -->
        <span class="fab__seg fab__share" with={dom.host/data-space}>
            <tonk-origin>
              <!-- The minted invite link. Shown once the mint lands; before
                   that `tonk:agent-invite` does not resolve and the empty
                   hidden fallbacks suppress tonk-display's built-in absence
                   callout, so the bar shows only the "share" button below.
                   When it resolves the display sets `data-state="ready"`, and
                   the CSS sibling rule hides the button so the bar shows just
                   the link + copy. `bind:base` supplies `{origin}/join`. -->
              <tonk-display class="fab__invite-display" entity={dom.host/data-space} model=tonk:agent-invite view=tonk:view/fab-invite bind:base="data-base">
                <span slot="no-entity" hidden></span>
                <span slot="no-model" hidden></span>
                <span slot="loading" hidden></span>
              </tonk-display>
              <!-- The mint trigger. The "share" form lives in a SPACE-branch
                   view (core.yaml's `tonk:repository` directory view), mounted
                   here no-entity inside the nested `with` context — so its
                   `onsubmit=tonk:invite` binding both resolves its descriptor
                   AND dispatches its claim on the SPACE's content branch, where
                   the worker's InviteHandler mints for that repo. (Binding it in
                   the FAB's own profile/meta template instead dispatched the
                   claim to profile/meta with an empty origin repo.) Directory
                   chrome renders regardless of whether the repo is named, so the
                   "share" button is always present. -->
              <tonk-display class="fab__share-mint" model="tonk:repository"></tonk-display>
            </tonk-origin>
            <nav class="fab__menu fab__share-menu">
              <tonk-display model="tonk:member" view="tonk:view/fab-roster"></tonk-display>
            </nav>
        </span>
        <!-- RIGHT CAP — a plain rounded end cap that always closes the bar
             (wireframe §01: the bar's far edge rounds off). It carries no
             control (the wireframe hangs its colour-mode toggle here; we omit
             that), so the bar reads as a finished pill. -->
        <span class="fab__seg fab__cap-r fab__end" aria-hidden="true"></span>
      </div>
      <!-- Create-space modal. Lives inside `<tonk-fab>` so the guest's
           `wa-show`/`wa-after-hide` listeners (element.rs `attach_modal`) drive
           the iframe overlay, and so the `space/create` command + the
           `<tonk-default-remote>` resolves the default sync URL on this same
           profile/meta branch.
           Mirrors the Hub's create dialog (the directory view above). -->
      <wa-dialog id="fab-space-create" label="New spot" class="fab__dialog">
        <form id="fab-space-create-form" class="fab__form wizard" onsubmit=space/create data-close-dialog>
          <style>
            /* CSS-paged wizard: a hidden radio per screen drives which
               .wizard__screen shows. The form submits once at the end, so
               every control (name, template, hidden remote) is in the same form
               and read via dom.event.current-target.elements.* . */
            .wizard__nav { position: absolute; opacity: 0; pointer-events: none; }
            .wizard__screen { display: none; flex-direction: column; gap: var(--wa-space-m); }
            #wiz-start:checked    ~ .wizard__screen--start    { display: flex; }
            #wiz-template:checked ~ .wizard__screen--template { display: flex; }
            .wizard__cards { display: flex; gap: var(--wa-space-m); }
            .wizard__card {
              flex: 1; display: block; padding: var(--wa-space-l);
              border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
              border-radius: var(--wa-border-radius-m); cursor: pointer; text-align: left;
              font: inherit; background: var(--wa-color-surface-default);
            }
            .wizard__card:hover { border-color: var(--wa-color-text-normal); }
            .wizard__art {
              height: 84px; border: var(--wa-border-width-s) solid var(--wa-color-surface-border);
              margin-block-end: var(--wa-space-s); display: flex; align-items: center;
              justify-content: center; background: var(--wa-color-surface-lowered); overflow: hidden;
            }
            .wizard__art--wiki {
              align-items: flex-start; flex-direction: column; gap: var(--wa-space-2xs);
              padding: var(--wa-space-m);
            }
            .wizard__art--wiki .title {
              width: 42%; height: 10px; background: var(--wa-color-text-normal);
              display: block; margin-block-end: var(--wa-space-3xs);
            }
            .wizard__art--wiki i {
              height: 5px; width: 100%; display: block; background: var(--wa-color-neutral-fill-normal);
            }
            .wizard__art--wiki i:nth-of-type(4) { width: 72%; }
            .wizard__art--board {
              align-items: flex-start; gap: var(--wa-space-2xs); padding: var(--wa-space-m);
            }
            .wizard__art--board .col {
              flex: 1; display: flex; flex-direction: column; gap: var(--wa-space-2xs);
            }
            .wizard__art--board .col i {
              display: block; width: 100%; height: 9px;
              background: var(--wa-color-neutral-fill-normal);
            }
            .wizard__art--board .col i.tall { height: 22px; }
            .wizard__art--sheets { padding: var(--wa-space-m); }
            .wizard__art--sheets .grid {
              width: 100%; height: 42px; display: block;
              background:
                linear-gradient(var(--wa-color-neutral-fill-normal) 1px, transparent 1px) 0 0 / 100% 14px,
                linear-gradient(90deg, transparent calc(33.333% - .5px), var(--wa-color-neutral-fill-normal) calc(33.333% - .5px), var(--wa-color-neutral-fill-normal) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), var(--wa-color-neutral-fill-normal) calc(66.666% - .5px), var(--wa-color-neutral-fill-normal) calc(66.666% + .5px), transparent calc(66.666% + .5px));
              border-bottom: 1px solid var(--wa-color-neutral-fill-normal);
            }
            /* Highlight the chosen template card so the selection is legible. */
            #tpl-sheets:checked ~ .wizard__screen--template label[for="tpl-sheets"],
            #tpl-wiki:checked   ~ .wizard__screen--template label[for="tpl-wiki"],
            #tpl-board:checked  ~ .wizard__screen--template label[for="tpl-board"],
            #tpl-blank:checked  ~ .wizard__screen--template label[for="tpl-blank"] {
              border-color: var(--wa-color-text-normal);
              box-shadow: inset 0 0 0 1px var(--wa-color-text-normal);
            }
            .wizard__card h3 { margin: 0 0 var(--wa-space-2xs); font-size: var(--wa-font-size-l); max-width: 100%; }
            .wizard__card p { margin: 0; font-size: var(--wa-font-size-s); color: var(--wa-color-text-quiet); }
            .wizard__template { display: none; }
          </style>

          <!-- screen radios -->
          <input class="wizard__nav" type="radio" name="__wizard" id="wiz-start" checked>
          <input class="wizard__nav" type="radio" name="__wizard" id="wiz-template">

          <!-- the chosen template, carried into space/create; default blank -->
          <input class="wizard__template" type="radio" name="template" value="blank" id="tpl-blank" checked>
          <input class="wizard__template" type="radio" name="template" value="sheets" id="tpl-sheets">
          <input class="wizard__template" type="radio" name="template" value="wiki" id="tpl-wiki">
          <input class="wizard__template" type="radio" name="template" value="board" id="tpl-board">
          <input type="hidden" name="remote" value="">
          <tonk-default-remote field="remote" auto></tonk-default-remote>

          <!-- Screen 1: name + how to start -->
          <div class="wizard__screen wizard__screen--start">
            <wa-input name="name" label="Spot name" placeholder="e.g. pictures" autocomplete="off" autofocus required></wa-input>
            <div class="wizard__cards">
              <label class="wizard__card" for="wiz-template">
                <h3>Start from a template</h3>
                <p>Seed the view with a ready-made layout.</p>
              </label>
              <label class="wizard__card" for="fab-agent-submit">
                <h3>Build with an agent</h3>
                <p>Start blank; hand the spot to an agent from inside it.</p>
              </label>
              <!-- Hidden submit the card's <label> drives, so the card renders
                   like the sibling <label> cards. A native <button> laid its
                   heading's dark box outside the card border. -->
              <input type="submit" id="fab-agent-submit" form="fab-space-create-form"
                     style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;">
            </div>
          </div>

          <!-- Screen 2: pick a template -->
          <div class="wizard__screen wizard__screen--template">
            <div class="wizard__cards">
              <label class="wizard__card" for="tpl-wiki">
                <div class="wizard__art wizard__art--wiki">
                  <span class="title"></span><i></i><i></i><i></i><i></i>
                </div>
                <h3>Wiki</h3>
                <p>Linked pages of editable blocks, with comments.</p>
              </label>
              <label class="wizard__card" for="tpl-sheets">
                <div class="wizard__art wizard__art--sheets"><span class="grid"></span></div>
                <h3>Sheets</h3>
                <p>A tabbed workspace of artifacts.</p>
              </label>
              <label class="wizard__card" for="tpl-board">
                <div class="wizard__art wizard__art--board">
                  <div class="col"><i class="tall"></i><i></i></div>
                  <div class="col"><i></i><i></i><i></i></div>
                  <div class="col"><i></i><i class="tall"></i></div>
                </div>
                <h3>Board</h3>
                <p>Columns of cards on a pannable canvas.</p>
              </label>
              <label class="wizard__card" for="tpl-blank">
                <h3>Blank</h3>
                <p>An empty canvas to build by hand or with an agent.</p>
              </label>
            </div>
            <wa-button type="submit" form="fab-space-create-form" variant="primary">Create spot</wa-button>
            <label for="wiz-start" class="wizard__card" style="text-align:center;">&lsaquo; back to start options</label>
          </div>
        </form>
        <wa-button slot="footer" variant="neutral" appearance="plain" data-dialog="close">Cancel</wa-button>
      </wa-dialog>
      <style>
        :host, tonk-fab { display: block; }

        /* ── Docking ──────────────────────────────────────────────────────
           The FAB rests in one of the four corners. element.rs decides which on
           drop (and on restore) and sets two axis classes on `<tonk-fab>` — a
           vertical (`fab-dock-top`/`fab-dock-bottom`) and a horizontal
           (`fab-dock-left`/`fab-dock-right`) — so each edge is pinned
           independently; the pixel placement lives HERE so it's declarative and
           resize-robust (a class pins to the edge; a fixed px offset would
           drift). During a drag element.rs drops the classes and drives inline
           `left`/`top` to track the pointer, so these only take effect at rest.
           `position: fixed` is set inline by element.rs. */
        tonk-fab.fab-dock-top    { top: 16px; bottom: auto; }
        tonk-fab.fab-dock-bottom { top: auto; bottom: 16px; }
        tonk-fab.fab-dock-left   { left: 16px; right: auto; }
        tonk-fab.fab-dock-right  { left: auto; right: 16px; }

        /* ── SEGMENTED CONTROL BAR (matches the "Control Panel" wireframe) ────
           The bar is NOT one solid pill: it is a row of independent segments
           (`.fab__seg`) separated by 2px gaps, so the page shows between them.
           `.fab` itself is transparent and only carries the drop-shadow; each
           segment paints its own `--fab-pill` surface. End caps
           (`.fab__cap-l` / `.fab__cap-r`) round the outer corners; the middle
           segments are square. Sized to the wireframe: 36px tall, 2px gaps. */
        .fab {
          display: inline-flex;
          align-items: stretch;
          gap: 2px;
          block-size: 36px;
          /* INVERTED against the page (wireframe): a bright pill on a dark page,
             a dark pill on a light page — the segments contrast the page rather
             than blending into it. `--wa-color-text-normal` is the theme ink
             (dark-in-light / light-in-dark), so it IS the inverted surface: use
             it as the pill fill, softened a touch toward white for the
             wireframe's warm-cream feel. Its inverse `--wa-color-surface-default`
             is then the readable INK on the pill (`--fab-ink`). Popout children
             (dropdown, roster) keep their own surface + theme ink — off-bar. */
          --fab-pill-solid: color-mix(in oklab, var(--wa-color-text-normal, #eee) 90%, #ffffff);
          /* TRANSLUCENT SURFACE. The pill is now semi-opaque (~80%) so the space
             beneath shows faintly through it, bonding the bar to the content
             rather than pasting it flat on top — the wireframe's translucent pill
             (`rgba(255,255,255,.83)` / `rgba(40,40,33,.78)`). No `backdrop-filter`
             blur: the FAB renders in a sealed, transparent `srcdoc` overlay iframe,
             so a blur inside it would only sample the iframe's own empty document,
             never the parent shell's space content behind it — translucency is
             what actually reads through the transparent overlay. `--fab-pill` is
             the resting surface; `--fab-pill-hover` is the more-solid (more
             opaque) surface a segment lifts to on hover — brighter on a dark
             theme, deeper on a light one (the wireframe's `--pill-2`). */
          --fab-pill: color-mix(in oklab, var(--fab-pill-solid) 80%, transparent);
          --fab-pill-hover: color-mix(in oklab, var(--fab-pill-solid) 92%, transparent);
          --fab-ink: var(--wa-color-surface-default, #1a1a1a);
          /* The FAB is set in IBM Plex Sans Condensed throughout — the app's
             display face (already shipped + inlined into the sealed iframe by
             the portal bridge), condensed so the bar stays tight. */
          font-family: "IBM Plex Sans Condensed", var(--wa-font-family-heading, sans-serif);
          font-size: 16px;
          white-space: nowrap;
          position: relative;
          cursor: grab;
          /* Layered drop-shadow for more depth than the original single soft
             blur: a tight contact shadow crisps the pill's edge against the page,
             a wider soft shadow floats it well clear of the content, so the bar
             sits proud rather than melting into it. `drop-shadow` follows the
             segments' combined silhouette (rounded caps), so no shadow leaks into
             the 2px gaps between tiles. */
          filter:
            drop-shadow(0 1px 2px rgba(20, 22, 8, 0.22))
            drop-shadow(0 8px 22px rgba(20, 22, 8, 0.20));
        }
        /* A segment: its own cream surface + ink, an inset highlight/shadow that
           reads like the wireframe's pressed-plastic pill. Middle segments are
           square; the caps below round their outer edge. */
        .fab__seg {
          display: inline-flex;
          align-items: center;
          gap: 9px;
          padding: 0 22px;
          background: var(--fab-pill);
          color: var(--fab-ink);
          /* Deeper pressed-plastic relief than the wireframe: a stronger top
             highlight + a slightly heavier bottom inset carve the segment so it
             reads as a raised, curved surface rather than a flat tile. */
          box-shadow: inset 0 1px 0 rgba(255,255,255,.65), inset 0 -2px 6px rgba(20,22,8,.10);
          /* Hover lifts each interactive segment to the more-solid surface; the
             transition keeps the highlight from snapping. */
          transition: background 0.15s ease;
          position: relative;
        }
        /* Clear hover highlight on each interactive segment (the wireframe's
             `.cp-seg:hover` brighten). The right end cap is decorative
             (`aria-hidden`), so it is excluded — it never lights up. */
        .fab__account:hover,
        .fab__repo:hover,
        .fab__share:hover,
        .fab__cap-l:hover {
          background: var(--fab-pill-hover);
        }
        .fab__cap-l { border-radius: 36px 0 0 36px; }
        .fab__cap-r { border-radius: 0 36px 36px 0; }
        /* Mirrored: the circle is the anchor welded to the right edge, so
           reverse the row (circle becomes the rightmost child) and the segments
           telescope leftward from it. The outer corners swap accordingly — the
           circle cap rounds on its RIGHT, the far share cap on its LEFT.
           `.fab-mirror` is its own host class, set by element.rs from the
           horizontal dock at rest and LIVE from the bar's center while
           dragging — the dock classes vanish during a drag, so this can't key
           off them. */
        .fab-mirror .fab { flex-direction: row-reverse; }
        .fab-mirror .fab__cap-l { border-radius: 0 36px 36px 0; }
        .fab-mirror .fab__cap-r { border-radius: 36px 0 0 36px; }
        /* The grab-handle cap: a fixed 36px square (round-left) holding just the
           sync disc, centred. It is the drag handle; collapsing shrinks the whole
           bar to this cap alone (a floating disc). */
        .fab__cap-l {
          flex: none;
          inline-size: 36px;
          padding: 0;
          justify-content: center;
          cursor: grab;
        }
        /* The far end cap: a fixed 18px round-right nub that finishes the bar
           (the wireframe's `cp-cap-r` without its toggle glyph). Half the
           handle's width — it's a rounded terminator, not a control, so it just
           gives the bar a finished edge past the last divider. */
        .fab__end {
          flex: none;
          inline-size: 18px;
          padding: 0;
        }
        /* The sync disc reads in the segment ink so it contrasts the cream pill.
           The state shape (solid / pulsing / hollow / half) lives in the shared
           `.sync` stylesheet rules, so the FAB carries no per-state colour. */
        .fab .sync { --sync-ink: var(--fab-ink); }
        /* Sizing wrapper for the live `<ui-sync-status>` disc: the disc is `1em`,
           so `font-size` sets its diameter (14px, matching the wireframe). */
        .fab__circle {
          display: inline-grid;
          place-items: center;
          font-size: 14px;
        }
        /* ── Telescope (collapse / expand) ───────────────────────────────
           element.rs wraps each collapsible segment (everything after the
           circle cap) in a `.fab__tele` div and toggles `fab--collapsed` on a
           click. The wrapper clips its tile and animates `max-width` (0 ↔ the
           tile's measured width) + `margin-left` (−2px swallows the 2px gap
           while collapsed), staggered per tile, so the bar unfolds from / folds
           into the circle. `fab--anim` gates the transitions; `fab--settled`
           (set after the sweep) unclamps `max-width` so expanded content can
           reflow past its measured width. Inline `max-width` / `margin-left` /
           `transition-delay` are written per tile by element.rs. */
        .fab--anim .fab__tele {
          flex: 0 0 auto;
          display: flex;
          align-items: stretch;
          justify-content: flex-end;
          block-size: 36px;
          overflow: hidden;
          transition: max-width 0.4s ease, margin-left 0.4s ease;
        }
        /* After settling, unclamp SHOWN tiles so their content can reflow past
           the measured width (e.g. a growing invite link). Collapsed tiles
           (`.fab__tele--hidden`, set by element.rs while folding) are excluded —
           they must stay clamped to zero. Settle only runs on expand, so in
           practice no tile carries the class then; the guard is belt-and-braces. */
        .fab--anim.fab--settled .fab__tele:not(.fab__tele--hidden) {
          overflow: visible;
          max-width: none;
        }
        .fab--anim.fab--collapsed .fab__tele { pointer-events: none; }
        /* The circle cap rounds to a full disc while collapsed, and its
           border-radius eases in step with the telescope. */
        .fab--anim .fab__cap-l { transition: border-radius 0.4s ease; }
        .fab--anim.fab--collapsed .fab__cap-l { border-radius: 50%; }
        /* Ease the equalize-on-open widening (the inline `min-width`
           element.rs stamps when a dropdown opens) so the rung unfolds
           rather than snaps; background keeps its existing hover fade. */
        .fab__repo, .fab__share { transition: background 0.15s ease, min-width 0.2s ease; }
        @media (prefers-reduced-motion: reduce) {
          .fab--anim .fab__tele,
          .fab--anim .fab__cap-l { transition: none; }
          .fab__repo, .fab__share { transition: background 0.15s ease; }
        }
        /* While dragging, the host `<tonk-fab>` is pinned `position: fixed`
           (set inline by element.rs) inside the full-viewport iframe. Suppress
           text selection and show the grabbing cursor so the drag reads cleanly. */
        .fab.dragging { cursor: grabbing; user-select: none; }
        .fab.dragging .fab__cap-l { cursor: grabbing; }
        /* Lift the shadow while dragging — deeper and wider so the bar reads as
           picked up off the page. */
        .fab.dragging {
          filter:
            drop-shadow(0 2px 4px rgba(20,22,8,.28))
            drop-shadow(0 18px 34px rgba(20,22,8,.34));
        }
        /* The account/spot names SHRINK-WRAP their content: the segment grows
           with the name (the wireframe's "sections resize with content"), so a
           short name keeps the segment tight and a longer one widens it. The
           `max-width` cap only bounds a pathologically long name; past it the
           name clips WITHIN the box (`overflow: hidden`) rather than painting
           over the adjacent circle — the old `:focus-within` lift, which let a
           long name spill out while editing, is dropped for that reason. */
        .fab__name {
          /* Center the name on the bar's axis (flex) rather than letting the
             inline editable sit on its own baseline — the account, spot and
             share labels all center the same way so they line up vertically. */
          display: inline-flex;
          align-items: center;
          line-height: 1;
          color: var(--fab-ink);
          max-width: 15ch;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        /* Collapse the display wrapper so the editable is `.fab__name`'s direct
           flex item and centres on the bar axis (same treatment as the spot
           name), rather than sitting on its own inline baseline. */
        .fab__name tonk-display,
        .fab__name tonk-view { display: contents; }
        /* The name is an inline `<tonk-editable>`: reads as plain text until
           hovered/focused, then shows an editable affordance. Clamped to the
           same width as the static name; the clamp lifts on focus so the full
           value is visible while editing. */
        .fab__name-input {
          display: inline-block;
          font: inherit;
          color: inherit;
          max-width: 15ch;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          padding: 0 2px;
          margin: 0 -2px;
          border-radius: 4px;
          cursor: text;
          outline: none;
        }
        /* Hover reveals a subtle carved field — a light tint + hairline inset —
           signalling the name is editable (double-click enters edit mode, wired
           in element.rs). The focused (editing) state deepens the same field so
           hover → edit reads as a progression; both keep `--fab-ink` readable. */
        .fab__name-input:hover {
          background: color-mix(in oklab, var(--fab-ink) 4%, transparent);
          box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--fab-ink) 16%, transparent);
        }
        .fab__name-input:focus {
          background: color-mix(in oklab, var(--fab-ink) 6%, transparent);
          box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--fab-ink) 25%, transparent);
        }
        /* The account segment: the profile name, its own pill (wireframe's
           `mr_oats`). A clickable segment (opens nothing itself; the name inside
           is an editable). */
        .fab__account { cursor: default; }
        /* The spot segment owns the switcher dropdown, opened on click
           (`.fab__repo.is-open`). It is a positioned flex `.fab__seg`, so the
           absolutely positioned `.fab__menu` anchors under it. */
        .fab__repo { cursor: pointer; }
        .fab__space {
          /* Same axis-centering as `.fab__name` so the spot name lines up with
             the account name and the share label. */
          display: inline-flex;
          align-items: center;
          line-height: 1;
          color: var(--fab-ink);
          max-width: 24ch;
          overflow: hidden;
          white-space: nowrap;
          text-overflow: ellipsis;
          cursor: pointer;
        }
        /* The repo name renders through display wrappers
           (`<tonk-display>/<tonk-view>`). Collapse them with
           `display: contents` so they generate no box and the
           `<tonk-editable>` becomes the direct flex item of `.fab__space` —
           then the segment's `align-items: center` centres it on the bar axis,
           exactly like the account and share labels. */
        .fab__space tonk-display,
        .fab__space tonk-view { display: contents; }
        /* The repo name is an inline `<tonk-editable>` (the repository
           name-view): reads as plain text, commits a rename on Enter/blur.
           Styled like the profile-name editable but inheriting `.fab__space`'s
           quieter look. */
        .fab__space tonk-editable {
          display: inline-block;
          font: inherit;
          color: inherit;
          min-width: 2ch;
          max-width: 24ch;
          overflow: hidden;
          white-space: nowrap;
          text-overflow: ellipsis;
          padding: 0 2px;
          margin: 0 -2px;
          border-radius: 4px;
          cursor: text;
          outline: none;
        }
        /* Same as the profile name: hover reveals the carved field to signal the
           name is editable (double-click to edit); the focused editing state
           deepens it. The box stays clamped at its `max-width` while editing
           (never overrunning the bar into the circle); the browser scrolls the
           contenteditable's own content to keep the caret in view, so a long
           name being typed stays legible without the box growing. `text-overflow:
           clip` drops the ellipsis while editing (an ellipsis over the live caret
           reads as a bug). */
        .fab__space tonk-editable:hover {
          background: color-mix(in oklab, var(--fab-ink) 4%, transparent);
          box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--fab-ink) 16%, transparent);
        }
        .fab__space tonk-editable:focus {
          background: color-mix(in oklab, var(--fab-ink) 6%, transparent);
          box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--fab-ink) 25%, transparent);
          text-overflow: clip;
        }
        /* Collapse/expand is the telescope above (`.fab__tele` width animation
           driven by element.rs), not a `display` toggle — so the segments slide
           in and out rather than snapping. */
        /* The menu is a transparent stack: each row is its own floating card,
           so the page shows through the gaps between rows (like the FAB pill
           itself). No panel background/border/shadow here — those live on the
           individual `.fab__menu-item` cards. */
        .fab__menu {
          position: absolute;
          left: 0;
          right: auto;
          display: none;
          flex-direction: column;
          gap: 7px;
          /* Exactly as wide as the trigger segment. When the menu's natural
             width exceeds the segment's, element.rs stamps a matching inline
             `min-width` on the segment as the menu opens (never cleared — a
             column only ratchets wider), so rung and dropdown always read as
             one column; rows ellipsise within it. Anchored at `left: 0`; the
             share roster re-anchors right (`.fab__share-menu`). */
          width: 100%;
          z-index: 100;
        }
        /* Dropdowns open AWAY from the docked edge — down from the top dock, up
           from the bottom, and horizontally into the viewport (rightward from a
           left dock, leftward from a right dock) — so they always unfold into
           view. Vertical direction is keyed off the FAB's `fab-dock-*` classes
           (set by element.rs; no JS measuring) — those persist at rest.
           Horizontal anchoring keys off `.fab-mirror` instead: a drag drops the
           `fab-dock-*` classes, but the mirror keeps tracking the bar's center
           live, so an open menu (closed at drag start — see `close_menus`)
           still re-anchors correctly the moment the bar docks again. */
        .fab-dock-top .fab__menu { top: 100%; margin-top: 7px; }
        .fab-dock-bottom .fab__menu { bottom: 100%; margin-bottom: 7px; }
        .fab-mirror .fab__menu { left: auto; right: 0; }
        /* The dropdown belongs to the repo name segment: hidden until the
           segment is CLICKED (element.rs toggles `is-open`), matching the
           wireframe where segments open their menus on click, not hover. */
        .fab__repo.is-open .fab__menu { display: flex; }
        /* Invisible hover-bridge over the 7px gap so the pointer can travel from
           the trigger to the menu without the hover dropping. On the same edge
           the menu opens from — above it for the bottom dock, below for the top. */
        .fab-dock-top .fab__menu::before {
          content: "";
          position: absolute;
          left: 0;
          right: 0;
          top: -7px;
          height: 7px;
        }
        .fab-dock-bottom .fab__menu::before {
          content: "";
          position: absolute;
          left: 0;
          right: 0;
          bottom: -7px;
          height: 7px;
        }
        /* The spot roster renders its rows inside a `<tonk-display>`/`<tonk-view>`
           pair, so the menu's flex `gap` can't reach them unless BOTH collapse.
           `display:contents` on the pair lifts the roster anchors into the menu's
           flex flow so every row — roster and action alike — shares the 7px gap. */
        .fab__menu > tonk-display,
        .fab__menu > tonk-display > tonk-view { display: contents; }
        /* Each row is its own floating card in the SAME material as the bar
           segments — the inverted cream `--fab-pill` with `--fab-ink` text (the
           wireframe's `.cp-nav-row` reuses the bar's `--pill`), so the dropdown
           reads as more of the same control, not a differently-coloured panel. */
        .fab__menu-item {
          display: block;
          padding: 10px 16px;
          background: var(--fab-pill);
          border-radius: 2px;
          box-shadow: inset 0 1px 0 rgba(255,255,255,.65), inset 0 -2px 6px rgba(20,22,8,.10);
          color: var(--fab-ink);
          text-decoration: none;
          transition: background 0.15s ease;
          /* Clip a pathologically long space name to the menu's
             segment-equalized width instead of stretching the dropdown. */
          overflow: hidden;
          white-space: nowrap;
          text-overflow: ellipsis;
        }
        /* Brighten on hover — the same highlight the bar segments use, so a
           pointed-at row clearly lights up. */
        .fab__menu-item:hover {
          background: var(--fab-pill-hover);
        }
        /* `all repos` / `new` — actions, not spaces: right-aligned,
           rendered as a button/anchor that match the roster cards' type. */
        .fab__menu-item--action {
          display: flex;
          align-items: center;
          justify-content: flex-end;
          gap: 6px;
          width: 100%;
          border: 0;
          cursor: pointer;
          font: inherit;
        }
        .fab__menu-glyph {
          line-height: 1;
        }
        /* ── Share / invite ─────────────────────────────────────────────
           The bar's right-cap segment: rounds its right edge, anchors its own
           roster dropdown (already a positioned `.fab__seg`). */
        /* The share content renders through wrapper elements
           (`<tonk-origin>` and the two `<tonk-display>` wrappers). Collapse
           ALL of them with `display: contents` so they generate no box of
           their own and their leaf controls — the copy-link button (B) and
           the "share" mint trigger (A) — become direct flex items of the
           `.fab__seg` share zone. That lets the segment's `align-items:
           center` centre the control on the bar's axis. Leaving the wrappers
           `inline` instead made the button an inline-block sitting on the
           text baseline, so it rode up out of the pill. The roster `<nav>` is
           `position: absolute`, so it stays out of this flex flow. */
        .fab__share tonk-origin,
        .fab__share .fab__invite-display,
        .fab__share .fab__share-mint,
        .fab__share-mint tonk-view { display: contents; }
        .fab__share-form {
          display: inline-flex;
          align-items: center;
          gap: 4px;
        }
        /* Once the invite link has rendered (the display reaches `ready`), drop
           the "share" mint button so the bar shows just the link + copy. The
           link display (B) precedes the mint display (A), so the sibling
           combinator reaches the "share" button inside A. */
        .fab__invite-display[data-state="ready"] ~ .fab__share-mint .fab__share-trigger,
        .fab__invite-display[data-state="default-view"] ~ .fab__share-mint .fab__share-trigger { display: none; }
        /* The "share" affordance shown before a link is minted: a text button
           that submits the mint form. Full `--fab-ink`, bar font — reads exactly
           like the account/repo labels beside it (the segment's own hover
           supplies the highlight, so the label carries no dimmed resting state). */
        .fab__share-trigger {
          font: inherit;
          line-height: 1;
          border: 0;
          background: transparent;
          color: var(--fab-ink);
          cursor: pointer;
          padding: 0 2px;
        }
        /* The minted invite: a "Copy invite link" control that reads as part of
           the pill — a plain `--fab-ink` label + link glyph in the bar's own
           font, no button chrome, so it matches the bar's other labels. (The
           <wa-copy-button> defaults its host colour to a quiet neutral grey,
           invisible on the inverted pill, and its `button` part to a padded
           icon-button; both are overridden below. Part styles from this outer
           tree win over the component's own `.button` rules regardless of
           specificity.) The button still carries the real absolute join URL and
           copies it on click, briefly swapping to "Copied!"; the raw token is
           never shown. */
        .fab__invite { color: var(--fab-ink); }
        /* Suppress the copy button's built-in hover tooltip. The visible label
           already reads "Copy invite link", so the popup (the copy-label,
           rendered by an internal <wa-tooltip> exported as `tooltip__base`) is
           redundant. */
        .fab__invite::part(tooltip__base) { display: none; }
        .fab__invite::part(button) {
          padding: 0;
          border-radius: 0;
          color: var(--fab-ink);
          background: transparent;
          transition: opacity 0.15s ease;
        }
        .fab__invite::part(button):hover {
          background: transparent;
          opacity: 0.7;
        }
        /* Icon + label sit inline within each state slot (copy / copied). */
        .fab__invite-label {
          display: inline-flex;
          align-items: center;
          line-height: 1;
          gap: 6px;
          white-space: nowrap;
          /* Slotted into <wa-copy-button>, so it inherits WebAwesome's body
             font (not the FAB's) — pin it back to the FAB face. */
          font-family: "IBM Plex Sans Condensed", var(--wa-font-family-heading, sans-serif);
        }
        /* The "Copied!" success state. WebAwesome tints its success slot green
           (`var(--wa-color-success-on-quiet)`), tuned for a light background and
           illegible on the inverted dark pill. These labels are OUR slotted
           light-DOM spans, so recolour them directly (an explicit colour beats
           the slot's inherited green): a green-tinted ink that still reads as
           success but stays legible in both themes (the ink inverts with the
           page, the green tint rides along). */
        .fab__invite [slot="success-icon"] {
          color: color-mix(in oklab, var(--fab-ink) 68%, #3ddc84);
        }
        /* The member roster dropdown — anchored to the share zone's RIGHT edge
           (the repo switcher anchors left). Inherits `.fab__menu`'s transparent
           card-stack look and its dock-keyed open-direction. */
        .fab__share-menu {
          left: auto;
          right: 0;
        }
        /* The roster opens when the share segment is CLICKED (element.rs
           toggles `is-open`), like the repo switcher above. */
        .fab__share.is-open .fab__share-menu { display: flex; }
        /* Mirrored: the bar is row-reversed, so the share zone is the LEFT
           end — its roster flips to anchor left (the repo switcher already
           re-anchors right via `.fab-mirror .fab__menu`). Row alignment
           mirrors with it: actions and member cards read from the bar's outer
           edge inward on both orientations. Keyed off `.fab-mirror`, not the
           dock, so it tracks the live drag preview, not just the resting
           corner. */
        .fab-mirror .fab__share-menu { left: 0; right: auto; }
        .fab-mirror .fab__menu-item--action { justify-content: flex-start; }
        .fab-mirror .fab__menu-item--member { text-align: left; }
        /* Telescope tiles clip toward the circle, so the unfold reads from
           the circle outward when mirrored too. */
        .fab-mirror .fab--anim .fab__tele { justify-content: flex-start; }
        /* Member cards: right-aligned names, matching the wireframe roster. */
        .fab__menu-item--member { text-align: right; }
      </style>
    </tonk-fab>

# The FAB dock — which corner the bar rests in (tonk:top-left or
# tonk:bottom-left), stored as a transient (overlay-only) claim on
# `state:fab`. Not durable: the dock is not committed to the branch tree.
# Updated on every pointer-up drop; element.rs applies the matching
# `fab-dock-*` class and the stylesheet below positions it.
concept!: &fab/dock
  this: tonk:fab/dock
  description: Persisted FAB dock (profile-meta claim).
  with:
    dock:
      description: The resting corner — tonk:top-left or tonk:bottom-left.
      the: xyz.tonk.fab/dock
      cardinality: one
      as: entity

# ============================================================
# JOIN — redeem an invite at /join (runs on the profile meta branch)
# ============================================================

# Redeem an invite URL. Fired by `<tonk-page onmount=tonk:join>` on the
# /join view: the element reads the page location (the service worker can't
# see the `#fragment`, where an open invite's seed rides) and delivers it in
# the mount event's `detail` (a flat, URL-shaped record). The worker's
# `JoinHandler` reassembles the URL from `search` + `hash`, claims the
# invite, and drives the overlay-only `tonk:join/status` (pending → failed,
# or retract + durable replica on success). Lives here, not in core.yaml:
# the join happens on the PROFILE meta branch (it records a replica), so
# the command + view must resolve there.
command!: &tonk/join
  this: tonk:join
  description: Redeem an invite URL and join its space.
  with:
    search:
      description: The full query string with its leading question mark, from detail.search.
      the: dom.event.detail/search
      as: text
    hash:
      description: The URL hash fragment carrying the seed, from detail.hash, page-only.
      the: dom.event.detail/hash
      as: text

# The in-flight join, overlay-only, at the fixed `tonk:join/status` entity.
# Just `status` (`tonk:pending` while claiming, `tonk:failed` on error) so it
# resolves the moment a join starts — a concept also requiring reason/kind
# would only resolve once those exist (never in pending). On success the
# handler retracts this and asserts the durable replica instead; the Hub
# (durable replicas) never shows in-flight or failed joins.
concept!: &join/status
  this: tonk:join/status
  description: An in-flight join attempt's state (overlay-only).
  with:
    status:
      description: The attempt state, either pending or failed.
      the: xyz.tonk.join/status
      cardinality: one
      as: entity

# The failure detail for a join, at the same `tonk:join/status` entity —
# asserted alongside `status: tonk:failed`. A separate concept so the
# pending state (status only) still resolves; the view reads this for the
# message when failed.
concept!: &join/failure
  this: tonk:join/failure
  description: Why a join attempt failed (overlay-only).
  with:
    reason:
      description: Human-readable failure message.
      the: xyz.tonk.join/reason
      cardinality: one
      as: text
    kind:
      description: The failure class, one of malformed, audience-mismatch, or claim-failed.
      the: xyz.tonk.join/kind
      cardinality: one
      as: text

# The `view` concept — the shape `<tonk-display>` queries to resolve a
# default (entity-set) view: a `model` + a `display` template. The
# join-failure `view!:` instance below is an instance of it, so its concept
# must be present on this branch. (The Hub above gets by with only
# `view/directory`; the join failure needs an entity-set view, hence this.)
concept!: &view
  this: tonk:view
  description: A display template for rendering an entity.
  with:
    model:
      description: Concept this view renders
      the: xyz.tonk.view/model
      cardinality: one
      as: entity
    display:
      description: HTML template for the view
      the: xyz.tonk.view/display
      cardinality: one
      as: text

# The /join view — a directory view for `tonk:join/status`, mounted by a
# no-entity `<tonk-display model=tonk:join/status>` (see the Leptos /join
# route). Directory chrome renders even with zero instances, so the
# `<tonk-page>` trigger mounts and fires `tonk:join` on load before any
# status exists. The per-instance repeat shows a spinner while pending and
# the failure callout (`model=tonk:join/failure`) once a join fails. On
# success there is no status to show: the worker posts a navigate message
# to the originating client (see the host's navigate provider), which redirects into
# `/space/<subject>` while the chrome's "Joining…" stands until the page
# leaves.
view/directory!:
  this: id:tonk:join/status/view
  model: tonk:join/status
  display: |
    <main class="join-view">
      <tonk-page onmount=tonk:join></tonk-page>
      <wa-card class="join-card">
        <div slot="header"><h1>Joining…</h1></div>
        <wa-spinner></wa-spinner>
        <!-- `data-id={this}` designates the repeat row without granting a
             routing context (the status entity is not a repository). -->
        <div class="join-status" data-id={this}>
          <tonk-display entity={this} model=tonk:join/failure>
            <!-- While the join is pending there is a `tonk:join/status` but
                 no `tonk:join/failure` yet: stay quiet (empty slots) instead
                 of the built-in "Not found" callout. The failure view only
                 renders once a failure is actually recorded. -->
            <span slot="no-entity"></span>
            <span slot="no-model"></span>
            <span slot="loading"></span>
          </tonk-display>
        </div>
      </wa-card>
    </main>

# The failure view — the default view for `tonk:join/failure`, so the join
# directory's per-instance `<tonk-display model=tonk:join/failure>` renders
# it only when a failure exists (i.e. status: failed). Shows the reason.
view!: &join/failure-view
  this: id:tonk:join/failure/view
  model: tonk:join/failure
  display: |
    <wa-callout variant="danger" class="join-error">
      <wa-icon slot="icon" name="circle-exclamation"></wa-icon>
      <strong>Couldn’t join</strong>
      <p>{reason}</p>
    </wa-callout>

# ============================================================
# ROUTING (profile branch) — mirrors core.yaml, scoped to the profile
# ============================================================
#
# The profile is itself a routable target: `<tonk-site path=…>` posts to
# `/api/profile/branch/meta/site`, the SW asserts this tab's `tonk:site` on this
# branch (matching the path against the `route!` table below), and the element
# renders `<tonk-display entity=site:… model=tonk:site>`. The site view nests the
# matched `{concept}` on the same site entity — the same indirection a space uses.

# A tab's location + the route concept it renders. Mirrors core.yaml's `&site`.
concept!: &site
  this: tonk:site
  description: A tab's location and the route concept it renders.
  with:
    path:
      description: Currently active path on this site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text
    anchor:
      description: Currently active anchor (URL hash) on this site.
      the: xyz.tonk.site/anchor
      cardinality: one
      as: text
    space:
      description: The space (repository name) on this site.
      the: xyz.tonk.site/space
      cardinality: one
      as: text
    branch:
      description: The active branch name on this site (defaults to "main").
      the: xyz.tonk.site/branch
      cardinality: one
      as: text
    replica:
      description: Currently active replica on this site.
      the: xyz.tonk.site/replica
      cardinality: one
      as: entity
    route:
      description: Matched route of this site.
      the: xyz.tonk.site/route
      cardinality: one
      as: entity
    concept:
      description: Matched route's concept (the model the shell mounts).
      the: xyz.tonk.site/concept
      cardinality: one
      as: entity

# The site view: render the matched route concept on this same site entity.
view!: &site-view
  this: id:tonk:site/view
  model: tonk:site
  display: |
    <tonk-display entity={this} model={concept} />

# The route table concept. Mirrors core.yaml's `&route`.
concept!: &route
  this: tonk:route
  description: A route — maps a path pattern to the model the SW mounts.
  with:
    path:
      description: The axum/matchit path pattern.
      the: xyz.tonk.route/path
      cardinality: one
      as: text
    concept:
      description: The route model to render when this path matches.
      the: xyz.tonk.route/concept
      cardinality: one
      as: entity

# The profile's only route for now: `/` renders the Hub.
route!: &route/home
  this: id:tonk:route/home
  path: "/"
  concept: tonk:hub

# The Hub route model + its view: the space directory over this (profile) branch.
# `tonk:hub` is the concept the `/` route resolves to; its view renders the
# `space` directory view, the same picker the legacy `<tonk-hub>` element mounted.
concept!: &hub
  this: tonk:hub
  description: The Tonk Hub — a picker over the profile's spaces.
  with:
    # Picked off the site entity. The hub view renders the `space`
    # directory and doesn't read it, but a `concept!` must declare at
    # least one field, and `path` is the natural one a route model carries.
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text

view!: &hub-view
  this: id:tonk:hub/view
  model: tonk:hub
  display: |
    <div class="display-view-slot">
      <tonk-display model="space"></tonk-display>
    </div>

# The /join route: redeem an invite. The shell's top-level `<tonk-site>`
# routes every path against this table, so without an entry `/join` matched
# nothing and the site rendered an empty `tonk:site` ("required attribute
# missing"). Mirrors the Hub: `/join` → `tonk:join/route`, whose entity view
# (on the site entity) mounts the no-entity `<tonk-display
# model="tonk:join/status">` directory. That directory's chrome carries the
# `<tonk-page onmount=tonk:join>` trigger, which reads the page location
# (the SW can't see the `#fragment` seed) and fires `tonk:join`.
route!: &route/join
  this: id:tonk:route/join
  path: "/join"
  concept: tonk:join/route

concept!: &join/route
  this: tonk:join/route
  description: The /join page — redeem an invite on the profile meta branch.
  with:
    # The hub carries `path` for the same reason: a route model must declare
    # at least one field, and the view doesn't read it (the join trigger
    # reads the location itself).
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text

view!: &join/route-view
  this: id:tonk:join/route/view
  model: tonk:join/route
  display: |
    <div class="display-view-slot">
      <tonk-display model="tonk:join/status"></tonk-display>
    </div>

# The space route: the profile routes ANY `/space/{id}/...` to the same UI — a
# full-size repo portal with the FAB floating on top — and hands the rest of the
# path to a NESTED `<tonk-site>` inside the portal, which routes it against the
# space's own route table. So `/space/{id}`, `/space/{id}/inspector`, etc. all
# render the same chrome; only the nested router's path differs.
# Two routes, same concept: the bare space root (`/space/{id}`, no sub-path) and
# any sub-path (`/space/{id}/{*rest}`). A `{*rest}` span may not capture nothing,
# so the bare form is its own route; it leaves `rest` unstamped, and the nested
# `<tonk-site>` defaults its absent `path` to `/`.
#
# The view keeps `<tonk-site path={rest}>` even when `rest` is absent because
# `rest` is a `cardinality: one` (scalar) field: `<tonk-display>` stamps the
# concept's scalar field names onto the `<tonk-view>` (`data-scalar-fields`), so
# the planner renders them as plain substitutions rather than iteration axes that
# would clone the host zero times — and drop it — when the value is empty.
route!: &route/space-root
  this: id:tonk:route/space-root
  path: "/space/{id}"
  concept: tonk:space/chrome

route!: &route/space-sub
  this: id:tonk:route/space-sub
  path: "/space/{id}/{*rest}"
  concept: tonk:space/chrome

# The space chrome model. `{id}` (the repository) and `{rest}` (the sub-path) are
# captured from the path and stamped on the site; the view reads them. `rest` is
# optional — the bare space route does not capture it, and the nested `<tonk-site>`
# defaults its absent `path` to `/`.
concept!: &space-chrome
  this: tonk:space/chrome
  description: The space chrome — repo portal with the FAB on top.
  with:
    id:
      description: The space repository id, picked off the site entity.
      the: xyz.tonk.site/id
      cardinality: one
      as: text
  maybe:
    rest:
      description: The sub-path within the space, picked off the site entity.
      the: xyz.tonk.site/rest
      cardinality: one
      as: text

view!: &space-view
  this: id:tonk:space/view
  model: tonk:space/chrome
  display: |
    <tonk-site with="main@{id}" allow="main@{id}" path={rest}></tonk-site>
    <tonk-display with="meta@profile:tonk" model="tonk:profile/fab" data-space="{id}"></tonk-display>
