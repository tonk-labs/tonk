# Tonk profile library — the minimal standard library seeded onto the
# profile repository's meta branch.
#
# The profile branch only backs the Tonk Hub at `/`: a picker over the
# spaces this profile can open. It does NOT render workspaces, boards,
# sheets, inspectors, or any artifact view — those live on each space's
# own content branch and are seeded from the full `core.yaml`. Seeding
# the whole standard library here cost ~2s of DB writes on every first
# load for 60+ expressions the profile never uses; this lean document
# carries only the two definitions the Hub needs.
#
# Lowering runs `analyze_local` (no running system), so every
# `&anchor` / bare-name reference must resolve within this file. Both
# definitions below are self-contained: the directory view's
# `model: space` resolves to the `&space` anchor here.

# A space (replica) the profile has access to. These records live on
# the profile repository's main branch — one per repository this device
# has joined or created. The Hub queries them on the profile main branch
# (the top site's `with="main@profile:tonk"` context) so the user can pick
# which space to open.
concept!: &space
  this: tonk:space
  description: A space on this account.
  with:
    subject:
      description: >
        The repository's subject DID (its stable identity). The Hub card
        links to `/space/{subject}`; the route reads the routing key as
        the suffix after the last `:`.

        These `xyz.tonk.space/*` attributes hang on the repository's own
        entity — NOT on a per-device replica row. Replica rows key on
        (device profile, subject), and profile main now syncs through
        the account, so listing them would show one card per device per
        space. The directory entry is asserted once per space and every
        device converges on it.
      the: xyz.tonk.space/subject
      cardinality: one
      as: entity
    status:
      description: >
        tonk:blank while the space's content branch is still
        seeding, tonk:initialized once seeded. The Hub card
        reflects it via [data-status] (an installing animation).
      the: xyz.tonk.space/status
      cardinality: one
      as: entity
  maybe:
    name:
      description: >
        The directory mirror of the space's display name — written at
        create and kept current by the rename command — so a device
        that has not replicated the space can still label its card.
      the: xyz.tonk.space/name
      cardinality: one
      as: text
    local:
      description: >
        Whether THIS device holds a replica. Overlay-only (the worker
        stamps it at boot and on mount), so it never replicates; a row
        without it renders as a hollow spot that replicates on first
        visit.
      the: xyz.tonk.space/local
      cardinality: one
      as: boolean

# The Add Space command. Asserted by the Hub's two create forms (the bar's
# `new space` rung and the stack's ghost) and by the FAB's `new` row; the
# worker's `create_space` handler decodes it and does the work (record the
# replica, create + seed the repository, flip the status, navigate the
# creator into the new space). `name` reads from the form on submit:
# `event.currentTarget.elements.name.value` — the hidden
# `<input name="name" value="Untitled">` inside `<form onsubmit=space/create>`.
# `prevent-default` stops the page from reloading; without it the browser
# falls through to a GET submit and reloads with the fields in the query
# string. The command is transient: it fires the handler once and is swept
# before the durable commit.
command!: &space/create
  description: A request to create a new space.
  with:
    name:
      description: >
        The space name. Nothing asks for one: every create carries the
        "Untitled" sentinel, which the worker's
        CreateSpaceHandler uniquifies against the existing space labels
        ("Untitled", "Untitled 2", …), and the user renames the space in
        place on arrival. The sentinel must be non-empty — the event
        extractor omits blank fields, and with no `name` fact the
        transient would never trigger the handler.
      the: dom.event.current-target.elements.name/value
      as: text
    prevent-default:
      description: Stop the form submission from reloading the page
      the: dom.event.do/prevent-default

# The Remove Space command. Submitting a Hub row's delete-confirm form
# asserts this transient; the worker's `RemoveSpaceHandler` retracts the
# replica record from this branch, evicts the space from the reactor
# (stopping background sync), and deletes its local storage. Removal is
# device-local — a synced spot can be rejoined via an invite link; a
# local-only spot is gone for good, which the confirm copy states.
# `subject` reads the form's `data-remove` attribute. Deliberately NOT
# `data-subject`: `tonk/rename-repository` transients already carry
# `dataset/subject`, and a remove command matched on that attribute
# alone would also decode every rename. The distinct attribute doubles
# as the command's unique shape, so no marker field is needed. The
# command is transient: it fires the handler once and is swept before
# the durable commit.
command!: &space/remove
  description: A request to remove a space from this device (its list entry and local data).
  with:
    subject:
      description: The subject DID of the space to remove, read from `data-remove`.
      the: dom.event.current-target.dataset/remove
      as: entity
    prevent-default:
      description: Stop the form submission from reloading the page
      the: dom.event.do/prevent-default

# Load the requesting tab's site for its current path. Mirrors core.yaml's
# `&tonk/load` — seeded here too because the top-level `<tonk-site>` stamps onto
# the PROFILE branch (its ancestors resolve no named repo, so the claim routes
# here). The worker's `LoadHandler` matches `path` against this branch's `route!`
# table and stamps `tonk:site` onto the element-supplied `this`.
command!: &tonk/load
  this: tonk:load
  description: Stamp the requesting tab's site for its current path on this branch.
  with:
    path:
      description: The route path the tab is at, matched against the route table.
      the: xyz.tonk.site/path
      as: text

# The `view` concept — the shape `<tonk-display>` queries: the
# instance's `this` IS the model entity, `show` its templates keyed
# by facet (`ui`, `directory`, `label`, `title`, …). The `view!:`
# instances below are instances of it, so its concept must be present
# on this branch too. Kept in step with core.yaml's declaration.
concept!: &view
  this: tonk:view
  description: A model's presentations, keyed by facet (ui, directory, label, title, ...)
  with:
    show:
      description: HTML templates keyed by facet
      the: xyz.tonk.view
      cardinality: one
      as: {[symbol]: text}

# The Hub directory view: the picker shown at `/`. One card per space,
# linking to its `/space/{subject}` page. A space is identified by its
# subject did:key; the route reads the routing key as the suffix after
# the last `:`, so `{subject}` (a full did:key) resolves to that key.
# The card's name is NOT read from this profile-side record — it is read
# from the listed space's OWN repository: the row's `with={subject}`
# context opens that space's routing context and a
# `<tonk-display model=tonk:repository view=label>` inside it
# shows the repo's current name (the cross-device source of truth).
# Rendered as a directory (no entity) over the `space` model on the
# profile meta branch.
view!:
  this: space
  show:
    directory: |
      <div class="hub-page">
        <style>
          /* ── The Hub — the space directory at `/`.
             Named `.hub-page`, not `.hub`: `tonk-ui/styles.css` still carries a
             `.hub` block from an earlier launcher (a 56rem centred column),
             which clipped this page to a band down the middle of the viewport.
             That CSS is dead — nothing renders `.hub-card` / `.hub-route` any
             more — but it is not this change's to delete.
             Chrome, and it runs on the same material as the FAB: a neutral
             page, 36px frost blocks with ink rings, lowercase condensed words
             seated bottom-right, ink only. The bar's tokens are restated here
             rather than shared, because the bar seals its own inside a shadow
             root — a boundary custom properties would have to be invited
             across one at a time. The two sets must agree; if the bar's
             `skin.rs` changes, this changes with it.

             The dark twin keys off `.wa-dark` on the root, which is the app's
             existing theme signal (set by index.html from the OS, overridden
             by <ui-mode-switch>) — not a second signal of the Hub's own, which
             would be free to disagree with the rest of the page. ── */
          .hub-page {
            --page:#e8e6e4; --ink:#38182a; --on-ink:#f7f6f5; --soft:#5b4953;
            --ring:rgba(56,24,42,.85); --sep:rgba(56,24,42,.28);
            /* frost pre-composited over the flat page — a flat page blurs to
               itself, so the rows get the same look with no filter. Only the
               genuinely overlaying surfaces (the bar and account roster) wear
               real glass. */
            --frost:rgba(253,252,252,.72); --frost-solid:#f7f6f5;
            --panel:#d0ccc8; --cur:var(--panel); --card:#fcfbfb; --card-hover:#eeedec;
            --wash:rgba(56,24,42,.06); --wash-2:rgba(56,24,42,.12);
            --wash-p:rgba(56,24,42,.16); --canvas:#e4e2e0; --stub-ink:#9f968e;
            --veil:rgba(232,230,228,.9); --dim:rgba(56,24,42,.32);
            --track:rgba(56,24,42,.22);
            --cond:"IBM Plex Sans Condensed","Bahnschrift","Arial Narrow",sans-serif;
            --sans:"IBM Plex Sans",Helvetica,Arial,sans-serif;
            --ease:cubic-bezier(.25,.46,.45,.94);
            position:relative; min-height:100dvh; background:var(--page);
            color:var(--ink); font-family:var(--cond);
          }
          :root.wa-dark .hub-page {
            --page:#161313; --ink:#e2dfdd; --on-ink:#221c1d; --soft:#c8c3bf;
            --ring:rgba(226,223,221,.55); --sep:rgba(226,223,221,.28);
            --frost:rgba(29,24,25,.78); --frost-solid:#1b1718;
            --panel:#3c3335; --card:#261f20; --card-hover:#322a2b;
            --wash:rgba(226,223,221,.09); --wash-2:rgba(226,223,221,.15);
            --wash-p:rgba(34,28,29,.14); --canvas:#1c1718; --stub-ink:#736265;
            --veil:#161313; --dim:rgba(0,0,0,.45); --track:rgba(226,223,221,.25);
          }
          .hub-page *, .hub-page *::before, .hub-page *::after { box-sizing:border-box; }
          /* selection is chrome too — ink, never the browser's blue */
          .hub-page ::selection { background:var(--ink); color:var(--on-ink); }
          .hub-page :focus-visible { outline:none;
            box-shadow:inset 0 0 0 2px var(--on-ink), inset 0 0 0 4px var(--ink); }
          /* A real reset, not a token one. Web Awesome skins NATIVE controls
             inside `@layer wa-native` — `button` gets `display:inline-flex`,
             padding, a min-height, a radius and a border — so a cell built on
             a <button> and one built on an <a> laid their words out
             differently, and the mode cap came out a rounded slab instead of
             an 18px pill. Unlayered author rules outrank layered ones, so this
             wins without `!important`. */
          /* `:where()` so the reset contributes NO specificity: a plain
             `.hub-page button` is (0,1,1) and silently outranks every (0,1,0)
             cell rule below — which stripped `.hcell`'s padding and left "new
             space" flush against the corner while the anchor cell next to it
             sat correctly. A reset must lose every tie it takes part in. */
          .hub-page :where(button) {
            font:inherit; letter-spacing:inherit; color:inherit; text-align:inherit;
            background:none; border:0; border-radius:0; margin:0; padding:0;
            min-width:0; min-height:0; block-size:auto; inline-size:auto;
            box-shadow:none; appearance:none; -webkit-appearance:none;
            cursor:pointer; }
          .hub-page :where(a) { color:inherit; text-decoration:none; }

          /* the block: 36px, frost + ink ring. every cell derives from it. */
          .blk { height:36px; background:var(--frost);
            -webkit-backdrop-filter:blur(12px) saturate(1.5); backdrop-filter:blur(12px) saturate(1.5);
            box-shadow:0 0 0 1px var(--ring); }
          .chrome { font-family:var(--cond); font-weight:600; font-size:13px;
            line-height:1; letter-spacing:.02em; text-transform:lowercase; }

          /* ── centered launcher — one proportional grid, logo above it ── */
          .hub-logo { position:absolute; top:clamp(62px,11vh,106px); left:50%; z-index:10;
            transform:translateX(-50%); color:var(--ink); user-select:none; }
          .hub-logo svg { display:block; width:132px; height:auto; }
          .hubcol { position:relative; width:min(576px, calc(100vw - 32px));
            margin-inline:auto; padding-top:clamp(148px,23vh,220px); }
          .hubbar { position:relative; z-index:10; display:flex; align-items:stretch;
            width:100%; height:36px; overflow:hidden; background:var(--frost);
            -webkit-backdrop-filter:blur(12px) saturate(1.5); backdrop-filter:blur(12px) saturate(1.5);
            box-shadow:0 0 0 1px var(--ring); }
          /* every word sits bottom-right on the 9px seat */
          .hcell { display:flex; align-items:flex-end; justify-content:flex-end; gap:8px;
            padding:0 10px 9px 12px; font-size:13px; line-height:1; white-space:nowrap;
            text-decoration:none; color:inherit; flex:none; }
          .hcell:hover { background:var(--wash); }
          .hcell:active { background:var(--wash-2); }
          .hc-acct { width:224px; min-width:0; }
          .hc-view { width:192px; border-left:1px solid var(--sep); }
          .hc-cfg { width:112px; border-left:1px solid var(--sep);
            padding-right:8px; padding-left:10px; }
          .hc-acct[aria-current="page"], .hc-view[aria-current="page"],
          .hc-cfg[aria-current="page"] {
            background:var(--cur); }
          .hcell .g { font-size:14px; font-weight:500; }
          .settings-icon { width:9px; height:9px; flex:none; }
          /* The mode stays in the grid but reads as a half-lit circle, centred
             inside its own cell instead of as a second sidebar glyph. */
          .hub-page ui-mode-switch { display:flex; flex:none; }
          .hub-page .mode-cap { display:flex; align-items:center; justify-content:center;
            width:48px; height:36px; padding:0; flex:none;
            border-left:1px solid var(--sep); background:var(--frost); }
          .hub-page .mode-cap:hover { background:linear-gradient(var(--wash),var(--wash)), var(--frost); }
          .hub-page .mode-cap:active { background:linear-gradient(var(--wash-2),var(--wash-2)), var(--frost); }
          .hub-page .mode-mark { display:block; width:10px; height:10px; border-radius:50%;
            background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);
            box-shadow:0 0 0 1px var(--ink); }

          /* ── account roster — a third attached view below the header ── */
          .hub-page ui-hub-account { position:relative; display:block; width:100%; }
          .account-trigger { overflow:hidden; }
          .account-trigger [data-account-label] { overflow:hidden; text-overflow:ellipsis;
            white-space:nowrap; text-transform:none; }
          .account-menu { display:flex; flex-direction:column; gap:7px; width:100%; margin-top:7px;
            color:var(--ink); text-transform:none; }
          .account-menu[hidden] { display:none; }
          .account-menu__profiles { display:flex; flex-direction:column; gap:7px; }
          .account-menu__row { display:flex; align-items:center; justify-content:space-between;
            gap:12px; width:100%; min-height:36px; padding:8px 12px; text-align:left;
            background:var(--frost-solid); font:inherit; color:inherit;
            box-shadow:0 0 0 1px var(--ring);
            overflow-wrap:anywhere; transition-property:scale; transition-duration:150ms;
            transition-timing-function:ease-out; }
          button.account-menu__row:hover { background:var(--wash); }
          button.account-menu__row:active { background:var(--wash-2); scale:.96; }
          .account-menu__profile[aria-current="true"] { color:var(--soft); }
          .account-menu__current { flex:none; font-size:13px; text-transform:lowercase; }
          .account-menu__error { padding:10px 12px; background:var(--frost-solid);
            color:var(--ink); font-family:var(--sans); font-size:12px; line-height:1.45;
            text-wrap:pretty; overflow-wrap:anywhere; box-shadow:0 0 0 1px var(--ring); }
          .account-menu__error[hidden] { display:none; }

          /* ── the spaces stack — 432, blocks with 7px gaps of pure page ── */
          .stack { width:100%; margin-top:7px; padding-bottom:120px; display:flex;
            flex-direction:column; gap:7px; }
          .stack[hidden] { display:none; }
          .sempty { height:36px; padding:0 10px 9px 16px; display:flex;
            align-items:flex-end; justify-content:flex-end; color:var(--soft);
            background:var(--frost-solid); box-shadow:0 0 0 1px var(--sep); }
          .stack:has(.srow-wrap) .sempty { display:none; }
          /* the wrapper, not the link, is the positioning context: the verbs
             and the confirm cluster sit OUTSIDE the anchor (a control inside
             one is invalid markup, and a label inside one navigates instead of
             doing its job) while reading as part of the row */
          .srow-wrap { position:relative; }
          .srow { display:flex; align-items:flex-end;
            justify-content:flex-end; padding:0 10px 9px 16px; cursor:pointer;
            text-decoration:none; color:var(--ink);
            background:var(--frost-solid);
            -webkit-backdrop-filter:none; backdrop-filter:none; }
          .srow:hover { background:linear-gradient(var(--wash),var(--wash)), var(--frost-solid); }
          .srow:active { background:linear-gradient(var(--wash-2),var(--wash-2)), var(--frost-solid); }
          /* the ellipsis clip needs descender room: at line-height 1 the box
             ends at the baseline's feet and takes the tails off g, p and y.
             The padding gives the clip air; the negative margin hands it back
             so the seat does not move. */
          .srow .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
            text-transform:none; padding-bottom:4px; margin-bottom:-4px;
            max-width:calc(100% - 130px); }
          /* a space still seeding, and one this device has not replicated:
             quieter, but still openable — visiting replicates it */
          .srow-wrap[data-status="tonk:blank"] .srow .n { opacity:.6; }
          .srow-wrap:not([data-local="true"]) .srow .n { color:var(--soft); }
          /* the verbs — soft until approached, left of the row. Soft ink is
             metadata-only, so they take full ink the moment they are live. */
          .verbs { position:absolute; left:16px; bottom:9px; display:flex; gap:22px;
            opacity:0; transition:opacity .15s var(--ease); color:var(--soft); }
          .srow-wrap:hover .verbs, .srow-wrap:focus-within .verbs { opacity:1; }
          .verbs button, .verbs .verb-remove { display:inline-flex; align-items:center;
            color:inherit; font:inherit; letter-spacing:inherit;
            text-transform:lowercase; cursor:pointer; }
          .verbs button:hover, .verbs .verb-remove:hover { color:var(--ink);
            text-decoration:underline; text-underline-offset:3px; }
          /* creation is the stack's final, and only, solid ink row */
          .snew-form { display:block; }
          .snew { display:flex; align-items:flex-end; justify-content:flex-end; gap:8px;
            width:100%; height:36px; padding:0 10px 9px 16px; background:var(--ink);
            color:var(--on-ink); box-shadow:0 0 0 1px var(--ink); cursor:pointer; }
          .snew:hover { background:linear-gradient(var(--wash-p),var(--wash-p)), var(--ink); }
          /* ── the remove cluster — the page dims, the surface never ──
             Driven by the same native radios the rest of the view uses: no
             script runs in a seeded view, so the open state has to be
             something CSS can hold. */
          .rm-radio { position:absolute; opacity:0; pointer-events:none; }
          .mscrim { display:none; position:fixed; inset:0; z-index:30; background:var(--dim); }
          .modal { display:none; position:fixed; left:50%; top:34vh;
            transform:translateX(-50%); width:432px; z-index:31; }
          .srow-wrap > .rm-radio:checked ~ .mscrim,
          .srow-wrap > .rm-radio:checked ~ .modal { display:block; }
          /* solid cards — no filter behind opaque paint */
          .modal .blk { background:var(--card);
            -webkit-backdrop-filter:none; backdrop-filter:none; }
          .m-hrow { display:flex; margin-right:-36px; margin-bottom:7px; }
          .m-head { flex:1; display:flex; align-items:flex-end; justify-content:flex-start;
            padding:0 16px 9px; font-size:13px; }
          .m-x { width:36px; flex:none; display:grid; place-items:center;
            border-radius:0 18px 18px 0; font-size:15px; cursor:pointer; }
          .m-x:hover { background:linear-gradient(var(--wash),var(--wash)), var(--card); }
          .m-body { height:auto; min-height:110px; padding:16px;
            font-family:var(--sans); font-weight:600; font-size:13.5px;
            line-height:1.6; color:var(--ink); text-transform:none; }
          .m-name { text-transform:none; }
          .m-foot { display:flex; justify-content:flex-end; margin-top:7px; }
          /* the run fuses flush — the fill boundary is the divider */
          .m-cancel { display:flex; align-items:flex-end; justify-content:flex-end;
            min-width:144px; padding:0 10px 9px 24px; font-size:13px; cursor:pointer; }
          .m-cancel:hover { background:linear-gradient(var(--wash),var(--wash)), var(--card); }
          .m-go { height:36px; display:flex; align-items:flex-end; justify-content:flex-end;
            min-width:144px; padding:0 10px 9px 24px; background:var(--ink);
            color:var(--on-ink); box-shadow:0 0 0 1px var(--ink); font-size:13px;
            cursor:pointer; white-space:nowrap; }
          /* brightness on near-black reads as nothing — wash it instead */
          .m-go:hover { background:linear-gradient(var(--wash-p),var(--wash-p)), var(--ink); }

          @media (prefers-reduced-motion: reduce) {
            .verbs, .account-menu__row { transition:none; }
          }

          /* ── one breakpoint, the bar's own fold. Approach hides nothing from
             a hand that cannot hover. ── */
          @media (hover:none), (max-width:640px) {
            .verbs { opacity:1; gap:24px; }
            /* the 44 target law, invisibly — centres 44 apart, no overlap */
            .verbs button, .verbs .verb-remove { padding:16px; margin:-16px -12px; }
            .verbs button:hover, .verbs .verb-remove:hover { text-decoration:none; }
            .srow .n { max-width:calc(100% - 150px); }
          }
          @media (max-width:640px) {
            .modal { width:min(432px, calc(100vw - 84px));
              top:max(20vh, calc(env(safe-area-inset-top) + 90px)); }
          }
          @media (max-width:607px) {
            .hubcol { width:min(432px, calc(100vw - 32px)); }
            .hc-acct { width:168px; }
            .hc-view { width:144px; }
            .hc-cfg { width:84px; }
            .hub-page .mode-cap { width:36px; }
          }
          @media (max-width:519px) {
            .hub-logo { top:62px; }
            .hub-logo svg { width:98px; }
            .hubcol { padding-top:132px; }
          }
          @media (max-width:463px) {
            .hc-acct { width:50%; }
            .hc-view { width:auto; flex:1; }
            .hc-cfg, .hub-page .mode-cap { width:44px; flex:0 0 44px; }
            .hc-cfg { justify-content:center; padding-inline:0; }
            .settings-word { position:absolute; width:1px; height:1px; padding:0;
              margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;
              border:0; }
          }
        </style>

        <div class="hub-logo" role="img" aria-label="tonk"><svg viewBox="0 0 1024 343" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M337.41 169.57C337.41 136.215 363.983 109.171 396.764 109.171C429.539 109.171 456.112 136.215 456.112 169.57C456.112 202.932 429.539 229.975 396.764 229.975C363.983 229.975 337.41 202.932 337.41 169.57ZM643.51 54C614.396 54 589.91 61.6682 572.703 77.2353C563.913 85.1861 557.227 94.8795 552.759 105.986C552.206 97.3086 549.67 85.1977 540.937 75.1754C530.712 63.4453 515.039 55.8233 494.461 56.2041C488.76 56.3253 484.229 61.045 484.345 66.7514C484.46 72.3886 489.06 76.8833 494.668 76.8833C494.737 76.8833 494.812 76.8833 494.881 76.8833C509.044 76.6006 519.252 81.8339 525.282 88.6654C534.084 98.6415 532.072 113.834 532.02 114.197C531.167 119.817 535.012 125.079 540.626 125.962C541.168 126.048 545.537 126.602 547.612 124.565C546.673 130.203 546.171 136.076 546.171 142.192C546.171 183.349 531.225 224.038 507.39 247.764C488.403 266.66 465.219 275.805 434.911 279.382C479.549 263.671 511.569 221.038 511.569 170.874C511.569 107.365 460.262 55.8868 396.966 55.8868C333.675 55.8868 282.368 107.365 282.368 170.874C282.368 234.383 333.675 285.868 396.966 285.868C399.121 285.868 401.254 285.793 403.375 285.677C451.126 285.1 484.569 276.722 510.508 250.902C535.196 226.328 550.592 184.555 550.592 142.192C550.592 90.1771 586.197 57.8658 643.51 57.8658C737.703 57.8658 741.576 107.169 741.657 113.96C731.477 116.378 708.795 127.093 708.795 147.247V284.702H742.314C745.744 284.702 746.107 282.556 746.107 281.333V114.209C746.107 107.983 743.208 54 643.51 54Z" fill="currentColor"/><path d="M144.171 58.5683L129.662 58.5856C106.081 58.6318 91.4574 69.3695 83.3356 77.9031C72.9486 88.8081 67 103.873 67 119.221C67 148.151 86.5636 179.285 133.299 179.285V155.658C100.513 155.658 90.6043 136.029 90.6043 119.221C90.6043 104.029 99.7116 81.7516 130.135 81.7516L144.171 81.7458V261.448C131.691 261.448 124.786 248.968 124.786 238.08L104.974 238.092C104.974 267.316 130.095 284.383 143.98 284.706H170.432C195.829 284.706 215.053 259.717 215.053 196.924V107.306H225.924V155.658H274.164V58.5683H144.171Z" fill="currentColor"/><path d="M926.713 197.694L895.344 197.463C903.656 193.101 910.337 187.937 915.461 183.073C941.844 158.049 955.222 116.16 955.222 58.5828H938.99C938.99 111.527 927.318 149.447 904.302 171.286C893.817 181.227 875.475 192.721 847.444 191.544V58.5828H776.988V211.663C776.988 244.701 754.468 249.9 754.468 249.9C754.474 249.9 754.468 284.715 754.468 284.715H847.444V216.815C847.444 211.703 856.764 211.721 856.764 216.815C856.764 225.54 856.741 239.803 856.741 248.977C856.741 275.98 879.85 289.735 907.633 289.735C932.039 289.735 955.43 274.601 956.098 248.977C956.536 232.186 960.612 197.694 926.713 197.694Z" fill="currentColor"/></svg></div>

        <main class="hubcol">
          <ui-hub-account></ui-hub-account>

        <div class="stack chrome" data-spaces-view aria-label="spaces">
          <div class="sempty">no spaces yet</div>
          <!-- `data-id={this}` designates the repeat row — the WRAPPER, not the
               link, so the verbs and the confirm cluster travel with the row
               while staying outside it: reaching for remove never navigates.
               Each per-space consumer carries its OWN subject; the routing
               helpers read an element's own attribute and never walk ancestors. -->
          <div class="srow-wrap" data-status={status} data-local={local} data-id={this}>
            <!-- The confirm's open state, held by a native radio because no
                 script runs in a seeded view. `tabindex=-1`: this is invisible
                 chrome, and Tab landing on it would silently arm a destructive
                 overlay. The named group means opening one confirm closes any
                 other. -->
            <input class="rm-radio" type="radio" name="__rm" id="rm-{subject}" tabindex="-1">
            <a class="srow blk" href="/space/{subject}"><span class="n">{name}</span></a>
            <!-- Both verbs sit outside the anchor and are laid over it: a
                 <button> inside an <a> is invalid markup the parser reshapes,
                 and a <label for> inside one navigates rather than opening the
                 confirm. Hovering the row reveals them (`.srow-wrap:hover`),
                 so the reveal still follows the row and not just the verbs. -->
            <span class="verbs">
              <ui-copy-link url="/space/{subject}" label="copy link"></ui-copy-link>
              <label class="verb-remove" for="rm-{subject}">remove</label>
            </span>
            <div class="mscrim"></div>
            <div class="modal chrome" role="alertdialog" aria-modal="true">
              <form onsubmit=space/remove data-remove={subject} data-close-radio="rm-closed">
                <div class="m-hrow">
                  <div class="m-head blk">confirm space removal</div>
                  <label class="m-x blk" for="rm-closed" aria-label="close">&#215;</label>
                </div>
                <div class="m-body blk">
                  Remove {name} from this device? A synced space can be rejoined with
                  a share link; a local-only space is gone for good. Removing it
                  does not delete other members' copies.
                </div>
                <div class="m-foot">
                  <label class="m-cancel blk" for="rm-closed">cancel</label>
                  <button class="m-go" type="submit">remove space</button>
                </div>
              </form>
            </div>
          </div>
          <!-- Creating asks nothing up front: the space starts "Untitled" (the
               worker uniquifies the sentinel) and is renamed in place with the
               bar's block cursor the moment you land in it. No remote is
               carried: the worker resolves where a spot syncs from the
               account's own registration, so a spot created before anyone
               registers stays local until it is shared. -->
          <form class="snew-form" onsubmit=space/create>
            <input type="hidden" name="name" value="Untitled">
            <button class="snew chrome" type="submit">create a new space<span class="g" aria-hidden="true">&#9656;</span></button>
          </form>
        </div>

        <!-- The shared "everything closed" state for the confirm radios. Last,
             so a row's own radio can never be un-checked by it accidentally. -->
        <input class="rm-radio" type="radio" name="__rm" id="rm-closed" checked tabindex="-1">
        </main>
      </div>

# ============================================================
# FAB — floating action button view (rendered in the FAB portal iframe)
# ============================================================
#
# These declarations live on the profile branch because the FAB portal is
# scoped to it (`with="main@profile:tonk"`). The
# guest renders `tonk:profile/fab` via a `<tonk-display>` mounted
# by the shell's FAB portal content string.
#
# Identity note (V1 — not yet wired): the FAB portal `content` string in
# core.yaml embeds only `data-space`; `data-did` and `data-name` are NOT
# embedded. The `did={dom.host/data-did}` and `{dom.host/data-name}`
# template slots below are placeholders that render empty until a follow-up
# wires the worker to stamp `state:self` identity onto the profile/meta
# branch and the shell to embed those values in the portal content string.

# The member's display name, read directly from THIS (profile meta) branch —
# the durable `ProfileName` override the worker stamps on `profile/rename`
# (attribute `xyz.tonk.profile/display-name`, keyed by the profile DID). The
# FAB is sealed to the profile/meta branch, so unlike the space roster's names
# (which live in each space's own repo and are unreachable from the sealed
# guest) this one is an ordinary in-branch read. Absent until the user renames
# (the worker's `petname` fallback is computed, not persisted), so the bar's
# name slot renders empty until a name is set.
concept!: &profile/name
  this: tonk:profile/name
  description: The member's display-name override on the profile meta branch.
  with:
    name:
      description: The chosen display name (xyz.tonk.profile/display-name).
      the: xyz.tonk.profile/display-name
      cardinality: one
      as: text

# Rename the signed-in member (set their display name). Lives here as well as
# in core.yaml because the FAB is sealed to the profile/meta branch: the
# guest's `<tonk-display>` resolves the command's concept descriptor by a
# phase-1 lookup against THIS branch (seeded from the lean profile.yaml), so
# the command must be present here for the editable's `onchange=profile/rename`
# to fire. The worker's globally-registered `ProfileRenameHandler` does the
# work (persist `ProfileName`, restamp `MemberName` across every space's
# roster, republish self-identity) — this descriptor only has to decode the
# new name and the `tonk:profile` marker that distinguishes it from the repo
# rename, which shares the same `dom.event.current-target` shape.
command!: &profile/rename
  description: Rename the signed-in member (set their display name).
  with:
    name:
      description: The new name, read from the editable's value on commit.
      the: dom.event.current-target/value
      as: text
    marker:
      description: Per-command marker (data-rename) distinguishing this from repo rename.
      the: dom.event.current-target.dataset/rename
      as: entity

# Toggle auto-sync (pause ⇄ resume) for a space. Dispatched by the FAB's
# `<ui-sync-status onpause=…>` cap on alt/option-click. Defined here on the
# PROFILE branch (not on each space's branch) and dispatched on the profile
# context, so the FAB's pause affordance depends on nothing seeded per-space —
# older spaces missing a `fab-pause` view no longer break it. The `space` field
# names WHICH replica to flip; the worker's PauseSyncHandler reads it in place
# of the dispatch origin. `time` makes each click a distinct transient so the
# toggle reliably re-fires; `marker` keeps the shape distinct from `tonk:invite`.
command!: &tonk/pause-sync
  this: tonk:pause-sync
  description: Toggle auto-sync (pause ⇄ resume) for a space.
  with:
    time:
      description: The click's timestamp; makes each dispatch a distinct transient.
      the: dom.event/time-stamp
      as: float
    space:
      description: The target space DID — the replica whose auto-sync is flipped.
      the: xyz.tonk.pause-sync/space
      as: entity
    marker:
      description: Per-command marker keeping the shape distinct from tonk:invite.
      the: dom.event.current-target.dataset/pause-sync
      as: entity

# The FAB fallback seat — the nearest corner restored on the next page load,
# stored on `state:fab`. The live page keeps the exact point along the nearest
# edge; element.rs persists this compatible corner after every pointer-up drop.
concept!: &fab/dock
  this: tonk:fab/dock
  description: Persisted FAB dock (profile-meta claim).
  with:
    dock:
      description: The fallback corner restored on the next page load.
      the: xyz.tonk.fab/dock
      cardinality: one
      as: entity

# ============================================================
# JOIN — redeem an invite at /join (runs on the profile meta branch)
# ============================================================

# Redeem an invite URL. Fired by `<tonk-page onmount=tonk:join>` on the
# /join view: the element reads the page location (the service worker can't
# see the `#fragment`, where an open invite's seed rides) and delivers it in
# the mount event's `detail` (a flat, URL-shaped record). The worker's
# `JoinHandler` reads the complete `href`, claims the
# invite, and drives the overlay-only `tonk:join/status` (pending → failed,
# or retract + durable replica on success). Lives here, not in core.yaml:
# the join happens on the PROFILE meta branch (it records a replica), so
# the command + view must resolve there.
command!: &tonk/join
  this: tonk:join
  description: Redeem an invite URL and join its space.
  with:
    url:
      description: The complete invite URL, including any fragment, from detail.href.
      the: dom.event.detail/href
      as: text

# The in-flight join, overlay-only, at the fixed `tonk:join/status` entity.
# Just `status` (`tonk:pending` while claiming, `tonk:failed` on error) so it
# resolves the moment a join starts — a concept also requiring reason/kind
# would only resolve once those exist (never in pending). On success the
# handler retracts this and asserts the durable replica instead; the Hub
# (durable replicas) never shows in-flight or failed joins.
concept!: &join/status
  this: tonk:join/status
  description: An in-flight join attempt's state (overlay-only).
  with:
    status:
      description: The attempt state, either pending or failed.
      the: xyz.tonk.join/status
      cardinality: one
      as: entity

# The failure detail for a join, at the same `tonk:join/status` entity —
# asserted alongside `status: tonk:failed`. A separate concept so the
# pending state (status only) still resolves; the view reads this for the
# message when failed.
concept!: &join/failure
  this: tonk:join/failure
  description: Why a join attempt failed (overlay-only).
  with:
    reason:
      description: Human-readable failure message.
      the: xyz.tonk.join/reason
      cardinality: one
      as: text
    kind:
      description: >
        The failure class: malformed, audience-mismatch, revoked,
        unavailable, refused, or claim-failed.
      the: xyz.tonk.join/kind
      cardinality: one
      as: text

# The /join view — a directory view for `tonk:join/status`, mounted by a
# no-entity `<tonk-display model=tonk:join/status>` (see the Leptos /join
# route). Directory chrome renders even with zero instances, so the
# `<tonk-page>` trigger mounts and fires `tonk:join` on load before any
# status exists. The per-instance repeat shows the shared pulse while pending and
# the failure callout (`model=tonk:join/failure`) once a join fails. On
# success there is no status to show: the worker posts a navigate message
# to the originating client (see the host's navigate provider), which redirects into
# `/space/<subject>` while the chrome's "Joining…" stands until the page
# leaves.
view!:
  this: tonk:join/status
  show:
    directory: |
      <div class="join-card-wrap">
        <!-- Only the in-flight and failed states live here. The resting
             (paste) state is the ROUTE view's, because this directory is
             empty until a join starts and an empty nested directory renders
             nothing. `data-id={this}` marks the repeat row; the wall is
             inside it, so the whole surface is per-status. -->
        <div class="join-status" data-id={this}>
          <div class="join-opening" aria-live="polite">
            <span>opening this space</span>
            <span class="tonk-pulse" aria-hidden="true"></span>
          </div>
          <tonk-display entity={this} model=tonk:join/failure>
            <span slot="no-entity"></span>
            <span slot="no-model"></span>
            <span slot="loading"></span>
          </tonk-display>
        </div>
      </div>

# The failure view — the default view for `tonk:join/failure`, so the join
# directory's per-instance `<tonk-display model=tonk:join/failure>` renders
# it only when a failure exists (i.e. status: failed). Shows the reason.
view!:
  this: tonk:join/failure
  show:
    ui: |
      <!-- Revoked and deleted intentionally share this one screen. The
           diagnostic reason remains in the console/worker status; rendering it
           here would reveal whether the space still exists. -->
      <section class="edge-wall edge-wall--closed" aria-labelledby="edge-closed-title">
        <div class="edge-statement" id="edge-closed-title">this share link is closed</div>
        <div class="edge-field edge-field--settled">
          <span class="edge-noun">share link</span>
          <span class="edge-value">closed</span>
        </div>
        <div class="edge-narrator">this link no longer opens a space; ask its sender for a current share link</div>
        <div class="edge-run">
          <a class="ebtn quiet" href="/">start a new space</a>
          <tonk-join-retry class="ebtn solid" kind={kind}>join this space</tonk-join-retry>
        </div>
      </section>

# ============================================================
# ROUTING (profile branch) — mirrors core.yaml, scoped to the profile
# ============================================================
#
# The profile is itself a routable target: `<tonk-site path=…>` posts to
# `/api/profile/branch/main/site`, the SW asserts this tab's `tonk:site` on this
# branch (matching the path against the `route!` table below), and the element
# renders `<tonk-display entity=site:… model=tonk:site>`. The site view nests the
# matched `{concept}` on the same site entity — the same indirection a space uses.

# A tab's location + the route concept it renders. Mirrors core.yaml's `&site`.
concept!: &site
  this: tonk:site
  description: A tab's location and the route concept it renders.
  with:
    path:
      description: Currently active path on this site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text
    anchor:
      description: Currently active anchor (URL hash) on this site.
      the: xyz.tonk.site/anchor
      cardinality: one
      as: text
    space:
      description: The space (repository name) on this site.
      the: xyz.tonk.site/space
      cardinality: one
      as: text
    branch:
      description: The active branch name on this site (defaults to "main").
      the: xyz.tonk.site/branch
      cardinality: one
      as: text
    replica:
      description: Currently active replica on this site.
      the: xyz.tonk.site/replica
      cardinality: one
      as: entity
    route:
      description: Matched route of this site.
      the: xyz.tonk.site/route
      cardinality: one
      as: entity
    concept:
      description: Matched route's concept (the model the shell mounts).
      the: xyz.tonk.site/concept
      cardinality: one
      as: entity

# The site view: render the matched route concept on this same site entity.
view!:
  this: tonk:site
  show:
    ui: |
      <tonk-display entity={this} model={concept} />

# The route table concept. Mirrors core.yaml's `&route`.
concept!: &route
  this: tonk:route
  description: A route — maps a path pattern to the model the SW mounts.
  with:
    path:
      description: The axum/matchit path pattern.
      the: xyz.tonk.route/path
      cardinality: one
      as: text
    concept:
      description: The route model to render when this path matches.
      the: xyz.tonk.route/concept
      cardinality: one
      as: entity

# The profile's only route for now: `/` renders the Hub.
route!: &route/home
  this: id:tonk:route/home
  path: "/"
  concept: tonk:hub

# The Hub route model + its view: the space directory over this (profile) branch.
# `tonk:hub` is the concept the `/` route resolves to; its view renders the
# `space` directory view, the same picker the legacy `<tonk-hub>` element mounted.
concept!: &hub
  this: tonk:hub
  description: The Tonk Hub — a picker over the profile's spaces.
  with:
    # Picked off the site entity. The hub view renders the `space`
    # directory and doesn't read it, but a `concept!` must declare at
    # least one field, and `path` is the natural one a route model carries.
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text

view!:
  this: tonk:hub
  show:
    ui: |
      <div class="display-view-slot">
        <tonk-title text="Tonk"></tonk-title>
        <tonk-display model="space"></tonk-display>
      </div>

# The /join route: redeem an invite. The shell's top-level `<tonk-site>`
# routes every path against this table, so without an entry `/join` matched
# nothing and the site rendered an empty `tonk:site` ("required attribute
# missing"). Mirrors the Hub: `/join` → `tonk:join/route`, whose entity view
# (on the site entity) mounts the no-entity `<tonk-display
# model="tonk:join/status">` directory. That directory's chrome carries the
# `<tonk-page onmount=tonk:join>` trigger, which reads the page location
# (the SW can't see the `#fragment` seed) and fires `tonk:join`.
route!: &route/join
  this: id:tonk:route/join
  path: "/join"
  concept: tonk:join/route

concept!: &join/route
  this: tonk:join/route
  description: The /join page — redeem an invite on the profile meta branch.
  with:
    # The hub carries `path` for the same reason: a route model must declare
    # at least one field, and the view doesn't read it (the join trigger
    # reads the location itself).
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text

view!:
  this: tonk:join/route
  show:
    ui: |
      <div class="display-view-slot">
        <tonk-title text="Tonk"></tonk-title>
        <main class="join-view">
          <style>
            .join-view {
              --edge-page:#e8e6e4; --edge-ink:#38182a; --edge-on:#f7f6f5;
              --edge-soft:#5b4953; --edge-card:#f7f6f5;
              --edge-ring:rgba(56,24,42,.85); --edge-wash:rgba(56,24,42,.12);
              min-height:100vh; padding:1px; color:var(--edge-ink);
              background:var(--edge-page); font-family:'IBM Plex Sans Condensed',
                'Bahnschrift','Arial Narrow',system-ui,sans-serif;
              font-weight:600; letter-spacing:.02em; -webkit-font-smoothing:antialiased;
            }
            :root.wa-dark .join-view {
              --edge-page:#161313; --edge-ink:#e2dfdd; --edge-on:#221c1d;
              --edge-soft:#c8c3bf; --edge-card:#1b1718;
              --edge-ring:rgba(226,223,221,.55); --edge-wash:rgba(226,223,221,.15);
            }
            .edge-mast { position:fixed; left:48px; top:48px; width:132px;
              color:var(--edge-ink); z-index:2; }
            .edge-mast img { display:block; width:100%; height:auto; }
            :root.wa-dark .edge-mast img { filter:invert(1); }
            .edge-wall { width:min(432px, calc(100vw - 32px)); margin-left:216px;
              margin-top:43px; display:flex; flex-direction:column; gap:7px; }
            .edge-statement, .edge-field, .edge-narrator { min-height:36px;
              background:var(--edge-card); box-shadow:0 0 0 1px var(--edge-ring); }
            .edge-statement { padding:10px 14px; display:flex; align-items:flex-end;
              font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:13.5px;
              line-height:1.55; text-wrap:balance; }
            .edge-field { height:36px; min-width:0; padding:0 10px 8px 12px;
              display:flex; align-items:flex-end; gap:12px; overflow:hidden; }
            .edge-noun { flex:none; color:var(--edge-soft); font-size:13px;
              line-height:1; text-transform:lowercase; }
            .edge-value { flex:1; min-width:0; color:var(--edge-ink); font:inherit;
              font-size:13px; line-height:1; text-align:right; }
            .edge-input { border:0; outline:0; padding:0; background:transparent;
              caret-color:transparent; }
            .edge-cur { width:7px; height:13px; margin-left:-7px;
              background:var(--edge-ink); mix-blend-mode:difference;
              animation:edge-cursor 1.05s steps(1,end) infinite; }
            .edge-narrator { padding:10px 14px; color:var(--edge-soft);
              font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:13px;
              font-weight:400; line-height:1.55; text-wrap:pretty; }
            .edge-narrator__invalid { display:none; }
            .edge-run { display:flex; gap:0; }
            .ebtn { min-height:40px; flex:1 1 0; padding:8px 10px; display:flex;
              align-items:flex-end; justify-content:flex-end; color:var(--edge-ink);
              text-decoration:none; text-transform:lowercase; cursor:pointer; }
            .ebtn.quiet { background:var(--edge-card);
              box-shadow:0 0 0 1px var(--edge-ring); }
            .ebtn.solid { color:var(--edge-on); background:var(--edge-ink); }
            .ebtn.solid button { width:100%; min-height:40px; padding:8px 10px;
              display:flex; align-items:flex-end; justify-content:flex-end;
              border:0; color:inherit; background:transparent; font:inherit;
              text-transform:lowercase; cursor:pointer; }
            .ebtn:active, .ebtn.solid button:active { scale:.96; }
            tonk-invite-link { display:none; }
            .edge-wall:has(tonk-invite-link[data-state="invalid"]) .edge-field {
              animation:edge-reject .45s ease 2; }
            .edge-wall:has(tonk-invite-link[data-state="invalid"])
              .edge-narrator__default { display:none; }
            .edge-wall:has(tonk-invite-link[data-state="invalid"])
              .edge-narrator__invalid { display:inline; }
            @keyframes edge-reject { 0%,100% { background:var(--edge-card); }
              50% { background:var(--edge-wash); } }
            @keyframes edge-cursor { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
            /* A join in flight or failed gives the status display a row;
               `data-state=ready` is `<tonk-display>`'s own signal for that,
               so the form steps aside without depending on the row's markup. */
            .join-view:has(.join-status-slot[data-state="ready"]) .join-paste { display: none; }
            .join-opening { width:min(432px, calc(100vw - 32px)); min-height:36px;
              margin-left:216px; margin-top:43px; padding:10px 14px;
              display:flex; align-items:center; justify-content:space-between;
              background:var(--edge-card); box-shadow:0 0 0 1px var(--edge-ring); }
            .join-status:has(tonk-display[data-state="ready"]) .join-opening { display:none; }
            @media (max-width:680px) {
              .edge-mast { left:16px; top:24px; width:98px; }
              .edge-wall, .join-opening { margin-left:16px; margin-top:132px; }
              .edge-run { flex-direction:column; }
              .ebtn { min-height:44px; }
            }
            @media (prefers-reduced-motion:reduce) {
              .edge-cur, .edge-wall:has(tonk-invite-link[data-state="invalid"])
                .edge-field { animation:none; }
            }
          </style>
          <a class="edge-mast" href="/" aria-label="Tonk home"><img src="/images/tonk-wordmark.svg" alt=""></a>
          <tonk-page onmount=tonk:join></tonk-page>
          <!-- `onmount`, not `onsubmit`: `<tonk-invite-link>` cancels the
               submit, resolves the pasted text (expanding a short link on
               its minting origin), and re-fires it as a bubbling `mount`
               carrying `detail.href` — the one read path `tonk:join`
               declares. Same command, same handler, whether the invite
               arrived in the address bar or in this box. -->
          <form class="join-paste edge-wall edge-wall--no-access" onmount=tonk:join>
            <div class="edge-statement">you do not have access to this space</div>
            <label class="edge-field">
              <span class="edge-noun">share link</span>
              <input class="edge-value edge-input" name="url" type="url" autocomplete="off" required aria-label="share link">
              <i class="edge-cur" aria-hidden="true"></i>
            </label>
            <tonk-invite-link field="url"></tonk-invite-link>
            <div class="edge-narrator">
              <span class="edge-narrator__default">paste the complete share link you were sent</span>
              <span class="edge-narrator__invalid">a share link is a complete web address carrying its access information</span>
            </div>
            <div class="edge-run">
              <a class="ebtn quiet" href="/">start a new space</a>
              <button class="ebtn solid" type="submit">join this space</button>
            </div>
          </form>
          <!-- The `tonk:join` trigger lives INSIDE the status display, not
               beside the form. `<tonk-page>` waits for its enclosing
               `<tonk-display>` to mark `data-bound` before firing, and a
               trigger placed in the route view waits on the ROUTE's display —
               which does not finish binding until its children render, so the
               page never painted. Nested here it waits on the status display
               instead, which binds independently, and the form above it is
               plain markup that renders regardless of any command. -->
          <tonk-display class="join-status-slot" model="tonk:join/status">
            <span slot="empty"></span>
            <span slot="loading"></span>
            <span slot="no-entity"></span>
          </tonk-display>
        </main>
      </div>

# The /inspector and /diagnose routes: the same query-inspector and
# search-tree views a space exposes, but pinned to the PROFILE branch so
# you can explore the profile DB (the hub's replicas, the member name,
# sync state) directly. `<tonk-inspector>` and `<tonk-tree>` resolve their
# repository from their own `with` — here the profile endpoint — so they
# query `/api/profile/branch/main/query` rather than a named space.
route!: &route/inspector
  this: id:tonk:route/inspector
  path: "/inspector"
  concept: tonk:inspector/route

concept!: &inspector/route
  this: tonk:inspector/route
  description: The /inspector page — a query inspector over the profile DB.
  with:
    # A route model must declare at least one field; the view doesn't read
    # it (the inspector needs no entity — it inspects the whole branch).
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text

view!:
  this: tonk:inspector/route
  show:
    ui: |
      <div class="display-view-slot">
        <tonk-title text="Tonk"></tonk-title>
        <tonk-inspector with="main@profile:tonk"></tonk-inspector>
      </div>

route!: &route/diagnose
  this: id:tonk:route/diagnose
  path: "/diagnose"
  concept: tonk:diagnose/route

concept!: &diagnose/route
  this: tonk:diagnose/route
  description: The /diagnose page — the search-tree inspector over the profile DB.
  with:
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text

view!:
  this: tonk:diagnose/route
  show:
    ui: |
      <div class="display-view-slot">
        <tonk-title text="Tonk"></tonk-title>
        <tonk-tree with="main@profile:tonk"></tonk-tree>
      </div>

# The space route: the profile routes ANY `/space/{id}/...` to the same UI — a
# full-size repo portal with the FAB floating on top — and hands the rest of the
# path to a NESTED `<tonk-site>` inside the portal, which routes it against the
# space's own route table. So `/space/{id}`, `/space/{id}/inspector`, etc. all
# render the same chrome; only the nested router's path differs.
# Two routes, same concept: the bare space root (`/space/{id}`, no sub-path) and
# any sub-path (`/space/{id}/{*rest}`). A `{*rest}` span may not capture nothing,
# so the bare form is its own route; it leaves `rest` unstamped, and the nested
# `<tonk-site>` defaults its absent `path` to `/`.
#
# The view keeps `<tonk-site path={rest}>` even when `rest` is absent because
# `rest` is a `cardinality: one` (scalar) field: `<tonk-display>` stamps the
# concept's scalar field names onto the `<tonk-view>` (`data-scalar-fields`), so
# the planner renders them as plain substitutions rather than iteration axes that
# would clone the host zero times — and drop it — when the value is empty.
route!: &route/space-root
  this: id:tonk:route/space-root
  path: "/space/{id}"
  concept: tonk:space/chrome

route!: &route/space-sub
  this: id:tonk:route/space-sub
  path: "/space/{id}/{*rest}"
  concept: tonk:space/chrome

# The space chrome model. `{id}` (the repository) and `{rest}` (the sub-path) are
# captured from the path and stamped on the site; the view reads them. `rest` is
# optional — the bare space route does not capture it, and the nested `<tonk-site>`
# defaults its absent `path` to `/`.
concept!: &space-chrome
  this: tonk:space/chrome
  description: The space chrome — repo portal with the FAB on top.
  with:
    id:
      description: The space repository id, picked off the site entity.
      the: xyz.tonk.site/id
      cardinality: one
      as: text
  maybe:
    rest:
      description: The sub-path within the space, picked off the site entity.
      the: xyz.tonk.site/rest
      cardinality: one
      as: text

view!:
  this: tonk:space/chrome
  show:
    ui: |
      <style>
        /* A spot this device does not hold answers every query with a
           404, which `<tonk-display>` classifies as `unknown` — a
           terminal state, unlike `offline`, so nothing retries and
           nothing arrives later. The title display below is the one
           element here that both queries the space and reports its
           state, so it carries the notice; when it fires, the portal
           has nothing to render and is hidden. The FAB stays: it
           carries the space switcher, which is the way off a page
           that is otherwise a dead end. `<tonk-fab>` hides its own
           share and roster in this case (see fab.css's
           `[data-unknown-space]`), since those act on a space that
           is not here. */
        .space-unknown { display: flex; flex-direction: column; gap: 12px;
          align-items: center; text-align: center; margin: 15vh auto 0;
          width: min(460px, 90%); }
        .space-unknown h1 { margin: 0; line-height: 36px; text-wrap: balance; }
        .space-unknown p { color: var(--wa-color-text-quiet); margin: 0; }
        .space-unknown-join { display: inline-flex; align-items: center;
          padding: 8px 20px; border-radius: var(--wa-border-radius-pill);
          background: var(--wa-color-brand-fill-loud);
          color: var(--wa-color-brand-on-loud); text-decoration: none;
          font-weight: 500; }
        .space-unknown-join:hover { opacity: .85; }
        /* Keyed off the display's own state, NOT a wrapper element: wrapping
           these siblings in a container changed which element the template
           engine picks as the repeat node (the outermost subject-referencing
           element), so `<tonk-site>` became the repeat node and `<tonk-fab>`
           was dropped from the output entirely. `:has()` reaches the sibling
           display without adding an element. */
        tonk-view:has(tonk-display[data-state="no-model"]) tonk-site { display: none; }
      </style>
      <tonk-site with="main@{id}" allow="main@{id}" path={rest}></tonk-site>
      <tonk-fab with="main@profile:tonk" space={id}></tonk-fab>
      <tonk-display with={id} entity={id} model=tonk:repository view=title>
        <!-- `no-model` is now the absent-spot panel below, which sets its
             own title; a second `no-model` child would render alongside it
             and fight over `document.title` (update_slot_children shows
             EVERY matching child, not the first). `no-entity` keeps the
             quiet placeholder: the concept resolved, the row just is not
             here yet. -->
        <tonk-title slot="no-entity" text="Untitled — Tonk"></tonk-title>
        <!-- The absent-spot case. A repository this device has not
             replicated answers every query with the EMPTY SET, so
             `tonk:repository` resolves to nothing and this display lands
             in `no-model` — the same state a not-yet-synced concept
             reaches, which is exactly right: the spot may arrive later,
             and when it does the standing subscription delivers a real
             frame and this panel is replaced in place.

             Slotted rather than left to the built-in fallback, which
             would show "Model not found — concept: tonk:repository" to
             someone whose actual problem is that they were never invited. -->
        <div slot="no-model" class="space-unknown">
          <tonk-title text="Not here — Tonk"></tonk-title>
          <h1>You don't have this spot</h1>
          <p>It isn't on this device, and this account has no access to it. If someone shared it with you, open their share link to join.</p>
          <!-- A plain top-level path. The guest classifies this as in-app
               (it resolves against the synthetic per-space origin) and asks
               the host to navigate; the host recognises `/join` as a
               PROFILE route and navigates the outer frame there instead of
               rewriting it to `/space/{did}/join`. See `real_href` /
               `is_top_level_route` in tonk-portal. -->
          <!-- A plain `<a>`, NOT `<wa-button href>`: the guest's click relay
               finds links with `closest("a[href]")`, and Web Awesome renders
               its anchor inside a SHADOW ROOT, which `closest` does not
               cross. The relay never matched, so the browser navigated the
               sealed FRAME to /join instead of the host navigating the top
               window — the join page booting inside an opaque origin with no
               service worker. Styled as a button below. -->
          <a class="space-unknown-join" href="/join">Join a spot</a>
        </div>
        <!-- A spot created before the `title` facet existed has no
             `show: {title: …}` entry on its branch, so `view=title`
             resolves nothing and the display enters `no-view` — a `danger`
             state. `update_slot_children` toggles `hidden`, it never adds
             or removes children, so with no matching slot child the
             built-in red `<wa-callout>` fires. This inert child suppresses
             that callout while pushing no title, leaving the tab exactly
             as it was — the old spot behavior. -->
        <span slot="no-view"></span>
      </tonk-display>

# The catch-all: any path no static/`/space/…` route claims lands here. The
# router matches most-specific-first, so this `{*rest}` span never shadows `/`,
# `/join`, `/inspector`, `/diagnose`, or `/space/{id}` — it only catches what
# nothing else does (a mistyped `/board`, a stale deep link). Without it such a
# path matches no route, the site is never stamped, and the shell spins forever.
route!: &route/not-found
  this: id:tonk:route/not-found
  path: "/{*rest}"
  concept: tonk:not-found

concept!: &not-found
  this: tonk:not-found
  description: The 404 page — a path the profile has no route for.
  with:
    # The attempted path, picked off the site, shown back to the user.
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text

view!:
  this: tonk:not-found
  show:
    ui: |
      <div class="display-view-slot">
        <style>
          .nf { display: flex; flex-direction: column; align-items: center;
                justify-content: center; gap: 8px; height: 100%; padding: 32px;
                text-align: center; color: var(--wa-color-text-normal); }
          .nf__code { font-size: 3rem; font-weight: 600; line-height: 1;
                      color: var(--wa-color-text-quiet); }
          .nf__msg { font-size: 1rem; color: var(--wa-color-text-quiet); }
          .nf__path { font-family: var(--wa-font-family-code, monospace);
                      color: var(--wa-color-text-normal); }
          .nf__home { margin-top: 8px; text-decoration: none; }
        </style>
        <tonk-title text="Tonk"></tonk-title>
        <div class="nf">
          <div class="nf__code">404</div>
          <div class="nf__msg">No page at <span class="nf__path">{path}</span></div>
          <a class="nf__home" href="/"><wa-button variant="brand">Back to Hub</wa-button></a>
        </div>
      </div>
