        <main class="hubcol">
        <hub-bar class="hub-bar">
          <nav class="hubbar chrome" aria-label="hub">
            <!-- Two links: the account's page and home. The host pushes
                 the path and this page re-routes in place, and the cell
                 for where the page is reads as current. -->
            <!-- The link, not the registration or the name: those are
                 facts about the account and outlive a sign-out on this
                 branch. The link row says whether THIS DEVICE holds the
                 account here; the name renders through it. Directory
                 mode (no `entity=`), where an absent row is `empty`. -->
            <a class="hcell hc-acct account-trigger" href="/account" data-account-trigger>
              <span data-account-label><tonk-display model="state:account-link" view="label" data-account-link
                ><span slot="empty">add an account</span></tonk-display></span>
            </a>
            <a class="hcell hc-view" href="/" data-return-spaces aria-current="page">spaces</a>
          </nav>
        </hub-bar>
          <!-- One page for `/` and `/settings`: the stack and the panel
               are both here, and the bar's `path` picks the one that
               shows. The view reads nothing off the site, so a navigation
               re-renders nothing here: the bar and the panel follow the
               host's context on their own, and the stack keeps its rows,
               its hover and its focus across the move. -->
          <tonk-display model="space"></tonk-display>
        <section class="settings chrome" data-settings-view>
            <account-settings>
              <div class="s-body">
                <!-- /account: the account's choices. Settings is a link to its
                     page; the other accounts on this browser switch;
                     `data-add-profile` rotates onto a fresh branch and the worker
                     reloads this tab onto it, where the page, having no account,
                     raises the ceremony itself. A browser with no account here
                     is shown the sign-in cluster and nothing to list. -->
                <div class="pane" data-pane="menu" hidden>
                  <div class="account-menu__profiles-seat" data-account-menu>
