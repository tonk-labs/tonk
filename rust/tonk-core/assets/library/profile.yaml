                    <p class="expl">each invite grants access to one space. anyone holding a copy can use it. a confirmation records completed setup, not a currently connected process.</p>
                    <p class="expl">revoking an invite affects all its holders and delegated access. enforcement can take time to reach the service; already downloaded data stays with its holders.</p>
                    <p class="expl" data-connections-status role="status" aria-live="polite"></p>
                    <div data-connections-list></div>
                  </section>
                  <div class="sect">sign out</div>
                  <div class="srowd">
                    <span>disconnect this account; keep local spaces on this device</span>
                    <button class="cta" type="button" data-sign-out-open>sign out on this device</button>
                  </div>
                  <div class="sect">delete data</div>
                  <div class="srowd">
                    <span>delete all data associated with this account</span>
                    <button class="cta" type="button" data-delete-account-open>delete account (permanent)</button>
                  </div>
                </div>
                <div class="pane" data-pane="link" hidden data-link-approval>
                  <div class="sect">a terminal is asking for access</div>
                  <div class="srowd"><span>name</span><b data-link-name></b></div>
                  <div class="srowd"><span>account</span><b class="lft" data-link-account></b></div>
                  <div class="srowd"><span>device</span><b class="lft" data-link-did></b></div>
                  <p class="expl">
                    approving gives that terminal the same access to your account as this
                    browser: every space, on every device. decline if you did not request
                    account access from this device yourself.
                  </p>
                  <div class="link-foot">
                    <button class="m-cancel" type="button" data-link-decline>decline</button>
                    <button class="m-go" type="button" data-link-approve on:authorize-device=tonk:authorize-device
                      data-audience="" data-callback="" data-name="" data-expected-account="">approve with passkey</button>
                  </div>
                </div>
                <div class="pane" data-pane="local-link" hidden data-local-link-approval>
                  <div class="sect">attach a local space to this account</div>
                  <div class="srowd"><span>space</span><b data-local-link-name></b></div>
                  <div class="srowd"><span>space ID</span><b class="lft" data-local-link-did></b></div>
                  <p class="expl">
                    approving preserves this exact local space and publishes it to the
                    account selected in this browser. it does not sign the terminal into
                    your account or grant access to any other space.
                  </p>
                  <div class="link-foot">
                    <button class="m-cancel" type="button" data-local-link-decline>decline</button>
                    <button class="m-go" type="button" data-local-link-approve>approve this space</button>
                  </div>
                </div>
                <p class="expl" data-ceremony-status role="status" aria-live="polite" hidden></p>
                <tonk-display model="state:ceremony" view="settings"></tonk-display>
                <div data-custody-seat aria-hidden="true"></div>
              </div>
              <tonk-dialog data-sign-out-dialog heading="confirm sign out">
                <div class="confirm-body">
                  this disconnects the account from this browser. local spaces stay on this device, including spaces that have not been backed up or synced. you can sign into this or another account later.
                </div>
                <button class="m-cancel" slot="actions" type="button" data-dialog="close">cancel</button>
                <button class="m-go" slot="actions" type="button" data-sign-out-submit on:sign-out=tonk:sign-out>sign out</button>
              </tonk-dialog>
            </account-settings>
          </section>
        </main>
      </div>
# The /settings route is the hub with its settings section showing: the
# same view as `/`, so moving between them is a path change the view
# re-renders in place, not a page swap.
route!: &route/settings
  this: id:tonk:route/settings
  path: "/settings"
  concept: tonk:hub

# `/settings/link` is the same page: a terminal opened it to ask for
# access, and the settings panel reads the request off the location.
route!: &route/settings/link
  this: id:tonk:route/settings/link
  path: "/settings/link"
  concept: tonk:hub

# The /join route: redeem an invite. The shell's top-level `<tonk-site>`
# routes every path against this table, so without an entry `/join` matched
# nothing and the site rendered an empty `tonk:site` ("required attribute
# missing"). Mirrors the Hub: `/join` → `tonk:join/route`, whose entity view
# (on the site entity) mounts the no-entity `<tonk-display
# model="tonk:join/status">` directory. That directory's chrome carries the
# `<page-mount on:join=tonk:join>` trigger, which reads the page location
# (the SW can't see the `#fragment` seed) and fires `tonk:join`.
route!: &route/join
  this: id:tonk:route/join
  path: "/join"
  concept: tonk:join/route

concept!: &join/route
  this: tonk:join/route
  description: The /join page — redeem an invite on the profile meta branch.
  with:
    # The hub carries `path` for the same reason: a route model must declare
    # at least one field, and the view doesn't read it (the join trigger
    # reads the location itself).
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text

view!:
  this: tonk:join/route
  show:
    ui: |
      <div class="display-view-slot">
        <tab-title text="Tonk"></tab-title>
        <main class="join-view">
          <style>
            .join-view {
              --edge-page:#e8e6e4; --edge-ink:#38182a; --edge-on:#f7f6f5;
              --edge-soft:#5b4953; --edge-card:#f7f6f5;
              --edge-ring:rgba(56,24,42,.85); --edge-wash:rgba(56,24,42,.12);
              min-height:100vh; min-height:100dvh; padding:48px 16px 80px;
              box-sizing:border-box; color:var(--edge-ink);
              background:var(--edge-page); font-family:'IBM Plex Sans Condensed',
                'Bahnschrift','Arial Narrow',system-ui,sans-serif;
              font-weight:600; letter-spacing:.02em; -webkit-font-smoothing:antialiased;
            }
            :root.wa-dark .join-view {
              --edge-page:#161313; --edge-ink:#e2dfdd; --edge-on:#221c1d;
              --edge-soft:#c8c3bf; --edge-card:#1b1718;
              --edge-ring:rgba(226,223,221,.55); --edge-wash:rgba(226,223,221,.15);
            }
            .edge-mast { position:relative; display:block; width:132px;
              margin:0 auto 56px; color:var(--edge-ink); z-index:2; }
            .edge-mast img { display:block; width:100%; height:auto; }
            :root.wa-dark .edge-mast img { filter:invert(1); }
            .edge-wall { width:min(576px, 100%); margin:0 auto;
              display:flex; flex-direction:column; gap:7px; }
            .edge-statement, .edge-narrator { min-height:36px;
              background:var(--edge-card); box-shadow:0 0 0 1px var(--edge-ring); }
            .edge-statement { margin:0; padding:10px 14px; display:flex; align-items:flex-end;
              color:var(--edge-ink); font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:13.5px;
              line-height:1.55; text-wrap:balance; }
            .edge-narrator { padding:10px 14px; color:var(--edge-soft);
              font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:13px;
              font-weight:400; line-height:1.55; text-wrap:pretty; }
            .edge-run { display:flex; gap:0; }
            .ebtn { height:40px; min-height:40px; flex:1 1 0; box-sizing:border-box;
              padding:8px 10px; display:flex; align-items:flex-end; justify-content:flex-end;
              appearance:none; border:0; border-radius:0; color:var(--edge-ink);
              background:transparent; font:inherit; line-height:1; white-space:normal;
              text-decoration:none; text-transform:lowercase; cursor:pointer; }
            .ebtn.solid { color:var(--edge-on); background:var(--edge-ink); }
            .ebtn:active { scale:.96; }
            .join-view:has(.join-status-slot[data-state="ready"]):not(:has(.edge-wall--closed))
              .edge-mast { display:none; }
            /* Match the destination-neutral boot shell: only the shared pulse
               is visible, centred over the whole route. Keep the status text
               in the live region for assistive technology. */
            .join-opening { position:fixed; inset:0; z-index:3;
              display:flex; align-items:center; justify-content:center;
              color:var(--edge-ink); background:var(--edge-page); }
            .join-opening-status { position:absolute; width:1px; height:1px;
              margin:-1px; padding:0; overflow:hidden; clip:rect(0,0,0,0);
              white-space:nowrap; border:0; }
            .join-status:has(tonk-display[data-state="ready"]) .join-opening { display:none; }
            /* A reconnect keeps the last good failure view mounted while its
               display returns to loading. Prefer the rendered terminal state
               over that transient lifecycle attribute, or both rows appear. */
            .join-status:has(.edge-wall--closed) .join-opening { display:none; }
            @media (max-width:680px) {
              .join-view { padding-top:20px; }
              .edge-mast { width:98px; min-height:44px; margin-bottom:40px;
                display:flex; align-items:center; }
              .edge-run { flex-direction:column; }
              .ebtn { height:44px; min-height:44px; }
            }
          </style>
          <a class="edge-mast" href="/" aria-label="Tonk home"><img src="/images/tonk-wordmark.svg" alt=""></a>
          <page-mount on:join=tonk:join></page-mount>
          <!-- Invite URLs are opened directly in the browser. Bare /join
               visits return home through the join handler. -->
          <tonk-display class="join-status-slot" model="tonk:join/status">
            <span slot="empty"></span>
            <span slot="loading"></span>
            <span slot="no-entity"></span>
          </tonk-display>
        </main>
      </div>

# The /inspector and /diagnose routes: the same query-inspector and
# search-tree views a space exposes, but pinned to the PROFILE branch so
# you can explore the profile DB (the hub's replicas, the member name,
# sync state) directly. `<tonk-inspector>` and `<tonk-tree>` resolve their
# repository from their own `with` — here the profile endpoint — so they
# query `/api/profile/branch/main/query` rather than a named space.
#
# Both take that `with` from the SITE, exactly as core.yaml's route views do,
# rather than naming the profile endpoint literally. The site's `repo` is a
# LOCATION TOKEN (`profile:<name>` here, a bare repository key in a space), so
# `{branch}@{repo}` is the one spelling that resolves in either context — which
# is what lets the same view be written once. The literal it replaces also
# pinned the profile NAME, so it addressed the wrong endpoint outright for any
# profile not called `tonk`.
route!: &route/inspector
  this: id:tonk:route/inspector
  path: "/inspector"
  concept: tonk:inspector/route

concept!: &inspector/route
  this: tonk:inspector/route
  description: The /inspector page — a query inspector over the profile DB.
  with:
    # The inspector needs no entity — it inspects the whole branch — but it
    # does need the branch, so `repo`/`branch` are what the model declares.
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text
    repo:
      description: The repository location token, picked off the site entity.
      the: xyz.tonk.site/repo
      cardinality: one
      as: text
    branch:
      description: The branch, picked off the site entity.
      the: xyz.tonk.site/branch
      cardinality: one
      as: text

view!:
  this: tonk:inspector/route
  show:
    ui: |
      <div class="display-view-slot">
        <tab-title text="Tonk"></tab-title>
        <tonk-inspector with="{branch}@{repo}"></tonk-inspector>
      </div>

route!: &route/diagnose
  this: id:tonk:route/diagnose
  path: "/diagnose"
  concept: tonk:diagnose/route

concept!: &diagnose/route
  this: tonk:diagnose/route
  description: The /diagnose page — the search-tree inspector over the profile DB.
  with:
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text
    repo:
      description: The repository location token, picked off the site entity.
      the: xyz.tonk.site/repo
      cardinality: one
      as: text
    branch:
      description: The branch, picked off the site entity.
      the: xyz.tonk.site/branch
      cardinality: one
      as: text

view!:
  this: tonk:diagnose/route
  show:
    ui: |
      <div class="display-view-slot">
        <tab-title text="Tonk"></tab-title>
        <tonk-tree with="{branch}@{repo}"></tonk-tree>
      </div>

# The space route: the profile routes ANY `/space/{id}/...` to the same UI — a
# full-size repo portal with the FAB floating on top — and hands the rest of the
# path to a NESTED `<tonk-site>` inside the portal, which routes it against the
# space's own route table. So `/space/{id}`, `/space/{id}/inspector`, etc. all
# render the same chrome; only the nested router's path differs.
# Two routes, same concept: the bare space root (`/space/{id}`, no sub-path) and
# any sub-path (`/space/{id}/{*rest}`). A `{*rest}` span may not capture nothing,
# so the bare form is its own route; it leaves `rest` unstamped, and the nested
# `<tonk-site>` defaults its absent `path` to `/`.
#
# The view keeps `<tonk-site path={rest}>` even when `rest` is absent because
# `rest` is a `cardinality: one` (scalar) field: `<tonk-display>` stamps the
# concept's scalar field names onto the `<tonk-view>` (`data-scalar-fields`), so
# the planner renders them as plain substitutions rather than iteration axes that
# would clone the host zero times — and drop it — when the value is empty.
route!: &route/space-root
  this: id:tonk:route/space-root
  path: "/space/{id}"
  concept: tonk:space/chrome

route!: &route/space-sub
  this: id:tonk:route/space-sub
  path: "/space/{id}/{*rest}"
  concept: tonk:space/chrome

# The space chrome model. `{id}` (the repository) and `{rest}` (the sub-path) are
# captured from the path and stamped on the site; the view reads them. `rest` is
# optional — the bare space route does not capture it, and the nested `<tonk-site>`
# defaults its absent `path` to `/`.
concept!: &space-chrome
  this: tonk:space/chrome
  description: The space chrome — repo portal with the FAB on top.
  with:
    id:
      description: The space repository id, picked off the site entity.
      the: xyz.tonk.site/id
      cardinality: one
      as: text
    profile-branch:
      description: >
        The branch the profile is on, picked off the site entity: the
        FAB and the access guidance talk to the profile, and the profile
        is on its account's branch, not on `main`.
      the: xyz.tonk.site/profile-branch
      cardinality: one
      as: text
  maybe:
    rest:
      description: The sub-path within the space, picked off the site entity.
      the: xyz.tonk.site/rest
      cardinality: one
      as: text

view!:
  this: tonk:space/chrome
  show:
    ui: |
      <style>
        /* The absent-space state is profile chrome, not space content. It uses
           the same edge wall, palette, typography, and compact geometry as the
           `/join` ceremony instead of inheriting Web Awesome's pill skin. */
        .space-unknown {
          --edge-page:#e8e6e4; --edge-ink:#38182a; --edge-on:#f7f6f5;
          --edge-soft:#5b4953; --edge-card:#f7f6f5;
          --edge-ring:rgba(56,24,42,.85); --edge-wash:rgba(56,24,42,.12);
          position:fixed; inset:0;
          overflow:auto; padding:48px 16px 80px; box-sizing:border-box;
          background:var(--edge-page);
          color:var(--edge-ink); font-family:'IBM Plex Sans Condensed',
            'Bahnschrift','Arial Narrow',system-ui,sans-serif;
          font-weight:600; letter-spacing:.02em; -webkit-font-smoothing:antialiased; }
        :root.wa-dark .space-unknown {
          --edge-page:#161313; --edge-ink:#e2dfdd; --edge-on:#221c1d;
          --edge-soft:#c8c3bf; --edge-card:#1b1718;
          --edge-ring:rgba(226,223,221,.55); --edge-wash:rgba(226,223,221,.15); }
        .space-unknown *, .space-unknown *::before, .space-unknown *::after {
          box-sizing:border-box; }
        .space-unknown ::selection { background:var(--edge-ink); color:var(--edge-on); }
        .space-unknown :focus-visible { outline:none;
          box-shadow:inset 0 0 0 2px var(--edge-on),
            inset 0 0 0 4px var(--edge-ink); }
        .space-unknown-mast { position:relative; display:block; width:132px;
          margin:0 auto 56px; color:var(--edge-ink); z-index:2; }
        .space-unknown-mast img { display:block; width:100%; height:auto; }
        :root.wa-dark .space-unknown-mast img { filter:invert(1); }
        .space-unknown-wall { width:min(576px, 100%); margin:0 auto;
          display:flex; flex-direction:column; gap:7px; }
        .space-unknown-statement, .space-unknown-narrator { min-height:36px;
          margin:0; background:var(--edge-card);
          box-shadow:0 0 0 1px var(--edge-ring); }
        .space-unknown-statement { padding:10px 14px; display:flex; align-items:flex-end;
          color:var(--edge-ink);
          font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:13.5px;
          font-weight:600; line-height:1.55; text-wrap:balance; }
        .space-unknown-narrator { padding:10px 14px; color:var(--edge-soft);
          font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:13px;
          font-weight:400; line-height:1.55; text-wrap:pretty; }
        .space-unknown-run { display:flex; }
        .space-unknown-run space-login { display:block; width:100%; }
        .space-unknown-back { align-self:flex-start; min-height:44px;
          display:flex; align-items:center; color:var(--edge-ink);
          text-underline-offset:3px; }
        .space-unknown-home { width:100%; min-height:44px; padding:8px 10px;
          border:0; border-radius:0; font:inherit; letter-spacing:inherit;
          display:flex; align-items:flex-end; justify-content:flex-end; gap:8px;
          background:var(--edge-ink); color:var(--edge-on); text-decoration:none;
          text-transform:lowercase; cursor:pointer; transition-property:scale;
          transition-duration:150ms; transition-timing-function:ease-out; }
        .space-unknown-home:hover {
          background:linear-gradient(var(--edge-wash),var(--edge-wash)), var(--edge-ink); }
        .space-unknown-home:active { scale:.96; }
        @media (max-width:680px) {
          .space-unknown { padding-top:20px; }
          .space-unknown-mast { width:98px; min-height:44px; margin-bottom:40px;
            display:flex; align-items:center; }
          .space-unknown-home { min-height:44px; }
        }
        @media (prefers-reduced-motion:reduce) {
          .space-unknown-home { transition:none; }
          .space-unknown-home:active { scale:none; }
        }
        @media (forced-colors:active) {
          .space-unknown :focus-visible { outline:2px solid Highlight; }
        }
        /* Keyed off the display's own state, NOT a wrapper element: wrapping
           these siblings in a container changed which element the template
           engine picks as the repeat node (the outermost subject-referencing
           element), so `<tonk-site>` became the repeat node and `<tonk-fab>`
           was dropped from the output entirely. `:has()` reaches the sibling
           display without adding an element. */
        tonk-view:has(> tonk-display[data-state="no-model"]) > tonk-site,
        tonk-view:has(> tonk-display[data-state="no-model"]) > tonk-fab { display: none; }
      </style>
      <tonk-site with="main@{id}" allow="main@{id}" path={rest}></tonk-site>
      <tonk-fab with="{profile-branch}@profile:tonk" space={id}></tonk-fab>
      <tonk-display with={id} entity={id} model=tonk:repository view=title>
        <!-- `no-model` is now the absent-space panel below, which sets its
             own title; a second `no-model` child would render alongside it
             and fight over `document.title` (update_slot_children shows
             EVERY matching child, not the first). `no-entity` keeps the
             quiet placeholder: the concept resolved, the row just is not
             here yet. -->
        <tab-title slot="no-entity" hidden text="Untitled — Tonk"></tab-title>
        <!-- The absent-space case. A repository this device has not
             replicated answers every query with the EMPTY SET, so
             `tonk:repository` resolves to nothing and this display lands
             in `no-model`.

             That state has TWO causes and they need opposite words: a
             space the account knows and is still pulling, and a space
             this person was never invited to. The DIRECTORY ROW tells
             them apart. It hangs on the repository's own entity, is
             asserted once per space and converges on every device, and
             lives on the profile branch — so it is readable here even
             though the space's own content is not. A row means the
             account has this space and the bytes are on their way; no
             row means the link opens nothing this account holds.

             So the panel is a nested single-entity display over
             `tonk:space`, and the access guidance owns both absence
             states that display can report. `no-entity` is the normal
             empty-row result; `no-model` covers an older profile whose
             `space` concept has not arrived yet. -->
        <!-- Light-DOM slots must be hidden in the template too: before the
             display initializes they otherwise paint as ordinary content. -->
        <div slot="no-model" hidden class="space-unknown">
          <tonk-display with="{profile-branch}@profile:tonk" entity={id} model=space view=downloading>
            <!-- The account has this space: it is arriving, not missing.
                 When it lands, the OUTER display's standing subscription
                 delivers a real frame and this whole panel is replaced. -->
            <!-- No directory row: this account does not hold the space.
                 A single-entity query normally reports `no-entity`; keep
                 `no-model` as the same recovery for an older profile whose
                 directory concept has not arrived yet. -->
            <div slot="no-model" hidden>
              <tab-title text="Open this space — Tonk"></tab-title>
              <a class="space-unknown-mast" href="/" aria-label="Tonk home"><img src="/images/tonk-wordmark.svg" alt=""></a>
              <div class="space-unknown-wall">
                <h1 class="space-unknown-statement">open this space</h1>
                <p class="space-unknown-narrator">Already use this space? Sign in with your account. If you added Tonk to your Home Screen, you may need to sign in again here.</p>
                <!-- The recovery control opens the top-page account ceremony. -->
                <div class="space-unknown-run">
                  <space-login><button type="button" class="space-unknown-home">sign in<span aria-hidden="true">&#9656;</span></button></space-login>
                </div>
                <p class="space-unknown-narrator">New to this space? Ask someone in it to send you an invite link from <strong>share</strong>.</p>
                <a class="space-unknown-back" href="/">go to home</a>
              </div>
            </div>
            <div slot="no-entity" hidden>
              <tab-title text="Open this space — Tonk"></tab-title>
              <a class="space-unknown-mast" href="/" aria-label="Tonk home"><img src="/images/tonk-wordmark.svg" alt=""></a>
              <div class="space-unknown-wall">
                <h1 class="space-unknown-statement">open this space</h1>
                <p class="space-unknown-narrator">Already use this space? Sign in with your account. If you added Tonk to your Home Screen, you may need to sign in again here.</p>
                <!-- The recovery control opens the top-page account ceremony. -->
                <div class="space-unknown-run">
                  <space-login><button type="button" class="space-unknown-home">sign in<span aria-hidden="true">&#9656;</span></button></space-login>
                </div>
                <p class="space-unknown-narrator">New to this space? Ask someone in it to send you an invite link from <strong>share</strong>.</p>
                <a class="space-unknown-back" href="/">go to home</a>
              </div>
            </div>
            <!-- A space seeded before the `downloading` facet existed
                 resolves no view. Stay quiet rather than firing the
                 built-in red callout at someone whose space is merely
                 still arriving: `update_slot_children` toggles `hidden`
                 on matching children, so an inert one suppresses it. -->
            <span slot="no-view" hidden></span>
          </tonk-display>
        </div>
        <!-- A space created before the title facet existed has no
             `show: {title: …}` entry on its branch, so `view=title`
             resolves nothing and the display enters `no-view` — a `danger`
             state. `update_slot_children` toggles `hidden`, it never adds
             or removes children, so with no matching slot child the
             built-in red `<wa-callout>` fires. This inert child suppresses
             that callout while pushing no title, leaving the tab exactly
             as it was — the behavior for older spaces. -->
        <span slot="no-view" hidden></span>
      </tonk-display>

# The catch-all: any path no static/`/space/…` route claims lands here. The
# router matches most-specific-first, so this `{*rest}` span never shadows `/`,
# `/join`, `/inspector`, `/diagnose`, or `/space/{id}` — it only catches what
# nothing else does (a mistyped `/board`, a stale deep link). Without it such a
# path matches no route, the site is never stamped, and the shell spins forever.
route!: &route/not-found
  this: id:tonk:route/not-found
  path: "/{*rest}"
  concept: tonk:not-found

concept!: &not-found
  this: tonk:not-found
  description: The 404 page — a path the profile has no route for.
  with:
    # The attempted path, picked off the site, shown back to the user.
    path:
      description: The active path, picked off the site.
      the: xyz.tonk.site/path
      cardinality: one
      as: text

view!:
  this: tonk:not-found
  show:
    ui: |
      <div class="display-view-slot">
        <style>
          .nf { display: flex; flex-direction: column; align-items: center;
                justify-content: center; gap: 8px; height: 100%; padding: 32px;
                text-align: center; color: var(--wa-color-text-normal); }
          .nf__code { font-size: 3rem; font-weight: 600; line-height: 1;
                      color: var(--wa-color-text-quiet); }
          .nf__msg { font-size: 1rem; color: var(--wa-color-text-quiet); }
          .nf__path { font-family: var(--wa-font-family-code, monospace);
                      color: var(--wa-color-text-normal); }
          .nf__home { margin-top: 8px; text-decoration: none; }
        </style>
        <tab-title text="Tonk"></tab-title>
        <div class="nf">
          <div class="nf__code">404</div>
          <div class="nf__msg">No page at <span class="nf__path">{path}</span></div>
          <a class="nf__home" href="/"><wa-button variant="brand">Back to Hub</wa-button></a>
        </div>
      </div>

# ════════════════════════════════════════════════════════════════════
# Account facts
#
# Everything below is true about the ACCOUNT rather than about one space
# or one device: who the account is, which devices may act for it, what
# holds its secret, how it is registered with an access service, and
# which profiles this device can open. These live on the account branch
# and replicate with it, so a new device learns them by pulling rather
# than by asking a service.
#
# Not every concept here is read through its declaration today — the FAB
# subscribes to the raw `xyz.tonk.*` attributes instead, deliberately, so
# a space seeded from an older library does not break the read (see
# `tonk-fab/src/member_roster.rs`). That is a fine reason to query by
# attribute. It is not a reason to leave the schema undocumented: the
# declaration is what says a fact exists and what it means.
# ════════════════════════════════════════════════════════════════════

# The account-wide display name, keyed by the immutable account subject.
#
# Cardinality-one, so two devices renaming concurrently converge on one
# deterministic value. No wall-clock ordering is implied: this is
# dialog's merge, not last-write-wins.
concept!: &account/name
  this: tonk:account/name
  description: The account's display name.
  # ENTITY: the account's own DID.
  with:
    name:
      description: >
        The authoritative account display name
        (xyz.tonk.account/display-name). Distinct from
        `tonk:profile/name`, which is one device's own override.
      the: xyz.tonk.account/display-name
      cardinality: one
      as: text

# The account's registration with an access service.
#
# Registration state as a FACT, not as a cached HTTP answer: every
# device reads it with an ordinary query and converges through sync, so
# a device that never ran the enrollment still knows whether the account
# is servable. Written when enrollment records `Registered` and again
# when activation promotes it to `Active`.
# Registration, activation and suspension are three INDEPENDENT facts,
# each written once by the act that proves it and never rewritten.
#
# They compose rather than replace: a suspended account is still a
# registered one, and an activated account keeps its registration. That
# is why each is its own concept with every field required, instead of
# optional fields on one row — absence of the concept is the signal, so
# nothing needs a field that is sometimes missing.
#
# This replaces a single cardinality-one `status` string, which had two
# faults. String variants are unvalidated: `is_active()` was a `==
# "Active"` match that a typo defeats silently. And one slot written by
# both enrollment and activation is a race — dialog's merge picks a
# winner, so an account that IS activated could converge back to
# registered. Adding a fact only ever narrows, so concurrent writers
# converge instead of fighting.
concept!: &account/registered
  this: tonk:account/registered
  description: The account enrolled an address with an access service.
  # ENTITY: the account's own DID.
  with:
    registered-at:
      description: When enrollment recorded the address, unix seconds.
      the: xyz.tonk.account/registered-at
      cardinality: one
      as: unsigned-integer
    email:
      description: The address enrollment named.
      the: xyz.tonk.account/customer-email
      cardinality: one
      as: text
    provider:
      description: >
        Where this account syncs: the UCAN endpoint its spaces attach
        their remotes to. Known at enrollment and unchanged by
        activation, so it belongs here rather than on the activation
        fact — a client can attach its remote immediately and let the
        gate answer.

        That is what makes activation observable without asking: the
        remote answers 403 while the customer is unconfirmed and 200
        once the emailed link is opened, so a device learns it was
        activated from the sync it was already doing.
      the: xyz.tonk.account/provider-address
      cardinality: one
      as: text

# Activation. Its PRESENCE is what makes an account served; nothing has
# to overwrite the registration to say so.
# The account is being LINKED on this device right now — overlay-only.
# Login finishes as soon as custody is recovered, so between then and the
# account branch arriving there is a real window where the person is
# signed in but their spaces are not here yet. Without this the Hub had
# nothing to say in that window: it offered "link an account" (a door
# already walked through) over an empty stack (a claim nobody had
# established).
#
# Presence is the whole signal, and overlay because the window is
# temporary: a worker that dies mid-link leaves nothing to clear.
concept!: &account/linking
  this: tonk:account/linking
  description: This device is linking the account right now.
  # ENTITY: the account's own DID.
  with:
    linking:
      description: Always true while the link runs; dropped when it settles.
      the: xyz.tonk.account/linking
      cardinality: one
      as: boolean

# Whether THIS DEVICE holds the account's authority on this branch.
# Overlay-only, published by the worker: the facts on a branch describe
# the account and stay after a sign-out there, so a bar that read them
# would call a signed-out branch linked. This row is what "linked" means.
concept!: &account/link
  this: state:account-link
  description: This device is linked to an account on the active branch.
  with:
    account:
      description: The linked account's DID.
      the: xyz.tonk.link/account
      cardinality: one
      as: entity

# The hub bar's account cell: a hidden marker the bar keys on, and the
# account's name rendered THROUGH the link, so a branch whose link is
# gone offers "add an account" however much it still knows about the
# account it followed. Pinned to `this` so no row renders nothing.
view!:
  this: account/link
  show:
    label: |
      <span data-account-link-row data-of={this}><span data-account-linked hidden></span><tonk-display model="tonk:account/name" entity={account} view="directory"><span slot="no-entity"></span></tonk-display></span>

concept!: &account/active
  this: tonk:account/active
  description: The account confirmed its address and is served.
  # ENTITY: the account's own DID.
  with:
    activated-at:
      description: >
        When the emailed link was opened and the service confirmed it,
        unix seconds.
      the: xyz.tonk.account/activated-at
      cardinality: one
      as: unsigned-integer

# Suspension: the service withdrew.
concept!: &account/suspended
  this: tonk:account/suspended
  description: The service withdrew from serving this account.
  # ENTITY: the account's own DID.
  with:
    suspended-at:
      description: >
        When the withdrawal took effect, unix seconds. A support
        conversation starts with when service stopped.
      the: xyz.tonk.account/suspended-at
      cardinality: one
      as: unsigned-integer
    reason:
      description: Why the service withdrew, in words a person can act on.
      the: xyz.tonk.account/suspension-reason
      cardinality: one
      as: text

# The onboarding account: a real account this device minted for itself,
# custodied locally, before anyone signed up.
#
# ENTITY: the onboarding account's own DID.
#
# It exists so a device can create and own spaces immediately — signup is
# not a precondition for using Tonk. Its secret is sealed to a keypair on
# this device rather than to a passkey, which is exactly what makes it
# INTERIM: nothing recovers it elsewhere, and signing up rotates every
# custodied seed onto the real account and retires this one.
#
# Recorded as a fact so it can be seen. The secret itself stays in a
# credential site; this is only the DID and the moment, so an inspector can
# answer "which account am I acting as, and is it the real one?".
#
# This account HAS custody before any passkey exists: a custodian keypair
# on this device, a KEK sealed to it, and the account secret sealed under
# that. All three live in credential sites, so unlike a passkey's envelope
# there is no `secret:message` to find — the custodian is a local key, not
# a principal anything else can address. `custodian` names it so the
# arrangement is at least visible.
concept!: &account/onboarding
  this: tonk:account/onboarding
  description: A locally custodied account, held until a real one replaces it.
  with:
    minted-at:
      description: When this device minted the onboarding account, unix seconds.
      the: xyz.tonk.account/onboarding-minted-at
      cardinality: one
      as: unsigned-integer
  maybe:
    custodian:
      description: >
        The local keypair holding this account: what its secret is sealed
        under before a passkey exists. A device-local key, so nothing
        addresses it and no sealed message names it as recipient — this is
        the only record that it is what currently holds the account.
      the: xyz.tonk.account/onboarding-custodian
      cardinality: one
      as: entity
    retired-at:
      description: >
        When a real account took over, unix seconds. Its presence is what
        says this account is no longer the one in use — the row stays so
        the handover is visible rather than silently gone.
      the: xyz.tonk.account/onboarding-retired-at
      cardinality: one
      as: unsigned-integer

# The account's status, DERIVED from the facts above.
#
# ENTITY: the account's own DID.
#
# Deductive (`assert:`, no bang), so it is computed on read and never
# stored. A stored status would be a writable slot that could disagree with
# the facts it summarises; deriving it means the summary cannot drift from
# what actually happened.
#
# The four cases are mutually exclusive, and each rule below states the
# whole condition rather than relying on rule order:
#
#   case:onboarding  a locally custodied account, not yet registered
#   case:registered  enrolled, and neither activated nor suspended
#   case:active      activated and not suspended
#   case:suspended   the service withdrew
concept!: &account/status
  this: tonk:account/status
  description: The account's status, derived from its registration facts.
  with:
    status:
      description: >
        `case:onboarding`, `case:registered`, `case:active`, or
        `case:suspended` — an entity label rather than text, so a typo
        cannot silently read as a different state.
      the: xyz.tonk.account/status
      cardinality: one
      as: entity

# An onboarding account that has not been handed over is interim.
# ---------------------------------------------------------------
# PRESENCE — where a space stands on THIS device
# ---------------------------------------------------------------
#
# Derived rather than stored so they cannot drift from the replica they
# describe.
#
# The replica is resolved FORWARD from the session: a replica entity is
# derived from `(profile, subject)`, so binding the space and the session's
# profile determines the row. Both rules therefore bind `?replica` in
# `when:`, which is what lets the second one negate over it — a negated
# premise may not introduce bindings, its own entity included.
#
# There is no `remote` rule for that reason: remote is the ABSENCE of a
# replica row, and negating it would have to introduce the very entity it
# is testing for. Absence of `presence` carries that case instead.
#
# Seeding is genuinely per-replica: only the device that CREATED a space
# ever sees it mid-seed, since any other device holding it pulled content
# that already carries the seed.

concept!: &db/session:
  this: concept:session
  description: Database session information
  with:
    profile:
      description: >
        Profile entity (as did:key) representing persistent identity on
        this device.
      the: dialog.session/profile
      as: entity

concept!: &space/replica
  this: tonk:space/replica
  description: A device profile's replica of a space.
  with:
    subject:
      description: The space this replica is a view of.
      the: xyz.tonk.replica/subject
      cardinality: one
      as: entity
    profile:
      description: The device profile holding it.
      the: xyz.tonk.replica/profile
      cardinality: one
      as: entity

concept!: &space/replica-status
  this: tonk:space/replica-status
  description: A replica's seeding status.
  with:
    status:
      description: '`tonk:blank` while seeding, `tonk:initialized` after.'
      the: xyz.tonk.replica/status
      cardinality: one
      as: entity

# A pull IN FLIGHT on this device, overlay-only. Asserted before the
# mount starts and retracted when it settles, so its PRESENCE is the
# state — which is why it is overlay rather than durable: a worker
# killed mid-pull leaves nothing to clear, and the row falls back to
# remote ready to retry. A durable marker would strand it forever.
concept!: &space/replicating
  this: tonk:space/replicating
  description: A replication in flight on this device, keyed on the replica.
  with:
    subject:
      description: >
        The space being pulled. Carried so a rule can join this marker
        to the directory row: during the pull that CREATES the replica
        there is no replica record to join through yet.
      the: xyz.tonk.replica/subject
      cardinality: one
      as: entity
    replicating:
      description: Always true while a pull runs; retracted when it settles.
      the: xyz.tonk.space/replicating
      cardinality: one
      as: boolean

# A space with a providing account: `provider` is optional on `space`, so
# a rule binds it through this required field.
concept!: &space/provided
  this: tonk:space/provided
  description: A space an account provides through the access service.
  with:
    provider:
      description: The providing account's DID.
      the: xyz.tonk.space/provider
      cardinality: one
      as: entity

# A space the account on this branch provides. Removing such a space
# releases its hosted copy, where removing an invited one only leaves it,
# so the Hub row has to know which it is looking at — and reads it off
# the facts rather than asking the worker who is signed in.
concept!: &space/owned
  this: tonk:space/owned
  description: A space the account registered on this branch provides.
  with:
    owner:
      description: The providing account, registered on this branch.
      the: xyz.tonk.space/owner
      cardinality: one
      as: entity

rule!:
  description: A space provided by the account registered on this branch is owned
  assert: space/owned
  when:
    - assert: space/provided
      where:
        this: ?this
        provider: ?owner
    - assert: account/registered
      where:
        this: ?owner

concept!: &space/presence
  this: tonk:space/presence
  description: Where a space stands on this device.
  with:
    presence:
      description: '`case:remote`, `case:replicating`, `case:seeding`, or `case:replicated`.'
      the: xyz.tonk.space/presence
      cardinality: one
      as: entity

rule!:
  description: A space this device holds no replica of and is not pulling is remote
  assert: space/presence
  when:
    - assert: space
      where:
        this: ?this
        subject: ?subject
    - assert: db/session
      where:
        profile: ?profile
    - assert: ==
      where:
        this: ?presence
        is: case:remote
  unless:
    - assert: space/replica
      where:
        subject: ?subject
        profile: ?profile
    - assert: space/replicating
      where:
        subject: ?subject

# A pull in flight, whether an explicit `space/replicate` asked for it or
# the lazy first-use path tripped it. Distinct from `case:seeding`: that
# is the CREATING device writing its own first content, this is pulling
# content someone else authored. They fail differently and mean different
# things to the person watching the row.
rule!:
  description: A space being pulled onto this device is replicating
  assert: space/presence
  when:
    - assert: space
      where:
        this: ?this
        subject: ?subject
    - assert: db/session
      where:
        profile: ?profile
    - assert: space/replicating
      where:
        subject: ?subject
    - assert: ==
      where:
        this: ?presence
        is: case:replicating

rule!:
  description: A replica still seeding its content branch
  assert: space/presence
  when:
    - assert: space
      where:
        this: ?this
        subject: ?subject
    - assert: db/session
      where:
        profile: ?profile
    - assert: space/replica
      where:
        this: ?replica
        subject: ?subject
        profile: ?profile
    - assert: space/replica-status
      where:
        this: ?replica
        status: tonk:blank
    - assert: ==
      where:
        this: ?presence
        is: case:seeding

rule!:
  description: A replica that is no longer seeding is replicated
  assert: space/presence
  when:
    - assert: space
      where:
        this: ?this
        subject: ?subject
    - assert: db/session
      where:
        profile: ?profile
    - assert: space/replica
      where:
        this: ?replica
        subject: ?subject
        profile: ?profile
    - assert: ==
      where:
        this: ?presence
        is: case:replicated
  unless:
    - assert: space/replica-status
      where:
        this: ?replica
        status: tonk:blank

rule!:
  description: A live onboarding account is interim
  assert: account/status
  when:
    - assert: account/onboarding
      where: { this: ?this }
    - assert: ==
      where:
        this: ?status
        is: case:onboarding
  unless:
    - assert: account/registered
      where: { this: ?this }
    - assert: account/onboarding
      where: { this: ?this, retired-at: _ }

# Registered is the fallback: enrolled, and neither later fact has
# arrived. Both are excluded, not just activation — a suspended account
# still carries its registration, so testing activation alone would derive
# two cases at once.
rule!:
  description: An account that is neither active nor suspended is registered
  assert: account/status
  when:
    - assert: account/registered
      where:
        this: ?this
    - assert: ==
      where:
        this: ?status
        is: case:registered
  unless:
    - assert: account/active
      where: { this: ?this }
    - assert: account/suspended
      where: { this: ?this }

# Activated and not withdrawn.
rule!:
  description: An activated account that is not suspended is active
  assert: account/status
  when:
    - assert: account/active
      where: { this: ?this }
    - assert: ==
      where:
        this: ?status
        is: case:active
  unless:
    - assert: account/suspended
      where: { this: ?this }

# Suspension wins outright.
rule!:
  description: A suspended account is suspended
  assert: account/status
  when:
    - assert: account/suspended
      where: { this: ?this }
    - assert: ==
      where:
        this: ?status
        is: case:suspended

# Where anything sealed for this account is addressed.
#
# A device that holds a space seed seals it to this address and publishes
# the result as a `secret:message`, which a `secret:principal` names as
# its seed; only a live passkey ceremony derives the private half and can
# open one. So every device can deposit
# and none can read, which is what lets a seed reach a new device without
# any device holding the account's secret.
#
# An address, not a store: nothing is kept here. The X25519 `did:key` is
# what `conceal` is aimed at, and the sealed bytes land in their own rows.
#
# Written by the ceremony that creates the account secret, and again at
# rotation.
concept!: &account/sealed-inbox
  this: tonk:account/sealed-inbox
  description: The address anything sealed for this account is sent to.
  # ENTITY: the account's own DID.
  with:
    address:
      description: >
        The X25519 `did:key:z6LS…` as an entity — the public half of the
        account secret, derived from it, so rotation publishes a new one.
        Cardinality-one: sealed rows name their own recipient, so no
        history is needed here.
      the: xyz.tonk.account/sealed-inbox
      cardinality: one
      as: entity

# A passkey that can recover this account.
#
# ENTITY: the custody DID — the principal the passkey's PRF output
# derives. The same entity that is the `to` of the `secret:message`
# holding that passkey's sealed envelope, so the two join on `this`.
#
# One row per passkey, which is the point. This used to hang off the
# ACCOUNT, so an account with three passkeys had one creation record and
# dialog's per-attribute merge could pair one device's timestamp with
# another's label.
#
# No `account` field: the envelope already says which account this
# recovers. Its `secret:message` names this custody DID as `to` and the
# account as `sender`, so the link is a join, not a second copy.
#
# Enumerating an account's passkeys therefore means querying
# `secret:message` by `sender` and reading the `to`s — the custody DID is
# PRF-derived, so nothing can compute it without a live assertion.
concept!: &recovery/passkey
  this: recovery:passkey
  description: A passkey that can recover this account.
  with:
    credential-id:
      description: >
        The credential id the authenticator returns, at creation and on
        every assertion. What an assertion names to select this
        credential.
      the: xyz.tonk.recovery/credential-id
      cardinality: one
      as: text
    created-at:
      description: Unix seconds at credential creation.
      the: xyz.tonk.recovery/created-at
      cardinality: one
      as: unsigned-integer
    created-on:
      description: Browser and operating-system label, e.g. "Chrome on macOS".
      the: xyz.tonk.recovery/created-on
      cardinality: one
      as: text
  maybe:
    name:
      description: >
        The WebAuthn `user.name` this credential was created with — the
        address, where one was given. What a passkey manager lists the
        entry under, so it is what a person recognises their own passkey
        by. Absent for a credential created without one, which the
        ceremony names with an opaque random string instead.
      the: xyz.tonk.recovery/name
      cardinality: one
      as: text
    display-name:
      description: >
        The WebAuthn `user.displayName`. Usually the same address as
        `name`; kept separately because WebAuthn keeps them separately
        and an authenticator may show either.
      the: xyz.tonk.recovery/display-name
      cardinality: one
      as: text

# ── Device links ────────────────────────────────────────────────────

# A device link: the authorization one device holds to act for this
# account, and what the linked-device list renders.
#
# Named for what it actually is rather than for the general case. Every
# authorization minted today is a device link, so a general
# `account/authorization` would be a shape with one instance. A broader
# concept can be added when a second purpose exists, with a rule
# projecting this into it — that is cheaper than a general name whose
# rows are all one kind.
#
# `this` IS THE DELEGATION — its blob hash, as dialog keyed it when the
# chain was retained. Not a device DID, not an id of ours. That is the
# whole design: the delegation is the authorization, it is signed, and it
# confers the authority, so a record keyed by anything else would be a
# second source of truth that could disagree with the proof.
#
# Dialog decomposes the proof onto that same entity — `dialog.ucan/issuer`,
# `/audience`, `/subject`, `/command`, `/expiration` — so the row and the
# proof share one subject. Joining them is `this`; there is deliberately no
# `proof:` field, because a copy of the chain beside it is exactly the
# second source this shape avoids. `xyz.tonk.device/*` below are only the
# fields dialog does not carry.
#
# Revoking the delegation takes this row with it: an authorization cannot
# linger in a list after the authority it describes is gone.
#
# The attributes stay in the `xyz.tonk.device` namespace rather than
# `xyz.tonk.authorization`, which already means an invite's access proof —
# one namespace holding both would make "authorization" ambiguous between
# a device link and a share link.
concept!: &account/device-link
  this: tonk:account/device-link
  description: One device's authorization to act for this account.
  # ENTITY: THE DELEGATION — its blob hash, as dialog keyed it when
  # the chain was retained. Not a device DID and not an id of ours.
  with:
    created-at:
      description: >
        When the authorization was minted, unix seconds. Distinct from
        the delegation's `notBefore`, which bounds validity: this records
        the act, so a re-issued grant with the same window still gets a
        new time.
      the: xyz.tonk.device/created-at
      cardinality: one
      as: unsigned-integer
    title:
      description: >
        Human label, e.g. "Chrome on macOS". Kept here so a list renders
        offline rather than requiring a round trip.
      the: xyz.tonk.device/title
      cardinality: one
      as: text
    reason:
      description: >
        Why the delegation exists — `case:device-link` for a device. An
        entity label rather than text, so a typo cannot silently read as
        a different reason.

        Duplicated from the delegation's signed `meta` because `meta` is
        NOT decomposed into facts: it rides inside the envelope and
        cannot be queried. The signed copy stays authoritative; this one
        lets a list filter without opening envelopes.
      the: xyz.tonk.device/reason
      cardinality: one
      as: entity

# ── Sealed messages ─────────────────────────────────────────────────

# A sealed message: ciphertext only its recipient can open.
#
# ENTITY: derived from the MESSAGE itself, not from the parties. Sealing
# is randomized (fresh ephemeral key and nonce per call), so sealing the
# same plaintext twice yields different bytes and therefore a different
# entity. That is deliberate: the row identifies THIS envelope, so a
# re-seal adds a row rather than silently replacing what it supersedes,
# and rotation retracts the old one explicitly.
#
# Deliberately general — nothing here is about accounts or seeds. What a
# particular envelope CONTAINS is said by whatever points at it: a
# `secret:principal` names its seed this way, and the account's own
# secret sealed under a passkey is the same shape with `to` set to the
# custody DID that passkey derives.
concept!: &secret/message
  this: secret:message
  description: Ciphertext only its recipient can open.
  with:
    to:
      description: >
        Who can open it — the recipient the bytes were sealed to. For a
        passkey envelope, the custody DID that passkey derives: only a
        fresh assertion of that passkey opens it.
      the: xyz.tonk.secret/to
      cardinality: one
      as: entity
    message:
      description: The sealed bytes.
      the: xyz.tonk.secret/message
      cardinality: one
      as: bytes
  maybe:
    from:
      description: >
        Who sealed it, when that is known and worth recording. Optional
        because most sealing has no meaningful sender: a seed sealed to a
        recipient is just custody, and naming a sender would invent an
        author the seal does not bind. Set it only where provenance is
        real — the seal itself binds recipient and subject as associated
        data, so this is description, never authority.
      the: xyz.tonk.secret/sender
      cardinality: one
      as: entity

# A principal whose ed25519 seed is held sealed, so it can be re-derived.
#
# ENTITY: the principal's own DID. One row per principal, which is the
# thing being described — `seed` points at the envelope carrying it, and
# that envelope already names its recipient. Sealing the same seed to a
# second recipient (an admin as recovery custodian) adds a second
# `secret:message` and a second `seed` relation here, rather than needing
# the entity to carry a recipient of its own.
concept!: &secret/principal
  this: secret:principal
  description: A principal whose ed25519 seed is held sealed.
  with:
    kind:
      description: >
        What this principal is: `tonk:space` for a space's signing key,
        `tonk:invite` for an invite principal's.
      the: xyz.tonk.secret/kind
      cardinality: one
      as: entity
    seed:
      description: >
        The `secret:message` whose plaintext is this principal's ed25519
        seed. Recovery reads it, opens it with the recipient's key, and
        re-derives the principal this entity names.
      the: xyz.tonk.secret/seed
      cardinality: one
      as: entity

# ── Delegations ─────────────────────────────────────────────────────

# A delegation this branch retained: the proof itself, as dialog stores it.
#
# ENTITY: the delegation's blob hash — the same entity `tonk:account/
# device-link` and `secret:principal` hang their own fields on, so those
# concepts join to this one on `this`.
#
# NOT a tonk concept in the usual sense: every field here is dialog's own
# decomposition, written when the chain was retained (`dialog.ucan/*`).
# Declared so an inspector can see them at all — without a concept the
# facts exist and nothing can name them, which is why "who can act on
# what" was queryable only by hand-rolling attribute selectors.
#
# `expiration` and `not-before` are optional because dialog omits them
# entirely for a delegation that never expires or has no lower bound; a
# required field would hide exactly the powerlines that matter most.
concept!: &ucan/delegation
  this: ucan:delegation
  description: A delegation retained on this branch.
  with:
    issuer:
      description: Who signed it.
      the: dialog.ucan/issuer
      cardinality: one
      as: text
    audience:
      description: Who receives the authority.
      the: dialog.ucan/audience
      cardinality: one
      as: text
    subject:
      description: >
        What the authority is over. A powerline — authority over anything —
        carries the any-subject DID rather than being absent, which keeps
        the lookup a plain equality.
      the: dialog.ucan/subject
      cardinality: one
      as: text
    command:
      description: The delegated command path, e.g. `/use/get`.
      the: dialog.ucan/command
      cardinality: one
      as: text
  maybe:
    expiration:
      description: Unix seconds, absent when the delegation never expires.
      the: dialog.ucan/expiration
      cardinality: one
      as: unsigned-integer
      # `dialog.ucan/notBefore` is deliberately not declared: the notation's
      # attribute parser rejects a camelCase last segment, and that is the
      # name dialog writes. A lower validity bound is therefore readable
      # only by attribute, not through this concept.

# ── Profiles this device knows ──────────────────────────────────────

# One profile this browser can open.
#
# ENTITY: the profile's own DID, like every other identity in this file.
# The storage name is not part of it and does not need to be: a profile
# is opened by name (`Profile::open(name)`), so the name determines the
# DID and the pair would carry no more information than the DID alone.
#
# DEVICE-LOCAL. Alone in this file, this never replicates — it is the
# list of profiles that exist on THIS browser, which is not a fact about
# any account.
#
# One field, because one is all that is original here. The handle to
# open exists nowhere else; everything a switcher row shows about a
# profile already exists on that profile's own account branch —
# `tonk:account/name` for the label, `tonk:account/registered` for the
# address — and is read from there rather than copied.
#
# Nothing here says whether the profile is SIGNED IN, and nothing
# should. Being signed in is a delegation that exists and verifies: the
# `account -> profile` device link, whose `dialog.ucan/audience` is this
# profile and whose `dialog.ucan/issuer` is an account that is itself
# active (`tonk:account/active`). Signing out REVOKES that delegation
# and retracts it, so the authority is gone rather than merely
# unrecorded — which is what makes the question answerable from the
# proof instead of from a stamp that can disagree with it.
concept!: &device/profile
  this: device:profile
  description: A profile this device can open.
  with:
    name:
      description: >
        The storage name the profile opens under — its activation
        handle. What the switcher passes to open this profile, and the
        only fact about a profile that lives here rather than on the
        profile's own account branch.
      the: xyz.tonk.roster/name
      cardinality: one
      as: text

# ── Elements ────────────────────────────────────────────────────────
#
# Custom elements carried as branch data. Each replaced a Rust element
# that only ever needed the DOM: a method is a JS function of `self`,
# `connected` and `disconnected` are its lifecycle, and a `getter` or
# `setter` is a property.

# A headless element that names the browser tab. It renders nothing:
# its only job is to push its `text` to the host page, which owns
# `document.title` — a sealed guest cannot set it. Nothing while
# `hidden`, so a title a view keeps for a state it is not showing does
# not win.
element!: &tab-title
  description: Names the browser tab from its `text` attribute, through the host page.
  method:
    push: |
      (self) => {
        if (self.hasAttribute('hidden')) return;
        const text = self.getAttribute('text');
        if (!text) return;
        window.tonk?.setTitle?.(text);
      }
    connected: |
      (self) => self.push()
    attribute-changed: |
      (self, name) => {
        if (name === 'text' || name === 'hidden') self.push();
      }

# Surfaces the current location as a bubbling `mount` CustomEvent whose
# `detail` is the parsed URL — `href`, `origin`, `pathname`, `search`,
# `hash`, and `searchParams` as a plain object — so a view binds a
# command to it (`on:join=tonk:join`) and the handler gets the URL as
# data rather than reaching for a global. Inside a sealed guest the
# location is the host's, relayed as `window.tonk.context`.
#
# It fires once the enclosing display is bound (`data-bound`), because
# the binding that listens is installed with it, and again on every
# `tonk:join-retry`.
element!: &page-mount
  description: Dispatches the parsed current location as a bubbling `mount` event.
  method:
    location: |
      (self) => {
        const context = window.tonk?.context;
        const href = context?.origin
          ? `${context.origin}${context.path ?? ''}${context.search ?? ''}${context.hash ?? ''}`
          : window.location.href;
        try {
          const url = new URL(href);
          return {
            href: url.href, origin: url.origin, pathname: url.pathname,
            search: url.search, hash: url.hash,
            searchParams: Object.fromEntries(url.searchParams),
          };
        } catch {
          return {};
        }
      }
    mount: |
      (self) => {
        self.dispatchEvent(new CustomEvent('mount', { bubbles: true, detail: self.location() }));
      }
    ready: |
      (self) => self.closest('tonk-display')?.hasAttribute('data-bound') === true
    connected: |
      (self) => {
        if (!self.__retry) {
          self.__retry = () => self.mount();
          self.addEventListener('tonk:join-retry', self.__retry);
        }
        let fired = false;
        const fire = () => {
          if (fired || !self.ready()) return;
          fired = true;
          self.mount();
        };
        fire();
        if (fired) return;
        const display = self.closest('tonk-display');
        if (!display) return;
        self.__bound?.disconnect();
        self.__bound = new MutationObserver(fire);
        self.__bound.observe(display, { attributes: true, attributeFilter: ['data-bound'] });
      }
    disconnected: |
      (self) => {
        self.__bound?.disconnect();
        self.__bound = null;
      }

# An inline-editable line of text, driven like a native input: its
# `value` property is its text, a double-click makes it editable, Enter
# commits — a blur, which fires `change` when the text changed — and
# Escape restores the text the edit began with, so no `change` with a
# new value is emitted. It holds no policy: the commit rides on the
# consuming view's `onchange` binding.
element!: &inline-editable
  description: A contenteditable line of text with input-like `value` and `change`.
  getter:
    value: |
      (self) => self.textContent ?? ''
  setter:
    value: |
      (self, value) => {
        if (self !== self.ownerDocument?.activeElement) self.textContent = value ?? '';
      }
  method:
    connected: |
      (self) => {
        self.setAttribute('contenteditable', 'false');
        self.setAttribute('role', 'textbox');
        if (self.__wired) return;
        self.__wired = true;
        let before = '';
        self.addEventListener('dblclick', () => {
          self.setAttribute('contenteditable', 'plaintext-only');
          self.focus();
        });
        self.addEventListener('focus', () => {
          before = self.textContent ?? '';
        });
        self.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            self.blur();
          } else if (event.key === 'Escape') {
            event.preventDefault();
            self.textContent = before;
            self.blur();
          }
        });
        self.addEventListener('blur', () => {
          const current = self.textContent ?? '';
          self.setAttribute('contenteditable', 'false');
          if (current === before) return;
          self.dispatchEvent(new Event('change', { bubbles: true }));
        });
      }

# Opens account recovery over the missing-space screen: a click asks the
# top page to raise the passkey ceremony, which needs a `window` and a
# user gesture this opaque realm has neither of.
element!: &space-login
  description: A click asks the top page to open account recovery.
  method:
    connected: |
      (self) => {
        if (self.__wired) return;
        self.__wired = true;
        self.addEventListener('click', () => {
          window.tonk?.register?.('{"reason":"space-login"}');
        });
      }

# Creation outlives the accepted transact request. Follow the command's own
# result so feedback remains visible through seeding and failures allow retry.
element!: &space-create
  description: Creates a space with immediate feedback and a per-request result.
  method:
    status: |
      (self, text, announceOnly = false) => {
        const status = self.querySelector('[data-create-status]');
        if (status) {
          status.toggleAttribute('data-announce-only', announceOnly);
          status.textContent = text;
          status.hidden = !text;
        }
      }
    busy: |
      (self, busy) => {
        self.__busy = busy;
        self.querySelector('form')?.setAttribute('aria-busy', String(busy));
        const button = self.querySelector('button[type="submit"]');
        if (button) button.disabled = busy;
        const label = self.querySelector('[data-create-label]');
        if (label) label.textContent = busy ? 'creating space…' : 'create new space';
      }
    create: |
      async (self) => {
        if (self.__busy) return;
        self.busy(true);
        self.status('Creating your space…', true);
        let reader;
        try {
          await window.tonk.ready;
          const id = 'urn:uuid:' + Array.from(crypto.getRandomValues(new Uint32Array(4)), n => n.toString(16).padStart(8, '0')).join('');
          reader = window.tonk.subscribe({
            predicate: { with: {
              status: { the: 'xyz.tonk.space-creation/status', as: 'Text', cardinality: 'one' },
              detail: { the: 'xyz.tonk.space-creation/detail', as: 'Text', cardinality: 'one' },
            } },
            terms: { this: id, status: { '?': { name: 'status' } }, detail: { '?': { name: 'detail' } } },
          }).getReader();
          self.__reader = reader;
          await window.tonk.transact({ claims: [{ op: 'assert', application: {
            predicate: { kind: 'transient', concept: { with: {
              name: { the: 'xyz.tonk.command.create-space/name', as: 'Text' },
              open: { the: 'xyz.tonk.command.create-space/open', as: 'Text' },
            } } },
            parameters: { this: id, name: 'Untitled', open: 'true' },
          } }] });
          while (self.isConnected) {
            const { value, done } = await reader.read();
            if (done) throw new Error('Creation status stream ended');
            const result = value.find(row => row.this === id)?.fields;
            if (result?.status === 'failed') {
              self.status(result.detail);
              self.busy(false);
              return;
            }
            if (result?.status === 'created') {
              self.status('Opening your space…', true);
              window.tonk.navigate(result.detail);
              return;
            }
          }
        } catch (error) {
          if (self.isConnected) {
            console.warn('Space creation:', error);
            self.status("Couldn't confirm creation. Check your spaces before trying again.");
            self.busy(false);
          }
        } finally {
          if (reader) await reader.cancel().catch(() => {});
          if (self.__reader === reader) self.__reader = null;
        }
      }
    connected: |
      (self) => {
        if (self.__wired) return;
        self.__wired = true;
        self.busy(false);
        self.addEventListener('submit', event => {
          event.preventDefault();
          event.stopPropagation();
          self.create();
        });
      }
    disconnected: |
      (self) => {
        self.__reader?.cancel().catch(() => {});
        self.__reader = null;
      }

# Names and routes delete or leave for one Hub row. Which verb it is
# comes off the row's own attributes: no provider means the space is
# local (delete, or leave when it was joined rather than founded); a
# provider this account registered as means the hosted copy goes too.
# The click prepares the row's dialog for that verb and opens it; the
# dialog's form submits the `space/remove` command the view bound.
element!: &space-remove
  description: Names delete or leave for a Hub row and opens its confirmation.
  method:
    action: |
      (self) => {
        const provider = (self.dataset.spaceProvider ?? '').trim();
        if (!provider) return (self.dataset.spaceFounded ?? '').trim() ? 'delete-local' : 'leave';
        return self.hasAttribute('data-space-owner') ? 'delete-hosted' : 'leave';
      }
    classify: |
      (self) => {
        const action = self.action();
        if (self.getAttribute('data-space-action') !== action) {
          self.setAttribute('data-space-action', action);
        }
        const opener = self.querySelector('[data-space-remove-open]');
        if (!opener) return;
        opener.textContent = action === 'leave' ? 'leave' : 'delete';
        opener.removeAttribute('disabled');
      }
    prepare: |
      (self, action) => {
        const name = (self.dataset.spaceName ?? '').trim() || 'this space';
        const texts = {
          'delete-hosted': [
            'confirm space deletion',
            `Permanently delete ${name}? This account hosts it, so its copy on Tonk services is released along with the local data. Other members lose access. Your account and other spaces are untouched.`,
            'delete space',
          ],
          'delete-local': [
            'confirm space deletion',
            `Permanently delete ${name} from this device? This space has no Tonk-hosted copy, so its local data will be gone for good.`,
            'delete space',
          ],
          'leave': [
            'confirm leaving space',
            `Leave ${name}? This removes the space and its local data from this device. You'll need another invite link to join again. Other members keep access.`,
            'leave space',
          ],
        };
        const [heading, copy, submit] = texts[action] ?? texts.leave;
        self.querySelector('[data-space-remove-dialog]')?.setAttribute('heading', heading);
        const form = self.querySelector('form[data-remove]');
        if (form) form.textContent = copy;
        const button = self.querySelector('[data-space-remove-submit]');
        if (button) button.textContent = submit;
      }
    connected: |
      (self) => {
        self.classify();
        if (self.__wired) return;
        self.__wired = true;
        self.addEventListener('click', (event) => {
          if (!event.target?.closest?.('[data-space-remove-open]')) return;
          self.prepare(self.action());
          self.querySelector('[data-space-remove-dialog]')?.show?.();
        });
      }
    attribute-changed: |
      (self, name) => {
        if (name.startsWith('data-space-') && name !== 'data-space-action') self.classify();
      }

# A frame that can be dragged around the viewport. It does not care what
# it holds: the content is whatever the view puts inside, and the frame
# only moves it. A press on the handle (the frame itself unless `handle`
# names a part) that travels past the dead zone becomes a drag; the frame
# tracks the pointer 1:1, stays inside the viewport, and on release docks
# to the nearest edge at `inset` pixels, keeping its coordinate along
# that edge, or merely clamps when `dock="none"`. A tap is left alone,
# so whatever the content does on click still happens; the click that
# ends a drag is swallowed, since it was not a click. A resize keeps a
# docked frame on its edge and any frame inside the viewport.
#
# It reflects what it knows as attributes — `dragging` while a drag is
# on, `docked` with the edge it rests on, `left`/`top` in pixels once
# placed — and announces `drag-start` and `drag-end` (detail: `left`,
# `top`, `edge`) so a view can persist or react.
element!: &drag-frame
  description: Drags its contents around the viewport and docks them to an edge.
  attribute:
    inset: "16"
    dead-zone: "4"
    dock: "edges"
    handle: ""
  method:
    options: |
      (self) => {
        const number = (name, fallback) => {
          const value = parseFloat(self.getAttribute(name));
          return Number.isFinite(value) ? value : fallback;
        };
        return {
          inset: number('inset', 16),
          deadZone: number('dead-zone', 4),
          dock: (self.getAttribute('dock') || 'edges') !== 'none',
          handle: self.getAttribute('handle') || '',
        };
      }
    handle-of: |
      (self, target) => {
        const selector = self.options().handle;
        if (!selector) return self;
        const part = target?.closest?.(selector);
        return part && self.contains(part) ? part : null;
      }
    place: |
      (self, left, top) => {
        self.style.left = `${left}px`;
        self.style.top = `${top}px`;
      }
    snap: |
      (self, left, top, edge) => {
        const { inset, dock } = self.options();
        const rect = self.getBoundingClientRect();
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        let x = Math.max(inset, Math.min(left, vw - rect.width - inset));
        let y = Math.max(inset, Math.min(top, vh - rect.height - inset));
        if (!dock) return { left: x, top: y, edge: null };
        if (!edge) {
          const distances = [
            ['left', x], ['right', vw - (x + rect.width)],
            ['top', y], ['bottom', vh - (y + rect.height)],
          ];
          let nearest = distances[0];
          for (const candidate of distances) if (candidate[1] < nearest[1]) nearest = candidate;
          edge = nearest[0];
        }
        if (edge === 'left') x = inset;
        else if (edge === 'right') x = vw - rect.width - inset;
        else if (edge === 'top') y = inset;
        else if (edge === 'bottom') y = vh - rect.height - inset;
        return { left: Math.max(inset, x), top: Math.max(inset, y), edge };
      }
    settle: |
      (self, left, top, edge) => {
        const at = self.snap(left, top, edge);
        self.place(at.left, at.top);
        if (at.edge) self.setAttribute('docked', at.edge);
        else self.removeAttribute('docked');
        self.setAttribute('left', String(Math.round(at.left)));
        self.setAttribute('top', String(Math.round(at.top)));
        return at;
      }
    connected: |
      (self) => {
        if (getComputedStyle(self).position === 'static') self.style.position = 'fixed';
        if (!self.style.touchAction) self.style.touchAction = 'none';
        if (self.__wired) return;
        self.__wired = true;
        let press = null;
        const finish = () => {
          if (!press) return;
          const { moved, touch, pointerId, handle } = press;
          press = null;
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', finish);
          window.removeEventListener('pointercancel', finish);
          try { (touch ? handle : self).releasePointerCapture(pointerId); } catch {}
          if (!moved) return;
          self.removeAttribute('dragging');
          self.__justDragged = true;
          setTimeout(() => { self.__justDragged = false; }, 0);
          const rect = self.getBoundingClientRect();
          const at = self.settle(rect.left, rect.top);
          self.dispatchEvent(new CustomEvent('drag-end', { bubbles: true, detail: at }));
        };
        const move = (event) => {
          if (!press) return;
          if (event.buttons === 0) { finish(); return; }
          const dx = event.clientX - press.x;
          const dy = event.clientY - press.y;
          if (!press.moved) {
            const { deadZone } = self.options();
            const zone = press.touch ? Math.max(deadZone, 9) : deadZone;
            if (Math.hypot(dx, dy) < zone) return;
            press.moved = true;
            if (!press.touch) { try { self.setPointerCapture(press.pointerId); } catch {} }
            self.removeAttribute('docked');
            self.setAttribute('dragging', '');
            self.dispatchEvent(new CustomEvent('drag-start', {
              bubbles: true, detail: { left: press.left, top: press.top, edge: null },
            }));
          }
          const rect = self.getBoundingClientRect();
          const left = Math.max(0, Math.min(press.left + dx, window.innerWidth - rect.width));
          const top = Math.max(0, Math.min(press.top + dy, window.innerHeight - rect.height));
          self.place(left, top);
        };
        self.addEventListener('pointerdown', (event) => {
          if (event.button !== 0 || press) return;
          const handle = self.handleOf(event.target);
          if (!handle) return;
          const rect = self.getBoundingClientRect();
          press = {
            x: event.clientX, y: event.clientY, left: rect.left, top: rect.top,
            pointerId: event.pointerId, touch: event.pointerType === 'touch',
            moved: false, handle,
          };
          if (press.touch) { try { handle.setPointerCapture(event.pointerId); } catch {} }
          window.addEventListener('pointermove', move);
          window.addEventListener('pointerup', finish);
          window.addEventListener('pointercancel', finish);
        });
        self.addEventListener('click', (event) => {
          if (!self.__justDragged) return;
          self.__justDragged = false;
          event.stopPropagation();
          event.preventDefault();
        }, true);
        self.__resize = () => {
          if (press) return;
          const rect = self.getBoundingClientRect();
          self.settle(rect.left, rect.top, self.getAttribute('docked') || undefined);
        };
        window.addEventListener('resize', self.__resize);
      }
    disconnected: |
      (self) => {
        window.removeEventListener('resize', self.__resize);
      }

# The ceremony row as the settings page reads it: a marker carrying the
# fields, which the element words. Pinned to `this` so a directory with
# no row renders nothing (see the linked marker above).
view!:
  this: state:ceremony
  show:
    settings: |
      <span data-ceremony-row data-of={this} data-ceremony={ceremony}
        data-ceremony-state={state} data-ceremony-detail={detail} hidden></span>

# What deleting the account deletes: every space this account provides,
# named through the space's own row.
view!:
  this: space/owned
  show:
    deletion: |
      <span data-owned-space data-of={this}><tonk-display model="tonk:space" entity={this} view="name"></tonk-display></span>

# Named by its alias, as the hub's own views of it are: a view naming
# the URI is checked against the concept stored on the branch, which on
# a profile still carrying an older library has no `name` yet.
view!:
  this: space
  show:
    name: |
      <span data-space-name>{name}</span>

# The settings panel's element: what a view cannot do. The terminal's
# request is read off the location and copied onto the approve control
# so the click can assert it; the deletion phrase arms the submit; the
# ceremony row is worded; and the seat the top page's passkey cluster
# anchors to is measured, which only this realm can do.
element!: &account-settings
  description: The settings panel's location-bound acts, deletion arming, ceremony wording and custody seat.
  method:
    # Where this page is, as the host injects it: the guest's own
    # location is about:srcdoc.
    context: |
      (self) => {
        const context = window.tonk?.context ?? {};
        if (context.origin) {
          return { origin: context.origin, path: context.path ?? '', search: context.search ?? '', hash: context.hash ?? '' };
        }
        const at = window.location;
        return { origin: at.origin, path: at.pathname, search: at.search, hash: at.hash };
      }
    # The worker's HTTP API, reached the way any guest reaches it: the
    # host relays a same-origin fetch. A refusal rejects with its status.
    api: |
      (self, path, body) => {
        const init = body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) };
        return window.fetch(`${self.context().origin}${path}`, init).then(async (response) => {
          const text = await response.text();
          if (!response.ok) { const error = new Error(text || String(response.status)); error.status = response.status; throw error; }
          return text ? JSON.parse(text) : null;
        });
      }
    # Agent access: the invites this account issued to terminals, each
    # granting one space, and the removal of that access. The records
    # come from the worker, which asks the service; a load that the
    # service answers 404 hides the section, since it has none to list.
    connections-status: |
      (self, text) => {
        const node = self.querySelector('[data-connections-status]');
        if (node && node.textContent !== text) node.textContent = text;
      }
    connections-refresh: |
      (self) => {
        const generation = String((Number(self.getAttribute('data-connections-generation')) || 0) + 1);
        self.setAttribute('data-connections-generation', generation);
        const current = () => self.isConnected && self.getAttribute('data-connections-generation') === generation;
        const list = self.querySelector('[data-connections-list]');
        if (list) list.textContent = '';
        self.connectionsStatus('loading access records…');
        self.api('/api/account/connections').then((groups) => {
          if (!current()) return;
          self.querySelector('[data-agent-connections]')?.removeAttribute('hidden');
          groups = (groups ?? []).filter((group) => !group.requestId);
          self.connectionsStatus(groups.length
            ? 'saved access; permission to sync is checked when the terminal connects'
            : 'no agent invites issued from this account');
          for (const group of groups) list?.append(self.connectionRecord(group));
        }, (error) => {
          if (!current()) return;
          const section = self.querySelector('[data-agent-connections]');
          if (section) section.hidden = error.status === 404;
          self.connectionsStatus('access records could not be loaded. refresh to try again.');
        });
      }
    connection-record: |
      (self, group) => {
        const el = (tag, className, text, parent) => {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text) node.textContent = text;
          parent.append(node);
          return node;
        };
        const row = document.createElement('article');
        row.className = 'connection-record';
        row.dataset.connectionId = group.id;
        row.setAttribute('aria-label', group.label);
        const heading = el('div', 'srowd', '', row);
        el('b', 'lft', group.label, heading);
        const count = group.targets.filter((target) => target.acknowledged).length;
        const all = group.targets.length > 0 && count === group.targets.length;
        const retry = !all && (group.status === 'partial' || count > 0 || group.targets.some((target) => target.error));
        const button = el('button', 'cta', retry ? 'retry removing access' : (group.requestId ? 'remove space access' : 'remove invite access'), heading);
        button.type = 'button';
        button.dataset.connectionRevoke = group.id;
        button.setAttribute('aria-label', `${group.requestId ? 'remove space access for' : 'remove invite access'} ${group.label}`);
        if (all) button.disabled = true;
        const details = el('details', 'expl', '', row);
        el('summary', '', 'access details', details);
        el('p', 'expl', `space: ${group.subject}`, details);
        el('p', 'expl', `recipient: ${group.recipient}`, details);
        el('p', 'expl', 'can read and edit this space', row);
        const date = new Date(group.expiresAt * 1000);
        el('p', 'expl', `expires: ${Number.isFinite(date.getTime()) ? date.toISOString() : group.expiresAt}`, row);
        if (group.status === 'expired') el('p', 'expl', 'expired; send a new invitation to allow syncing again', row);
        el('p', 'expl', group.confirmed ? 'setup confirmation received' : 'no setup confirmation recorded', row);
        el('p', 'expl', count === 0 && group.status === 'partial' ? 'access removal requested; waiting for confirmation'
          : count === 0 ? 'access has not been removed'
          : `access removal confirmed for ${count} of ${group.targets.length} permissions`, row);
        if (group.targets.some((target) => target.error)) {
          el('p', 'expl', 'some access could not be removed. retry to remove the remaining permissions.', row);
        }
        return row;
      }
    connections-revoke: |
      (self, button) => {
        if (button.disabled) return;
        const id = button.dataset.connectionRevoke ?? '';
        if (!/^[0-9a-f]{64}$/.test(id)) return;
        button.disabled = true;
        self.connectionsStatus('removing access…');
        const generation = self.getAttribute('data-connections-generation');
        const current = () => self.isConnected && self.getAttribute('data-connections-generation') === generation;
        self.api(`/api/account/connections/${id}/revoke`, {}).then((group) => {
          if (!current()) return;
          if (!group || group.id !== id) { self.connectionsStatus('the access record changed. refresh before trying again.'); return; }
          button.closest('[data-connection-id]')?.replaceWith(self.connectionRecord(group));
          const count = group.targets.filter((target) => target.acknowledged).length;
          self.connectionsStatus(`access removal confirmed for ${count} of ${group.targets.length} permissions. downloaded data stays on devices that already have it.`);
          const status = self.querySelector('[data-connections-status]');
          if (status) { status.tabIndex = -1; status.focus(); }
        }, () => {
          if (!current()) return;
          button.disabled = false;
          self.connectionsStatus('access removal could not be confirmed. retry or refresh to check progress.');
        });
      }
    # A terminal asking to attach one local space to this account. The
    # request rides the URL as an encoded blob only the worker can read,
    # so the pane asks it what is being asked before showing anything.
    local-link-request: |
      (self) => {
        const at = self.context();
        if (at.path !== '/settings/link') return null;
        const params = new URLSearchParams(at.search);
        if (params.get('intent') !== 'local-space-link') return null;
        const request = params.get('request');
        if (!request) return null;
        return { request, approval: params.get('approval'), consent: params.get('consent'),
                 invite: params.get('invite'), provisioned: params.get('provisioned') };
      }
    # Answer on the terminal's own callback, fields in the fragment, the
    # same loopback check the worker makes.
    local-link-return: |
      (self, callback, fields) => {
        let target;
        try { target = new URL(callback); } catch { self.status('the callback address is invalid'); return; }
        const loopback = target.protocol === 'http:' && target.hostname === '127.0.0.1' && !!target.port
          && target.pathname === '/' && !target.search && !target.hash && !target.username && !target.password;
        if (!loopback) { self.status('the callback is not a Tonk loopback address'); return; }
        target.hash = new URLSearchParams(fields).toString();
        window.tonk?.navigate?.(target.toString());
      }
    local-link-show: |
      (self) => {
        const request = self.localLinkRequest();
        if (!request) return false;
        self.pane('local-link');
        if (self.getAttribute('data-local-link-shown') !== request.request) {
          self.setAttribute('data-local-link-shown', request.request);
          self.api('/api/local-space-link/describe', { request: request.request }).then((described) => {
            self.localLink = described;
            self.text('[data-local-link-name]', described.name);
            self.text('[data-local-link-did]', described.subject ?? 'unreadable request');
            self.localLinkContinue(request);
          }, () => { self.text('[data-local-link-did]', 'unreadable request'); });
        }
        return true;
      }
    # An approval and an invite came back on the URL: the terminal has
    # done its half, and the space is provisioned, then published.
    local-link-continue: |
      (self, request) => {
        if (!(request.approval && request.invite) || self.hasAttribute('data-local-link-finishing')) return;
        self.setAttribute('data-local-link-finishing', '');
        if (request.provisioned) self.localLinkFinish(request);
        else if (request.consent) self.localLinkProvision(request);
      }
    local-link-approve: |
      (self) => {
        const request = self.localLinkRequest();
        const described = self.localLink;
        if (!request || !described) return;
        self.status('Approving this local space…');
        self.api('/api/local-space-link/approve', { request: request.request }).then((response) => {
          const approval = response?.approval;
          if (!approval) { self.status('The approval response was not readable.'); return; }
          self.localLinkReturn(described.callback, [['approve', approval], ['correlation', described.correlation]]);
        }, (error) => self.status(`Could not approve this space: ${error.message}`));
      }
    local-link-decline: |
      (self) => {
        const described = self.localLink;
        if (!self.localLinkRequest() || !described) return;
        self.localLinkReturn(described.callback, [['deny', 'declined in the browser'], ['correlation', described.correlation]]);
      }
    local-link-provision: |
      (self, request) => {
        const described = self.localLink;
        if (!described) return;
        self.status('Preparing this space for publication…');
        self.api('/api/local-space-link/provision', { request: request.request, approval: request.approval, consent: request.consent }).then((response) => {
          const provisioned = response?.provisioned;
          if (!provisioned) { self.status('The provisioning receipt was not readable.'); return; }
          self.localLinkReturn(described.callback, [['provisioned', provisioned], ['correlation', described.correlation]]);
        }, (error) => {
          self.removeAttribute('data-local-link-finishing');
          self.status(`Publication stopped: ${error.message}. Reload to retry.`);
        });
      }
    local-link-finish: |
      (self, request) => {
        const described = self.localLink;
        if (!described) return;
        self.status('Publishing this space to your account…');
        self.api('/api/local-space-link/complete', { request: request.request, approval: request.approval, invite: request.invite, provisioned: request.provisioned }).then((response) => {
          const completion = response?.completion;
          if (!completion) { self.status('The publication receipt was not readable. Reload to retry.'); return; }
          self.localLinkReturn(described.callback, [['complete', completion], ['correlation', described.correlation]]);
        }, (error) => {
          self.removeAttribute('data-local-link-finishing');
          self.status(`Publication stopped: ${error.message}. Reload to retry.`);
        });
      }
    # Keys are hyphenated: the runtime camelCases them onto the
    # prototype, so `self.linkRequest()` is how a sibling calls this.
    link-request: |
      (self) => {
        const at = self.context();
        if (at.path !== '/settings/link') return null;
        const params = new URLSearchParams(at.search);
        const audience = params.get('audience');
        const callback = params.get('callback');
        if (!audience || !callback) return null;
        const name = (params.get('name') ?? '').trim() || 'terminal';
        return { audience, callback, name, expectedAccount: params.get('expectedAccount') };
      }
    # Base58 over the callback URL: a bare URL carries a `:` and would
    # decode as an entity on the worker's side.
    base58: |
      (self, text) => {
        const alphabet = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
        const bytes = new TextEncoder().encode(text);
        let zeros = 0;
        while (zeros < bytes.length && bytes[zeros] === 0) zeros += 1;
        let n = 0n;
        for (const byte of bytes) n = (n << 8n) | BigInt(byte);
        let out = '';
        while (n > 0n) { out = alphabet[Number(n % 58n)] + out; n /= 58n; }
        return '1'.repeat(zeros) + out;
      }
    text: |
      (self, selector, value) => {
        const target = self.querySelector(selector);
        if (target && target.textContent !== value) target.textContent = value;
      }
    pane: |
      (self, name) => {
        for (const pane of self.querySelectorAll('[data-pane]')) pane.hidden = pane.dataset.pane !== name;
        if (self.getAttribute('data-pane') !== name) self.setAttribute('data-pane', name);
      }
    refresh: |
      (self) => {
        if (self.localLinkShow()) return;
        const request = self.linkRequest();
        if (!request) {
          if (self.context().path === '/account') {
            self.pane('menu');
            return;
          }
          self.pane('account');
          if (self.context().hash === '#delete-account') self.openDelete();
          self.connectionsRefresh();
          return;
        }
        self.text('[data-link-name]', request.name);
        self.text('[data-link-did]', request.audience);
        self.text('[data-link-account]', request.expectedAccount ?? 'your signed-in account');
        const approve = self.querySelector('[data-link-approve]');
        if (approve) {
          approve.dataset.audience = request.audience;
          approve.dataset.callback = self.base58(request.callback);
          approve.dataset.name = request.name;
          approve.dataset.expectedAccount = request.expectedAccount ?? '';
        }
        self.pane('link');
      }
    status: |
      (self, text) => {
        const line = self.querySelector('[data-ceremony-status]');
        if (!line) return;
        if (line.textContent !== text) line.textContent = text;
        if (line.hidden !== !text) line.hidden = !text;
        self.seat();
      }
    # Where the top page's passkey cluster sits: just above the seat.
    seat: |
      (self) => {
        const seat = self.querySelector('[data-custody-seat]');
        if (!seat) return;
        const box = seat.getBoundingClientRect();
        if (!(box.width > 0 && box.height > 0)) return;
        window.tonk?.register?.(JSON.stringify({
          reason: 'custody-anchor',
          anchor: { left: box.left, bottom: box.top - 7, width: box.width },
        }));
      }
    open-delete: |
      (self) => {
        const dialog = self.querySelector('[data-delete-account-dialog]');
        if (!dialog) return;
        const field = self.querySelector('[data-delete-confirm]');
        if (field) field.value = '';
        self.scope();
        self.arm();
        dialog.show?.();
        field?.focus();
      }
    # The sentence the dialog opens on, counted off the owned-space rows
    # the view renders.
    scope: |
      (self) => {
        const owned = [...self.querySelectorAll('[data-owned-space]')];
        const names = owned.map((row) => (row.querySelector('[data-space-name]')?.textContent ?? '').trim() || 'unnamed space');
        const count = owned.length;
        const listed = names.length ? `: ${names.join(', ')}` : '';
        self.text('[data-delete-scope]',
          `${count} owned hosted space${count === 1 ? '' : 's'} will be deleted${listed}. Spaces you joined are left intact.`);
      }
    # The submit fires the command, so it stays disabled until the exact
    # phrase is typed and the address is on it.
    arm: |
      (self) => {
        const field = self.querySelector('[data-delete-confirm]');
        const submit = self.querySelector('[data-delete-account-submit]');
        if (!field || !submit) return;
        const expected = (self.querySelector('[data-delete-confirm-label]')?.textContent ?? '').trim();
        const armed = !!expected && field.value.trim() === expected && !!submit.dataset.email;
        if (armed === submit.hasAttribute('disabled')) {
          if (armed) submit.removeAttribute('disabled'); else submit.setAttribute('disabled', '');
        }
      }
    # Word the ceremony row. Every write is guarded, because this runs
    # from an observer over the same subtree it writes into.
    describe: |
      (self) => {
        const row = self.querySelector('[data-ceremony-row]');
        if (!row) return;
        const which = row.dataset.ceremony;
        const state = row.dataset.ceremonyState;
        const detail = row.dataset.ceremonyDetail ?? '';
        const subject = {
          'delete-account': 'Deleting the account',
          'authorize-device': 'Approving the terminal',
          'add-passkey': 'Adding the passkey',
        }[which];
        if (!subject) return;
        const done = {
          'delete-account': 'Account deleted.',
          'authorize-device': 'Approved. Handing the terminal its access…',
        }[which] ?? 'Done.';
        const text = {
          'pending-ceremony': `${subject}: waiting for your passkey…`,
          'working': `${subject}…`,
          'done': done,
          'refused': `${subject} did not finish: ${detail}`,
          'failed': `${subject} did not finish: ${detail}`,
        }[state];
        if (!text) return;
        if (self.getAttribute('data-ceremony') !== which) self.setAttribute('data-ceremony', which);
        if (self.getAttribute('data-ceremony-state') !== state) self.setAttribute('data-ceremony-state', state);
        if (which === 'authorize-device') {
          const asking = state === 'pending-ceremony' || state === 'working';
          if (asking !== self.hasAttribute('data-passkey-requested')) {
            if (asking) self.setAttribute('data-passkey-requested', ''); else self.removeAttribute('data-passkey-requested');
          }
