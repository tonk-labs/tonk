# tree-inspector: a branch's search tree, <tree-inspector>, as branch data.
#
# <tree-inspector> is defined below with `element!:`, so installing this
# component gives a space a view of the tree its facts are stored in with
# nothing from the host: no bundle, no host element, no stylesheet.
#
# It reads through dialog's own tree resolvers, asked one step at a time
# with a query whose predicate is the step's name:
#
#   tree/node   what a node is, and the format it was written under
#   tree/span   the spans of an index node, each naming a child node
#   tree/entry  the entries of a segment node
#   tree/value  a spilled value's bytes
#
# and decodes keys with dialog's formulas `dialog/key-part` and
# `dialog/separator-part`. A node is named by its `node:` entity, and the
# branch names its root by one (`dialog.branch/tree`), so the outline
# starts there and reads a node only when it is opened. A read fetches a
# node this replica does not hold yet.
#
# The outline follows the branch: a commit moves the root, the element
# reads it again, and whatever the commit left alone keeps its entity and
# stays open.

# The methods in `tree-inspector/` are its custom-element class.
#
# No attributes. It inspects the branch of the page it is on (its queries
# are routed by its place in the page, as any element's are).
element!: &tree-inspector
  description: An outline of the search tree a branch stores its facts in; a node is read when it is opened.
  method:
    connected: !include/text ./tree-inspector/connected.js
    disconnected: !include/text ./tree-inspector/disconnected.js
    schedule: !include/text ./tree-inspector/schedule.js
    query: !include/text ./tree-inspector/query.js
    step: !include/text ./tree-inspector/step.js
    bytes: !include/text ./tree-inspector/bytes.js
    roots: !include/text ./tree-inspector/roots.js
    watch: !include/text ./tree-inspector/watch.js
    open: !include/text ./tree-inspector/open.js
    label: !include/text ./tree-inspector/label.js
    value: !include/text ./tree-inspector/value.js
    render: !include/text ./tree-inspector/render.js
    detail: !include/text ./tree-inspector/detail.js
    act: !include/text ./tree-inspector/act.js
    keys: !include/text ./tree-inspector/keys.js
    style: !include/text ./tree-inspector/style.js

# The console page: `/console/tree`.
concept!: &tree-inspector/console
  this: tonk:tree-inspector/console
  description: The search-tree console (`/console/tree`).
  with:
    repo:
      description: The space repository, picked off the site entity.
      the: xyz.tonk.site/repo
      as: text
    branch:
      description: The space branch, picked off the site entity.
      the: xyz.tonk.site/branch
      as: text

view!:
  this: tonk:tree-inspector/console
  show:
    ui: |
      <main style="padding: 1.5rem; max-width: 80rem; margin: 0 auto;">
        <h1 style="margin: 0 0 1rem; font-size: 1.25rem;">Search tree</h1>
        <tree-inspector></tree-inspector>
      </main>

route!:
  this: tonk:tree-inspector/route
  path: "/console/tree"
  concept: tonk:tree-inspector/console
