[package]
name = "tonk-display"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "<tonk-display> custom element — renders a single entity using a view template stored on the branch."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
custom-elements = { workspace = true }
indexmap = { workspace = true }
ipld-core = { workspace = true }
js-sys = { workspace = true }
lsp-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = { workspace = true }
serde_json = { workspace = true }
serde_ipld_dagjson = { workspace = true }
tonk-host = { workspace = true }
tonk-notation = { workspace = true }
tonk-schema = { workspace = true }
tonk-template = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Attr",
    "Comment",
    "console",
    "CustomElementRegistry",
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "DocumentFragment",
    "Element",
    "Event",
    "EventInit",
    "EventTarget",
    "HtmlElement",
    "HtmlFormElement",
    "HtmlHeadElement",
    "HtmlTemplateElement",
    "MutationObserver",
    "MutationObserverInit",
    "NamedNodeMap",
    "Node",
    "NodeList",
    "Text",
    "Window",
] }

[dev-dependencies]
dialog-common = { workspace = true, features = ["helpers"] }
tokio = { workspace = true, features = ["macros", "rt"] }
wasm-bindgen-test = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(dialog_test_native_integration)',
    'cfg(dialog_test_wasm_integration)',
    'cfg(feature, values("web-integration-tests"))',
] }
