[package]
name = "tonk-concept"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "<tonk-concept> custom element — live-subscribes to a tonk-worker query and renders matches into an author-supplied HTML template."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = { workspace = true }
custom-elements = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = { workspace = true }
serde_json = { workspace = true }
tonk-schema = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-streams = { workspace = true }
web-sys = { workspace = true, features = [
    "AbortController",
    "AbortSignal",
    "Attr",
    "Comment",
    "CustomElementRegistry",
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "DocumentFragment",
    "Element",
    "Headers",
    "HtmlElement",
    "HtmlScriptElement",
    "HtmlTemplateElement",
    "NamedNodeMap",
    "Node",
    "NodeFilter",
    "NodeList",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestInit",
    "Response",
    "Text",
    "TreeWalker",
    "Window",
] }

[dev-dependencies]
dialog-common = { workspace = true, features = ["helpers"] }
tokio = { workspace = true, features = ["macros", "rt"] }
wasm-bindgen-test = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(dialog_test_native_integration)',
    'cfg(dialog_test_wasm_integration)',
    'cfg(feature, values("web-integration-tests"))',
] }
