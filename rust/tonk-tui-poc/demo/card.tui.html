<column width=fill height=fill pad-x=2 pad-y=1 spacing-y=1>
  <box width=fill pad-x=1>
    <column width=fill spacing-y=1>
      <row width=fill>
        <text weight=bold>{title}</text>
        <text align=right fg=accent reverse> {status} </text>
      </row>
      <paragraph width=fill fg=muted>{body}</paragraph>
    </column>
  </box>
  <row width=fill>
    <text fg=muted>left</text>
    <text align=center-x>centre</text>
    <text align=right fg=muted>right</text>
  </row>
</column>
