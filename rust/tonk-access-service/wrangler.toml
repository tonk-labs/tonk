name = "tonk-access-service"
main = "build/worker/shim.mjs"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "cargo install -q worker-build && worker-build --release"

# R2 bucket binding - for checking blob existence
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tonk-spaces"

# KV namespace for service identity
[[kv_namespaces]]
binding = "CONFIG"
id = "9f2cad6c152e4bd68207c4c26e86810c"

# Environment variables
[vars]
R2_ACCOUNT_ID = "5f20ca8a0de0a5ac52a14fa8bf9c90db"
R2_BUCKET_NAME = "tonk-spaces"

# Secrets are set via `wrangler secret put`
# R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY
