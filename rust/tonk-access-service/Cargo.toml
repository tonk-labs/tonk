[package]
name = "tonk-access-service"
description = "UCAN-authorized access to R2 storage"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable integration tests that require local servers
integration-tests = ["helpers"]
# Enable test helpers (local access service server)
helpers = [
    "dep:anyhow",
    "dep:bytes",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tokio",
    "dialog-remote-s3/helpers",
]

[dependencies]
# Cloudflare Workers
worker = { workspace = true }
worker-macros = { workspace = true }

# S3 + UCAN authorization
dialog-common = { workspace = true }
dialog-remote-s3 = { workspace = true }
dialog-remote-ucan-s3 = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_ipld_dagcbor = { workspace = true }

# Utilities
thiserror = { workspace = true }

# Test helpers (optional, for integration testing)
anyhow = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
dialog-capability = { workspace = true }
dialog-credentials = { workspace = true }
dialog-remote-s3 = { workspace = true }
dialog-remote-ucan-s3 = { workspace = true }
dialog-ucan-core = { workspace = true }
dialog-varsig = { workspace = true }
tokio = { workspace = true, features = ["full"] }
