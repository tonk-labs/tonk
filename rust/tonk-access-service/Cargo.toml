[package]
name = "tonk-access-service"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "UCAN-authorized access to R2 storage"
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tonk-access-local"
path = "src/bin/local.rs"
required-features = ["helpers"]

[dependencies]
# Cloudflare Workers
worker = { workspace = true, features = ["d1"] }
worker-macros = { workspace = true }

# S3 presigning with UCAN support
dialog-remote-s3 = { workspace = true }
dialog-remote-ucan-s3 = { workspace = true }

dialog-capability = { workspace = true }
dialog-credentials = { workspace = true }
dialog-effects = { workspace = true }
# UCAN / identity
dialog-ucan = { workspace = true }
dialog-ucan-core = { workspace = true }
dialog-varsig = { workspace = true }
tonk-account = { workspace = true }
tonk-email = { workspace = true }
tonk-identity = { workspace = true }
tonk-worker-api = { workspace = true }

# Cryptography
blake3 = { workspace = true }
bs58 = { workspace = true }
ed25519-dalek = { workspace = true }
hkdf = { workspace = true }
sha2_0_10 = { workspace = true }

# Serialization
base64 = { workspace = true }
hex = { workspace = true }
ipld-core = { workspace = true }
serde = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
serde_json = { workspace = true }

getrandom = { workspace = true }
urlencoding = { workspace = true }
getrandom_0_2 = { workspace = true }
# Utilities
thiserror = { workspace = true }
url = { workspace = true }

async-trait = { workspace = true }

# Test helpers (optional, for integration testing)
anyhow = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
dialog-common = { workspace = true }
dialog-storage = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
dialog-artifacts = { workspace = true }
dialog-capability = { workspace = true }
dialog-common = { workspace = true, features = ["helpers"] }
dialog-credentials = { workspace = true }
# Only to name `Operator`/`Profile` in the shared account-device fixture;
# already in the tree via dialog-repository.
dialog-operator = { workspace = true, features = ["helpers"] }
dialog-query = { workspace = true }
dialog-remote-s3 = { workspace = true, features = ["helpers"] }
dialog-remote-ucan-s3 = { workspace = true, features = ["helpers"] }
dialog-repository = { workspace = true }
dialog-storage = { workspace = true, features = ["helpers"] }
dialog-ucan-core = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
# The client-side glue the mint handler shortens with. Exercised against
# the real service so the two halves are tested against each other, not
# against a restatement of the wire format.
tonk-invite = { workspace = true }
tonk-account = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"], optional = true }

[features]
default = []
# Enable test helpers (local access service server)
helpers = [
  "dep:anyhow",
  "dep:bytes",
  "dep:http-body-util",
  "dep:hyper",
  "dep:hyper-util",
  "dep:reqwest",
  "dep:rusqlite",
  "dep:tokio",
  "dialog-common/helpers",
  "dialog-remote-s3/helpers",
  "dialog-remote-ucan-s3/helpers",
  "dialog-storage/helpers",
]
# Enable integration tests that require local servers
integration-tests = ["helpers"]

[lints.rust]
# The dialog_common::test macro uses cfg conditions that originate from the macro crate.
# We need to tell check-cfg to expect these values.
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(dialog_test_native_integration)",
  "cfg(dialog_test_wasm_integration)",
  'cfg(feature, values("web-integration-tests"))',
] }
