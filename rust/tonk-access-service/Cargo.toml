[package]
name = "tonk-access-service"
description = "UCAN-authorized access to R2 storage"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "test-client"
path = "src/bin/test_client.rs"
required-features = ["test-client"]

[features]
default = []
test-client = ["dep:reqwest", "dep:clap", "dep:tokio", "dep:anyhow", "dep:sha2"]

[dependencies]
# Cloudflare Workers
worker = "0.6"
worker-macros = "0.6"

# UCAN (your fork with invocation exports)
ucan = { git = "https://github.com/tonk-labs/rs-ucan.git", branch = "jackddouglas/feat/check" }
varsig = { git = "https://github.com/tonk-labs/rs-ucan.git", branch = "jackddouglas/feat/check" }

# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# S3 presigning
s3-presign = { workspace = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1"
serde_ipld_dagcbor = "0.6"
ipld-core = { version = "0.4", features = ["serde"] }

# Utilities
thiserror = "2.0"
base64 = "0.22"
hex = "0.4"
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom_0_3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
rand = "0.9"

# Async
futures = "0.3"

# Test client dependencies (optional)
reqwest = { version = "0.12", features = ["json"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"], optional = true }
anyhow = { version = "1", optional = true }
sha2 = { version = "0.11.0-rc.3", optional = true }
