[package]
name = "tonk-access-service"
description = "UCAN-authorized access to R2 storage"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable integration tests that require local servers
integration-tests = ["helpers"]
# Enable test helpers (local access service server)
helpers = [
    "dep:anyhow",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tokio",
    "dep:async-trait",
    "dep:bytes",
    "dep:http-body-util",
    "dialog-storage/helpers",
    "dialog-common/helpers",
]

[dependencies]
# Cloudflare Workers
worker = { workspace = true }
worker-macros = { workspace = true }

# S3 presigning with UCAN support
dialog-s3-credentials = { workspace = true, features = ["ucan"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_ipld_dagcbor = { workspace = true }

# Utilities
thiserror = { workspace = true }
getrandom_0_2 = { workspace = true }
getrandom = { workspace = true }

# Test helpers (optional, for integration testing)
anyhow = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
dialog-storage = { workspace = true, features = ["s3", "ucan"], optional = true }
dialog-common = { workspace = true, optional = true }

[dev-dependencies]
# Testing with dialog_common::test macro
dialog-common = { workspace = true, features = ["helpers"] }
dialog-storage = { workspace = true, features = ["s3", "ucan", "helpers"] }
dialog-s3-credentials = { workspace = true, features = ["ucan", "helpers"] }
ucan = { workspace = true }
anyhow = { workspace = true }

[lints.rust]
# The dialog_common::test macro uses cfg conditions that originate from the macro crate.
# We need to tell check-cfg to expect these values.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(dialog_test_native_integration)',
    'cfg(dialog_test_wasm_integration)',
    'cfg(feature, values("web-integration-tests"))',
] }
