[package]
name = "tonk-access-service"
description = "UCAN-authorized access to R2 storage"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "test-client"
path = "src/bin/test_client.rs"
required-features = ["test-client"]

[features]
default = []
test-client = [
    "dep:reqwest",
    "dep:clap",
    "dep:tokio",
    "dep:anyhow",
    "dep:sha2",
    "dep:blake3",
]

[dependencies]
# Cloudflare Workers
worker = { workspace = true }
worker-macros = { workspace = true }

# UCAN (your fork with invocation exports)
ucan = { git = "https://github.com/tonk-labs/rs-ucan.git", branch = "jackddouglas/feat/check" }
varsig = { git = "https://github.com/tonk-labs/rs-ucan.git", branch = "jackddouglas/feat/check" }

# Cryptography
ed25519-dalek = { workspace = true }

# S3 presigning
dialog-s3-credentials = { workspace = true }

# Serialization
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
ipld-core = { workspace = true }

# Utilities
thiserror = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
getrandom_0_2 = { workspace = true }
getrandom = { workspace = true }
# getrandom = { version = "0.2", features = ["js"] }
# getrandom_0_3 = { package = "getrandom", version = "0.3", features = [
#     "wasm_js",
# ] }
rand = { workspace = true }

# Async
futures = { workspace = true }

# Test client dependencies (optional)
reqwest = { workspace = true, features = ["json"], optional = true }
# reqwest = { version = "0.12", features = ["json"], optional = true }
clap = { workspace = true, optional = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "fs",
], optional = true }
anyhow = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
