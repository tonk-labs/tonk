[package]
name = "tonk-portal"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "<tonk-portal> custom element — imperative HTML rendered in an isolated iframe."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
custom-elements = { workspace = true }
tonk-core = { workspace = true }
tonk-macros = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "CssStyleDeclaration",
    "CustomElementRegistry",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlIFrameElement",
    "Node",
    "Window",
] }

[dev-dependencies]
dialog-common = { workspace = true, features = ["helpers"] }
ipld-core = { workspace = true }
js-sys = { workspace = true }
serde-wasm-bindgen = { workspace = true }
tonk-display = { workspace = true }
tonk-schema = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(dialog_test_native_integration)',
    'cfg(dialog_test_wasm_integration)',
    'cfg(feature, values("web-integration-tests"))',
] }
