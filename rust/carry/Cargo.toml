[package]
name = "carry"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Carry"
license.workspace = true

[[bin]]
name = "carry"
path = "src/bin/carry.rs"

[dependencies]
# only deps for platform-independent modules
anyhow = { workspace = true }
bs58 = { workspace = true }
dialog-credentials = { workspace = true }
dialog-ucan = { workspace = true }
dialog-varsig = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
carry-telemetry-service = { workspace = true, features = ["helpers"] }
dialog-remote-s3 = { workspace = true, features = ["helpers"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tonk-access-service = { workspace = true, features = ["helpers"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# CLI
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }

# Dialog DB
dialog-artifacts = { workspace = true }
dialog-capability = { workspace = true }
dialog-query = { workspace = true }
dialog-remote-s3 = { workspace = true }
dialog-remote-ucan-s3 = { workspace = true }
dialog-repository = { workspace = true, features = ["helpers"] }
dialog-storage = { workspace = true }

# Async
futures-util = { workspace = true }
tokio = { workspace = true, features = ["full"] }

base64 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
# Crypto
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }

http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
open = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# Serialization
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Utilities
dirs = { workspace = true }

[features]
default = []
