[package]
name = "tonk-space"
description = "Core space primitives for Tonk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Crypto
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand_0_8 = { workspace = true }

wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Crypto", "SubtleCrypto", "CryptoKey", "HkdfParams"] }
tonk-common = { workspace = true }

# Encoding
base64 = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Filesystem
dirs = { workspace = true }

# Async
futures-util = { workspace = true }
futures-core = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

# Dialog DB
dialog-storage = { workspace = true }
dialog-query = { workspace = true }
dialog-artifacts = { workspace = true, features = ["ucan"] }
dialog-common = { workspace = true }
dialog-s3-credentials = { workspace = true }
dialog-capability = { workspace = true }
dialog-credentials = { workspace = true }
dialog-ucan = { workspace = true }
dialog-varsig = { workspace = true }
ipld-core = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_ipld_dagcbor = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hkdf = { workspace = true }
sha2_0_10 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]

[dev-dependencies]
tempfile = { workspace = true } 

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
