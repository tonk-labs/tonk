[package]
name = "tonk-cli"
description = "Local-only CLI for reading and writing tonk facts via asserted-notation."
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
# Disable auto-discovery of tests so `tests/common.rs` (a shared
# fixtures module pulled into each integration test via
# `mod common;`) doesn't get compiled as its own empty binary.
autotests = false

[[bin]]
name = "tonk"
path = "src/bin/tonk.rs"

# `autotests = false` is set in [package] to keep
# `tests/common.rs` from being built as its own empty test
# binary; list the real test binaries here explicitly.
[[test]]
name = "live_migration"
path = "tests/live_migration.rs"

[[test]]
name = "site"
path = "tests/site.rs"

[[test]]
name = "join_profile"
path = "tests/join_profile.rs"

[[test]]
name = "invite_revocation"
path = "tests/invite_revocation.rs"

[[test]]
name = "revoked_device"
path = "tests/revoked_device.rs"
required-features = ["integration-tests"]

[[test]]
name = "notation"
path = "tests/notation.rs"

[[test]]
name = "sync"
path = "tests/sync.rs"

[[test]]
name = "transfer"
path = "tests/transfer.rs"

[[test]]
name = "render"
path = "tests/render.rs"

[[test]]
name = "schema_read"
path = "tests/schema_read.rs"

[[test]]
name = "telemetry"
path = "tests/telemetry.rs"

[[test]]
name = "update"
path = "tests/update.rs"

[[test]]
name = "blob"
path = "tests/blob.rs"

[[test]]
name = "data_verbs"
path = "tests/data_verbs.rs"

[[test]]
name = "authoring"
path = "tests/authoring.rs"

[[test]]
name = "space"
path = "tests/space.rs"

[[test]]
name = "cli_space"
path = "tests/cli_space.rs"

[[test]]
name = "context"
path = "tests/context.rs"

[[test]]
name = "agents"
path = "tests/agents.rs"

[[test]]
name = "account_spaces"
path = "tests/account_spaces.rs"
required-features = ["integration-tests"]

[[test]]
name = "account_interrupt"
path = "tests/account_interrupt.rs"
required-features = ["integration-tests"]

[[test]]
name = "account_authority"
path = "tests/account_authority.rs"
required-features = ["integration-tests"]

[[test]]
name = "space_access"
path = "tests/space_access.rs"

[[test]]
name = "space_inventory"
path = "tests/space_inventory.rs"

[[test]]
name = "space_link"
path = "tests/space_link.rs"
required-features = ["integration-tests"]

[features]
integration-tests = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(dialog_test_native_integration)',
    'cfg(dialog_test_wasm_integration)',
    'cfg(feature, values("web-integration-tests"))',
] }

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
semver = { workspace = true }
sha2_0_10 = { workspace = true }
tar = { workspace = true }
# `string` on top of the workspace default: the schema-aware data
# verbs (`add`/`set`) build a `clap::Command` at runtime from a
# concept's field names (owned `String`s from the branch, not
# `&'static str` literals), which needs `Arg`/`Command` builders
# that accept owned strings.
clap = { workspace = true, features = ["string"] }
dialog-artifacts = { workspace = true }
dialog-capability = { workspace = true }
dialog-common = { workspace = true }
dialog-credentials = { workspace = true }
dialog-csv = { workspace = true }
dialog-effects = { workspace = true }
dialog-operator = { workspace = true }
dialog-query = { workspace = true }
dialog-reactor = { workspace = true }
dialog-remote-s3 = { workspace = true }
dialog-remote-ucan-s3 = { workspace = true }
dialog-repository = { workspace = true }
dialog-storage = { workspace = true }
dialog-ucan = { workspace = true }
dialog-ucan-core = { workspace = true }
dialog-varsig = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
# `tonk update` calls reqwest directly to fetch release manifests and archives.
# The workspace enables `rustls-tls-native-roots` (see workspace Cargo.toml), so
# those downloads trust the OS CA store and work behind TLS-intercepting proxies.
reqwest = { workspace = true }
ipld-core = { workspace = true }
lsp-types = { workspace = true }
os_info = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true, features = ["form", "http1", "json", "query", "tokio"] }
base64 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "io-std", "io-util", "signal", "time"] }
tokio-util = { workspace = true }
tonk-account = { workspace = true }
tonk-analytics = { workspace = true }
tonk-evaluator = { workspace = true }
tonk-identity = { workspace = true }
zeroize = { workspace = true }
tonk-invite = { workspace = true }
tonk-notation = { workspace = true }
tonk-render = { workspace = true }
tonk-schema = { workspace = true }
tonk-worker-api = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
webbrowser = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
dialog-common = { workspace = true, features = ["helpers"] }
futures-util = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tonk-access-service = { workspace = true, features = ["helpers"] }
unicode-width = { workspace = true }
wasm-bindgen-test = { workspace = true }
