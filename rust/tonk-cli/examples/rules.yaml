user.rules:
  plan-event-meal:
    description: Suggest a meal for an event attendee using an available recipe
    deduce:
      diy.planner/Meal:
        attendee: ?person
        recipe: ?recipe
        occasion: ?event
    when:
      - diy.planner/Event:
          this: ?event
          title: ?title
      - diy.planner/Meal:
          this: ?existing
          attendee: ?person
      - diy.cook/Recipe:
          this: ?recipe
          title: ?recipe-name

  infer-safe-event-meal:
    description: A safe meal for an event — combines event context with dietary safety
    deduce:
      diy.planner/Meal:
        attendee: ?person
        recipe: ?recipe
        occasion: ?event
    when:
      - diy.planner/Event:
          this: ?event
          title: ?title
      - diy.planner/Meal:
          this: ?safe
          attendee: ?person
          recipe: ?recipe
