[package]
name = "tonk-host"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "IO ownership and `with` routing context for tonk custom elements."
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = { workspace = true }
custom-elements = { workspace = true }
multibase = { workspace = true }
futures = { workspace = true }
ipld-core = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = { workspace = true }
serde_ipld_dagjson = { workspace = true }
serde_json = { workspace = true }
tonk-common = { workspace = true }
tonk-worker-api = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-streams = { workspace = true }
web-sys = { workspace = true, features = [
  "AbortController",
  "AbortSignal",
  "CustomElementRegistry",
  "CustomEvent",
  "CustomEventInit",
  "console",
  # `Window::get_computed_style` — the confirm-button test asserts the
  # cascade's own answer, which is the only thing that can catch a rule
  # that is present but loses on specificity.
  "CssStyleDeclaration",
  "Document",
  "DomException",
  "DomTokenList",
  "Element",
  "Event",
  "EventInit",
  "EventTarget",
  "Headers",
  "History",
  "HtmlDialogElement",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlIFrameElement",
  "Location",
  "MessageEvent",
  "MutationObserver",
  "MutationObserverInit",
  "MutationRecord",
  "Navigator",
  "Url",
  "Node",
  "NodeList",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Request",
  "RequestInit",
  "Response",
  "ResponseInit",
  "ServiceWorker",
  "ServiceWorkerContainer",
  "ServiceWorkerRegistration",
  "VisibilityState",
  "Window",
] }

[dev-dependencies]
dialog-common = { workspace = true, features = ["helpers"] }
wasm-bindgen-test = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(dialog_test_native_integration)",
  "cfg(dialog_test_wasm_integration)",
  'cfg(feature, values("web-integration-tests"))',
] }
