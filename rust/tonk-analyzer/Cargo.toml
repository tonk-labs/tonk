[package]
name = "tonk-analyzer"
description = "Analyzer and Analysis<T> tree IR for Tonk notation documents"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[features]
integration-tests = []
web-integration-tests = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(dialog_test_native_integration)',
    'cfg(dialog_test_wasm_integration)',
    'cfg(feature, values("web-integration-tests"))',
] }

[dependencies]
async-trait = { workspace = true }
dialog-artifacts = { workspace = true }
dialog-capability = { workspace = true }
dialog-common = { workspace = true }
dialog-effects = { workspace = true }
dialog-query = { workspace = true }
dialog-repository = { workspace = true }
lsp-types = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tonk-core = { workspace = true }
tonk-notation = { workspace = true }
tonk-schema = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
dialog-common = { workspace = true, features = ["helpers"] }
dialog-repository = { workspace = true, features = ["helpers"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["macros", "rt"] }
wasm-bindgen-test = { workspace = true }
