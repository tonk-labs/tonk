[package]
name = "tonk-rtc"
description = "WebRTC data-channel transport between the tonk CLI and a browser peer."
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
base64 = { workspace = true }
# The iroh transport builds for BOTH targets: that is the point of it —
# the browser gets QUIC streams over a data channel with no relay.
bytes = { workspace = true, optional = true }
iroh = { version = "=1.2.0", features = ["unstable-custom-transports"], optional = true }
iroh-base = { version = "1.2", optional = true }
n0-watcher = { version = "1.0", optional = true }
noq-udp = { version = "1.3", optional = true }
# The dial credential is a bearer secret — possession of it plus the
# address is what lets a peer open a channel — so it comes from the OS
# entropy source, not from a clock or a counter.
getrandom = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `sync` only, and shared by both targets: the transport core's queues
# are tokio channels, which build for wasm. The native block below adds
# the runtime features on top; cargo unions them.
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

# The native peer and the loopback signalling listener are native-only:
# `webrtc` pulls a UDP/ICE stack that does not build for wasm32, and the
# browser half of this ceremony uses the platform's own
# `RTCPeerConnection` rather than anything from this crate.
[features]
# Run iroh over a WebRTC data channel, so a peer gets QUIC streams
# instead of 64 KiB messages and one endpoint address can hold a local
# WebRTC route beside a relay and an IP one. `unstable-custom-transports`
# is unstable by name, so iroh is pinned exactly.
iroh = [
  "dep:iroh",
  "dep:iroh-base",
  "dep:noq-udp",
  "dep:bytes",
  "dep:n0-watcher",
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait = { workspace = true }
axum = { workspace = true, features = ["form", "http1", "tokio"] }
tokio = { workspace = true, features = ["rt", "macros", "net", "time"] }
# 0.17, not the 0.20 rewrite. The rewrite dropped the UDP mux
# (`SettingEngine::set_udp_network` is commented out as a todo there),
# and the mux is what lets a listener read a dialer's ICE ufrag off the
# first STUN packet — the mechanism direct dialling needs, and the one
# `libp2p-webrtc` is built on. 0.17 also re-exports `webrtc::ice`, so the
# ICE types are nameable without a version-locked second dependency.
# `pem` for certificate persistence: the published fingerprint has to
# survive a restart, and with a mux it has to be FIXED across every
# per-dial peer connection too — each one would otherwise mint its own.
webrtc = { version = "0.17", features = ["pem"] }
# Version-locked to webrtc's own `rcgen` (0.13). `RTCCertificate::from_key_pair`
# takes a type from THEIR rcgen and the crate does not re-export it, so a
# mismatch here is a compile error rather than a subtle failure.
rcgen = "0.13"

# The test process drives the loopback listener over a raw socket, which
# needs `io-util`. Target-gated for the same reason the runtime deps
# above are: tokio's `net` pulls `mio`, which does not build for wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
anyhow = { workspace = true }
# Proving the two halves compose: dialog's peer remote over this
# crate's transport. `transport` brings `IrohChannel` and the accept
# loop; `helpers` brings a store to answer from.
dialog-capability = { workspace = true }
dialog-common = { workspace = true }
dialog-did-web = { workspace = true }
dialog-effects = { workspace = true }
dialog-iroh-remote = { workspace = true, features = ["transport", "helpers"] }
dialog-operator = { workspace = true, features = ["helpers"] }
# `env_logger` surfaces the `log` records the ICE/DTLS stack emits, which
# is how the direct-dial spike tells "rejected the binding request" apart
# from "never received one".
env_logger = "0.11"
tokio = { workspace = true, features = ["rt", "macros", "net", "sync", "time", "io-util"] }

# The browser half of the iroh transport. Optional so a native build
# never pulls them.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
  "MessageEvent",
  "MessagePort",
  "RtcDataChannel",
  "RtcDataChannelInit",
  "RtcDataChannelState",
  "RtcDataChannelType",
  "RtcPeerConnection",
] }
