[package]
name = "tonk-fab"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "<tonk-fab> custom element — floating action button rendered in a sealed iframe."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
custom-elements = { workspace = true }
js-sys = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tonk-common = { workspace = true }
tonk-host = { workspace = true }
tonk-schema = { workspace = true }
tonk-worker-api = { workspace = true }
urlencoding = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "console",
    "Clipboard",
    "CssStyleDeclaration",
    "CustomElementRegistry",
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "DomRect",
    "DomStringMap",
    "DomTokenList",
    "Element",
    "Event",
    "EventInit",
    "EventTarget",
    "FontFaceSet",
    "HtmlCollection",
    "HtmlDialogElement",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "KeyboardEventInit",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "MouseEvent",
    "MouseEventInit",
    "MutationObserver",
    "MutationObserverInit",
    "Navigator",
    "Node",
    "Performance",
    "NodeList",
    "PointerEvent",
    "Range",
    "Request",
    "RequestInit",
    "Response",
    "ResizeObserver",
    "ScrollBehavior",
    "ScrollToOptions",
    "Selection",
    "ShadowRoot",
    "ShadowRootInit",
    "ShadowRootMode",
    "Text",
    "VisibilityState",
    "VisualViewport",
    "Window",
] }

[dev-dependencies]
dialog-common = { workspace = true, features = ["helpers"] }
tokio = { workspace = true, features = ["macros", "rt"] }
wasm-bindgen-test = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(dialog_test_native_integration)',
    'cfg(dialog_test_wasm_integration)',
    'cfg(feature, values("web-integration-tests"))',
] }
