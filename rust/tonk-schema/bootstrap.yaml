concept!: &page
  description: Concept for serving HTML pages
  with:
    type:
      description: The MIME type of the content
      the: xyz.tonk.content/type
      as: text
    content:
      description: The HTML content of the page
      the: text/html
      as: text

page!: &iframe-demo
  type: text/html
  content: |
    <html>
      <head>
        <title>Demo</title>
      </head>
      <body>
        <h1>Hello World</h1>
      </body>
    </html>

