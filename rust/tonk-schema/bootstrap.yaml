db.concept!: &concept
  description: A concept of concept
  with:
    description:
      description: Description of this concept
      the: dialog.meta/description
      as: text

    # fields under with. namespace
    with..:
      description: Field names associated with this concept
      the: dialog.concept.with/.
      as: entity

    # fields under maybe. namespace
    maybe..:
      description: Optional fields associated with this concept
      the: dialog.concept.maybe/.
      as: entity
