[package]
name = "tonk-worker"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[features]
integration-tests = []
web-integration-tests = []
# Test helpers — wire-query builders and seeding fixtures.
# Auto-enabled in this crate's own test builds via `cfg(test)`;
# opt-in for downstream crates that want the same fixtures.
helpers = []

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true, features = ["json", "macros", "query"] }
base58 = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
axum-wasm-macros = { workspace = true }
bs58 = { workspace = true }
console_error_panic_hook = { workspace = true }
dialog-capability = { workspace = true }
dialog-common = { workspace = true }
dialog-artifacts = { workspace = true }
dialog-reactor = { workspace = true }
dialog-credentials = { workspace = true }
dialog-csv = { workspace = true }
dialog-effects = { workspace = true }
dialog-operator = { workspace = true }
dialog-query = { workspace = true }
dialog-remote-ucan-s3 = { workspace = true }
dialog-repository = { workspace = true }
dialog-search-tree = { workspace = true }
dialog-storage = { workspace = true }
dialog-ucan = { workspace = true }
dialog-ucan-core = { workspace = true }
dialog-varsig = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
http-body-util = { workspace = true }
ipld-core = { workspace = true }
js-sys = { workspace = true }
lsp-types = { workspace = true }
rand = { workspace = true }
send_wrapper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
tonk-account = { workspace = true }
tonk-analyzer = { workspace = true }
tonk-common = { workspace = true }
tonk-evaluator = { workspace = true }
tonk-identity = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
tonk-invite = { workspace = true }
tonk-language-server = { workspace = true }
tonk-notation = { workspace = true }
tonk-router = { workspace = true }
tonk-schema = { workspace = true }
tonk-worker-api = { workspace = true }
tower-service = { workspace = true }
url = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-streams = { workspace = true }
web-sys = { workspace = true, features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "BroadcastChannel",
    "Cache",
    "CacheQueryOptions",
    "CacheStorage",
    "Client",
    "ClientQueryOptions",
    "ClientType",
    "Clients",
    "FrameType",
    "CryptoKey",
    "ExtendableEvent",
    "ExtendableMessageEvent",
    "FetchEvent",
    "Headers",
    "ReadableStream",
    "MessageChannel",
    "MessageEvent",
    "MessagePort",
    "Request",
    "RequestCache",
    "RequestInit",
    "RequestMode",
    "Response",
    "ResponseInit",
    "ResponseType",
    "ServiceWorker",
    "ServiceWorkerGlobalScope",
    "ServiceWorkerRegistration",
    "VisibilityState",
    "WindowClient",
    "WorkerGlobalScope",
    "WorkerLocation",
    "WorkerNavigator",
] }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom_0_3 = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
dialog-common = { workspace = true, features = ["helpers"] }
dialog-operator = { workspace = true, features = ["helpers"] }
dialog-repository = { workspace = true, features = ["helpers"] }
rand = { workspace = true }
tonk-access-service = { workspace = true, features = ["helpers"] }
tonk-fab = { path = "../tonk-fab" }
tower = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(dialog_test_native_integration)',
    'cfg(dialog_test_wasm_integration)',
    'cfg(feature, values("web-integration-tests"))',
] }
