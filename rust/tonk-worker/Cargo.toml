[package]
name = "tonk-worker"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "tonk-worker-host"
path = "src/bin/hosted.rs"
required-features = ["native-host"]

[[bin]]
name = "tonk-agent-worker"
path = "src/bin/agent_worker.rs"
required-features = ["native-host"]

[features]
default = ["persona"]
# The person's own worker: their profile, their account, and what they do
# across spaces. Without it, only what a space's own worker serves.
persona = []
native-host = ["axum/tokio", "axum/http1", "tokio/net", "tokio/rt-multi-thread", "tokio/macros", "tokio/signal"]
# Local opt-in until a compatible CLI is published.
connection-invites = []
integration-tests = []
web-integration-tests = []
# Test helpers — wire-query builders and seeding fixtures.
# Auto-enabled in this crate's own test builds via `cfg(test)`;
# opt-in for downstream crates that want the same fixtures.
# `tower` comes along for `helpers::serve`, which drives a router the
# way the service worker does. It is a dev-dependency for this crate's
# own tests; downstream crates enabling `helpers` need it as a real one.
helpers = ["dep:tower"]

[dependencies]
tonk-macros = { workspace = true }
anyhow = { workspace = true }
serde_yaml = { workspace = true }
sha2_0_10 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["json", "macros", "query"] }
base58 = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
bs58 = { workspace = true }
dialog-capability = { workspace = true }
dialog-common = { workspace = true }
dialog-artifacts = { workspace = true }
dialog-reactor = { workspace = true }
dialog-credentials = { workspace = true }
dialog-csv = { workspace = true }
dialog-effects = { workspace = true }
dialog-peer = { workspace = true }
dialog-query = { workspace = true }
dialog-remote-ucan-s3 = { workspace = true }
dialog-remote-s3 = { workspace = true }
dialog-remote-ucan = { workspace = true }
dialog-repository = { workspace = true }
dialog-search-tree = { workspace = true }
dialog-storage = { workspace = true }
dialog-ucan = { workspace = true }
dialog-ucan-core = { workspace = true }
dialog-varsig = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
http-body-util = { workspace = true }
ipld-core = { workspace = true }
lsp-types = { workspace = true }
send_wrapper = { workspace = true }
serde = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
tonk-account = { workspace = true }
tonk-analytics = { workspace = true }
tonk-analyzer = { workspace = true }
tonk-common = { workspace = true }
tonk-evaluator = { workspace = true }
tonk-identity = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
tonk-invite = { workspace = true }
tonk-language-server = { workspace = true }
tonk-notation = { workspace = true }
tonk-render = { workspace = true }
tonk-router = { workspace = true }
tonk-schema = { workspace = true }
tonk-worker-api = { workspace = true }
tower-service = { workspace = true }
tower = { workspace = true, optional = true }
url = { workspace = true }
web-time = { workspace = true }
# The files library documents include, compiled in: a worker seeds the
# library from compiled-in copies.
tonk-library = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }

# A kernel on WASI: the component's own async runtime, for work a handler
# starts and does not wait on; the session a kernel acts as, and how the
# person's profile hands a space's host the key of its session.
[target.'cfg(all(target_arch = "wasm32", not(target_os = "unknown")))'.dependencies]
wit-bindgen = { workspace = true }
tonk-kernel-world = { workspace = true }

# A worker on a JavaScript host: its tasks, clock and console are the
# host's.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom_0_3 = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum = { workspace = true, features = ["tokio", "http1"] }
# The hosted agent's writer, whose kernels run on Wasmtime, which the
# interplay tests drive against this crate's own grant handling.
tonk-mcp = { workspace = true, features = ["integration-tests"] }

[dev-dependencies]
tonk-template = { workspace = true }
anyhow = { workspace = true }
dialog-common = { workspace = true, features = ["helpers"] }
dialog-peer = { workspace = true, features = ["helpers"] }
dialog-repository = { workspace = true, features = ["helpers"] }
rand = { workspace = true }
tonk-access-service = { workspace = true, features = ["helpers"] }
tower = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(dialog_test_native_integration)',
    'cfg(dialog_test_wasm_integration)',
    'cfg(feature, values("web-integration-tests"))',
] }
