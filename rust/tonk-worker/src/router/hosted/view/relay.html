<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Tonk space</title>
  <!-- tonk:in-agent -->
  <style>
    /* The relay's own layout; Tonk's card, line and disc are the in-agent
       stylesheet above. The view is the space's: edge to edge, then
       Tonk's line under it. */
    html,
    body {
      margin: 0;
      background: transparent;
    }
    /* full screen or docked: the card fills what the agent app gives it */
    html:has(.tonk--fill),
    html:has(.tonk--fill) body {
      height: 100%;
    }
    #error,
    #report {
      margin: 0;
    }
    #error {
      padding: 6px var(--in-agent-pad, 12px) 2px;
    }
    #error[hidden],
    #report[hidden],
    .tonk[hidden],
    .tonk-line [hidden] {
      display: none;
    }
    #report {
      padding: 0 var(--in-agent-pad, 12px) 8px;
      font: 12px ui-monospace, monospace;
    }
    #report pre {
      white-space: pre-wrap;
      user-select: all;
      -webkit-user-select: all;
    }
  </style>
  <!-- One line with a link: a strip, or a space a view cannot reach. -->
  <section class="tonk tonk-strip" id="strip" aria-label="Tonk" hidden>
    <span class="tonk-disc" role="img" aria-label="synced" title="synced"></span>
    <span class="tonk-receipt" role="status"></span>
    <a class="tonk-link" href="#">open ↗</a>
  </section>
  <!-- The whole space: never shown in the chat, a way into Tonk. -->
  <section class="tonk" id="handoff" aria-label="Tonk" hidden>
    <header class="tonk-head">
      <span class="tonk-disc" role="img" aria-label="synced" title="synced"></span>
      <span class="tonk-place"><span class="tonk-space"></span></span>
      <span class="tonk-role"></span>
    </header>
    <div class="tonk-handoff">
      <p>Opens the whole space in Tonk.</p>
      <a class="tonk-btn" href="#">open in tonk ↗</a>
    </div>
  </section>
  <section class="tonk" id="card" aria-label="Tonk">
    <div class="tonk-well">
      <iframe class="tonk-view" title="A view in a Tonk space" sandbox="allow-scripts allow-forms"></iframe>
    </div>
    <p id="error" class="tonk-fine" role="status" hidden></p>
    <details id="report" hidden><summary>Details for a bug report</summary><pre></pre></details>
    <footer class="tonk-line" id="line">
      <span class="tonk-disc" data-state="hollow" role="img" aria-label="local only" title="local only"></span>
      <span class="tonk-place"><span class="tonk-space"></span><span class="tonk-where"></span></span>
      <span class="tonk-receipt" role="status"></span>
      <span class="tonk-role"></span>
      <a class="tonk-link tonk-out" id="out" href="#" hidden>open in tonk ↗</a>
      <button type="button" class="tonk-expand" id="expand" aria-label="Open full screen" hidden>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9 7M2.5 13.5 7 9" /></svg>
      </button>
    </footer>
  </section>
  <script>
    // The relay between an MCP Apps host and a space's page (plan #1200,
    // stage 7). The view's peer holds its own key, which never leaves it;
    // the host's app-only `tonk_view_access` delegates the space to that
    // key, and the peer syncs with the provider as the view's own DID.
    // Nothing secret crosses the host.
    //
    // Route A, where the host frames the provider's origin (ChatGPT): the
    // relay frames this same page from the provider (`/view-frame`), whose
    // service worker is the peer, in the frame's own storage, and relays
    // the delegation to its profile's DID. Route B, everywhere else, and
    // when the frame does not answer: the peer runs in a Web Worker here.
    // Either way the space's page renders in a sandboxed `srcdoc` frame
    // and reaches the peer over the guest bridge.
    (() => {
      const origin = __TONK_MCP_ORIGIN__,
        framed = __TONK_VIEW_FRAME__,
        frame = document.querySelector('iframe'),
        card = document.querySelector('#card'),
        strip = document.querySelector('#strip'),
        handoff = document.querySelector('#handoff'),
        well = document.querySelector('.tonk-well'),
        line = document.querySelector('#line'),
        errorMessage = document.querySelector('#error'),
        report = document.querySelector('#report');
      // The framed page is the view alone: the relay that frames it draws
      // Tonk's line.
      if (framed) line.remove();
      let route, pack, port, access, renewalTimer, viewFrame, rpcId = 0;
      const pending = new Map(),
        encode = new TextEncoder(),
        bytes = (value) => Uint8Array.from(atob(value), (c) => c.charCodeAt(0));
      function rpc(method, params) {
        return new Promise((resolve, reject) => {
          const id = ++rpcId;
          pending.set(id, { resolve, reject });
          parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        });
      }
      // What the view did and when, shown under an error so a host with
      // no console (a phone) still says where and how the view failed.
      const began = Date.now(),
        trace = [];
      function note(text) {
        trace.push(((Date.now() - began) / 1000).toFixed(1) + 's ' + text);
        console.info('tonk view: ' + text);
      }
      function capabilities() {
        let storage = 'yes';
        try {
          localStorage.getItem('tonk-view-probe');
        } catch (error) {
          storage = 'no (' + error.name + ')';
        }
        return [
          'agent: ' + navigator.userAgent,
          'origin: ' + location.origin,
          'SharedWorker: ' + typeof SharedWorker,
          'Worker: ' + typeof Worker,
          'locks: ' + (navigator.locks ? 'yes' : 'no'),
          'indexedDB: ' + typeof indexedDB,
          'BroadcastChannel: ' + typeof BroadcastChannel,
          'localStorage: ' + storage,
        ];
      }
      // The peer's own view of its sandbox, asked for only once the view
      // has failed; a peer that cannot answer says so.
      // Whether this context can keep a CryptoKey in IndexedDB: a fresh
      // non-extractable key, stored and read back in a throwaway database.
      function storesCryptoKey() {
        const settle = (promise) =>
          Promise.race([promise, new Promise((resolve) => setTimeout(() => resolve('no answer in 3 s'), 3000))]);
        return settle(
          crypto.subtle
            .generateKey({ name: 'Ed25519' }, false, ['sign', 'verify'])
            .then(
              (pair) =>
                new Promise((resolve) => {
                  const opened = indexedDB.open('tonk-view-probe', 1);
                  opened.onupgradeneeded = () => opened.result.createObjectStore('keys');
                  opened.onerror = () => resolve('open failed: ' + opened.error?.name);
                  opened.onsuccess = () => {
                    const request = opened.result.transaction('keys', 'readwrite').objectStore('keys').put(pair.privateKey, 'probe');
                    request.onsuccess = () => resolve('yes');
                    request.onerror = () => resolve('put failed: ' + request.error?.name);
                  };
                }),
            )
            .catch((error) => 'failed: ' + ((error && error.message) || error)),
        );
      }
      let pageProbe;
      let peerProbe;
      function showReport() {
        const write = (peerLines) => {
          report.querySelector('pre').textContent = [
            'stage: ' + (stage || 'shown'),
            'peer: ' + (peerKind || 'none'),
            ...capabilities(),
            ...peerLines,
            '',
            ...trace,
          ].join('\n');
          report.hidden = false;
          tellSize();
        };
        write(['peer probe: asking']);
        pageProbe ??= storesCryptoKey().then((answer) => 'page stores a CryptoKey: ' + answer);
        const probe = (peerProbe = Promise.all([
          pageProbe,
          peerWorker
            ? ask('probe', {}, 15000)
                .then((answer) => answer.lines)
                .catch((error) => ['peer probe: ' + error.message])
            : ['peer probe: no peer'],
        ]).then(([page, peer]) => [page, ...peer]));
        probe.then((lines) => probe === peerProbe && write(lines));
      }
      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.hidden = !message;
        if (message) {
          note('error: ' + message);
          showReport();
        } else report.hidden = true;
        tellSize();
      }
      // ---- Tonk's line ------------------------------------------------
      // Under the view: the disc, space › view, the receipt's slot and the
      // role. It names what the tool result says it shows; a page shown by
      // path is named by its title once the page says it.
      let title = '';
      function viewName() {
        return route?.viewName || title || '';
      }
      function label() {
        if (framed) return;
        const space = route?.name || '',
          where = viewName();
        line.querySelector('.tonk-space').textContent = space;
        line.querySelector('.tonk-space').hidden = !space;
        line.querySelector('.tonk-where').textContent = where ? (space ? '› ' : '') + where : '';
        line.querySelector('.tonk-role').textContent = route?.role || (route?.edit ? 'write' : 'read');
        if (route?.subject) out.href = inTonk();
        named();
        frame.title = where
          ? where + (space ? ', a view in ' + space : '')
          : space
            ? 'A view in ' + space
            : 'A view in a Tonk space';
      }
      // The card's name for screen readers, as the mock names it: "Tonk:
      // Family trip, Packing list", then its state (loading, didn't load).
      function named() {
        if (framed) return;
        const parts = [route?.name, viewName()].filter(Boolean);
        if (well.hasAttribute('data-failed')) parts.push('didn\u2019t load');
        else if (well.getAttribute('aria-busy') === 'true') parts.push('loading');
        if (host.displayMode === 'fullscreen') parts.push('full screen');
        else if (host.displayMode === 'pip') parts.push('docked');
        card.setAttribute('aria-label', parts.length ? 'Tonk: ' + parts.join(', ') : 'Tonk');
      }
      // The disc: filled while the view's peer is connected and synced
      // (also while a save goes through), hollow while nothing syncs yet
      // or Tonk cannot reach the space. A view cannot pause sync, so it
      // is never drawn paused. A framed page tells the relay, whose line
      // it is.
      const DISC = { filled: 'synced', hollow: 'local only', paused: 'paused' };
      function disc(state) {
        if (framed) return parent.postMessage({ tonkFrame: 'sync', state }, '*');
        if (!DISC[state]) return;
        const element = line.querySelector('.tonk-disc');
        if (state === 'filled') delete element.dataset.state;
        else element.dataset.state = state;
        element.setAttribute('aria-label', DISC[state]);
        element.title = DISC[state];
      }
      // Whether the peer reaches the space now: asked after each write, on
      // `online`, and every minute. A status that cannot be read for some
      // other reason leaves the disc as it was.
      let syncTimer;
      async function checkSync() {
        if (!route?.subject || (!framed && !peerWorker)) return;
        try {
          const status = await peerFetch(base() + '/sync/status');
          if (status.ok) disc((await status.json()).state === 'no-upstream' ? 'hollow' : 'filled');
          else if (status.status === 503) disc('hollow');
        } catch {}
      }
      function synced() {
        disc('filled');
        clearInterval(syncTimer);
        syncTimer = setInterval(checkSync, 60000);
      }
      addEventListener('offline', () => disc('hollow'));
      addEventListener('online', () => checkSync());

      // ---- The agent app ------------------------------------------------
      // Its theme, display mode and safe area, from the host context at
      // `ui/initialize` and each `host-context-changed` after it.
      const expand = line.querySelector('#expand'),
        out = line.querySelector('#out');
      const host = { theme: undefined, displayMode: 'inline', available: [] };
      function themed() {
        return host.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      }
      // Tonk's look follows the agent app's theme, and so does the view.
      function applyTheme() {
        const theme = themed();
        document.documentElement.dataset.theme = theme;
        if (viewFrame) frame.contentWindow?.postMessage({ tonkFrame: 'theme', theme }, origin);
        else {
          frame.contentWindow?.postMessage({ type: 'tonk-theme', theme }, '*');
          // The runtime's own message, which it passes on to nested views.
          frame.contentWindow?.postMessage({ __tonkRuntime: 'mode', mode: theme }, '*');
        }
      }
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => host.theme || applyTheme());
      function context(changed) {
        if (!changed || typeof changed !== 'object') return;
        if (changed.theme === 'dark' || changed.theme === 'light') host.theme = changed.theme;
        if (typeof changed.displayMode === 'string') host.displayMode = changed.displayMode;
        if (Array.isArray(changed.availableDisplayModes)) host.available = changed.availableDisplayModes;
        const bottom = Number(changed.safeAreaInsets?.bottom);
        if (Number.isFinite(bottom))
          card.style.setProperty('--tonk-safe-bottom', Math.max(0, bottom) + 'px');
        applyTheme();
        display();
      }
      // Inline, the card fits the view. Full screen and docked, it fills
      // what the agent app gives it: the view scrolls above the line, and
      // full screen adds the way into Tonk. No flow depends on docked,
      // which only some agent apps have.
      // The size the view is drawn at: full whenever it fills the card, else
      // what the agent asked for. Inline, a view drops its own heading.
      function sized() {
        if (host.displayMode === 'fullscreen' || host.displayMode === 'pip') return 'full';
        return route?.size || 'card';
      }
      function display() {
        if (framed) return;
        // The framed page passes the size on to its own view.
        if (viewFrame && route) frame.contentWindow?.postMessage({ tonkFrame: 'size', size: sized() }, origin);
        else if (pack && route) frame.contentWindow?.postMessage({ type: 'tonk-size', size: sized() }, '*');
        const fill = host.displayMode === 'fullscreen' || host.displayMode === 'pip';
        card.classList.toggle('tonk--fill', fill);
        expand.hidden = fill || !host.available.includes('fullscreen');
        out.hidden = host.displayMode !== 'fullscreen' || !route;
        named();
        tellSize();
      }
      expand.addEventListener('click', async () => {
        try {
          const answer = await rpc('ui/request-display-mode', { mode: 'fullscreen' });
          if (answer?.mode) context({ displayMode: answer.mode });
        } catch (error) {
          note('full screen refused: ' + error.message);
        }
      });
      // Where the space opens in Tonk, in the person's browser.
      function inTonk() {
        return origin + '/space/' + route.subject + (route.path === '/' ? '' : route.path);
      }
      out.addEventListener('click', (event) => {
        event.preventDefault();
        openLink(inTonk());
      });
      // A link out of the card opens through the agent app, which may ask
      // the person first.
      async function openLink(url) {
        if (framed) return parent.postMessage({ tonkFrame: 'open', url }, '*');
        try {
          await rpc('ui/open-link', { url });
        } catch (error) {
          note('open-link refused: ' + error.message);
          if (typeof window.openai?.openExternal === 'function') window.openai.openExternal({ href: url });
        }
      }

      // ---- A link instead of a view -----------------------------------
      // The whole space opens in Tonk; a strip, or a space a view cannot
      // reach, is one line with a link. Neither runs a peer: the disc is
      // drawn filled, as the mock draws it, for a space this connection
      // reaches.
      function linkOnly(kind) {
        card.hidden = true;
        const link = route.link || inTonk(),
          where = viewName(),
          space = route.name || 'this space';
        if (kind === 'handoff') {
          handoff.querySelector('.tonk-space').textContent = space;
          handoff.querySelector('.tonk-role').textContent = route.role || '';
          handoff.setAttribute('aria-label', 'Tonk: open ' + space);
          const button = handoff.querySelector('.tonk-btn');
          button.href = link;
          button.onclick = (event) => (event.preventDefault(), openLink(link));
          handoff.hidden = false;
        } else {
          strip.querySelector('.tonk-receipt').textContent =
            (where ? space + ' › ' + where : space) + ' opens in your browser';
          strip.setAttribute('aria-label', 'Tonk: link to ' + (where || space));
          const anchor = strip.querySelector('.tonk-link');
          anchor.href = link;
          anchor.onclick = (event) => (event.preventDefault(), openLink(link));
          strip.hidden = false;
        }
        tellSize();
      }

      // ---- Loading and failed -----------------------------------------
      // Until the page reports its size, the well is busy: it starts at the
      // height this view had last time, with a wash, and after 400 ms says
      // what is loading. Cold loads take 20 s and more, so there is no
      // deadline for that: a view fails when something says it failed, or
      // when its page has loaded and stays silent for 3 s (no bridge: an
      // error page).
      const SLOW_MS = 400,
        QUIET_MS = 3000;
      let slowTimer, quietTimer, heard;
      const heightKey = () =>
        'tonk-view-height:' + route.subject + (route.view ? JSON.stringify(route.view) : route.path);
      function remembered() {
        try {
          return Number(sessionStorage.getItem(heightKey())) || 0;
        } catch {
          return 0;
        }
      }
      function remember(height) {
        try {
          sessionStorage.setItem(heightKey(), String(height));
        } catch {}
      }
      function loading() {
        if (framed) return;
        clearFailed();
        clearTimeout(slowTimer);
        const height = remembered();
        if (height) frame.style.height = height + 'px';
        well.setAttribute('aria-busy', 'true');
        named();
        slowTimer = setTimeout(() => {
          if (well.getAttribute('aria-busy') !== 'true') return;
          well.dataset.slow = '';
          well.dataset.loading = 'loading ' + (viewName() || route?.name || 'the view');
        }, SLOW_MS);
      }
      function settled() {
        clearTimeout(slowTimer);
        clearTimeout(quietTimer);
        well.removeAttribute('aria-busy');
        delete well.dataset.slow;
        delete well.dataset.loading;
        named();
      }
      function clearFailed() {
        well.querySelector('.tonk-failed')?.remove();
        delete well.dataset.failed;
      }
      // Say the view did not load, and offer to load it again. The reason
      // stays below, with the details for a bug report.
      function fail(message) {
        if (message) showError(message);
        if (framed) {
          parent.postMessage({ tonkFrame: 'error', message: String(message || '') }, '*');
          return;
        }
        settled();
        clearFailed();
        well.dataset.failed = '';
        const note = document.createElement('p'),
          name = viewName();
        note.className = 'tonk-failed';
        note.setAttribute('role', 'alert');
        note.textContent = (name || 'This view') + ' didn’t load.';
        const retry = document.createElement('button');
        retry.type = 'button';
        retry.className = 'tonk-link';
        retry.textContent = 'try again';
        retry.addEventListener('click', () => {
          showError('');
          loading();
          frame.focus({ preventScroll: true });
          open();
        });
        note.append(' ', retry);
        well.append(note);
        named();
        tellSize();
      }
      // The page has loaded: a page with a bridge speaks at once, so one
      // silent for 3 s has none.
      frame.addEventListener('load', () => {
        if (framed || viewFrame || !frame.hasAttribute('srcdoc') || heard) return;
        clearTimeout(quietTimer);
        quietTimer = setTimeout(() => {
          if (!heard && well.getAttribute('aria-busy') === 'true') fail('');
        }, QUIET_MS);
      });

      // What the view is waiting on, so one that never shows its page says
      // where it stopped rather than staying blank.
      let stage = 'waiting for the chat to hand over the view',
        peerKind = '';
      // A stage that takes 20 s says so; the view goes on waiting, and
      // the note goes once a later stage is reached.
      let stalled, stuck;
      function watch() {
        clearTimeout(stalled);
        stalled = setTimeout(() => {
          if (!stage) return;
          stuck = 'The view is stuck ' + stage + (peerKind ? ' (' + peerKind + ')' : '') + '.';
          showError(stuck);
        }, 20000);
      }
      watch();
      function reached(next) {
        if (framed) parent.postMessage({ tonkFrame: 'stage', stage: next }, '*');
        if (next) note(next);
        else if (stage) note('shown');
        stage = next;
        if (stuck && errorMessage.textContent === stuck) showError('');
        stuck = undefined;
        if (next) watch();
        else clearTimeout(stalled);
      }
      const base = () => '/api/repository/' + encodeURIComponent(route.subject) + '/branch/main';

      // ---- The view's peer, in a Web Worker ---------------------------
      // One peer per space serves every view of it, as the app's service
      // worker serves its pages: a SharedWorker named for the space, which
      // syncs in the background and repaints each view from one store. A
      // host without SharedWorker gives each view a worker of its own.
      const peerSource = `
        let peer, key, module, claim, started, opened, following;
        function kept(mode, act) {
          return new Promise((resolve, reject) => {
            const opened = indexedDB.open('tonk-view-keys', 1);
            opened.onupgradeneeded = () => opened.result.createObjectStore('keys');
            opened.onerror = () => reject(opened.error);
            opened.onsuccess = () => {
              const request = act(opened.result.transaction('keys', mode).objectStore('keys'));
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error);
            };
          });
        }
        // A space's key and store are kept, so a view opened again signs as
        // the same key and pulls only what changed. Where views have peers
        // of their own they share the store: a commit on a head another
        // peer moved is refused and retried on the new head, and each peer
        // tells the others when it changed the store, so they read it
        // again. Making the key is the one step taken under a lock, so two
        // views opened at once do not make two.
        const CAPABILITY = '~keeps-crypto-keys';
        // Store \`value\` in a throwaway database and read it back: true only
        // when it comes back (WebKit can store a CryptoKey it then reads as
        // null).
        function roundTrip(value) {
          return new Promise((resolve, reject) => {
            const opened = indexedDB.open('tonk-view-keys-probe', 1);
            opened.onupgradeneeded = () => opened.result.createObjectStore('keys');
            opened.onerror = () => reject(opened.error);
            opened.onsuccess = () => {
              const store = opened.result.transaction('keys', 'readwrite').objectStore('keys');
              store.put(value, 'probe');
              const read = store.get('probe');
              read.onsuccess = () => resolve(read.result != null);
              read.onerror = () => reject(read.error);
            };
          });
        }
        function claimFor(space) {
          return kept('readonly', (store) => store.get(space))
            .then((entry) => ({ space, entry }))
            .catch(() => ({}));
        }
        // How far starting got, and since when, for a view's report.
        let step = 'not started', since = Date.now(), began = Date.now();
        const steps = [];
        function at(next) {
          steps.push(((Date.now() - began) / 1000).toFixed(1) + 's ' + next);
          step = next;
          since = Date.now();
        }
        async function start(claimed, data) {
          at('importing the runtime');
          module = await import(data.glue);
          at('starting the wasm');
          await module.default({ module_or_path: data.wasm });
          // Each step under the key lock is bounded: a step that never
          // settles (seen on iOS) would hold the lock, and so stall every
          // later view of the space, for as long as this peer lives.
          const within = (ms, promise, what) =>
            Promise.race([
              promise,
              new Promise((_, reject) => setTimeout(() => reject(Error(what + ' took over ' + ms / 1000 + ' s')), ms)),
            ]);
          const make = async (space) => {
            at('reading the kept key');
            const entry = space
              ? await within(3000, kept('readonly', (store) => store.get(space)), 'reading the kept key').catch((error) => {
                  at('no kept key: ' + error.message);
                })
              : undefined;
            if (entry) {
              at('restoring the kept key');
              key = await within(5000, module.ViewKey.restore(entry.seed ?? entry.key), 'restoring the kept key').catch((error) => {
                at('kept key not restored: ' + ((error && error.message) || error));
              });
            }
            if (key) return true;
            // Where this host cannot keep a CryptoKey, the key is made from a
            // random seed and the seed is kept: the key is non-extractable
            // all the same, only the stored bytes are readable.
            const handles = space ? await keepsCryptoKeys : true;
            at(handles ? 'making a key' : 'making a key from a kept seed');
            const seed = handles ? undefined : crypto.getRandomValues(new Uint8Array(32));
            key = await within(10000, seed ? module.ViewKey.restore(seed) : module.ViewKey.generate(), 'making a key');
            if (space) {
              try {
                at('exporting the key');
                const record = seed
                  ? { did: key.did, seed }
                  : { did: key.did, key: await within(3000, key.export(), 'exporting the key') };
                at('storing the key');
                await within(3000, kept('readwrite', (store) => store.put(record, space)), 'storing the key');
              } catch (error) {
                at('key not kept: ' + ((error && error.message) || error));
              }

          const prefixes = [encodeURIComponent(route.subject), route.subject].map(
            (subject) => '/api/repository/' + subject + '/branch/main/',
          );
          if (!prefixes.some((prefix) => path.startsWith(prefix))) {
            current.postMessage({
              v: 1,
              type: 'fetch-result',
              id: message.id,
              status: 403,
              statusText: 'Forbidden',
              headers: [],
              body: encode.encode('This request is outside the shown space.'),
            });
            return;
          }
          const response = await peerFetch(path, {
            method: message.method,
            headers: message.headers,
            body: message.body,
          });
          const result = {
            v: 1,
            type: 'fetch-result',
            id: message.id,
            status: response.status,
            statusText: response.statusText,
            headers: [...response.headers],
          };
          if (response.headers.get('content-type')?.includes('text/event-stream') && response.body) {
            // WebKit cannot transfer a ReadableStream, so a stream goes over
            // its own port, a chunk per credit the guest grants.
            const channel = new MessageChannel();
            current.postMessage({ ...result, streamPort: channel.port2 }, [channel.port2]);
            streamOver(response.body, channel.port1);
            return;
          }
          current.postMessage({ ...result, body: new Uint8Array(await response.arrayBuffer()) });
          return;
        }
        if (message.type === 'evaluate') {
          const response = await peerFetch(
            base() + '/evaluate?transact=' + (message.transact !== false),
            { method: 'POST', headers: { 'content-type': 'text/plain' }, body: message.document },
          );
          current.postMessage({
            v: 1,
            type: 'evaluate-result',
            id: message.id,
            result: await response.json(),
          });
          return;
        }
        if (message.type === 'transact' || message.type === 'query') {
          const action = message.type === 'transact' ? 'transact' : 'query';
          const response = await peerFetch(base() + '/' + action, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(message.request ?? message.body),
          });
          const value = await response.json();
          current.postMessage({
            v: 1,
            type: action + '-result',
            id: message.id,
            ...(action === 'query' ? { rows: value } : { receipt: value }),
          });
          return;
        }
        throw Error('This host operation is unavailable: ' + String(message.type).slice(0, 40));
      }
      // The space's page reports its height; the frame takes it, and the
      // host is told the view's (a framed page tells the relay instead).
      function resize(height) {
        if (!Number.isFinite(height)) return;
        const fitted = Math.min(Math.max(Math.ceil(height), 40), 4000);
        frame.style.height = fitted + 'px';
        if (route) remember(fitted);
        // The view has drawn: tell it the theme again, in case its runtime
        // set its own after it mounted.
        if (well.getAttribute('aria-busy') === 'true') applyTheme();
        settled();
        clearFailed();
        tellSize();
      }
      // The host sizes the view from what it is told, so an error shown
      // before the page reports its height is still in sight.
      function tellSize() {
        const view = Math.ceil(
          [card, strip, handoff].reduce((height, each) => height + (each.hidden ? 0 : each.getBoundingClientRect().height), 0),
        );
        if (framed) parent.postMessage({ tonkFrame: 'size', height: view }, '*');
        else
          parent.postMessage(
            { jsonrpc: '2.0', method: 'ui/notifications/size-changed', params: { height: view } },
            '*',
          );
      }
      function streamOver(stream, port) {
        const reader = stream.getReader();
        let credit = 0,
          pumping = false,
          done = false;
        const finish = (message) => {
          done = true;
          port.postMessage(message);
          port.close();
        };
        async function pump() {
          if (pumping) return;
          pumping = true;
          try {
            while (credit > 0 && !done) {
              const { value, done: end } = await reader.read();
              if (end) finish({ type: 'close' });
              else {
                credit--;
                const chunk = value.buffer.slice(value.byteOffset, value.byteOffset + value.byteLength);
                port.postMessage({ type: 'chunk', chunk }, [chunk]);
              }
            }
          } catch (error) {
            if (!done) finish({ type: 'error', error: String(error?.message ?? error) });
          }
          pumping = false;
        }
        port.onmessage = (event) => {
          if (event.data?.type === 'credit') {
            credit += Number(event.data.n) || 1;
            pump();
          } else if (event.data?.type === 'cancel') {
            done = true;
            reader.cancel().catch(() => {});
            port.close();
          }
        };
      }
      function send(value) {
        frame.contentWindow.postMessage(value, '*');
      }
      addEventListener('message', (event) => {
        const m = event.data;
        if (event.source === parent && m?.jsonrpc === '2.0') {
          if (pending.has(m.id)) {
            const p = pending.get(m.id);
            pending.delete(m.id);
            m.error ? p.reject(Error(m.error.message)) : p.resolve(m.result);
          } else if (m.method === 'ui/notifications/host-context-changed') {
            context(m.params);
          } else if (
            m.method === 'ui/notifications/tool-result' &&
            m.params?.structuredContent?.remote
          ) {
            route = m.params.structuredContent;
            note('view handed over');
            label();
            if (route.show === 'handoff' || route.show === 'strip') return linkOnly(route.show);
            display();
            loading();
            open();
          }
          return;
        }
        // The framed page: from the relay that frames it.
        if (framed && event.source === parent && m?.tonkFrame === 'size') {
          if (route) route = { ...route, size: m.size };
          if (pack && route) send({ type: 'tonk-size', size: m.size });
          return;
        }
        if (framed && event.source === parent && m?.tonkFrame === 'theme') {
          host.theme = m.theme;
          applyTheme();
          return;
        }
        if (framed && event.source === parent && m?.tonkFrame === 'access') {
          relayed.get('access')?.(m);
          relayed.delete('access');
          return;
        }
        // The relay: from the provider's framed page.
        if (!framed && viewFrame && event.source === frame.contentWindow && event.origin === origin) {
          if (m?.tonkFrame === 'size') resize(m.height);
          // How far the framed page has got, so this relay's note names
          // the stage it waits on, and clears once its view has drawn.
          else if (m?.tonkFrame === 'stage') reached(String(m.stage ?? '').slice(0, 120));
          else if (m?.tonkFrame === 'loading') viewFrame.loading?.();
          else if (m?.tonkFrame === 'hello' && typeof m.did === 'string') {
            viewFrame.did = m.did;
            viewFrame.hello();
          } else if (m?.tonkFrame === 'renew') offer().catch((e) => fail(e.message));
          else if (m?.tonkFrame === 'sync') disc(m.state);
          else if (m?.tonkFrame === 'open' && typeof m.url === 'string') openLink(m.url);
          else if (m?.tonkFrame === 'error') fail(String(m.message).slice(0, 300));
          return;
        }
        if (event.source === frame.contentWindow) {
          heard = true;
          clearTimeout(quietTimer);
        }
        if (event.source !== frame.contentWindow || !pack || !route) return;
        if (m?.type === 'tonk-view-size') {
          reached('');
          return resize(m.height);
        }
        if (m?.type === 'hello' && m.v === 1 && event.ports[0]) {
          port?.close();
          port = event.ports[0];
          const current = port;
          current.onmessage = (e) =>
            guest(e.data, current).catch((error) => {
              showError(error.message);
              if (e.data.id)
                current.postMessage({
                  v: 1,
                  type: e.data.type + '-error',
                  id: e.data.id,
                  error: error.message,
                });
            });
          current.postMessage({
            v: 1,
            type: 'ready',
            context: {
              origin: 'https://tonk.foundation',
              path: '/space/' + route.subject + route.path,
              repo: route.subject,
              branch: 'main',
              with: 'main@' + route.subject,
              site: route.site,
              this: route.view?.entity ?? route.site,
              model: route.view?.model ?? route.model,
              selectionReporting: false,
            },
          });
        }
        if (m?.__tonkRuntime === 'runtime-ready') {
          send({ type: 'tonk-mount', ...route, hideFab: true, theme: themed(), size: sized() });
          send({
            __tonkRuntime: 'inject',
            glue: pack.glue,
            snippets: pack.snippets,
            wasm: bytes(pack.wasm),
            wa: bytes(pack.wa),
            css: pack.css,
            prose: pack.prose,
            table: pack.table,
          });
        }
        if (m?.__tonkRuntime === 'need-prose')
          send({ __tonkRuntime: 'inject-prose', prose: pack.proseCore });
        if (m?.__tonkRuntime === 'need-table')
          send({ __tonkRuntime: 'inject-table', table: pack.tableGrid });
        if (m?.__tonkRuntime === 'need-code')
          send({ __tonkRuntime: 'inject-code', code: pack.code });
        if (m?.__tonkRuntime === 'error')
          fail('Tonk runtime could not load: ' + String(m.error ?? '').split('\n')[0]);
      });
      // Answer the host first: it waits on this handshake to show the app,
      // and the runtimes are large downloads that may be slow or blocked.
      const initialized = framed
        ? null
        : rpc('ui/initialize', {
            appInfo: { name: 'tonk-space', version: '0.4.0' },
            appCapabilities: { availableDisplayModes: ['inline', 'fullscreen', 'pip'] },
            protocolVersion: '2026-01-26',
          }).then((result) => {
            note('host answered');
            context(result?.hostContext);
            parent.postMessage(
              { jsonrpc: '2.0', method: 'ui/notifications/initialized', params: {} },
              '*',
            );
            return result;
          });
      let packLoading;
      function loadPack() {
        packLoading ??= (async () => {
          const response = await fetch(origin + '/space-runtime.json', { credentials: 'omit' });
          if (!response.ok) throw Error('Could not load Tonk runtime.');
          pack = await response.json();
        })().catch(() => {
          throw Error('Could not load the Tonk runtime from ' + origin + '.');
        });
        return packLoading;
      }
      // Show the route the tool result handed over: in the provider's
      // framed page where the host frames it, else with a peer here.
      function open() {
        return initialized
          .then(async (result) => {
            // A whole view asks for full screen as soon as it is shown, on
            // either route.
            if (route.size === 'full' && host.available.includes('fullscreen') && host.displayMode === 'inline')
              expand.click();
            if (hostFrames(result)) reached('framing the provider\'s page');
            if (hostFrames(result) && (await tryFrame())) return note('framed'), offer();
            if (viewFrame !== undefined) restoreSandbox();
            // A host that runs no worker cannot run a view's peer: a link.
            if (typeof Worker !== 'function') return note('no Worker here'), linkOnly('strip');
            await connect();
            await navigate(route.path);
          })
          .catch((e) => fail(e.message));
      }
      const observer = new ResizeObserver(() => tellSize());
      for (const each of [card, strip, handoff]) observer.observe(each);
      applyTheme();
      if (framed) parent.postMessage({ tonkFrame: 'loading' }, '*');
      if (framed) connectFramed().then(() => navigate(route.path)).catch((e) => fail(e.message));
      else initialized.catch((e) => fail(e.message));
    })();
  </script>
</html>
