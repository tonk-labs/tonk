<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Tonk space</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      color-scheme: light dark;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #error {
      margin: 0;
      padding: 12px;
      font: 14px system-ui;
    }
    #error[hidden] {
      display: none;
    }
    iframe {
      flex: 1;
      min-height: 560px;
      border: 0;
      width: 100%;
    }
  </style>
  <p id="error" role="alert" hidden></p>
  <iframe title="Tonk space" sandbox="allow-scripts allow-forms"></iframe>
  <script>
    // The relay between an MCP Apps host and a space's guest page. The
    // guest's requests go to the Host Worker's `/space-api/`, which hands
    // them to the space writer of this space and MCP session, with a
    // short-lived view ticket the show tool returns in `_meta`, which hosts
    // hand the view and not the model. The ticket is renewed
    // through the app-only `tonk_view_ticket` tool, so the host's own
    // bearer never reaches this page.
    (() => {
      const origin = __TONK_MCP_ORIGIN__,
        frame = document.querySelector('iframe'),
        errorMessage = document.querySelector('#error');
      let route,
        ticket,
        pack,
        port,
        rpcId = 0,
        controller = new AbortController();
      const pending = new Map(),
        encode = new TextEncoder(),
        bytes = (value) => Uint8Array.from(atob(value), (c) => c.charCodeAt(0));
      function rpc(method, params) {
        return new Promise((resolve, reject) => {
          const id = ++rpcId;
          pending.set(id, { resolve, reject });
          parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        });
      }
      const base = () => '/api/repository/' + encodeURIComponent(route.subject) + '/branch/main';
      let renewal, renewalTimer;
      function scheduleRenewal() {
        clearTimeout(renewalTimer);
        renewalTimer = setTimeout(
          () => ensureTicket().catch((e) => showError(e.message)),
          Math.max(1000, ticket.expiresAt - Date.now() - 60000),
        );
      }
      async function ensureTicket() {
        if (!ticket) throw Error('Open this space from the chat.');
        if (Date.now() < ticket.expiresAt - 60000) return;
        if (renewal) return renewal;
        const previous = ticket;
        renewal = rpc('tools/call', {
          name: 'tonk_view_ticket',
          arguments: { space: route.subject },
        })
          .then((result) => {
            const next = result?._meta?.ticket;
            if (result?.isError || !next?.token)
              throw Error('The view could not renew its access. Reopen it from the chat.');
            if (ticket === previous) {
              ticket = next;
              scheduleRenewal();
              showError('');
            }
          })
          .finally(() => {
            renewal = null;
          });
        return renewal;
      }
      addEventListener('pageshow', () => {
        if (ticket) ensureTicket().catch((e) => showError(e.message));
      });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && ticket) ensureTicket().catch((e) => showError(e.message));
      });
      async function request(path, options = {}) {
        await ensureTicket();
        const incoming = new Headers(options.headers),
          headers = new Headers();
        for (const key of ['accept', 'content-type'])
          if (incoming.has(key)) headers.set(key, incoming.get(key));
        headers.set('authorization', 'Bearer ' + ticket.token);
        const response = await fetch(origin + '/space-api' + path, {
          ...options,
          headers,
          credentials: 'omit',
          signal: controller.signal,
        });
        if (!response.ok)
          throw Error(
            response.status === 401
              ? 'The view lost its access. Reopen it from the chat.'
              : response.status === 403
                ? 'This connection can only read this space.'
                : 'Tonk request failed (' +
                  response.status +
                  '). Read the space before retrying a change.',
          );
        return response;
      }
      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.hidden = !message;
      }
      async function navigate(path) {
        if (!path.startsWith('/') || path.startsWith('//'))
          throw Error('Choose a route in this space.');
        controller.abort();
        controller = new AbortController();
        port?.close();
        port = null;
        route = { ...route, path };
        const response = await request(base() + '/site', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ path }),
        });
        const { site } = await response.json();
        route.site = site;
        route.model = 'tonk:site';
        showError('');
        // Load the guest inline, not as a frame of our origin: Claude does
        // not frame origins outside its own list, while fetching the
        // document only needs a connect domain.
        const guestPage = await fetch(origin + '/worker-guest.html', {
          credentials: 'omit',
          signal: controller.signal,
        });
        if (!guestPage.ok) throw Error('Could not load the Tonk view.');
        frame.removeAttribute('src');
        frame.srcdoc = await guestPage.text();
      }
      async function guest(message, current) {
        if (message.type === 'title') {
          document.title = String(message.text || 'Tonk').slice(0, 200);
          return;
        }
        if (message.type === 'navigate') {
          const u = new URL(
              message.href,
              'https://tonk.foundation/space/' + route.subject + route.path,
            ),
            prefix = '/space/' + route.subject;
          if (u.origin !== 'https://tonk.foundation' || u.search)
            throw Error('Navigation outside this space is unavailable.');
          // A link leaves a single view for the space route it names.
          route = { ...route, view: undefined };
          return navigate(
            u.pathname.startsWith(prefix + '/') ? u.pathname.slice(prefix.length) : u.pathname,
          );
        }
        if (message.type === 'reload') return navigate(route.path);
        if (['analytics', 'unsubscribe'].includes(message.type)) return;
        if (message.type === 'fetch') {
          const target = new URL(message.path, 'https://tonk.foundation');
          if (target.origin !== 'https://tonk.foundation')
            throw Error('External requests are unavailable.');
          let path = target.pathname + target.search;
          if (target.pathname === '/query') path = base() + '/query' + target.search;
          if (target.pathname === '/api/site') {
            path = base() + '/site';
            message = {
              ...message,
              body: JSON.stringify({ path: route.path }),
              headers: { 'content-type': 'application/json' },
            };
          }
          const prefixes = [encodeURIComponent(route.subject), route.subject].map(
            (subject) => '/api/repository/' + subject + '/branch/main/',
          );
          if (!prefixes.some((prefix) => path.startsWith(prefix))) {
            current.postMessage({
              v: 1,
              type: 'fetch-result',
              id: message.id,
              status: 403,
              statusText: 'Forbidden',
              headers: [],
              body: encode.encode('This request is outside the connected space.'),
            });
            return;
          }
          const response = await request(path, {
            method: message.method,
            headers: message.headers,
            body: message.body,
          });
          const streaming = response.headers.get('content-type')?.includes('text/event-stream');
          const body = streaming ? response.body : new Uint8Array(await response.arrayBuffer());
          current.postMessage(
            {
              v: 1,
              type: 'fetch-result',
              id: message.id,
              status: response.status,
              statusText: response.statusText,
              headers: [...response.headers],
              body,
            },
            streaming ? [body] : [],
          );
          return;
        }
        if (message.type === 'evaluate') {
          const response = await request(
            base() + '/evaluate?transact=' + (message.transact !== false),
            { method: 'POST', headers: { 'content-type': 'text/plain' }, body: message.document },
          );
          current.postMessage({
            v: 1,
            type: 'evaluate-result',
            id: message.id,
            result: await response.json(),
          });
          return;
        }
        if (message.type === 'transact' || message.type === 'query') {
          const action = message.type === 'transact' ? 'transact' : 'query';
          const response = await request(base() + '/' + action, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(message.request ?? message.body),
          });
          const value = await response.json();
          current.postMessage({
            v: 1,
            type: action + '-result',
            id: message.id,
            ...(action === 'query' ? { rows: value } : { receipt: value }),
          });
          return;
        }
        throw Error('This host operation is unavailable: ' + String(message.type).slice(0, 40));
      }
      function send(value) {
        frame.contentWindow.postMessage(value, '*');
      }
      addEventListener('message', (event) => {
        const m = event.data;
        if (event.source === parent && m?.jsonrpc === '2.0') {
          if (pending.has(m.id)) {
            const p = pending.get(m.id);
            pending.delete(m.id);
            m.error ? p.reject(Error(m.error.message)) : p.resolve(m.result);
          } else if (
            m.method === 'ui/notifications/tool-result' &&
            m.params?._meta?.ticket
          ) {
            ready
              .then(async () => {
                route = m.params.structuredContent;
                ticket = m.params._meta.ticket;
                scheduleRenewal();
                await navigate(route.path);
              })
              .catch((e) => showError(e.message));
          }
          return;
        }
        if (event.source !== frame.contentWindow || !pack || !route) return;
        if (m?.type === 'hello' && m.v === 1 && event.ports[0]) {
          port?.close();
          port = event.ports[0];
          const current = port;
          current.onmessage = (e) =>
            guest(e.data, current).catch((error) => {
              if (error.name === 'AbortError') return;
              showError(error.message);
              if (e.data.id)
                current.postMessage({
                  v: 1,
                  type: e.data.type + '-error',
                  id: e.data.id,
                  error: error.message,
                });
            });
          current.postMessage({
            v: 1,
            type: 'ready',
            context: {
              origin: 'https://tonk.foundation',
              path: '/space/' + route.subject + route.path,
              repo: route.subject,
              branch: 'main',
              with: 'main@' + route.subject,
              site: route.site,
              this: route.view?.entity ?? route.site,
              model: route.view?.model ?? route.model,
              selectionReporting: false,
            },
          });
        }
        if (m?.__tonkRuntime === 'runtime-ready') {
          send({ type: 'tonk-mount', ...route, hideFab: true });
          send({
            __tonkRuntime: 'inject',
            glue: pack.glue,
            snippets: pack.snippets,
            wasm: bytes(pack.wasm),
            wa: bytes(pack.wa),
            css: pack.css,
            prose: pack.prose,
            table: pack.table,
          });
        }
        if (m?.__tonkRuntime === 'need-prose')
          send({ __tonkRuntime: 'inject-prose', prose: pack.proseCore });
        if (m?.__tonkRuntime === 'need-table')
          send({ __tonkRuntime: 'inject-table', table: pack.tableGrid });
        if (m?.__tonkRuntime === 'need-code')
          send({ __tonkRuntime: 'inject-code', code: pack.code });
        if (m?.__tonkRuntime === 'error') showError('Tonk runtime could not load.');
      });
      // Answer the host first: it waits on this handshake to show the app,
      // and the runtime is a large download that may be slow or blocked.
      const initialized = rpc('ui/initialize', {
        appInfo: { name: 'tonk-space', version: '0.3.0' },
        appCapabilities: {},
        protocolVersion: '2026-01-26',
      }).then(() =>
        parent.postMessage(
          { jsonrpc: '2.0', method: 'ui/notifications/initialized', params: {} },
          '*',
        ),
      );
      const loaded = (async () => {
        const response = await fetch(origin + '/space-runtime.json', { credentials: 'omit' });
        if (!response.ok) throw Error('Could not load Tonk runtime.');
        pack = await response.json();
      })().catch(() => {
        throw Error('Could not load the Tonk runtime from ' + origin + '.');
      });
      const ready = Promise.all([initialized, loaded]);
      ready.catch((e) => showError(e.message));
    })();
  </script>
</html>
