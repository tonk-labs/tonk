[test-groups]
serial-integration = { max-threads = 1 }

# NOTE: We run integration tests in serial to avoid building any test
# environment infrastructure in parallel (which could result in a deadlock)
[[profile.default.overrides]]
filter = 'test(/^.*integration_tests::/)'
test-group = 'serial-integration'

# The profile `test:e2e` runs the tonk-ui real-browser suite under, from
# the prebuilt `tests-e2e` archive.
[profile.e2e]
# Every test stands up its own access service + Caddy + Chrome; two at
# once fight over the machine, so the whole suite stays serialized.
test-threads = 1
# Report every failure: a fail-fast pass over an hour-long suite hides
# everything after the first broken test.
fail-fast = false
# The #852 quarantine is drained: every account flow it named is
# repaired and back in the suite. To quarantine a newly broken test,
# add a `default-filter` here excluding it, with a linked issue.
