[test-groups]
serial-integration = { max-threads = 1 }

# NOTE: We run integration tests in serial to avoid building any test
# environment infrastructure in parallel (which could result in a deadlock)
[[profile.default.overrides]]
filter = 'test(/^.*integration_tests::/)'
test-group = 'serial-integration'

# A test that edits through real focus runs alone. The pooled runner opens
# one tab per test in a shared browser, and a tab opened beside it takes
# focus, which blurs the edit and drops the focus events it relies on.
[[profile.default.overrides]]
filter = 'package(tonk-display) & test(=registry::tests::it_commits_on_enter_and_restores_on_escape_from_the_library)'
threads-required = "num-test-threads"

# The profile `test:e2e` runs the tonk-ui real-browser suite under, from
# the prebuilt `tests-e2e` archive.
[profile.e2e]
# Every test stands up its own access service + Caddy + Chrome; two at
# once fight over the machine, so the whole suite stays serialized.
test-threads = 1
# Report every failure: a fail-fast pass over an hour-long suite hides
# everything after the first broken test.
fail-fast = false
# Each test drives a real Caddy + Chrome + wasm stack, and a shared CI
# runner is 2-3x slower than the hand-rolled deadlines in these tests
# assume: the same commit has passed every shard in one run and failed
# three in another, tripping a different deadline each time. Retry the
# flakes rather than widen forty scattered budgets by guesswork. This
# disables nothing — a test that fails all three attempts still fails
# the run — and the durable fix is to make the ceremonies faster or to
# give the deadlines one scalable knob.
retries = 2
# Make a retry-pass VISIBLE. A test that failed twice and passed on the
# third attempt is reported `FLAKY`, but with the default status level
# the run's summary reads like any other green one — which is how a
# deterministic regression landed on staging: it failed all three
# attempts on the merge commit and had passed on its PR run, and nobody
# had a reason to look at the difference. `flaky` here lists every test
# that needed a retry in the final summary, so "green with three flakes"
# stops looking like "green".
final-status-level = "flaky"
# The #852 quarantine is drained: every account flow it named is
# repaired and back in the suite. To quarantine a newly broken test,
# add a `default-filter` here excluding it, with a linked issue.

# Release candidates run once against the selected artifact paths. Keep the
# ordinary PR retry policy above; a release must not hide a flaky pass.
[profile.release-gate]
inherits = "e2e"
retries = 0

[profile.release-gate.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = false
