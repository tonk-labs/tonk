[workspace]
resolver = "2"
members = [
  "rust/dialog-reactor",
  "rust/tonk-access-service",
  "rust/tonk-account",
  "rust/tonk-analytics",
  "rust/tonk-analyzer",
  "rust/tonk-board",
  "rust/tonk-cli",
  "rust/tonk-code",
  "rust/tonk-common",
  "rust/tonk-core",
  "rust/tonk-display",
  "rust/tonk-email",
  "rust/tonk-evaluator",
  "rust/tonk-fab",
  "rust/tonk-guest",
  "rust/tonk-host",
  "rust/tonk-identity",
  "rust/tonk-inspector",
  "rust/tonk-invite",
  "rust/tonk-language-server",
  "rust/tonk-macros",
  "rust/tonk-notation",
  "rust/tonk-perf",
  "rust/tonk-portal",
  "rust/tonk-prose",
  "rust/tonk-render",
  "rust/tonk-router",
  "rust/tonk-schema",
  "rust/tonk-sigil",
  "rust/tonk-table",
  "rust/tonk-template",
  "rust/tonk-tree",
  "rust/tonk-ui",
  "rust/tonk-worker",
  "rust/tonk-worker-api",
  "rust/tonk-workspace",
