[workspace]
resolver = "2"
members = [
  "rust/carry",
  # Temporarily excluded during dialog-db migration (steps 2-3)
  # "rust/tonk-access-service",
  # "rust/tonk-assess",
  # "rust/tonk-common",
  # "rust/tonk-space",
  # "rust/tonk-ui",
  # "rust/tonk-worker",
]

[workspace.package]
version = "0.1.0"
authors = ["Tonk Labs"]
edition = "2024"
license = "MIT"

[workspace.dependencies]
carry = { path = "./rust/carry" }
tonk-access-service = { path = "./rust/tonk-access-service" }
tonk-common = { path = "./rust/tonk-common" }
tonk-core = { path = "./rust/tonk-core" }
tonk-ui = { path = "./rust/tonk-ui" }
tonk-worker = { path = "./rust/tonk-worker" }
tonk-assess = { path = "./rust/tonk-assess" }

# Common
anyhow = "1"
blake3 = "1.5"
bs58 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
dirs = "5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures-util = "0.3"
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
tokio = "1"
tokio-util = { version = "0.7", features = ["io"] }
walkdir = "2"

# Dialog DB
dialog-artifacts = { git = "https://github.com/dialog-db/dialog-db.git", rev = "2be1d1a" }
dialog-capability = { git = "https://github.com/dialog-db/dialog-db.git", rev = "2be1d1a" }
dialog-credentials = { git = "https://github.com/dialog-db/dialog-db.git", rev = "2be1d1a" }
dialog-query = { git = "https://github.com/dialog-db/dialog-db.git", rev = "2be1d1a" }
dialog-repository = { git = "https://github.com/dialog-db/dialog-db.git", rev = "2be1d1a" }
dialog-storage = { git = "https://github.com/dialog-db/dialog-db.git", rev = "2be1d1a" }
dialog-ucan = { git = "https://github.com/dialog-db/dialog-db.git", rev = "2be1d1a" }
dialog-varsig = { git = "https://github.com/dialog-db/dialog-db.git", rev = "2be1d1a" }

[profile.dev]
opt-level = 1
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
