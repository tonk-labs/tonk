[workspace]

members = [
    "rust/tonk-access-service",
    "rust/tonk-core",
    "rust/tonk-common",
    "rust/tonk-space",
    "rust/tonk-ui",
    "rust/tonk-worker",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Tonk Labs"]
license = "MIT"
edition = "2024"

[workspace.dependencies]
tonk-common = { path = "./rust/tonk-common" }
tonk-core = { path = "./rust/tonk-core" }
tonk-space = { path = "./rust/tonk-space" }
tonk-ui = { path = "./rust/tonk-ui" }
tonk-worker = { path = "./rust/tonk-worker" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
axum-wasm-macros = "0.1"
base58 = "0.2"
base64 = "0.22"
blake3 = "1.5"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "wasmbind",
] }
clap = { version = "4", features = ["derive"] }
console_error_panic_hook = "0.1"
dirs = "5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
getrandom_0_2 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
hex = "0.4"
hkdf = "0.12"
ipld-core = { version = "0.4", features = ["serde"] }
leptos = "0.8"
leptos-use = "0.17"
leptos_router = "0.8"
port_check = "0.3"
rand = "0.9"
rand_0_8 = { package = "rand", version = "0.8" }
rand_core = "0.9"
reqwest = "0.13"
serde = "1"
serde_bytes = "0.11"
serde_json = "1"
serde_ipld_dagcbor = "0.6"
sha2 = "0.11.0-rc.3"
sha2_0_10 = { package = "sha2", version = "0.10" }
tempfile = "3"
thirtyfour = "0.36"
thiserror = "2"
tokio = "1"
tower = "0.5"
tower-service = "0.3"
hyper = "1"
hyper-util = "0.1"
bytes = "1"
http-body-util = "0.1"
url = "2"
wasm-streams = "0.4"
web-time = "1"
worker = "0.7.4"
worker-macros = "0.7.4"

# Bindgen
wasm-bindgen = "=0.2.108"
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3" }

# Dialog DB
dialog-storage = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/generic-replica" }
dialog-query = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/generic-replica" }
dialog-artifacts = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/generic-replica" }
dialog-common = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/generic-replica" }
dialog-capability = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/generic-replica" }
dialog-s3-credentials = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/generic-replica", features = ["ucan"] }

# UCAN (using local path for development)
ucan = { git = "https://github.com/tonk-labs/rs-ucan.git", branch = "tonk", package = "ucan" }
varsig = { git = "https://github.com/tonk-labs/rs-ucan.git", branch = "tonk", package = "varsig" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
opt-level = "s"
debug = 0
inherits = "release"
strip = "debuginfo"

