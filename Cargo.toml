[workspace]

members = [
    "rust/tonk-access-service",
    "rust/tonk-analyzer",
    "rust/tonk-board",
    "rust/tonk-code",
    "rust/tonk-common",
    "rust/tonk-core",
    "rust/tonk-display",
    "rust/tonk-evaluator",
    "rust/tonk-host",
    "rust/tonk-invite",
    "rust/tonk-language-server",
    "rust/tonk-macros",
    "rust/tonk-notation",
    "rust/tonk-portal",
    "rust/slide",
    "rust/tonk-schema",
    "rust/tonk-sigil",
    "rust/tonk-ui",
    "rust/tonk-worker",
    "rust/tonk-workspace",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Tonk Labs"]
license = "MIT"
edition = "2024"

[workspace.dependencies]
tonk-access-service = { path = "./rust/tonk-access-service" }
tonk-analyzer = { path = "./rust/tonk-analyzer" }
tonk-board = { path = "./rust/tonk-board" }
tonk-code = { path = "./rust/tonk-code" }
tonk-common = { path = "./rust/tonk-common" }
tonk-core = { path = "./rust/tonk-core" }
tonk-display = { path = "./rust/tonk-display" }
tonk-evaluator = { path = "./rust/tonk-evaluator" }
tonk-host = { path = "./rust/tonk-host" }
tonk-invite = { path = "./rust/tonk-invite" }
tonk-language-server = { path = "./rust/tonk-language-server" }
tonk-macros = { path = "./rust/tonk-macros" }
tonk-notation = { path = "./rust/tonk-notation" }
tonk-portal = { path = "./rust/tonk-portal" }
tonk-schema = { path = "./rust/tonk-schema" }
tonk-sigil = { path = "./rust/tonk-sigil" }
tonk-ui = { path = "./rust/tonk-ui" }
tonk-worker = { path = "./rust/tonk-worker" }
tonk-workspace = { path = "./rust/tonk-workspace" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
axum-wasm-macros = "0.1"
base58 = "0.2"
base64 = "0.22"
blake3 = "1.5"
bs58 = "0.5"
ciborium = "0.2"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "wasmbind",
] }
clap = { version = "4", features = ["derive"] }
console_error_panic_hook = "0.1"
custom-elements = "0.2"
crypto-common = "=0.2.0-rc.5"
dialoguer = "0.11"
digest = "=0.11.0-rc.4"
dirs = "5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
getrandom_0_2 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_0_3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
hex = "0.4"
hkdf = "0.12"
idb = "0.6"
ipld-core = { version = "0.4", features = ["serde"] }
keyring = "3.6"
leptos = "0.8"
leptos-use = "0.17"
leptos_router = "0.8"
lsp-types = "0.97"
saphyr = "0.0.6"
saphyr-parser = "0.0.6"
parking_lot = "0.12"
port_check = "0.3"
rand = "0.9"
rand_0_8 = { package = "rand", version = "0.8" }
rand_core = "0.9"
reqwest = "0.13"
serde = "1"
serde_bytes = "0.11"
serde_json = "1"
serde_yaml = "0.9"
serde_ipld_dagcbor = "0.6"
serde_ipld_dagjson = "0.2"
sha2_0_10 = { package = "sha2", version = "0.10" }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
tempfile = "3"
thirtyfour = "0.36"
thiserror = "2"
tokio = "1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-service = "0.3"
hyper = "1"
hyper-util = "0.1"
bytes = "1"
http-body-util = "0.1"
indexmap = { version = "2", features = ["serde"] }
serde-wasm-bindgen = "0.6"
url = "2"
ulid = "1"
wasm-streams = "0.4"
web-time = "1"
webbrowser = "1.0"
worker = "0.7.4"
worker-macros = "0.7.4"
serial_test = "3"

# Bindgen
wasm-bindgen = "=0.2.108"
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
send_wrapper = "0.6"
web-sys = { version = "0.3" }

# Dialog DB
dialog-artifacts = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/switch-to-search-tree" }
dialog-capability = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/switch-to-search-tree" }
dialog-common = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/switch-to-search-tree" }
dialog-credentials = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/switch-to-search-tree" }
dialog-effects = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/switch-to-search-tree" }
dialog-operator = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/switch-to-search-tree" }
dialog-query = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/switch-to-search-tree" }
dialog-remote-s3 = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/switch-to-search-tree" }
dialog-remote-ucan-s3 = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/switch-to-search-tree" }
dialog-repository = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/switch-to-search-tree" }
dialog-storage = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/switch-to-search-tree" }
dialog-ucan = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/switch-to-search-tree" }
dialog-ucan-core = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/switch-to-search-tree" }
dialog-varsig = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/switch-to-search-tree" }

[profile.dev]
opt-level = 1
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release]
opt-level = "s"
debug = 0
inherits = "release"
strip = "debuginfo"

