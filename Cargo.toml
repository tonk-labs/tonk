[workspace]

members = [
    "rust/tonk-access-service",
    "rust/tonk-analytics",
    "rust/tonk-analyzer",
    "rust/tonk-board",
    "rust/tonk-code",
    "rust/tonk-tree",
    "rust/tonk-common",
    "rust/tonk-core",
    "rust/dialog-reactor",
    "rust/tonk-display",
    "rust/tonk-evaluator",
    "rust/tonk-guest",
    "rust/tonk-host",
    "rust/tonk-invite",
    "rust/tonk-inspector",
    "rust/tonk-language-server",
    "rust/tonk-macros",
    "rust/tonk-notation",
    "rust/tonk-fab",
    "rust/tonk-portal",
    "rust/tonk-render",
    "rust/tonk-router",
    "rust/tonk-template",
    "rust/tonk-cli",
    "rust/tonk-schema",
    "rust/tonk-sigil",
    "rust/tonk-ui",
    "rust/tonk-worker",
    "rust/tonk-workspace",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Tonk Labs"]
