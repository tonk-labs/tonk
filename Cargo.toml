[workspace]
resolver = "2"
members = [
  "rust/carry",
  "rust/carry-telemetry-service",
  "rust/tonk-access-service",
  "rust/tonk-assess",
]

[workspace.package]
version = "0.2.0"
authors = ["Tonk Labs"]
edition = "2024"
license = "MIT"

[workspace.dependencies]
carry = { path = "./rust/carry" }
carry-telemetry-service = { path = "./rust/carry-telemetry-service" }
tonk-access-service = { path = "./rust/tonk-access-service" }
tonk-assess = { path = "./rust/tonk-assess" }

# Common
anyhow = "1"
base64 = "0.22"
blake3 = "1.5"
bs58 = "0.5"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
dirs = "5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures-util = "0.3"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = "0.1"
open = "5"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls"
] }
serde = "1"
serde_ipld_dagcbor = "0.6"
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-util = { version = "0.7", features = ["io"] }
walkdir = "2"
worker = "0.7.4"
worker-macros = "0.7.4"

# Dialog DB
dialog-artifacts = { git = "https://github.com/dialog-db/dialog-db.git", rev = "ab6f1a083371c7b98e7c41f018b560c4a1434c36" }
dialog-capability = { git = "https://github.com/dialog-db/dialog-db.git", rev = "ab6f1a083371c7b98e7c41f018b560c4a1434c36" }
dialog-capability-ucan = { git = "https://github.com/dialog-db/dialog-db.git", rev = "ab6f1a083371c7b98e7c41f018b560c4a1434c36" }
dialog-common = { git = "https://github.com/dialog-db/dialog-db.git", rev = "ab6f1a083371c7b98e7c41f018b560c4a1434c36" }
dialog-credentials = { git = "https://github.com/dialog-db/dialog-db.git", rev = "ab6f1a083371c7b98e7c41f018b560c4a1434c36" }
dialog-query = { git = "https://github.com/dialog-db/dialog-db.git", rev = "ab6f1a083371c7b98e7c41f018b560c4a1434c36" }
dialog-remote-s3 = { git = "https://github.com/dialog-db/dialog-db.git", rev = "ab6f1a083371c7b98e7c41f018b560c4a1434c36" }
dialog-remote-ucan-s3 = { git = "https://github.com/dialog-db/dialog-db.git", rev = "ab6f1a083371c7b98e7c41f018b560c4a1434c36" }
dialog-repository = { git = "https://github.com/dialog-db/dialog-db.git", rev = "ab6f1a083371c7b98e7c41f018b560c4a1434c36" }
dialog-storage = { git = "https://github.com/dialog-db/dialog-db.git", rev = "ab6f1a083371c7b98e7c41f018b560c4a1434c36" }
dialog-ucan = { git = "https://github.com/dialog-db/dialog-db.git", rev = "ab6f1a083371c7b98e7c41f018b560c4a1434c36" }
dialog-varsig = { git = "https://github.com/dialog-db/dialog-db.git", rev = "ab6f1a083371c7b98e7c41f018b560c4a1434c36" }

[profile.dev]
opt-level = 1
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
