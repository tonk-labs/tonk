[workspace]
members = [
    "rust/tonk-access-service",
    "rust/tonk-core",
    "rust/tonk-common",
    "rust/tonk-space",
    "rust/tonk-ui",
    "rust/tonk-worker",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Tonk Labs"]
license = "MIT"
edition = "2024"

[workspace.dependencies]
tonk-common = { path = "./rust/tonk-common" }
tonk-core = { path = "./rust/tonk-core" }
tonk-space = { path = "./rust/tonk-space" }
tonk-ui = { path = "./rust/tonk-ui" }
tonk-worker = { path = "./rust/tonk-worker" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
axum-wasm-macros = "0.1"
console_error_panic_hook = "0.1"
futures-util = "0.3"
getrandom = "0.3"
leptos = "0.8"
leptos-use = "0.17"
leptos_router = "0.8"
port_check = "0.3"
rand = "0.9"
rand_core = "0.9"
reqwest = "0.13"
serde = "1"
serde_json = "1"
thirtyfour = "0.36"
thiserror = "2"
tokio = "1"
tower-service = "0.3"
url = "2"
wasm-streams = "0.4"
web-time = "1"

# Bindgen
wasm-bindgen = "=0.2.100"
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3" }

# Dialog DB
dialog-storage = { git = "https://github.com/dialog-db/dialog-db.git", branch = "tonk-rewire" }
dialog-query = { git = "https://github.com/dialog-db/dialog-db.git", branch = "tonk-rewire" }
dialog-artifacts = { git = "https://github.com/dialog-db/dialog-db.git", branch = "tonk-rewire" }
dialog-common = { git = "https://github.com/dialog-db/dialog-db.git", branch = "tonk-rewire" }
dialog-s3-credentials = { git = "https://github.com/dialog-db/dialog-db.git", branch = "feat/s3-presign-crate" }

# UCAN
ucan = { git = "https://github.com/tonk-labs/rs-ucan.git", branch = "jackddouglas/feat/check", package = "ucan" }
varsig = { git = "https://github.com/tonk-labs/rs-ucan.git", branch = "jackddouglas/feat/check", package = "varsig" }


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
opt-level = "s"
debug = 0
inherits = "release"
strip = "debuginfo"
