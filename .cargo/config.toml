[env]
WASM_BINDGEN_TEST_TIMEOUT = "60"

[target.wasm32-unknown-unknown]
# The Nix development and CI shells provide this native runner on PATH. It
# keeps one browser alive while retaining a fresh origin for every test.
runner = "wbg-pool"
rustflags = [
  "--cfg",
  'getrandom_backend="wasm_js"',
  "--cfg",
  "web_sys_unstable_apis"
]

