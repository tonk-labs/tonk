name = "tonk-access-service-bench"
main = "../result/tonk-access-service/worker/shim.mjs"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../rust/tonk-ui/dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tonk-spaces-bench"

[vars]
R2_ACCOUNT_ID = "bench-local"
R2_BUCKET_NAME = "tonk-spaces-bench"
