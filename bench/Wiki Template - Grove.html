document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"c36e768e-97b6-490a-ad6e-0435cf77f61a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"87f15239-4b4c-4104-a441-3b51e8e17973\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"1501ffa8-807d-4cda-88a6-1d1aa372ccc0\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"d43126b1-476b-4ccf-b98a-102b6ddf54b4\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"671457f3-7fcb-4045-b880-ff339f1cfcbc\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"43c06535-3a33-4b96-979a-8287bc063122\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6ed8c4e4-bf05-4116-a2de-88dca0bc9078\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"701c1a18-00ed-45e6-a003-de1b63c306c1\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c14ba93a-1194-42ba-abf8-017b1c146784\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7a4b5d1f-5d74-4eeb-ac23-9806f319500a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"bd375151-c183-4843-85ed-4bfef7e220d7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* =============================================================================\n   GOOEY LOW-FI · COLOR TOKENS\n   -----------------------------------------------------------------------------\n   TWO COLORS ONLY. One blue (the hue of #3f74f0) rendered in many shades for\n   every surface, ink, line, accent, and status — plus one orange, used only for\n   destructive actions and error/failure states. Every surface token is paired with a `-foreground` for the text\n   that sits on it; use them together and contrast holds in light and dark.\n\n   Dark mode (`class=\"dark\"` on <html> or <body>) is deep navy, never near-black.\n============================================================================= */\n\n:root {\n  color-scheme: light;\n\n  /* surfaces + their paired text ------------------------------------------- */\n  --background:             #e8effb;   /* light-blue paper (the app canvas)     */\n  --foreground:             #16223d;   /* deep-blue ink                         */\n\n  --card:                   #f7faff;   /* lightest blue, lifts off the canvas   */\n  --card-foreground:        #16223d;\n\n  --popover:                #f7faff;   /* menus, tooltips, dialogs              */\n  --popover-foreground:     #16223d;\n\n  --primary:                #3f74f0;   /* THE blue — actions, emphasis          */\n  --primary-foreground:     #ffffff;\n\n  --secondary:              #dfe8fb;   /* soft blue fill                        */\n  --secondary-foreground:   #1d3370;\n\n  --muted:                  #e5edfb;   /* muted background + secondary text     */\n  --muted-foreground:       #5a6ea2;\n\n  --accent:                 #d6e2fb;   /* hover wash                            */\n  --accent-foreground:      #1d3370;\n\n  --destructive:            #db6a23;   /* ORANGE — the only non-blue            */\n  --destructive-foreground: #ffffff;\n\n  /* status — all blue in low-fi; the shape/icon carries the meaning ---------- */\n  --success:                #3f74f0;\n  --success-foreground:     #ffffff;\n  --warning:                #3f74f0;\n  --warning-foreground:     #ffffff;\n  --info:                   #3f74f0;\n  --info-foreground:        #ffffff;\n\n  /* lines ------------------------------------------------------------------- */\n  --border:                 #a6bbe8;   /* hairlines                            */\n  --input:                  #a6bbe8;   /* control borders                      */\n  --ring:                   #3f74f0;   /* focus ring                           */\n\n  --overlay:                rgb(13 22 48 / 0.34);   /* modal scrim             */\n}\n\n/* =============================================================================\n   DARK · deep navy. Same two colors: blue + orange destructive.\n============================================================================= */\n.dark {\n  color-scheme: dark;\n\n  --background:             #0a1530;   /* deep navy                             */\n  --foreground:             #e6eefc;\n\n  --card:                   #0e1c3a;\n  --card-foreground:        #e6eefc;\n\n  --popover:                #122444;\n  --popover-foreground:     #e6eefc;\n\n  --primary:                #5b8cff;\n  --primary-foreground:     #081027;\n\n  --secondary:              #17284b;\n  --secondary-foreground:   #e6eefc;\n\n  --muted:                  #17284b;\n  --muted-foreground:       #93a6cf;\n\n  --accent:                 #17284b;\n  --accent-foreground:      #e6eefc;\n\n  --destructive:            #f0913f;   /* ORANGE — the only non-blue            */\n  --destructive-foreground: #1a0f02;\n\n  --success:                #5b8cff;\n  --success-foreground:     #081027;\n  --warning:                #5b8cff;\n  --warning-foreground:     #081027;\n  --info:                   #5b8cff;\n  --info-foreground:        #081027;\n\n  --border:                 #2c3f66;\n  --input:                  #2c3f66;\n  --ring:                   #5b8cff;\n\n  --overlay:                rgb(0 0 0 / 0.6);\n}\n<\u002Fstyle>\n  <style>/* =============================================================================\n   GOOEY LOW-FI · TYPOGRAPHY TOKENS\n   -----------------------------------------------------------------------------\n   IBM Plex Mono at every role — sans, heading, and mono all resolve to the same\n   monospace family. The body sits at a tight 13px; the scale climbs from 11px\n   captions to a 36px display. Tracking is 0 almost everywhere (mono is already\n   wide); only the uppercase eyebrow opens up to 0.04em.\n============================================================================= */\n\n:root {\n  /* families — all one mono face */\n  --font-sans:    \"IBM Plex Mono\", ui-monospace, Menlo, Monaco, \"Source Code Pro\", monospace;\n  --font-heading: var(--font-sans);\n  --font-mono:    var(--font-sans);\n\n  /* size scale (13px body) */\n  --text-xs:   11px;\n  --text-sm:   13px;\n  --text-base: 13px;\n  --text-md:   16px;\n  --text-lg:   18px;\n  --text-xl:   22px;\n  --text-2xl:  27px;\n  --text-3xl:  36px;\n\n  /* line height */\n  --leading-tight:   1.2;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* letter spacing — mono is wide already, so keep it at 0 except the eyebrow */\n  --tracking-tight:  0;\n  --tracking-normal: 0;\n  --tracking-wide:   0.04em;\n\n  /* weight */\n  --weight-normal:   400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n}\n<\u002Fstyle>\n  <style>/* =============================================================================\n   GOOEY LOW-FI · SPACE, RADIUS, LINES, CONTROLS, ELEVATION, MOTION\n   -----------------------------------------------------------------------------\n   One spacing scale drives every padding / gap / margin (roomy and airy).\n   Corners are hard 0 throughout — the blueprint look — with radius kept as a\n   token so the switch/radio can opt back into a curve. Elevation is mostly flat;\n   real shadow appears only on things that float (dialogs, raised cards, menus).\n============================================================================= */\n\n:root {\n  /* SPACE · one scale for padding / gap / margin (roomy) */\n  --space-0: 0;\n  --space-1: 2px;\n  --space-2: 4px;\n  --space-3: 8px;\n  --space-4: 12px;\n  --space-5: 18px;\n  --space-6: 26px;\n  --space-7: 36px;\n  --space-8: 52px;\n  --space-9: 72px;\n\n  /* RADIUS · none — hard corners are the whole look */\n  --radius:      0;\n  --radius-sm:   0;\n  --radius-md:   0;\n  --radius-lg:   0;\n  --radius-xl:   0;\n  --radius-full: 0;\n\n  /* LINE WEIGHT · thin + airy hairlines */\n  --line-weight:        1px;\n  --line-weight-strong: 1.5px;\n\n  /* CONTROL GEOMETRY · generous heights */\n  --control-height:    40px;\n  --control-height-sm: 34px;\n  --control-height-lg: 48px;\n  --control-pad-x:     16px;\n\n  /* ELEVATION · flat; soft lift only where it counts */\n  --shadow-xs: none;\n  --shadow-sm: none;\n  --shadow-md: 0 4px 16px rgb(23 32 60 / 0.10);\n  --shadow-lg: 0 16px 40px rgb(23 32 60 / 0.16);\n\n  /* MOTION · standard, quick */\n  --duration:      150ms;                        /* @kind other */\n  --duration-slow: 300ms;                        /* @kind other */\n  --ease:          cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n\n  --ring-width: 2px;\n}\n<\u002Fstyle>\n  <style>/* =============================================================================\n   GOOEY · RESET\n   Minimal modern normalize. Part of the frozen component layer — never reskinned.\n============================================================================= */\n\n*, *::before, *::after { box-sizing: border-box; }\n\n* { margin: 0; }\n\nhtml { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\n\nbody {\n  min-height: 100vh;\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  color: var(--foreground);\n  background: var(--background);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nimg, picture, video, canvas, svg { display: block; max-width: 100%; }\n\ninput, button, textarea, select { font: inherit; color: inherit; }\n\nbutton { cursor: pointer; background: none; border: none; }\n\na { color: inherit; text-decoration: none; }\n\np, h1, h2, h3, h4, h5, h6 { overflow-wrap: break-word; }\n\nul, ol { list-style: none; padding: 0; }\n\ntable { border-collapse: collapse; width: 100%; }\n\n/* fallback focus for anything a component doesn't style itself */\n:where(:focus-visible) {\n  outline: var(--line-weight-strong) solid var(--ring);\n  outline-offset: 2px;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.001ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.001ms !important;\n  }\n}\n<\u002Fstyle>\n  <style>/* =============================================================================\n   GOOEY · LAYOUT UTILITIES\n   A deliberately tiny set — just enough to compose layouts without raw values.\n   Spacing is overridable per-instance via the local custom property, e.g.\n   style=\"--stack: var(--space-7)\".\n============================================================================= */\n\n.stack {\n  display: flex;\n  flex-direction: column;\n  gap: var(--stack, var(--space-5));\n}\n\n.cluster {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: var(--cluster, var(--space-4));\n}\n\n.row {\n  display: flex;\n  align-items: center;\n  gap: var(--row, var(--space-4));\n}\n\n.grow   { flex: 1 1 auto; }\n.shrink { flex: 0 0 auto; }\n\n.container {\n  width: 100%;\n  max-width: 960px;\n  margin-inline: auto;\n  padding-inline: var(--space-5);\n}\n\n.visually-hidden {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0 0 0 0);\n  white-space: nowrap;\n  border: 0;\n}\n<\u002Fstyle>\n  <style>/* =============================================================================\n   GOOEY · TYPOGRAPHY\n   Base text elements + semantic role classes. Reads only tokens.\n============================================================================= */\n\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading);\n  font-weight: var(--weight-semibold);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  color: var(--foreground);\n}\n\nh1 { font-size: var(--text-3xl); }\nh2 { font-size: var(--text-2xl); }\nh3 { font-size: var(--text-xl); }\nh4 { font-size: var(--text-lg); }\nh5 { font-size: var(--text-md); }\nh6 { font-size: var(--text-base); }\n\np { line-height: var(--leading-normal); }\n\nsmall { font-size: var(--text-sm); }\n\nstrong, b { font-weight: var(--weight-semibold); }\n\ncode, kbd, samp {\n  font-family: var(--font-mono);\n  font-size: 0.9em;\n}\n\ncode {\n  padding: 0.1em 0.35em;\n  background: var(--muted);\n  border-radius: var(--radius-sm);\n}\n\nblockquote {\n  padding-left: var(--space-5);\n  border-left: var(--line-weight-strong) solid var(--border);\n  color: var(--muted-foreground);\n}\n\n/* --- semantic role classes ------------------------------------------------- */\n.display    { font-family: var(--font-heading); font-size: var(--text-3xl); font-weight: var(--weight-bold);     line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); color: var(--foreground); }\n.title      { font-family: var(--font-heading); font-size: var(--text-2xl); font-weight: var(--weight-semibold); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); color: var(--foreground); }\n.heading    { font-family: var(--font-heading); font-size: var(--text-lg);  font-weight: var(--weight-semibold); line-height: var(--leading-tight); color: var(--foreground); }\n.subheading { font-family: var(--font-sans);    font-size: var(--text-md);  font-weight: var(--weight-medium);   line-height: var(--leading-normal); color: var(--muted-foreground); }\n.body       { font-family: var(--font-sans);    font-size: var(--text-base);font-weight: var(--weight-normal);   line-height: var(--leading-normal); color: var(--foreground); }\n.caption    { font-family: var(--font-sans);    font-size: var(--text-xs); font-weight: var(--weight-normal);    line-height: var(--leading-normal); color: var(--muted-foreground); }\n\n/* overline / eyebrow */\n.label-text {\n  font-family: var(--font-sans);\n  font-size: var(--text-xs);\n  font-weight: var(--weight-semibold);\n  letter-spacing: var(--tracking-wide);\n  text-transform: uppercase;\n  color: var(--muted-foreground);\n}\n\n/* --- text color utilities -------------------------------------------------- */\n.text-muted       { color: var(--muted-foreground); }\n.text-destructive { color: var(--destructive); }\n.text-success     { color: var(--success); }\n.text-warning     { color: var(--warning); }\n.text-info        { color: var(--info); }\n\n.mono { font-family: var(--font-mono); }\n<\u002Fstyle>\n  <style>/* =============================================================================\n   GOOEY · BUTTON\n   .btn + variant + optional size. Variants follow shadcn:\n   (bare/outline) · --primary · --secondary · --destructive · --ghost · --link\n============================================================================= */\n\n.btn {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--space-3);\n  height: var(--control-height);\n  padding: 0 var(--space-5);\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  font-weight: var(--weight-medium);\n  line-height: 1;\n  white-space: nowrap;\n  user-select: none;\n  color: var(--foreground);\n  background: var(--background);\n  border: var(--line-weight) solid var(--input);\n  border-radius: var(--radius-md);\n  box-shadow: var(--shadow-xs);\n  transition: background var(--duration) var(--ease),\n              border-color var(--duration) var(--ease),\n              color var(--duration) var(--ease),\n              box-shadow var(--duration) var(--ease);\n}\n\n.btn:hover { background: var(--accent); color: var(--accent-foreground); }\n\n.btn:focus-visible {\n  outline: none;\n  border-color: var(--ring);\n  box-shadow: 0 0 0 var(--ring-width) color-mix(in srgb, var(--ring) 50%, transparent);\n}\n\n/* --- variants -------------------------------------------------------------- */\n.btn--primary {\n  color: var(--primary-foreground);\n  background: var(--primary);\n  border-color: transparent;\n}\n.btn--primary:hover { background: color-mix(in srgb, var(--primary) 90%, var(--background)); color: var(--primary-foreground); }\n\n.btn--secondary {\n  color: var(--secondary-foreground);\n  background: var(--secondary);\n  border-color: transparent;\n}\n.btn--secondary:hover { background: color-mix(in srgb, var(--secondary) 92%, var(--foreground)); color: var(--secondary-foreground); }\n\n/* outline == the bare .btn default; provided as an explicit name */\n.btn--outline {\n  color: var(--foreground);\n  background: var(--background);\n  border-color: var(--input);\n}\n\n.btn--ghost {\n  color: var(--foreground);\n  background: transparent;\n  border-color: transparent;\n  box-shadow: none;\n}\n.btn--ghost:hover { color: var(--accent-foreground); background: var(--accent); }\n\n.btn--destructive {\n  color: var(--destructive-foreground);\n  background: var(--destructive);\n  border-color: transparent;\n}\n.btn--destructive:hover { background: color-mix(in srgb, var(--destructive) 88%, #000); color: var(--destructive-foreground); }\n\n.btn--link {\n  height: auto;\n  padding: 0;\n  color: var(--primary);\n  background: none;\n  border-color: transparent;\n  box-shadow: none;\n  text-decoration: underline;\n  text-underline-offset: 4px;\n}\n.btn--link:hover { background: none; color: var(--primary); }\n\n/* --- sizes ----------------------------------------------------------------- */\n.btn--sm { height: var(--control-height-sm); padding: 0 var(--space-4); font-size: var(--text-sm); }\n.btn--lg { height: var(--control-height-lg); padding: 0 var(--space-6); font-size: var(--text-md); }\n\n.btn--block { width: 100%; }\n\n.btn--icon { width: var(--control-height); padding: 0; }\n.btn--icon.btn--sm { width: var(--control-height-sm); }\n.btn--icon.btn--lg { width: var(--control-height-lg); }\n\n/* --- states ---------------------------------------------------------------- */\n.btn:disabled,\n.btn.is-disabled {\n  opacity: 0.5;\n  cursor: not-allowed;\n  pointer-events: none;\n}\n\n.btn.is-loading { color: transparent; pointer-events: none; }\n.btn.is-loading::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  margin: auto;\n  width: 1em;\n  height: 1em;\n  border-radius: 50%;\n  border: 2px solid color-mix(in srgb, var(--foreground) 30%, transparent);\n  border-top-color: var(--foreground);\n  animation: gooey-spin calc(var(--duration-slow) * 3) linear infinite;\n}\n\n/* per-variant spinner color — matches each variant's foreground (the label is\n   hidden while loading, so we can't lean on currentColor) */\n.btn--primary.is-loading::after {\n  border-color: color-mix(in srgb, var(--primary-foreground) 30%, transparent);\n  border-top-color: var(--primary-foreground);\n}\n.btn--destructive.is-loading::after {\n  border-color: color-mix(in srgb, var(--destructive-foreground) 30%, transparent);\n  border-top-color: var(--destructive-foreground);\n}\n<\u002Fstyle>\n  <style>/* =============================================================================\n   GOOEY · CARD\n   .card with optional __header / __body / __footer sections.\n============================================================================= */\n\n.card {\n  display: flex;\n  flex-direction: column;\n  color: var(--card-foreground);\n  background: var(--card);\n  border: var(--line-weight) solid var(--border);\n  border-radius: var(--radius-lg);\n  box-shadow: var(--shadow-xs);\n  overflow: hidden;\n}\n\n.card--raised { box-shadow: var(--shadow-md); }\n.card--flat   { box-shadow: none; }\n\n.card--interactive {\n  cursor: pointer;\n  transition: box-shadow var(--duration) var(--ease),\n              border-color var(--duration) var(--ease);\n}\n.card--interactive:hover { border-color: var(--ring); box-shadow: var(--shadow-md); }\n\n.card__header {\n  padding: var(--space-6);\n  border-bottom: var(--line-weight) solid var(--border);\n}\n\n.card__body {\n  padding: var(--space-6);\n  display: flex;\n  flex-direction: column;\n  gap: var(--space-4);\n}\n\n.card__footer {\n  padding: var(--space-6);\n  border-top: var(--line-weight) solid var(--border);\n  display: flex;\n  align-items: center;\n  gap: var(--space-3);\n}\n<\u002Fstyle>\n  <style>/* =============================================================================\n   GOOEY · BADGE\n   shadcn variants: (default = primary) · --secondary · --destructive · --outline\n   plus status extensions: --success / --warning / --info\n============================================================================= */\n\n.badge {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--space-2);\n  padding: var(--space-1) var(--space-3);\n  font-family: var(--font-sans);\n  font-size: var(--text-xs);\n  font-weight: var(--weight-medium);\n  line-height: 1.4;\n  white-space: nowrap;\n  border: var(--line-weight) solid transparent;\n  border-radius: var(--radius-md);\n  /* default = primary */\n  color: var(--primary-foreground);\n  background: var(--primary);\n}\n\n.badge--pill { border-radius: var(--radius-full); }\n\n.badge__dot {\n  width: var(--space-2);\n  height: var(--space-2);\n  border-radius: 50%;\n  background: currentColor;\n}\n\n.badge--secondary   { color: var(--secondary-foreground);   background: var(--secondary); }\n.badge--destructive { color: var(--destructive-foreground); background: var(--destructive); }\n.badge--success     { color: var(--success-foreground);     background: var(--success); }\n.badge--warning     { color: var(--warning-foreground);     background: var(--warning); }\n.badge--info        { color: var(--info-foreground);        background: var(--info); }\n\n.badge--outline {\n  color: var(--foreground);\n  background: transparent;\n  border-color: var(--border);\n}\n<\u002Fstyle>\n  <style>/* =============================================================================\n   GOOEY · DIVIDER\n   Aligns to the --line-weight primitive. Use <hr class=\"divider\"> or a div.\n============================================================================= */\n\n.divider {\n  border: none;\n  height: var(--line-weight);\n  background: var(--border);\n  margin: var(--space-5) 0;\n}\n\n.divider--strong { background: color-mix(in srgb, var(--foreground) 20%, var(--border)); }\n\n.divider--vertical {\n  width: var(--line-weight);\n  height: auto;\n  align-self: stretch;\n  min-height: 1em;\n  margin: 0 var(--space-4);\n}\n\n/* labeled divider: <div class=\"divider-label\"><span>OR<\u002Fspan><\u002Fdiv> */\n.divider-label {\n  display: flex;\n  align-items: center;\n  gap: var(--space-4);\n  margin: var(--space-5) 0;\n  color: var(--muted-foreground);\n  font-size: var(--text-xs);\n  letter-spacing: var(--tracking-wide);\n  text-transform: uppercase;\n}\n.divider-label::before,\n.divider-label::after {\n  content: \"\";\n  flex: 1;\n  height: var(--line-weight);\n  background: var(--border);\n}\n<\u002Fstyle>\n  <style>/* =============================================================================\n   GOOEY · FORMS\n   Field wrapper + inputs, textarea, select, checkbox, radio, switch.\n   Custom controls use appearance:none so every preset owns their look.\n============================================================================= */\n\n/* --- field scaffolding ----------------------------------------------------- */\n.field {\n  display: flex;\n  flex-direction: column;\n  gap: var(--space-2);\n}\n\n.label {\n  font-size: var(--text-sm);\n  font-weight: var(--weight-medium);\n  color: var(--foreground);\n}\n.label .req { color: var(--destructive); margin-left: var(--space-1); }\n\n.help { font-size: var(--text-xs); color: var(--muted-foreground); }\n\n/* --- text inputs ----------------------------------------------------------- */\n.input,\n.textarea,\n.select {\n  width: 100%;\n  min-height: var(--control-height);\n  padding: 0 var(--control-pad-x);\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  color: var(--foreground);\n  background: var(--background);\n  border: var(--line-weight) solid var(--input);\n  border-radius: var(--radius-md);\n  box-shadow: var(--shadow-xs);\n  transition: border-color var(--duration) var(--ease),\n              box-shadow var(--duration) var(--ease);\n}\n\n.textarea {\n  padding: var(--space-3) var(--control-pad-x);\n  min-height: calc(var(--control-height) * 2.4);\n  line-height: var(--leading-normal);\n  resize: vertical;\n}\n\n.input::placeholder,\n.textarea::placeholder { color: var(--muted-foreground); }\n\n.input:focus,\n.textarea:focus,\n.select:focus {\n  outline: none;\n  border-color: var(--ring);\n  box-shadow: 0 0 0 var(--ring-width) color-mix(in srgb, var(--ring) 50%, transparent);\n}\n\n.input:disabled,\n.textarea:disabled,\n.select:disabled {\n  opacity: 0.5;\n  cursor: not-allowed;\n}\n\n.input--sm { min-height: var(--control-height-sm); font-size: var(--text-sm); }\n.input--lg { min-height: var(--control-height-lg); font-size: var(--text-md); }\n\n/* --- select (token-colored caret, no wrapper needed) ----------------------- */\n.select {\n  appearance: none;\n  -webkit-appearance: none;\n  padding-right: var(--space-7);\n  background-image:\n    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),\n    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);\n  background-position: right 16px top 50%, right 11px top 50%;\n  background-size: 5px 5px, 5px 5px;\n  background-repeat: no-repeat;\n}\n\n/* --- checkbox & radio ------------------------------------------------------ */\n.checkbox,\n.radio {\n  appearance: none;\n  -webkit-appearance: none;\n  flex-shrink: 0;\n  width: 16px;\n  height: 16px;\n  display: inline-grid;\n  place-content: center;\n  background: var(--background);\n  border: var(--line-weight) solid var(--input);\n  border-radius: var(--radius-sm);\n  box-shadow: var(--shadow-xs);\n  cursor: pointer;\n  transition: background var(--duration) var(--ease),\n              border-color var(--duration) var(--ease);\n}\n.radio { border-radius: var(--radius-full); }\n\n.checkbox:checked,\n.radio:checked { background: var(--primary); border-color: var(--primary); }\n\n.checkbox:focus-visible,\n.radio:focus-visible,\n.switch:focus-visible {\n  outline: none;\n  border-color: var(--ring);\n  box-shadow: 0 0 0 var(--ring-width) color-mix(in srgb, var(--ring) 50%, transparent);\n}\n\n.checkbox::before {\n  content: \"\";\n  width: 10px;\n  height: 10px;\n  transform: scale(0);\n  transition: transform var(--duration) var(--ease);\n  background: var(--primary-foreground);\n  clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);\n}\n.checkbox:checked::before { transform: scale(1); }\n\n.radio::before {\n  content: \"\";\n  width: 50%;\n  height: 50%;\n  border-radius: 50%;\n  background: var(--primary-foreground);\n  transform: scale(0);\n  transition: transform var(--duration) var(--ease);\n}\n.radio:checked::before { transform: scale(1); }\n\n/* --- switch ---------------------------------------------------------------- */\n/* Size is driven by two custom properties so the track, thumb, and travel scale\n   together — resize a switch by overriding --switch-w / --switch-h (not width /\n   height), e.g. an enlarged specimen. */\n.switch {\n  --switch-w: 36px;\n  --switch-h: 20px;\n  appearance: none;\n  -webkit-appearance: none;\n  position: relative;\n  flex-shrink: 0;\n  width: var(--switch-w);\n  height: var(--switch-h);\n  background: var(--input);\n  border-radius: var(--radius-full);\n  cursor: pointer;\n  transition: background var(--duration) var(--ease);\n}\n.switch::before {\n  content: \"\";\n  position: absolute;\n  top: 2px;\n  left: 2px;\n  width: calc(var(--switch-h) - 4px);\n  height: calc(var(--switch-h) - 4px);\n  /* thumb is dark-on-light when off, light-on-dark when on — stays visible\n     in both color schemes (see :checked override) */\n  background: var(--foreground);\n  border-radius: 50%;\n  box-shadow: var(--shadow-sm);\n  transition: transform var(--duration) var(--ease),\n              background var(--duration) var(--ease);\n}\n.switch:checked { background: var(--primary); }\n.switch:checked::before { transform: translateX(calc(var(--switch-w) - var(--switch-h))); background: var(--primary-foreground); }\n\n/* --- a control sitting beside its label ------------------------------------ */\n.choice {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--space-3);\n  cursor: pointer;\n  font-size: var(--text-base);\n}\n\n/* --- error state ----------------------------------------------------------- */\n.field--error .input,\n.field--error .textarea,\n.field--error .select { border-color: var(--destructive); }\n.field--error .input:focus,\n.field--error .textarea:focus,\n.field--error .select:focus {\n  border-color: var(--destructive);\n  box-shadow: 0 0 0 var(--ring-width) color-mix(in srgb, var(--destructive) 40%, transparent);\n}\n.field--error .help { color: var(--destructive); }\n<\u002Fstyle>\n  <style>/* =============================================================================\n   GOOEY · TABLE\n   Wrap in .table-wrap for a bordered, horizontally-scrollable container.\n============================================================================= */\n\n.table-wrap {\n  width: 100%;\n  overflow-x: auto;\n  border: var(--line-weight) solid var(--border);\n  border-radius: var(--radius-lg);\n}\n\n.table {\n  width: 100%;\n  border-collapse: collapse;\n  font-size: var(--text-sm);\n  color: var(--foreground);\n}\n\n.table caption {\n  padding: var(--space-3) var(--space-4);\n  text-align: left;\n  font-size: var(--text-xs);\n  color: var(--muted-foreground);\n}\n\n.table th {\n  height: var(--control-height);\n  padding: var(--space-2) var(--space-4);\n  text-align: left;\n  font-weight: var(--weight-medium);\n  white-space: nowrap;\n  color: var(--muted-foreground);\n  border-bottom: var(--line-weight) solid var(--border);\n}\n\n.table td {\n  padding: var(--space-3) var(--space-4);\n  border-bottom: var(--line-weight) solid var(--border);\n}\n\n.table tbody tr:last-child td { border-bottom: none; }\n.table tbody tr:hover { background: var(--muted); }\n\n.table--striped tbody tr:nth-child(even) { background: var(--muted); }\n\n/* numeric columns: add class=\"num\" to th/td */\n.table .num { text-align: right; font-variant-numeric: tabular-nums; }\n<\u002Fstyle>\n  <style>/* =============================================================================\n   GOOEY · NAVIGATION\n   Two primitives that compose into navbars, sidebars, and dropdowns:\n     .nav   — horizontal row of links/tabs (set .is-active on the current one)\n     .menu  — vertical list surface (dropdown menus, sidebars, command lists)\n============================================================================= */\n\n/* --- horizontal nav -------------------------------------------------------- */\n.nav {\n  display: flex;\n  align-items: center;\n  gap: var(--space-1);\n}\n\n.nav__item {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--space-2);\n  height: var(--control-height-sm);\n  padding: 0 var(--space-4);\n  border-radius: var(--radius-md);\n  font-size: var(--text-sm);\n  font-weight: var(--weight-medium);\n  color: var(--muted-foreground);\n  cursor: pointer;\n  transition: color var(--duration) var(--ease),\n              background var(--duration) var(--ease);\n}\n.nav__item:hover     { color: var(--foreground); background: var(--accent); }\n.nav__item.is-active { color: var(--foreground); background: var(--accent); }\n\n/* --- vertical menu surface ------------------------------------------------- */\n.menu {\n  display: flex;\n  flex-direction: column;\n  gap: var(--space-1);\n  min-width: 180px;\n  padding: var(--space-1);\n  color: var(--popover-foreground);\n  background: var(--popover);\n  border: var(--line-weight) solid var(--border);\n  border-radius: var(--radius-md);\n  box-shadow: var(--shadow-md);\n}\n\n.menu__label {\n  padding: var(--space-2) var(--space-3);\n  font-size: var(--text-xs);\n  font-weight: var(--weight-semibold);\n  color: var(--muted-foreground);\n}\n\n.menu__item {\n  display: flex;\n  align-items: center;\n  gap: var(--space-3);\n  padding: var(--space-2) var(--space-3);\n  border-radius: var(--radius-sm);\n  font-size: var(--text-sm);\n  color: var(--popover-foreground);\n  cursor: pointer;\n  transition: background var(--duration) var(--ease),\n              color var(--duration) var(--ease);\n}\n.menu__item:hover,\n.menu__item.is-active { background: var(--accent); color: var(--accent-foreground); }\n\n/* menu used AS a nav sidebar: mute inactive items so the active one leads.\n   Opt-in — plain dropdown/command menus keep full-strength items. */\n.menu--nav .menu__item { color: var(--muted-foreground); }\n.menu--nav .menu__item:hover,\n.menu--nav .menu__item.is-active { color: var(--accent-foreground); }\n\n.menu__item--destructive { color: var(--destructive); }\n.menu__item--destructive:hover { background: color-mix(in srgb, var(--destructive) 12%, var(--popover)); color: var(--destructive); }\n\n.menu__item[aria-disabled=\"true\"] { opacity: 0.5; pointer-events: none; }\n\n.menu__shortcut { margin-left: auto; font-size: var(--text-xs); color: var(--muted-foreground); }\n\n.menu__separator {\n  height: var(--line-weight);\n  margin: var(--space-1) 0;\n  background: var(--border);\n}\n<\u002Fstyle>\n  <style>/* =============================================================================\n   GOOEY · TABS  (segmented control)\n   State is driven by aria-selected on triggers + [hidden] on panels.\n   (The low-fi skin fills the active segment solid blue — see low-fi.css.)\n============================================================================= */\n\n.tabs__list {\n  display: inline-flex;\n  gap: var(--space-1);\n  padding: var(--space-1);\n  background: var(--muted);\n  border-radius: var(--radius-lg);\n}\n\n.tab {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  height: var(--control-height-sm);\n  padding: 0 var(--space-4);\n  font-family: var(--font-sans);\n  font-size: var(--text-sm);\n  font-weight: var(--weight-medium);\n  color: var(--muted-foreground);\n  background: transparent;\n  border: none;\n  border-radius: var(--radius-md);\n  cursor: pointer;\n  transition: color var(--duration) var(--ease),\n              background var(--duration) var(--ease),\n              box-shadow var(--duration) var(--ease);\n}\n.tab:hover { color: var(--foreground); }\n\n.tab[aria-selected=\"true\"],\n.tab.is-active {\n  color: var(--foreground);\n  background: var(--background);\n  box-shadow: var(--shadow-sm);\n}\n\n.tab:focus-visible {\n  outline: none;\n  box-shadow: 0 0 0 var(--ring-width) color-mix(in srgb, var(--ring) 50%, transparent);\n}\n\n.tabs__panel { margin-top: var(--space-5); }\n.tabs__panel[hidden] { display: none; }\n<\u002Fstyle>\n  <style>/* =============================================================================\n   GOOEY · AVATAR\n   <span class=\"avatar\"><img src=\"…\" alt=\"…\"><\u002Fspan>   image\n   <span class=\"avatar\">AL<\u002Fspan>                       initials fallback\n   (The low-fi skin removes the ring and overlap — see low-fi.css.)\n============================================================================= */\n\n.avatar {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n  width: var(--control-height);\n  height: var(--control-height);\n  overflow: hidden;\n  border-radius: var(--radius-full);\n  background: var(--muted);\n  color: var(--muted-foreground);\n  font-size: var(--text-sm);\n  font-weight: var(--weight-medium);\n  user-select: none;\n}\n.avatar img { width: 100%; height: 100%; object-fit: cover; }\n\n.avatar--sm { width: var(--control-height-sm); height: var(--control-height-sm); font-size: var(--text-xs); }\n.avatar--lg { width: var(--control-height-lg); height: var(--control-height-lg); font-size: var(--text-md); }\n.avatar--xl { width: var(--space-9); height: var(--space-9); font-size: var(--text-lg); }\n\n.avatar--square { border-radius: var(--radius-md); }\n\n/* overlapping stack */\n.avatar-group { display: inline-flex; }\n.avatar-group .avatar { border: var(--line-weight-strong) solid var(--background); }\n.avatar-group .avatar + .avatar { margin-left: calc(-1 * var(--space-3)); }\n<\u002Fstyle>\n  <style>/* =============================================================================\n   GOOEY LOW-FI · SKIN OVERRIDES  (beyond tokens)\n   -----------------------------------------------------------------------------\n   The bespoke touches that make the mono blueprint: a blue dot-grid page canvas,\n   CLI-flavored spinner + progress, dotted dividers, and a crisp focus ring.\n   Imported LAST so it layers over the frozen component CSS. Load-bearing — this\n   is where low-fi stops looking like plain shadcn.\n============================================================================= */\n\n/* blue dot-grid page canvas */\nbody {\n  background-color: var(--background);\n  background-image: radial-gradient(circle, color-mix(in srgb, var(--primary) 24%, transparent) 1.25px, transparent 1.35px);\n  background-size: 15px 15px;\n}\n\n/* spinners -> a cycling three-dot text animation:  .  ..  ...  */\n.spinner {\n  width: auto;\n  height: auto;\n  min-width: 3ch;\n  text-align: left;\n  border: none;\n  border-radius: 0;\n  background: none;\n  animation: none;\n  font-family: var(--font-mono);\n  font-weight: var(--weight-bold);\n  font-size: var(--text-xl);\n  line-height: 1;\n  color: var(--foreground);\n}\n.spinner--sm    { font-size: var(--text-base); }\n.spinner--lg    { font-size: var(--text-3xl); }\n.spinner--muted { color: var(--muted-foreground); }\n.spinner::after {\n  content: \"...\";\n  animation: gooey-lowfi-dots calc(var(--duration-slow) * 4) steps(1, end) infinite;\n}\n\n/* loading buttons use the same dots */\n.btn.is-loading::after {\n  content: \"...\";\n  inset: 0;\n  width: auto;\n  height: auto;\n  border: none;\n  border-radius: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-weight: var(--weight-bold);\n  color: var(--foreground);\n  animation: gooey-lowfi-dots calc(var(--duration-slow) * 4) steps(1, end) infinite;\n}\n/* per-variant loading-dot color (the label is hidden while loading) */\n.btn--primary.is-loading::after    { color: var(--primary-foreground); }\n.btn--destructive.is-loading::after { color: var(--destructive-foreground); }\n\n@keyframes gooey-lowfi-dots {\n  0%   { content: \".\"; }\n  33%  { content: \"..\"; }\n  66%  { content: \"...\"; }\n  100% { content: \".\"; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .spinner::after,\n  .btn.is-loading::after { animation: none; content: \"...\"; }\n}\n\n/* tabs: solid active segment — a flat list plus near-equal muted/background\n   made the default active state too faint to read */\n.tab[aria-selected=\"true\"],\n.tab.is-active { background: var(--primary); color: var(--primary-foreground); }\n\n/* avatar row: no ring, no overlap — a thin gap instead */\n.avatar-group { gap: var(--space-2); }\n.avatar-group .avatar { border: none; }\n.avatar-group .avatar + .avatar { margin-left: 0; }\n\n/* radio + toggle stay round, even though everything else is hard-cornered */\n.radio  { border-radius: 50%; }\n.switch { border-radius: 9999px; }\n\n/* dividers: horizontal = a row of dots, vertical = a pipe */\n.divider {\n  height: 4px;\n  background-color: transparent;\n  background-image: radial-gradient(circle, var(--border) 1.5px, transparent 2px);\n  background-size: 8px 4px;\n  background-position: center;\n  background-repeat: repeat-x;\n}\n.divider--vertical {\n  width: auto;\n  height: auto;\n  min-height: 0;\n  align-self: center;\n  background: none;\n  margin: 0 var(--space-4);\n}\n.divider--vertical::before {\n  content: \"|\";\n  color: var(--border);\n  font-family: var(--font-mono);\n  font-weight: var(--weight-bold);\n}\n\n/* progress: a CLI block meter. One repeating mask cuts the whole bar — track\n   and fill together — into an even 20-segment grid, so the blocks are always\n   WHOLE: never clipped at the fill's leading edge or at the track's end. The\n   fill width snaps down to whole segments; the gaps are transparent, so they\n   read against whatever surface the bar sits on. */\n.progress {\n  height: 12px;\n  background-color: var(--border);            /* the empty blocks (faint)      */\n  -webkit-mask-image: repeating-linear-gradient(to right,\n            #000 0 calc(5% - 3px), transparent calc(5% - 3px) 5%);\n          mask-image: repeating-linear-gradient(to right,\n            #000 0 calc(5% - 3px), transparent calc(5% - 3px) 5%);\n}\n.progress__bar {\n  width: round(down, var(--value, 0%), 5%);   /* fill only whole segments      */\n  background-color: var(--primary);\n}\n/* indeterminate: fill the blocks one at a time, then restart */\n.progress--indeterminate .progress__bar {\n  width: 100%;\n  animation: gooey-lowfi-grow calc(var(--duration-slow) * 8) steps(20, end) infinite;\n}\n@keyframes gooey-lowfi-grow {\n  from { width: 0; }\n  to   { width: 100%; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .progress--indeterminate .progress__bar { animation: none; width: 40%; }\n}\n\n/* headings sized against the 13px body */\n.heading { font-size: 17px; }\n\n/* inline code: a hairline keeps it distinct in an all-mono skin */\ncode {\n  background: var(--secondary);\n  border: var(--line-weight) solid var(--border);\n}\n\n/* table zebra + hover: --muted sits almost on top of the surface in this near-\n   mono palette, so tint rows with the blue instead — and order hover after the\n   stripe so a hovered even row still lifts */\n.table--striped tbody tr:nth-child(even) {\n  background: color-mix(in srgb, var(--primary) 6%, var(--card));\n}\n.table tbody tr:hover {\n  background: color-mix(in srgb, var(--primary) 13%, var(--card));\n}\n\n/* text selection — a soft wash of the blue */\n::selection {\n  background: color-mix(in srgb, var(--primary) 22%, transparent);\n  color: var(--foreground);\n}\n\n/* focus: a crisp, full-strength ring — the hard blueprint edges suit a solid\n   ring better than a translucent halo, and it stays legible on both the light\n   and dark-blue surfaces */\n.btn:focus-visible,\n.input:focus-visible,\n.textarea:focus-visible,\n.select:focus-visible,\n.checkbox:focus-visible,\n.radio:focus-visible,\n.switch:focus-visible {\n  box-shadow: 0 0 0 var(--ring-width) var(--ring);\n}\n\n/* theme switching — suppress transitions for the flip.\n   A property that transitions AND reads a var() (e.g. `.btn`, `.menu__item`,\n   `.nav__item`, `.tab`, table rows) will NOT re-evaluate that var() when the\n   theme class toggles: any element already on screen freezes at its pre-toggle\n   color (in dark mode a persistent sidebar can turn invisible). Add\n   `theme-switching` to the element you toggle the theme on (usually <html>) for\n   one frame around the class flip, then remove it — the recolor then happens\n   with transitions off, so values re-evaluate cleanly. See \"Dark mode\" in\n   readme.md for the toggle helper. Animations (spinner, block meter) are\n   `animation`, not `transition`, so they are unaffected. */\n.theme-switching,\n.theme-switching *,\n.theme-switching *::before,\n.theme-switching *::after {\n  transition: none !important;\n}\n<\u002Fstyle>\n  <script src=\"c105de2f-cb0c-4c0a-abbc-6a96967e6145\"><\u002Fscript>\n  <style>\n    html,body{height:100%}\n    body{margin:0;background:var(--background)}\n    .blk-gutter{opacity:0;transition:opacity 120ms ease}\n    .blk:hover>.blk-gutter,.blk:focus-within>.blk-gutter{opacity:1}\n    .blk{transition:background 120ms ease}\n    .blk:hover{background:color-mix(in srgb,var(--primary) 4%,transparent)}\n    .blk.is-sel,.blk.is-sel:hover{background:color-mix(in srgb,var(--primary) 14%,transparent)}\n    .blk.is-commented{background:color-mix(in srgb,var(--primary) 8%,transparent);box-shadow:inset 2px 0 0 var(--primary)}\n    .blk.is-commented>.blk-body{padding-left:16px;padding-right:10px}\n    .add-block{color:var(--muted-foreground);transition:background 120ms ease,color 120ms ease}\n    .add-block:hover{background:color-mix(in srgb,var(--primary) 7%,transparent);color:var(--foreground)}\n    .wikilink{transition:opacity 120ms ease}\n    .wikilink:hover{opacity:.68}\n    .tree-row .row-actions{opacity:0;transition:opacity 120ms ease}\n    .tree-row:hover .row-actions,.tree-row.is-active .row-actions{opacity:1}\n    .cmt .cmt-actions{opacity:0;transition:opacity 120ms ease}\n    .cmt:hover .cmt-actions{opacity:1}\n    .cmt.is-resolved{opacity:.55;transition:opacity 120ms ease}\n    .cmt.is-resolved:hover{opacity:1}\n    .tbl-tools{opacity:0;transition:opacity 120ms ease}\n    .blk:hover .tbl-tools,.blk:focus-within .tbl-tools{opacity:1}\n    .blk-gutter .gicon:focus-visible{outline:1.5px solid var(--ring);outline-offset:1px}\n    @media (min-width:900px) and (max-width:1199px){\n      .gv-panel{position:fixed !important;right:0;top:0;bottom:0;z-index:80;box-shadow:var(--shadow-lg)}\n    }\n    .gicon,.ticon{display:grid;place-items:center;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer}\n    .gicon:hover,.ticon:hover{background:var(--accent)!important;color:var(--foreground)!important}\n    .flash{animation:grove-flash 1.3s ease}\n    @keyframes grove-flash{0%,35%{background:color-mix(in srgb,var(--primary) 20%,transparent)}100%{background:transparent}}\n    .gv-m{display:none !important}\n    @media (max-width:899px){\n      .gv-m{display:grid !important}\n      .gv-shell{height:100dvh !important}\n      .gv-side{position:fixed !important;left:0;top:0;bottom:0;width:min(84vw,320px) !important;z-index:85;transform:translateX(-100%);visibility:hidden;transition:transform 200ms cubic-bezier(0.4,0,0.2,1),visibility 0s linear 200ms}\n      .gv-side.is-open{transform:translateX(0);visibility:visible;box-shadow:var(--shadow-lg);transition:transform 200ms cubic-bezier(0.4,0,0.2,1),visibility 0s}\n      .gv-page{padding:0 18px !important}\n      .blk-gutter{display:none !important}\n      .gv-panel{position:fixed !important;inset:0 !important;width:100% !important;z-index:80;border-left:none !important}\n      .tree-row{min-height:44px}\n      .tree-row .row-actions{opacity:1}\n      .gv-side .ticon{width:34px !important;height:34px !important}\n      .menu .menu__item{min-height:44px}\n      .add-block{min-height:48px}\n      .table-wrap{overflow-x:auto}\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"gv-shell\" style=\"display:flex;height:100vh;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:13px\">\n\n  <aside class=\"gv-side {{ drawerCls }}\" style=\"width:266px;flex:0 0 auto;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--card)\">\n    <div style=\"padding:14px 14px 10px;display:flex;flex-direction:column;gap:11px\">\n      <div style=\"display:flex;align-items:center;min-width:0;min-height:26px\">\n        <span style=\"font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ wsName }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:relative\">\n        <span style=\"position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-foreground);pointer-events:none;display:flex\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <input class=\"input input--sm\" data-search=\"1\" placeholder=\"Search pages…\" value=\"{{ searchQuery }}\" oninput=\"{{ onSearchInput }}\" onkeydown=\"{{ onSearchKeydown }}\" style=\"padding-left:32px;padding-right:26px\">\n        <sc-if value=\"{{ searchView.open }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"menu\" style=\"position:absolute;top:38px;left:0;right:0;z-index:40;max-height:320px;overflow:auto\">\n            <div class=\"menu__label\">{{ searchView.label }}<\u002Fdiv>\n            <sc-for list=\"{{ searchView.results }}\" as=\"sr\" hint-placeholder-count=\"3\">\n              <div class=\"menu__item\" data-page-id=\"{{ sr.pageId }}\" data-block-id=\"{{ sr.blockId }}\" onmousedown=\"{{ onOpenResult }}\" style=\"align-items:flex-start;flex-direction:column;gap:2px\">\n                <div style=\"display:flex;align-items:center;gap:6px;width:100%\"><span style=\"font-size:10px;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.04em;flex:0 0 auto\">{{ sr.kindLabel }}<\u002Fspan><span style=\"font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ sr.title }}<\u002Fspan><\u002Fdiv>\n                <sc-if value=\"{{ sr.hasSnippet }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:11px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px\">{{ sr.snippet }}<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ searchView.empty }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"menu__item\" style=\"color:var(--muted-foreground);pointer-events:none\">0 results<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <button class=\"btn btn--secondary btn--sm\" onclick=\"{{ onNewTopPage }}\" sty
