name: Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Cleanup must still run when a PR is closed with merge conflicts. This event
  # uses the trusted base-branch workflow rather than checking out PR code.
  pull_request_target:
    types: [closed]
  push:
    branches: [stable, staging]

# Two runs of one pull request would race for the same preview aliases and D1
# database. Superseding the in-flight run is the wanted outcome: the newer
# commit is the one worth previewing. Different pull requests use different
# databases, so their migrations cannot invalidate each other's workers. PRs
# are keyed by number because a merged `closed` event uses the target branch as
# `github.ref` and must not cancel that branch's push deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    name: Cloudflare Artifacts
    steps:
      - uses: actions/checkout@v4

      # Every pull request comment names the commit it deployed. A reviewer
      # who opens the comment while a newer run is still uploading otherwise
      # cannot tell that the link is one commit behind.
      - name: Identify the previewed commit
        if: github.event_name == 'pull_request'
        id: commit
        run: echo "short=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      # This and the comment at the end of the job deliberately share the
      # default message id, so the second edits the first rather than stacking
      # a new one per run. Anything added here must leave that id alone or a
      # pull request ends up with several competing previews.
      - uses: mshick/add-pr-comment@v2
        if: github.event_name == 'pull_request'
        with:
          message: |
            Deploying a preview of `${{ steps.commit.outputs.short }}`...

      - name: Build assets
        run: |
          nix build --accept-flake-config .#tonk-cloudflare-artifacts

      # A pull request gets its own deployment in the disposable
      # `preview` environment.
      #
      # Every PR needs its own D1 database. A shared database cannot safely
      # serve immutable worker versions from branches with different migration
      # histories: a newer PR schema can make an older PR's queries fail.
      - name: Prepare preview access databases
        if: github.event_name == 'pull_request'
        id: access-database
        run: |
          set -euo pipefail
          resolve() {
            local database="$1"
            local migrations_dir="${2:-}"
            local id
            id="$({
              nix --accept-flake-config develop .#ci --command wrangler d1 list --json
            } | jq -r --arg name "$database" '.[] | select(.name == $name) | .uuid' | head -n 1)"
            # A preview database whose applied migration history names a
            # file this branch no longer carries cannot migrate forward:
            # wrangler tracks migrations by filename, so a rewritten
            # chain means the next apply runs against a schema it does
            # not expect ("no such column"). The database is disposable
            # per-PR state, so recreate it and let the branch's own
            # chain apply from scratch.
            if [ -n "$id" ] && [ -n "$migrations_dir" ]; then
              local applied divergent name
              applied="$({
                nix --accept-flake-config develop .#ci --command \
                  wrangler d1 execute "$database" --remote --json \
                    --command "SELECT name FROM d1_migrations"
              } 2>/dev/null | jq -r '.[0].results[]?.name' || true)"
              divergent=""
              for name in $applied; do
                [ -f "$migrations_dir/$name" ] || divergent="$name"
              done
              if [ -n "$divergent" ]; then
                echo "::warning::$database applied '$divergent', which this branch does not carry; recreating the preview database" >&2
                nix --accept-flake-config develop .#ci --command \
                  wrangler d1 delete "$database" --skip-confirmation >&2
                id=""
              fi
            fi
            if [ -z "$id" ]; then
              nix --accept-flake-config develop .#ci --command \
                wrangler d1 create "$database" --location weur >&2
              id="$({
                nix --accept-flake-config develop .#ci --command wrangler d1 list --json
              } | jq -r --arg name "$database" '.[] | select(.name == $name) | .uuid' | head -n 1)"
            fi
            if [ -z "$id" ]; then
              echo "::error::Could not resolve the D1 database id for $database" >&2
              exit 1
            fi
            echo "$id"
          }
          # The revocation index, resolved the same way. The presign path
          # fails CLOSED without this binding — an index it cannot read says
          # nothing about what was revoked — so an unsubstituted placeholder
          # would refuse every request rather than degrade quietly.
          resolve_kv() {
            namespace="$1"
            # `kv namespace list` emits JSON on stdout but takes no --json
            # flag, unlike `d1 list`. Strip anything ahead of the array so a
            # banner line cannot break the parse.
            lookup() {
              nix --accept-flake-config develop .#ci --command \
                wrangler kv namespace list 2>/dev/null \
                | sed -n '/^[[:space:]]*\[/,$p' \
                | jq -r --arg title "$1" '.[] | select(.title == $title) | .id' \
                | head -n 1
            }
            id="$(lookup "$namespace")"
            if [ -z "$id" ]; then
              nix --accept-flake-config develop .#ci --command \
                wrangler kv namespace create "$namespace" >&2
              id="$(lookup "$namespace")"
            fi
            if [ -z "$id" ]; then
              echo "::error::Could not resolve the KV namespace id for $namespace" >&2
              exit 1
            fi
            echo "$id"
          }
          control="tonk-access-control-pr-${{ github.event.pull_request.number }}"
          ingest="tonk-access-ingest-pr-${{ github.event.pull_request.number }}"
          revocations="tonk-access-revocations-pr-${{ github.event.pull_request.number }}"
          servability="tonk-access-servability-pr-${{ github.event.pull_request.number }}"
          config="$PWD/wrangler.preview.toml"
          control_id="$(resolve "$control" "rust/tonk-access-service/migrations")"
          ingest_id="$(resolve "$ingest" "rust/tonk-access-service/migrations-ingest")"
          revocations_id="$(resolve_kv "$revocations")"
          servability_id="$(resolve_kv "$servability")"
          cp wrangler.toml "$config"
          sed -i \
            -e "s/database_name = \"tonk-access-control-preview\"/database_name = \"$control\"/" \
            -e "s/database_id = \"REPLACED-PER-PULL-REQUEST\"/database_id = \"$control_id\"/" \
            -e "s/database_name = \"tonk-access-ingest-preview\"/database_name = \"$ingest\"/" \
            -e "s/database_id = \"INGEST-REPLACED-PER-PULL-REQUEST\"/database_id = \"$ingest_id\"/" \
            -e "s/id = \"REPLACED-PER-PULL-REQUEST\"/id = \"$revocations_id\"/" \
            -e "s/id = \"SERVABILITY-REPLACED-PER-PULL-REQUEST\"/id = \"$servability_id\"/" \
            "$config"
          if ! grep -Fq "database_name = \"$control\"" "$config" \
            || ! grep -Fq "database_id = \"$control_id\"" "$config" \
            || ! grep -Fq "database_name = \"$ingest\"" "$config" \
            || ! grep -Fq "database_id = \"$ingest_id\"" "$config" \
            || ! grep -Fq "id = \"$revocations_id\"" "$config" \
            || ! grep -Fq "id = \"$servability_id\"" "$config"; then
            echo "::error::Could not bind the access preview config to $control/$ingest/$revocations"
            exit 1
          fi
          echo "database=$control" >> "$GITHUB_OUTPUT"
          echo "ingest=$ingest" >> "$GITHUB_OUTPUT"
          echo "config=$config" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply preview access migrations
        if: github.event_name == 'pull_request'
        run: |
          nix --accept-flake-config develop .#ci --command \
            wrangler d1 migrations apply \
              "${{ steps.access-database.outputs.database }}" --remote \
              --env preview -c "${{ steps.access-database.outputs.config }}"
          nix --accept-flake-config develop .#ci --command \
            wrangler d1 migrations apply \
              "${{ steps.access-database.outputs.ingest }}" --remote \
              --env preview -c "${{ steps.access-database.outputs.config }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy access preview
        if: github.event_name == 'pull_request'
        id: deploy-preview
        run: |
          set -o pipefail
          preview_alias="pr-${{ github.event.pull_request.number }}"
          log="$RUNNER_TEMP/access-preview.log"
          nix --accept-flake-config develop .#ci --command \
            wrangler versions upload --env preview \
              -c "${{ steps.access-database.outputs.config }}" \
              --preview-alias "$preview_alias" 2>&1 | tee "$log"
          url="$(grep -Eo "https://$preview_alias-tonk-access-service-preview\.[a-z0-9-]+\.workers\.dev" "$log" | head -n 1 || true)"
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no preview alias URL for the access worker"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo 'command-output<<WRANGLER_OUTPUT_EOF'
            cat "$log"
            echo WRANGLER_OUTPUT_EOF
          } >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Migrations run first, because code that queries a column the
      # database does not have yet fails every request until the schema
      # catches up.
      - name: Apply staging access migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        run: |
          nix --accept-flake-config develop --command \
            wrangler d1 migrations apply tonk-access-control-staging --remote \
              --env staging -c wrangler.toml
          nix --accept-flake-config develop --command \
            wrangler d1 migrations apply tonk-access-ingest-staging --remote \
              --env staging -c wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        run: nix --accept-flake-config develop --command wrangler deploy --env staging -c wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply production access migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
        run: |
          nix --accept-flake-config develop --command \
            wrangler d1 migrations apply tonk-access-control --remote \
              -c wrangler.toml
          nix --accept-flake-config develop --command \
            wrangler d1 migrations apply tonk-access-ingest --remote \
              -c wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
        run: nix --accept-flake-config develop --command wrangler deploy -c wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: mshick/add-pr-comment@v2
        if: github.event_name == 'pull_request'
        with:
          message: |
            **Preview of `${{ steps.commit.outputs.short }}`** · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ${{ steps.deploy-preview.outputs.url }}

            To link the CLI to it:

            ```
            tonk account login \
              --via ${{ steps.deploy-preview.outputs.url }}/account/link
            ```

            <details><summary>Wrangler output</summary>

            ```
            ${{ steps.deploy-preview.outputs.command-output }}
            ```

            </details>

  cleanup-preview-databases:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Delete preview databases
        run: |
          set -euo pipefail
          for database in \
            "tonk-access-control-pr-${{ github.event.pull_request.number }}" \
            "tonk-access-ingest-pr-${{ github.event.pull_request.number }}"; do
            database_id="$({
              nix --accept-flake-config develop .#ci --command wrangler d1 list --json
            } | jq -r --arg name "$database" '.[] | select(.name == $name) | .uuid' | head -n 1)"
            if [ -n "$database_id" ]; then
              nix --accept-flake-config develop .#ci --command \
                wrangler d1 delete "$database" --skip-confirmation
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
