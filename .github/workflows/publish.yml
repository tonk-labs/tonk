name: Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Cleanup must still run when a PR is closed with merge conflicts. This event
  # uses the trusted base-branch workflow rather than checking out PR code.
  pull_request_target:
    types: [closed]
  push:
    branches: [stable, staging]

# Two runs of one pull request would race for the same preview aliases and D1
# database. Superseding the in-flight run is the wanted outcome: the newer
# commit is the one worth previewing. Different pull requests use different
# databases, so their migrations cannot invalidate each other's workers. PRs
# are keyed by number because a merged `closed` event uses the target branch as
# `github.ref` and must not cancel that branch's push deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    name: Cloudflare Artifacts
    steps:
      - uses: actions/checkout@v4

      # Every pull request comment names the commit it deployed. A reviewer
      # who opens the comment while a newer run is still uploading otherwise
      # cannot tell that the link is one commit behind.
      - name: Identify the previewed commit
        if: github.event_name == 'pull_request'
        id: commit
        run: echo "short=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      # This and the comment at the end of the job deliberately share the
      # default message id, so the second edits the first rather than stacking
      # a new one per run. Anything added here must leave that id alone or a
      # pull request ends up with several competing previews.
      - uses: mshick/add-pr-comment@v2
        if: github.event_name == 'pull_request'
        with:
          message: |
            Deploying a preview of `${{ steps.commit.outputs.short }}`...

      - name: Build assets
        run: |
          nix build --accept-flake-config .#tonk-cloudflare-artifacts

      # A pull request gets the whole deployment, not just the access worker.
      # The browser reads its account provider from the access worker's
      # `/.well-known/tonk`, so previewing one against the released other tests
      # a pairing that does not exist anywhere. Both go to the disposable
      # `preview` environment, account worker first, because the access worker
      # has to be told where that one landed.
      #
      # Every PR needs its own D1 database. A shared database cannot safely
      # serve immutable worker versions from branches with different migration
      # histories: a newer PR schema can make an older PR's queries fail.
      - name: Prepare preview account database
        if: github.event_name == 'pull_request'
        id: account-database
        run: |
          set -euo pipefail
          database="tonk-accounts-pr-${{ github.event.pull_request.number }}"
          # Wrangler resolves `main` and `migrations_dir` relative to the
          # config file, so the generated config must stay in the repository
          # root rather than `$RUNNER_TEMP`.
          config="$PWD/wrangler.account.preview.toml"
          database_id="$({
            nix --accept-flake-config develop .#ci --command wrangler d1 list --json
          } | jq -r --arg name "$database" '.[] | select(.name == $name) | .uuid' | head -n 1)"
          if [ -z "$database_id" ]; then
            nix --accept-flake-config develop .#ci --command \
              wrangler d1 create "$database" --location weur
            database_id="$({
              nix --accept-flake-config develop .#ci --command wrangler d1 list --json
            } | jq -r --arg name "$database" '.[] | select(.name == $name) | .uuid' | head -n 1)"
          fi
          if [ -z "$database_id" ]; then
            echo "::error::Could not resolve the D1 database id for $database"
            exit 1
          fi
          cp wrangler.account.toml "$config"
          sed -i \
            -e "s/database_name = \"tonk-accounts-preview\"/database_name = \"$database\"/" \
            -e "s/database_id = \"323cb440-c356-4d1d-b238-2ffd11abedcc\"/database_id = \"$database_id\"/" \
            "$config"
          if ! grep -Fq "database_name = \"$database\"" "$config" \
            || ! grep -Fq "database_id = \"$database_id\"" "$config"; then
            echo "::error::Could not bind the account preview config to $database"
            exit 1
          fi
          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "config=$config" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply preview account migrations
        if: github.event_name == 'pull_request'
        run: |
          nix --accept-flake-config develop .#ci --command \
            wrangler d1 migrations apply \
              "${{ steps.account-database.outputs.database }}" --remote \
              --env preview -c "${{ steps.account-database.outputs.config }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy account preview
        if: github.event_name == 'pull_request'
        id: account-preview
        run: |
          set -o pipefail
          preview_alias="pr-${{ github.event.pull_request.number }}"
          log="$RUNNER_TEMP/account-preview.log"
          nix --accept-flake-config develop .#ci --command \
            wrangler versions upload --env preview \
              -c "${{ steps.account-database.outputs.config }}" \
              --preview-alias "$preview_alias" 2>&1 | tee "$log"
          url="$(grep -Eo "https://$preview_alias-tonk-account-service-preview\.[a-z0-9-]+\.workers\.dev" "$log" | head -n 1 || true)"
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no preview alias URL for the account worker; refusing to point the access preview at an unknown registry"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The access worker's control database follows the same per-PR shape
      # as the account worker's, and for the same reason: divergent
      # migration histories cannot share a database.
      - name: Prepare preview access databases
        if: github.event_name == 'pull_request'
        id: access-database
        run: |
          set -euo pipefail
          resolve() {
            local database="$1"
            local id
            id="$({
              nix --accept-flake-config develop .#ci --command wrangler d1 list --json
            } | jq -r --arg name "$database" '.[] | select(.name == $name) | .uuid' | head -n 1)"
            if [ -z "$id" ]; then
              nix --accept-flake-config develop .#ci --command \
                wrangler d1 create "$database" --location weur >&2
              id="$({
                nix --accept-flake-config develop .#ci --command wrangler d1 list --json
              } | jq -r --arg name "$database" '.[] | select(.name == $name) | .uuid' | head -n 1)"
            fi
            if [ -z "$id" ]; then
              echo "::error::Could not resolve the D1 database id for $database" >&2
              exit 1
            fi
            echo "$id"
          }
          control="tonk-access-control-pr-${{ github.event.pull_request.number }}"
          ingest="tonk-access-ingest-pr-${{ github.event.pull_request.number }}"
          config="$PWD/wrangler.preview.toml"
          control_id="$(resolve "$control")"
          ingest_id="$(resolve "$ingest")"
          cp wrangler.toml "$config"
          sed -i \
            -e "s/database_name = \"tonk-access-control-preview\"/database_name = \"$control\"/" \
            -e "s/database_id = \"REPLACED-PER-PULL-REQUEST\"/database_id = \"$control_id\"/" \
            -e "s/database_name = \"tonk-access-ingest-preview\"/database_name = \"$ingest\"/" \
            -e "s/database_id = \"INGEST-REPLACED-PER-PULL-REQUEST\"/database_id = \"$ingest_id\"/" \
            "$config"
          if ! grep -Fq "database_name = \"$control\"" "$config" \
            || ! grep -Fq "database_id = \"$control_id\"" "$config" \
            || ! grep -Fq "database_name = \"$ingest\"" "$config" \
            || ! grep -Fq "database_id = \"$ingest_id\"" "$config"; then
            echo "::error::Could not bind the access preview config to $control/$ingest"
            exit 1
          fi
          echo "database=$control" >> "$GITHUB_OUTPUT"
          echo "ingest=$ingest" >> "$GITHUB_OUTPUT"
          echo "config=$config" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply preview access migrations
        if: github.event_name == 'pull_request'
        run: |
          nix --accept-flake-config develop .#ci --command \
            wrangler d1 migrations apply \
              "${{ steps.access-database.outputs.database }}" --remote \
              --env preview -c "${{ steps.access-database.outputs.config }}"
          nix --accept-flake-config develop .#ci --command \
            wrangler d1 migrations apply \
              "${{ steps.access-database.outputs.ingest }}" --remote \
              --env preview -c "${{ steps.access-database.outputs.config }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The two service URLs are the only configuration that cannot be checked
      # in, because an alias URL exists only once its upload returns. Command
      # line vars merge over the environment's, so the rest of `[env.preview]`
      # still applies.
      - name: Deploy access preview
        if: github.event_name == 'pull_request'
        id: deploy-preview
        run: |
          set -o pipefail
          preview_alias="pr-${{ github.event.pull_request.number }}"
          account="${{ steps.account-preview.outputs.url }}"
          log="$RUNNER_TEMP/access-preview.log"
          nix --accept-flake-config develop .#ci --command \
            wrangler versions upload --env preview \
              -c "${{ steps.access-database.outputs.config }}" \
              --preview-alias "$preview_alias" \
              --var "ACCOUNT_SERVICE_URL:$account" \
              --var "REVOCATION_RELAY_URL:$account/revocations" 2>&1 | tee "$log"
          url="$(grep -Eo "https://$preview_alias-tonk-access-service-preview\.[a-z0-9-]+\.workers\.dev" "$log" | head -n 1 || true)"
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no preview alias URL for the access worker"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo 'command-output<<WRANGLER_OUTPUT_EOF'
            echo '--- account worker ---'
            cat "$RUNNER_TEMP/account-preview.log"
            echo
            echo '--- access worker ---'
            cat "$log"
            echo WRANGLER_OUTPUT_EOF
          } >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Both workers ship together, exactly as a pull request previews them.
      # Only the preview path used to deploy the account worker, so every
      # release moved the access worker against whichever account worker was
      # last pushed by hand: routes the CLI depends on could be absent from
      # the released service for as long as nobody noticed. Migrations run
      # first, because code that queries a column the database does not have
      # yet fails every request until the schema catches up.
      - name: Apply staging account migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        run: |
          nix --accept-flake-config develop --command \
            wrangler d1 migrations apply tonk-accounts-staging --remote \
              --env staging -c wrangler.account.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy account staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        run: nix --accept-flake-config develop --command wrangler deploy --env staging -c wrangler.account.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply staging access migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        run: |
          nix --accept-flake-config develop --command \
            wrangler d1 migrations apply tonk-access-control-staging --remote \
              --env staging -c wrangler.toml
          nix --accept-flake-config develop --command \
            wrangler d1 migrations apply tonk-access-ingest-staging --remote \
              --env staging -c wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        run: nix --accept-flake-config develop --command wrangler deploy --env staging -c wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply production account migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
        run: |
          nix --accept-flake-config develop --command \
            wrangler d1 migrations apply tonk-accounts --remote \
              -c wrangler.account.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy account production
        if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
        run: nix --accept-flake-config develop --command wrangler deploy -c wrangler.account.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply production access migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
        run: |
          nix --accept-flake-config develop --command \
            wrangler d1 migrations apply tonk-access-control --remote \
              -c wrangler.toml
          nix --accept-flake-config develop --command \
            wrangler d1 migrations apply tonk-access-ingest --remote \
              -c wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
        run: nix --accept-flake-config develop --command wrangler deploy -c wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: mshick/add-pr-comment@v2
        if: github.event_name == 'pull_request'
        with:
          message: |
            **Preview of `${{ steps.commit.outputs.short }}`** · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ${{ steps.deploy-preview.outputs.url }}

            To link the CLI to it:

            ```
            tonk account link \
              --service-url ${{ steps.account-preview.outputs.url }} \
              --account-url ${{ steps.deploy-preview.outputs.url }}/account/link
            ```

            <details><summary>Wrangler output</summary>

            ```
            ${{ steps.deploy-preview.outputs.command-output }}
            ```

            </details>

  cleanup-account-preview:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Delete preview databases
        run: |
          set -euo pipefail
          for database in \
            "tonk-accounts-pr-${{ github.event.pull_request.number }}" \
            "tonk-access-control-pr-${{ github.event.pull_request.number }}" \
            "tonk-access-ingest-pr-${{ github.event.pull_request.number }}"; do
            database_id="$({
              nix --accept-flake-config develop .#ci --command wrangler d1 list --json
            } | jq -r --arg name "$database" '.[] | select(.name == $name) | .uuid' | head -n 1)"
            if [ -n "$database_id" ]; then
              nix --accept-flake-config develop .#ci --command \
                wrangler d1 delete "$database" --skip-confirmation
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
