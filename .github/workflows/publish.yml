name: Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Cleanup must still run when a PR is closed with merge conflicts. This event
  # uses the trusted base-branch workflow rather than checking out PR code.
  pull_request_target:
    types: [closed]
  # `main` deploys dev on tonk.foundation. A `v*` tag is a release: a
  # prerelease tag (`v0.7.0-rc.1`) deploys staging and a final tag (`v0.7.0`)
  # deploys production. `release.yml` explains how to cut one.
  push:
    branches: [main]
    tags: ['v*']

# Two runs of one pull request would race for the same preview aliases and D1
# database. Superseding the in-flight run is the wanted outcome: the newer
# commit is the one worth previewing. Different pull requests use different
# databases, so their migrations cannot invalidate each other's workers. PRs
# are keyed by number because a merged `closed` event uses the target branch as
# `github.ref` and must not cancel that branch's push deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: write
      pull-requests: write
    timeout-minutes: 240
    name: Cloudflare Artifacts
    outputs:
      channel: ${{ github.event_name == 'pull_request' && 'preview' || github.ref == 'refs/heads/main' && 'dev' || steps.release.outputs.channel }}
      provider: ${{ steps.deploy-preview.outputs.url || github.ref == 'refs/heads/main' && 'https://tonk.foundation' || steps.release.outputs.channel == 'staging' && 'https://staging.tonk.xyz' || 'https://tonk.network' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A release compares its tag against `main`.
          fetch-depth: ${{ github.ref_type != 'tag' && 1 || 0 }}

      # Validates the tag, picks the environment from it, and stamps the
      # tag's version into the workspace before anything builds.
      - name: Resolve the release
        if: github.ref_type == 'tag'
        id: release
        uses: ./.github/actions/resolve-release

      # Every pull request comment names the commit it deployed. A reviewer
      # who opens the comment while a newer run is still uploading otherwise
      # cannot tell that the link is one commit behind.
      - name: Identify the previewed commit
        if: github.event_name == 'pull_request'
        id: commit
        run: echo "short=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      # This and the comment at the end of the job deliberately share the
      # default message id, so the second edits the first rather than stacking
      # a new one per run. Anything added here must leave that id alone or a
      # pull request ends up with several competing previews.
      - uses: mshick/add-pr-comment@v2
        if: github.event_name == 'pull_request'
        with:
          message: |
            Deploying a preview of `${{ steps.commit.outputs.short }}`...

      - name: Build assets
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
        run: |
          artifact=tonk-cloudflare-artifacts
          if [ "$DEPLOY_EVENT" = pull_request ]; then
            artifact=tonk-cloudflare-ci-artifacts
          fi
          nix build --accept-flake-config ".#$artifact"

      - name: Assemble MCP browser assets from this build
        run: |
          TONK_UI_DIST="$PWD/result/tonk-ui" nix --accept-flake-config develop .#ci --command \
            node mcp/hosted/build-assets.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-browser-assets
          path: mcp/hosted/public
          if-no-files-found: error
          retention-days: 3

      - name: Require full tag verification before release side effects
        if: github.ref_type == 'tag'
        uses: ./.github/actions/require-tag-verification

      # A pull request gets its own deployment in the disposable
      # `preview` environment.
      #
      # Every PR needs its own D1 database. A shared database cannot safely
      # serve immutable worker versions from branches with different migration
      # histories: a newer PR schema can make an older PR's queries fail.
      - name: Prepare preview access databases
        if: github.event_name == 'pull_request'
        id: access-database
        run: |
          set -euo pipefail
          resolve() {
            local database="$1"
            local migrations_dir="${2:-}"
            local id
            id="$({
              nix --accept-flake-config develop .#ci --command wrangler d1 list --json
            } | jq -r --arg name "$database" '.[] | select(.name == $name) | .uuid' | head -n 1)"
            # A preview database whose applied migration history names a
            # file this branch no longer carries cannot migrate forward:
            # wrangler tracks migrations by filename, so a rewritten
            # chain means the next apply runs against a schema it does
            # not expect ("no such column"). The database is disposable
            # per-PR state, so recreate it and let the branch's own
            # chain apply from scratch.
            if [ -n "$id" ] && [ -n "$migrations_dir" ]; then
              local applied divergent name
              applied="$({
                nix --accept-flake-config develop .#ci --command \
                  wrangler d1 execute "$database" --remote --json \
                    --command "SELECT name FROM d1_migrations"
              } 2>/dev/null | jq -r '.[0].results[]?.name' || true)"
              divergent=""
              for name in $applied; do
                [ -f "$migrations_dir/$name" ] || divergent="$name"
              done
              if [ -n "$divergent" ]; then
                echo "::warning::$database applied '$divergent', which this branch does not carry; recreating the preview database" >&2
                nix --accept-flake-config develop .#ci --command \
                  wrangler d1 delete "$database" --skip-confirmation >&2
                id=""
              fi
            fi
            if [ -z "$id" ]; then
              nix --accept-flake-config develop .#ci --command \
                wrangler d1 create "$database" --location weur >&2
              id="$({
                nix --accept-flake-config develop .#ci --command wrangler d1 list --json
              } | jq -r --arg name "$database" '.[] | select(.name == $name) | .uuid' | head -n 1)"
            fi
            if [ -z "$id" ]; then
              echo "::error::Could not resolve the D1 database id for $database" >&2
              exit 1
            fi
            echo "$id"
          }
          # The revocation index, resolved the same way. The presign path
          # fails CLOSED without this binding — an index it cannot read says
          # nothing about what was revoked — so an unsubstituted placeholder
          # would refuse every request rather than degrade quietly.
          resolve_kv() {
            namespace="$1"
            # `kv namespace list` emits JSON on stdout but takes no --json
            # flag, unlike `d1 list`. Strip anything ahead of the array so a
            # banner line cannot break the parse.
            lookup() {
              nix --accept-flake-config develop .#ci --command \
                wrangler kv namespace list 2>/dev/null \
                | sed -n '/^[[:space:]]*\[/,$p' \
                | jq -r --arg title "$1" '.[] | select(.title == $title) | .id' \
                | head -n 1
            }
            id="$(lookup "$namespace")"
            if [ -z "$id" ]; then
              nix --accept-flake-config develop .#ci --command \
                wrangler kv namespace create "$namespace" >&2
              id="$(lookup "$namespace")"
            fi
            if [ -z "$id" ]; then
              echo "::error::Could not resolve the KV namespace id for $namespace" >&2
              exit 1
            fi
            echo "$id"
          }
          # The account's Secrets Store, which holds the secrets every
          # preview reads at runtime. Only its id and the secrets' names are
          # read here, never a value. A preview missing either secret could
          # not sign or could not send its activation mail, so the deploy
          # stops instead of shipping one.
          resolve_store() {
            api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/secrets_store"
            # A request Cloudflare refuses says why, rather than reading as
            # an empty answer.
            store_get() {
              body="$RUNNER_TEMP/secrets-store.json"
              status="$(curl -sS -o "$body" -w '%{http_code}' \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api$1")"
              case "$status" in
                200) cat "$body" ;;
                401|403)
                  echo "::error::The Cloudflare API token may not read the Secrets Store (HTTP $status: $(jq -c '.errors' "$body" 2>/dev/null)): give the token behind CLOUDFLARE_API_TOKEN the Secrets Store permission on this account" >&2
                  exit 1 ;;
                *)
                  echo "::error::Reading the Secrets Store ($1) failed with HTTP $status: $(jq -c '.errors' "$body" 2>/dev/null)" >&2
                  exit 1 ;;
              esac
            }
            stores="$(store_get /stores)" || exit 1
            id="$(jq -r 'if (.result | length) == 1 then .result[0].id
              else (.result[] | select(.name == "default_secrets_store") | .id) end' <<<"$stores" | head -n 1)"
            if [ -z "$id" ] || [ "$id" = null ]; then
              echo "::error::The account has no Secrets Store for the preview secrets (see the note in wrangler.toml)" >&2
              exit 1
            fi
            secrets="$(store_get "/stores/$id/secrets?per_page=100")" || exit 1
            names="$(jq -r '.result[].name' <<<"$secrets")"
            for name in TONK_PREVIEW_SERVICE_SECRET_KEY TONK_PREVIEW_RESEND_API_KEY; do
              if ! grep -Fxq "$name" <<<"$names"; then
                echo "::error::The Secrets Store holds no $name; create it as wrangler.toml describes" >&2
                exit 1
              fi
            done
            echo "$id"
          }
          control="tonk-access-control-pr-${{ github.event.pull_request.number }}"
          ingest="tonk-access-ingest-pr-${{ github.event.pull_request.number }}"
          revocations="tonk-access-revocations-pr-${{ github.event.pull_request.number }}"
          servability="tonk-access-servability-pr-${{ github.event.pull_request.number }}"
          worker="tonk-access-service-pr-${{ github.event.pull_request.number }}"
          config="$PWD/wrangler.preview.toml"
          control_id="$(resolve "$control" "rust/tonk-access-service/migrations")"
          ingest_id="$(resolve "$ingest" "rust/tonk-access-service/migrations-ingest")"
          revocations_id="$(resolve_kv "$revocations")"
          servability_id="$(resolve_kv "$servability")"
          store_id="$(resolve_store)"
          cp wrangler.toml "$config"
          sed -i \
            -e "s/^name = \"tonk-access-service-preview\"$/name = \"$worker\"/" \
            -e "s/database_name = \"tonk-access-control-preview\"/database_name = \"$control\"/" \
            -e "s/database_id = \"REPLACED-PER-PULL-REQUEST\"/database_id = \"$control_id\"/" \
            -e "s/database_name = \"tonk-access-ingest-preview\"/database_name = \"$ingest\"/" \
            -e "s/database_id = \"INGEST-REPLACED-PER-PULL-REQUEST\"/database_id = \"$ingest_id\"/" \
            -e "s/id = \"REPLACED-PER-PULL-REQUEST\"/id = \"$revocations_id\"/" \
            -e "s/id = \"SERVABILITY-REPLACED-PER-PULL-REQUEST\"/id = \"$servability_id\"/" \
            -e "s/store_id = \"SECRETS-STORE-REPLACED-PER-DEPLOY\"/store_id = \"$store_id\"/" \
            "$config"
          if ! grep -Fxq "name = \"$worker\"" "$config" \
            || ! grep -Fq "database_name = \"$control\"" "$config" \
            || ! grep -Fq "database_id = \"$control_id\"" "$config" \
            || ! grep -Fq "database_name = \"$ingest\"" "$config" \
            || ! grep -Fq "database_id = \"$ingest_id\"" "$config" \
            || ! grep -Fq "id = \"$revocations_id\"" "$config" \
            || ! grep -Fq "id = \"$servability_id\"" "$config" \
            || grep -Fq "SECRETS-STORE-REPLACED-PER-DEPLOY" "$config"; then
            echo "::error::Could not bind the access preview config to $worker/$control/$ingest/$revocations"
            exit 1
          fi
          echo "database=$control" >> "$GITHUB_OUTPUT"
          echo "ingest=$ingest" >> "$GITHUB_OUTPUT"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply preview access migrations
        if: github.event_name == 'pull_request'
        run: |
          nix --accept-flake-config develop .#ci --command \
            wrangler d1 migrations apply \
              "${{ steps.access-database.outputs.database }}" --remote \
              --env preview -c "${{ steps.access-database.outputs.config }}"
          nix --accept-flake-config develop .#ci --command \
            wrangler d1 migrations apply \
              "${{ steps.access-database.outputs.ingest }}" --remote \
              --env preview -c "${{ steps.access-database.outputs.config }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy access preview
        if: github.event_name == 'pull_request'
        id: deploy-preview
        # A plain deploy of the pull request's own worker, as production is
        # deployed: it applies the Durable Object migrations, which a version
        # upload cannot, so the preview keeps sockets as production does.
        run: |
          set -o pipefail
          worker="${{ steps.access-database.outputs.worker }}"
          config="${{ steps.access-database.outputs.config }}"
          log="$RUNNER_TEMP/access-preview.log"
          # The worker holds no secrets of its own: it reads the account's
          # from the Secrets Store at runtime, so nothing here handles one.
          nix --accept-flake-config develop .#ci --command \
            wrangler deploy --env preview -c "$config" 2>&1 | tee "$log"
          url="$(grep -Eo "https://$worker\.[a-z0-9-]+\.workers\.dev" "$log" | head -n 1 || true)"
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no workers.dev URL for $worker"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo 'command-output<<WRANGLER_OUTPUT_EOF'
            cat "$log"
            echo WRANGLER_OUTPUT_EOF
          } >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Migrations run first, because code that queries a column the
      # database does not have yet fails every request until the schema
      # catches up.
      - name: Apply dev access migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          nix --accept-flake-config develop --command \
            wrangler d1 migrations apply tonk-access-control-dev --remote \
              --env dev -c wrangler.toml
          nix --accept-flake-config develop --command \
            wrangler d1 migrations apply tonk-access-ingest-dev --remote \
              --env dev -c wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: nix --accept-flake-config develop --command wrangler deploy --env dev -c wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply staging access migrations
        if: steps.release.outputs.channel == 'staging'
        run: |
          nix --accept-flake-config develop --command \
            wrangler d1 migrations apply tonk-access-control-staging --remote \
              --env staging -c wrangler.toml
          nix --accept-flake-config develop --command \
            wrangler d1 migrations apply tonk-access-ingest-staging --remote \
              --env staging -c wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy staging
        if: steps.release.outputs.channel == 'staging'
        run: nix --accept-flake-config develop --command wrangler deploy --env staging -c wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply production access migrations
        if: steps.release.outputs.channel == 'stable'
        run: |
          nix --accept-flake-config develop --command \
            wrangler d1 migrations apply tonk-access-control --remote \
              -c wrangler.toml
          nix --accept-flake-config develop --command \
            wrangler d1 migrations apply tonk-access-ingest --remote \
              -c wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy production
        if: steps.release.outputs.channel == 'stable'
        run: nix --accept-flake-config develop --command wrangler deploy -c wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: mshick/add-pr-comment@v2
        if: github.event_name == 'pull_request'
        with:
          message: |
            **Preview of `${{ steps.commit.outputs.short }}`** · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ${{ steps.deploy-preview.outputs.url }}

            To link the CLI to it:

            ```
            tonk account login \
              --via ${{ steps.deploy-preview.outputs.url }}/account/link
            ```

            <details><summary>Wrangler output</summary>

            ```
            ${{ steps.deploy-preview.outputs.command-output }}
            ```

            </details>

  # The MCP container's Rust runtime. It needs nothing from the Cloudflare
  # deployment, so it compiles while that job builds the browser bundle,
  # instead of inside the container build after it. It builds in the Debian
  # release the container runs, so the binary links the same glibc.
  agent-worker:
    name: MCP runtime build
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: rust:1.93.0-bookworm
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.ref_type != 'tag' && 1 || 0 }}
      - name: Trust the workspace checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/resolve-release
        if: github.ref_type == 'tag'
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libssl-dev clang cmake zstd
      # Keeps compiled dependencies across source edits. Cargo still checks
      # every fingerprint, so a stale entry only costs rebuilding what changed.
      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            target
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: agent-worker-v1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            agent-worker-v1-${{ hashFiles('Cargo.lock') }}-
            agent-worker-v1-
      - name: Build the agent worker
        run: cargo build --locked --release -p tonk-worker --features native-host --bin tonk-agent-worker
      - uses: actions/upload-artifact@v4
        with:
          name: tonk-agent-worker
          path: target/release/tonk-agent-worker
          if-no-files-found: error
          retention-days: 3

  mcp:
    name: MCP deployment
    needs: [deploy, agent-worker]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Keep Docker on this runner; the Nix asset job deliberately removes it.
      # The container image copies the agent worker built above.
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.ref_type != 'tag' && 1 || 0 }}
      - uses: ./.github/actions/resolve-release
        if: github.ref_type == 'tag'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: mcp-browser-assets
          path: mcp/hosted/public
      - uses: actions/download-artifact@v4
        with:
          name: tonk-agent-worker
          path: target/release
      - name: Make the agent worker executable
        run: chmod 0755 target/release/tonk-agent-worker
      - name: Install and test MCP
        run: |
          npm ci --prefix mcp --ignore-scripts
          npm ci --prefix mcp/hosted/cloudflare
          npm test --prefix mcp
          npm run test:chatgpt --prefix mcp
      - name: Prepare isolated deployment
        id: config
        run: node mcp/hosted/cloudflare/prepare-deployment.mjs
        env:
          DEPLOY_CHANNEL: ${{ needs.deploy.outputs.channel }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          TONK_PROVIDER_ORIGIN: ${{ needs.deploy.outputs.provider }}
          BUILD_COMMIT: ${{ github.sha }}
      - name: Deploy MCP worker and container
        working-directory: mcp/hosted/cloudflare
        run: npx --no-install wrangler deploy --config wrangler.generated.json
      - name: Check deployed MCP
        run: node mcp/hosted/cloudflare/smoke.mjs
        env:
          MCP_ISSUER: ${{ steps.config.outputs.issuer }}
          BUILD_COMMIT: ${{ github.sha }}
      - name: Record connection settings
        env:
          CONNECTION_SETTINGS: ${{ steps.config.outputs.connection_settings }}
        run: |
          {
            echo '### Tonk MCP'
            printf '%s\n' "$CONNECTION_SETTINGS"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: mshick/add-pr-comment@v2
        if: github.event_name == 'pull_request'
        with:
          message-id: mcp-preview
          message: |
            **MCP preview** · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ${{ steps.config.outputs.connection_settings }}

  cleanup-preview-databases:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Delete preview databases and worker
        run: |
          set -euo pipefail
          for database in \
            "tonk-access-control-pr-${{ github.event.pull_request.number }}" \
            "tonk-access-ingest-pr-${{ github.event.pull_request.number }}"; do
            database_id="$({
              nix --accept-flake-config develop .#ci --command wrangler d1 list --json
            } | jq -r --arg name "$database" '.[] | select(.name == $name) | .uuid' | head -n 1)"
            if [ -n "$database_id" ]; then
              nix --accept-flake-config develop .#ci --command \
                wrangler d1 delete "$database" --skip-confirmation
            fi
          done
          # The pull request's own worker, and with it its Durable Object
          # namespace. A worker that was never deployed is nothing to delete.
          worker="tonk-access-service-pr-${{ github.event.pull_request.number }}"
          nix --accept-flake-config develop .#ci --command \
            wrangler delete "$worker" --force \
            || echo "No preview worker $worker to delete"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
