on:
  pull_request:
  push:
    branches: [main]

name: 'Peer'

# Builds the local peer that the Tonk agent plugin launches on every pull
# request and every merge to `main`, and drives each build over MCP stdio.
# A merge also refreshes the rolling `tonk-peer-dev` prerelease, which the
# plugin's `dev` channel installs against the dev deployment (tonk.foundation)
# that `main` already ships to. Releases build, sign and publish it from their
# tag in `release.yml`.

concurrency:
  group: peer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-peer:
    name: 'Build ${{ matrix.artifact-name }}'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: tonk-peer-linux-x86_64
          - os: macos-latest
            artifact-name: tonk-peer-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        if: runner.os == 'Linux'
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: 'Build tonk-peer'
        run: nix build --accept-flake-config .#tonk-peer
      - name: 'Stage tonk-peer artifact'
        run: |
          mkdir -p artifacts
          cp result/bin/tonk-peer artifacts/tonk-peer
          chmod 0755 artifacts/tonk-peer
      - name: 'Smoke over MCP stdio'
        run: python3 rust/tonk-peer/smoke.py artifacts/tonk-peer
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/tonk-peer

  plugin:
    name: 'Check plugin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'Manifests parse and the launcher is valid shell'
        run: |
          set -euo pipefail
          for manifest in .claude-plugin/marketplace.json plugins/tonk/.claude-plugin/plugin.json plugins/tonk/.mcp.json; do
            python3 -m json.tool "$manifest" > /dev/null
          done
          sh -n plugins/tonk/scripts/tonk-peer
          test -x plugins/tonk/scripts/tonk-peer
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 'Validate with Claude Code'
        run: npx --yes @anthropic-ai/claude-code plugin validate ./plugins/tonk

  # Unsigned beyond the build's ad-hoc signature, like any main build. The
  # launcher verifies it against this release's checksums.txt.
  dev-release:
    name: 'Publish rolling dev build'
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ['build-peer', 'plugin']
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tonk-peer-macos-arm64
          path: artifacts/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: tonk-peer-linux-x86_64
          path: artifacts/linux-x86_64
      - name: Prepare assets
        run: |
          set -euo pipefail
          for platform in macos-arm64 linux-x86_64; do
            install -m 0755 "artifacts/$platform/tonk-peer" tonk-peer
            tar -czf "tonk-peer-$platform.tar.gz" tonk-peer
            rm tonk-peer
          done
          sha256sum tonk-peer-macos-arm64.tar.gz tonk-peer-linux-x86_64.tar.gz > checksums.txt
      - name: Replace the rolling dev release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete tonk-peer-dev --yes --cleanup-tag || true
          gh release create tonk-peer-dev \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title 'tonk-peer (dev)' \
            --notes "Rolling tonk-peer build of main at $GITHUB_SHA for the plugin's dev channel. Not a release." \
            tonk-peer-macos-arm64.tar.gz tonk-peer-linux-x86_64.tar.gz checksums.txt
