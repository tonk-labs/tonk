on:
  push:
    branches: [main]
  workflow_dispatch:

name: 'CLI dev'

# Publish the CLI built from the latest `main` to the rolling `tonk-dev`
# release: the dev channel (`TONK_CHANNEL=dev`, `tonk update` on a dev
# install, the publish action's `tonk-version: dev`).
#
# Stable and staging only move when a `v*` tag is pushed (`release.yml`),
# and `cli-pin.yml` only on a manual dispatch. Something that must keep
# pace with `main` (a publisher writing spaces the deployed app reads,
# say) needs a channel that moves with every merge, or it falls behind
# the data format `main` writes.
#
# The build matches `cli-pin.yml`: the shipped `.#tonk-cli` package, the
# macOS binary Developer ID signed and notarized. The release follows
# `desktop-dev.yml`: a rolling tag moved in place, never a version tag,
# and a superseded build is skipped rather than published over a newer one.

permissions:
  contents: read

jobs:
  build:
    name: 'Build dev CLI'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: tonk-linux-x86_64
          - os: macos-latest
            artifact-name: tonk-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        if: runner.os == 'Linux'
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: 'Build tonk'
        run: nix build --accept-flake-config .#tonk-cli
      - name: 'Stage tonk artifact'
        run: |
          mkdir -p artifacts
          cp result/bin/tonk artifacts/tonk
          chmod 0755 artifacts/tonk
      - name: 'Sign and notarize macOS artifact'
        if: runner.os == 'macOS'
        uses: ./.github/actions/sign-notarize-macos
        with:
          binary-path: artifacts/tonk
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          app-store-connect-key: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/tonk
          overwrite: true

  publish:
    name: 'Publish dev release'
    needs: ['build']
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cli-dev-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tonk-macos-arm64
          path: artifacts/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: tonk-linux-x86_64
          path: artifacts/linux-x86_64
      # Assets are staged in `dist/`, not `release/`: the repository
      # tracks its own `release/` (the release policy), and those files must
      # not ride along into the upload.
      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp install.sh dist/install.sh
          # Archive each binary as `tonk` so it extracts ready to run,
          # with the executable bit preserved across the download.
          install -m 0755 artifacts/macos-arm64/tonk tonk
          tar -czf dist/tonk-macos-arm64.tar.gz tonk
          install -m 0755 artifacts/linux-x86_64/tonk tonk
          tar -czf dist/tonk-linux-x86_64.tar.gz tonk
          rm tonk
          (cd dist && sha256sum tonk-macos-arm64.tar.gz tonk-linux-x86_64.tar.gz > checksums.txt)
          version="$(grep -A30 '^\[workspace.package\]' Cargo.toml \
            | grep -m1 '^version' \
            | sed -E 's/.*"([^"]+)".*/\1/')"
          # `channel` must read `dev`: `tonk update` refuses a manifest
          # whose channel differs from the install's.
          cat > dist/manifest.json <<EOF
          {
            "version": "$version",
            "commit": "$GITHUB_SHA",
            "channel": "dev",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          python3 -c 'import json,sys; m=json.load(open("dist/manifest.json")); [sys.exit(f"manifest missing {k}") for k in ("version","commit","channel","built_at") if not m.get(k)]'
          cat dist/manifest.json
      - name: Publish current main build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Skipping superseded main build $GITHUB_SHA (current: $current)"
            exit 0
          fi
          tag=tonk-dev
          # The dev tag is intentionally rolling; never modify version tags.
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          fi
          notes="Latest tonk CLI built from main: $GITHUB_SHA.

          \`\`\`
          curl -fsSL https://github.com/$GH_REPO/releases/latest/download/install.sh | TONK_CHANNEL=dev sh
          \`\`\`

          The macOS binary is Developer ID signed and notarized by Apple. This build moves with every merge to main."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title 'tonk CLI (dev)' --notes "$notes" --prerelease --latest=false
          else
            gh release create "$tag" --verify-tag --title 'tonk CLI (dev)' --notes "$notes" --prerelease --latest=false
          fi
          gh release upload "$tag" dist/* --clobber
          # The release holds exactly this build's assets: drop any that
          # this build did not upload.
          gh release view "$tag" --json assets --jq '.assets[].name' \
            | while read -r asset; do
                [ -f "dist/$asset" ] || gh release delete-asset "$tag" "$asset" --yes
              done
