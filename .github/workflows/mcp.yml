name: MCP core

on:
  workflow_call:
    inputs:
      source-sha:
        type: string
        required: true
      version:
        type: string
        required: true
  workflow_dispatch:
  pull_request:
    paths: &mcp-paths
      - 'mcp/**'
      - 'rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - '.github/workflows/mcp.yml'
  push:
    branches: [main]
    paths: *mcp-paths

concurrency:
  group: mcp-core-${{ github.workflow }}-${{ inputs.version != '' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: MCP contracts and ordinary worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # nothing-but-nix gives reclaimed disk space to /nix, not the checkout.
      CARGO_HOME: /nix/var/tonk-mcp-cargo
      CARGO_TARGET_DIR: /nix/var/tonk-mcp-target
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha || github.sha }}
      - uses: actions/checkout@v4
        if: inputs.version != ''
        with:
          ref: ${{ github.sha }}
          path: .release-controller
          persist-credentials: false
      - name: Stamp the selected candidate
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: python3 .release-controller/scripts/release_stamp.py "$VERSION"
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Prepare Cargo build storage
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$CARGO_TARGET_DIR" "$CARGO_HOME"
          df -h / "$CARGO_TARGET_DIR"
      # Cachix caches Nix outputs, not the direct Cargo builds below. Keep
      # compatible dependency artifacts across source edits; Cargo still checks
      # fingerprints and both test commands always execute.
      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
          key: mcp-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'flake.lock', 'flake.nix', 'nix/**', '.cargo/**', '.github/workflows/mcp.yml') }}-${{ github.sha }}
          restore-keys: |
            mcp-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'flake.lock', 'flake.nix', 'nix/**', '.cargo/**', '.github/workflows/mcp.yml') }}-
      - name: Install locked MCP dependencies
        run: nix --accept-flake-config develop .#ci -c npm --prefix mcp ci --ignore-scripts
      - name: Check formatting, generated guides and core contracts
        run: |
          nix --accept-flake-config develop .#ci -c cargo fmt --all -- --check
          nix --accept-flake-config develop .#ci -c npm --prefix mcp run check:format
          nix --accept-flake-config develop .#ci -c npm --prefix mcp test
      - name: Test worker behavior, storage isolation and restart
        run: nix --accept-flake-config develop .#ci -c cargo test --locked --profile ci-test --timings -p tonk-worker --lib -- --test-threads=2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install independent Python MCP client
        run: |
          python -m venv "$RUNNER_TEMP/tonk-mcp-python"
          "$RUNNER_TEMP/tonk-mcp-python/bin/pip" install -r mcp/integration/requirements.txt
          echo "TONK_PYTHON=$RUNNER_TEMP/tonk-mcp-python/bin/python" >> "$GITHUB_ENV"
      - name: Build ordinary worker and test through MCP
        run: |
          nix --accept-flake-config develop .#ci -c cargo build --locked --profile ci-test --timings -p tonk-worker --features native-host --bin tonk-worker-host
          export TONK_WORKER_BINARY="$CARGO_TARGET_DIR/ci-test/tonk-worker-host"
          nix --accept-flake-config develop .#ci -c npm --prefix mcp run test:integration
      - name: Upload Cargo timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-cargo-timings
          path: ${{ env.CARGO_TARGET_DIR }}/cargo-timings
          if-no-files-found: ignore
          retention-days: 7
