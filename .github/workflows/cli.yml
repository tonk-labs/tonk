on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - stable

name: 'CLI'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cli:
    name: 'Build CLI'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: carry-cli-linux-x86_64
          - os: macos-latest
            artifact-name: carry-cli-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        if: runner.os == 'Linux'
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: 'Build carry-cli'
        run: nix build --accept-flake-config .#carry-cli
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: result/bin/carry

  test-cli:
    name: 'Integration Tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: 'Run CLI integration tests'
        run: |
          nix build --accept-flake-config .#tests-cli-integration
          TESTS_PATH=$(nix eval --accept-flake-config .#tests-cli-integration.outPath --raw)
          nix develop \
            --accept-flake-config \
            --set-env-var TMPDIR $RUNNER_TEMP \
            .#ci \
            --command cargo nextest run \
              --workspace-remap ./ \
              --archive-file "$TESTS_PATH/tests-cli-integration.tar.zst"

  publish-cli:
    name: 'Publish CLI'
    needs: ['build-cli', 'test-cli']
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/stable'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: carry-cli-macos-arm64
          path: artifacts/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: carry-cli-linux-x86_64
          path: artifacts/linux-x86_64
      - name: Prepare release assets
        run: |
          mv artifacts/macos-arm64/carry carry-macos-arm64
          mv artifacts/linux-x86_64/carry carry-linux-x86_64
          chmod +x carry-macos-arm64 carry-linux-x86_64
      - name: Create/update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest CLI Build
          body: |
            Rolling release of the carry CLI, built from the latest `stable` branch.

            **Download for your platform:**
            - macOS (Apple Silicon): `carry-macos-arm64`
            - Linux (x86_64): `carry-linux-x86_64`

            After downloading, make it executable: `chmod +x carry-*`
          prerelease: true
          make_latest: false
          files: |
            carry-macos-arm64
            carry-linux-x86_64
