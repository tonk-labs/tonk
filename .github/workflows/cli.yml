on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - stable
      - staging

name: 'CLI'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cli:
    name: 'Build CLI'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: tonk-linux-x86_64
          - os: macos-latest
            artifact-name: tonk-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        if: runner.os == 'Linux'
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: 'Build tonk'
        run: nix build --accept-flake-config .#tonk-cli
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: result/bin/tonk

  publish-staging:
    name: 'Publish Staging'
    needs: ['build-cli']
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tonk-macos-arm64
          path: artifacts/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: tonk-linux-x86_64
          path: artifacts/linux-x86_64
      - name: Prepare release assets
        run: |
          # Archive each binary as `tonk` so it extracts ready to run,
          # with the executable bit preserved across the download.
          install -m 0755 artifacts/macos-arm64/tonk tonk
          tar -czf tonk-macos-arm64.tar.gz tonk
          rm tonk
          install -m 0755 artifacts/linux-x86_64/tonk tonk
          tar -czf tonk-linux-x86_64.tar.gz tonk
          rm tonk
      - name: Delete existing staging release
        run: gh release delete tonk-staging --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Create staging release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tonk-staging
          name: tonk CLI (staging)
          body: |
            Rolling staging release of the tonk CLI, built from the latest `staging` branch.

            **Install this pre-release (macOS / Linux):**
            ```
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/tonk-staging/install.sh | TONK_CHANNEL=staging sh
            ```
            (Drop `TONK_CHANNEL=staging` to install the stable release.)

            **Or download manually:** grab the archive for your platform, then
            `tar xzf` it — the extracted `tonk` is ready to run.
            - macOS (Apple Silicon): `tonk-macos-arm64.tar.gz`
            - Linux (x86_64): `tonk-linux-x86_64.tar.gz`

            On macOS the binary is unsigned. The install script clears the
            Gatekeeper quarantine for you; if you extract by hand and macOS
            blocks it, run `xattr -d com.apple.quarantine tonk`.
          prerelease: true
          make_latest: false
          files: |
            tonk-macos-arm64.tar.gz
            tonk-linux-x86_64.tar.gz
            install.sh

  publish-stable:
    name: 'Publish Stable'
    needs: ['build-cli']
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/stable' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tonk-macos-arm64
          path: artifacts/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: tonk-linux-x86_64
          path: artifacts/linux-x86_64
      - name: Prepare release assets
        run: |
          # Archive each binary as `tonk` so it extracts ready to run,
          # with the executable bit preserved across the download.
          install -m 0755 artifacts/macos-arm64/tonk tonk
          tar -czf tonk-macos-arm64.tar.gz tonk
          rm tonk
          install -m 0755 artifacts/linux-x86_64/tonk tonk
          tar -czf tonk-linux-x86_64.tar.gz tonk
          rm tonk
      - name: Delete existing rolling release
        run: gh release delete tonk-latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Create rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tonk-latest
          name: tonk CLI (latest)
          body: |
            Rolling release of the tonk CLI, built from the latest `stable` branch.

            **Install (macOS / Linux):**
            ```
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh
            ```
            (Set `TONK_CHANNEL=staging` to install the latest pre-release instead.)

            **Or download manually:** grab the archive for your platform, then
            `tar xzf` it — the extracted `tonk` is ready to run.
            - macOS (Apple Silicon): `tonk-macos-arm64.tar.gz`
            - Linux (x86_64): `tonk-linux-x86_64.tar.gz`

            Canonical latest links (always resolve to this release):
            - https://github.com/${{ github.repository }}/releases/latest/download/tonk-macos-arm64.tar.gz
            - https://github.com/${{ github.repository }}/releases/latest/download/tonk-linux-x86_64.tar.gz

            On macOS the binary is unsigned. The install script clears the
            Gatekeeper quarantine for you; if you extract by hand and macOS
            blocks it, run `xattr -d com.apple.quarantine tonk`.
          prerelease: false
          make_latest: true
          files: |
            tonk-macos-arm64.tar.gz
            tonk-linux-x86_64.tar.gz
            install.sh
