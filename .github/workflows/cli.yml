on:
  pull_request:

name: 'CLI'

# Builds the CLI on every pull request. Releases build and publish it from
# their tag in `release.yml`.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cli:
    name: 'Build CLI'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: tonk-linux-x86_64
          - os: macos-latest
            artifact-name: tonk-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        if: runner.os == 'Linux'
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: 'Build tonk'
        run: nix build --accept-flake-config .#tonk-cli
      - name: 'Stage tonk artifact'
        run: |
          mkdir -p artifacts
          cp result/bin/tonk artifacts/tonk
          chmod 0755 artifacts/tonk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/tonk
