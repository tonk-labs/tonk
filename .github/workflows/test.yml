on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - stable

name: "Test"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  lint_nix:
    name: "Lint Nix"
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: DeterminateSystems/flake-checker-action@main
        with:
          send-statistics: false
          ignore-missing-flake-lock: false

  checks:
    name: 'Nix Checks'
    needs: ['lint_nix']
    runs-on: 'ubuntu-latest'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: cleave
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 'Run all checks (fmt, clippy, tests)'
        shell: bash
        run: |
          # Build all checks
          # SEE: https://github.com/NixOS/nix/issues/8881
          nix build -L .#checks.x86_64-linux.rustfmt
          nix build -L .#checks.x86_64-linux.clippy
          nix build -L .#checks.x86_64-linux.tests

  wasm-tests:
    name: 'WASM Browser Tests'
    needs: ['checks']
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: cleave
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 'Run WASM browser tests (Firefox headless)'
        shell: bash
        run: |
          nix build -L .#checks.x86_64-linux.wasm-tests

  node-tests:
    name: 'Node.js Integration Tests'
    needs: ['checks']
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: cleave
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 'Run Node.js integration tests'
        shell: bash
        run: |
          nix build -L .#checks.x86_64-linux.node-tests

  build:
    name: 'Build Packages'
    needs: ['checks']
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: cleave
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock') }}

      - name: 'Build all packages'
        shell: bash
        run: |
          # Build workspace
          nix build .#tonk-core
          nix build .#tonk-space
          nix build .#tonk-access-service
