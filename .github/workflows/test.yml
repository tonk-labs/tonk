on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - stable
      - staging

name: 'Test'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lints:
    name: 'Lints'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: DeterminateSystems/flake-checker-action@main
        with:
          send-statistics: false
          ignore-missing-flake-lock: false
      - name: 'Run lints'
        shell: bash
        run: |
          nix --accept-flake-config develop .#ci -c lint

  e2e-build:
    name: 'Build end-to-end test archive'
    runs-on: 'ubuntu-latest'
    # Build the source-dependent archive once. The shards below realize these
    # exact store paths from Cachix instead of racing three identical cold
    # builds on separate runners. This is independent of lint, so overlap the
    # two expensive prerequisites; shards still require both to succeed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
      - uses: wimpysworld/nothing-but-nix@main
        with:
          root-safe-haven: 40960
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: 'Build end-to-end test inputs'
        shell: bash
        run: nix build --accept-flake-config .#tonk-cli .#tests-e2e

  e2e-shard:
    name: 'End-to-end shard ${{ matrix.shard }}/3'
    needs: ['lints', 'e2e-build']
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        with:
          root-safe-haven: 40960
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: 'Map tonk.network to loopback'
        # The harness serves the app at https://tonk.network:{port} and
        # maps the name inside Chrome via --host-resolver-rules. Native
        # CLI processes spawned by the tests resolve through the system,
        # so they need the same mapping to reach the account remote the
        # browser-minted descriptor names.
        shell: bash
        run: echo '127.0.0.1 tonk.network' | sudo tee -a /etc/hosts
      - name: 'Run end-to-end tests'
        shell: bash
        env:
          TONK_E2E_DIAGNOSTICS_DIR: '${{ runner.temp }}/tonk-e2e-diagnostics'
        run: |
          nix develop --accept-flake-config .#ci --command test:e2e \
            --partition 'count:${{ matrix.shard }}/3'
      - name: 'Upload end-to-end timing diagnostics'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'e2e-diagnostics-${{ matrix.shard }}'
          path: '${{ runner.temp }}/tonk-e2e-diagnostics'
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    # Preserve the required-check context while the implementation is sharded.
    name: 'End-to-end account tests'
    needs: ['e2e-shard']
    if: always()
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      - name: 'Require every end-to-end shard'
        env:
          SHARD_RESULT: '${{ needs.e2e-shard.result }}'
        run: test "$SHARD_RESULT" = success

  service-worker:
    name: 'Service-worker lifecycle tests'
    needs: ['lints']
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: 'Run service-worker lifecycle tests'
        shell: bash
        run: |
          nix develop --accept-flake-config .#ci --command test:sw

  tests:
    name: 'Tests'
    needs: ['lints']
    runs-on: 'ubuntu-latest'
    timeout-minutes: 75
    strategy:
      matrix:
        platform: ["native", "web"]
        profile: ["debug", "release"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
      - uses: wimpysworld/nothing-but-nix@main
        with:
          # Reserve ~40 GB on / so the web test leg has temp headroom.
          root-safe-haven: 40960
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: 'Run tests'
        shell: bash
        run: |
          nix develop \
            --accept-flake-config \
            --set-env-var TMPDIR $RUNNER_TEMP \
            .#ci \
            --command test:${{matrix.platform}}:${{matrix.profile}}
