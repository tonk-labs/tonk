on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - stable

name: "Test"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      nix: ${{ steps.filter.outputs.nix }}
      wasm: ${{ steps.filter.outputs.wasm }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - '**/*.nix'
              - 'rust-toolchain.toml'
            wasm:
              - 'rust/tonk-core/**'
            node:
              - '**/package.json'
              - '**/bun.lock'
              - 'rust/tonk-core/examples/**'
              - 'rust/tonk-core/tests/**'

  lint_nix:
    name: "Lint Nix"
    needs: ["changes"]
    if: needs.changes.outputs.nix == 'true'
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: DeterminateSystems/flake-checker-action@main
        with:
          send-statistics: false
          ignore-missing-flake-lock: false

  lint_rust:
    name: "Lint Rust"
    needs: ["changes"]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.nix == 'true'
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: cleave
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: "Run lints"
        shell: bash
        run: |
          # We can't run checks by name
          # SEE: https://github.com/NixOS/nix/issues/8881
          nix build .#checks.x86_64-linux.rustfmt
          nix build .#checks.x86_64-linux.clippy

  rust_crates:
    name: "Rust Crates"
    needs: ["changes", "lint_rust"]
    if: |
      always() &&
      (needs.changes.outputs.rust == 'true' || needs.changes.outputs.nix == 'true') &&
      (needs.lint_rust.result == 'success' || needs.lint_rust.result == 'skipped')
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        include:
          - flags: ""
          - flags: "--release"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: cleave
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.flags }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-${{ runner.os }}-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            rust/tonk-core/examples/server/node_modules
            rust/tonk-core/examples/node/node_modules
            rust/tonk-core/examples/shared/node_modules
            rust/tonk-core/tests/node-sync/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('rust/tonk-core/examples/server/bun.lock', 'rust/tonk-core/examples/node/bun.lock', 'rust/tonk-core/examples/shared/package.json', 'rust/tonk-core/tests/node-sync/bun.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install Node.js dependencies for sync tests
        shell: bash
        run: |
          nix develop .#ci --command bash -c '
            echo "Installing Node.js dependencies for sync tests..."
            (cd rust/tonk-core/examples/server && bun install --frozen-lockfile)
            (cd rust/tonk-core/examples/node && bun install --frozen-lockfile)
            (cd rust/tonk-core/examples/shared && bun install --frozen-lockfile)
            (cd rust/tonk-core/tests/node-sync && bun install --frozen-lockfile)
          '

      - name: "Run `cargo test`"
        shell: bash
        run: |
          # Ensure we don't pick up a built-in chrome / chromedriver
          sudo apt-get remove google-chrome-stable -y || true
          sudo rm -f /usr/bin/chromium /usr/bin/chromium-browser

          # Run tests single-threaded to avoid mutex contention in samod crate
          # The samod crate uses std::sync::Mutex in async contexts, which can cause
          # deadlocks when multiple tests run in parallel on CI (Linux)
          nix build .#checks.x86_64-linux.tests

  wasm_build:
    name: "WASM Build"
    needs: ["changes", "lint_rust"]
    if: |
      always() &&
      (needs.changes.outputs.wasm == 'true' || needs.changes.outputs.nix == 'true') &&
      (needs.lint_rust.result == 'success' || needs.lint_rust.result == 'skipped')
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: cleave
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/tonk-core/target/
          key: wasm-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            wasm-cargo-${{ runner.os }}-
      - name: "Build WASM (Browser)"
        shell: bash
        run: |
          nix develop .#ci --command bash -c '
            cd rust/tonk-core
            echo "Building WASM for browser target..."
            wasm-pack build --target web --out-dir pkg-browser -- --features wasm-browser
          '
      - name: "Build WASM (Node.js)"
        shell: bash
        run: |
          nix develop .#ci --command bash -c '
            cd rust/tonk-core
            echo "Building WASM for Node.js target..."
            wasm-pack build --target nodejs --out-dir pkg-node -- --features wasm-node
          '
      - name: "Verify WASM outputs"
        run: |
          echo "Checking browser WASM..."
          test -f rust/tonk-core/pkg-browser/tonk_core.js
          test -f rust/tonk-core/pkg-browser/tonk_core_bg.wasm

          echo "Checking Node.js WASM..."
          test -f rust/tonk-core/pkg-node/tonk_core.js
          test -f rust/tonk-core/pkg-node/tonk_core_bg.wasm

          echo "WASM builds verified!"

      # Upload artifacts for use in test jobs
      - name: "Upload WASM artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          path: |
            rust/tonk-core/pkg-browser/
            rust/tonk-core/pkg-node/
          retention-days: 1

  wasm_integration_tests:
    name: "WASM Integration Tests"
    needs: ["changes", "wasm_build"]
    if: |
      always() &&
      needs.wasm_build.result == 'success'
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: cleave
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: "Download WASM artifacts"
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts
          path: rust/tonk-core/
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            rust/tonk-core/examples/node/node_modules
            rust/tonk-core/examples/shared/node_modules
          key: node-modules-integration-${{ runner.os }}-${{ hashFiles('rust/tonk-core/examples/node/bun.lock', 'rust/tonk-core/examples/shared/package.json') }}
          restore-keys: |
            node-modules-integration-${{ runner.os }}-
      - name: "Install test dependencies"
        shell: bash
        run: |
          nix develop .#ci --command bash -c '
            (cd rust/tonk-core/examples/node && bun install --frozen-lockfile)
            (cd rust/tonk-core/examples/shared && bun install --frozen-lockfile)
          '
      - name: "Run integration tests"
        shell: bash
        run: |
          nix develop .#ci --command bash -c '
            cd rust/tonk-core/examples/node
            # Run tests directly without rebuilding WASM (using artifacts instead)
            bunx mocha --timeout 10000 integration/*.test.js
          '

  wasm_sync_tests:
    name: "WASM Sync Tests"
    needs: ["changes", "wasm_build"]
    if: |
      always() &&
      needs.wasm_build.result == 'success'
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: cleave
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: "Download WASM artifacts"
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts
          path: rust/tonk-core/
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            rust/tonk-core/examples/server/node_modules
            rust/tonk-core/tests/node-sync/node_modules
          key: node-modules-sync-${{ runner.os }}-${{ hashFiles('rust/tonk-core/examples/server/bun.lock', 'rust/tonk-core/tests/node-sync/bun.lock') }}
          restore-keys: |
            node-modules-sync-${{ runner.os }}-
      - name: "Install test dependencies"
        shell: bash
        run: |
          nix develop .#ci --command bash -c '
            (cd rust/tonk-core/examples/server && bun install --frozen-lockfile)
            (cd rust/tonk-core/tests/node-sync && bun install --frozen-lockfile)
          '
      - name: "Run sync tests"
        shell: bash
        run: |
          nix develop .#ci --command bash -c '
            cd rust/tonk-core/tests/node-sync
            bun run test
          '

  all_tests:
    name: "All Tests"
    needs:
      [
        "changes",
        "lint_nix",
        "lint_rust",
        "rust_crates",
        "wasm_integration_tests",
        "wasm_sync_tests",
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Check results"
        run: |
          echo "Lint Nix: ${{ needs.lint_nix.result }}"
          echo "Lint Rust: ${{ needs.lint_rust.result }}"
          echo "Rust Crates: ${{ needs.rust_crates.result }}"
          echo "WASM Integration: ${{ needs.wasm_integration_tests.result }}"
          echo "WASM Sync: ${{ needs.wasm_sync_tests.result }}"

          # Fail if any job failed (but allow skipped)
          if [[ "${{ needs.lint_nix.result }}" == "failure" ]] || \
            [[ "${{ needs.lint_rust.result }}" == "failure" ]] || \
            [[ "${{ needs.rust_crates.result }}" == "failure" ]] || \
            [[ "${{ needs.wasm_integration_tests.result }}" == "failure" ]] || \
            [[ "${{ needs.wasm_sync_tests.result }}" == "failure" ]]; then
            echo "One or more jobs failed!"
            exit 1
          fi

          echo "All tests passed or were skipped appropriately!"
