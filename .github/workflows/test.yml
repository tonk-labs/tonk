on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - stable
      - staging

name: 'Test'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lints:
    name: 'Lints'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: DeterminateSystems/flake-checker-action@main
        with:
          send-statistics: false
          ignore-missing-flake-lock: false
      - name: 'Run lints'
        shell: bash
        run: |
          nix --accept-flake-config develop .#ci -c lint

  e2e:
    name: 'End-to-end account tests'
    needs: ['lints']
    runs-on: 'ubuntu-latest'
    # A cold build of the tests-e2e archive can take ~20 minutes before the
    # suite starts; a warm cachix hit cuts that to a download. Keep a bound
    # for wedged WebDriver or network calls while leaving headroom for
    # runner variance.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
      - uses: wimpysworld/nothing-but-nix@main
        with:
          root-safe-haven: 40960
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: 'Map tonk.network to loopback'
        # The harness serves the app at https://tonk.network:{port} and
        # maps the name inside Chrome via --host-resolver-rules. Native
        # CLI processes spawned by the tests resolve through the system,
        # so they need the same mapping to reach the account remote the
        # browser-minted descriptor names.
        shell: bash
        run: echo '127.0.0.1 tonk.network' | sudo tee -a /etc/hosts
      - name: 'Run end-to-end tests'
        shell: bash
        run: |
          nix develop --accept-flake-config .#ci --command test:e2e

  service-worker:
    name: 'Service-worker lifecycle tests'
    needs: ['lints']
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: 'Run service-worker lifecycle tests'
        shell: bash
        run: |
          nix develop --accept-flake-config .#ci --command test:sw

  tests:
    name: 'Tests'
    needs: ['lints']
    runs-on: 'ubuntu-latest'
    timeout-minutes: 75
    strategy:
      matrix:
        platform: ["native", "web"]
        profile: ["debug", "release"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
      - uses: wimpysworld/nothing-but-nix@main
        with:
          # Reserve ~40 GB on / so the web test leg has temp headroom.
          root-safe-haven: 40960
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: 'Run tests'
        shell: bash
        run: |
          nix develop \
            --accept-flake-config \
            --set-env-var TMPDIR $RUNNER_TEMP \
            .#ci \
            --command test:${{matrix.platform}}:${{matrix.profile}}
