on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - stable

name: 'Test'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lints:
    name: 'Lints'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/flake-checker-action@main
        with:
          send-statistics: false
          ignore-missing-flake-lock: false
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
      - name: 'Run lints'
        shell: bash
        run: |
          nix develop .#ci -c lint

  rust_crates:
    name: 'Rust Crates'
    needs: ['lints']
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        platform: ["native", "web"]
        profile: ["debug", "release"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
      - name: 'Run tests'
        shell: bash
        run: |
          # Ensure we don't pick up a built-in chrome / chromedriver
          # sudo apt-get remove google-chrome-stable -y
          # sudo rm /usr/bin/chromium /usr/bin/chromium-browser

          nix develop .#ci -c test:${{matrix.platform}}:${{matrix.profile}}