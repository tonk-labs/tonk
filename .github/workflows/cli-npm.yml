name: 'CLI npm'

# Prereleases are dispatched at their immutable `v*` tag and publish to
# npm's `next` channel. Finals publish to `latest` only when `stable` is
# fast-forwarded to the exact tagged release commit.
#
# Manual dispatch against a release tag is the recovery path for either
# lifecycle. The policy below still requires that a final is held by
# stable; selecting a ref or supplying a version never grants authority.
on:
  push:
    branches:
      - stable
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Leave empty to use the ref Cargo workspace version.'
        required: false
        type: string

concurrency:
  group: cli-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 'Resolve version'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      dist-tag: ${{ steps.resolve.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Derive and validate version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Single version source: whatever we publish must match the
          # Cargo workspace version of the checked-out commit.
          cargo_version="$(grep -A30 '^\[workspace.package\]' Cargo.toml \
            | grep -m1 '^version' \
            | sed -E 's/.*"([^"]+)".*/\1/')"

          version="$cargo_version"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_VERSION:-}" ]]; then
            requested_version="${INPUT_VERSION#v}"
            if [[ "$requested_version" != "$cargo_version" ]]; then
              echo "::error::requested version $requested_version does not match Cargo workspace version $cargo_version"
              exit 1
            fi
          fi

          # A tag-based dispatch does not reliably populate the remote
          # branch ref, so resolve stable explicitly rather than infer it
          # from the event. Tags were fetched by checkout above.
          git fetch --no-tags origin \
            refs/heads/stable:refs/remotes/origin/stable

          checkout_sha="$(git rev-parse HEAD)"
          if ! tag_sha="$(git rev-parse -q --verify "refs/tags/v$version^{commit}")"; then
            echo "::error::tag v$version does not exist; every npm publication must use an immutable release tag"
            exit 1
          fi
          stable_sha="$(git rev-parse 'refs/remotes/origin/stable^{commit}')"

          dist_tag="$(node rust/tonk-cli/npm/channel-policy.mjs \
            "$version" "$checkout_sha" "$tag_sha" "$stable_sha")"

          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

          echo "Publishing $version to npm dist-tag '$dist_tag'"

  build:
    name: 'Build ${{ matrix.artifact-name }}'
    needs: ['prepare']
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: tonk-linux-x86_64
          - os: macos-latest
            artifact-name: tonk-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: wimpysworld/nothing-but-nix@main
        if: runner.os == 'Linux'

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: 'Build tonk'
        run: nix build --accept-flake-config .#tonk-cli

      - name: 'Stage tonk artifact'
        run: |
          mkdir -p artifacts
          cp result/bin/tonk artifacts/tonk
          chmod 0755 artifacts/tonk

      - name: 'Sign and notarize macOS artifact'
        if: runner.os == 'macOS'
        uses: ./.github/actions/sign-notarize-macos
        with:
          binary-path: artifacts/tonk
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          app-store-connect-key: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/tonk

  publish:
    name: 'Publish to npm'
    needs: ['prepare', 'build']
    runs-on: ubuntu-latest

    # `id-token: write` allows GitHub to mint the OIDC token that npm
    # exchanges for a short-lived publishing credential.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # npm Trusted Publishing requires Node >= 22.14.0.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing requires npm >= 11.5.1.
      # Installing npm 11 explicitly keeps the workflow independent of
      # whichever npm minor version happens to ship with the Node image.
      - name: Ensure OIDC-capable npm
        run: |
          npm install --global 'npm@^11.5.1'
          node --version
          npm --version

      - uses: actions/download-artifact@v4
        with:
          name: tonk-macos-arm64
          path: artifacts/darwin-arm64

      - uses: actions/download-artifact@v4
        with:
          name: tonk-linux-x86_64
          path: artifacts/linux-x64

      - name: Assemble platform packages
        working-directory: rust/tonk-cli/npm
        run: |
          set -euo pipefail

          install -Dm0755 \
            "$GITHUB_WORKSPACE/artifacts/darwin-arm64/tonk" \
            darwin-arm64/bin/tonk

          install -Dm0755 \
            "$GITHUB_WORKSPACE/artifacts/linux-x64/tonk" \
            linux-x64/bin/tonk

      - name: Stamp version
        working-directory: rust/tonk-cli/npm
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          for dir in darwin-arm64 linux-x64 cli; do
            (
              cd "$dir"
              npm version "$VERSION" \
                --no-git-tag-version \
                --allow-same-version
            )
          done

          # Pin the wrapper's optionalDependencies to the same version.
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const p = "cli/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));

            for (const k of Object.keys(j.optionalDependencies || {})) {
              j.optionalDependencies[k] = v;
            }

            fs.writeFileSync(
              p,
              JSON.stringify(j, null, 2) + "\n"
            );
          '

      - name: Publish
        working-directory: rust/tonk-cli/npm
        env:
          TAG: ${{ needs.prepare.outputs.dist-tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          # Platform packages first: the wrapper's optionalDependencies
          # point at them, so they must exist before it resolves.
          #
          # npm automatically detects the GitHub Actions OIDC environment
          # for `npm publish`; no npm token or OTP is required.
          #
          # The `./` prefix is required — a bare name like `darwin-arm64`
          # is parsed as a registry package spec, not a local directory.
          for dir in darwin-arm64 linux-x64 cli; do
            name="$(node -p "require('./$dir/package.json').name")"

            # npm never allows a version to be republished, so a retry
            # after a partial failure has to step over what already
            # landed instead of dying on the first conflict.
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already published, skipping"
              continue
            fi

            npm publish "./$dir" \
              --access public \
              --tag "$TAG"
          done
