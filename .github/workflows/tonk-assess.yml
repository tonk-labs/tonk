on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rust/tonk-assess/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches:
      - stable
    paths:
      - 'rust/tonk-assess/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

name: 'tonk-assess'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: tonk-assess-linux-x86_64
          - os: macos-latest
            artifact-name: tonk-assess-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        if: runner.os == 'Linux'
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: 'Build tonk-assess'
        run: nix build --accept-flake-config .#tonk-assess
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: result/bin/tonk-assess

  publish:
    name: 'Publish'
    needs: ['build']
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/stable'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tonk-assess-macos-arm64
          path: artifacts/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: tonk-assess-linux-x86_64
          path: artifacts/linux-x86_64
      - name: Prepare release assets
        run: |
          mv artifacts/macos-arm64/tonk-assess tonk-assess-macos-arm64
          mv artifacts/linux-x86_64/tonk-assess tonk-assess-linux-x86_64
          chmod +x tonk-assess-macos-arm64 tonk-assess-linux-x86_64
      - name: Create/update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tonk-assess-latest
          name: Latest tonk-assess Build
          body: |
            Rolling release of tonk-assess, built from the latest `stable` branch.

            **Download for your platform:**
            - macOS (Apple Silicon): `tonk-assess-macos-arm64`
            - Linux (x86_64): `tonk-assess-linux-x86_64`

            After downloading, make it executable: `chmod +x tonk-assess-*`
          prerelease: true
          make_latest: false
          files: |
            tonk-assess-macos-arm64
            tonk-assess-linux-x86_64
