name: Deploy isolated MCP evaluation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full immutable main SHA containing this evaluation deployment support
        required: true
        type: string
      eval_suffix:
        description: Fresh eval- suffix; cannot name an existing worker or bucket
        required: true
        type: string

concurrency:
  group: mcp-eval-${{ inputs.eval_suffix }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate pinned evaluation source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      EVAL_SUFFIX: ${{ inputs.eval_suffix }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Check out trusted main for input validation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable source and fresh suffix
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EVAL_SUFFIX" =~ ^eval-[a-z0-9][a-z0-9-]{4,29}[a-z0-9]$ ]]
          git fetch --no-tags origin main
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git cat-file -e "$SOURCE_SHA:mcp/hosted/cloudflare/eval-deployment.mjs"
          git cat-file -e "$SOURCE_SHA:mcp/hosted/cloudflare/prepare-eval-deployment.mjs"
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  agent-worker:
    name: Build pinned MCP runtime
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: rust:1.93.0-bookworm
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Check out the validated immutable source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the workspace checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Confirm exact checked-out source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.source_sha }}"
      - name: Install runtime build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libssl-dev clang cmake zstd
      - name: Build the pinned agent worker
        run: cargo build --locked --release -p tonk-worker --features native-host --bin tonk-agent-worker
      - name: Require executable pinned agent worker
        run: test -x target/release/tonk-agent-worker
      - uses: actions/upload-artifact@v4
        with:
          name: tonk-agent-worker-${{ needs.validate.outputs.source_sha }}
          path: target/release/tonk-agent-worker
          if-no-files-found: error
          retention-days: 3

  assets:
    name: Build pinned MCP browser assets
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build MCP assets from the pinned source
        run: |
          nix build --accept-flake-config .#tonk-cloudflare-artifacts
          TONK_UI_DIST="$PWD/result/tonk-ui" nix --accept-flake-config develop .#ci --command \
            node mcp/hosted/build-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-browser-assets-${{ needs.validate.outputs.source_sha }}
          path: mcp/hosted/public
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Pinned isolated MCP evaluation
    needs: [validate, agent-worker, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TONK_PROVIDER_ORIGIN: https://tonk.foundation
      EVAL_SUFFIX: ${{ inputs.eval_suffix }}
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    steps:
      - name: Check out the validated immutable source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact checked-out source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f mcp/hosted/cloudflare/prepare-eval-deployment.mjs
          test -f mcp/hosted/cloudflare/eval-deployment.mjs
      - uses: actions/download-artifact@v4
        with:
          name: tonk-agent-worker-${{ needs.validate.outputs.source_sha }}
          path: target/release
      - name: Make the pinned agent worker executable
        run: chmod 0755 target/release/tonk-agent-worker
      - name: Require executable pinned agent worker
        run: test -x target/release/tonk-agent-worker
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Docker and Node deployment prerequisites
        run: |
          set -euo pipefail
          node --version
          npm --version
          npx --version
          docker --version
          docker info >/dev/null
      - name: Install MCP deployment dependencies
        run: |
          npm ci --prefix mcp --ignore-scripts
          npm ci --prefix mcp/hosted/cloudflare
          cd mcp
          node -e "import('@modelcontextprotocol/client')"
      - uses: actions/download-artifact@v4
        with:
          name: mcp-browser-assets-${{ needs.validate.outputs.source_sha }}
          path: mcp/hosted/public
      - name: Test isolated deployment configuration
        run: |
          node --test mcp/hosted/cloudflare/eval-deployment.test.mjs
      - name: Read account workers.dev subdomain
        id: account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -er 'if .success == true then .result.subdomain else error("workers subdomain lookup failed") end' <<<"$response")"
          [[ "$subdomain" =~ ^[a-z0-9-]+$ ]]
          printf 'subdomain=%s\n' "$subdomain" >> "$GITHUB_OUTPUT"
      - name: Create isolated configuration and checkpoint bucket
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SUBDOMAIN: ${{ steps.account.outputs.subdomain }}
          BUILD_COMMIT: ${{ needs.validate.outputs.source_sha }}
        run: node mcp/hosted/cloudflare/prepare-eval-deployment.mjs
      - name: Deploy isolated MCP worker and container
        working-directory: mcp/hosted/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config wrangler.eval.generated.json
      - name: Smoke the exact deployed build
        env:
          MCP_ISSUER: ${{ steps.config.outputs.issuer }}
          BUILD_COMMIT: ${{ needs.validate.outputs.source_sha }}
        run: node mcp/hosted/cloudflare/smoke.mjs
      - name: Record non-secret deployment identity
        run: |
          {
            echo '### Isolated MCP evaluation deployment'
            echo
            echo "- source SHA: \`${{ needs.validate.outputs.source_sha }}\`"
            echo "- worker: \`${{ steps.config.outputs.worker }}\`"
            echo "- checkpoint bucket: \`${{ steps.config.outputs.bucket }}\`"
            echo "- issuer: \`${{ steps.config.outputs.issuer }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
