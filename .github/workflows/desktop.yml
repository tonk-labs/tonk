on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

name: 'Desktop'

# Builds the desktop app for download: on every merge to main, by hand from
# the Actions tab (pick the branch to build), and on a pull request that
# carries the `build desktop` label. The label stands in for a manual run on
# a pull request whose branch adds or changes this workflow, which the
# Actions tab only offers once the workflow is on main.
#
# Where to download a build: a pull request gets a comment linking it (a
# manual run comments on the open pull request for its branch, if any), a
# merge to main replaces the `desktop-latest` pre-release, and every run
# lists its links in the run summary.
#
# The UI bundle is built once with Nix. The app itself is built with Cargo
# on each platform rather than with Nix: it links the system webview
# (WebKitGTK on Linux), and a Nix build would link it from /nix/store, which
# does not run on an ordinary distribution.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ui:
    name: 'Build UI bundle'
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build desktop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: 'Build tonk-ui'
        run: nix build --accept-flake-config .#tonk-ui
      - name: 'Stage UI bundle'
        run: |
          mkdir -p artifacts
          cp -rL result artifacts/dist
          chmod -R u+w artifacts/dist
          test -f artifacts/dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: tonk-desktop-ui
          path: artifacts/dist
          retention-days: 1

  build-desktop:
    name: 'Build desktop app'
    needs: build-ui
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: tonk-desktop-linux-x86_64
          - os: macos-latest
            artifact-name: tonk-desktop-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: 'Install WebKitGTK'
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/tonk-desktop -> target
      - name: 'Build tonk-desktop'
        working-directory: rust/tonk-desktop
        run: cargo build --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: tonk-desktop-ui
          path: package/tonk-desktop/dist
      - name: 'Package tonk-desktop'
        # A tarball keeps the executable bit, which an uploaded artifact drops.
        run: |
          cp rust/tonk-desktop/target/release/tonk-desktop package/tonk-desktop/
          chmod 0755 package/tonk-desktop/tonk-desktop
          tar -czf ${{ matrix.artifact-name }}.tar.gz -C package tonk-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.tar.gz

  announce:
    name: 'Share download links'
    needs: build-desktop
    if: ${{ !cancelled() && needs.build-desktop.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Link the builds
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId,
            });
            const link = (name, label) => {
              const artifact = data.artifacts.find((artifact) => artifact.name === name);
              return artifact
                ? `- [${label}](${run}/artifacts/${artifact.id})`
                : `- ${label}: did not build, see the [run](${run})`;
            };
            const sha = context.payload.pull_request?.head.sha ?? context.sha;
            const body = [
              '<!-- tonk-desktop-builds -->',
              `**Desktop builds of \`${sha.slice(0, 7)}\`** · [run](${run})`,
              '',
              link('tonk-desktop-macos-arm64', 'macOS (Apple Silicon)'),
              link('tonk-desktop-linux-x86_64', 'Linux x86_64'),
              '',
              'Each download is a zip holding a tarball. Unzip it, then:',
              '',
              '```',
              'tar -xzf tonk-desktop-*.tar.gz',
              'xattr -dr com.apple.quarantine tonk-desktop   # macOS only: the build is unsigned',
              './tonk-desktop/tonk-desktop',
              '```',
              '',
              'Linux needs WebKitGTK 4.1 (`libwebkit2gtk-4.1-0` on Debian and Ubuntu).',
            ].join('\n');
            await core.summary.addRaw(body).write();

            let number = context.payload.pull_request?.number;
            if (!number && context.eventName === 'workflow_dispatch') {
              const branch = context.ref.replace('refs/heads/', '');
              const { data: open } = await github.rest.pulls.list({
                owner, repo, state: 'open', head: `${owner}:${branch}`,
              });
              number = open[0]?.number;
            }
            if (!number) return;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number,
            });
            const previous = comments.find((comment) =>
              comment.body?.startsWith('<!-- tonk-desktop-builds -->'));
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: number, body,
              });
            }

      # The rolling pre-release gives builds of main a link that does not
      # move. It is never marked latest: the CLI updater resolves
      # `releases/latest`.
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push' && needs.build-desktop.result == 'success'
        with:
          name: tonk-desktop-macos-arm64
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push' && needs.build-desktop.result == 'success'
        with:
          name: tonk-desktop-linux-x86_64
      - name: Delete the rolling desktop release
        if: github.event_name == 'push' && needs.build-desktop.result == 'success'
        run: gh release delete desktop-latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Publish the rolling desktop release
        if: github.event_name == 'push' && needs.build-desktop.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          target_commitish: ${{ github.sha }}
          name: tonk desktop (latest main)
          body: |
            The desktop app built from `${{ github.sha }}` on main. Replaced on every merge.

            Unsigned builds. After extracting on macOS, clear the quarantine flag:
            `xattr -dr com.apple.quarantine tonk-desktop`. Linux needs WebKitGTK 4.1.
          prerelease: true
          make_latest: false
          files: |
            tonk-desktop-macos-arm64.tar.gz
            tonk-desktop-linux-x86_64.tar.gz
