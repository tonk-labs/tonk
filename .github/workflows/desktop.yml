on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

name: 'Desktop'

# Builds the desktop app for download: on every merge to main, by hand from
# the Actions tab (pick the branch to build), and on a pull request that
# carries the `build desktop` label. The label stands in for a manual run on
# a pull request whose branch adds or changes this workflow, which the
# Actions tab only offers once the workflow is on main.
#
# The UI bundle is built once with Nix. The app itself is built with Cargo
# on each platform rather than with Nix: it links the system webview
# (WebKitGTK on Linux), and a Nix build would link it from /nix/store, which
# does not run on an ordinary distribution.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ui:
    name: 'Build UI bundle'
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build desktop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-test-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: 'Build tonk-ui'
        run: nix build --accept-flake-config .#tonk-ui
      - name: 'Stage UI bundle'
        run: |
          mkdir -p artifacts
          cp -rL result artifacts/dist
          chmod -R u+w artifacts/dist
          test -f artifacts/dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: tonk-desktop-ui
          path: artifacts/dist
          retention-days: 1

  build-desktop:
    name: 'Build desktop app'
    needs: build-ui
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: tonk-desktop-linux-x86_64
          - os: macos-latest
            artifact-name: tonk-desktop-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: 'Install WebKitGTK'
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/tonk-desktop -> target
      - name: 'Build tonk-desktop'
        working-directory: rust/tonk-desktop
        run: cargo build --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: tonk-desktop-ui
          path: package/tonk-desktop/dist
      - name: 'Package tonk-desktop'
        # A tarball keeps the executable bit, which an uploaded artifact drops.
        run: |
          cp rust/tonk-desktop/target/release/tonk-desktop package/tonk-desktop/
          chmod 0755 package/tonk-desktop/tonk-desktop
          tar -czf ${{ matrix.artifact-name }}.tar.gz -C package tonk-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.tar.gz
