name = "tonk-mcp-test"
main = "worker.mjs"
compatibility_date = "2026-10-07"
account_id = "5f20ca8a0de0a5ac52a14fa8bf9c90db"
workers_dev = true
routes = []

[[containers]]
class_name = "TonkRuntime"
image = "./Dockerfile.worker"
image_build_context = "../../.."
max_instances = 1
instance_type = "basic"

[[durable_objects.bindings]]
name = "RUNTIME"
class_name = "TonkRuntime"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TonkRuntime"]

[[r2_buckets]]
binding = "CHECKPOINTS"
bucket_name = "tonk-mcp-test-checkpoints"

# Set these through `wrangler secret put --config mcp/hosted/cloudflare/wrangler.toml`:
# TONK_MCP_ISSUER. Each tool call supplies an agent_link.
# Request logging stays disabled because tool inputs contain private links.
[observability]
enabled = false

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[vars]
TONK_PROVIDER_ORIGIN = "https://tonk.foundation"
