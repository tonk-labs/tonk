# Independent client implementation for hosted interoperability acceptance.
# Kept out of the main workspace: it is a test client, not part of tonk.
[package]
name = "tonk-mcp-rust-client"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util"] }
