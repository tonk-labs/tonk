<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Tonk notebook</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.6 system-ui, sans-serif; }
  body { margin: 0; padding: 22px; background: light-dark(#fafaf7, #21211f); color: light-dark(#242421, #eeeeea); }
  header { display: flex; align-items: start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .eyebrow { color: light-dark(#62625a, #babab0); font-size: 13px; margin: 0 0 5px; }
  h1 { font-size: 21px; line-height: 1.3; margin: 0; overflow-wrap: anywhere; }
  nav { display: flex; gap: 8px; flex-wrap: wrap; }
  button, a { font: inherit; color: inherit; }
  nav button, nav a { background: transparent; border: 1px solid light-dark(#b5b5aa, #77776f); border-radius: 8px; padding: 8px 13px; min-height: 44px; box-sizing: border-box; cursor: pointer; text-decoration: none; }
  :focus-visible { outline: 2px solid light-dark(#345dc4, #a2b7ff); outline-offset: 3px; }
  button:disabled { opacity: .5; cursor: default; }
  [hidden] { display: none !important; }
  #status, #warning, footer { font-size: 13px; color: light-dark(#62625a, #babab0); }
  #status { min-height: 21px; margin: 12px 0; }
  #warning { border-left: 3px solid #a57630; padding-left: 10px; }
  #document { border-top: 1px solid light-dark(#deded5, #474741); padding-top: 12px; min-height: 60px; overflow-wrap: anywhere; }
  #document .ProseMirror { outline: none; }
  #document pre { overflow-x: auto; padding: 12px; background: light-dark(#eeeee8, #2c2c28); border-radius: 6px; }
  footer { border-top: 1px solid light-dark(#deded5, #474741); margin-top: 20px; padding-top: 12px; }
</style>
<header><div><p class="eyebrow">Tonk notebook · Read-only</p><h1 id="title">Notebook</h1></div><nav aria-label="Notebook actions"><button id="refresh" disabled>Refresh</button><a id="open" hidden target="_blank" rel="noopener noreferrer">Open in Tonk</a></nav></header>
<p id="status" role="status">Connecting to Tonk…</p>
<p id="warning" hidden></p>
<main id="document" aria-label="Notebook content"></main>
<footer>Live query cells appear as source in this preview. Open in Tonk to run or edit them.</footer>
<script>/* TONK_RENDERER */</script>
<script>
(() => {
  const title = document.querySelector('#title'), status = document.querySelector('#status');
  const content = document.querySelector('#document'), warning = document.querySelector('#warning');
  const refresh = document.querySelector('#refresh'), open = document.querySelector('#open');
  let editor, entity, ready = false, busy = false, nextId = 0, generation = 0;
  const pending = new Map();
  function request(method, params) {
    return new Promise((resolve, reject) => {
      const id = ++nextId;
      const timer = setTimeout(() => { pending.delete(id); reject(new Error('The connection timed out. Try refreshing.')); }, 65000);
      pending.set(id, { resolve, reject, timer });
      parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
    });
  }
  function render(response) {
    if (response?.isError) throw new Error(response.content?.find(item => item.type === 'text')?.text || 'Could not read the notebook.');
    const data = response?.structuredContent;
    if (typeof data?.entity !== 'string' || typeof data?.markdown !== 'string' || typeof data?.title !== 'string' || !Array.isArray(data?.blocks)) throw new Error('Invalid notebook response.');
    entity = data.entity; title.textContent = data.title;
    if (!editor) editor = TonkProse.createEditor(content, { doc: data.markdown, readOnly: true, placeholder: 'This notebook is empty.', onChange: () => {} });
    else editor.setMarkdown(data.markdown);
    open.hidden = true; open.removeAttribute('href');
    if (data.url) {
      const url = new URL(data.url);
      if (url.origin === 'https://tonk.foundation' && url.pathname.startsWith('/space/') && !url.search && !url.hash) {
        open.href = url.href; open.hidden = false;
        window.openai?.setOpenInAppUrl?.({ href: url.href });
      }
    }
    const count = data.blocks.length;
    status.textContent = `${count} ${count === 1 ? 'block' : 'blocks'} · Read from Tonk`;
    warning.hidden = !data.unplacedBlocks;
    warning.textContent = data.unplacedBlocks ? `${data.unplacedBlocks} unplaced ${data.unplacedBlocks === 1 ? 'block is' : 'blocks are'} not part of this notebook’s visible sequence.` : '';
    refresh.disabled = !ready || busy;
  }
  addEventListener('message', event => {
    if (event.source !== parent || event.data?.jsonrpc !== '2.0') return;
    const message = event.data;
    if (message.id != null && pending.has(message.id)) {
      const item = pending.get(message.id); pending.delete(message.id); clearTimeout(item.timer);
      message.error ? item.reject(new Error(message.error.message || 'Connection failed.')) : item.resolve(message.result);
    } else if (message.method === 'ui/notifications/tool-result') {
      generation++;
      try { render(message.params); } catch (error) { status.textContent = error.message; }
    }
  });
  open.addEventListener('click', event => {
    if (window.openai?.openExternal) { event.preventDefault(); window.openai.openExternal({ href: open.href, redirectUrl: false }); }
  });
  // Markdown links are not navigation controls for this bounded preview.
  content.addEventListener('click', event => { if (event.target.closest?.('a')) event.preventDefault(); });
  refresh.addEventListener('click', async () => {
    if (!ready || busy || !entity) return;
    const started = ++generation;
    busy = true; refresh.disabled = true; status.textContent = 'Refreshing…';
    try {
      const response = await request('tools/call', { name: 'tonk_show_notebook', arguments: { entity } });
      if (started === generation) render(response);
    } catch (error) { if (started === generation) status.textContent = `Refresh failed. Showing the previous snapshot. ${error.message}`; }
    finally { busy = false; refresh.disabled = !ready || !entity; }
  });
  request('ui/initialize', { appInfo: { name: 'tonk-notebook', version: '0.1.0' }, appCapabilities: {}, protocolVersion: '2026-01-26' })
    .then(() => { ready = true; refresh.disabled = !entity; if (!entity) status.textContent = 'Waiting for notebook…'; parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/initialized', params: {} }, '*'); })
    .catch(error => { status.textContent = error.message; });
})();
</script>
</html>
