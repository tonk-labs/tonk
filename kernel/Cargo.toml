# A Tonk kernel and the host that runs it: a Wasm component for the world
# `sapling:kernel`, and the embedder a space's service worker drives on the
# Wasm Component Model Polyfill. Its own workspace: the kernel builds on the
# latest Dialog for `wasm32-wasip3`, which the main workspace does not.
[workspace]
resolver = "2"
members = ["guest", "host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
dialog-artifacts = { git = "https://github.com/dialog-db/dialog-db", branch = "feat/credential-generate" }
dialog-capability = { git = "https://github.com/dialog-db/dialog-db", branch = "feat/credential-generate" }
dialog-common = { git = "https://github.com/dialog-db/dialog-db", branch = "feat/credential-generate" }
dialog-credentials = { git = "https://github.com/dialog-db/dialog-db", branch = "feat/credential-generate" }
dialog-effects = { git = "https://github.com/dialog-db/dialog-db", branch = "feat/credential-generate" }
dialog-peer = { git = "https://github.com/dialog-db/dialog-db", branch = "feat/credential-generate" }
dialog-query = { git = "https://github.com/dialog-db/dialog-db", branch = "feat/credential-generate" }
dialog-repository = { git = "https://github.com/dialog-db/dialog-db", branch = "feat/credential-generate" }
dialog-storage = { git = "https://github.com/dialog-db/dialog-db", branch = "feat/credential-generate" }
dialog-ucan-core = { git = "https://github.com/dialog-db/dialog-db", branch = "feat/credential-generate" }
dialog-varsig = { git = "https://github.com/dialog-db/dialog-db", branch = "feat/credential-generate" }
wcmp = { git = "https://github.com/dialog-db/wasm-component-model-polyfill", rev = "ebda220" }
wcmp-wasm-core-wasmtime = { git = "https://github.com/dialog-db/wasm-component-model-polyfill", rev = "ebda220" }
wcmp-wasm-core-web = { git = "https://github.com/dialog-db/wasm-component-model-polyfill", rev = "ebda220" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The release build, for a profile of the host.
[profile.profiling]
inherits = "release"
