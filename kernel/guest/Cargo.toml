[package]
name = "tonk-kernel"
description = "A Tonk kernel: a component for the world sapling:kernel, on the latest Dialog"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
axum = { version = "0.8", default-features = false }
http-body-util = "0.1"
tonk-kernel-world = { path = "../../rust/tonk-kernel-world" }
tonk-worker = { path = "../../rust/tonk-worker" }
tower = { version = "0.5", features = ["util"] }
wit-bindgen = { version = "0.61.1", features = ["async-spawn", "inter-task-wakeup"] }
