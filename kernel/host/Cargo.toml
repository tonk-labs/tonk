[package]
name = "kernel-host"
description = "The embedder of a kernel: runs a component for the world sapling:kernel on the Wasm Component Model Polyfill, natively or in a service worker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1"
bs58 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
getrandom = "0.2"
tracing = "0.1"
wcmp.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time", "macros", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = { version = "0.3", default-features = false, features = ["std"] }
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
wcmp-wasm-core-web.workspace = true
web-sys = { version = "0.3", features = ["console", "Window", "WorkerGlobalScope", "Performance"] }

# The native tests run a kernel on Wasmtime's core engine.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_json = "1"
wasmparser = { version = "0.258", default-features = false, features = ["std", "component-model"] }
wcmp-wasm-core-wasmtime.workspace = true
