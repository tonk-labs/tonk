name = "tonk-access-service"
main = "./result/tonk-access-service/worker/shim.mjs"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

routes = [{ pattern = "tonk.network", custom_domain = true }]

[build]
command = "nix build .#tonk-cloudflare-artifacts"

[assets]
directory = "./result/tonk-ui"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = [
  "/.well-known/tonk",
  "/.well-known/did.json",
  "/@",
  "/@/*",
  "/customer/*",
  "/ucan",
  "/ucan/*",
]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tonk-spaces"

# Control state for customer registration: customers, consumers, and
# plans. Registration commands answer 500 while this binding is absent or
# empty; the presign path never touches it.
#
# Ships empty: the id is minted once at bootstrap via `wrangler d1 create
# tonk-access-control` and filled in here. Wrangler refuses to deploy
# without it, so a forgotten bootstrap breaks visibly. The worker also
# needs two secrets set via `wrangler secret put`: SERVICE_SECRET_KEY
# (32 hex-encoded seed bytes for the service's signing identity) and
# RESEND_API_KEY (activation email delivery).
[[d1_databases]]
binding = "CONTROL"
database_name = "tonk-access-control"
database_id = "3146eac9-ea9c-44b4-a1f7-d06e10927ffd"
migrations_dir = "rust/tonk-access-service/migrations"

# Ingest: one row per invocation, metering's write path. Separate from
# control so bulky invocation rows get their own 10 GB ceiling and can
# later rotate. The hot path logs and continues when the binding is
# absent; the presign path never depends on it.
[[d1_databases]]
binding = "INGEST"
database_name = "tonk-access-ingest"
database_id = "1cf85093-7a8c-4737-9d8e-607b55bf719a"
migrations_dir = "rust/tonk-access-service/migrations-ingest"

# Revocation index: one key per (revoked delegation, revoking subject),
# value empty, because the key is the fact. KV has no compare-and-swap,
# so a set under one key would let two principals revoking the same
# delegation clobber each other; distinct keys cannot collide.
#
# Ships empty: the id is minted once via `wrangler kv namespace create
# REVOCATIONS_KV` and filled in here.
[[kv_namespaces]]
binding = "REVOCATIONS_KV"
id = "REPLACED-AT-BOOTSTRAP"

[vars]
R2_ACCOUNT_ID = "5f20ca8a0de0a5ac52a14fa8bf9c90db"
R2_BUCKET_NAME = "tonk-spaces"
ACCOUNT_SERVICE_URL = "https://accounts.tonk.xyz"
REVOCATION_RELAY_URL = "https://accounts.tonk.xyz/revocations"
EMAIL_FROM = "tonk <accounts@tonk.xyz>"

[env.staging]
routes = [{ pattern = "staging.tonk.xyz", custom_domain = true }]

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "tonk-spaces-staging"

# Ships empty, as production's did; filled at bootstrap so there is no way
# to silently deploy staging against the production database.
[[env.staging.d1_databases]]
binding = "CONTROL"
database_name = "tonk-access-control-staging"
database_id = "757da52f-4b40-4534-8b2d-7c8122e245df"
migrations_dir = "rust/tonk-access-service/migrations"

[[env.staging.d1_databases]]
binding = "INGEST"
database_name = "tonk-access-ingest-staging"
database_id = "ebcef6f8-0910-45e4-a7d7-48976068b0ba"
migrations_dir = "rust/tonk-access-service/migrations-ingest"

[[env.staging.kv_namespaces]]
binding = "REVOCATIONS_KV"
id = "REPLACED-AT-BOOTSTRAP"

[env.staging.vars]
R2_ACCOUNT_ID = "5f20ca8a0de0a5ac52a14fa8bf9c90db"
R2_BUCKET_NAME = "tonk-spaces-staging"
ACCOUNT_SERVICE_URL = "https://accounts-staging.tonk.xyz"
REVOCATION_RELAY_URL = "https://accounts-staging.tonk.xyz/revocations"
EMAIL_FROM = "tonk <accounts@tonk.xyz>"

# Preview. Every pull request uploads a version of this environment under a
# `--preview-alias` and is reached at its own workers.dev URL, so the
# environment holds no route of its own. `routes = []` is load-bearing: a named
# environment inherits the top-level `routes`, and deploying it with that
# inherited entry would reassign the `tonk.network` custom domain away from
# production.
#
# Its state is disjoint from staging as well as production. A pull request
# applies its own account-service migrations and writes real objects through
# this worker's presigned URLs, and neither of those belongs in an environment
# someone else is testing against.
[env.preview]
workers_dev = true
routes = []

[[env.preview.r2_buckets]]
binding = "BUCKET"
bucket_name = "tonk-spaces-preview"

# Replaced per pull request, like the account service's preview database:
# continuous integration creates `tonk-access-control-pr-<N>` and rewrites
# both fields in a copy of this file. The checked-in id is a deliberate
# sentinel so the rewrite has an unambiguous target and a config that
# skipped it cannot name a real database.
[[env.preview.d1_databases]]
binding = "CONTROL"
database_name = "tonk-access-control-preview"
database_id = "REPLACED-PER-PULL-REQUEST"
migrations_dir = "rust/tonk-access-service/migrations"

[[env.preview.d1_databases]]
binding = "INGEST"
database_name = "tonk-access-ingest-preview"
database_id = "INGEST-REPLACED-PER-PULL-REQUEST"
migrations_dir = "rust/tonk-access-service/migrations-ingest"

# Replaced per pull request, like the control database.
[[env.preview.kv_namespaces]]
binding = "REVOCATIONS_KV"
id = "REPLACED-PER-PULL-REQUEST"

[env.preview.vars]
R2_ACCOUNT_ID = "5f20ca8a0de0a5ac52a14fa8bf9c90db"
R2_BUCKET_NAME = "tonk-spaces-preview"
EMAIL_FROM = "tonk <accounts@tonk.xyz>"
# Replaced per pull request with the account worker's own preview alias, which
# is only known once that upload returns. The checked-in values are deliberately
# unresolvable: a preview that failed to wire itself has to break visibly rather
# than quietly serve a real registry to browsers that trust `/.well-known/tonk`.
ACCOUNT_SERVICE_URL = "https://accounts-preview.invalid"
REVOCATION_RELAY_URL = "https://accounts-preview.invalid/revocations"
