name = "tonk-access-service"
main = "./result/worker/shim.mjs"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
# Use --no-link + --print-out-paths so wrangler's filesystem watcher doesn't
# see result/ as a "change" and re-trigger this build in a loop. We copy the
# nix store path into ./result/ as a writable directory for wrangler to read.
command = """
out=$(nix build --accept-flake-config --no-link --print-out-paths .#tonk-access-service) && \
rm -rf result && \
cp -rL "$out" result && \
chmod -R u+w result
"""

# R2 bucket binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tonk-spaces"

# Environment variables
[vars]
R2_ACCOUNT_ID = "5f20ca8a0de0a5ac52a14fa8bf9c90db"
R2_BUCKET_NAME = "tonk-spaces"
