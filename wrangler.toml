name = "tonk-access-service"
main = "./result/tonk-access-service/worker/shim.mjs"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

routes = [{ pattern = "hub.tonk.xyz", custom_domain = true }]

[build]
command = "nix build .#tonk-cloudflare-artifacts"

[assets]
directory = "./result/tonk-ui"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/@", "/@/*", "/ucan", "/ucan/*"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tonk-spaces"

# Read-only view of the account registry (owned and migrated by
# tonk-account-service): the presign path checks presented credentials
# against revoked devices. Never write through this binding.
[[d1_databases]]
binding = "ACCOUNTS_DB"
database_name = "tonk-accounts"
database_id = "a0c6698d-25e6-414b-8986-4fbeb1b5f992"

[vars]
R2_ACCOUNT_ID = "5f20ca8a0de0a5ac52a14fa8bf9c90db"
R2_BUCKET_NAME = "tonk-spaces"

[env.staging]
routes = [{ pattern = "staging.tonk.xyz", custom_domain = true }]

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "tonk-spaces-staging"

[[env.staging.d1_databases]]
binding = "ACCOUNTS_DB"
database_name = "tonk-accounts-staging"
database_id = "e1f11539-c01c-4c48-a27b-988609ad3fe1"

[env.staging.vars]
R2_ACCOUNT_ID = "5f20ca8a0de0a5ac52a14fa8bf9c90db"
R2_BUCKET_NAME = "tonk-spaces-staging"
