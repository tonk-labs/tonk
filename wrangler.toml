name = "tonk-access-service"
main = "./result/tonk-access-service/worker/shim.mjs"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

routes = [{ pattern = "hub.tonk.xyz", custom_domain = true }]

[build]
command = "nix build .#tonk-cloudflare-artifacts"

[assets]
directory = "./result/tonk-ui"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/.well-known/tonk", "/@", "/@/*", "/ucan", "/ucan/*"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tonk-spaces"

# Read-only view of the provider-independent immutable revocation registry.
# The account service owns publication; the presign path only lists prefixes.
[[r2_buckets]]
binding = "REVOCATIONS"
bucket_name = "tonk-revocations"

[vars]
R2_ACCOUNT_ID = "5f20ca8a0de0a5ac52a14fa8bf9c90db"
R2_BUCKET_NAME = "tonk-spaces"
ACCOUNT_SERVICE_URL = "https://accounts.tonk.xyz"
REVOCATION_RELAY_URL = "https://accounts.tonk.xyz/revocations"

[env.staging]
routes = [{ pattern = "staging.tonk.xyz", custom_domain = true }]

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "tonk-spaces-staging"

[[env.staging.r2_buckets]]
binding = "REVOCATIONS"
bucket_name = "tonk-revocations-staging"

[env.staging.vars]
R2_ACCOUNT_ID = "5f20ca8a0de0a5ac52a14fa8bf9c90db"
R2_BUCKET_NAME = "tonk-spaces-staging"
ACCOUNT_SERVICE_URL = "https://accounts-staging.tonk.xyz"
REVOCATION_RELAY_URL = "https://accounts-staging.tonk.xyz/revocations"
