tonk.assess/Probe:
  persona: keri
  corpus: ../personas/keri/artifacts
  tag: [lookup, base]
  system-prompt: ../prompts/base.md
  prompt: "What is Keri's current 'side obsession' according to her profile?"
  judge:
    tonk.assess/Judge:
      keyword:
        tonk.assess/KeywordJudge:
          keyword:
            - term: graph-based personal data
              score: 3
            - term: graph personal data
              score: 2
            - term: personal data graph
              score: 2
  source-file:
    - semantic-profile.md
