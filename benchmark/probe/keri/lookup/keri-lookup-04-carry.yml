tonk.assess/Probe:
  persona: keri
  corpus: ../personas/keri/artifacts
  tag: [lookup, carry]
  allowed-tool:
    - Bash
  system-prompt: ../prompts/carry.md
  carry-data: ../context_templates/case_2/user-profile-data.yaml
  carry-model: ../context_templates/case_2/user-profile-model.yaml
  prompt: "What punctuation does Keri specifically avoid in her writing?"
  judge:
    tonk.assess/Judge:
      keyword:
        tonk.assess/KeywordJudge:
          keyword:
            - term: em dash
              score: 3
            - term: em-dash
              score: 3
  source-file:
    - semantic-profile.md
