tonk.assess/Probe:
  persona: marcus
  corpus: ../personas/marcus/artifacts
  tag: [lookup, carry]
  allowed-tool:
    - Bash
  system-prompt: ../prompts/carry.md
  carry-data: ../context_templates/case_1/agent-orchestration-data.yaml
  carry-model: ../context_templates/case_1/agent-orchestration-model.yaml
  prompt: "What is Marcus's fix for the 'hallucinated API' failure mode?"
  judge:
    tonk.assess/Judge:
      keyword:
        tonk.assess/KeywordJudge:
          keyword:
            - term: library source
              score: 2
            - term: docs first
              score: 2
            - term: training data
              score: 1
  source-file:
    - agent-orchestration.md
