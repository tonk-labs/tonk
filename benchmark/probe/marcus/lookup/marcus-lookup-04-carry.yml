tonk.assess/Probe:
  persona: marcus
  corpus: ../personas/marcus/artifacts
  tag: [lookup, carry]
  allowed-tool:
    - Bash
  system-prompt: ../prompts/carry.md
  prompt: "What does Marcus require before anything hits production in an automated workflow?"
  judge:
    tonk.assess/Judge:
      keyword:
        tonk.assess/KeywordJudge:
          keyword:
            - term: human review gate
              score: 3
            - term: human review
              score: 2
            - term: review gate
              score: 2
  source-file:
    - agent-orchestration.md
