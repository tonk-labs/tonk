tonk.assess/Probe:
  persona: marcus
  corpus: ../personas/marcus/artifacts
  tag: [lookup, base]
  prompt: "What is Marcus's fix for the 'hallucinated API' failure mode?"
  judge:
    tonk.assess/Judge:
      keyword:
        tonk.assess/KeywordJudge:
          keyword:
            - term: library source
              score: 2
            - term: docs first
              score: 2
            - term: training data
              score: 1
  source-file:
    - agent-orchestration.md
