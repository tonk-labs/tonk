[toolchain]
# A dated beta, not stable: the Tonk kernel builds for `wasm32-wasip3`, and no
# stable toolchain yet ships a standard library for it. Beta of 2026-10-05 is
# the first that rust-overlay pins with one, as Sapling's toolchain is. Move
# back to `stable` once a stable release ships `rust-std` for `wasm32-wasip3`.
channel = "beta-2026-10-05"
components = ["rustfmt", "clippy", "rust-src", "rust-analyzer"]
targets = ["wasm32-unknown-unknown", "wasm32-wasip3"]
